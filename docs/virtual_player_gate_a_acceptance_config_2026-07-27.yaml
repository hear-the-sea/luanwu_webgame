schema_version: 13
status: gate_a_approved
last_revised_on: "2026-07-28"

scope:
  acceptance_only: true
  runtime_routing_enabled_by_this_file: false
  project_stage: development
  current_environment: test
  current_environment_class: non_production
  current_environment_is_production: false
  production_rollout_in_current_scope: false
  gate_c_schema_authorized_by_this_file: false
  gate_c_runtime_authorized_by_this_file: false
  non_production_direct_v2_after_gate_exit: true
  automatic_relaxation_allowed: false
  evaluate_each_prestige_band_independently: true
  fail_closed_on_missing_metric: true
  gate_a_environment: test
  gate_a_requires_live_player_data: false
  gate_a_requires_existing_database_access: false

evidence_stages:
  gate_a:
    required:
      - deterministic_fixture_contract_tests
      - read_only_audit_contract_tests
      - real_service_concurrency_tests_on_isolated_test_database
  gate_d1_bootstrap_activation:
    required:
      - conservative_cold_start_strength_guard_tests
      - hard_constraint_and_economy_tests
      - per_band_zero_sample_fallback_tests
      - prestige_band_growth_policy_and_bootstrap_history_tests
      - prestige_band_boundary_and_high_tier_population_tests
      - prestige_band_transition_reconcile_tests
    blocks_gate_b: false
    blocks_bootstrap_v2_activation_until_required_evidence_passes: true
    representative_sample_shortage_blocks_bootstrap_v2_activation: false
    allows_conservative_cold_start_bootstrap: true
    current_environment_percent_after_gate_exit: 100
    authorizes_production_rollout: false

  gate_d2_reference_calibrated_policy:
    required:
      - representative_anonymized_distribution_baseline
      - per_prestige_band_sample_gate
    blocks_population_creation: false
    required_for_bootstrap_v2_activation: false
    blocks_reference_calibrated_policy_activation: true
    activation_unit: policy_version_reference_snapshot_version_and_prestige_band
    per_prestige_band_activation: true
    all_bands_pass_required: false
    qualified_band_may_activate_while_other_bands_remain_cold_start: true
    failed_or_missing_band_mode: conservative_cold_start
    failed_band_does_not_disable_bootstrap_or_maintenance: true
    global_aggregate_may_not_mask_failed_band: true
    evidence_aggregation_owner: gate_d2_acceptance_workflow
    routing_state_owner: BotRuntimeRoutingState.calibration_routes
    routing_transition_owner: gameplay.services.runtime_configs
    caller_supplies_only_activation_unit: true
    persisted_activation_proof_is_derived_by_workflow: true
    bootstrap_consumer_mode: reference_calibrated
    maintenance_consumer_activation_gate: gate_e_maintenance_activation
    required_per_band:
      - representative_anonymized_distribution_baseline
      - minimum_reference_profiles
      - matching_policy_and_reference_snapshot_versions
      - all_distribution_thresholds
      - complete_metrics
    independently_activatable_bands:
      - newbie
      - junior
      - middle
      - senior
      - veteran
      - elite
      - legend
      - mythic
  gate_e_maintenance_activation:
    required:
      - disposable_database_maintenance_benchmark
      - lock_wait_and_failure_injection_results
      - prestige_band_growth_cadence_and_transition_tests
    blocks_gate_b: false
    blocks_maintenance_v2_activation: true
    readiness_pass_is_gate_exit: false
    cutover_order:
      - pass_disposable_database_readiness_evidence
      - enter_v2_cutover_mode_and_stop_v1_and_v2_development_writes
      - obtain_explicit_confirmation_for_destructive_test_data_rebuild
      - recreate_disposable_v1_data_and_enroll_retained_test_data
      - verify_runtime_eligible_v1_profiles_equal_zero
      - activate_maintenance_v2_for_all_eligible_profiles
      - exit_gate_e
    gate_exit_requires_runtime_eligible_v1_profiles: 0
    current_environment_percent_after_gate_exit: 100
    authorizes_production_rollout: false

arena_reserve:
  max_no_action_lease_age_hours: 12
  activation_gate: gate_e_maintenance_activation
  deadline_source: reserve_member_created_at
  retry_may_extend_deadline: false
  busy_result_may_extend_deadline: false
  version_change_may_extend_deadline: false
  revalidation_may_extend_deadline: false

maintenance_result_contract:
  committed_outcomes:
    - applied
    - no_action
  sequence_increment_per_committed_cycle: 1
  non_advancing_outcomes:
    - busy
    - paused
    - ineligible
  schedule_disposition_applies_to_outcomes:
    - applied
    - no_action
  triggers:
    scheduled:
      requires_due: true
      committed_schedule_disposition: advance_normal_schedule
      committed_deadline_rule: strictly_later_than_non_null_previous_deadline
    arena_acceleration:
      requires_due: false
      committed_schedule_disposition: preserve_normal_schedule
      committed_deadline_rule: exact_previous_value
    admin:
      requires_explicit_due_semantics: true
      requires_explicit_schedule_disposition: true
      committed_advance_deadline_rule: non_null_and_different_may_be_earlier_than_previous
      committed_preserve_deadline_rule: exact_previous_value
  non_committed_schedule_rules:
    busy: exact_previous_value
    paused: lifecycle_or_safety_pause_contract
    ineligible: lifecycle_contract
  outcome_payloads:
    applied:
      action_kind: required_non_empty
      reason: forbidden
    no_action:
      action_kind: forbidden
      reason: required_non_empty
    busy:
      action_kind: forbidden
      reason: required_non_empty
    paused:
      action_kind: forbidden
      reason: required_non_empty
    ineligible:
      action_kind: forbidden
      reason: required_non_empty
  no_action_reasons:
    values:
      - domain_constraint
      - strength_cap
      - band_spacing
      - band_action_cap
      - multi_band_transition
    priority:
      - domain_constraint
      - strength_cap
      - band_spacing
      - band_action_cap
      - multi_band_transition
    daily_action_or_growth_budget_reason: strength_cap
    skipped_action_reasons_semantics: all_applicable_reasons_in_priority_order
    primary_reason_semantics: first_skipped_action_reason

sampling:
  sample_limit_per_cohort: 1000
  minimum_real_profiles_for_v2_creation: 0
  minimum_real_profiles_for_reference_calibration: 30
  minimum_v1_fixture_profiles: 30
  requires_runtime_v1_population: false
  minimum_reference_profiles_per_prestige_band: 30
  preferred_reference_profiles_per_prestige_band: 100
  deterministic_sampling_required: true
  fail_on_unclassified_profiles: true

prestige_segmentation:
  band_schema_version: 2
  activation_gate: gate_d1_bootstrap_activation
  current_v1_runtime_source: data/virtual_players.yaml
  current_v1_runtime_config_changed_by_this_document: false
  activate_atomically_with_v2_bootstrap_and_strength_guards: true
  boundary_semantics: lower_inclusive_upper_exclusive
  configured_band_count: 8
  v2_bands:
    newbie: [0, 500]
    junior: [500, 2000]
    middle: [2000, 8000]
    senior: [8000, 30000]
    veteran: [30000, 60000]
    elite: [60000, 120000]
    legend: [120000, 240000]
    mythic: [240000, null]
  bands_must_be_gapless_and_non_overlapping: true
  exactly_one_open_ended_terminal_band_required: true
  high_band_activation:
    first_high_band: veteran
    inactive_without_active_real_or_explicit_demand_target_supply: 0
    activation_sources:
      - active_real_player_presence
      - explicit_map_search_demand
      - explicit_arena_demand
    lower_band_supply_counts_for_higher_band: false
    cross_band_reactivation_allowed: false
    cross_band_instant_strength_promotion_allowed: false
    prefer_new_v2_or_same_band_reactivation: true
  supply_membership:
    attackable_supply_source: current_prestige_band
    current_prestige_band_resolution_source: persisted_manor_prestige
    read_paths_may_repair_current_prestige_band: false
    in_flight_materialization_source: target_prestige_band
    in_flight_supply_may_suppress_duplicate_materialization_only: true
  transition_reconcile:
    trigger_sources:
      - committed_public_real_player_prestige_band_transition
      - committed_virtual_player_prestige_band_transition
    trigger_timing: post_commit_async_profile_sync_then_population_reconcile
    coalesced_and_idempotent: true
    one_transition_does_not_imply_one_bot: true
    reconcile_old_and_new_band: true
    virtual_profile_current_band_sync_owner: profile_store
    virtual_profile_current_band_sync_precedes_population_reconcile: true
    virtual_profile_transition_changes_target_band: false
  existing_profile_reclassification:
    source_of_truth: persisted_manor_prestige
    changes_assets_or_prestige: false
    explicit_idempotent_command_required: true
    hot_reload_may_change_band_boundaries: false

availability:
  sample_shortage_blocks_virtual_player_creation: false
  signup_trigger_source: explicit_public_real_user_registration_event
  signup_commit_trigger: post_commit_async_population_reconcile
  signup_transaction_waits_for_materialization: false
  signup_reconcile_is_coalesced_and_idempotent: true
  one_signup_does_not_imply_one_bot: true
  bot_user_creation_retriggers_signup_reconcile: false
  signup_reconcile_runs_maintenance: false
  prestige_band_transition_reconcile_runs_maintenance: false
  materialize_only_when_population_deficit_exists: true
  periodic_population_reconciliation_fallback: true
  generator_before_gate_d1_exit: v1_compatibility_only
  generator_after_gate_d1_exit_in_current_environment: v2
  v2_mode_without_sufficient_samples: conservative_cold_start
  event_trigger_requires_active_generator_strength_guard: true

strength_safety:
  active_reference_window_days: 30
  reference_scope:
    primary: same_region_same_prestige_band
    sample_tier_count_source: same_region_same_prestige_band_only
    sparse_local_sample_must_not_be_overridden_by_global: true
    when_local_sample_is_empty: discounted_global_same_prestige_band
    borrowed_global_reference_usage: composition_anchor_only
    borrowed_global_may_raise_sample_tier: false
    borrowed_global_may_raise_strength_cap: false
    versioned_starter_snapshot_scope: per_prestige_band_conservative_entry_fixture
    versioned_starter_snapshot_requires_live_player_data: false
    post_ratio_starter_snapshot_must_remain_in_target_band: true
    zero_local_sample_final_strength_cap: minimum_of_versioned_starter_snapshot_90_percent_and_discounted_global_cap
    zero_local_sample_cap_applies_to_composite_and_components: true
    final_fallback: versioned_starter_snapshot
  score:
    composite: versioned_policy_score
    strength_increasing_action: any_development_command_with_positive_composite_or_component_delta
    positive_growth_ratio_denominator_floor: 1.0
    component_hard_caps:
      - prestige
      - core_building_level
      - max_guest_level
      - guest_count
      - arena_lineup_power
      - troop_total
  sample_tiers:
    no_reference:
      minimum_profiles: 0
      maximum_profiles: 0
      target_ratio_to_versioned_starter_snapshot: 0.90
      positive_jitter_bps_max: 0
      strength_increasing_actions_per_24h_max: 0
      composite_strength_growth_ratio_per_24h_max: 0.00
    sparse:
      minimum_profiles: 1
      maximum_profiles: 4
      anchor_quantile: p50
      composite_cap_ratio_to_reference: 1.05
      component_cap_ratio_to_reference: 1.10
      positive_jitter_bps_max: 0
      strength_increasing_actions_per_24h_max: 1
      composite_strength_growth_ratio_per_24h_max: 0.03
    limited:
      minimum_profiles: 5
      maximum_profiles: 29
      allowed_anchor_quantiles:
        - p25
        - p50
      cap_reference_quantile: p75
      composite_cap_ratio_to_reference: 1.10
      component_cap_ratio_to_reference: 1.15
      positive_jitter_bps_max: 200
      strength_increasing_actions_per_24h_max: 2
      composite_strength_growth_ratio_per_24h_max: 0.05
    sufficient:
      minimum_profiles: 30
      allowed_anchor_quantiles:
        - p25
        - p50
        - p75
      cap_reference_quantile: p95
      composite_cap_ratio_to_reference: 1.15
      component_cap_ratio_to_reference: 1.20
      positive_jitter_bps_max: 500
      strength_increasing_actions_per_24h_max: 4
      composite_strength_growth_ratio_per_24h_max: 0.10
  borrowed_global_reference_discount_ratio: 0.90
  budget_window:
    duration_hours: 24
    semantics: trailing_window
    storage: bot_profile_bounded_entries
    maximum_persisted_entries: 4
    positive_growth_delta_rounding: ceil_basis_points
    prune_and_consume_under_profile_lock: true
  maintenance:
    recheck_reference_and_caps_inside_transaction: true
    at_or_above_cap_result: no_strength_growth
    lifecycle_and_mandatory_settlement_continue: true
    arena_acceleration_may_bypass_caps: false
    admin_may_bypass_caps: false
    force_asset_downgrade: false
    over_cap_profile_eligible_for_automatic_matchmaking: false

reference_snapshot_versioning:
  calibration_snapshot_catalog_source: bot_development_v2.reference_snapshot_catalog
  catalog_key: canonical_positive_integer_version_string
  catalog_entry_required_fields:
    - schema_version
    - digest
    - artifact_path
  gate_d2_evidence_catalog_path: reference_snapshot_catalog.snapshot_version.gate_d2_evidence.policy_version.prestige_band
  gate_d2_evidence_catalog_entry_required_fields:
    - schema_version
    - digest
  candidate_report_path_is_derived_from_activation_unit: true
  candidate_report_schema_version: 3
  candidate_report_digest_algorithm: sha256_canonical_json
  candidate_report_must_match_cataloged_schema_and_digest: true
  candidate_snapshot_digest_is_report_identity_only: false
  candidate_snapshot_artifact_contract_defined: true
  candidate_artifact_schema_version: 2
  candidate_metric_algorithm_version: 2
  candidate_artifact_path_is_derived_from_activation_unit: true
  candidate_artifact_required_cohorts:
    - reference_profiles
    - candidate_profiles
    - v1_profiles
    - inactive_reference_profiles
  candidate_artifact_raw_records_required: true
  candidate_metrics_recomputed_from_candidate_artifact: true
  candidate_metrics_recomputed_by_versioned_algorithm: true
  candidate_metrics_correctness_status: implementation_verified
  candidate_generator_provenance_required: true
  candidate_generator_provenance_source_bundle_bound: true
  candidate_generator_provenance_input_cohort_digests_bound: true
  candidate_generator_attestation_required: true
  candidate_generator_attestation_scheme: hmac_sha256_v1
  candidate_generator_attestation_trusted_key_source: runtime_secret_settings_only
  candidate_generator_attestation_key_may_come_from_artifact_report_or_catalog: false
  candidate_generator_attestation_default_trusted_keys: 0
  candidate_generator_attestation_payload_binds:
    - activation_unit
    - policy_checksum
    - reference_snapshot_digest
    - generator_identity_and_versions
    - root_seed_digest
    - source_bundle
    - template_catalog
    - all_raw_cohorts
  candidate_generator_attestation_future_production_scheme: separate_prelaunch_review
  candidate_report_metrics_must_equal_recomputed_metrics: true
  gate_d2_exit_requires_metric_recomputation_or_approved_equivalent_provenance: true
  artifact_path_scope: project_relative_data_path
  artifact_digest_algorithm: sha256_canonical_json
  artifact_is_loaded_only_for_an_activated_calibration_route: true
  activated_calibration_unit:
    - policy_version
    - reference_snapshot_version
    - prestige_band
  calibration_snapshot_requires_representative_anonymized_real_profiles: true
  missing_or_invalid_catalog_entry_result: conservative_cold_start
  conservative_starter_snapshot_version_source: BotPolicyRelease.payload.starter_snapshots.snapshot_version
  conservative_starter_snapshot_requires_live_player_data: false
  conservative_starter_snapshot_version_is_reference_snapshot_version: false
  policy_version_may_imply_reference_snapshot_version: false
  schema_or_runtime_authorized_by_this_file: false

prestige_band_growth:
  policy_owner: BotDevelopmentPolicy
  current_v1_runtime_growth_config_changed_by_this_document: false
  bootstrap_history_activation_gate: gate_d1_bootstrap_activation
  live_growth_activation_gate: gate_e_maintenance_activation
  effective_limit_rule: strictest_of_sample_tier_band_profile_and_domain_constraints
  direct_prestige_grant_by_maintenance_allowed: false
  profiles:
    newbie:
      bootstrap_history_age_days: [1, 14]
      preferred_strength_check_interval_hours: [4, 8]
      minimum_positive_strength_action_spacing_hours: 4
      composite_growth_bps_per_controlled_action_max: 400
    junior:
      bootstrap_history_age_days: [14, 45]
      preferred_strength_check_interval_hours: [6, 12]
      minimum_positive_strength_action_spacing_hours: 6
      composite_growth_bps_per_controlled_action_max: 300
    middle:
      bootstrap_history_age_days: [45, 120]
      preferred_strength_check_interval_hours: [8, 16]
      minimum_positive_strength_action_spacing_hours: 8
      composite_growth_bps_per_controlled_action_max: 250
    senior:
      bootstrap_history_age_days: [120, 240]
      preferred_strength_check_interval_hours: [12, 24]
      minimum_positive_strength_action_spacing_hours: 12
      composite_growth_bps_per_controlled_action_max: 200
    veteran:
      bootstrap_history_age_days: [240, 360]
      preferred_strength_check_interval_hours: [14, 24]
      minimum_positive_strength_action_spacing_hours: 14
      composite_growth_bps_per_controlled_action_max: 200
    elite:
      bootstrap_history_age_days: [360, 540]
      preferred_strength_check_interval_hours: [18, 30]
      minimum_positive_strength_action_spacing_hours: 18
      composite_growth_bps_per_controlled_action_max: 175
    legend:
      bootstrap_history_age_days: [540, 720]
      preferred_strength_check_interval_hours: [24, 36]
      minimum_positive_strength_action_spacing_hours: 24
      composite_growth_bps_per_controlled_action_max: 150
    mythic:
      bootstrap_history_age_days: [720, 1080]
      preferred_strength_check_interval_hours: [30, 48]
      minimum_positive_strength_action_spacing_hours: 30
      composite_growth_bps_per_controlled_action_max: 125
  monotonicity:
    history_age_and_spacing_must_not_decrease_for_higher_bands: true
    per_action_growth_cap_must_not_increase_for_higher_bands: true
  maintenance:
    last_strength_increase_at_required: true
    last_strength_increase_at_update_under_profile_lock: true
    arena_acceleration_may_bypass_band_spacing: false
    admin_may_bypass_band_spacing: false
    next_check_deadline: earliest_of_band_preference_mandatory_settlement_and_lifecycle_deadline
    non_strength_settlement_may_run_before_strength_spacing_elapses: true
  controlled_cross_band_action:
    configured_boundaries_crossed_per_action_max: 1
    validate_post_state_against_source_and_destination_band: true
    use_stricter_source_or_destination_limit: true
    next_spacing_uses_destination_band: true
  external_domain_prestige_change:
    combat_or_other_player_driven_result_may_be_rejected_by_bot_growth_policy: false
    record_strength_delta_and_transition_after_commit: true
    over_cap_result: freeze_controlled_strength_growth_and_exit_automatic_matchmaking
    recovery_protocol:
      durability_boundary: reconciliation_intent_persisted_in_originating_domain_transaction
      wakeup_transport: transaction_on_commit
      recovery_transport: periodic_pending_intent_scan
      intent_owner: virtual_player_core.external_reconciliation
      bot_profile_write_owner: virtual_player_core.profile_store
      idempotency_key: domain_event_kind_domain_event_id_profile_id
      processing_order: persisted_origin_commit_order_then_intent_id
      retry_is_idempotent: true
      pending_intent_excludes_profile_from_automatic_matchmaking: true
      domain_result_waits_for_reconciliation: false
      domain_result_may_be_rolled_back_by_reconciliation: false
      read_paths_may_repair_reconciliation_state: false
      activation_gate: gate_e_maintenance_activation
      schema_or_runtime_authorized_by_this_file: false
  bootstrap:
    history_projection_is_not_live_growth_action: true
    fake_per_action_history_records: false
    final_blueprint_still_obeys_strength_caps: true

distribution:
  threshold_source: BotPolicyRelease.payload.reference_calibration_thresholds
  threshold_payload_covered_by_policy_checksum: true
  policy_release_thresholds_may_be_stricter_than_gate_a_baseline: true
  threshold_relaxation_requires_acceptance_contract_revision: true
  threshold_payload_required_fields:
    - normalized_wasserstein_max
    - normalized_quantile_deviation_p10_max
    - normalized_quantile_deviation_p50_max
    - normalized_quantile_deviation_p90_max
    - js_divergence_max_bits
    - hard_constraint_violations_max
    - robust_joint_outlier_rate_max
    - robust_joint_outlier_rate_above_real_max
    - component_fingerprint_collision_rate_max
    - joint_fingerprint_collision_rate_max
    - fingerprint_collision_rate_above_v1_max
    - archetype_standardized_effect_min_absolute
    - archetype_standardized_effect_max_absolute
    - archetype_effect_direction_must_match
    - abandoned_rate_deviation_max
  continuous_normalization: real_cohort_iqr_with_1_unit_floor
  normalized_wasserstein_max: 0.25
  normalized_quantile_deviation_max:
    p10: 0.35
    p50: 0.25
    p90: 0.35
  js_divergence:
    log_base: 2
    max_bits: 0.10
  hard_constraint_violations_max: 0
  robust_joint_outlier_rate:
    absolute_max: 0.15
    max_above_real_cohort: 0.05
  fingerprint_collision_rate:
    component_absolute_max: 0.35
    joint_absolute_max: 0.15
    must_not_exceed_v1: true
  archetype_standardized_effect:
    minimum_absolute: 0.20
    maximum_absolute: 0.80
    must_match_declared_direction: true
  abandoned_rate_deviation_from_inactive_real_max: 0.10

economy:
  max_development_actions_per_cycle: 1
  unbacked_resource_creation_per_development_action_max: 0
  forced_settlement_positive_resource_delta:
    resource_keys:
      - silver
      - grain
    per_resource_capacity_ratio_per_cycle_max: 0.10
    per_resource_capacity_ratio_per_day_max: 0.50
    combined_units_per_profile_per_day_max: 2000000
    use_stricter_ratio_or_absolute_cap: true
    persistent_budget:
      window: utc_calendar_day
      stored_fields:
        - utc_date
        - silver_units
        - grain_units
        - combined_units
        - silver_capacity_snapshot
        - grain_capacity_snapshot
      capacity_snapshot_timing: first_positive_forced_settlement_in_utc_day
      lazy_reset_under_profile_lock: true
      decision_owner: virtual_player_core.economy
      persistence_owner: virtual_player_core.profile_store
      resource_delta_owner: gameplay.services.resources
      reserve_and_apply_in_same_transaction: true
      rollback_releases_budget: true
      read_paths_may_reset_budget: false
      activation_gate: gate_e_maintenance_activation
      schema_or_runtime_authorized_by_this_file: false
  rare_item_global_daily_cap: 8
  powerful_item_global_daily_cap: 2
  salary_audit: salary_payment_only
  resource_event_salary_enabled: false
  cap_violations_max: 0

benchmark:
  warmup_runs: 5
  measured_runs: 30
  batch_sizes:
    - 1
    - 10
    - 100
  worker_concurrency:
    - 1
    - 2
  v1_comparison:
    source: deterministic_v1_fixture_on_same_disposable_database
    requires_live_player_data: false
    purpose: diagnostic_comparison_only
    may_override_frozen_absolute_thresholds: false

performance:
  bootstrap_single_profile:
    planning_duration_p95_ms: 250
    materialization_duration_p95_ms: 2000
    sql_queries_max: 80
    write_queries_max: 25
  maintenance_single_profile:
    duration_p95_ms: 750
    duration_p99_ms: 2000
    sql_queries_max: 60
    write_queries_max: 12
