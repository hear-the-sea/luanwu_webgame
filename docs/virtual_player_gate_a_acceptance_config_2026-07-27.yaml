      finalized_window_id_unique: true
      finalized_window_snapshot_immutable: true
      finalization_requires_window_end_plus_grace: true
      late_event_after_finalization_result: hard_constraint_violation_and_pause
      required_heartbeat_streams:
        - maintenance_attempt_emitter
        - h01_callback_attempt_emitter
        - arena_shortage_emitter
        - safety_aggregator
        - safety_monitor
      heartbeat_interval_seconds: 60
      heartbeat_max_gap_seconds: 120
      raw_event_retention_days: 35
      closed_window_retention_days: 90
      core_task_monitoring_may_supply_safety_truth: false
      in_process_fallback_allowed: false
      activation_without_healthy_provider_allowed: false
      business_transaction_rolls_back_on_metric_failure: false
      v2_development_write_preflight:
        owner: every_v2_development_write_entrypoint
        source: persisted_provider_and_safety_monitor_heartbeat
        required_before_business_transaction: true
        stale_or_unreadable_result: pause_without_waiting_for_routing_cas
        in_process_cache_may_authorize_write: false
      event_and_window_locking:
        event_writer_locks_open_hourly_and_daily_window_rows: true
        finalizer_uses_the_same_window_row_locks: true
        canonical_lock_order: window_end_then_window_kind
        event_insert_after_window_finalized_allowed: false
        finalization_and_late_event_race_is_serialized: true
      cleanup:
        raw_event_requires_hourly_and_daily_windows_finalized: true
        raw_event_requires_hourly_and_daily_decision_cursors_past_window: true
        raw_event_retention_days: 35
        closed_window_requires_decision_cursor_past_window: true
        closed_window_retention_days: 90
        last_pause_window_id_referenced_window_may_be_deleted: false
      current_implementation_status: implemented_readiness_verified_not_activated
    maintenance_failure_rate:
      event_namespace: virtual_player_maintenance_attempt
      event_id_components:
        - operation_id
        - attempt_ordinal
        - terminal_event
      domain_maintenance_result_contains_failed: false
      failed_is_observability_attempt_result_only: true
      started_event_persisted_before_business_execution: true
      attempt_window_owner: utc_window_containing_started_event
      terminal_attempt_results:
