    hourly_window_semantics: fixed_tumbling_closed_windows
    daily_window_semantics: fixed_tumbling_closed_windows
    late_event_grace_minutes: 5
    event_deduplication_key: event_id
    missing_required_metric_result: pause_fail_closed
    zero_denominator_with_complete_heartbeat_result: no_rate_breach
