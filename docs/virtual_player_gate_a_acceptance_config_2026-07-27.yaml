        - no_action
        - failed
        - commit_uncertain
      failed_means_business_commit_definitely_did_not_happen: true
      commit_uncertain_is_hard_violation: true
      started_without_terminal_or_commit_uncertain_at_finalize_result: duplicate_or_partial_commit
      incomplete_attempt_may_count_as_failed: false
      numerator: virtual_player_maintenance_total_result_failed
      denominator: virtual_player_maintenance_total_result_applied_no_action_or_failed
      excluded_results:
        - busy
        - paused
        - ineligible
    h01_post_commit_attempt_degraded_rate:
      delivery_semantics: non_persistent_at_most_once
      numerator: virtual_player_loot_retirement_post_commit_attempt_total_result_degraded
      denominator: virtual_player_loot_retirement_post_commit_attempt_total_all_results
      recommendation_metric: virtual_player_loot_retirement_recommendation_total
      callback_attempt_metric: virtual_player_loot_retirement_post_commit_attempt_total
      may_be_named_delivery_success_rate: false
