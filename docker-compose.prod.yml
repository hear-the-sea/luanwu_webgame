services:
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.docker}
    command:
      - sh
      - -c
      - |
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: webgame
      MYSQL_USER: webgame
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.docker}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  web:
    image: ${WEBGAME_IMAGE:-webgame:v1}
    pull_policy: never
    env_file: ${WEBGAME_ENV_FILE:-.env.docker}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      [
        "bash",
        "/app/docker/entrypoint.sh",
        "daphne",
        "-b",
        "0.0.0.0",
        "-p",
        "8000",
        "config.asgi:application",
      ]
    volumes:
      - ./runtime/media:/app/media
      - ./runtime/staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "scripts/check_web_readiness.py"]
      interval: 15s
      timeout: 12s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  worker:
    image: ${WEBGAME_IMAGE:-webgame:v1}
    pull_policy: never
    env_file: ${WEBGAME_ENV_FILE:-.env.docker}
    environment:
      DJANGO_COLLECTSTATIC: "0"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      [
        "bash",
        "/app/docker/entrypoint.sh",
        "celery",
        "-A",
        "config",
        "worker",
        "-l",
        "info",
        "-Q",
        "${CELERY_DEFAULT_QUEUE:-default}",
        "--concurrency",
        "${CELERY_DEFAULT_CONCURRENCY:-2}",
        "--prefetch-multiplier",
        "${CELERY_PREFETCH_MULTIPLIER:-1}",
        "--max-tasks-per-child",
        "${CELERY_MAX_TASKS_PER_CHILD:-500}",
      ]
    volumes:
      - ./runtime/media:/app/media
    depends_on:
      - db
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  worker_battle:
    image: ${WEBGAME_IMAGE:-webgame:v1}
    pull_policy: never
    env_file: ${WEBGAME_ENV_FILE:-.env.docker}
    environment:
      DJANGO_COLLECTSTATIC: "0"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      [
        "bash",
        "/app/docker/entrypoint.sh",
        "celery",
        "-A",
        "config",
        "worker",
        "-l",
        "info",
        "-Q",
        "${CELERY_BATTLE_QUEUE:-battle}",
        "--concurrency",
        "${CELERY_BATTLE_CONCURRENCY:-4}",
        "--prefetch-multiplier",
        "${CELERY_PREFETCH_MULTIPLIER:-1}",
        "--max-tasks-per-child",
        "${CELERY_MAX_TASKS_PER_CHILD:-500}",
      ]
    volumes:
      - ./runtime/media:/app/media
    depends_on:
      - db
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  worker_timer:
    image: ${WEBGAME_IMAGE:-webgame:v1}
    pull_policy: never
    env_file: ${WEBGAME_ENV_FILE:-.env.docker}
    environment:
      DJANGO_COLLECTSTATIC: "0"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      [
        "bash",
        "/app/docker/entrypoint.sh",
        "celery",
        "-A",
        "config",
        "worker",
        "-l",
        "info",
        "-Q",
        "${CELERY_TIMER_QUEUE:-timer}",
        "--concurrency",
        "${CELERY_TIMER_CONCURRENCY:-2}",
        "--prefetch-multiplier",
        "${CELERY_PREFETCH_MULTIPLIER:-1}",
        "--max-tasks-per-child",
        "${CELERY_MAX_TASKS_PER_CHILD:-500}",
      ]
    volumes:
      - ./runtime/media:/app/media
    depends_on:
      - db
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  worker_timer_scan:
    image: ${WEBGAME_IMAGE:-webgame:v1}
    pull_policy: never
    env_file: ${WEBGAME_ENV_FILE:-.env.docker}
    environment:
      DJANGO_COLLECTSTATIC: "0"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      [
        "bash",
        "/app/docker/entrypoint.sh",
        "celery",
        "-A",
        "config",
        "worker",
        "-l",
        "info",
        "-Q",
        "${CELERY_TIMER_SCAN_QUEUE:-timer_scan}",
        "--concurrency",
        "${CELERY_TIMER_SCAN_CONCURRENCY:-2}",
        "--prefetch-multiplier",
        "${CELERY_PREFETCH_MULTIPLIER:-1}",
        "--max-tasks-per-child",
        "${CELERY_MAX_TASKS_PER_CHILD:-500}",
      ]
    volumes:
      - ./runtime/media:/app/media
    depends_on:
      - db
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  worker_timer_maintenance:
    image: ${WEBGAME_IMAGE:-webgame:v1}
    pull_policy: never
    env_file: ${WEBGAME_ENV_FILE:-.env.docker}
    environment:
      DJANGO_COLLECTSTATIC: "0"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      [
        "bash",
        "/app/docker/entrypoint.sh",
        "celery",
        "-A",
        "config",
        "worker",
        "-l",
        "info",
        "-Q",
        "${CELERY_TIMER_MAINTENANCE_QUEUE:-timer_maintenance}",
        "--concurrency",
        "${CELERY_TIMER_MAINTENANCE_CONCURRENCY:-1}",
        "--prefetch-multiplier",
        "${CELERY_PREFETCH_MULTIPLIER:-1}",
        "--max-tasks-per-child",
        "${CELERY_MAX_TASKS_PER_CHILD:-500}",
      ]
    volumes:
      - ./runtime/media:/app/media
    depends_on:
      - db
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  beat:
    image: ${WEBGAME_IMAGE:-webgame:v1}
    pull_policy: never
    env_file: ${WEBGAME_ENV_FILE:-.env.docker}
    environment:
      DJANGO_COLLECTSTATIC: "0"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - bash
      - /app/docker/entrypoint.sh
      - celery
      - -A
      - config
      - beat
      - -l
      - info
      - --schedule
      - /var/run/celerybeat-schedule
    volumes:
      - ./runtime/celerybeat:/var/run
    depends_on:
      - db
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?set CADDY_SITE_ADDRESS in .env.docker}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./runtime/staticfiles:/srv/staticfiles:ro
      - ./runtime/media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
