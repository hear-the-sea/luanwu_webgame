name: Virtual Player Readiness

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtual-player-gate-e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate-e-readiness:
    name: gate-e-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: webgame
          MYSQL_USER: webgame
          MYSQL_PASSWORD: webgame
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd="redis-cli -a ci-test-dummy ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        command: redis-server --requirepass ci-test-dummy

    env:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_SECRET_KEY: "ci-only-not-a-real-secret-key-change-me-1234567890"
      DJANGO_TEST_USE_ENV_SERVICES: "1"
      DJANGO_DB_ENGINE: "django.db.backends.mysql"
      DJANGO_DB_NAME: "webgame"
      DJANGO_DB_USER: "root"
      DJANGO_DB_PASSWORD: "root"
      DJANGO_DB_HOST: "127.0.0.1"
      DJANGO_DB_PORT: "13306"
      REDIS_PASSWORD: "ci-test-dummy"
      REDIS_URL: "redis://127.0.0.1:16379"
      REDIS_BROKER_URL: "redis://127.0.0.1:16379/0"
      REDIS_RESULT_URL: "redis://127.0.0.1:16379/0"
      REDIS_CHANNEL_URL: "redis://127.0.0.1:16379/1"
      REDIS_CACHE_URL: "redis://127.0.0.1:16379/2"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock.txt ]; then
            pip install -r requirements.lock.txt
          fi
          pip install -r requirements-dev.txt
          pip install "mypy>=1.8" "django-stubs>=5.0" "django-stubs-ext>=5.0" "types-PyYAML"

      - name: Install service probe CLI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client redis-tools

      - name: Wait for MySQL and Redis
        run: |
          for i in {1..30}; do
            nc -z 127.0.0.1 13306 && nc -z 127.0.0.1 16379 && break
            sleep 2
          done

      - name: Prepare isolated test database
        run: |
          python manage.py migrate --noinput
          python manage.py check --deploy

      - name: Select evidence artifact date
        run: echo "VIRTUAL_PLAYER_EVIDENCE_ARTIFACT_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Record and verify Gate E readiness evidence
        run: |
          set -o pipefail
          VIRTUAL_PLAYER_EVIDENCE_ARTIFACT_DATE="${VIRTUAL_PLAYER_EVIDENCE_ARTIFACT_DATE}" \
            make gate-e-readiness-evidence GATE_E_EXPECTED_COMMIT="${GITHUB_SHA}" \
            2>&1 | tee /tmp/gate-record.log

      - name: Verify Gate E evidence contracts
        run: |
          set -o pipefail
          VIRTUAL_PLAYER_EVIDENCE_ARTIFACT_DATE="${VIRTUAL_PLAYER_EVIDENCE_ARTIFACT_DATE}" \
            make verify-gate-e-readiness-evidence GATE_E_EXPECTED_COMMIT="${GITHUB_SHA}" \
            2>&1 | tee /tmp/gate-verify.log

      - name: Upload Gate E Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-e-diagnostics-${{ github.run_id }}
          path: |
            /tmp/gate-record.log
            /tmp/gate-verify.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Gate E readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-e-readiness-${{ github.sha }}-${{ github.run_id }}
          path: |
            docs/virtual_player_gate_evidence_manifest_${{ env.VIRTUAL_PLAYER_EVIDENCE_ARTIFACT_DATE }}.yaml
            docs/virtual_player_gate_d1_evidence_${{ env.VIRTUAL_PLAYER_EVIDENCE_ARTIFACT_DATE }}.yaml
            docs/virtual_player_gate_e_readiness_evidence_${{ env.VIRTUAL_PLAYER_EVIDENCE_ARTIFACT_DATE }}.yaml
          if-no-files-found: error
          retention-days: 90
