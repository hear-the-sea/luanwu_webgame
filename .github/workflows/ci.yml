name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Node dependencies
        run: npm ci

      - name: Check Tailwind artifact drift
        run: npm run check:css

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock.txt ]; then
            pip install -r requirements.lock.txt
          fi
          pip install -r requirements-dev.txt
          # Type-checking deps (keep them small/stable for CI).
          pip install "mypy>=1.8" "django-stubs>=5.0" "django-stubs-ext>=5.0" "types-PyYAML"

      - name: Check migration drift
        env:
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
          DJANGO_SECRET_KEY: "ci-only-not-a-real-secret-key-change-me-1234567890"
          DJANGO_STRICT_INFRA_CONFIG: "0"
          DJANGO_DB_ENGINE: "django.db.backends.sqlite3"
          DJANGO_DB_NAME: ":memory:"
        run: python manage.py makemigrations --check --dry-run

      - name: Check Python formatting
        run: make format-check

      - name: Frontend Unit Tests
        run: npm run test:js

      - name: Lint (flake8)
        run: |
          python -m flake8 --jobs=1 accounts battle gameplay guests guilds trade core websocket config tests

      - name: Type check (mypy)
        env:
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
          DJANGO_SECRET_KEY: "ci-only-not-a-real-secret-key-change-me-1234567890"
          DJANGO_STRICT_INFRA_CONFIG: "0"
        run: |
          python -m mypy accounts battle common config core gameplay guests guilds tasks trade websocket

      - name: Unit Tests (pytest)
        env:
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
          DJANGO_SECRET_KEY: "ci-only-not-a-real-secret-key-change-me-1234567890"
          DJANGO_STRICT_INFRA_CONFIG: "0"
          DJANGO_SECURE_SSL_REDIRECT: "0"
        run: |
          set -o pipefail
          {
            DJANGO_DB_ENGINE=django.db.backends.mysql DJANGO_DB_NAME=ci_deploy_check REDIS_PASSWORD=ci-test-dummy python manage.py check --deploy
            python -m coverage run -m pytest -q -m "not integration and not evidence"
          } 2>&1 | tee /tmp/unit-pytest.log

      - name: Unit Coverage
        run: |
          set -o pipefail
          # Coverage target: incrementally raise from 60% → 65% → 70% → 75%
          python -m coverage report --fail-under=75 2>&1 | tee /tmp/unit-coverage.log
          python -m coverage xml -o coverage-unit.xml

      - name: Upload Unit Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.xml

      - name: Upload Unit Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-diagnostics-${{ github.sha }}
          path: |
            /tmp/unit-pytest.log
            /tmp/unit-coverage.log
          if-no-files-found: ignore
          retention-days: 7

  # ── 集成测试门禁 ──────────────────────────────────────────────────────────
  # 以下类型的 PR 改动必须通过本 job 才能合并（hermetic 单元测试无法覆盖真实语义）：
  #
  #   - core/utils/cache_lock.py          → 分布式锁行为（locmem 是进程内锁）
  #   - gameplay/services/arena/**        → 并发状态机（依赖 select_for_update 行锁）
  #   - gameplay/models/arena.py          → DB 约束变更（MySQL 约束在 SQLite 下部分不生效）
  #   - common/utils/celery.py            → 任务调度（broker 行为需真实 Redis）
  #   - 任何含 select_for_update() 的路径  → SQLite 下 select_for_update 是 no-op
  #   - 任何含分布式锁（cache_lock）的路径  → 跨进程互斥需真实 Redis
  #
  # 本地等价命令：DJANGO_TEST_USE_ENV_SERVICES=1 make test-integration
  # ─────────────────────────────────────────────────────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_SECRET_KEY: "ci-only-not-a-real-secret-key-change-me-1234567890"
      DJANGO_STRICT_INFRA_CONFIG: "0"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_TEST_USE_ENV_SERVICES: "1"
      DJANGO_DB_ENGINE: "django.db.backends.mysql"
      DJANGO_DB_NAME: "webgame"
      DJANGO_DB_USER: "root"
      DJANGO_DB_PASSWORD: "root"
      DJANGO_DB_HOST: "127.0.0.1"
      DJANGO_DB_PORT: "3306"
      REDIS_URL: "redis://127.0.0.1:6379"
      REDIS_BROKER_URL: "redis://127.0.0.1:6379/0"
      REDIS_RESULT_URL: "redis://127.0.0.1:6379/0"
      REDIS_CHANNEL_URL: "redis://127.0.0.1:6379/1"
      REDIS_CACHE_URL: "redis://127.0.0.1:6379/2"

    services:
      mysql:
        image: mysql:8.0
        env:
          # Django prefixes the configured name with `test_`; keep the base
          # name aligned with the guarded integration database `test_webgame`.
          MYSQL_DATABASE: webgame
          MYSQL_USER: webgame
          MYSQL_PASSWORD: webgame
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock.txt ]; then
            pip install -r requirements.lock.txt
          fi
          pip install -r requirements-dev.txt

      - name: Wait for MySQL and Redis
        run: |
          for i in {1..30}; do
            nc -z 127.0.0.1 3306 && nc -z 127.0.0.1 6379 && break
            sleep 2
          done

      - name: Prepare Integration Database
        run: |
          set -o pipefail
          {
            python manage.py migrate --noinput
            REDIS_PASSWORD=ci-test-dummy python manage.py check --deploy
          } 2>&1 | tee /tmp/integration-prepare.log

      - name: Virtual Player Baseline Audit
        run: |
          set -o pipefail
          python -m pytest tests/test_virtual_player_baseline_audit.py -q 2>&1 | tee /tmp/integration-baseline.log

      - name: Integration Tests (MySQL + Redis)
        run: |
          set -o pipefail
          python -m coverage run -m pytest -m integration -q 2>&1 | tee /tmp/integration-pytest.log

      - name: Integration Coverage
        run: |
          set -o pipefail
          python -m coverage report -m 2>&1 | tee /tmp/integration-coverage.log
          python -m coverage xml -o coverage-integration.xml

      - name: Upload Integration Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics-${{ github.sha }}
          path: |
            /tmp/integration-prepare.log
            /tmp/integration-baseline.log
            /tmp/integration-pytest.log
            /tmp/integration-coverage.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Integration Coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.xml

  gate-d1:
    name: gate-d1
    if: always() && github.event_name == 'push'
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: webgame
          MYSQL_USER: webgame
          MYSQL_PASSWORD: webgame
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_SECRET_KEY: "ci-only-not-a-real-secret-key-change-me-1234567890"
      DJANGO_STRICT_INFRA_CONFIG: "0"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_TEST_USE_ENV_SERVICES: "1"
      DJANGO_DB_ENGINE: "django.db.backends.mysql"
      DJANGO_DB_NAME: "webgame"
      DJANGO_DB_USER: "root"
      DJANGO_DB_PASSWORD: "root"
      DJANGO_DB_HOST: "127.0.0.1"
      DJANGO_DB_PORT: "3306"
      REDIS_URL: "redis://127.0.0.1:6379"
      REDIS_BROKER_URL: "redis://127.0.0.1:6379/0"
      REDIS_RESULT_URL: "redis://127.0.0.1:6379/0"
      REDIS_CHANNEL_URL: "redis://127.0.0.1:6379/1"
      REDIS_CACHE_URL: "redis://127.0.0.1:6379/2"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock.txt ]; then
            pip install -r requirements.lock.txt
          fi
          pip install -r requirements-dev.txt

      - name: Wait for MySQL and Redis
        run: |
          for i in {1..30}; do
            nc -z 127.0.0.1 3306 && nc -z 127.0.0.1 6379 && break
            sleep 2
          done

      - name: Generate commit-bound Gate D1 evidence
        run: |
          set -o pipefail
          make gate-d1-evidence \
            GATE_D1_EVIDENCE_OUTPUT="test-results/gate-d1/gate-d1-${GITHUB_SHA}.yaml" \
            GATE_D1_EXPECTED_COMMIT="${GITHUB_SHA}" 2>&1 | tee /tmp/gate-d1.log
          make verify-gate-d1-evidence \
            GATE_D1_EVIDENCE_OUTPUT="test-results/gate-d1/gate-d1-${GITHUB_SHA}.yaml" \
            GATE_D1_EXPECTED_COMMIT="${GITHUB_SHA}" 2>&1 | tee -a /tmp/gate-d1.log

      - name: Upload Gate D1 Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-d1-diagnostics-${{ github.sha }}
          path: /tmp/gate-d1.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload commit-bound Gate D1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-d1-evidence-${{ github.sha }}
          path: test-results/gate-d1/gate-d1-${{ github.sha }}.yaml
          if-no-files-found: error
          retention-days: 30

  # Gate D1 waits for integration completion but still runs on pushes when the
  # broad integration job fails, keeping its evidence and diagnostics visible.
