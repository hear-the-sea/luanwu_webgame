<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>门客形象册 · 本地预览</title>
<style>
:root{color-scheme:light;--paper:#f5f0e5;--ink:#263a32;--rule:#d3cbb9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif CJK SC","Songti SC",serif}header{padding:38px 5vw 23px;border-bottom:1px solid var(--rule)}small{letter-spacing:.15em;color:#716b5c}h1{font-size:38px;font-weight:500;margin:12px 0}p{line-height:1.6}nav{position:sticky;top:0;z-index:2;background:var(--paper);padding:15px 5vw;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}input,select,button{font:inherit;color:inherit;background:#fffdf7;border:1px solid var(--rule);padding:10px;border-radius:4px}input{flex:1;min-width:200px}button{cursor:pointer}#status{padding:15px 5vw;margin:0}main{padding:0 5vw 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px}.card{background:#fffdf7;border:1px solid var(--rule);border-top:4px solid var(--rarity);padding:0;text-align:left;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:contain;background:white;display:block}.card section{padding:14px}.card strong{font-size:19px;font-weight:500}.card small{display:block;letter-spacing:0;margin-top:7px;overflow-wrap:anywhere;font-size:11px}.badge{font-size:12px;float:right;color:var(--rarity)}#more{display:block;margin:0 auto 40px}dialog{width:min(750px,94vw);border:1px solid var(--rule);background:var(--paper);padding:24px}dialog::backdrop{background:#14231dc9}dialog img{width:min(100%,448px);display:block;margin:auto;background:white}dialog h2{font-weight:500}dialog p{max-height:180px;overflow:auto}#close{float:right}a{color:inherit}@media(max-width:500px){main{grid-template-columns:repeat(2,1fr);gap:12px}.card section{padding:10px}h1{font-size:30px}}@media(prefers-reduced-motion:no-preference){.card:hover img{transform:scale(1.025);transition:transform .2s}}
</style>
<header><small>人物图录 / LOCAL PREVIEW</small><h1>门客形象册</h1><p>检查最新门客与形象的搭配。点击图片查看大图和人物简介。</p></header>
<nav aria-label="筛选门客"><input id="search" type="search" placeholder="搜索姓名、文件名或人物简介" aria-label="搜索"><select id="rarity" aria-label="稀有度"><option value="">全部稀有度</option></select><select id="family" aria-label="形象来源"><option value="">全部形象</option><option value="monkey">猴形象</option><option value="pig">猪形象</option><option value="duck">鸭形象</option><option value="missing">未配置 / 图片缺失</option></select></nav>
<p id="status" role="status">正在加载门客形象…</p><main id="cards"></main><button id="more" hidden>继续显示</button>
<dialog id="detail"><button id="close" aria-label="关闭详情">关闭</button><h2 id="name"></h2><img id="large" alt=""><p id="bio"></p><small id="file"></small></dialog>
<script>
const labels={gray:'灰色',green:'绿色',blue:'蓝色',purple:'紫色',orange:'橙色',red:'红色',black:'黑色'},colors={gray:'#777',green:'#488059',blue:'#3b77a6',purple:'#8960a0',orange:'#c48624',red:'#b54a42',black:'#303534'};
const $=id=>document.getElementById(id);let all=[],filtered=[],shown=0;const imageVersion=Date.now();const imageUrl=g=>'images/'+g.avatar.split('/').map(encodeURIComponent).join('/')+'?v='+imageVersion;
function showDetail(g){$('name').textContent=g.name+' · '+(labels[g.rarity]||g.rarity);$('bio').textContent=g.flavor||'暂无人物简介';$('file').textContent=(g.avatar||'未配置头像')+' / '+g.key;$('large').hidden=!g.available;if(g.available){$('large').src=imageUrl(g);$('large').alt=g.name}$('detail').showModal()}
function append(){const end=Math.min(shown+80,filtered.length),frag=document.createDocumentFragment();for(const g of filtered.slice(shown,end)){const card=document.createElement('button');card.className='card';card.style.setProperty('--rarity',colors[g.rarity]||'#777');card.setAttribute('aria-label','查看'+g.name+'形象');if(g.available){const img=document.createElement('img');img.src=imageUrl(g);img.alt=g.name;img.loading='lazy';card.append(img)}const section=document.createElement('section'),name=document.createElement('strong'),badge=document.createElement('span'),file=document.createElement('small');name.textContent=g.name;badge.textContent=labels[g.rarity]||g.rarity;badge.className='badge';file.textContent=g.avatar||'未配置头像';section.append(badge,name,file);card.append(section);card.onclick=()=>showDetail(g);frag.append(card)}$('cards').append(frag);shown=end;$('more').hidden=shown>=filtered.length}
function filter(){const q=$('search').value.trim().toLowerCase(),r=$('rarity').value,f=$('family').value;filtered=all.filter(g=>(!r||g.rarity===r)&&(!q||[g.name,g.key,g.avatar,g.flavor].join(' ').toLowerCase().includes(q))&&(!f||(f==='missing'?!g.available:g.avatar.startsWith(f))));shown=0;$('cards').replaceChildren();$('status').textContent='共 '+all.length+' 位门客 · 当前匹配 '+filtered.length+' 位 · 点击形象查看详情';append()}
$('search').addEventListener('input',filter);$('rarity').addEventListener('change',filter);$('family').addEventListener('change',filter);$('more').onclick=append;$('close').onclick=()=>$('detail').close();$('detail').addEventListener('click',e=>{if(e.target===$('detail'))$('detail').close()});
$('search').value=new URLSearchParams(window.location.search).get('q')||'';
fetch('catalog.json').then(r=>{if(!r.ok)throw Error('加载失败');return r.json()}).then(data=>{all=data.guests;for(const [value,label]of Object.entries(labels)){if(all.some(g=>g.rarity===value)){const o=document.createElement('option');o.value=value;o.textContent=label;$('rarity').append(o)}}filter()}).catch(()=>{$('status').textContent='加载失败，请刷新页面重试。'});
</script></html>
