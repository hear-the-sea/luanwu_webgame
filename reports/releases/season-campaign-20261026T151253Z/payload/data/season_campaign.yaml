      '1': 70
      '2': 85
      '3': 100
      '4': 100
      '5': 100
    max_guests_by_players:
      '1': 1
      '2': 2
      '3': 3
      '4': 3
      '5': 3
  reservation:
    maximum_hours: 24
    guest_limit: 3
  weekly:
    win_points: 10
    draw_points: 5
    minimum_contested_days: 1
    goal_per_active: 100
    goal_minimum: 200
    goal_maximum: 1200
    participation_merit: 50
    personal_items:
      experience_fruit: 3
      xuan_tie_essence: 2
    team_items:
      experience_fruit: 2
      xuan_tie_essence: 1
    ranking_base_items:
      experience_fruit: 25
      xuan_tie_essence: 20
    ranking_bonus_percent:
      elite: 20
      distinguished: 10
      participant: 0
  site_effects:
