{% extends "gameplay/arena/base.html" %}

{% block arena_body %}
<section class="tw-panel">
    <div class="tw-panel-header">进行中的赛事</div>
    <div class="tw-panel-content text-sm">
        <div class="space-y-2">
            {% for row in running_tournament_card_rows %}
            {% include "gameplay/arena/partials/event_list_card.html" with row=row %}
            {% empty %}
            <p class="tw-empty-hint">暂无进行中的赛事。</p>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
