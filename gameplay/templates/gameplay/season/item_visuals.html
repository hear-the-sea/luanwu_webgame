{% load gameplay_extras %}<div class="season-item-visuals">{% for content in item.goods %}<span class="season-item-visual" title="{{ content.name }} × {{ content.quantity }}"><span class="season-item-picture rarity-{{ content.rarity }}">{% item_icon content.key content.image content.name content.icon %}<b>×{{ content.quantity }}</b></span><small>{{ content.name }}</small></span>{% endfor %}</div>
