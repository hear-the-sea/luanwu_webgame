{% if drop.key == "silver" %}
<span class="tw-pill rarity-{{ drop.rarity|default:'default' }}">{{ drop.label }}</span>
{% else %}
<button type="button" class="tw-drop-entry tw-item-cell" aria-label="{{ drop.label }}">
    <span class="tw-drop-icon rarity-{{ drop.rarity|default:'default' }}">
        {% if drop.image_url %}
            <img src="{{ drop.image_url }}" alt="{{ drop.label }}" loading="lazy" decoding="async">
        {% else %}
            <span class="tw-drop-placeholder" aria-hidden="true">{{ drop.name|slice:":1" }}</span>
        {% endif %}
    </span>
    {% if drop.count > 1 %}<span class="tw-drop-count">×{{ drop.count }}</span>{% endif %}
    <span class="tw-item-tooltip">
        <span class="tw-tooltip-header rarity-{{ drop.rarity|default:'default' }}">{{ drop.label }}</span>
        {% if drop.description %}<span class="tw-tooltip-desc">{{ drop.description }}</span>{% endif %}
    </span>
</button>
{% endif %}
