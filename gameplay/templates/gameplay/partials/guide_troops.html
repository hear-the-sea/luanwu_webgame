<p>门客再能打，也少不了护院帮忙。招募时剩下的乡民，可以录用为<strong>家丁</strong>。他们平时能干活、要吃粮，但还不能直接上阵，得先到练功场训练成护院，才能跟着门客去做任务、踢馆。</p>
<p>练兵要有对应的<strong>造兵术、家丁和装备</strong>。衣甲、兵器可以自己生产，也可以去市场买。建议先打开练功场，把材料清单看明白再去采购，免得买了一仓库杂货，回来才发现少了最要紧的那把刀。</p>
<p>养兵之前也看看粮仓，别光顾着把队伍拉起来，回头发现大家都在等饭吃。另外，标记为“门客”的任务不能带护院，出发前记得看一眼。</p>
