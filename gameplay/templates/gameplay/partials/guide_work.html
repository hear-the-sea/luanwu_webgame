<p>暂时没安排出征？让空闲门客去打个工吧。除了挣银两，还能带回<strong>打工宝箱</strong>，有机会开出资源、装备和技能书。日子嘛，就是这么一点点攒起来的。</p>
<p>初级工作需要 <strong>2 小时、10 点行动力</strong>，中级是 <strong>3 小时、20 点</strong>，高级是 <strong>4 小时、30 点</strong>。先看看等级和属性够不够，再挑合适的差事；最多可同时安排 3 名门客。</p>
<p>工作做完记得领奖，宝箱带回来也记得去仓库打开。辛苦挣来的东西，可别一直放着落灰。</p>
