<div class="tw-modal-overlay" id="salary-modal" style="display: none;">
    <div class="tw-modal-content guest-roster-modal guest-roster-modal--salary">
        <div class="tw-modal-header guest-roster-modal__header">
            <h3>支付工资</h3>
            <button type="button" class="tw-modal-close close-salary-modal">&times;</button>
        </div>
        <div class="tw-modal-body guest-roster-modal__body">
            <p class="guest-roster-modal__message">确定要支付 <strong id="salary-guest-name"></strong> 的工资吗？</p>
            <div class="guest-roster-modal__salary-card">
                <div class="guest-roster-modal__salary-label">需支付</div>
                <div class="guest-roster-modal__salary-amount" id="salary-amount"></div>
            </div>
        </div>
        <div class="tw-modal-footer guest-roster-modal__footer">
            <button type="button" class="tw-btn-secondary close-salary-modal">取消</button>
            <form method="post" id="salary-form" action="" class="guest-roster-modal__footer-form">
                {% csrf_token %}
                <button type="submit" class="tw-btn-primary" id="salary-confirm-btn">确认支付</button>
            </form>
        </div>
    </div>
</div>
