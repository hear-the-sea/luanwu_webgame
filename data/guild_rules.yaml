# 帮会系统运行时规则。
# 修改后需让各 Web/Worker 进程自行重载或重启；管理命令只刷新其所在进程。
# 常用资源键：silver=银两、grain=粮食、gold_bar=金条、red_ruby=红宝石。

# 帮会列表分页与首页展示数量。
pagination:
  # 帮会列表每页显示的帮会数量。
  guild_list_page_size: 20
  # 帮会大厅排行榜最多显示的帮会数量。
  guild_hall_display_limit: 20

# 创建帮会及提升帮会等级的费用。
creation:
  # 创建一个帮会所需资源；当前仅消耗金条。
  guild_creation_cost:
    gold_bar: 2
  # 帮会升级基础金条费用；实际费用 = 此值 × 2^(当前等级 - 1)。
  guild_upgrade_base_cost: 5

# 成员向帮会捐赠资源或护院时的贡献度规则。
contribution:
  # 每获得一次 rates 中配置的贡献度，需要完整捐赠的资源数量。
  units:
    # 每 1000 银两为一个贡献计算单位。
    silver: 1000
    # 每 2000 粮食为一个贡献计算单位。
    grain: 2000
    # 每 1 根金条为一个贡献计算单位。
    gold_bar: 1
  # 每个完整捐赠单位奖励的个人贡献度。
  rates:
    # 每 1000 银两奖励 1 点贡献度。
    silver: 1
    # 每 2000 粮食奖励 1 点贡献度。
    grain: 1
    # 每 1 根金条奖励 800 点贡献度。
    gold_bar: 800
  # 单个成员每天可捐赠的资源数量上限，按资源原始数量计。
  daily_limits:
    # 每日最多捐赠 500000 银两。
    silver: 500000
    # 每日最多捐赠 500000 粮食。
    grain: 500000
    # 每日最多捐赠 5 根金条。
    gold_bar: 5
  # 护院招募所需科技等级 -> 每捐赠 1 名该类护院获得的贡献度。
  troop_rates:
    # 无科技要求和需要 1 级招募科技的护院。
    0: 1
    1: 1
    # 需要 3 级招募科技的护院。
    3: 2
    # 需要 5 级招募科技的护院。
    5: 4
    # 需要 7 级招募科技的护院。
    7: 6
  # 单个成员每天通过捐赠护院可获得的贡献度上限。
  daily_troop_contribution_limit: 300
  # 银两、粮食的单次最小捐赠数量；完整单位规则仍由 units 约束。
  min_donation_amount: 1

# 帮会科技树配置由 guilds/technology_tree.py 提供默认节点、费用和升级曲线；
# 路线升级的额外成本按已完成路线数复利增长，每完成一条路线乘以1.2。
technology:
  # 科技物品产出时，按每件物品的兑换贡献价 C 扣除帮会资源。
  production_upkeep:
    silver_per_contribution: 60
    grain_per_contribution: 90

# 狼系解锁后由帮主或管理员统一训练，整批训练完成后存入帮会仓库。
cavalry_recruitment:
  silver_per_unit: 2000
  grain_per_unit: 8000
  contribution_per_unit: 3
  max_batch: 2000
  seconds_per_unit: 30

# 帮会仓库兑换规则。
warehouse:
  # 成员兑换 1 件对应物品所需的个人当前贡献度。
  exchange_costs:
    # 绿色装备箱。
    gear_green: 50
    # 蓝色装备箱。
    gear_blue: 200
    # 紫色装备箱。
    gear_purple: 500
    # 橙色装备箱。
    gear_orange: 2000
    # 小型经验类道具。
    exp_small: 30
    # 中型经验类道具。
    exp_medium: 100
    # 大型经验类道具。
    exp_large: 400
    # 普通资源礼包。
    resource_pack_common: 20
    # 高级资源礼包。
    resource_pack_advanced: 80
  # 单个成员每天可执行的仓库兑换次数上限。
  daily_exchange_limit: 10

# 帮会蓝图奖励按品质提供的可选蓝图物品键。
blueprint_rewards:
  choices:
    # 蓝色品质蓝图候选列表。
    blue: [blueprint_xiaoweitoukie, blueprint_xiaoweikaijia, blueprint_qinglongkui, blueprint_qinglongjia]
    # 紫色品质蓝图候选列表。
    purple: [blueprint_huxianpao, blueprint_huxianxie, blueprint_qilinkui, blueprint_qilinjia]
    # 橙色品质蓝图候选列表。
    orange: [blueprint_feiyuan, blueprint_chixiaojifeng, blueprint_mojiajiguanren]

# 帮会门客池、上阵名单和任务派遣的基础容量。
hero_pool:
  # 帮会门客池可使用的槽位数，代码上限为 2。
  slot_limit: 2
  # 未计算科技加成时，帮会已上阵名单的基础人数上限。
  battle_lineup_limit: 20
  # 未计算科技加成时，单次帮会任务的基础派遣人数上限。
  dispatch_guest_base_limit: 5
  # 门客池槽位更换冷却时间，单位为秒（1800 秒 = 30 分钟）。
  replace_cooldown_seconds: 1800

# 帮会 PVP 的保护、挑战次数、消耗和战利品规则。
pvp:
  # 帮会出征基础单程时间，单位为秒（28800 秒 = 8 小时）。
  base_travel_time_seconds: 28800
  # 新建帮会免战保护时长，单位为秒（172800 秒 = 48 小时）。
  newbie_protection_seconds: 172800
  # 防守失败后的保护时长，单位为秒（43200 秒 = 12 小时）。
  defeat_protection_seconds: 43200
  # 每个帮会每天可主动发起的 PVP 次数上限。
  max_daily_attack_count: 2
  # 每个帮会每天可被其他帮会挑战的次数上限。
  max_daily_defense_count: 3
  # 攻守双方允许的最大帮会等级差。
  max_target_level_gap: 3
  # 计算银两战利品前，为防守方保留的最低银两余额。
  silver_floor: 20000
  # 可掠夺银两的百分比，取值范围 0~100。
  silver_loot_percent: 20
  # 非粮食白名单仓库物品按该比例抽样；白名单中的粮食按该比例独立限额并填充剩余运力，取值范围 0~100。
  warehouse_loot_percent: 20
  # 主动发起一次 PVP 固定消耗的帮会银两。
  fixed_attack_cost_silver: 10000
  # PVP 胜利时允许掠夺的基础仓库物品键；帮会科技产出的兑换物品会自动加入。
  warehouse_loot_whitelist:
    # 粮食。
    - grain
    # 金条。
    - gold_bar
    # 红宝石。
    - red_ruby
