# 建筑配置文件
# 分类: resource(资源生产), storage(仓储设施), production(生产加工), personnel(人员管理), special(特殊建筑)
#
# 升级曲线：
# - upgrade_time_budget / upgrade_cost_budget：从当前起始等级升到满级的总预算；0/缺省时沿用旧指数公式。
# - time_curve / cost_curve：逐级增长系数 g，按 weight = g^step_index 分配剩余预算；总预算仍精确控制累计消耗。
# - base_upgrade_time / base_cost：每级基础底线，不再承担“把总预算硬顶出来”的职责。

categories:
  - key: resource
    name: 资源生产
    description: 产出粮食和银两的基础建筑
  - key: storage
    name: 仓储设施
    description: 存储资源和物品的建筑
  - key: production
    name: 生产加工
    description: 加工制造各类物资的建筑
  - key: personnel
    name: 人员管理
    description: 管理门客和家丁的建筑
  - key: special
    name: 特殊建筑
    description: 具有特殊功能的建筑
  - key: city_defense
    name: 城防建筑
    description: 守护庄园的防御建筑

