heroes:
  orange:
  - key: hist_xianqin_0001
    name: 嬴政
    avatar: yingzheng.png
    default_gender: male
    archetype: military
    flavor: "（前259年—前210年）秦始皇，秦朝的建立者。少年即位后逐步掌握国政，任用将相，先后灭六国，于前221年完成统一，采用皇帝称号。他推行郡县制，统一文字、货币与度量衡，将昔日列国纳入同一套行政秩序；又经营北部边防，向岭南用兵。横扫六合的雄心，也化作长城、宫殿与陵寝背后的繁重徭役，严刑峻法使百姓承受重压。他死于巡行途中，秦朝随后迅速崩解。帝国虽短，其建立的制度却深刻影响了后世，留下开创之功与强硬统治交织的一生。"
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_xianqin_0002
    name: 姬昌
    avatar: monkey/orange/姬昌.png
    default_gender: male
    archetype: civil
    flavor: "商末周族领袖，后世尊为周文王。他继承先祖基业，礼遇贤士、整顿政事，使周在西方诸侯中的声望日渐增长。曾遭商纣猜忌，被囚于羑里，获释后仍沉着经营，征伐周边势力，为周人东进积蓄力量。姜尚辅周、羑里演易的故事流传后世，让求贤与隐忍成为他最鲜明的印记。他未能亲见灭商大业，留下的国力与人才却由儿子姬发承继。与牧野战场上的决胜锋芒相比，姬昌更像深扎于土的根，以长久经营托起了周朝的王业。"
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 12
      intellect: 52
      defense: 22
      agility: 14
  - key: hist_xianqin_0003
    name: 姬发
    avatar: monkey/orange/姬发.png
    default_gender: male
    archetype: military
    flavor: "商末周初的周族君主，史称周武王，姬昌之子。他承继父亲积累的国力，得到姜尚、周公旦等人辅佐，联络诸侯，等待东征时机。牧野之战中，周军击败商纣军队，商朝覆亡，周由西方诸侯转为天下共主。灭商之后，他分封功臣与宗室，也安排商王后裔延续祭祀，为新王朝安置旧邦、笼络人心。武王在克商后不久去世，未竟之业交由后人继续。其一生最耀眼的时刻定格在牧野，而那一战的背后，是数代积累与临机决断共同铸成的开国功业。"
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 44
      intellect: 14
      defense: 26
      agility: 16
  - key: hist_xianqin_0004
    name: 姒禹
    avatar: yu.png
    default_gender: male
    archetype: civil
    flavor: "上古传说中的治水领袖，通常称为大禹，被奉为夏王朝的开创者。他接续父亲鲧未竟的事业，亲历山川，疏导水道，带领众人从洪流中夺回田地与家园。十三年奔波，三过家门而不入，留下了克己奉公、坚忍任事的故事。水患平息之后，他划分九州、安排贡赋，将散落各地的部众联结起来。禹去世后，儿子启继位，夏的传承由此展开。从披山通泽到安定四方，禹的威望来自长年劳作与担当；洪水退去之后，那串踏遍山河的足迹仍被后人铭记。"
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 16
      intellect: 48
      defense: 22
      agility: 14
  - key: hist_xianqin_0005
    name: 子履
    avatar: monkey/orange/子履.png
    default_gender: male
    archetype: civil
    flavor: "商朝开国君主，通常称商汤、成汤。他原是商族领袖，在伊尹等人辅佐下逐步壮大势力，联络诸侯，最终出兵讨伐夏桀，于鸣条之战获胜，建立商朝。开国之后，他任用贤臣，安抚民众，为新王朝稳固根基。相传他见猎人张网四面，便命撤去三面，给禽兽留下生路；遇到大旱，又亲赴桑林祈雨，愿为百姓承担灾患。网开三面与桑林祷雨的故事，使他的仁厚与开国之功一同流传。面对旧朝的衰败，他既能等待时机，也能在局势成熟时果断出兵。"
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 14
      intellect: 50
      defense: 22
      agility: 14
  - key: hist_xianqin_0006
    name: 孔丘
    avatar: kongqiu.png
    default_gender: male
    archetype: civil
    flavor: "（前551年—前479年）孔子，春秋末年鲁国思想家、教育家，儒家学说的代表人物。他曾参与鲁国政事，也带领弟子周游列国，希望在诸侯纷争中推行自己的政治主张。仕途屡经挫折，他仍坚持讲学，以仁与礼讨论人与人的关系，重视修身、为政和学习的结合。教学中讲究因材施教，不因出身限制求学者，弟子各有所长。晚年归鲁，继续授徒传道，其言行后来由弟子及后学整理为《论语》。生前未能实现的政治理想，化作绵延后世的教育传统，让这位奔走列国的先生成为万世师表。"
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 8
      intellect: 66
      defense: 16
      agility: 10
  - key: hist_xianqin_0031
    name: 白起
    avatar: monkey/orange/白起.png
    default_gender: male
    archetype: military
    flavor: "（？—前257年）战国秦国名将，封武安君。他长期为秦昭襄王领兵，在伊阙击败韩魏联军，又于鄢郢之战攻破楚国都城，使楚国失去大片西部疆土。长平之战中，他接替秦军主将，利用赵军出击之机切断退路与补给，迫使赵军投降；随后大规模杀俘，也让武安君之名带上沉重血色。他善于把握战场态势，以歼灭敌军有生力量见长，一次次改变列国之间的强弱格局。晚年因是否继续进攻赵国而与秦廷失和，被削爵迁徙，最终在杜邮被赐死。战阵上的凌厉决断，未能为他换来安稳归途。"
    growth_range:
    - 7
    - 13
    attribute_weights:
      force: 52
      intellect: 12
      defense: 22
      agility: 14
  - key: hist_xianqin_0008
    name: 孙武
    avatar: monkey/orange/孙武.png
    default_gender: male
    archetype: civil
    flavor: "春秋末年军事家，传统上被视为《孙子兵法》的作者。他以兵法进见吴王阖闾，经宫中练兵展示号令与军纪，随后参与吴国军事活动，助吴军攻楚入郢，声名传于诸侯。治军时，他重视赏罚与执行，不因亲贵而轻改军令；谋战时，又讲究知己知彼、因势制胜，将胜负放在庙算、粮道与全局中衡量。兵法十三篇凝练其用兵智慧，既论阵前进退，也重战争代价与国家安危。锋芒藏于筹算，胜机生于未战，孙武留下的谋略由此越过一时一地，成为后世将帅反复研读的兵学经典。"
    growth_range:
    - 9
    - 14
    attribute_weights:
      force: 10
      intellect: 56
      defense: 18
      agility: 16
  - key: hist_xianqin_0007
    name: 李耳
    avatar: monkey/orange/李耳.png
    default_gender: male
    archetype: civil
    flavor: "通常尊称老子，道家思想的代表人物，传统上与《道德经》相联系。他曾任周守藏室之史，见惯王朝兴衰与世事纷争，后来离周远行，在出关时应关令之请留下论说道与德的文字。传说中的青牛与紫气，为这位隐者的背影添上了出尘色彩。他重视事物变化与相反相成，主张少私寡欲、谦退守柔，从水的柔弱与包容中体察处世之道。寥寥五千言，谈天地，也谈人心；世人奔走于名利之间，他却把目光投向万物自生自长的秩序，留下深远而悠长的回响。"
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 6
      intellect: 64
      defense: 18
      agility: 12
  purple:
  - key: hist_xianqin_0022
    name: 姬寤生
    avatar: monkey/先秦与神话/姬寤生.png
    default_gender: male
    archetype: military
    flavor: （前757年—前701年）春秋小霸，敢射天子。他是郑庄公，以弱胜强，击败诸侯联军；假命伐宋，令诸侯侧目。繻葛之战中，郑军射伤周桓王肩膀，王室威严扫地。他处理叔段之乱，"不及黄泉，无相见也"，后掘地见母，成就黄泉见母的佳话。他的称霸，虽不如齐桓晋文之盛，却开启了诸侯争霸的时代。春秋首位真正意义上的霸主，郑庄公实为先驱。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 38
      intellect: 20
      defense: 24
      agility: 18
  - key: hist_xianqin_0009
    name: 孟轲
    avatar: monkey/先秦与神话/孟轲.png
    default_gender: male
    archetype: civil
    flavor: （约前372年—前289年）亚圣之名，当之无愧。他继承孔子之道，发扬光大，提出性善论，倡民为贵、社稷次之、君为轻。其浩然正气，养于胸中，至大至刚，塞于天地之间。其母三迁择邻、断机教子的故事，至今传颂。他敢于直面诸侯，言辞犀利，针砭时弊，虽不见用于当世，却影响后世两千年。孟子之道，与孔子并称孔孟之道，是儒家思想的重要组成部分，塑造了华夏民族的精神品格与道德追求。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 8
      intellect: 60
      defense: 20
      agility: 12
  - key: hist_xianqin_0010
    name: 庄周
    avatar: monkey/先秦与神话/庄周.png
    default_gender: male
    archetype: civil
    flavor: （约前369年—前286年）逍遥游世，齐物论道。他梦为蝴蝶，不知蝴蝶为我，还是我为蝴蝶；他濠梁之上观鱼之乐，与惠子辩论那亘古难解的哲学命题。他笑谈骷髅、拒绝相位，宁曳尾于涂中，也不愿困于庙堂之上。其文汪洋恣肆，想象瑰丽，是哲学也是文学，是思想也是艺术。鲲鹏展翅九万里，抟扶摇而上青天——这等境界，唯庄子能书。道家思想至庄周而臻于化境，其逍遥精神，千古传诵。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 6
      intellect: 62
      defense: 18
      agility: 14
  - key: hist_xianqin_0011
    name: 墨翟
    avatar: monkey/先秦与神话/墨翟.png
    default_gender: male
    archetype: civil
    flavor: （约前479年—前381年）兼爱非攻，摩顶放踵。他出身工匠，却创立了与儒家分庭抗礼的墨家学派。其门徒纪律严明，赴汤蹈火在所不辞，堪称先秦第一"侠义"组织。他精通工艺机关，守城之术冠绝天下；止楚攻宋一事，更显其言行合一的侠者风范。墨家思想虽在秦后式微，但其兼爱、非攻、尚贤、节用的理念，与现代价值观多有暗合。这位两千年前的侠者，至今仍令人敬仰。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 18
      intellect: 50
      defense: 20
      agility: 12
  - key: hist_xianqin_0012
    name: 荀况
    avatar: monkey/先秦与神话/荀况.png
    default_gender: male
    archetype: civil
    flavor: （约前313年—前238年）性恶论者，礼法大师。他是儒家的集大成者，却教出了韩非、李斯这两位法家巨擘。其学问博大精深，既传承孔孟之道，又广采诸子之长，开创了儒法合流的先河。他主张人性本恶，需以礼法教化；隆礼重法，则天下可治。荀子之学，既有儒家的温情脉脉，又有法家的严峻冷峭，是百家争鸣时代的最后一位大师。他的思想，深刻影响了此后两千年的中国政治制度。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 10
      intellect: 58
      defense: 20
      agility: 12
  - key: hist_xianqin_0013
    name: 商鞅
    avatar: monkey/先秦与神话/商鞅.png
    default_gender: male
    archetype: civil
    flavor: （约前395年—前338年）变法图强，虽死国强。他本是卫国公孙，却在秦国实现了惊天伟业。徙木立信、刑其师傅，以铁腕手段推行变法，将积贫积弱的秦国改造成虎狼之师。废井田、开阡陌、奖军功、行县制——这一系列改革，奠定了秦国统一天下的根基。他虽被车裂而死，但变法之策未废，秦国终成霸业。商君之法，严峻冷酷，却有效无比，为后世法家奉为圭臬。功过是非，任人评说，唯变法图强之志，令人钦佩。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 14
      intellect: 54
      defense: 20
      agility: 12
  - key: hist_xianqin_0014
    name: 韩非
    avatar: monkey/先秦与神话/韩非.png
    default_gender: male
    archetype: civil
    flavor: （约前280年—前233年）法家集大成者，《韩非子》作者。他生为韩国公子，却不见用于本国；身有口吃之疾，却以文章名震天下。其书被秦王嬴政击节叹赏，不惜发兵攻韩以得此人。法、术、势三者并用，是为帝王之学。然而这位法家巨擘，终被同门李斯所害，饮鸩而亡，未能亲见秦并六国。孤愤、说难之篇，尽显其心中郁结；而其学说，却成为秦汉帝国的统治根基，影响后世两千年。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 8
      intellect: 60
      defense: 20
      agility: 12
  - key: hist_xianqin_0015
    name: 管夷吾
    avatar: monkey/先秦与神话/管夷吾.png
    default_gender: male
    archetype: civil
    flavor: （约前723年—前645年）春秋第一相，九合诸侯功臣。他本是公子纠的谋士，与齐桓公有一箭之仇，却被鲍叔牙力荐，化敌为友，共创霸业。尊王攘夷、一匡天下，使齐国成为春秋首霸。其治国之术，涵盖政治、经济、军事、外交诸方面，堪称百家之学的先驱。管鲍之交，更是千古佳话，知己难求，莫若鲍叔牙。管仲之才，孔子亦赞之；管仲之法，后世争相效仿。这位布衣卿相，实乃华夏政治家的典范。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 12
      intellect: 56
      defense: 20
      agility: 12
  - key: hist_xianqin_0016
    name: 姬旦
    avatar: monkey/先秦与神话/姬旦.png
    default_gender: male
    archetype: civil
    flavor: （?—约前1032年）制礼作乐，辅政安邦。他是武王之弟，成王之叔，却一心辅佐幼主，绝无篡位之念。一沐三捉发，一饭三吐哺，恐失天下贤才，此等赤诚，千古难觅。他平定三监之乱，东征殷商余孽；制定周礼，奠定华夏礼乐文明之根基。孔子毕生向往周公之治，"吾不复梦见周公"之叹，道尽儒家对周公的景仰。周公之德，是为后世臣子楷模；周公之制，影响华夏三千年。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 14
      intellect: 54
      defense: 20
      agility: 12
  - key: hist_xianqin_0017
    name: 屈原
    avatar: monkey/先秦与神话/屈原.png
    default_gender: male
    archetype: civil
    flavor: （约前340年—前278年）行吟泽畔，怀沙自沉。他是楚国贵族，却因谗言被流放；他忧国忧民，却只能在汨罗江畔独自彷徨。《离骚》一篇，开创楚辞一体，香草美人的寄托，浪漫瑰丽的想象，成为中国文学史上的不朽丰碑。举世皆浊我独清，众人皆醉我独醒——这等高洁，这等孤傲，唯屈子能当。五月五日他怀沙投江，后世以龙舟竞渡、粽子祭祀来纪念这位伟大的爱国诗人。楚辞之祖，诗人之宗。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 8
      intellect: 60
      defense: 18
      agility: 14
  - key: hist_xianqin_0018
    name: 姜小白
    avatar: monkey/先秦与神话/姜小白.png
    default_gender: male
    archetype: military
    flavor: （?—前643年）春秋首霸，尊王攘夷。他是齐桓公，以管仲为相，九合诸侯、一匡天下。北伐山戎救燕、南阻楚国北进，以霸主之姿维护周室尊严。葵丘之盟，诸侯宾服，齐国威震四方。然晚年昏聩，宠信佞臣，竖刁、易牙、开方之流祸乱朝政。病死宫中，诸子争立，尸体停于床上六十七日无人收殓，蛆虫爬出门外。一代霸主，晚景凄凉，令人唏嘘。然其尊王攘夷之功，开春秋霸业之先河，功不可没。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 38
      intellect: 22
      defense: 24
      agility: 16
  - key: hist_xianqin_0019
    name: 姬重耳
    avatar: monkey/先秦与神话/姬重耳.png
    default_gender: male
    archetype: military
    flavor: （前697年—前628年）流亡十九年，复国成霸业。他是晋文公，年少遭难，辗转八国十九年，尝尽人间冷暖。城濮之战大破楚军，践土之盟成为霸主。退避三舍的典故，正是他报恩守信的明证。他任用狐偃、赵衰等贤臣，使晋国称霸中原百年。其人生经历跌宕起伏，从流亡公子到一代霸主，堪称励志典范。晋文之霸，不在武功，在于德政；不在兵强，在于人和。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 36
      intellect: 22
      defense: 24
      agility: 18
  - key: hist_xianqin_0020
    name: 芈旅
