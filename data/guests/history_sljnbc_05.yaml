heroes:
  blue:
  - key: hist_sljnbc_0238
    name: 谢道韫
    avatar: monkey/其他随机角色/文084_女.png
    default_gender: female
    archetype: civil
    flavor: （？—？）咏絮之才，林下风气。陈郡阳夏人，谢安侄女，嫁与王羲之次子王凝之。幼时冬日家中赏雪，谢安问"白雪纷纷何所似"，她应声答曰"未若柳絮因风起"，语惊四座，从此"咏絮之才"传为佳话。她博学多才，精通诗文，与丈夫王凝之志趣相投。然而王凝之迷信五斗米道，孙恩之乱时他不肯备战，只设道坛祈祷，终至城破身死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0245
    name: 公孙瓒
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: （？—199年）白马将军，易京楼中终。辽西令支人，出身名门却因庶出而不受重视，凭借自身才干崛起。他长期镇守北方边疆，与乌桓、鲜卑等游牧民族征战，以骁勇善战闻名于世。他喜爱白马，精选白马三千匹组建"白马义从"，人皆骑白马持长枪，冲锋陷阵所向披靡，塞北胡人闻风丧胆，称之为"白马将军"。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0247
    name: 廖化
    avatar: pig/武010.png
    default_gender: male
    archetype: military
    flavor: （？—264年）蜀汉将领，本名淳，字元俭，襄阳人。廖化初为关羽主簿，荆州失陷后一度归吴，后诈死携母西归刘备，任宜都太守。他随诸葛亮北伐，又历官广武都督、阴平太守，官至右车骑将军。蜀汉亡后徙往洛阳，途中病卒。民间有“蜀中无大将，廖化作先锋”之语。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0237
    name: 朱然
    avatar: pig/武054.png
    default_gender: male
    archetype: military
    flavor: （182年—249年）东吴柱石，擒关羽功臣。丹阳故鄣人，本姓施，后过继给舅父朱治为子。他与孙权自幼相识，情同手足，是孙权最信任的将领之一。吕蒙白衣渡江袭取荆州时，他率军截断关羽退路，参与擒杀关羽的最后行动。夷陵之战中他随陆逊大破刘备，功勋卓著。此后他镇守江陵数十年，成为东吴西线的定海神针。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0246
    name: 董允
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （？—246年）蜀汉忠臣，直言敢谏。南郡枝江人，掌军中郎将董和之子。他少年时便以才干闻名，与费祎齐名，时人称"董费"。刘禅继位后他任黄门侍郎，掌管宫中事务，后升任侍中，成为刘禅最亲近的顾问。他为人刚正不阿，敢于直言进谏，从不阿谀奉承。宦官黄皓企图干预朝政，他多次严厉斥责，使黄皓不敢造次。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  green:
  - key: hist_sljnbc_0201
    name: 蔡阳
    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （？—201年）又作蔡扬，东汉末曹操部将。建安六年，刘备在汝南与龚都等合兵，曹操派蔡阳前往进攻，蔡阳兵败，被刘备所杀。《三国演义》将此事改写为关羽在古城斩蔡阳，属文学增饰。其事见于《三国志·先主传》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 12
      defense: 40
      agility: 14
  - key: hist_sljnbc_0202
    name: 王双
    avatar: monkey_wu_male7.png
    default_gender: male
    archetype: military
    flavor: （？—228年）三国曹魏将领，曹真部将。太和二年诸葛亮围攻陈仓，曹真遣王双率骑兵救援；蜀军粮尽退兵时王双追击，被诸葛亮回军击败斩杀，事迹见于《三国志·诸葛亮传》。《三国演义》将其描写为手持大刀的勇将。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0203
    name: 费耀
    avatar: pig_wu_male9.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）又作费曜、费瑶，三国曹魏将领，主要活动于雍凉与汉中前线。太和四年随曹真由子午道伐蜀，因大雨道绝而退军。太和五年诸葛亮再出祁山，费曜与戴陵留守上邽，为蜀军所败。其姓名在史籍中写法不一，《三国演义》多作费耀，部分情节属小说增饰。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0204
    name: 戴陵
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）三国曹魏将领，曾任长水校尉。魏文帝曹丕时常外出射猎，戴陵直言劝谏，触怒曹丕，被判死罪后减等免死。此后他随军参与西线战事，太和五年与费曜同守上邽，为诸葛亮所破。史书对其后半生记载较少，谏猎之事见于《三国志·魏书》相关记载。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0205
    name: 胡遵
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: （？—256年）安定临泾人，三国曹魏将领，早年追随司马懿。曾参与抵御诸葛亮北伐、随军平定辽东公孙渊。嘉平四年东兴之战，他率军攻吴，浮桥为丁奉所破，士卒争渡，死伤甚众，为诸葛恪所败。后官至卫将军、车骑将军，其子胡奋、胡烈皆为西晋将领。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 8
      defense: 18
      agility: 30
  - key: hist_sljnbc_0206
    name: 柳隐
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: （约190年—269年）字休然，蜀郡成都人，蜀汉将领。少与同郡杜祯、柳伸并知名，为人好谋能断。历任牙门将、巴郡太守，后任汉中黄金围督。魏灭蜀时，钟会大军围攻，柳隐坚守不克，直至刘禅投降才奉命降魏。入晋后卒，年近八十。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0207
    name: 张绍
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）字镇国，张飞次子。兄长张苞早卒，张绍承袭西乡侯爵位，官至侍中、尚书仆射。景耀六年魏军兵临成都，他奉刘禅之命，与谯周、邓良携带玺绶出城，向邓艾请降，蜀汉由此灭亡。其后随刘禅迁往洛阳，其侄张遵则随诸葛瞻战死绵竹。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0208
    name: 黄皓
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）三国蜀汉宦官，受后主刘禅宠信。侍中陈祗死后，黄皓逐渐干预朝政，与大将军姜维政见不合，并排挤异己。魏军伐蜀时，邓艾入成都，黄皓厚赂其左右得以免死；《三国演义》则称他被司马昭处死，正史未详其结局。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0209
    name: 谯周
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （201年—270年）字允南，巴西西充国人，蜀汉学者、官员，官至光禄大夫。通经史，著《仇国论》反对姜维连年北伐，又撰《古史考》考订古史，史家陈寿年少时曾从其受学。景耀六年魏军入蜀，他力主刘禅降魏，以保全百姓；蜀亡后受封，卒于西晋。
    growth_range:
    - 3
    - 8
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0210
    name: 唐咨
    avatar: monkey_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）三国将领，利城人。黄初年间利城郡叛乱失败后，唐咨渡海投奔东吴，累迁将军。甘露二年诸葛诞在寿春起兵反司马昭，东吴派唐咨率军救援；寿春城破后他被魏军俘获，司马昭未加诛杀，仍授以军职。其余事迹史载不详。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 12
      defense: 40
      agility: 14
  - key: hist_sljnbc_0211
    name: 暨艳
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （？—224年）字子休，吴郡人，东吴选曹郎。经张温举荐执掌选举，任尚书后严格考核三署郎官，不称职者多被降黜，甚至贬为军吏，因此触怒众多。后遭人告发其任用私情、臧否不当，与选曹郎徐彪一同获罪自杀，举荐他的张温亦受牵连被废。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 54
      defense: 24
      agility: 8
  - key: hist_sljnbc_0212
    name: 司马玮
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （271年—291年）字彦度，晋武帝第五子，封楚王。八王之乱初期，贾南风借他的兵力诛杀外戚杨骏，又命他杀司马亮与卫瓘；事成后贾后随即否认诏命，以矫诏擅杀大臣的罪名将他收捕处死，年仅二十一岁，成为这场内乱中率先被牺牲的宗室之一。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0213
    name: 司马冏
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （？—302年）字景治，齐献王司马攸之子，袭封齐王。八王之乱中，他联合成都王司马颖等起兵讨伐篡位的司马伦，入洛阳辅政后专权自用，引起诸王不满，最终被长沙王司马乂击败杀死。其父司马攸是晋武帝之弟，素有威望。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0214
    name: 邢邵
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （496年—？）字子才，河间鄚人，北魏至北齐文学家、官员。少而聪慧，十岁能文，博览强记。与温子升、魏收并称“北地三才”，文章典丽，尤长于骈文辞赋，与魏收齐名而互相轻诋。历仕北魏、东魏、北齐，曾任中书令、太常卿等职，是北朝后期文坛的代表人物之一。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0215
    name: 魏收
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （507年—572年）字伯起，钜鹿下曲阳人，北魏至北齐文臣、史家，与温子升、邢邵并称“北地三才”。天保年间奉诏主编《魏书》一百三十卷，数年成书；因褒贬多徇私情、体例屡遭非议，被时人讥为“秽史”，但书中仍保存了大量北魏制度与人物史料。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0216
    name: 侯莫陈悦
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: （？—534年）北魏末年将领，出身鲜卑侯莫陈部。曾与贺拔岳共同镇守关中、讨平关陇叛乱，后受高欢拉拢，设计杀害贺拔岳。宇文泰随即起兵讨伐，侯莫陈悦兵败，部众离散，最终自杀。关中军权自此尽归宇文泰，贺拔岳旧部成为西魏政权的根基。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0217
    name: 李虎
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: （？—551年）陇西成纪人，北魏末至西魏将领。北魏末年在关中从军，后成为西魏八柱国之一，官至太尉，受赐鲜卑姓大野氏，在西魏军政体系中地位显要。他是唐高祖李渊的祖父，北周时追封唐国公，其子李昞袭爵，唐朝建立后追尊为太祖。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0218
    name: 贾充
    avatar: pig/文032.png
    default_gender: male
    archetype: civil
    flavor: （217年—282年）字公闾，平阳襄陵人，贾逵之子，曹魏至西晋大臣。甘露五年曹髦讨伐司马昭，贾充命成济刺杀曹髦，事后成济被诛以为替罪。西晋建立后历任尚书令等职，深受司马氏倚重，曾主持修订《泰始律》；其女贾南风后来成为晋惠帝皇后。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0220
    name: 钟毓
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: （？—263年）字稚叔，颍川长社人，钟繇之子、钟会之兄。曹魏大臣，曾任魏郡太守、御史中丞等职。钟会伐蜀前，他私下提醒司马昭，认为其弟善于权术、难以久任。少年时与钟会并有令名，《世说新语》载兄弟二人幼时偷饮药酒，毓拜而后饮、会饮而不拜，可见二人性情之别。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0221
    name: 卫觊
    avatar: pig/文035.png
    default_gender: male
    archetype: civil
    flavor: （？—229年）字伯儒，河东安邑人，东汉末至曹魏大臣。历仕曹操、曹丕、曹叡三朝，曾建议在关中安置流民、恢复屯田与盐铁之利，并上疏劝止明帝大兴宫室，官至尚书。他以文才与政事见称，其子卫瓘后官至司空，为西晋重臣。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0222
    name: 卢毓
    avatar: pig/文050.png
    default_gender: male
    archetype: civil
    flavor: （183年—257年）字子家，涿郡涿县人，卢植之子。十岁丧父，逢幽冀战乱饥荒，奉养寡嫂、抚养兄子，以学识品行见称。曹魏时历任吏部尚书、廷尉、司空。主持选官时，明帝曾下诏称“名如画地作饼，不可啖也”，卢毓遂主张以考课核实真才实绩，不应只凭声名取士。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0223
    name: 崔林
    avatar: pig/文032.png
    default_gender: male
    archetype: civil
    flavor: （？—244年）字德儒，清河东武城人，崔琰族弟。曹魏官员，魏文帝时出任幽州刺史，为政简朴，境内安定；后历任大鸿胪、司隶校尉，魏明帝时官至司空，以处事勤慎、不尚浮华见称。崔林少时晚成，唯从兄崔琰器重之。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0224
    name: 杜袭
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）字子绪，颍川定陵人，东汉末至曹魏官员。早年与同郡繁钦等避乱荆州，刘表待以宾礼。曾任侍中，随曹操征张鲁；曹操退出汉中后，他留任留府长史，处理关中军政事务，后又参与防御诸葛亮北伐，其行事以谨慎稳重见称。
    growth_range:
    - 3
