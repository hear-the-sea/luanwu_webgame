    flavor: （？—246年）蜀汉忠臣，直言敢谏。南郡枝江人，掌军中郎将董和之子。他少年时便以才干闻名，与费祎齐名，时人称"董费"。刘禅继位后他任黄门侍郎，掌管宫中事务，后升任侍中，成为刘禅最亲近的顾问。他为人刚正不阿，敢于直言进谏，从不阿谀奉承。宦官黄皓企图干预朝政，他多次严厉斥责，使黄皓不敢造次。
