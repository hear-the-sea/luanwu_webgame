heroes:
  blue:
  - key: hist_sljnbc_0238
    name: 谢道韫
    default_gender: female
    archetype: civil
    flavor: （？—？）咏絮之才，林下风气。陈郡阳夏人，谢安侄女，嫁与王羲之次子王凝之。幼时冬日家中赏雪，谢安问"白雪纷纷何所似"，她应声答曰"未若柳絮因风起"，语惊四座，从此"咏絮之才"传为佳话。她博学多才，精通诗文，与丈夫王凝之志趣相投。然而王凝之迷信五斗米道，孙恩之乱时他不肯备战，只设道坛祈祷，终至城破身死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0240
    name: 嵇康
    default_gender: male
    archetype: civil
    flavor: （224年—263年）竹林七贤之首，广陵散绝。谯郡铚县人，曹操曾孙女婿，身长七尺八寸，风姿特秀。他与阮籍等人并称"竹林七贤"，常聚于竹林饮酒清谈、抚琴吟诗。他精通音律，善弹古琴，《广陵散》在他手下达到巅峰。他蔑视礼法，崇尚老庄，以"越名教而任自然"为人生信条。山涛举荐他出仕司马氏，他愤然写下《与山巨源绝交书》，与之断交。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0241
    name: 顾恺之
    default_gender: male
    archetype: civil
    flavor: （约348年—409年）画圣之祖，三绝传世。晋陵无锡人，出身江南名门。他才华横溢却性情天真，时人称其"才绝、画绝、痴绝"。他擅长人物画，提出"以形写神""传神写照"的绑画理论，强调捕捉人物的精神气质，不拘泥于外形。他曾说画人物"四体妍媸本无关于妙处，传神写照正在阿堵中"，意指眼睛是传神的关键。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0245
    name: 公孙瓒
    default_gender: male
    archetype: military
    flavor: （？—199年）白马将军，易京楼中终。辽西令支人，出身名门却因庶出而不受重视，凭借自身才干崛起。他长期镇守北方边疆，与乌桓、鲜卑等游牧民族征战，以骁勇善战闻名于世。他喜爱白马，精选白马三千匹组建"白马义从"，人皆骑白马持长枪，冲锋陷阵所向披靡，塞北胡人闻风丧胆，称之为"白马将军"。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0247
    name: 廖化
    default_gender: male
    archetype: military
    flavor: （？—264年）蜀中无大将，廖化作先锋。襄阳人，本名廖淳，字元俭。他早年追随关羽镇守荆州，荆州失陷后被迫降吴。他日夜思念蜀汉，终于找到机会诈死逃归。他携老母一路西行，途中恰逢刘备东征伐吴，在秭归与刘备相会。刘备大喜，任命他为宜都太守。此后他历仕四十余年，从关羽时代一直活到蜀汉灭亡，见证了蜀汉从鼎盛到覆亡的全过程。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0237
    name: 朱然
    default_gender: male
    archetype: military
    flavor: （182年—249年）东吴柱石，擒关羽功臣。丹阳故鄣人，本姓施，后过继给舅父朱治为子。他与孙权自幼相识，情同手足，是孙权最信任的将领之一。吕蒙白衣渡江袭取荆州时，他率军截断关羽退路，参与擒杀关羽的最后行动。夷陵之战中他随陆逊大破刘备，功勋卓著。此后他镇守江陵数十年，成为东吴西线的定海神针。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0246
    name: 董允
    default_gender: male
    archetype: civil
    flavor: （？—246年）蜀汉忠臣，直言敢谏。南郡枝江人，掌军中郎将董和之子。他少年时便以才干闻名，与费祎齐名，时人称"董费"。刘禅继位后他任黄门侍郎，掌管宫中事务，后升任侍中，成为刘禅最亲近的顾问。他为人刚正不阿，敢于直言进谏，从不阿谀奉承。宦官黄皓企图干预朝政，他多次严厉斥责，使黄皓不敢造次。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  green:
  - key: hist_sljnbc_0201
    name: 蔡阳
    default_gender: male
    archetype: military
    flavor: （？—201年）曹操部将，正史只记他在汝南为刘备所杀。所谓“古城斩蔡阳”主要来自《三国演义》：关羽过五关后与张飞误会未解，借斩他证明心迹。史实里的蔡阳不见得有小说里的长篇对决，却因这一场文学风云被记住；江湖传名有时不问剑法，只问故事够不够响。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 12
      defense: 40
      agility: 14
  - key: hist_sljnbc_0202
    name: 王双
    default_gender: male
    archetype: military
    flavor: （？—228年）曹魏将领，诸葛亮第二次北伐时奉命追击蜀军，后中伏战死，正史记载甚简。《三国演义》给他添上大刀、流星锤和陈仓猛将的传奇，塑出一副横行战场的凶相。王双真正留下的，是魏蜀战线上一次短促而惨烈的交锋；小说替他加了兵器，史书只留下结局。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0203
    name: 费耀
    default_gender: male
    archetype: military
    flavor: （？—？）曹魏西线将领，曾参与曹真伐蜀及雍凉防务。关于他的生卒与结局，史料记载有歧异；可以看见的是，他长期处在蜀魏反复拉锯的前线。边将的功名常不在一场独胜，而在险地反复守住阵脚，费耀的名字便留在这条风沙线上。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0204
    name: 戴陵
    default_gender: male
    archetype: military
    flavor: （？—？）曹魏将领，长期随军活动于西线，曾参与抵御蜀汉北伐。史书没有为他留下完整传记，连若干战事的细节也难逐一坐实；但能在张郃、司马懿等将领的战事中任职，说明他是军中有经验的执行者。不是每把刀都要刻上名号，能在败后收拢队伍、再把阵列立起来，也算战场本领。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0205
    name: 胡遵
    default_gender: male
    archetype: military
    flavor: （？—256年）曹魏将领，安定胡氏出身，长期参与辽东、东线对吴的战事。胡遵随司马懿平公孙渊，后多次领兵南下，官至车骑将军；他的军功不是一阵突袭，而是多年守边、调兵与整军的积累。儿子胡威以清廉闻名，父子一武一文，倒把“将门”写出了不同路数。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 8
      defense: 18
      agility: 30
  - key: hist_sljnbc_0206
    name: 柳隐
    default_gender: male
    archetype: military
    flavor: （约190年—269年）蜀汉后期将领，姜维北伐时屡任前锋，魏灭蜀时镇守黄金围。钟会大军压境，他据险坚守，直到刘禅下诏投降才收兵；城可以失，军令仍须传到关前。柳隐收刀入鞘，不是因为怕敌，而是因为蜀汉的诏令已经到了。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0207
    name: 张绍
    default_gender: male
    archetype: civil
    flavor: （？—？）张飞之子，蜀汉文臣，官至侍中、尚书仆射。成都将陷时，他奉刘禅之命与谯周等持降表、玉玺出城，向邓艾请降；这不是个人一战的胜负，而是亡国时替朝廷把最后一道文书送出城门。张绍没有继承父亲的丈八蛇矛，却接过了另一件更沉的东西：家国覆亡时的印玺。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0208
    name: 黄皓
    default_gender: male
    archetype: civil
    flavor: （？—？）蜀汉后主近侍宦官，以逢迎取宠，后来干预政务并与姜维不和。魏军将至时，史载他曾以巫祝之言影响军情判断；但蜀汉覆亡不能只归咎一名宦官，军政积弱与朝廷决策才是更大的裂口。黄皓的危险，在于把宫门里的私语变成了外朝的风向，声音轻，误国时却很重。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0209
    name: 谯周
    default_gender: male
    archetype: civil
    flavor: （201年—270年）蜀汉学者、官员，著《仇国论》反对长期穷兵黩武。邓艾兵临成都时，他主张刘禅降魏，以保宗庙与百姓；后世有人视他为保民的清醒者，也有人责他在危局中失了死节。谯周手里没有守城的刀，只有一张劝降的舌；它救下多少人，也留下多少争议，便成了他身后最难解的案。
    growth_range:
    - 3
    - 8
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0210
    name: 唐咨
    default_gender: male
    archetype: military
    flavor: （？—？）魏、吴之间辗转的将领，利城叛乱失败后渡海投吴，后来又随吴军援助诸葛诞。寿春城破，他被魏军俘获，司马昭没有杀他，反而继续任用。唐咨身上有乱世武人的求生术：旗帜可以换，战场上的本领不能丢；只是每换一次主，旧日的名节便要多背一层。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 12
      defense: 40
      agility: 14
  - key: hist_sljnbc_0211
    name: 暨艳
    default_gender: male
    archetype: civil
    flavor: （？—224年）东吴选曹郎，曾严考官吏、黜退贪庸，触动江东豪族。孙权以用刑过重责之，他被迫自尽；暨艳的改革并非没有锋芒，却把法网收得太急，给了反对者合围的机会。吏治像磨刀，太钝无以断弊，太利也容易先割伤执刀的人。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 54
      defense: 24
      agility: 8
  - key: hist_sljnbc_0212
    name: 司马玮
    default_gender: male
    archetype: military
    flavor: （271年—291年）西晋楚王，八王之乱早期的关键人物。贾南风借其兵力诛杨骏、司马亮，事成后又以矫诏擅杀大臣之罪将他处死。司马玮手里握的是一把奉诏而出的刀，却没有看清持刀者的真正意图；宫门一夜换旗，功臣便成了弃子。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0213
    name: 司马冏
    default_gender: male
    archetype: military
    flavor: （？—302年）西晋齐王，曾联合诸王讨伐篡位的司马伦，入朝辅政后一度掌权。可他很快骄奢擅断、任人唯亲，终于成为另一位被诸王讨伐的权臣。司马冏走完了“讨逆者变成逆臣”的短路，乱世的王冠戴在头上，往往比刀还烫。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0214
    name: 邢邵
    default_gender: male
    archetype: civil
    flavor: （496年—？）北朝文士，与魏收、温子昇并称“北地三才”。邢邵长于诗赋，博闻强记，文字典丽而锋利；他与魏收既相互品评，也彼此争胜，文坛上的交锋不比军阵少几分火气。此人恃才而傲，却也确有才可恃，北朝文章的风骨因此多了一道峻峭。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0215
    name: 魏收
    default_gender: male
    archetype: civil
    flavor: （507年—572年）北齐文臣、史家，奉诏撰《魏书》。书成后因褒贬失当、为私情曲笔而被讥为“秽史”，但它仍保存了北魏大量制度与人物材料。魏收的笔一面能立传，一面也会被个人恩怨牵住；写史如执剑，落笔之前先要问自己手腕是否够正。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0216
    name: 侯莫陈悦
    default_gender: male
    archetype: military
    flavor: （？—534年）北魏末将领，曾与贺拔岳共守关中，后受高欢指使设宴杀害贺拔岳。此举激怒关中军众，宇文泰乘势而起，侯莫陈悦随即众叛亲离，兵败自尽。一个暗杀可以除掉眼前的将军，却未必能除掉人心；侯莫陈悦算赢了席间一刀，输掉了整片关陇。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0217
    name: 李虎
    default_gender: male
    archetype: military
    flavor: （？—551年）西魏八柱国之一，唐高祖李渊之祖。李虎随宇文泰征战，参与西魏军政体系的建立，凭军功位列柱国；他的个人战绩不如后世的唐帝国显眼，却为陇西李氏进入关陇权力核心铺了路。名将未必亲手开国，有时先替一个家族把门槛踏平。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0218
    name: 贾充
    default_gender: male
    archetype: civil
    flavor: （217年—282年）曹魏权臣、晋初重臣，贾逵之子。曹髦讨司马昭时，贾充在阵前督战，成济奉其意刺杀天子；他因此背负弑君之名，却在司马氏建立晋朝后继续显贵。贾充最锋利的不是刀，而是把主上的命令解释成可杀皇帝的理由；这样的功劳，越高越黑。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0220
    name: 钟毓
    default_gender: male
    archetype: civil
    flavor: （？—263年）曹魏大臣，钟繇之子、钟会之兄。少年入仕，曾以“战战惶惶，汗出如浆”应对曹丕，留下“汗流浃背”的典故；后来钟会伐蜀后显露异志，他提醒司马昭提防其弟。钟毓不像弟弟那样以奇谋出名，却懂得在宫廷里先看清风向，再决定话该说到哪一步。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0221
    name: 卫觊
    default_gender: male
    archetype: civil
    flavor: （？—229年）曹魏儒臣、典章家，卫瓘之父，历仕曹操、曹丕、曹叡三朝。关中初定时，他参与安抚流民、屯田与盐铁议策；面对曹叡营建宫殿，也多次上疏劝止。卫觊的剑藏在制度和奏章里，所争的不是一时好听，而是让兵后百姓有田可耕、朝廷有章可循。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0222
    name: 卢毓
    default_gender: male
    archetype: civil
    flavor: （183年—257年）卢植之子，曹魏选官重臣，官至司空。卢毓主持铨选时反对只凭声名取士，强调考察才干与品行，“名不足以致才”正是他的用人尺度。名士的声望可以敲开门，真正留下人的仍是把政务办好的本领；他把这道门槛立得很清。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0223
    name: 崔林
    default_gender: male
    archetype: civil
    flavor: （？—244年）清河名臣，崔琰从弟，早年不以言辞交游见长，后来却在仕途中步步见功。历任郡守时，他以勤慎治事，至曹魏建国后官至司空。崔林不是少年成名的快剑，更像一把慢慢淬成的旧刀：起初无人惊艳，出鞘后方知锋利耐用。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 20
