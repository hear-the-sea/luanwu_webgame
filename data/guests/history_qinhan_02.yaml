heroes:
  purple:
  - key: hist_qinhan_0051
    name: 赵充国
    default_gender: male
    archetype: military
    flavor: （前137年—前52年）西汉名将。长期镇守西北，善于用兵亦重视安抚，处理羌人与边疆事务时主张稳健持重。赵充国能把“用兵”当作治理的一部分：能打则打，更在意如何让战争少起。史载他在边地事务中强调屯守、经营与分化安置等思路，尽量降低大规模远征的消耗，把资源留给长期稳定。后人常以“知兵知民”概括他的风格：既熟悉军务，也不忽视边地民生。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 44
      intellect: 14
      defense: 28
      agility: 14
  - key: hist_qinhan_0052
    name: 金日磾
    default_gender: male
    archetype: civil
    flavor: （生年不详—前86年）西汉重臣，出身匈奴贵族后归汉，史书多强调其谨慎自守与忠诚可靠。金日磾能在汉廷站稳脚跟，靠的不是血缘背景，而是对规则与边界的敏感：在多疑的宫廷环境里，外来者若要自保，往往必须更克制、更守法、更少结党。武帝晚年与昭帝初年政局动荡，金日磾与霍光等人同列辅政，说明汉廷在用人上并非完全排斥"异族"，而是把忠诚与能力置于出身之上。金日磾的存在也让汉匈关系呈现另一面：除了战场对抗，边界地带与俘虏体系还会把人卷入对方制度之中，个人命运因此成为帝国互动的一条暗线。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 14
      intellect: 50
      defense: 24
      agility: 12
  blue:
  - key: hist_qinhan_0053
    name: 刘嫖
    default_gender: female
    archetype: civil
    flavor: （生年不详—前116年）西汉馆陶长公主，汉景帝之女。刘嫖与窦太后关系亲近，府中蓄养门客，常参与宫廷婚姻安排；她将女儿陈阿娇嫁给刘彻，刘彻即位后，陈阿娇成为皇后。刘嫖晚年仍以长公主身份受武帝礼遇。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 52
      defense: 22
      agility: 16
