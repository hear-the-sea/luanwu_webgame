heroes:
  orange:
  - key: hist_xianqin_0434
    name: 伏羲
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）上古圣王，华夏人文始祖。传说他与女娲是兄妹或夫妻关系，共同创造并教化人类。他观天察地，创画八卦，开创了华夏易学文化的源头。他教人结网捕鱼、驯养牲畜，使人类从渔猎走向畜牧。他制定婚姻制度，规范人伦关系。八卦是中国古代最重要的哲学符号，后来发展为《易经》，影响华夏文明数千年。伏羲被尊为"人文始祖"，与女娲并列为华夏民族的精神图腾。天水、淮阳等地至今保存着伏羲庙，每年祭祀不断。
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 14
      intellect: 56
      defense: 18
      agility: 12
  - key: hist_xianqin_0435
    name: 神农
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）上古圣王，农业与医药之神。他又称炎帝，与黄帝并称"炎黄"，是华夏民族的共同始祖。传说他遍尝百草，发明医药，曾一日遇七十毒，最后因尝断肠草而死。他发明耒耜，教民农耕，使人类从采集走向农业文明。他还开创集市贸易，促进社会发展。"神农尝百草"的故事体现了先民探索自然、造福人类的精神。他是中国传统医学的精神象征，被尊为"药王"。农业、医药、市场——神农的三大贡献奠定了华夏文明的基础。
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_xianqin_0438
    name: 帝尧
    default_gender: male
    archetype: civil
    flavor: （约前2377年—约前2259年）上古圣王，五帝之一。他名放勋，号陶唐氏，是中国古代圣王的典范。他在位时政治清明、百姓安居，史载"日出而作，日入而息，凿井而饮，耕田而食，帝力于我何有哉"。他以公心治天下，不传位给不肖之子丹朱，而是禅让给贤能的舜。"尧舜禅让"成为儒家推崇的政治理想，代表了"天下为公"的最高境界。他开创了四岳议政的会议制度，被视为民主政治的萌芽。他是中国古代政治理想的人格化象征。
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 14
      intellect: 56
      defense: 18
      agility: 12
  - key: hist_xianqin_0433
    name: 女娲
    default_gender: female
    archetype: civil
    flavor: （生卒年不详）上古女神，华夏人类的始祖母。传说她用黄土捏人，创造了人类。后来共工撞断天柱，天穹破裂，洪水泛滥。她炼五色石补天，斩断鳌足撑起四方，使天地恢复秩序。她还创造了笙簧等乐器，教化人民。她与伏羲被尊为华夏民族的始祖，是中国神话中地位最崇高的女性神祇。"女娲补天"的故事象征着女性的伟大与坚韧，体现了母性的慈爱与担当。她是中华民族母性精神的化身，受到千年祭祀与崇拜。
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 10
      intellect: 58
      defense: 18
      agility: 14
  - key: hist_xianqin_0436
    name: 轩辕
    default_gender: male
    archetype: military
    flavor: （生卒年不详）上古圣王，华夏人文初祖。他就是黄帝，因居于轩辕之丘而得名。他统一中原各部落，在涿鹿之战中击败蚩尤，在阪泉之战中战胜炎帝，成为天下共主。他时代的发明创造极其丰富：嫘祖养蚕织丝、仓颉造字、伶伦制乐律、大挠作甲子历、隶首发明算数。他被尊为"人文初祖"，中华民族自称"炎黄子孙"即源于此。河南新郑的黄帝故里、陕西黄陵的黄帝陵至今香火鼎盛，每年清明都有盛大祭祀活动。他是中华民族精神统一的最高象征。
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 40
      intellect: 22
      defense: 22
      agility: 16
  - key: hist_xianqin_0439
    name: 帝舜
    default_gender: male
    archetype: civil
    flavor: （约前2277年—约前2178年）上古圣王，五帝之一。他名重华，出身卑微，父亲瞽叟和继母弟弟多次加害于他，他却以德报怨，孝行感天动地。尧帝闻其贤名，将两个女儿娥皇、女英嫁给他，又经过多年考察，最终禅让帝位。他任用禹治水、皋陶掌法、后稷管农业、契主教化，使天下大治。他巡狩天下，死于苍梧之野，葬于九嶷山。"二十四孝"之首即是舜的故事。他以孝悌著称，以禅让传贤，是儒家理想人格的最高典范。
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 14
      intellect: 56
      defense: 18
      agility: 12
  purple:
  - key: hist_xianqin_0412
    name: 后羿
    default_gender: male
    archetype: military
    flavor: （生卒年不详）夏朝时期传奇人物，射日神话的原型。他是东夷部落有穷氏的首领，善射，箭术冠绝天下。神话传说中，他射落九日、为民除害，是英雄的象征。然而历史上的后羿却是个复杂人物：他趁夏朝内乱，驱逐夏帝太康，掌控朝政，后又废立夏君，实际控制夏朝。他沉迷于田猎，不理政事，最终被心腹寒浞所杀，身死族灭。他既是神话中的英雄，也是历史上的篡臣；既有射日的壮举，也有玩物丧志的悲剧。这种矛盾的形象，使他成为上古时期最具争议的人物之一。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 48
      intellect: 10
      defense: 24
      agility: 18
  - key: hist_xianqin_0413
    name: 嫦娥
    default_gender: female
    avatar: chang-e.png
    archetype: civil
    flavor: （生卒年不详）后羿之妻，奔月传说的主角。传说后羿从西王母处求得不死之药，嫦娥趁后羿外出时偷食仙药，身体变轻，飘然升天，飞入月宫。从此她独居广寒宫，与玉兔相伴，永世孤寂。嫦娥奔月的故事寄托了古人对月亮的遐想，也隐含着对永生与孤独的思考：长生不老固然令人向往，但失去亲人朋友、独居寒宫，又有何乐趣？这个神话故事在中国家喻户晓，中秋节的习俗也与之相关。嫦娥的形象从最初的窃药者，逐渐演变为美丽孤寂的月中仙子，成为中国文化中最著名的女性神话形象之一。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 8
      intellect: 48
      defense: 18
      agility: 26
  - key: hist_xianqin_0425
    name: 蚩尤
    default_gender: male
    archetype: military
    flavor: （生卒年不详）上古战神，九黎部落首领。他是炎黄时代最强大的部落领袖之一，据说铜头铁额、能呼风唤雨。他与黄帝争夺天下霸权，双方在涿鹿展开了惊天动地的大战。传说蚩尤作大雾困住黄帝军队，黄帝发明指南车破雾；蚩尤请来风伯雨师助阵，黄帝召唤女魃止雨。最终黄帝获胜，蚩尤战死。然而后世并未将他完全妖魔化，反而尊其为"战神"——秦始皇、汉高祖都曾祭祀蚩尤。他代表了与炎黄并立的另一支华夏先民，是中华文明多元起源的见证。
    growth_range:
    - 7
    - 12
    attribute_weights:
      force: 50
      intellect: 10
      defense: 26
      agility: 14
  - key: hist_xianqin_0424
    name: 仓颉
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）造字之圣，中国文字的传说创造者。相传他是黄帝的史官，观察鸟兽足迹和自然万象，受到启发而创造文字。他有"四目"的神异形象，象征着他比常人更能洞察事物的本质。传说他造字成功之日，天雨粟、鬼夜哭——上天降下谷子以示嘉奖，鬼怪哭泣因为从此无处藏匿。虽然文字的产生是一个漫长的集体创造过程，但仓颉作为文字发明者的象征地位已深入人心。他被尊为"字圣"，是华夏文明走向文字时代的精神象征。历代文人祭祀仓颉，感念文字传承文明的伟大功绩。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 8
      intellect: 60
      defense: 18
      agility: 14
  - key: hist_xianqin_0426
    name: 少昊
    default_gender: male
    archetype: military
    flavor: （生卒年不详）上古帝王，东夷族群的始祖。他是五帝之一，以鸟为图腾，建立了以鸟命官的独特制度：凤鸟氏掌管历法，玄鸟氏掌管春分秋分，等等。他的部落居住在东方沿海地区，创造了灿烂的东夷文化。传说他在位时天下大治，鸟兽驯服。他是东方各部族共同尊奉的祖先，齐国、莒国等东方诸侯国都自称其后裔。他的鸟图腾崇拜与中原的龙图腾并行，共同构成华夏文化的丰富内涵。曲阜的少昊陵至今犹存，是中国古代帝王陵墓中最古老的之一。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 36
      intellect: 22
      defense: 24
      agility: 18
  - key: hist_xianqin_0427
    name: 帝喾
    default_gender: male
    archetype: military
    flavor: （生卒年不详）上古帝王，五帝之一。他是商周共同的祖先——后稷和契都是他的儿子，因此周人和商人都尊他为先祖。据《史记》记载，他"生而神灵，自言其名"，刚出生就会说话。他在位时"日月所照，风雨所至，莫不从服"，天下归心。他有四位著名的妃子：姜嫄生后稷（周之祖），简狄生契（商之祖），庆都生尧，常仪生挚。通过他的后代，华夏文明的几大支脉得以形成。他是联系五帝与三代的关键人物，也是商周两大王朝共同追溯的远祖。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 34
      intellect: 24
      defense: 24
      agility: 18
  - key: hist_xianqin_0428
    name: 帝颛顼
    default_gender: male
    archetype: military
    flavor: （生卒年不详）上古帝王，五帝之一。他是黄帝的孙子，少昊的侄子，因辅佐少昊有功，继承帝位。他最著名的事迹是"绝地天通"——在此之前，巫觋之术泛滥，人人都可与天神沟通，造成政令混乱。他命重、黎二人分掌天地之事，使天神与人间相隔绝，只有专门的祭司才能通天，从此祭祀权归于君主。这一改革确立了宗教权力的等级秩序，对后世影响深远。楚国尊奉他为始祖，"帝高阳之苗裔"是楚人的骄傲。他是华夏政治文明进步的重要推动者。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 34
      intellect: 24
      defense: 24
      agility: 18
  blue:
  - key: hist_xianqin_0410
    name: 少康
    default_gender: male
    archetype: military
    flavor: （生卒年不详）夏朝中兴之主，复国英雄。他是夏帝相的遗腹子，出生时夏朝已被寒浞篡夺。他在母亲的保护下长大，从小便立志复国。他先在有虞氏做厨师，后在有虞氏的支持下积蓄力量，训练武装。时机成熟后，他率众起兵，消灭寒浞及其二子浇、豷，光复夏朝，恢复祖业。他即位后励精图治，使夏朝重新强盛，史称"少康中兴"。这是中国历史上第一次"中兴"，此后中兴成为衰落王朝复兴的专用术语。他从遗腹孤儿到中兴之主的逆袭人生，成为后世无数励志故事的原型。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 20
      defense: 24
      agility: 16
  - key: hist_xianqin_0418
    name: 伯益
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）上古贤臣，本应继承大禹之位。他是东夷部落的首领，曾协助大禹治水，功勋卓著。大禹晚年欲效仿尧舜，将帝位禅让给他。然而大禹之子启势力强大，获得众诸侯的支持，伯益最终未能继位。关于他的结局，史书记载不一：有说他主动让位于启、隐居山林，有说他与启争位失败被杀。无论如何，他的故事标志着禅让制的终结和世袭制的开始。他代表了上古"公天下"理想的终结，此后"家天下"成为主流。他还被尊为嬴姓始祖，秦国、赵国皆自称其后裔。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_xianqin_0419
    name: 皋陶
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）上古贤臣，中国古代法律的奠基者。他是舜帝时期的"大理"，即司法官，掌管刑狱。他制定了中国最早的刑法，建立了明德慎罚的司法原则。他提出"天叙有典，敕我五典五敦哉"的理念，强调刑罚应当公正合理。他在审判中据说使用一种名为"獬豸"的神兽来辨别是非，獬豸会用角顶撞有罪之人。他还辅助大禹治水，功绩显著。大禹曾欲禅位于他，可惜他先于大禹去世。他是中国古代法治思想的先驱，被后世尊为"狱神"。
    growth_range:
    - 5
    - 10
    attribute_weights:
      force: 10
      intellect: 58
      defense: 18
      agility: 14
  - key: hist_xianqin_0431
    name: 祝融
    default_gender: male
    archetype: military
    flavor: （生卒年不详）上古火神，南方之神。他是帝颛顼的后裔，以火官之职著称。传说他住在昆仑山的光明宫，专门管理人间的火种。他教人们如何保存火种、使用火，使人类的生活水平大大提高。他也是南方楚国的远祖，楚人自称"祝融之后"。后世将他神化为火神，道教尊其为"南方火德真君"。他的形象是红脸膛，骑着一只老虎。传说他曾与水神共工大战，共工怒触不周山，导致天倾西北。他是中国古代神话中最重要的神祇之一。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 16
      defense: 26
      agility: 16
  - key: hist_xianqin_0432
    name: 共工
    default_gender: male
    archetype: military
    flavor: （生卒年不详）上古水神，治水先驱。他是上古时代的部落首领，与祝融争帝失败后，怒撞不周山，导致"天柱折，地维绝"，天向西北倾斜，水向东南汇聚——这个神话解释了中国地势西高东低、江河东流的地理现象。作为水神，他曾尝试治理洪水，但采用堵塞的方法，效果不佳。后世对他的评价两极分化：有人认为他是与天帝抗争的悲剧英雄，有人认为他是祸乱天下的恶神。他的故事体现了古人对自然力量的敬畏与想象。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 14
      defense: 26
      agility: 16
  - key: hist_xianqin_0437
    name: 嫘祖
    default_gender: female
    archetype: civil
    flavor: （生卒年不详）黄帝元妃，蚕丝之母。她是西陵氏之女，嫁给黄帝为正妃。传说她发现了蚕能吐丝，并发明了养蚕缫丝、织造丝绸的技术。丝绸成为中华文明最具特色的产品，后来通过丝绸之路传播到世界各地。她教化百姓，移风易俗，被誉为"人文女祖"。她还生下了玄嚣和昌意两个儿子，是夏商周三代帝王的祖先。后世尊她为"蚕神"或"先蚕"，历代皇后都要亲自祭祀她，以示对养蚕事业的重视。她是中华女性智慧与美德的化身。
    growth_range:
    - 5
    - 10
    attribute_weights:
      force: 8
      intellect: 60
      defense: 18
      agility: 14
  - key: hist_xianqin_0444
    name: 岐伯
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）上古医官，医学始祖之一。他是黄帝时期的医官，与黄帝对话形成的《黄帝内经》是中医理论的奠基之作。《内经》以黄帝问、岐伯答的形式，系统阐述了阴阳五行、脏腑经络、病因病机、诊断治疗等中医基础理论。"岐黄之术"成为中医的代称，岐伯与黄帝并称"岐黄"。虽然《黄帝内经》成书于战国至汉代，但以岐伯为医学始祖的传统延续至今。他是中华医学精神的象征，代表了古人对生命奥秘的探索与智慧。
    growth_range:
    - 5
    - 10
    attribute_weights:
      force: 8
      intellect: 60
      defense: 18
      agility: 14
  - key: hist_xianqin_0451
    name: 宋玉
    default_gender: male
    archetype: civil
    flavor: （生卒年约前3世纪）宋玉，战国末楚国辞赋家，常被视为屈原后学。其《九辩》《风赋》《高唐赋》等作品在铺陈辞采与结构经营上更趋成熟，推动了楚辞由抒情向叙事与描写并重的方向发展。宋玉以细腻的心理刻画和场景塑造见长，既延续屈原的忧思传统，也开出汉赋的审美路径。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 54
      defense: 20
      agility: 16
  green:
  - key: hist_xianqin_0400
    name: 姬林
    default_gender: male
