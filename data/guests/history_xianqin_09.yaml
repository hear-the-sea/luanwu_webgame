heroes:
  orange:
  - key: hist_xianqin_0434
    name: 伏羲
    avatar: monkey/orange/伏羲.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）上古圣王，华夏人文始祖。传说他与女娲是兄妹或夫妻关系，共同创造并教化人类。他观天察地，创画八卦，开创了华夏易学文化的源头。他教人结网捕鱼、驯养牲畜，使人类从渔猎走向畜牧。他制定婚姻制度，规范人伦关系。八卦是中国古代最重要的哲学符号，后来发展为《易经》，影响华夏文明数千年。伏羲被尊为"人文始祖"，与女娲并列为华夏民族的精神图腾。天水、淮阳等地至今保存着伏羲庙，每年祭祀不断。
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 14
      intellect: 56
      defense: 18
      agility: 12
  - key: hist_xianqin_0435
    name: 神农
    avatar: monkey/orange/神农.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）上古圣王，农业与医药之神。他又称炎帝，与黄帝并称"炎黄"，是华夏民族的共同始祖。传说他遍尝百草，发明医药，曾一日遇七十毒，最后因尝断肠草而死。他发明耒耜，教民农耕，使人类从采集走向农业文明。他还开创集市贸易，促进社会发展。"神农尝百草"的故事体现了先民探索自然、造福人类的精神。他是中国传统医学的精神象征，被尊为"药王"。农业、医药、市场——神农的三大贡献奠定了华夏文明的基础。
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_xianqin_0438
    name: 帝尧
    avatar: yao.png
    default_gender: male
    archetype: civil
    flavor: "上古传说中的帝王，号陶唐氏。典籍中的他敬慎节俭、关心民生，命人观察天象与时令，帮助百姓安排农事。洪水肆虐之时，他听取诸臣意见，寻求治水之才；年事渐高，又不愿只凭血缘决定天下归属，转而考察舜的品行与才干，让其在实际政务中经受历练。尧舜禅让的故事由此流传，成为后世传贤任能的典范。比起显赫的宫室与武功，他更看重百姓能否安居、继承者能否任事，以一份慎重而宽厚的公心，留下圣王之名。"
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 14
      intellect: 56
      defense: 18
      agility: 12
  - key: hist_xianqin_0433
    name: 女娲
    avatar: monkey/orange/女娲.png
    default_gender: female
    archetype: civil
    flavor: （生卒年不详）上古女神，华夏人类的始祖母。传说她用黄土捏人，创造了人类。后来共工撞断天柱，天穹破裂，洪水泛滥。她炼五色石补天，斩断鳌足撑起四方，使天地恢复秩序。她还创造了笙簧等乐器，教化人民。她与伏羲被尊为华夏民族的始祖，是中国神话中地位最崇高的女性神祇。"女娲补天"的故事象征着女性的伟大与坚韧，体现了母性的慈爱与担当。她是中华民族母性精神的化身，受到千年祭祀与崇拜。
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 10
      intellect: 58
      defense: 18
      agility: 14
  - key: hist_xianqin_0436
    name: 轩辕
    avatar: monkey/orange/轩辕.png
    default_gender: male
    archetype: military
    flavor: "中国上古传说中的黄帝，号轩辕氏，被奉为人文初祖之一。他与炎帝战于阪泉，又在涿鹿迎战蚩尤，联结诸部，成为众人共同尊奉的领袖。传说在他的时代，嫘祖养蚕织丝，仓颉造字，伶伦制乐，历法与器用也逐渐完备，先民由此开辟出更有秩序的生活。从战场上的征伐到衣食住行的创造，轩辕身边汇聚着诸多文明起源的故事。后世以炎黄追认共同祖先，又在陵庙与祭典中延续这份记忆，使他的名字始终与开创、凝聚和传承相连。"
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 40
      intellect: 22
      defense: 22
      agility: 16
  - key: hist_xianqin_0439
    name: 帝舜
    avatar: shun.png
    default_gender: male
    archetype: civil
    flavor: "上古传说中的帝王，名重华。他出身平凡，虽遭家庭困厄，仍以勤劳、孝行与宽厚赢得声望，因而受到尧的考察与任用。参与治理之后，他选贤任能，安排禹治水、后稷掌农事、契主教化、皋陶掌刑法，使众人各展所长。承接尧位后，又继续举用人才，将治理天下的重任逐步交托给禹。艰难出身没有使他失去温厚，掌握权力也没有使他忘记任人以能。尧舜禹的故事代代相传，而舜始终以能自持、能容人、能识贤的形象，位列历代传颂的圣王之中。"
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 14
      intellect: 56
      defense: 18
      agility: 12
  purple:
  - key: hist_xianqin_0412
    name: 后羿
    avatar: monkey/先秦与神话/后羿.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）上古传说中的两位"羿"，后世常混为一人。一位是尧时的射日英雄，相传十日并出，他射落九日，又除去猰貐、凿齿等害，其事见于《淮南子》。另一位是夏代东夷有穷氏的首领，趁太康失政夺取夏政，史称"太康失国、后羿代夏"；他后来沉溺田猎，被寒浞所杀。两个羿形象的分合，至今仍有争议。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 48
      intellect: 10
      defense: 24
      agility: 18
  - key: hist_xianqin_0413
    name: 嫦娥
    default_gender: female
    avatar: chang-e.png
    archetype: civil
    flavor: （生卒年不详）后羿之妻，奔月传说的主角。传说后羿从西王母处求得不死之药，嫦娥趁后羿外出时偷食仙药，身体变轻，飘然升天，飞入月宫。从此她独居广寒宫，与玉兔相伴，永世孤寂。嫦娥奔月的故事寄托了古人对月亮的遐想，也隐含着对永生与孤独的思考：长生不老固然令人向往，但失去亲人朋友、独居寒宫，又有何乐趣？这个神话故事在中国家喻户晓，中秋节的习俗也与之相关。嫦娥的形象从最初的窃药者，逐渐演变为美丽孤寂的月中仙子，成为中国文化中最著名的女性神话形象之一。
    growth_range:
    - 7
    - 12
    attribute_weights:
      force: 8
      intellect: 48
      defense: 18
      agility: 26
  - key: hist_xianqin_0425
    name: 蚩尤
    avatar: monkey/先秦与神话/蚩尤.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）上古战神，九黎部落首领。他是炎黄时代最强大的部落领袖之一，据说铜头铁额、能呼风唤雨。他与黄帝争夺天下霸权，双方在涿鹿展开了惊天动地的大战。传说蚩尤作大雾困住黄帝军队，黄帝发明指南车破雾；蚩尤请来风伯雨师助阵，黄帝召唤女魃止雨。最终黄帝获胜，蚩尤战死。然而后世并未将他完全妖魔化，反而尊其为"战神"——秦始皇、汉高祖都曾祭祀蚩尤。他代表了与炎黄并立的另一支华夏先民，是中华文明多元起源的见证。
    growth_range:
    - 7
    - 12
    attribute_weights:
      force: 50
      intellect: 10
      defense: 26
      agility: 14
  - key: hist_xianqin_0424
    name: 仓颉
    avatar: monkey/先秦与神话/仓颉.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）造字之圣，中国文字的传说创造者。相传他是黄帝的史官，观察鸟兽足迹和自然万象，受到启发而创造文字。他有"四目"的神异形象，象征着他比常人更能洞察事物的本质。传说他造字成功之日，天雨粟、鬼夜哭——上天降下谷子以示嘉奖，鬼怪哭泣因为从此无处藏匿。虽然文字的产生是一个漫长的集体创造过程，但仓颉作为文字发明者的象征地位已深入人心。他被尊为"字圣"，是华夏文明走向文字时代的精神象征。历代文人祭祀仓颉，感念文字传承文明的伟大功绩。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 8
      intellect: 60
      defense: 18
      agility: 14
  - key: hist_xianqin_0426
    name: 少昊
    avatar: monkey/先秦与神话/少昊.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）上古帝王，东夷族群的始祖。他是五帝之一，以鸟为图腾，建立了以鸟命官的独特制度：凤鸟氏掌管历法，玄鸟氏掌管春分秋分，等等。他的部落居住在东方沿海地区，创造了灿烂的东夷文化。传说他在位时天下大治，鸟兽驯服。他是东方各部族共同尊奉的祖先，齐国、莒国等东方诸侯国都自称其后裔。他的鸟图腾崇拜与中原的龙图腾并行，共同构成华夏文化的丰富内涵。曲阜的少昊陵至今犹存，是中国古代帝王陵墓中最古老的之一。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 36
      intellect: 22
      defense: 24
      agility: 18
  - key: hist_xianqin_0427
    name: 帝喾
    avatar: monkey/先秦与神话/帝喾.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）上古帝王，五帝之一。他是商周共同的祖先——后稷和契都是他的儿子，因此周人和商人都尊他为先祖。据《史记》记载，他"生而神灵，自言其名"，刚出生就会说话。他在位时"日月所照，风雨所至，莫不从服"，天下归心。他有四位著名的妃子：姜嫄生后稷（周之祖），简狄生契（商之祖），庆都生尧，常仪生挚。通过他的后代，华夏文明的几大支脉得以形成。他是联系五帝与三代的关键人物，也是商周两大王朝共同追溯的远祖。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 34
      intellect: 24
      defense: 24
      agility: 18
  - key: hist_xianqin_0428
    name: 帝颛顼
    avatar: monkey/先秦与神话/帝颛顼.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）上古帝王，五帝之一。他是黄帝的孙子，少昊的侄子，因辅佐少昊有功，继承帝位。他最著名的事迹是"绝地天通"——在此之前，巫觋之术泛滥，人人都可与天神沟通，造成政令混乱。他命重、黎二人分掌天地之事，使天神与人间相隔绝，只有专门的祭司才能通天，从此祭祀权归于君主。这一改革确立了宗教权力的等级秩序，对后世影响深远。楚国尊奉他为始祖，"帝高阳之苗裔"是楚人的骄傲。他是华夏政治文明进步的重要推动者。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 34
      intellect: 24
      defense: 24
      agility: 18
  blue:
  - key: hist_xianqin_0410
    name: 少康
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）夏朝君主，夏帝相之子。寒浞夺取夏政后，少康在有仍氏、有虞氏庇护下长大，曾任有虞氏的庖正，并娶虞思之女，得到封地与部众。他以此为基础招集夏遗民，先后击败寒浞之子浇、豷，最终灭寒浞，恢复夏朝统治，史称“少康中兴”。他去世后由儿子杼继位。少康的经历长期被视为失国之后艰难复国的典型。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 20
      defense: 24
      agility: 16
  - key: hist_xianqin_0418
    name: 伯益
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）上古东夷部落首领，也称益，相传为舜、禹时重臣。他辅佐大禹治水，又曾掌管山泽、调驯鸟兽，因功受封。禹晚年曾让伯益摄行政务，禹死后，诸侯多去朝拜禹子启，伯益遂退让。关于他此后是隐居还是被启所杀，古籍说法不一。秦、赵两国王族都自称出自伯益一族，其形象兼具贤臣与部族始祖两重色彩。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_xianqin_0419
    name: 皋陶
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）上古传说中的司法之臣，舜时掌管刑狱，后世常称“皋陶”。相传他主张明德慎罚，审理案件注重证据与公正，又曾辅佐大禹治水、推行教化。舜去世后，禹一度举荐皋陶为继承人，但他先于禹而卒。后世将神兽獬豸辨别曲直的故事与皋陶相联系，并尊他为狱神，其形象成为古代司法公正的象征。
    growth_range:
    - 5
    - 10
    attribute_weights:
      force: 10
      intellect: 58
      defense: 18
      agility: 14
  - key: hist_xianqin_0431
    name: 祝融
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）上古传说中的火官，相传为颛顼之后。他掌管火政，负责祭祀与用火之事，后世将其奉为火神。古籍中又有祝融与共工相争的传说，共工失败后怒触不周山，成为女娲补天故事的前因之一。楚国王族自称“帝高阳之苗裔”，将祝融列为先祖。祝融的形象融合了官职、部族与神祇多重身份，是上古神话中影响深远的一位。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 16
      defense: 26
      agility: 16
  - key: hist_xianqin_0432
    name: 共工
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）上古传说中的水神与部落首领。相传他与祝融争斗失利后怒触不周山，使天柱倾折、洪水泛滥，女娲补天的神话即以这场灾变为背景。另有一些记载称共工曾治水，或与颛顼争夺帝位，说法彼此不一。共工的形象兼有治水者、争帝者与灾变制造者等面貌，反映了古人对洪水与天地的想象，其事迹难以作为信史看待。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 14
      defense: 26
      agility: 16
  - key: hist_xianqin_0437
    name: 嫘祖
    avatar: monkey/其他随机角色/文064_女.png
    default_gender: female
    archetype: civil
    flavor: （生卒年不详）传说中西陵氏之女，黄帝正妃，又称累祖。相传她发现蚕丝，教民养蚕、缫丝、织绸，使先民掌握了丝织技术，后世因此尊她为“先蚕”，并在祭祀中奉为蚕桑之神。她生下玄嚣、昌意，其后裔构成黄帝世系的重要支脉。嫘祖的事迹主要见于后世追述，具体年代难以考定，但她作为养蚕织丝象征的地位长期流传。
    growth_range:
    - 5
    - 10
    attribute_weights:
      force: 8
      intellect: 60
      defense: 18
      agility: 14
  - key: hist_xianqin_0444
    name: 岐伯
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）传说中的黄帝医官，后世尊为医家之祖。相传他与黄帝以问答形式讨论医学，内容涉及脏腑、经脉、病因、诊法与治疗，后世整理成《黄帝内经》的框架即依托这一对话形式。因岐伯与黄帝并称，传统医学常以“岐黄之术”代指医道。岐伯其人是否实有，学界尚有不同看法，但他作为中医理论源头的象征影响深远。
    growth_range:
    - 5
    - 10
    attribute_weights:
      force: 8
      intellect: 60
      defense: 18
      agility: 14
  - key: hist_xianqin_0451
    name: 宋玉
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （约前3世纪）战国末楚国辞赋家，相传为屈原后学。他曾在楚顷襄王朝廷任职，仕途不显，作品多写怀才不遇之感。署名宋玉的《九辩》《风赋》《高唐赋》，以铺陈细腻、辞采华美见长；《九辩》借秋景抒发身世之悲，《高唐赋》则写巫山神女，成为后世神女文学的源头。宋玉与屈原并称“屈宋”，在楚辞向汉赋转变中占有重要位置。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 54
      defense: 20
      agility: 16
  - key: hist_xianqin_0407
    name: 子受
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （？—前1046年）商王帝辛，后世称纣王，商代末代君主。传统史书称他材力过人，却刚愎自用，晚年与周人及东夷长期交战，消耗国力。前1046年，周武王联合诸侯在牧野击败商军，帝辛退入朝歌自焚，商朝灭亡。酒池肉林、炮烙之刑等细节多经后世增饰，其真实面貌仍有讨论空间。其亡国常被后世用作君主失德的鉴戒。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 44
      intellect: 14
      defense: 24
