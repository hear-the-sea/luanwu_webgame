    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉宣帝时期名臣，东海兰陵人，字仲翁，精研《春秋》，官至太子太傅。眼见父子叔侄并居高位，他深谙“知足不辱，知止不殆”之道，遂与任太子少傅的侄子疏受同日上疏乞骸骨。返乡后将皇室赐金悉数散赠乡里宗族，不留田宅以勉子孙自力，史称“二疏”。
