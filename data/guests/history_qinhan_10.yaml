    default_gender: male
    archetype: civil
    flavor: （？—前57年）西汉宣帝时期著名循吏，燕人，字长公。历任淮阳太守、颍川太守、东郡太守及左冯翊，治政崇尚礼让教化，每至一地皆延请贤士、和睦宗族，令诉讼大减、百姓感服。后因与萧望之互劾，遭构陷僭越礼制而被弃市，百姓莫不为之涕泣。
