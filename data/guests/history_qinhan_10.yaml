    default_gender: male
    archetype: civil
    flavor: （94年—147年）东汉中期名臣，汉中南郑人，字子坚，官至太尉。顺、冲、质三帝之际，外戚梁冀专擅朝政、毒杀质帝，李固不顾安危力主择立年长有德之宗室为君，并与杜乔等坚决抵制梁冀贪暴。终遭梁冀构陷下狱遇害，临死遗书明志，为士林所痛惜，世称“李杜”。
