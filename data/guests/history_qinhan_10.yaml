    default_gender: male
    archetype: civil
    flavor: （？—前62年）西汉宣帝时期名臣，河东平阳人，字子兄。他少习剑术又通晓文法，历任东海太守、右扶风，治郡恩威并济，对豪强奸猾严惩不贷，对良善百姓则温和体恤，境内夜不闭户、令行禁止。病逝于任上时家无余财，宣帝深为惋惜并特赐黄金百斤以奉祭祀。
