  - key: hist_qinhan_0609
    name: 石奋
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （前219年—前124年）西汉前期名臣，河内温县人，自年少事汉高祖，历仕文、景、武三朝。石奋为人恭谨醇厚、教子极严，其本人与四子皆官至二千石，汉景帝因赐号“万石君”。石氏一门以孝友谦让、谨守礼法闻名天下，成为汉代清流家风的楷模。
