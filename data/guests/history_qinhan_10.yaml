  - key: hist_qinhan_0610
    name: 毛苌
    avatar: monkey/其他随机角色/文039_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉中期经学家，赵国人，从毛亨受《诗》，汉武帝时为河间献王博士，世称“小毛公”，与毛亨并称“大小毛公”。他极力弘扬古文《毛诗》，博引典故阐发诗义，使《毛诗》得以在民间与学术界薪火相传，最终取代齐、鲁、韩三家诗而独行后世。
