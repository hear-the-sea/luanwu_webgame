    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉宣帝时期礼学家，梁国睢阳人，字次君，曾任九江太守，世称“小戴”。他从后苍受礼学，与叔父戴德并称“大小戴”，曾参与石渠阁经学大议。戴圣删选整理先秦两汉礼学文献成《礼记》四十九篇，后世列为儒家核心经典，对中国礼制文化影响至深。
