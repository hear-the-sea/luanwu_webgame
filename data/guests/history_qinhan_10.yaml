    default_gender: female
    archetype: civil
    flavor: （？—前202年）秦末楚汉之争时期项羽宠姬，史书称其名虞，常随项羽转战南北、形影不离。垓下之围时，汉军四面楚歌，项羽夜起饮酒慨唱《垓下歌》，虞姬和之起舞，不愿累及英雄而自刎殉情。其忠贞刚烈之风历经两千余年传颂，成为“霸王别姬”千古绝唱。
