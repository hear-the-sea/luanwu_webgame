  - key: hist_qinhan_0605
    name: 程邈
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）秦代下杜人，原为县狱吏，因罪系于云阳狱中。在狱十余年间，他潜心将繁复难写的小篆化圆为方、化繁为简，系统整理出隶书三千字献于秦始皇。嬴政见之大喜，赦其罪并拜为御史，隶书由此广泛推行于官府文书，促成汉字古今演变的关键转折。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 52
      defense: 22
      agility: 16
  - key: hist_qinhan_0606
    name: 茅焦
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）秦代齐国人，以敢言直谏著称。秦王政平定嫪毐之乱后，将生母赵太后迁居雍城并下令敢谏者戮，先后处死二十七名谏臣。茅焦无惧鼎镬，毅然请见，直言车裂假父、迁母于雍将失天下人心、阻统一大业。嬴政闻之幡然醒悟，亲迎太后归咸阳，尊茅焦为上卿。
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0607
    name: 贯高
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （？—前198年）西汉初年赵王张敖相国，原为张耳门客，性情刚烈重义。因愤刘邦过赵时踞坐慢骂张敖，贯高私下谋划于柏人行刺，事未成而发觉。遭逮入狱后，他忍受鞭笞烙铁酷刑始终独揽罪责、坚称张敖不知情。刘邦深感其忠义而赦免张敖与贯高，贯高遂自绝以报旧主。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 26
      intellect: 40
      defense: 22
      agility: 12
  - key: hist_qinhan_0608
    name: 剧孟
    avatar: pig/武053.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）西汉前期洛阳著名游侠，行事承袭朱家遗风，重然诺、好济人急难，声望遍及关东江湖。吴楚七国之乱爆发时，太尉周亚夫统军东征至河南，闻剧孟未附叛军，欣喜直言“吴楚举大事而不求孟，吾知其无能为已”，足见其在民间之威望与号召力。
