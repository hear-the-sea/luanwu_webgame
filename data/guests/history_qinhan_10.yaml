    avatar: monkey_wu_male5.png
    default_gender: male
    archetype: military
    flavor: （？—30年）东汉开国名将，云台二十八将之一，信都人，字伟君。王郎僭称天子于邯郸时，河北诸郡多望风归附，唯独和戎太守邳彤坚定迎奉刘秀，并在军心动摇之际力谏不可弃河北南归，为刘秀稳住阵脚、反败为胜立下关键功勋。后随征河北、平定齐鲁，封灵寿侯。
