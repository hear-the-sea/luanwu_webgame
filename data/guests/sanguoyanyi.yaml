  - key: hero_sgyy_0105
    name: 鲍三娘
    archetype: military
    default_gender: female
    default_morality: 82
    recruitable: true
    avatar: monkey_wu_female4.png
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 18
      defense: 18
      agility: 26
    flavor: 鲍家庄鲍员外三女，自幼习武，容貌俊俏却剑法凌厉，素有侠名。因比武招亲折服于关索的英姿与武艺，结为伉俪，随夫效力蜀汉。南征北伐之际常与关索并肩守隘、协同作战，夫妻同心护卫蜀境，是三国演义传说中颇具人气的女将。出自《三国演义》。
  - key: hero_sgyy_0106
    name: 木鹿大王
    archetype: civil
    default_gender: male
    default_morality: 45
    recruitable: true
    avatar: monkey_wen_male5.png
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 22
      intellect: 40
      defense: 18
      agility: 20
    flavor: 南蛮八纳洞洞主，骑白象、摇铜铃，精通道法异术，能呼风唤雾、驱使虎豹豺狼毒蛇猛兽冲阵。受孟获之请出战，一举以群兽大破蜀军前锋，令诸将惊骇不已。后被诸葛亮以喷火巨兽木雕破去妖术，大王亦战死乱军之中，奇诡莫测。出自《三国演义》。
  - key: hero_sgyy_0107
    name: 朵思大王
    archetype: civil
    default_gender: male
    default_morality: 48
    recruitable: true
    avatar: monkey_wen_male6.png
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 18
      intellect: 44
      defense: 20
      agility: 18
    flavor: 秃龙洞洞主，南蛮中最富心计的智囊型酋长，深谙瘴疠山川地利，凭借哑泉、灭泉、黑泉、柔泉四口毒泉阻挡蜀军去路，险些令诸葛亮大军寸步难行。后因万安隐者指点蜀军解毒破局，秃龙洞失守，朵思大王力战阵亡，其巧借天险之谋令人印象深刻。出自《三国演义》。
  - key: hero_sgyy_0112
    name: 乔国老
    archetype: civil
    default_gender: male
    default_morality: 85
    recruitable: true
    avatar: monkey_wen_male7.png
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 10
      intellect: 48
      defense: 22
      agility: 20
    flavor: 东吴元老重臣，江东大乔、小乔之父，德高望重、洞悉世情。周瑜设美人计诱刘备过江招亲时，乔国老深明孙刘联盟利害，先将婚讯禀报吴国太，又力赞刘备人中龙凤，一手促成甘露寺相亲，令周瑜弄假成真、赔了夫人又折兵，尽显老成谋国之智。出自《三国演义》。
  - key: hero_sgyy_0113
    name: 吴国太
    archetype: civil
    default_gender: female
    default_morality: 82
    recruitable: true
    avatar: monkey_wen_female4.png
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 48
      defense: 24
      agility: 18
    flavor: 孙坚次妻、孙尚香生母，在东吴宗室中威望极高，眼光独到且果决护短。甘露寺相亲时怒斥孙权、周瑜以亲妹为饵，当场看中刘备气度并力主完婚，更斥退埋伏刀斧手护女婿周全。既有慈母心肠，又具决断家国大事的威仪。出自《三国演义》。
  - key: hero_sgyy_0114
    name: 糜夫人
    archetype: civil
    default_gender: female
    default_morality: 92
    recruitable: true
    avatar: monkey_wen_female5.png
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 10
      intellect: 42
      defense: 28
      agility: 20
    flavor: 东海糜竺之妹、刘备夫人，性情贞烈而深明大义。当阳长坂坡乱军之中，她身负重伤仍死死护住幼主阿斗，待赵云单骑寻至，为免拖累大将突围，将阿斗托付赵云后毅然投枯井自尽，成全了赵子龙七进七出的千古壮举，节烈动天。出自《三国演义》。
  - key: hero_sgyy_0115
    name: 甘夫人
    archetype: civil
    default_gender: female
    default_morality: 90
    recruitable: true
    avatar: monkey_wen_female6.png
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 10
      intellect: 44
      defense: 26
      agility: 20
    flavor: 刘备正室夫人、刘禅生母，温婉贤淑、仪态端庄。早年随刘备颠沛流离于徐州、荆州之间，几经战乱而从未失节，深得关羽、张飞与赵云敬重。长坂坡一役在赵云护送下平安突围，一生辅佐刘备操持内宅，以仁德贤惠垂范蜀汉。出自《三国演义》。
  - key: hero_sgyy_0116
    name: 黄承彦
    archetype: civil
    default_gender: male
    default_morality: 86
    recruitable: true
    avatar: monkey_wen_male8.png
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 50
      defense: 20
      agility: 20
    flavor: 沔南名士，诸葛亮岳父，生性高洁爽朗、深通奇门遁甲与山水隐逸之趣。刘备二顾茅庐时，曾于大雪桥头遇其骑驴吟诗，误认作卧龙先生。夷陵之战后，陆逊误入诸葛亮所布石兵八阵，正是黄承彦奉女婿旧嘱现身引路脱险，风度超然物外。出自《三国演义》。
  - key: hero_sgyy_0117
    name: 紫虚上人
    archetype: civil
    default_gender: male
    default_morality: 75
    recruitable: true
    avatar: monkey_wen_male9.png
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 10
      intellect: 52
      defense: 18
      agility: 20
    flavor: 锦屏山隐世高道，能知人生死贵贱、洞察天机气数。益州战事将起时，刘璋部将刘璝、张任等人登门求问吉凶，上人仅赠八句谶语，便精准道破“左龙右凤，飞入西川；雏凤坠地，卧龙升天”，预言庞统落凤坡之劫与蜀汉兴势，玄妙难测。出自《三国演义》。
  - key: hero_sgyy_0101
    name: 周仓
    archetype: military
    default_gender: male
    default_morality: 88
    recruitable: true
    avatar: pig/武007.png
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 44
      intellect: 14
      defense: 24
      agility: 18
    flavor: 关羽麾下贴身扛刀护卫，原为黄巾旧部，生得黑面虬髯、两臂有千斤之力，且精于水性。卧牛山落草时仰慕关羽威名，毅然散尽山寨追随左右，手扛八十二斤青龙偃月刀健步如飞。水淹七军时曾潜入江中生擒庞德，后闻关羽父子麦城遇害，拔剑自刎殉主，忠义千秋。出自《三国演义》。
  - key: hero_sgyy_0102
    name: 兀突骨
    archetype: military
    default_gender: male
    default_morality: 45
    recruitable: true
    avatar: pig/武008.png
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 46
      intellect: 8
      defense: 34
      agility: 12
    flavor: 乌戈国国王，身长丈二、不食五谷，浑身鳞甲覆盖、刀枪难伤，统领三万所向披靡的藤甲兵。应孟获之邀出兵相助，藤甲军渡江不沉、刀箭不入，令蜀汉大军屡吃败仗。终因轻敌冒进，中了诸葛亮盘蛇谷火攻之计，连同藤甲兵葬身火海，是南蛮篇中最具压迫感的悍王。出自《三国演义》。
  - key: hero_sgyy_0103
    name: 祝融夫人
    archetype: military
    default_gender: female
    default_morality: 65
    recruitable: true
    avatar: monkey_wu_female.png
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 40
      intellect: 16
      defense: 18
      agility: 26
    flavor: 南蛮王孟获之妻，自称火神祝融氏后裔，恩怨分明、武艺高强，善使丈八长标与背插五口飞刀，百发百中。见孟获屡败，她亲自披挂上阵，阵前生擒张嶷、马忠两员蜀将，威震蜀营，堪称全书唯一真正上阵厮杀擒将的女中豪杰，后随孟获心悦诚服归降蜀汉。出自《三国演义》。
  - key: hero_sgyy_0104
    name: 关索
    archetype: military
    default_gender: male
    default_morality: 85
    recruitable: true
    avatar: pig/武009.png
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 18
      agility: 22
    flavor: 关羽第三子，人称花关索，少年英俊、武艺超群，继承关家刀法与枪术之精妙。荆州失守后流落民间习武，及至诸葛亮南征孟获时赶赴大营认祖归宗，奉命充当前部先锋，逢山开路、屡破蛮兵，深得诸葛亮赏识，延续了关氏一门的忠勇威名。出自《三国演义》。
  green:
  - key: hist_sljnbc_0589
    name: 邢道荣
    default_gender: male
    archetype: military
    flavor: “南道荣，北潘凤”中的邢道荣，称号万人敌，手持六十斤开山大斧，胸怀一万个退堂大鼓。邢道荣是三国时期少有的“复合型人才”——武能硬刚张飞一回合，文能舌战诸葛亮不怯场。他的核心战术是“咆哮威吓法”配合“光速滑跪术”。只要敌军阵中没有拿丈八蛇矛和亮银枪的，他单凭一张嘴就能为你拿下一座城。
    avatar: pig_wu_male4.png
    recruitable: false
    growth_range:
    - 4
    - 8
    attribute_weights:
      force: 40
      intellect: 30
      defense: 15
      agility: 15
  - key: hist_sljnbc_0590
    name: 潘凤
    default_gender: male
    archetype: military
    flavor: “南道荣，北潘凤”中的潘凤，韩馥眼中的战神，十八路诸侯心中的流星。潘凤，一个把“出场即巅峰”演绎到极致的男人。他生平最大的爱好是保养他的大斧，最大的遗憾是没能告诉全世界他的大斧到底有多饥渴。为了表彰你的武勇，冀州方面特意送来了一把沉甸甸的开山大斧，以及它的主人——没错，就是那位让华雄连热身都没做完就火速下班的无双上将！好好待他，记得别让他碰酒，尤其是温热的。
    avatar: pig_wu_male4.png
    recruitable: false
    growth_range:
    - 4
    - 8
    attribute_weights:
      force: 40
      intellect: 15
      defense: 25
      agility: 20
  - key: hero_sgyy_0121
    name: 裴元绍
    archetype: military
    default_gender: male
    default_morality: 68
    recruitable: true
    avatar: pig/武017.png
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 14
      defense: 24
      agility: 20
    flavor: 黄巾军旧将，与周仓同在卧牛山落草为寇，为人豪爽直率、重江湖义气。关羽千里走单骑途经山寨时，他与周仓慕名归附，自愿留守山寨等候接应。不料后来不知来者是常山赵云，贸然下山夺马，一合便死于赵云枪下，结局令人唏嘘。出自《三国演义》。
  - key: hero_sgyy_0122
    name: 胡班
    archetype: civil
    default_gender: male
    default_morality: 84
    recruitable: true
    avatar: monkey_wen_male11.png
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 44
      defense: 20
      agility: 20
    flavor: 荥阳太守王植麾下从事，为人忠厚重义，其父胡华曾款待关羽并托付家书。王植密谋夜烧馆驿暗害关羽时，胡班见关羽天人姿容，又读父书大惊，遂冒死密报关羽并暗开城门放行，助关羽平安渡险。后入荆州投奔关羽，得保举入蜀为官。出自《三国演义》。
  - key: hero_sgyy_0123
    name: 普净
    archetype: civil
    default_gender: male
    default_morality: 92
    recruitable: true
    avatar: duck_wen_male1.png
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 48
      defense: 22
      agility: 18
    flavor: 汜水关镇国寺长老，河东解良人，与关羽为同乡。关羽过五关途经镇国寺时，卞喜于壁衣后暗伏刀斧手谋害，普净以举刀示意暗中点破杀机，救关羽一命。后来关羽麦城遇难、英魂游荡玉泉山，亦是普净以佛法一言点化，使其皈依护法。出自《三国演义》。
  - key: hero_sgyy_0124
    name: 夏侯恩
    archetype: military
    default_gender: male
    default_morality: 50
    recruitable: true
    avatar: pig/武021.png
    growth_range:
    - 3
    - 6
    attribute_weights:
      force: 38
      intellect: 16
      defense: 22
      agility: 24
    flavor: 曹操贴身背剑之将，深得曹操信任，负责掌管削铁如泥的绝世名剑“青釭剑”。长坂坡之战时，他自恃勇力脱离中军抢掠百姓财物，偏巧撞上怀抱幼主突围的赵云，未及拔剑便被一枪挑落马下，连人带剑成全了赵子龙的神兵传奇。出自《三国演义》。
  - key: hero_sgyy_0125
    name: 带来洞主
    archetype: civil
    default_gender: male
    default_morality: 52
    recruitable: true
    avatar: duck_wen_male2.png
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 22
      intellect: 40
      defense: 18
      agility: 20
    flavor: 祝融夫人之弟、孟获内弟，八番九十三甸的谋主，善于联络南蛮各洞豪强。孟获屡战屡败之际，正是他先后荐引木鹿大王、乌戈国兀突骨等强援，并策划诈降之计试图反袭蜀营，虽屡遭诸葛亮识破，仍是孟获身旁最卖力的智囊亲信。出自《三国演义》。
  - key: hero_sgyy_0126
    name: 孟优
    archetype: military
    default_gender: male
    default_morality: 48
