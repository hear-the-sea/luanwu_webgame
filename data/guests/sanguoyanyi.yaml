heroes:
  purple:
  - key: hist_sljnbc_0589_purple
    name: 邢道荣
    default_gender: male
    archetype: military
    flavor: “南道荣，北潘凤”中的邢道荣，称号万人敌，手持六十斤开山大斧，胸怀一万个退堂大鼓。邢道荣是三国时期少有的“复合型人才”——武能硬刚张飞一回合，文能舌战诸葛亮不怯场。他的核心战术是“咆哮威吓法”配合“光速滑跪术”。只要敌军阵中没有拿丈八蛇矛和亮银枪的，他单凭一张嘴就能为你拿下一座城。
    avatar: pig_wu_male5.png
    recruitable: false
    attribute_weights:
      force: 40
      intellect: 30
      defense: 15
      agility: 15
  - key: hist_sljnbc_0590_purple
    name: 潘凤
    default_gender: male
    archetype: military
    flavor: “南道荣，北潘凤”中的潘凤，韩馥眼中的战神，十八路诸侯心中的流星。潘凤，一个把“出场即巅峰”演绎到极致的男人。他生平最大的爱好是保养他的大斧，最大的遗憾是没能告诉全世界他的大斧到底有多饥渴。为了表彰你的武勇，冀州方面特意送来了一把沉甸甸的开山大斧，以及它的主人——没错，就是那位让华雄连热身都没做完就火速下班的无双上将！好好待他，记得别让他碰酒，尤其是温热的。
    avatar: pig_wu_male5.png
    recruitable: false
    attribute_weights:
      force: 40
      intellect: 15
      defense: 25
      agility: 20
  - key: hero_sgyy_0118
    name: 南华老仙
    archetype: civil
    default_gender: male
    default_morality: 70
    recruitable: true
    avatar: monkey_wen_male10.png
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 10
      intellect: 54
      defense: 16
      agility: 20
    flavor: 三国演义开篇现身的神秘高人，碧眼童颜、手执藜杖，于山中遇采药不第的张角，授其天书《太平要术》三卷，叮嘱其代天宣化、普救世人，并警诫切勿萌生异心，否则必获恶报。一卷天书掀起黄巾狂潮，揭开东汉末年群雄逐鹿的乱世序幕。出自《三国演义》。
  blue:
  - key: hist_sljnbc_0589_blue
    name: 邢道荣
    default_gender: male
    archetype: military
    flavor: “南道荣，北潘凤”中的邢道荣，称号万人敌，手持六十斤开山大斧，胸怀一万个退堂大鼓。邢道荣是三国时期少有的“复合型人才”——武能硬刚张飞一回合，文能舌战诸葛亮不怯场。他的核心战术是“咆哮威吓法”配合“光速滑跪术”。只要敌军阵中没有拿丈八蛇矛和亮银枪的，他单凭一张嘴就能为你拿下一座城。
