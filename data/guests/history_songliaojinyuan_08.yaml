heroes:
  purple:
  - key: hist_songliaojinyuan_0390
    name: 木华黎
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: （1170年—1223年）蒙古名将，札剌亦儿部人，成吉思汗开国功臣，与博尔术、博尔忽、赤老温并称“四杰”。他长期统军攻金，受封太师、国王，总领太行以南军政，并任用史天倪、张柔、严实等汉将经营河北、山西。1223年，他在南下攻金途中病逝于闻喜军中。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0394
    name: 旭烈兀
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: （1217年—1265年）蒙古宗王，拖雷之子，忽必烈之弟。他奉蒙哥之命西征，1258年攻陷巴格达，灭阿拔斯王朝；又进军叙利亚，后因蒙哥死讯率主力东返，留驻军被马穆鲁克击败。他在伊朗建立伊儿汗国，以马拉盖为统治中心，后王迁都大不里士，与元朝保持往来，1265年病逝。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0395
    name: 拔都
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: （1209年—1255年）蒙古宗王，术赤之子，钦察汗国建立者。1236年起，他统率“长子西征”，攻占伏尔加河流域与俄罗斯诸公国，又深入波兰、匈牙利。1242年因窝阔台死讯东返，以萨莱为中心经营钦察汗国，统辖钦察草原与罗斯诸地。他对蒙古大汗之位亦有影响，1255年去世。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  blue:
  - key: hist_songliaojinyuan_0388
    name: 哲别
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （？—约1224年）蒙古将领，别速惕部人（早年属泰赤乌阵营）。早年作战中曾射伤铁木真的战马，归降后坦诚相告，得到宽恕，获名“哲别”，意为箭。他随军攻金，又率部灭西辽、追击花剌子模沙摩诃末，西征途中病逝，是成吉思汗倚重的先锋将领。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0391
    name: 窝阔台
    avatar: pig_wu_male9.png
    default_gender: male
    archetype: military
    flavor: （1186年—1241年）成吉思汗第三子，1229年经忽里台推举继任大汗。他任用耶律楚材等，采纳中原制度，设税课、定赋役；1234年灭金，并营建哈拉和林为都城。他派拔都等率“长子西征”，又东征高丽。1241年去世后，皇后乃马真氏摄政，汗位继承一度纷争。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0396
    name: 黄道婆
    avatar: monkey/其他随机角色/文064_女.png
    default_gender: female
    archetype: civil
    flavor: （约1245年—约1330年）元代棉纺织技术改良者，松江乌泥泾人。她早年流落海南崖州，向黎族学习纺织，晚年返乡，传授擀、弹、纺、织技艺，并改进去籽、弹花、纺纱等工具。松江一带棉织业由此兴盛，乡人立祠纪念，民间称其为“黄婆婆”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0389
    name: 博尔术
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）蒙古开国功臣，阿鲁剌惕部人。他早年结识铁木真，此后长期随其征战，屡次在危难中救护。蒙古建国后，他与木华黎、博尔忽、赤老温并称“四杰”，受封右翼万户，掌管西部草原军政。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0400
    name: 赤老温
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）蒙古速勒都思氏，锁儿罕失剌之子。铁木真少年被泰赤乌部擒获时，他与家人暗中相助，使其脱身。此后他追随铁木真统一蒙古，与博尔术、木华黎、博尔忽并称“四杰”，获“把阿秃儿”称号，建国后受封千户。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0401
    name: 者勒蔑
    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）蒙古兀良哈部人，成吉思汗麾下开国将领。他早年追随铁木真，在作战中曾为受伤的铁木真吸出淤血，又冒险寻来马奶相救。蒙古建国后，他受封千户，与忽必来、哲别、速不台并称“四狗”，位列十大功臣。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0402
    name: 忽必来
    avatar: pig/武010.png
    default_gender: male
    archetype: military
    flavor: （？—约1211年）蒙古巴鲁剌思氏将领，成吉思汗麾下“四狗”之一。他参与统一蒙古诸部，建国后受封千户。约1210年，他奉命出兵，促使葛逻禄首领归附，稳定了蒙古西部的交通与属部。回师后不久病逝。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  green:
  - key: hist_songliaojinyuan_0359
    name: 挞懒
    avatar: monkey_wu_male7.png
    default_gender: male
    archetype: military
    flavor: 挞懒，本名完颜昌，金穆宗盈歌之子，太祖完颜阿骨打堂弟。早年参与伐辽、攻宋，长期经略山东。金熙宗时，他与宗磐等力主归地议和，将河南、陕西归还南宋，与宗弼等主战派对立；后为完颜宗弼等以谋反罪构陷，约1139年被杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0360
    name: 撒离喝
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: 撒离喝（？—1150），金初女真将领。天会年间经略陕西，与宋将吴玠、吴璘长期对峙；1133年自长安出兵，破饶风关，一度攻取金州、洋州、兴元等地，次年在仙人关为吴玠所败。海陵王时因功高见忌，被诬谋反杀害，大定初复官爵。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0362
    name: 张浩
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: 张浩（1088—1163），字浩然，辽阳渤海人，本姓高，金初重臣。历仕太祖、太宗、熙宗、海陵王、世宗五朝，参与厘定金初官制、礼仪与科举。海陵王迁都燕京时，他主持营建中都宫室，后官至太师、尚书令，是金初制度建设中较有实绩的文臣。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0363
    name: 韩昉
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: 韩昉（1081—1149），字公美，燕京人，辽末进士，入金后为金熙宗讲习汉学，甚为熙宗所礼遇。历任礼部尚书、翰林学士、参知政事，参与修撰《金先朝实录》与国史，并参酌旧制厘定朝仪、诏诰，推动金初汉制、礼仪和文教。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0364
    name: 刘豫
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: 刘豫（1073—1146），字彦游，景州阜城人，北宋末进士。曾任济南知府，1128年降金；1130年被册立为大齐皇帝，先都大名，后迁汴京，代金统治黄河以南。屡与宋军交战失利，1137年（一说1138年）被金废黜，降封蜀王，后卒于金。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0365
    name: 苏天爵
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 苏天爵（1294—1352），字伯修，真定人，元代史学家、政治家。出身国子学，历官监察御史、吏部尚书、江浙行省参知政事。他编《国朝名臣事略》十五卷、《元文类》七十卷，保存了大量元代文献；1352年奉命镇压江西红巾军，卒于军中。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0366
    name: 蔡松年
    avatar: pig/文048.png
    default_gender: male
    archetype: civil
    flavor: 蔡松年（1107—1159），字伯坚，号萧闲老人，真定人，北宋燕山府守臣蔡靖之子，随父降金后仕至尚书右丞相。其词清丽，与吴激并称“吴蔡体”，有《萧闲老人明秀集》（一称《萧闲公集》）传世；子蔡珪亦以文名。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0367
    name: 赵秉文
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: 赵秉文（1159—1232），字周臣，号闲闲老人，磁州滏阳人，大定二十五年进士。历任礼部尚书、翰林学士、修国史，主盟金末文坛近三十年，与杨云翼并称“赵杨”。诗文书画皆有声名，著有《闲闲老人滏水文集》，1232年卒于蒙古围困中的汴京。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0368
    name: 王若虚
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 王若虚（1174—1243），字从之，号慵夫，真定藁城人，金承安二年进士。历官县令、左司谏、翰林直学士。金亡不仕，隐居著述，自号滹南遗老。所著《滹南遗老集》含《文辨》《诗话》，推重苏轼，主张文章以意为主、辞达而已。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0369
    name: 李纯甫
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: 李纯甫（1185—1231），字之纯，号屏山居士，弘州襄阴人，承安二年进士。他博览群书，为文奇崛，喜奖掖后进，元好问、雷渊等均受其影响。晚年好佛，著《鸣道集说》驳宋儒排佛之论，主张三教合一，与赵秉文、元好问交游。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0370
    name: 党怀英
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: 党怀英（1134—1211），字世杰，号竹溪，冯翊人，后徙居泰安，大定十年进士。少时与辛弃疾同学，工篆籀隶书，金章宗称当时制诏以他最善，学者多宗之。他长期供职翰林，官至翰林学士承旨，曾充《辽史》刊修官，卒谥文献，著有《竹溪集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0371
    name: 王庭筠
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: 王庭筠（1151—1202），字子端，号黄华山主，盖州熊岳人，米芾外甥。大定十六年进士，官至翰林修撰，曾因事去职，隐居黄华山。诗文书画俱工，墨竹山水尤负盛名，书法承米芾一脉。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0372
    name: 赵沨
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: 赵沨，字文孺，号黄山，东平人，生卒年不详，大定二十二年进士，官至礼部郎中。性冲淡，好道家之学，与赵秉文、王庭筠等交游唱和。工书法，与王庭筠并称书名，赵秉文评其正书兼颜真卿、苏轼笔意，行书备诸家体。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0373
    name: 辛愿
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 辛愿，字敬之，号女几野人、溪南诗老，福昌人，金代布衣诗人，生卒年不详。年二十五始发愤读书，博览经史，尤精《春秋左氏传》。家贫嗜酒，隐居女几山下，与元好问交游唱和。其诗严整而有气骨，元好问《中州集》录其诗并附小传，称其敢以是非白黑自任。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0374
    name: 李俊民
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: 李俊民（1176—1260），字用章，号鹤鸣道人，泽州晋城人，承安五年经义状元。曾任应奉翰林文字，不久弃官归里，以教授为业。金亡后隐居不仕，忽必烈曾加以礼聘，他坚辞不出；著有《庄靖集》，学者称庄靖先生。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0375
    name: 刘祁
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: 刘祁（1203—1250），字京叔，号神川遁士，浑源人，刘从益之子。金末为太学生，屡试不第。金亡后返乡筑归潜堂，追记师友见闻，成《归潜志》十四卷，详载金末人物、轶事及汴京陷落始末，元修《金史》多取材于此。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0376
    name: 刘从益
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: 刘从益，字云卿，浑源人，生卒年不详，大安元年（1209）进士，金朝经学家。历官监察御史，因事罢职，后起为叶县令，在任有惠政。晚年寓居淮阳，其学以经术为本，诗亦清峻，著有《蓬门集》；其子刘祁撰《归潜志》，多记其行事。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0377
    name: 杨伯仁
    avatar: pig/文030.png
    default_gender: male
    archetype: military
    flavor: 杨伯仁，金朝官员、文学家。天德二年（1150）入翰林，历任侍讲、礼部侍郎、左谏议大夫、翰林待制等职，曾领修起居注，掌记注与制诰。他历海陵、世宗两朝，以文学侍从见重，其文辞典丽，金世宗读其文称赏不已。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0378
    name: 郭虾蟆
    avatar: monkey/其他随机角色/武044_男_.png
    default_gender: male
    archetype: military
    flavor: 郭虾蟆（？—1236），本名郭斌，金末会州人、将领。与兄郭禄大皆以善射闻名，曾抗击西夏并收复会州。金亡后他拒绝归附蒙古，据孤城坚守近两年；1236年城破，他焚家自尽，部众无一投降，元修《金史》将其列入忠义传。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0379
    name: 移剌蒲阿
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
