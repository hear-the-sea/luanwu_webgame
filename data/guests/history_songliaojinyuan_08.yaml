    default_gender: male
    archetype: military
    flavor: （1186年-1241年）元太宗，铁木真三子。他继承汗位后，完成了灭金大业，并发动长子西征。他建立了草原上的都城哈拉和林，推动了蒙古帝国的制度化建设。将窝阔台放回同代政治生态中考察，可以更清楚地看到其短期功绩与长期影响并存的特征。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0394
    name: 旭烈兀
    default_gender: male
    archetype: military
    flavor: （1217年-1265年）拖雷之子，忽必烈之弟，伊尔汗国的建立者。他西征中东，攻陷巴格达，灭亡阿拉伯帝国阿拔斯王朝。他的征服改变了中东的政治格局。伊尔汗国的建立让蒙古帝国治理重心深入伊斯兰世界，旭烈兀也因此成为欧亚政治格局重组中的关键人物。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
