    default_gender: male
    archetype: military
    flavor: （1209年-1255年）术赤之子，金帐汗国的真正建立者。他统帅长子西征，征服俄罗斯，进攻波兰和匈牙利，令欧洲颤栗。他的金帐汗国统治东欧二百余年。将拔都置于同代战区网络中，能更准确理解其决策为何呈现阶段性变化。
