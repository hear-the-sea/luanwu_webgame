  - key: hist_songliaojinyuan_0378
    name: 郭虾蟆
    default_gender: male
    archetype: military
    flavor: 郭虾蟆，金末将领。与兄禄大同守会州。兄战死后代领其军，坚守孤城十余年，屡败蒙军。城破之日举家自焚，部属无一降者。金亡后犹守节不屈，时人叹其忠烈。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0379
    name: 移剌蒲阿
    default_gender: male
    archetype: military
    flavor: 移剌蒲阿，契丹人，金末将领。与完颜陈和尚并肩抗蒙，屡经战阵。正大九年三峰山之战兵溃被俘，拒降遇害。其出身及将略可窥金季多族将领之尴尬处境，然史传简略，早年事功与具体战历多已失载。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0380
    name: 温迪罕达
    default_gender: male
    archetype: military
    flavor: 金朝将领。贞祐年间蒙古大举南下，温迪罕达奉命镇守北边要地，屡次督军抵御。兴定元年（1217）殁于战阵。其镇边方略与具体战绩，《金史》记载甚为简略，后人难以详考。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0381
    name: 仆散揆
    default_gender: male
    archetype: military
    flavor: 仆散揆（？—1207），金朝后期将领，章宗时官至平章政事。泰和六年南宋韩侂胄北伐，仆散揆受命为统帅，分九道南下反击，连克数州，迫使宋廷议和。他治军严整、调度有方，是金末少有的能统重兵之臣。然卒于军中，金亦未能借此战挽回颓势。其早年履历史籍记载有限。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0382
    name: 纥石烈志宁
    default_gender: male
    archetype: military
    flavor: （1120年-1178年）金朝名将，征宋功臣。他在宋金战争中屡立战功，是金朝中期的重要军事统帅。围绕纥石烈志宁的军事评价长期分化，核心往往不在勇怯，而在资源条件下的取舍逻辑。围绕纥石烈志宁的争议长期存在，本质上是在讨论不同历史条件下“可行策略”的边界。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0383
    name: 仆散忠义
    default_gender: male
    archetype: civil
    flavor: 金朝名将，世宗朝重臣。大定初年，契丹移剌窝斡叛乱，忠义受命统军讨平。其后主持对宋战事，于宿州等地与宋军交战，迫使南宋签订隆兴和议。世宗倚之为肱骨，历官平章政事、右丞相。大定二十七年卒。其人行事稳健，于军政两端皆有实绩。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0384
    name: 徒单克宁
    default_gender: male
    archetype: civil
    flavor: 金朝名臣。世宗大定年间官至平章政事，主持推行考课法，严核百官实绩，裁汰冗员。其整顿使世宗朝吏治一度清明，府库充实。历仕熙宗至世宗三朝，以清严著称于世。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0385
    name: 张万公
    default_gender: male
    archetype: civil
    flavor: （?-1207年）金朝名臣，"泰和律令"的主持者。他主持修订法典，为金朝的法制建设做出重要贡献。张万公留下的表达范式被后世反复激活，使其在文学传统中始终保持可见度。围绕张万公的功过讨论长期不断，原因在于其个案能够同时承载价值判断与机制分析。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0386
    name: 完颜匡
    default_gender: male
    archetype: civil
    flavor: 完颜匡（?-1160年）金朝宗室。完颜亮弑熙宗自立后，匡因对其暴政多有非议，被诬谋反处死。金朝中期宗室倾轧酷烈，匡之遭际正是权力清洗之一幕。其事《金史》仅存零星记载，生平细节已难详考。
