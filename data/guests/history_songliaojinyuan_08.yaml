    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0363
    name: 韩昉
    default_gender: male
    archetype: civil
    flavor: （1081年-1149年）金朝汉臣，一代名相。他历仕太宗、熙宗两朝，推行汉化改革，是金朝政治制度的主要设计者。韩昉的政治角色并非固定不变，而是在不同阶段随局势调整而迁移。从方法论上看，它能有效连接叙事史学与结构分析之间的解释鸿沟。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0364
    name: 刘豫
    default_gender: male
    archetype: civil
    flavor: 刘豫（1073—1143），景州阜城人。原为宋臣，金兵南下时降金。天会八年（1130）被金立为皇帝，国号大齐，都大名府，后迁汴京。替金统制中原，征敛赋税，助金攻宋。屡次南侵屡败，渐失金人信任，天会十五年（1137）被废，贬为蜀王。其政权实为金人操控之傀儡，个人施政空间有限。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0365
    name: 苏天爵
    default_gender: male
    archetype: civil
    flavor: 苏天爵（1294—1352），字伯修，真定人。由国子学生入仕，累官至江浙行省参知政事。他留心元代文献，辑《国朝名臣事略》十五卷，纂《元文类》七十卷，自著《滋溪文稿》三十卷，为保存元初至中叶典章人物事迹做了切实的汇编工作。晚年卷入朝中党争，卒于军中。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0366
    name: 蔡松年
    default_gender: male
    archetype: civil
    flavor: （1107年-1159年）金朝诗人，北宋遗民。他的诗词充满亡国之痛，是金朝汉族文人的代表。其诗词既保留北宋文脉，又吸纳金代现实经验，因而常被拿来观察易代之际文人身份如何重新安放。不少金元文学研究也借其作品讨论“遗民情绪”的表达边界。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0367
    name: 赵秉文
    default_gender: male
    archetype: civil
    flavor: 赵秉文（1159—1232），字周臣，磁州滏阳人。大定二十五年进士，累官至礼部尚书。金室南渡后主盟文坛近三十年，力倡平易通达之风，纠南渡前浮艳之弊。有《滏水文集》传世，诗、文、书皆为人所重。晚年目睹国势日蹙，卒于金亡前夕。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0368
    name: 王若虚
    default_gender: male
    archetype: civil
    flavor: 王若虚（1174-1243），金朝文学家、文学批评家。金亡后隐居不仕，号滹南遗老。所著《滹南遗老集》涵盖经史辨疑与诗文评论，持论平实，不逐虚华，是研究金代学术思想的重要文献。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0369
    name: 李纯甫
    default_gender: male
    archetype: civil
    flavor: 李纯甫（1185—1231），字之纯，弘州襄阴人，号屏山居士。承安二年进士，仕至京兆府判官。中年后潜心佛学，倡三教合一之说，撰《鸣道集说》批评宋儒理学，在金末思想界引起较大反响。其诗风纵横奇崛，与赵秉文、元好问皆有交往，是金末文坛颇具异端色彩的人物。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0370
    name: 党怀英
    default_gender: male
    archetype: civil
    flavor: 党怀英，金朝文学家、书法家。原籍冯翊，少与辛弃疾同学。篆书独步一时，与赵秉文并称。承安间为翰林学士承旨，曾修《辽史》。工诗文，著有《竹溪集》，时推金朝书坛之首。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0371
    name: 王庭筠
    default_gender: male
    archetype: civil
    flavor: 王庭筠，字子端，号黄华老人，辽东人。金大定进士，官至翰林修撰。工诗文书画，尤精墨竹山水，笔意上追米芾、苏轼，为金代文人画之冠冕。其书学二王，秀润天成，今存《幽竹枯槎图》等作，可见一代北方士大夫之审美风范。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0372
    name: 赵沨
    default_gender: male
    archetype: civil
    flavor: 赵沨，字文孺，号黄山，东平人。金大定进士，官至礼部郎中。工诗，善山水画，时人以其与王庭筠并论。然其画作几无存世，生平记载亦零散简略，今所见多转引自同时代人诗文酬赠，完整面貌已难确考。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0373
    name: 辛愿
    default_gender: male
    archetype: civil
    flavor: 辛愿（？-约1221），金朝诗人，号溪南诗老。其诗风慷慨悲凉，气格刚健，多写乱世漂泊之感。晚年贫困潦倒，依友人而居。诗作存世不多，元好问《中州集》收录其部分作品。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0374
    name: 李俊民
    default_gender: male
    archetype: civil
    flavor: 李俊民，金末元初诗人。金承安间进士及第，官至尚书省令史。金亡不仕元，隐居教授。忽必烈以安车召见，仍辞归山林。诗多沧桑之慨，著有《庄靖集》，号鹤鸣老人。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0375
    name: 刘祁
    default_gender: male
    archetype: civil
    flavor: （1203年-1250年）金末史学家，《归潜志》的作者。他记录了金朝末年的历史，是研究金史的重要资料。从刘祁作品的语气与题材变化，可以清楚追踪其人生处境对表达方式的持续影响。围绕刘祁的研究通常会在文本细读与时代语境之间往返，以避免人物评价被单一路径固化。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0376
    name: 刘从益
    default_gender: male
    archetype: civil
    flavor: 刘从益（1086-1149），金朝汉族士大夫。通儒学，入仕后致力兴学育才，在地方任职时推行教化、劝课农桑，培养了一批金代文士。其子刘祁为金元之际文士，《归潜志》作者。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0377
    name: 杨伯仁
    default_gender: male
    archetype: military
    flavor: （?-1213年）金朝名将，抗蒙先驱。他在蒙古入侵初期坚守边疆，英勇作战，最终力战殉国。研究杨伯仁时，战术层面的得失与政治层面的约束应被并列考察，二者缺一不可。围绕杨伯仁的争议长期存在，本质上是在讨论不同历史条件下“可行策略”的边界。
    growth_range:
