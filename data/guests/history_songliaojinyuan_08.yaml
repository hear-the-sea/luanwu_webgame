  - key: hist_songliaojinyuan_0362
    name: 张浩
    default_gender: male
    archetype: civil
    flavor: 张浩（1085—1156），辽阳人，金朝汉臣。博通经史，历仕太祖至海陵王数朝，累官至尚书令。金初制度草创，浩主持制定朝仪、官制，推行科举，选拔汉士，于金朝政权汉化与制度建设用力甚多。为人持重，颇受倚重，然其具体施政细节后世记载已不甚详备。
    growth_range:
