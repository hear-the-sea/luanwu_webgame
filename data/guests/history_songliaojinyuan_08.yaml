  - key: hist_songliaojinyuan_0360
    name: 撒离喝
    default_gender: male
    archetype: military
    flavor: 撒离喝（？—1150），金朝将领，以勇猛善攻著称，参与灭辽与伐宋，在陕西、河南等地多任前锋。史载其攻城拔寨有力，是金初重要战将；早年经历与各场战功散见于军书，前锋的名声最响，史料的细节却常最薄。
    growth_range:
