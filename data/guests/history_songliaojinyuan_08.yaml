    default_gender: female
    archetype: civil
    flavor: （约1245年-约1330年）元代纺织革新家，棉纺织业的推动者。她从海南学习纺织技术后回到松江，改良纺织工具，推广棉纺织。她的贡献使松江成为全国棉纺织中心。黄道婆的生平与宋辽金元之际制度环境关系紧密，其选择往往折射出官僚体系的真实运行边界。
