    name: 哲别
    default_gender: male
    archetype: military
    flavor: （？-约1224年）蒙古四杰之一，神箭手。他原是敌将，射伤铁木真后归降，成为最得力的将领。他西征花剌子模，追击摩诃末苏丹，横扫中亚，是蒙古西征的先锋。无论成败如何，哲别所面对的战场条件都具有典型性，因此其经验常被后人用作比较案例。
