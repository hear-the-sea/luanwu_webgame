  - key: hist_songliaojinyuan_0362
    name: 张浩
    default_gender: male
    archetype: civil
    flavor: 张浩（1085—1156），辽阳人，金朝汉臣，历仕太祖至海陵王数朝，累官尚书令。金初制度草创，他参与制定朝仪、官制，推动科举与汉士选用，替一个以部族军起家的政权搭起更适合治理中原的架子。张浩为人持重，具体施政细节虽已不全，但朝廷从马背走向文书的转身，少不了他的手。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0363
    name: 韩昉
    default_gender: male
    archetype: civil
    flavor: （1081年-1149年）金朝汉臣，历仕太宗、熙宗两朝，参与官制、礼仪与文教等汉化改革。韩昉不是把宋制照抄进金廷，而是在女真旧俗、皇权需求与汉地行政之间反复调配，替新王朝设计能落地的规矩。刀兵打下的疆土，最后还要靠制度接管；韩昉做的正是后半程那门不显眼的硬功。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0364
    name: 刘豫
    default_gender: male
    archetype: civil
    flavor: 刘豫（1073—1143），景州阜城人，原为宋臣，金兵南下后降金。天会八年（1130）被金扶立为“大齐”皇帝，先都大名，后迁汴京，替金统治中原、征敛赋税并助攻南宋；南侵屡败后失去金人信任，天会十五年被废，降封蜀王。刘豫有自己的算计，却始终被金军与金廷牵着缰绳，伪朝的龙椅比囚车只宽了一点。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0365
    name: 苏天爵
    default_gender: male
    archetype: civil
    flavor: 苏天爵（1294—1352），字伯修，真定人，由国子学生入仕，官至江浙行省参知政事。他一面处理元代政务，一面辑《国朝名臣事略》、纂《元文类》，又有《滋溪文稿》传世，把元初至中叶许多人物与典章从散佚边缘捞了回来。晚年卷入政争，卒于军中；能替别人保存身后名的人，未必能替自己避开当世风波。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0366
    name: 蔡松年
    default_gender: male
    archetype: civil
    flavor: （1107年—1159年）由北宋入金的文人、诗人。蔡松年身处易代之后，诗词既承北宋文脉，也写金朝现实与个人仕途；旧国余音与新朝生活的复杂妥协，都落在同一支笔下。一支笔要在两种身份之间行走，步步都像踩在薄冰上。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0367
    name: 赵秉文
    default_gender: male
    archetype: civil
    flavor: 赵秉文（1159—1232），字周臣，磁州滏阳人，大定二十五年进士，官至礼部尚书。金室南渡后，他主持文坛近三十年，力倡平易通达，纠正早期文风的浮艳；诗、文、书皆有声名，《滏水文集》传世。晚年眼看国势日蹙，文章仍不肯只写风雅，纸上也有一位士大夫对乱世的叹息。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0368
    name: 王若虚
    default_gender: male
    archetype: civil
    flavor: 王若虚（1174—1243），金朝文学家、文学批评家，号滹南遗老。金亡后隐居不仕，所著《滹南遗老集》既辨经史，也评诗文，持论平实，不为华辞牵着鼻子走。王若虚像一位不爱看热闹的鉴剑师，先敲一敲材料是否中空，再决定它值不值得传下去。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0369
    name: 李纯甫
    default_gender: male
    archetype: civil
    flavor: 李纯甫（1185—1231），字之纯，号屏山居士，承安二年进士，仕至京兆府判官。中年后潜心佛学，主张三教合一，作《鸣道集说》批评宋儒理学；他的诗又纵横奇崛，与赵秉文、元好问交游。金末思想界不缺循规蹈矩之人，李纯甫偏要把儒、释、道请到同一张桌上，看看谁的剑法更能服众。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0370
    name: 党怀英
    default_gender: male
    archetype: civil
    flavor: 党怀英，金朝文学家、书法家，原籍冯翊，少年时与辛弃疾同学。篆书独步一时，与赵秉文并称；承安年间官至翰林学士承旨，参与修《辽史》，诗文也有《竹溪集》传世。同窗一人后来以词写抗金，一人以篆书与史笔立身，少年同席，出手却各成一路。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0371
    name: 王庭筠
    default_gender: male
    archetype: civil
    flavor: 王庭筠，字子端，号黄华老人，辽东人，金大定进士，官至翰林修撰。诗文书画皆工，尤善墨竹山水，笔意取法米芾、苏轼；书法又学二王，秀润而有骨。北方风雪落在他的纸上，没有变成粗砺的刀痕，反而化作幽竹与枯槎的清气。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0372
    name: 赵沨
    default_gender: male
    archetype: civil
    flavor: 赵沨，字文孺，号黄山，东平人，金大定进士，官至礼部郎中。能诗，也善山水画，时人常把他与王庭筠相提；可惜画迹几无存世，生平多靠同时代诗文酬赠拼接。如今看不全他的画，反而更该克制笔墨：别把一幅失传的山水，硬画成一段确定的传奇。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0373
    name: 辛愿
    default_gender: male
    archetype: civil
    flavor: 辛愿（？—约1221），金朝诗人，号溪南诗老。诗风慷慨悲凉，气格刚健，多写乱世漂泊；晚年贫困，寄居友人门下，存诗也不算多。元好问《中州集》替他收住了几篇作品，像在风雪里替一位穷困诗人护住几张未被吹走的纸。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0374
    name: 李俊民
    default_gender: male
    archetype: civil
    flavor: 李俊民，金末元初诗人，金承安年间进士，官至尚书省令史。金亡后不仕元，隐居教授；忽必烈以安车召见，他仍辞归山林。诗中多沧桑之慨，有《庄靖集》传世，号鹤鸣老人。山林不是他逃避文章的地方，反而是他拒绝把旧国之痛换成新朝俸禄的所在。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0375
    name: 刘祁
    default_gender: male
    archetype: civil
    flavor: （1203年-1250年）金末史学家、文人，《归潜志》作者。刘祁记录金朝末年人物与朝局，不只写大臣名位，也保存许多亲见亲闻，使后人得以从细处触摸王朝覆亡前的气息。乱世史笔像在漏雨的屋里抄书，纸页随时会湿，他仍尽力把将散的记忆收进卷中。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0376
    name: 刘从益
    default_gender: male
    archetype: civil
    flavor: 刘从益（1086—1149），金朝汉族士大夫，通儒学。入仕后重视兴学育才，任地方官时兼顾教化与劝课农桑，培养了后来金代的一批文士；其子刘祁也成为《归潜志》作者。父子一人修学堂、一人写史书，未在战场留名，却替易代之际保住了读书人的脉络。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0377
    name: 杨伯仁
    default_gender: male
    archetype: military
    flavor: （？—1213年）金朝将领，蒙古入侵初期的抗战者。杨伯仁据守边疆、率部作战，最终力战殉国；关于他具体战术与任地，现存记载并不充分。边将的勇烈能挡住一阵兵锋，却不能独自补齐国力与援军，杨伯仁的死既是个人殉节，也是金廷防线开始承受重压的标记。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0378
    name: 郭虾蟆
    default_gender: male
    archetype: military
    flavor: 郭虾蟆，金末将领，与兄禄大同守会州。兄长战死后，他接过军权，坚守孤城十余年，屡次击退蒙古军；城破之日举家自焚，部属也无一投降。孤城守到最后，郭虾蟆用全家性命回答了“降不降”三个字。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0379
    name: 移剌蒲阿
    default_gender: male
    archetype: military
    flavor: 移剌蒲阿，契丹人，金末将领，与完颜陈和尚并肩抗蒙。正大九年三峰山之战金军溃败，他被俘后拒降遇害。契丹出身、效力于金、死战于蒙古兵锋之下，正显出金末多族将领的复杂处境；早年战历已多失载，能确定的是他最后没有换旗。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0380
    name: 温迪罕达
    default_gender: male
    archetype: military
    flavor: 金朝将领，贞祐年间奉命镇守北边要地，蒙古南下时多次督军抵御，兴定元年（1217）死于战阵。温迪罕达的镇边方略与战绩散见《金史》；国势下坠时仍死守岗位，已经是边将能留下的最硬一笔。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0381
    name: 仆散揆
    default_gender: male
    archetype: military
    flavor: 仆散揆（？—1207），金朝后期将领，章宗时官至平章政事。泰和六年南宋韩侂胄北伐，他受命统军，分九道南下反击，连克数州，迫使宋廷议和。仆散揆治军严整、调度有方，能统重兵；可一场胜仗终究救不了金朝后来积累的颓势，他最后也卒于军中。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0382
    name: 纥石烈志宁
    default_gender: male
    archetype: military
    flavor: （1120年-1178年）金朝名将，参与对宋战争并屡立战功，成为金朝中期的重要统帅。纥石烈志宁的战事不能只用“勇猛”概括，进军、守备与议和都受制于兵力和国力；他在前线能取胜，却也必须替朝廷承担每一次战略取舍的后果。将军手里的剑很长，能伸到的地方却总受粮道限制。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0383
    name: 仆散忠义
    default_gender: male
    archetype: civil
    flavor: 金朝名将、世宗朝重臣。大定初年契丹移剌窝斡叛乱，仆散忠义奉命统军讨平；后来主持对宋战事，在宿州等地交锋，促成南宋签订隆兴和议。世宗倚为肱骨，历官平章政事、右丞相。仆散忠义既能在乱军中平叛，也能在谈判桌边收束战局，稳字背后其实有很重的分量。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0384
    name: 徒单克宁
    default_gender: male
    archetype: civil
