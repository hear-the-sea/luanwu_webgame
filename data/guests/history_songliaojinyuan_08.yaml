  - key: hist_songliaojinyuan_0390
    name: 木华黎
    default_gender: male
    archetype: military
    flavor: （1170年-1223年）蒙古四杰之一，受封太师国王。他统帅汉地战事十余年，攻略金朝北方领土。他善于使用汉人降将，是蒙古帝国汉化的先驱。若离开当时的财赋与边防条件单看木华黎的决策，很容易低估其所受的现实约束。
    growth_range:
