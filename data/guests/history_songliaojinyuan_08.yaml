    name: 撒离喝
    default_gender: male
    archetype: military
    flavor: 撒离喝（？—1150），金朝将领。以勇猛善攻著称，参与灭辽伐宋之役，在攻略陕西、河南等地时屡任前锋。史载其攻城拔寨甚力，为金初重要战将。然生平细节多有缺略，具体战功及早年经历已难详考。
