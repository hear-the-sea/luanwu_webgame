      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0391
    name: 窝阔台
    default_gender: male
    archetype: military
    flavor: （1186年-1241年）元太宗，铁木真三子。他继承汗位后，完成了灭金大业，并发动长子西征。他建立了草原上的都城哈拉和林，推动了蒙古帝国的制度化建设。将窝阔台放回同代政治生态中考察，可以更清楚地看到其短期功绩与长期影响并存的特征。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0394
    name: 旭烈兀
    default_gender: male
    archetype: military
    flavor: （1217年-1265年）拖雷之子，忽必烈之弟，伊尔汗国的建立者。他西征中东，攻陷巴格达，灭亡阿拉伯帝国阿拔斯王朝。他的征服改变了中东的政治格局。伊尔汗国的建立让蒙古帝国治理重心深入伊斯兰世界，旭烈兀也因此成为欧亚政治格局重组中的关键人物。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0395
    name: 拔都
    default_gender: male
    archetype: military
    flavor: （1209年-1255年）术赤之子，金帐汗国的真正建立者。他统帅长子西征，征服俄罗斯，进攻波兰和匈牙利，令欧洲颤栗。他的金帐汗国统治东欧二百余年。将拔都置于同代战区网络中，能更准确理解其决策为何呈现阶段性变化。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0396
    name: 黄道婆
    default_gender: female
    archetype: civil
    flavor: （约1245年-约1330年）元代纺织革新家，棉纺织业的推动者。她从海南学习纺织技术后回到松江，改良纺织工具，推广棉纺织。她的贡献使松江成为全国棉纺织中心。黄道婆的生平与宋辽金元之际制度环境关系紧密，其选择往往折射出官僚体系的真实运行边界。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0359
    name: 挞懒
    default_gender: male
    archetype: military
    flavor: 挞懒，即完颜昌，金太祖从弟。早年伐辽有功，天会年间主攻宋；天眷年间却转向主和，主张归还河南、陕西部分土地，以议和换取稳定。完颜宗弼等主战派指控他通宋谋反，挞懒最终被杀。战场上一路向南的人，回头劝和时往往比真正的敌人更容易招来刀锋。
    growth_range:
