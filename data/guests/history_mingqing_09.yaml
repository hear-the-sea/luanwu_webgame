    flavor: （1451年—1510年）明武宗正德年间的司礼监掌印太监，曾掌内廷机要并深度介入朝政，一度权倾朝野。刘瑾的专权最终以伏诛收场；这段经历更适合作为观察明代中期内廷与外朝失衡、宦官干政及监察失效的反面案例。
