    name: 刘瑾
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （1451年—1510年）明武宗正德年间宦官，陕西兴平人。刘瑾与张永等八人侍奉太子朱厚照，武宗即位后得掌司礼监，专权排除异己，时称“八虎”之首，又设内行厂侦伺官员；正德五年以谋反罪被捕处死，家产抄没。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 17
      intellect: 50
      defense: 19
      agility: 14
  green:
  - key: hist_mingqing_0412
    name: 乌思道
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）清代幕友，浙江慈溪人。曾入河南巡抚田文镜幕府，负责查对文书、核算钱谷，田文镜的奏章多经其手；相传雍正帝曾在朱批中问及“邬先生安否”，所指即他，入潜邸、参与夺嫡等故事则多见于野史和文学作品，正史记载十分简略。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 52
      defense: 19
      agility: 16
  - key: hist_mingqing_0366
    name: 李世熊
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （1602年—1686年）字元仲，号愧庵，福建宁化人，明末清初遗民学者。南明隆武帝时被荐为翰林博士，他以奉养父亲为由辞谢；入清后隐居不仕，专心著述，撰有《寒支集》《钱神志》，并主纂《宁化县志》，保存了闽西地方文献。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 55
      defense: 16
      agility: 14
  - key: hist_mingqing_0409
    name: 曾纪芬
    avatar: monkey_wen_female10.png
    default_gender: female
    archetype: civil
    flavor: （1852年—1942年）号崇德老人，湖南湘乡人，曾国藩季女。她嫁入衡山聂氏，晚年居上海，持家谨严，承续曾氏家训；著有《崇德老人八十自订年谱》，记述家族生活、家训与晚清至民国的世变，其子聂云台为近代实业家。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 55
      defense: 22
      agility: 8
  - key: hist_mingqing_0413
    name: 徐崧
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （1617年—1690年）字松之，号臞庵居士，江苏吴江人，清初诗人、地方文献家。年少时从史元学诗，性好山水，四十岁后诗名渐著，往来于吴越、扬淮之间；辑有《诗风初集》，又与张大纯合辑《百城烟水》九卷，以苏州府及所属州县为纲，分记山川、名胜、人物与题咏。书未及完稿而卒，书中保存了不少清初苏南的乡邦文献。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 56
      defense: 23
      agility: 7
  - key: hist_mingqing_0414
    name: 余怀
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （1616年—1696年）字澹心，号无怀，福建莆田人，侨居南京，明末清初文学家。明亡后漫游江南，与遗民文人往还；所著《板桥杂记》追忆秦淮旧院的风物、名伎与晚明士人交游，寄托易代之感，另有《味外轩稿》等作品传世。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 13
      intellect: 54
      defense: 22
      agility: 11
