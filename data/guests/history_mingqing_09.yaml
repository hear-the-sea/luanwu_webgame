    default_gender: male
    archetype: civil
    flavor: （生卒年不详）清代幕友，浙江慈溪人，曾入河南巡抚田文镜幕，负责查对文书、核算钱谷。后世熟知的“邬思道”形象，多来自清末民初野史与影视文学；现有档案主要显示，他是一名参与地方政务的幕友，关于替雍正出谋划策等说法则多属后世传闻。
