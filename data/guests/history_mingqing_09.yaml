    default_gender: male
    archetype: civil
    flavor: （生卒年不详）明末清初遗民、学者，福建宁化人，字元仲，号寒支。李世熊参与编纂康熙《宁化县志》，保存地方人物、山川与旧闻；他的价值不在宏大官职，而在把乡邦记忆整理成可传的文献。
