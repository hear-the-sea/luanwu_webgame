      agility: 16
  - key: hist_sljnbc_0718
    name: 高允
    avatar: pig/文048.png
    default_gender: male
    archetype: civil
    flavor: （390年—487年）北魏名臣、史学家，字伯恭，勃海蓚县人。博通经史天文历算，历仕太武、文成、献文、孝文四朝，享年九十八岁。“国史之狱”爆发时，太子劝其将罪责推诿崔浩，他慨然拒之，直承实录之责，以忠直气节感动拓跋焘而免死。晚年清贫自守，位极人臣而家徒四壁。
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 10
      intellect: 52
      defense: 26
      agility: 12
  - key: hist_sljnbc_0719
    name: 陆云
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （262年—303年）西晋文学家，字士龙，吴郡吴县人，陆抗之子、陆机之弟，兄弟并称“二陆”。六岁能文，辞采清省雅洁，与兄之繁富相映成趣。入洛后为张华赏识，出任浚仪令政绩斐然，断案如神。八王之乱中卷入成都王司马颖军幕，因兄陆机兵败被谗，同遭杀害，时人痛惜。
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 12
      intellect: 54
      defense: 18
      agility: 16
  - key: hist_sljnbc_0704
    name: 杨大眼
    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）北魏名将，武都氐族人，仇池王杨难当之孙。少以胆勇健步闻名，考武时以三丈长绳系髻奔走，绳直如矢，令军中骇服。孝文帝南征与宣武帝伐梁诸役中，他每战身先士卒，冲锋陷阵势不可挡，淮南之战大破南梁军，令江淮百姓闻其名而止儿啼。其人虽不识字却能口授露布，威猛刚烈，为北魏一代悍将。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 52
      intellect: 10
      defense: 20
      agility: 18
  - key: hist_sljnbc_0721
    name: 杨修
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （175年—219年）东汉末年文学家、幕僚，字德祖，弘农华阴人，太尉杨彪之子。才思敏捷，任曹操丞相主簿期间，总知内外事无不称意。然其恃才放旷，屡屡窥破曹操心意，又深卷曹植与曹丕夺嫡之争，终为曹操忌惮，以“前后漏泄言教，交关诸侯”罪名处死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 14
      agility: 20
  - key: hist_sljnbc_0722
    name: 祢衡
    avatar: monkey/其他随机角色/文039_男.png
    default_gender: male
    archetype: civil
    flavor: （173年—198年）东汉末年名士、文学家，字正平，平原般县人。少有辩才，性格刚傲狂放，为孔融极力推举于曹操。然他不屈权势，当众击鼓辱骂曹操，复被遣往刘表、黄祖处。其文辞激越奔放，一挥而就《鹦鹉赋》名动当时，终因言语忤逆江夏太守黄祖而遇害，年仅二十六岁。
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 12
      intellect: 54
      defense: 12
      agility: 22
  - key: hist_sljnbc_0723
    name: 陈琳
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: （？—217年）东汉末年文学家，字孔璋，广陵射阳人，“建安七子”之一。初仕何进，后归袁绍掌记室，官渡之战前作《为袁绍檄豫州》，文辞犀利、声势雄壮，令曹操头风顿愈。袁氏败亡后归附曹操，曹操爱其才不咎既往，令与阮瑀同典军国书檄，亦善作乐府诗《饮马长城窟行》。
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 12
      intellect: 54
      defense: 18
      agility: 16
  - key: hist_sljnbc_0728
    name: 皇甫谧
    avatar: pig/文040.png
    default_gender: male
    archetype: civil
    flavor: （215年—282年）曹魏、西晋时期医学家、史学家、文学家，字士安，自号玄晏先生，安定朝那人。少时游荡，年二十始发愤苦读，终身辞官不仕。中年患风痹仍研习医道，集历代针灸学之大成，撰成《针灸甲乙经》，又著《帝王世纪》《高士传》等，并为左思《三都赋》作序，一时洛阳纸贵。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 22
      agility: 12
  - key: hist_sljnbc_0729
    name: 王叔和
    avatar: pig_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （约201年—约280年）西晋医学家，名熙，字叔和，高平人，曾任太医令。性情沉静，博通经方，尤精诊脉之术。他搜集整理散佚的张仲景《伤寒杂病论》，编次成《伤寒论》使医圣绝学得以传世；又独撰我国现存最早的脉学专著《脉经》十卷，归纳二十四脉象，泽被后世医林。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_sljnbc_0734
    name: 王镇恶
    avatar: monkey/其他随机角色/武044_男_.png
    default_gender: male
    archetype: military
    flavor: （373年—418年）东晋名将，北海剧县人，前秦名相王猛之孙。少涉兵书，深得刘裕器重。刘裕讨伐刘毅时，他率百舰奇袭江陵一举克城；北伐后秦时，率水军溯渭水直捣长安，大破姚泓主力，率先收复故都，功居第一。后留镇关中，因与沈田子猜忌不和，竟为沈田子所诱杀。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 42
      intellect: 26
      defense: 14
      agility: 18
  - key: hist_sljnbc_0736
    name: 宗悫
