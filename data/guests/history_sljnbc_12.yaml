heroes:
  purple:
  - key: hist_sljnbc_0701
    name: 刘勰
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （约465年—约520年）南朝梁文学理论家，字彦和，祖籍东莞莒县。幼年孤贫而笃志好学，早岁依定林寺僧祐整理佛经十余载，兼通儒释。他历时数年撰成《文心雕龙》五十篇，系统阐发文章体裁、创作构思与批评准则，体系严密而辞采瑰丽，被奉为中国古代文学理论集大成之作。后得沈约赏识，仕至昭明太子萧统通事舍人，晚年出家法号慧地。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 10
      intellect: 58
      defense: 18
      agility: 14
  - key: hist_sljnbc_0702
    name: 范晔
    avatar: pig/文031.png
    default_gender: male
    archetype: civil
    flavor: （398年—445年）南朝宋史学家、文学家，字蔚宗，顺阳人。博涉经史，善为文章，亦精音律与隶书。出贬宣城太守期间，删繁就简、融汇众家，撰成纪传体史书《后汉书》，首创《党锢》《独行》《逸民》《列女》诸传，议论精辟、笔力峭拔，位列前四史。后官至太子詹事，因牵涉彭城王刘义康谋逆案被诛，所著志书未竟而终。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 56
      defense: 18
      agility: 14
  - key: hist_sljnbc_0703
    name: 裴松之
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: （372年—451年）南朝宋史学家，字世期，河东闻喜人。年少博学，通览坟籍，历仕东晋、刘宋两朝，官至太中大夫。奉宋文帝之命为陈寿《三国志》作注，广征博引两百余种魏晋旧籍，补阙纠谬、考异存真，使大量业已亡佚的汉末三国史料赖以流传至今。其史注体例开后世史学考据先河，子孙裴骃、裴子野皆成史家。
    growth_range:
    - 6
    - 10
    attribute_weights:
      force: 10
      intellect: 56
      defense: 22
      agility: 12
  - key: hist_sljnbc_0705
    name: 葛洪
    avatar: pig/文036.png
    default_gender: male
    archetype: civil
    flavor: （283年—363年）东晋道教理论家、医药学家、炼丹家，字稚川，自号抱朴子，丹阳句容人。少时家贫砍柴换纸笔，博通经史与方术，曾参与平定石冰之乱。晚年隐居罗浮山炼丹著书，撰《抱朴子》系统确立神仙道教理论，又著《肘后备急方》首载天花、恙虫病及青蒿治疟之法，兼及化学实验观察，影响深远。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 16
      intellect: 50
      defense: 20
      agility: 14
  - key: hist_sljnbc_0720
    name: 刘徽
    avatar: monkey/其他随机角色/文_男123.png
    default_gender: male
    archetype: civil
    flavor: （约225年—约295年）三国曹魏至西晋时期杰出数学家，淄乡人。潜心算学，于景元四年撰成《九章算术注》与《海岛算经》，创立“割圆术”以极限思想精密推算圆周率至3.1416，并系统阐述重差术、体积原理与方程解法，奠定中国古代数学理论体系之基石。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 8
      intellect: 60
      defense: 18
      agility: 14
  blue:
  - key: hist_sljnbc_0706
    name: 鲍照
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （约414年—466年）南朝宋文学家，字明远，东海人，与谢灵运、颜延之并称“元嘉三大家”。出身寒微而才华横溢，因门阀压抑屡遭排挤，胸中郁勃不平之气尽发于诗文。他大力革新七言乐府，代表作《拟行路难》十八首俊逸豪放、慷慨悲凉，深启盛唐李白、高适、岑参诗风，所作《芜城赋》亦为六朝辞赋绝唱。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 16
      agility: 18
  - key: hist_sljnbc_0707
    name: 颜延之
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （384年—456年）南朝宋文学家，字延年，琅琊临沂人，与谢灵运并称“颜谢”。早年孤贫好读书，嗜酒疏狂，不拘礼法。文章典丽庄重，善用典故与对偶，讲究声律雕琢，所作《五君咏》借竹林名士抒怀讽世，脍炙人口。虽曾因直率触怒权贵出守外郡，仍不改名士风骨，官至金紫光禄大夫。
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 11
      intellect: 55
      defense: 20
      agility: 14
  - key: hist_sljnbc_0708
    name: 钟嵘
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （约468年—518年）南朝梁诗论家，字仲伟，颍川长社人。通《周易》，思理明敏，历仕齐、梁两朝，官至晋安王记室。他不满当时诗坛过度拘泥声律与堆砌典故，撰成中国首部诗歌批评专著《诗品》，品评汉魏至齐梁一百二十余位五言诗人，标举“滋味”与自然真情，影响后世诗学甚巨。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 18
      agility: 16
  - key: hist_sljnbc_0709
    name: 温峤
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: （288年—329年）东晋名将、政治家，字太真，太原祁县人。早年奉刘琨之命南渡劝进司马睿，遂留辅东晋。王敦专权时，他佯附权奸而密结朝臣，终助晋明帝平定王敦之乱。苏峻叛乱攻陷建康后，他首倡义兵并力推陶侃为盟主，决战石头城一举平叛，力挽东晋危局，谥号忠武。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 32
      defense: 18
      agility: 14
  - key: hist_sljnbc_0710
    name: 郗鉴
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （269年—339年）东晋名将、太尉，字道徽，高平金乡人。永嘉之乱中率乡里数万口保聚峄山，后率部南渡，收拢北方流民镇守京口、广陵，奠定东晋精锐“北府兵”之基。苏峻之乱时与陶侃、温峤协力勤王，又曾断然拒绝王导邀其共谋废立之议，持重守正，为东晋初年江北柱石。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 26
      defense: 24
      agility: 12
  - key: hist_sljnbc_0711
    name: 慕容皝
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
    flavor: （297年—348年）十六国时期前燕开国君主，字元真，鲜卑慕容部首领。袭位后平定诸弟内乱，外抗后赵石虎数十万大军，坚守棘城并乘胜反击。随后东破高句丽、北灭宇文部，拓地辽东与漠南，兴修水利、重用汉儒以立国本，为慕容氏入主中原奠定坚实基础。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 26
      defense: 20
      agility: 14
  - key: hist_sljnbc_0712
    name: 慕容翰
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （？—344年）前燕名将，字元邕，慕容廆庶长子、慕容皝之兄。弓马娴熟、勇略兼备，早年镇守徒河颇得民心。因遭慕容皝猜忌而先后奔逃段部、宇文部，装疯卖傻以自全，后终归前燕。归国后献奇谋助慕容皝大破高句丽与宇文部，冲锋陷阵屡建奇功，却终因功高见忌被迫饮鸩自尽。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 22
      defense: 16
      agility: 16
  - key: hist_sljnbc_0713
    name: 刘牢之
    avatar: pig/武054.png
    default_gender: male
    archetype: military
    flavor: （？—402年）东晋北府兵名将，字道坚，彭城人。自幼沉毅勇猛，为谢玄拔为北府兵前锋参军。淝水之战前夕，他率五千精兵夜袭洛涧，大破前秦梁成五万大军，重挫秦军锐气，名震天下。后统领北府兵平定王恭、孙恩之乱，然政治短视、反复倒戈，终为桓玄夺兵而自缢身亡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 48
      intellect: 14
      defense: 20
      agility: 18
  - key: hist_sljnbc_0714
    name: 朱序
    avatar: monkey_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （？—393年）东晋名将，字次伦，义阳人。镇守襄阳时遭前秦苻丕大军围攻，其母韩氏率城中妇女筑新城抵御，世称“夫人城”。襄阳陷落后被俘至前秦，淝水之战中奉命劝降谢石，反密告秦军虚实，并在秦军后撤时于阵后大呼“秦兵败矣”，促成晋军大捷，战后归晋官至征虏将军。
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 38
      intellect: 26
      defense: 24
      agility: 12
  - key: hist_sljnbc_0715
    name: 高澄
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: civil
    flavor: （521年—549年）东魏权臣、北齐奠基人，字子惠，高欢长子。早慧果决，年少即参赞军政，继父执掌东魏大权后，力行改革，整顿吏治、搜括隐户、抑制贪腐、提拔寒门才俊，又遣军收复河南、大败南梁，使东魏国势日盛。正当筹备受禅建齐之际，却因责辱厨奴兰京，遇刺身亡于邺城。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 22
      intellect: 46
      defense: 18
      agility: 14
  - key: hist_sljnbc_0716
    name: 斛律金
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: （488年—567年）东魏、北齐名将，字阿六敦，朔州敕勒部人，名将斛律光之父。善骑射、通兵略，随高欢起兵并屡立战功，官至左丞相、咸阳王。玉壁之战北齐军受挫时，他当众高唱鲜卑民歌《敕勒歌》，雄浑苍凉，振奋三军士气。其人深沉知机，善保功名，得以高寿善终。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 20
      defense: 22
      agility: 14
  - key: hist_sljnbc_0717
    name: 贺拔胜
    avatar: monkey_wu_male11.png
    default_gender: male
    archetype: military
    flavor: （？—544年）北魏、西魏名将，字破胡，神武尖山人，贺拔岳之兄。少有大志，骁勇善射，屡破六镇叛军与高欢部众。高欢专权后他曾出镇荆州，败后南奔萧梁，复北归西魏辅佐宇文泰。邙山之战中挺槊追击高欢几近擒获，威猛绝伦，位列太师，为关西宿将。
    growth_range:
    - 5
