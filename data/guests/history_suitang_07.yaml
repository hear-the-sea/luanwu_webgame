# 隋唐五代历史人物（唐代军政人物补充剩余部分、唐代文化与学术补充）

heroes:
  green:
  - key: hist_suitang_0164_wangshuwen
    name: 王叔文
    default_gender: male
    archetype: civil
    flavor: 越州山阴人，德宗时以棋待诏入东宫，为太子李诵讲论政事与民间疾苦。顺宗即位后任翰林学士，与王伾、柳宗元、刘禹锡等推行永贞革新，罢宫市与五坊小儿，并谋以范希朝接管神策军、从宦官手中收回兵权。新政仅行百余日，顺宗内禅后他遭贬渝州司户，806年被赐死。
    growth_range: [3, 7]
    attribute_weights:
      force: 16
      intellect: 47
      defense: 19
      agility: 18

  - key: hist_suitang_0165_wangpei
    name: 王伾
    default_gender: male
    archetype: civil
    flavor: 杭州人，以书法待诏东宫，侍奉太子李诵。顺宗即位后任左散骑常侍、翰林待诏，与王叔文共同主持永贞革新，时称“二王”，并荐引柳宗元、刘禹锡等人。他掌权后收受贿赂、为人求官，顺宗内禅后贬为开州司马，不久病死于贬所。
    growth_range: [3, 7]
    attribute_weights:
      force: 15
      intellect: 48
      defense: 19
      agility: 18

  - key: hist_suitang_0166_lixun
    name: 李训
    default_gender: male
    archetype: civil
    flavor: 字子垂，进士出身。文宗不满宦官专权，擢他入相，与郑注、韩约合谋铲除宦官，借金吾仗院石榴树降甘露之名设伏。事泄后仇士良等率禁军反扑，朝臣死伤甚众；李训逃入终南山，辗转投奔凤翔，途中被擒，835年遇害。此后宦官气焰更盛，文宗亦受制于宦官。
    growth_range: [3, 7]
    attribute_weights:
      force: 17
      intellect: 46
      defense: 19
      agility: 18

  - key: hist_suitang_0167_zhengzhu
    name: 郑注
    default_gender: male
    archetype: civil
    flavor: 绛州翼城人，本姓鱼，冒姓郑氏。早年以医术游于长安权贵间，曾为襄阳节度使李愬幕中医官，后由李愬荐于宦官王守澄，善揣人意而渐得信用。文宗欲除宦官，颇倚重他，官至凤翔节度使，与李训约定内外呼应。甘露之变失败后，他闻讯欲还京，被凤翔监军张仲清诱入军府杀死，首级传送京师。
    growth_range: [3, 7]
    attribute_weights:
      force: 16
      intellect: 45
      defense: 19
      agility: 20

  - key: hist_suitang_0168_lifuguo
    name: 李辅国
    default_gender: male
    archetype: civil
    flavor: 本名李静忠，宦官出身，早年掌闲厩马匹。安史之乱中随太子李亨北上灵武，劝进有功，肃宗赐名辅国。肃宗朝任元帅府行军司马，专掌禁兵，后封成国公。762年张皇后谋立越王，他与程元振拥立代宗，进封博陆郡王，加中书令，被尊为尚父。同年代宗罢其兵权，旋即派人将其暗杀，谥曰丑。
    growth_range: [3, 7]
    attribute_weights:
      force: 18
      intellect: 42
      defense: 21
      agility: 19

  - key: hist_suitang_0169_yuchaoen
    name: 鱼朝恩
    default_gender: male
    archetype: civil
    flavor: 宦官出身，天宝末年入内侍省。肃宗时出任观军容宣慰处置使，监领九节度使讨安庆绪，开宦官监军之例，相州之战唐军溃败。代宗时统率神策军，763年吐蕃攻入长安，他率军迎驾陕州，由此恃功骄横，又领国子监事，干预朝政。770年与宰相元载争权失败，被代宗设计缢杀。
    growth_range: [3, 7]
    attribute_weights:
      force: 19
      intellect: 43
      defense: 20
      agility: 18

  - key: hist_suitang_0170_chengyuanzhen
    name: 程元振
    default_gender: male
    archetype: civil
    flavor: 宦官出身，以拥立代宗之功任骠骑大将军、内侍监，统领禁军。得势后排挤功臣郭子仪、李光弼，又构陷来瑱致死。763年吐蕃进逼长安，他隐匿军情不报，代宗仓促出奔陕州，事后遭群臣交章弹劾，被削职流放溱州，途中死去。
    growth_range: [3, 7]
    attribute_weights:
      force: 17
      intellect: 44
      defense: 20
      agility: 19

  - key: hist_suitang_0171_hanjian
    name: 韩建
    default_gender: male
    archetype: military
    flavor: 许州人，初隶忠武军，后据有华州，任华州节度使，控制潼关。他在华州招抚流亡、劝课农桑，使当地稍安。乾宁年间唐昭宗出奔华州，他迎驾后加以挟制，并杀害覃王等宗室诸王。后归附朱温，后梁建立后出任宰相，官至太保。
    growth_range: [3, 7]
    attribute_weights:
      force: 40
      intellect: 20
      defense: 22
      agility: 18

  - key: hist_suitang_0172_wangxingyu
    name: 王行瑜
    default_gender: male
    archetype: military
    flavor: 唐末邠宁节度使，初为朱玫部将，886年倒戈杀朱玫，因功授邠宁节度使。乾宁年间与李茂贞、韩建联兵入长安，诛杀宰相韦昭度、李磎，纵兵劫掠，并谋废昭宗、另立吉王李保，朝野震动。乾宁二年（895）李克用奉诏讨伐，他兵败逃往庆州，为部下所杀。
    growth_range: [3, 7]
    attribute_weights:
      force: 41
      intellect: 19
      defense: 22
      agility: 18

  - key: hist_suitang_0173_zhumei
    name: 朱玫
    default_gender: male
    archetype: military
    flavor: 唐末将领，以军功累迁邠宁节度使。黄巢之乱中率军勤王，僖宗出奔兴元后，他与李昌符等拥立襄王李煴为帝，改元建贞，自任侍中，挟之与唐廷对抗。其部将王行瑜因争权生隙，光启二年（886）倒戈攻入长安，朱玫被杀，襄王政权随之瓦解。
    growth_range: [3, 7]
    attribute_weights:
      force: 40
      intellect: 18
      defense: 22
      agility: 20

  - key: hist_suitang_0174_zhengtian
    name: 郑畋
    default_gender: male
    archetype: civil
    flavor: 字台文，荥阳人，进士及第。僖宗时拜相，因与权宦田令孜不和而出镇凤翔。880年黄巢攻入长安，他抱病草檄传告四方，藩镇相继响应，又设伏龙尾陂大败尚让所部。次年凤翔军乱，他被部将李昌言驱逐，后赴行在复任宰相，883年去世。
    growth_range: [3, 7]
    attribute_weights:
      force: 17
      intellect: 45
      defense: 20
      agility: 18

  - key: hist_suitang_0175_tianshengong
    name: 田神功
    default_gender: male
    archetype: military
    flavor: 冀州南宫人，早年在平卢军中任职，安史之乱中一度陷于叛军，后归唐廷，以勇锐闻名。上元年间率军南下平定刘展之乱，其军纪不严，扬州一带的商民多受劫掠。763年吐蕃攻入长安，他率兵勤王，后任汴宋节度使，镇守中原多年。
    growth_range: [3, 7]
    attribute_weights:
      force: 40
      intellect: 19
      defense: 23
      agility: 18

  - key: hist_suitang_0176_libaoyu
    name: 李抱玉
    default_gender: male
    archetype: military
    flavor: 本姓安，河西人，为安兴贵之后。安史之乱中隶属李光弼麾下，守河阳南城有功，肃宗赐姓李氏，改名抱玉。曾任泽潞节度使，后由弟李抱真接任。广德年间出任凤翔节度使，镇守西部十余年，多次抵御吐蕃入侵，官至同中书门下平章事，封凉国公，777年去世。
    growth_range: [3, 7]
    attribute_weights:
      force: 40
      intellect: 19
      defense: 23
      agility: 18

  - key: hist_suitang_0177_weigao
    name: 韦皋
    default_gender: male
    archetype: military
    flavor: 字城武，京兆万年人。德宗时守陇州，朱泚叛乱中设计斩杀其使者，以功知名。贞元初年出任剑南西川节度使，镇蜀二十余年，屡次击退吐蕃，801年在维州擒吐蕃大相论莽热。他又招抚南诏，促成异牟寻归唐，官至检校司徒、同平章事，封南康郡王，805年去世。
    growth_range: [3, 7]
    attribute_weights:
      force: 39
      intellect: 21
      defense: 23
      agility: 17

  - key: hist_suitang_0178_zhangyanshang
    name: 张延赏
    default_gender: male
    archetype: civil
    flavor: 本名宝符，字延赏，蒲州猗氏人，名相张嘉贞之子。其父张嘉贞在玄宗朝官至中书令。代宗、德宗时历任剑南西川等镇节度使，后入朝拜相，因与名将李晟不和而受到非议。其子张弘靖在宪宗朝亦官至宰相，祖孙三代皆居相位。
    growth_range: [3, 7]
    attribute_weights:
      force: 16
      intellect: 45
      defense: 21
      agility: 18

  - key: hist_suitang_0179_zhanghongjing
    name: 张弘靖
    default_gender: male
    archetype: civil
    flavor: 字元理，蒲州猗氏人，宰相张延赏之子，与祖张嘉贞、父张延赏三代为相，时称“三相张家”。814年由河中节度使入朝拜相，元和末年出镇卢龙。到任后深居简出，轻视当地将士，又发掘安禄山墓、毁其棺柩，引起幽州军不满。821年军乱中被囚，后遭贬，824年去世。
    growth_range: [3, 7]
    attribute_weights:
      force: 17
      intellect: 44
      defense: 20
      agility: 19

  - key: hist_suitang_0180_hanhong
    name: 韩弘
    default_gender: male
    archetype: military
    flavor: 滑州匡城人，初为宣武军都知兵马使，因节度使刘全谅去世，被军中推为留后，贞元年间出任宣武节度使，镇守汴州二十余年。元和年间朝廷讨伐淮西吴元济，他任诸军都统却持兵观望，后遣子韩公武率军助攻。淮西平定后入朝，官至司徒、中书令，封许国公，823年去世。
    growth_range: [3, 7]
    attribute_weights:
      force: 40
      intellect: 19
      defense: 23
      agility: 18

  - key: hist_suitang_0181_duhuangshang
    name: 杜黄裳
    default_gender: male
    archetype: civil
    flavor: 字遵素，京兆杜陵人，进士及第。永贞年间，他曾劝女婿、宰相韦执谊请太子监国，未获采纳。宪宗初年拜相，力主讨伐擅自继任西川节度使的刘辟，并荐举高崇文为将，很快平定蜀地。他主张抑制藩镇、强化中央，元和初年的削藩政策多出其谋，后出镇河中，808年去世。
    growth_range: [3, 7]
    attribute_weights:
      force: 15
      intellect: 46
      defense: 20
      agility: 19

  - key: hist_suitang_0182_peiji
    name: 裴垍
    default_gender: male
    archetype: civil
    flavor: 字弘中，绛州闻喜人，进士出身。宪宗朝任翰林学士，主持选拔官员时注重才实，抑制请托之风，选用人才不避亲故。808年拜相后整顿吏治，罢免不称职者，先后荐举裴度、李绛、崔群、韦贯之等人，时论称其公允。810年因病去职，同年去世。
    growth_range: [3, 7]
    attribute_weights:
      force: 16
      intellect: 45
      defense: 21
      agility: 18

  - key: hist_suitang_0183_zhaozongru
    name: 赵宗儒
    default_gender: male
    archetype: civil
    flavor: 字秉文，邓州穰人，进士出身，其父赵骅以文辞知名于开元、天宝间。德宗末年拜相，此后历任地方节度使，并多次主持吏部铨选，以熟悉典章、处事公允著称。他历仕代宗至文宗六朝，穆宗、文宗时仍居高位，官至司空，832年以八十七岁高龄去世。
    growth_range: [3, 7]
    attribute_weights:
      force: 15
      intellect: 46
      defense: 20
      agility: 19

  - key: hist_suitang_0184_luxie
    name: 卢携
    default_gender: male
    archetype: civil
    flavor: 字子升，范阳人，出身范阳卢氏，进士及第。乾符年间拜相，与郑畋政见不合而互相攻讦，后倚重高骈主持讨伐黄巢，然高骈拥兵观望，师久无功。他依附权宦田令孜，一度独揽朝政，罢黜异己。880年黄巢攻破长安，僖宗仓皇出奔，他被罢相后服毒自尽。
    growth_range: [3, 7]
    attribute_weights:
      force: 17
      intellect: 44
      defense: 20
      agility: 19

  - key: hist_suitang_0185_cuiyin
    name: 崔胤
    default_gender: male
    archetype: civil
    flavor: 字昌遐，清河人，宰相崔慎由之子。昭宗朝四度拜相，901年联合禁军将领孙德昭等诛杀宦官刘季述，迎昭宗复位。此后他引入朱温势力，903年与朱温合谋尽诛宦官，事成后反受其挟制。904年朱温逼昭宗迁都洛阳，崔胤被罢相后遭杀害。
    growth_range: [3, 7]
    attribute_weights:
      force: 17
      intellect: 44
      defense: 20
      agility: 19

  - key: hist_suitang_0186_weiyuanzhong
    name: 魏元忠
    default_gender: male
    archetype: civil
    flavor: 宋州宋城人，本名真宰，早年以太学生身份上书言事而步入仕途。武则天时以直言敢谏累官至宰相，曾遭酷吏诬陷下狱，后复起，又任灵武道行军大总管防备突厥。中宗复位后官至中书令，因反对武三思、宗楚客专权而遭排挤，被贬出朝，707年死于贬所。
    growth_range: [3, 7]
    attribute_weights:
      force: 16
      intellect: 46
      defense: 20
      agility: 18

  - key: hist_suitang_0187_huanyanfan
    name: 桓彦范
    default_gender: male
    archetype: civil
    flavor: 字士则，润州曲阿人，以门荫入仕。705年与张柬之等发动神龙政变，诛杀张易之、张昌宗，逼武则天退位，迎立中宗，因功拜侍中，封谯郡王，与张柬之等并称“五王”。后遭武三思排挤，流放瀼州，706年在途中被杀害。
    growth_range: [3, 7]
    attribute_weights:
      force: 18
      intellect: 43
      defense: 20
      agility: 19

  - key: hist_suitang_0188_jinghui
    name: 敬晖
    default_gender: male
    archetype: civil
    flavor: 字仲晔，绛州太平人，以明经入仕，历仕武则天、中宗两朝。705年参与神龙政变，诛杀张易之、张昌宗，拥立中宗复位，因功拜侍中，封平阳郡王。他与张柬之、桓彦范等五人后世并称“五王”。后遭武三思构陷，流放崖州，706年被杀害。
    growth_range: [3, 7]
    attribute_weights:
      force: 17
      intellect: 45
      defense: 20
      agility: 18

  - key: hist_suitang_0189_cuixuanwei
    name: 崔玄暐
    default_gender: male
    archetype: civil
    flavor: 博陵安平人，以明经入仕，为官清谨，其母卢氏常以清廉相诫。武则天时官至宰相，705年与张柬之等发动神龙政变，逼武则天退位、迎立中宗，因功任中书令，封博陵郡王。后遭武三思排挤，流放岭南，706年病卒于途中。
    growth_range: [3, 7]
    attribute_weights:
      force: 16
      intellect: 46
      defense: 20
      agility: 18

  - key: hist_suitang_0190_yuanshuji
    name: 袁恕己
    default_gender: male
    archetype: civil
    flavor: 沧州东光人，时任司刑少卿。705年与桓彦范、敬晖等密谋，联络禁军参与神龙政变，拥立中宗复位，因功官至中书侍郎、同平章事，封南阳郡王，与张柬之等并称“五王”。后遭武三思排挤，被流放环州，706年被酷吏周利贞杀害于贬所。
    growth_range: [3, 7]
    attribute_weights:
      force: 17
      intellect: 45
      defense: 19
      agility: 19

  - key: hist_suitang_0191_liduozuo
    name: 李多祚
    default_gender: male
    archetype: military
    flavor: 靺鞨人，先祖为靺鞨酋长，归附唐朝。他骁勇善射，以军功累迁右羽林大将军，长期统领禁军，中宗时颇受信任。705年参与神龙政变，率羽林军入宫胁迫武则天退位。707年随太子李重俊起兵诛杀武三思，兵败玄武门，退走途中被部下所杀。
    growth_range: [3, 7]
    attribute_weights:
      force: 41
      intellect: 18
      defense: 22
      agility: 19

  - key: hist_suitang_0192_zhangyizhi
    name: 张易之
    default_gender: male
    archetype: civil
    flavor: 定州义丰人，初为尚乘奉御，貌美而善音律，人称“五郎”。与弟张昌宗同为武则天晚年近臣，曾任控鹤府监、麟台监，封恒国公，并奉诏参与编修《三教珠英》。兄弟二人恃宠干预朝政，与朝臣多有冲突。705年神龙政变中，二人被张柬之等率羽林军诛杀。
    growth_range: [3, 7]
    attribute_weights:
      force: 15
      intellect: 46
      defense: 20
      agility: 19

  - key: hist_suitang_0193_zhangchangzong
    name: 张昌宗
    default_gender: male
    archetype: civil
    flavor: 定州义丰人，张易之之弟，容貌俊美，人称“六郎”，经太平公主引荐入侍武则天，官至云麾将军，封邺国公，与兄并称“二张”。武则天为兄弟二人置控鹤府，广招文士。兄弟恃宠专权，招致朝臣不满，705年神龙政变中被羽林军杀死。
    growth_range: [3, 7]
    attribute_weights:
      force: 14
      intellect: 46
      defense: 19
      agility: 21

  - key: hist_suitang_0194_weianshi
    name: 韦安石
    default_gender: male
    archetype: civil
