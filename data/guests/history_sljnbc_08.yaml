    default_gender: male
    archetype: civil
    flavor: （327年—353年）字泰临，前凉君主，张骏之子。建兴三十四年（346年）少年继位，任用名将谢艾，多次击退后赵石虎的进攻，保住河西。他在位期间减轻赋役、笼络人心，前凉一度安定。353年病逝，年仅二十七岁，此后前凉内乱渐起。
