    default_gender: male
    archetype: military
    flavor: （335年—357年）字长生，苻健之子，前秦第二位皇帝。他幼年眇一目，性猜忌暴虐，即位后滥杀大臣与宗室，朝野人人自危。寿光三年（357年），苻坚与苻法等发动政变，将其废为越王，不久处死。其在位仅两年，史书多以暴君相称。
