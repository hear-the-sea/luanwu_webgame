    flavor: （生卒年不详）略阳氐人，吕光之父，前秦重臣。他早年追随苻坚，为其亲信，曾向苻坚举荐王猛，使王猛得以入仕。苻生暴政时，他参与拥立苻坚的行动，此后辅佐处理军国事务。其子吕光后来建立后凉，追尊他为景昭皇帝。
