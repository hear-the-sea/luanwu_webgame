  - key: hist_sljnbc_0359
    name: 董卓
    avatar: duck_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （？—192年5月22日）东汉末年权臣，字仲颖，陇西临洮人。他自幼在凉州长大，与羌人交往密切，后投身军旅，在平定羌乱的战争中屡立战功，逐渐成为拥兵自重的边将。中平六年（189年）大将军何进谋诛宦官，召他率军入京。他兵临洛阳时何进已死，他趁乱控制朝廷，废少帝刘辩，立陈留王刘协为帝（汉献帝），自任相国，独揽朝政。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0381
    name: 袁术
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: military
    flavor: （？—199年）东汉末年诸侯，汝南汝阳人，袁绍之弟。出身"四世三公"名门，早年任后将军、南阳太守。董卓之乱后他据有淮南，地盘广阔，兵精粮足。他奢侈无度，生活腐化，却野心勃勃。建安二年（197年）他得到孙坚所获传国玉玺后，在寿春僭号称帝，国号"仲氏"，自取灭亡。他称帝后众叛亲离，吕布、孙策、曹操等群起攻之。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_sljnbc_0383
    name: 马谡
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: civil
    flavor: （190年—228年）蜀汉参军，襄阳宜城人，马良之弟。他才思敏捷，善谈兵法，诸葛亮对其颇为赏识，曾称"马谡言过其实，不可大用"。建兴六年（228年）诸葛亮第一次北伐，命他镇守街亭这一战略要地。他违背诸葛亮"当道扎营"的军令，舍水上山，结果被魏将张郃围困断水，蜀军大败，街亭失守，北伐全盘受挫。诸葛亮挥泪斩马谡，以正军法。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 54
      defense: 20
      agility: 12
  - key: hist_sljnbc_0384
    name: 黄月英
    avatar: monkey_wen_female10.png
    default_gender: female
    archetype: civil
    flavor: （？—？）诸葛亮之妻，沔阳名士黄承彦之女。据《襄阳记》载，黄承彦对诸葛亮说"闻君择妇，身有丑女，黄头黑色，而才堪配"，诸葛亮欣然答应迎娶。当时人笑谈"莫作孔明择妇，正得阿承丑女"。她虽容貌不扬，却才华出众，据说精通机械制作，诸葛亮发明木牛流马等器械或受其启发。她与诸葛亮婚后相夫教子，生育一子诸葛瞻。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0386
    name: 小乔
    avatar: monkey/其他随机角色/文065_女.png
    default_gender: female
    archetype: civil
    flavor: （？—？）江东二乔之妹，周瑜之妻。庐江皖县人，与姐姐大乔并称"江东二乔"，以绝色著称于世。建安四年（199年）孙策攻破皖城后，周瑜娶她为妻，孙策娶其姐大乔，一时传为佳话。她与周瑜情深意笃，伉俪和谐。周瑜风流倜傥、精通音律，她陪伴丈夫走过了赤壁之战的辉煌岁月。建安十五年（210年）周瑜病逝巴丘，年仅三十六岁，她年纪尚轻便守寡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_sljnbc_0387
    name: 潘安
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: （247年—300年）西晋文学家，本名潘岳，字安仁，荥阳中牟人。潘岳容貌俊美，相传少年出行时妇人争相投果，常满载而归，后世遂以“潘安”代称美男子。他与陆机并称“潘陆”，诗赋辞采清绮；任河阳令时遍植桃李，有“河阳一县花”之称。妻杨氏亡后作《悼亡诗》，情辞哀切。永康元年死于赵王伦之乱。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0388
    name: 王献之
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （344年—386年）东晋书法家，字子敬，琅琊临沂人，王羲之第七子，官至中书令，世称“大令”。他自幼随父学书，兼精诸体，行草尤见疏朗俊逸，与其父并称“二王”。先娶郗昙之女郗道茂，后奉诏离婚，尚新安公主。太元十一年病卒。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0390
    name: 谢灵运
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （385年—433年）南朝宋诗人，陈郡阳夏人，谢玄之孙，袭封康乐公，世称“谢康乐”。谢灵运历官永嘉太守、临川内史，寄情山水，常率众凿山浚湖，所制木屐可调节前后齿，人称“谢公屐”。其山水诗刻画精工，名句多出《登池上楼》等篇。元嘉十年获罪被杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
