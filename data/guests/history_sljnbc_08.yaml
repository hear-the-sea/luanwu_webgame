      agility: 20
  - key: hist_sljnbc_0354
    name: 司马伦
    default_gender: male
    archetype: civil
    flavor: （？—301年）西晋赵王，借诛贾南风之名发动政变，随后废惠帝自立。司马伦大肆封官，亲信冠帽不够，便以狗尾续貂，成了“狗尾续貂”的典故；他的帝位只维持短暂，旋即被诸王讨灭。貂尾不够可以拿狗尾补，皇权的空洞却不是加几枚官印能补上的。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0355
    name: 王弥
    default_gender: male
    archetype: military
    flavor: （？—311年）西晋末流民军首领，先在青徐起兵，后归汉赵，曾与刘曜、石勒攻陷洛阳。王弥有才略，能在乱军中聚众转战，却也参与了永嘉之乱的屠掠。流民反抗来自失序的现实，兵锋一旦被权力收编，又会把同样的灾难送回百姓门前。
