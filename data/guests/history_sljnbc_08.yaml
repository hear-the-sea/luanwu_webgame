    default_gender: male
    archetype: military
    flavor: （381年—425年）铁弗匈奴人，原名刘勃勃，后改姓赫连，大夏建立者。他早年依附后秦，后秦衰乱时自立，于407年称天王、大单于，国号大夏。曾征发民力修筑统万城，城墙以蒸土夯实，坚可砺斧。418年攻取长安，即皇帝位。425年去世，大夏后为北魏所灭。
