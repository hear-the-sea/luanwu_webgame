    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: （？—304年）字彦辅，南阳淯阳人，西晋名士，官至尚书令，世称“乐令”。他与王衍并称“王乐”，皆以清谈玄理名重一时。相传有宾客饮酒时见杯中似有蛇影，归家后忧惧成疾；乐广查明是墙上弓弩倒影，复设酒席说明缘由，客病遂愈，后世“杯弓蛇影”即由此而来。八王之乱中他身处朝局，304年去世。
