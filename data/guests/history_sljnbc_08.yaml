  - key: hist_sljnbc_0388
    name: 王献之
    default_gender: male
    archetype: civil
    flavor: （344年—386年）东晋书法家，琅琊临沂人，字子敬，王羲之第七子。他自幼随父学书，勤奋刻苦，后自创新体，书风疏朗妍媚，与父亲并称"二王"，被后世尊为"小圣"。他的行草书尤为精绝，《鸭头丸帖》《中秋帖》等皆为传世名作。他为人风流蕴藉，曾因新安公主仰慕其才貌而被迫离婚另娶，此事令他郁郁不乐。
    growth_range:
    - 5
