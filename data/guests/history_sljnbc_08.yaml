  - key: hist_sljnbc_0361
    name: 吕光
    avatar: monkey_wu_male7.png
    default_gender: male
    archetype: military
    flavor: （337年—399年）字世明，略阳氐人，前秦名将。建元十九年（383年）奉苻坚之命率军远征西域，破龟兹，威震葱岭以东。东归途中得知淝水之战前秦大败，遂据姑臧自立，先称凉州牧、酒泉公，后建立后凉，统治河西十余年，399年病逝。
    growth_range:
    - 3
