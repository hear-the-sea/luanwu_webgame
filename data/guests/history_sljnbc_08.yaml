  - key: hist_sljnbc_0353
    name: 王济
    default_gender: male
    archetype: civil
    flavor: （？—291年）西晋权贵、晋武帝女婿，出入宫禁而极受宠信。王济善骑射，也沉溺士族奢靡，与石崇、王恺等竞逐富贵；后世记下的乳猪、名马和豪宴，比他的政务更响。王济像一柄镶玉的弓，弦上有才，弓背却被声色压得太重。
