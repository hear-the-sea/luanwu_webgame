    default_gender: male
    archetype: civil
    flavor: （？—291年）字武子，太原晋阳人，王浑之子，娶晋武帝女常山公主，官至侍中、太仆。他风姿俊爽，善骑射，兼通《易》《老》《庄》。性好豪侈，衣食珍丽，曾与王恺、石崇等竞相炫富，留下以人乳蒸豚、以钱铺马埒等逸闻。惠帝初年去世。
