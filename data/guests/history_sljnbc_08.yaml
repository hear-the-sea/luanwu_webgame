    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （255年—314年）字士彦，安定乌氏人，西晋凉州刺史，前凉政权的奠基者。永宁元年（301年）出任凉州刺史，永嘉之乱后中原大乱，他保据河西，整饬吏治，兴修水利，招纳流民，并多次遣使向晋室朝贡，以晋臣自居。314年病逝，子孙继续割据凉州。
    growth_range:
