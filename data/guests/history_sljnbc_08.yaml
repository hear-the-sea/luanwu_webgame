    default_gender: male
    archetype: military
    flavor: （？—299年）西晋时氐族首领。元康年间关中饥荒，边地民族矛盾激化，匈奴郝散起事失败后，其弟郝度元再起，秦雍一带氐、羌、卢水胡共推齐万年为首领，拥众据泾阳一带，屡败晋军。元康九年（299年），晋将孟观率军进讨，齐万年兵败被擒杀，关中局势暂告平定。
