  - key: hist_sljnbc_0386
    name: 小乔
    default_gender: female
    archetype: civil
    flavor: （？—？）江东二乔之妹，周瑜之妻。庐江皖县人，与姐姐大乔并称"江东二乔"，以绝色著称于世。建安四年（199年）孙策攻破皖城后，周瑜娶她为妻，孙策娶其姐大乔，一时传为佳话。她与周瑜情深意笃，伉俪和谐。周瑜风流倜傥、精通音律，她陪伴丈夫走过了赤壁之战的辉煌岁月。建安十五年（210年）周瑜病逝巴丘，年仅三十六岁，她年纪尚轻便守寡。
