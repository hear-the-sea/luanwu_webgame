    default_gender: female
    archetype: military
    flavor: （传说人物）中国古代女英雄，事迹主要见于南北朝时期的《木兰辞》。诗中写她代父从军，征战多年而不改女儿身份；凯旋后她拒绝官爵，只愿回乡与家人团聚。关于木兰的历史原型，传世文献没有形成一致结论；游戏中的她，属于源自《木兰辞》的文学传说形象。
