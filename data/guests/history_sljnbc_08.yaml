      defense: 18
      agility: 10
  - key: hist_sljnbc_0397
    name: 郭璞
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （276年—324年）东晋学者、文学家，字景纯，河东闻喜人。郭璞博学多识，注释《尔雅》《山海经》《穆天子传》《方言》等古籍，又工诗赋，所作《游仙诗》寄托高远。他兼通阴阳卜筮，王敦谋反时令其占筮，郭璞直言事必无成，触怒王敦，当日遇害。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 64
