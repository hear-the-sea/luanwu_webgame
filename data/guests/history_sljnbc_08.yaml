      defense: 18
      agility: 12
  - key: hist_sljnbc_0387
    name: 潘安
    default_gender: male
    archetype: civil
    flavor: （247年—300年）西晋文学家，荥阳中牟人，字安仁，本名潘岳。他容貌俊美，风度翩翩，少年时驾车出行，洛阳妇女纷纷掷果相赠以致车满，"掷果盈车"典故由此而来，后世遂以"貌比潘安"形容美男子。他文学造诣极高，与陆机并称"潘陆"，为西晋文坛领袖。其《悼亡诗》悼念亡妻，情真意切，开创悼亡诗之先河。
