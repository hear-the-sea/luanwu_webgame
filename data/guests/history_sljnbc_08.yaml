    default_gender: male
    archetype: civil
    flavor: （？—301年）字子彝，司马懿第九子，封赵王。永康元年（300年）他联合齐王司马冏等发动政变，诛杀贾南风及其党羽，随即废晋惠帝自立，改元建始。此举激起齐王冏、成都王颖、河间王颙等联兵讨伐，伦兵败被囚，同年被赐死，短暂篡位仅数月。
