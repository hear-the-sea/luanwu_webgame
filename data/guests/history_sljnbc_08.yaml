    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0362
    name: 李暠
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （351年—417年）字玄盛，陇西成纪人，西凉建立者。庚子元年（400年）他在敦煌自称凉公，后迁都酒泉，据有河西西部。在位期间重视儒学，设立学校，招揽士人，并维持与周边政权的关系。417年去世，其子李歆继位。唐代皇室追尊他为兴圣皇帝。
