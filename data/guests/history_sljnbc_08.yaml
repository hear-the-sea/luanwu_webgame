    default_gender: male
    archetype: military
    flavor: （？—399年）河西鲜卑秃发部首领，南凉建立者。他先依附后凉吕光，受封广武郡公，后于397年自立，称西平王，据乐都一带，又改称武威王。此后与后凉、北凉、西秦争夺河湟地区，互有胜负。399年因坠马伤重去世，弟秃发利鹿孤继位。
