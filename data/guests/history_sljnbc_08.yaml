      agility: 22
  - key: hist_sljnbc_0357
    name: 乐广
    default_gender: male
    archetype: civil
    flavor: （？—304年）西晋名士、官员，清谈高士，出身寒门而以风神清雅著称。“杯弓蛇影”的故事说他使客人看清杯中蛇影其实来自墙上弓影，解开疑惧。乐广能治一人的心病，却未必能治西晋的国病；名士的清谈在小事上能见智慧，放到乱世仍要面对刀兵。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0358
    name: 王恺
    default_gender: male
    archetype: civil
    flavor: （？—？）西晋外戚，晋武帝舅父，以与石崇斗富闻名。麦糖涂锅、蜡烛当柴、绵延步障和珊瑚树的较量，把士族的富贵写成一场没有尽头的擂台；珊瑚被铁如意击碎，王恺也输了面子。两家比的是财，不是刀，却比刀更能照出西晋末年的腐朽。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0360
    name: 赫连勃勃
    default_gender: male
    archetype: military
    flavor: （381年—425年）大夏建立者，铁弗匈奴人，原名刘勃勃，后改姓赫连。后秦内乱时，他据朔方自立，修筑统万城，以坚城与严酷手段经营北方；“大夏龙雀”刀的传说更给其政权添上冷硬色彩。赫连勃勃善用兵也善造势，统万城像他本人：锋利、坚固，却带着令人不敢近身的寒意。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 12
      defense: 40
      agility: 14
  - key: hist_sljnbc_0361
    name: 吕光
    default_gender: male
    archetype: military
    flavor: （337年—399年）后凉建立者，前秦名将。苻坚命他远征西域，吕光攻取龟兹等地、带回鸠摩罗什；淝水败讯传来后，他率军东归，趁凉州无主据姑臧称王。西域战功让他扬名，前秦崩塌给他王座；将军回头时，才发现后方已经换了主人。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0362
    name: 李暠
    default_gender: male
    archetype: civil
    flavor: （351年—417年）西凉建立者，李广后裔之说为其家族名号增色。李暠据敦煌、酒泉立国，重视儒学与学校，使河西在战乱中保留文教秩序。西凉国小而处在强邻之间，他守住的不只是城池，也是丝路东段的一盏书灯。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0363
    name: 张轨
    default_gender: male
    archetype: civil
    flavor: （255年—314年）前凉奠基者，西晋凉州刺史。中原陷入永嘉乱局时，他据河西整饬吏治、兴修水利、收容流民，以晋室正朔维系地方秩序。张轨没有公开称帝，却把凉州经营成乱世中可避风的长城；名义上的忠与实际的自治，在他手里并不冲突。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0364
    name: 苻生
    default_gender: male
    archetype: military
    flavor: （335年—357年）前秦皇帝，苻健之子，性情暴戾，嗜酒好杀。朝廷中稍有失言便可能招来杀身之祸，宗室大臣终于起兵废杀他；苻生在位不久，却把前秦新建的秩序撕出裂口。独眼并不决定一个人的暴虐，真正可怕的是把猜疑当作治国之法。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0365
    name: 张重华
    default_gender: male
    archetype: civil
    flavor: （327年—353年）前凉君主，少年继位，面对后赵进攻而重用书生谢艾。谢艾以少胜多击败麻秋，河西因此暂得安定；张重华的本领不在亲自挥刀，而在肯把兵符交给真正能打的人。少年主政，最难的不是表现勇，而是识得谁值得用。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0366
    name: 吕婆楼
    default_gender: male
    archetype: civil
    flavor: （？—？）前秦重臣，吕光之父，苻坚早年亲信。苻生暴政时，他参与拥立苻坚的政变，后来辅佐新君处理军国事务；史料对他个人事迹不算多，却能看见其在氐族勋贵中的位置。吕婆楼留下的最锋利遗产不是一把刀，而是把儿子教成能在西域立功的将领。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_sljnbc_0367
    name: 秃发乌孤
    default_gender: male
    archetype: military
    flavor: （？—399年）南凉建立者，河西鲜卑秃发部首领。后凉内乱时，他据乐都立国，在后凉、北凉、西秦之间反复结盟与用兵，努力把部众和地盘拢在一起。南凉国祚短，却不是凭空出现的部落旗号；秃发乌孤把山河、骑兵和联盟缝成了一面新旗。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0368
    name: 段业
    default_gender: male
    archetype: civil
    flavor: （？—401年）北凉初主，原为后凉建康太守，儒生出身。沮渠蒙逊兄弟起兵后推他为主，他有君名却缺兵权，最终因猜忌与方术误信被沮渠蒙逊所杀。段业的败局说明乱世推出来的“文雅君主”若没有自己的军政根基，王冠很容易变成借来的帽子。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0369
    name: 沮渠蒙逊
