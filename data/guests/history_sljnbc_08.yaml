    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）字君夫，东海郯人，文明皇后王元姬之弟，即晋武帝司马炎的舅父，官至后将军。他性极豪奢，与石崇争富：武帝曾赐他一株二尺高的珊瑚树，石崇见后以铁如意击碎，取出六七株三四尺高的珊瑚相示，王恺惘然自失。其事多载于《世说新语》《晋书》。
