heroes:
  blue:
  - key: hist_suitang_0061_gaoxianzhi
    name: 高仙芝
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （生年不详—756年）唐代将领，高句丽人后裔，长期镇守安西四镇。天宝六载率军翻越帕米尔高原，奇袭小勃律，威震西域；天宝十载怛罗斯之战与阿拔斯军队交战失利。安史之乱时与封常清退守潼关，因战局不利被唐玄宗处死，其生涯与唐朝西域经略的盛衰相始终。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 20
      defense: 28
      agility: 14
  - key: hist_suitang_0062_chenziaang
    name: 陈子昂
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: （659年—700年）唐代诗人、官员，梓州射洪人。进士及第后任麟台正字，曾随武攸宜征讨契丹，因直言进谏不被采纳。他主张恢复汉魏风骨，反对齐梁绮靡诗风，代表作《登幽州台歌》苍凉沉郁。后回乡遭县令段简构陷，死于狱中，其诗论对盛唐诗歌影响深远。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 50
      defense: 22
      agility: 16
  - key: hist_suitang_0064_wangchangling
    name: 王昌龄
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （698年—756年）唐代诗人，进士及第，历任秘书省校书郎、汜水尉、江宁丞，后贬龙标尉，世称“王龙标”。其七言绝句成就突出，边塞诗《出塞》与送别诗《芙蓉楼送辛渐》广为传诵，有“七绝圣手”之称。安史之乱中返乡途经亳州，被刺史闾丘晓杀害。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 50
      defense: 22
      agility: 14
  - key: hist_suitang_0065_gaoshi
    name: 高适
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （704年—765年）唐代诗人、官员，渤海蓨人。早年潦倒，曾任封丘尉、河西节度使掌书记。安史之乱中随唐玄宗入蜀，后任淮南节度使参与平定永王李璘，官至刑部侍郎、散骑常侍，封渤海县侯。其边塞诗沉雄质朴，与岑参并称“高岑”，是唐代诗人中仕途较为显达的一位。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 18
      intellect: 48
      defense: 24
      agility: 10
  - key: hist_suitang_0066_censhen
    name: 岑参
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （约715年—约770年）唐代诗人，祖籍南阳。天宝年间两度出塞，先后任安西节度使高仙芝幕府书记、北庭节度判官，亲历边地风光。其边塞诗想象奇崛、气势雄浑，《白雪歌送武判官归京》为代表作。入朝后任库部郎中，晚年出任嘉州刺史，卒于成都，与高适并称“高岑”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 50
      defense: 20
      agility: 18
  - key: hist_suitang_0074_huaisu
    name: 怀素
    avatar: pig/武072.png
    default_gender: male
    archetype: civil
    flavor: （737年—799年）唐代僧人、书法家，长沙人，法名怀素。早年出家，好饮酒，以狂草著称，曾师从邬彤，并得颜真卿指点笔法。其书连绵飞动、气势奔放，与张旭并称“颠张醉素”，传世作品有《自叙帖》《苦笋帖》等，对后世草书影响深远。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 20
      agility: 18
  - key: hist_suitang_0075_lichunfeng
    name: 李淳风
    avatar: monkey/其他随机角色/文_男123.png
    default_gender: male
    archetype: civil
    flavor: （602年—670年）唐代天文学家、历算家，岐州雍人，曾任太史令。他主持修订《麟德历》，参与编撰《晋书》的天文、律历诸志，并著有占候书《乙巳占》。其历法与天文工作在当时颇具影响；民间流传的《推背图》多托名于他，并无可靠依据。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 54
      defense: 22
      agility: 14
  - key: hist_suitang_0076_jianzhen
    name: 鉴真
    avatar: pig/武066.png
    default_gender: male
    archetype: civil
    flavor: （688年—763年）唐代高僧，扬州大明寺住持，精研律学。应日本僧人荣睿、普照邀请，自天宝年间起六次东渡，途中历尽艰险以致双目失明，终于天平胜宝五年抵达日本。他在奈良创建唐招提寺，传授戒律，并带去医药、建筑与雕塑技艺，为中日文化交流留下重要影响。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 54
      defense: 24
      agility: 12
  - key: hist_suitang_0077_heyong
    name: 李克用
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: （856年—908年）唐末沙陀族将领，封晋王，李存勖之父。他率沙陀骑兵参与镇压黄巢起义，收复长安，后据有太原一带，长期与朱温争战。其势力成为五代后唐的根基；临终以三矢遗命其子报仇。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 18
      defense: 30
      agility: 12
  - key: hist_suitang_0079_fengdao
    name: 冯道
    avatar: pig/文048.png
    default_gender: male
    archetype: civil
    flavor: （882年—954年）五代官员，瀛州景城人。历仕后唐、后晋、后汉、后周四朝，多次出任宰相，自号“长乐老”。他主持雕版刊印《九经》，是官方大规模印行儒家经典的较早事例；在战乱中也曾留意抚恤百姓。后周显德元年去世，谥文懿。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 26
      agility: 12
  - key: hist_suitang_0080_qianliu
    name: 钱镠
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （852年—932年）五代吴越国创建者，字具美，杭州临安人。早年从军，平定两浙后受封吴越王，都杭州。他在位期间修筑钱塘江海塘、疏浚太湖流域水利，发展农桑与海外贸易，并向后唐称臣以保境安民。卒后谥武肃，吴越一地在其经营下得以长期安定。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 46
      defense: 26
      agility: 8
  - key: hist_suitang_0081_luobinwang
    name: 骆宾王
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （约619年—约687年）初唐诗人，婺州义乌人，“初唐四杰”之一。相传七岁能诗，曾任侍御史，因事下狱，出狱后随徐敬业起兵反对武则天，撰写《讨武曌檄》，文辞激越。兵败后下落不明，一说被杀，一说亡命为僧。其诗题材开阔，对初唐诗风的转变有所推动。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 50
      defense: 22
      agility: 14
  - key: hist_suitang_0082_yangjiong
    name: 杨炯
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: （650年—692年）初唐诗人，华州华阴人，“初唐四杰”之一。曾任校书郎、崇文馆学士，后出任盈川令，卒于任上。其诗以五言律诗和边塞题材见长，《从军行》中“宁为百夫长，胜作一书生”传诵较广，诗文收入《杨盈川集》。他与王勃等人共同推动初唐诗歌摆脱齐梁余风。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 48
      defense: 24
      agility: 12
  - key: hist_suitang_0083_luzhaolin
    name: 卢照邻
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （约634年—约686年）初唐诗人，幽州范阳人，“初唐四杰”之一。曾任新都尉，后因患风疾辞官，长期卧病，隐居太白山一带。其歌行《长安古意》铺陈都城繁华，寄托兴亡之感，是初唐长篇歌行的代表作。晚年不堪病痛，投水而卒，诗文多散佚，后人辑有集本。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 52
      defense: 20
      agility: 18
  - key: hist_suitang_0084_hezzhang
    name: 贺知章
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: （659年—744年）唐代诗人、书法家，字季真，号四明狂客，越州永兴人。进士及第后长期在朝任职，官至秘书监，人称“贺监”。他性情旷达，晚年上疏请为道士，归乡越州，所作《回乡偶书》《咏柳》传诵至今。相传他在长安初见李白，称其为“谪仙人”，并解金龟换酒。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 50
      defense: 22
      agility: 16
  - key: hist_suitang_0085_wangzhihuan
    name: 王之涣
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （688年—742年）盛唐诗人，曾任冀州衡水主簿、文安县尉，后辞官漫游。他与王昌龄、高适等人交游，擅长描写边塞风光；《登鹳雀楼》《凉州词》气象开阔，是盛唐边塞诗的代表作品。其存诗数量不多，数首名篇流传甚广。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_suitang_0086_zhangruoxu
    name: 张若虚
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （约660年—约720年）唐代诗人，扬州人，曾任兖州兵曹。与贺知章、张旭、包融并称“吴中四士”，生平事迹留存极少。其长篇歌行《春江花月夜》以江月为线索写离情与宇宙之思；今存诗仅数首。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 52
      defense: 20
      agility: 18
  - key: hist_suitang_0087_cuihao
    name: 崔颢
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （约704年—754年）唐代诗人，汴州人，开元年间进士，曾任太仆寺丞、司勋员外郎。早年诗多写闺情，风格纤丽，后漫游边塞，诗风转为雄浑。《黄鹤楼》以即景抒怀、气象苍茫著称，相传李白登楼见此诗而搁笔。今存诗数十首，以《黄鹤楼》最为后人称道。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 50
      defense: 22
      agility: 16
  - key: hist_suitang_0088_yuanzhen
    name: 元稹
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （779年—831年）唐代诗人、官员，河南洛阳人。进士及第后历任监察御史、宰相，仕途几经起落。他与白居易共同倡导新乐府，诗风平易，世称“元白”；传奇《莺莺传》为后世戏曲所取材，另有《元氏长庆集》传世。晚年任武昌军节度使，卒于任上。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 50
      defense: 24
      agility: 12
  - key: hist_suitang_0089_lihe
    name: 李贺
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （790年—816年）唐代诗人，字长吉，福昌人，唐宗室远支。因父名“晋肃”与“进士”音近，避讳不得应进士试，后仅任奉礼郎等微职。其诗想象奇特、辞采瑰丽，多用神话与鬼魅意象，后世有“诗鬼”之称。因体弱多病，二十七岁去世，作品由友人整理成集。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 54
      defense: 18
      agility: 18
  - key: hist_suitang_0090_mengjiao
    name: 孟郊
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （751年—814年）唐代诗人，字东野，湖州武康人。早年屡试不第，四十六岁始中进士，曾任溧阳尉，后入郑余庆幕府。其诗多写贫寒境遇与骨肉之情，与韩愈交谊深厚，并称“韩孟”；《游子吟》语言质朴而情感深挚，流传极广。元和九年赴任途中病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 52
      defense: 20
      agility: 18
  - key: hist_suitang_0048_wentlingyun
    name: 温庭筠
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （约812年—约870年）晚唐诗人、词人，字飞卿，太原祁人。相传他才思敏捷，八叉手而成八韵，人称“温八叉”。曾任方城尉、国子助教，因科场代人作赋及性情不羁而屡遭贬抑。其词多写闺情，辞藻秾丽，被后人视为花间词派的重要开创者，与韦庄并称“温韦”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 52
      defense: 20
      agility: 16
  - key: hist_suitang_0049_xuetao
    name: 薛涛
    avatar: monkey/其他随机角色/文064_女.png
    default_gender: female
    archetype: civil
    flavor: （约768年—约831年）唐代女诗人，字洪度，长安人，后定居成都。她早年入乐籍，脱籍后以诗才与元稹、白居易等文人唱和，晚年居于成都碧鸡坊。相传她嫌笺纸过大，改制为深红色小笺，后人称为“薛涛笺”，流传甚广。其诗清丽婉转，今存数十首，是唐代少数留下姓名的女诗人之一。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 54
      defense: 20
      agility: 16
  - key: hist_suitang_0050_yuxuanji
    name: 鱼玄机
    avatar: monkey/其他随机角色/文064_女.png
    default_gender: female
    archetype: civil
    flavor: （约844年—871年）晚唐女诗人，初名鱼幼薇，字蕙兰，长安人。她曾为补阙李亿之妾，后入咸宜观为女道士，与温庭筠有诗文往来。其诗多写相思与身世之感，辞情婉挚，今存数十首。因婢女绿翘之死受到追究，于咸通十二年获罪被处死，生平与结局在后世多有传说。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 54
      defense: 18
      agility: 18
  purple:
  - key: hist_suitang_0055_yuchigong
    name: 尉迟恭
    avatar: monkey/隋唐与五代/尉迟恭.png
    default_gender: male
    archetype: military
    flavor: （585年-658年）唐初名将，出身行伍，辗转归附秦王，因勇烈与忠诚被重用。玄武门事变中他以武力护卫太宗立足，奠定功臣地位；其后参与征战与镇抚，战场上强悍，朝廷上却懂得收敛锋芒。晚年避开权力旋涡，闭门自守而得善终。后世将其与秦琼并奉为门神，不尽是史实，却说明民间对"护国护门"的武将形象有着长久需要。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 42
      intellect: 14
      defense: 30
      agility: 14
  - key: hist_suitang_0056_qinqiong
    name: 秦琼
    avatar: monkey/隋唐与五代/秦琼.png
    default_gender: male
    archetype: military
    flavor: （571年-638年）唐初将领，早年事隋，隋末辗转瓦岗与诸军，终归唐以战功闻名。其不以奇谋取胜，却以冲锋陷阵与坚忍守阵受人信赖，在统一与平叛战争中多次出力。晚年多病，史载其体弱而仍奉命从征，显示开国功臣的消耗。民间把他塑造成门神之一，既是对其忠勇的赞誉，也折射乱世之后百姓对安定与守护的朴素愿望；传说虽非史笔，却说明其形象深入人心。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 40
      intellect: 16
      defense: 32
      agility: 12
  - key: hist_suitang_0058_lixiaogong
    name: 李孝恭
    avatar: monkey/隋唐与五代/李孝恭.png
    default_gender: male
    archetype: military
    flavor: （591年-640年）唐宗室名将，开国时期长期镇抚南方。其率军平定萧铣、辅公祏等势力，使江汉与江南纳入唐廷版图，军事与行政并举。作为宗室，他既享血缘优势，也更需谨慎避免"宗王拥兵"的疑忌，因此治军与治地方多强调安抚与整饬。凌烟阁功臣中宗室并不多，他以实绩证明宗亲也能成为制度化军政的一部分，是唐初统一进程的重要执行者。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 36
      intellect: 24
      defense: 28
      agility: 12
  - key: hist_suitang_0059_lixiuming
    name: 李秀宁
    avatar: monkey/隋唐与五代/李秀宁.png
    default_gender: female
    archetype: military
