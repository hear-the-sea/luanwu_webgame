  - key: hero_ilrock_04622
    name: 霍步天
    avatar: pig/武021.png
    default_gender: male
    archetype: military
    flavor: 霍家门门主，马荣成漫画《风云》中步惊云曾经敬爱的继父。霍步天接纳随母亲来到霍家的孤僻少年，为他取名霍惊觉，传授霍家剑法，也给予真诚的关怀。雄霸扩张势力时，他不肯屈从招揽，霍家遂遭灭门。幸存的少年带着这段短暂亲情投入天下会，霍步天留下的温暖与霍家的血仇，始终藏在步惊云沉默的心底。
