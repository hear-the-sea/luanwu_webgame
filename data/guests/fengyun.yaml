  - key: hero_ilrock_04646
    name: 独孤鸣
    avatar: pig/武015.png
    default_gender: male
    archetype: military
    flavor: 无双城少主，独孤一方之子，见于马荣成漫画《风云》。独孤鸣以降龙神腿迎敌，凭家世与武艺自视甚高，与聂风等天下会弟子交锋时尤显骄矜。父亲的城池与天下会相争，他也被推到两方冲突的前沿。待无双城遭逢变故，少主的身份不再能替他挡住强敌，家门旧日声势与眼前险境，迫使他独自承担更多重压。
