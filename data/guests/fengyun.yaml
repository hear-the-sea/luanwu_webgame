    - 7
    attribute_weights:
      force: 8
      intellect: 54
      defense: 14
      agility: 24
  - key: hero_ilrock_04632
    name: 孔慈
    avatar: monkey_wen_female3.png
    default_gender: female
    archetype: civil
    flavor: 天下会里温柔的侍女，与秦霜、聂风、步惊云一同长大，见于马荣成漫画《风云》。孔慈熟悉三人的性情，也与他们有着各自不同的感情。雄霸察觉其中牵连后，把她的婚事当成分化弟子的手段，将她许配秦霜。原本相互扶持的少年伙伴，因情意与猜忌渐起争执；身在争端中的她，却没有足以左右自身命运的权势。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 52
      defense: 24
      agility: 16
  - key: hero_ilrock_04639
    name: 颜盈
    avatar: monkey/其他随机角色/文084_女.png
    default_gender: female
    archetype: civil
    flavor: 聂风的母亲，马荣成漫画《风云》中以美貌闻名的女子。颜盈不甘守着平淡生活，向往强者的权势，先后与聂人王、破军、绝无神产生纠葛，后来又成为绝天的母亲。她离开聂家，使聂人王的愤怒与聂风的童年伤痛久久难平。辗转东瀛与中原之后，昔日夫君、儿子与身边强者再度相遇，她也不得不面对亲情里的裂痕。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 52
      defense: 18
      agility: 22
  - key: hero_ilrock_04667
    name: 于楚楚
    avatar: monkey/其他随机角色/文078_女.png
    default_gender: female
    archetype: civil
    flavor: 麒麟臂于岳的女儿，在马荣成漫画《风云》中与重伤的步惊云相遇。于楚楚心地善良，愿意亲近那张冷漠面孔，也渐渐理解他不肯轻易向人诉说的旧伤。跟随步惊云之后，她被卷入断浪对剑晨的操纵与算计，遭受深重伤害，却仍努力守住与亲人相处的日子。刀剑追逐不断逼近，她心中挂念的始终是所爱之人的安危。
