    name: 傲天
    avatar: pig/武078.png
    archetype: military
    flavor: 拜剑山庄少庄主，自幼肩负重振山庄与铸成绝世好剑的重任，因而养成高傲急躁的脾气。他承袭拜剑山庄家传剑法，对绝世好剑势在必得，却在剑祭大典上与步惊云、断浪、剑贪等强敌狭路相逢。面对实力远超自己的风云群雄，他的骄矜与野心终在血火中化为泡影。出自马荣成漫画《风云》
