      agility: 16
  - key: hero_ilrock_04666
    name: 于岳
    avatar: pig/武021.png
    default_gender: male
    archetype: military
    flavor: 麒麟之血沾染手臂，使于岳拥有惊人力量，也令他长年承受异变之苦。马荣成漫画《风云》中，他与女儿于楚楚生活在江湖纷争之外，却始终记着自己曾犯下的过错。重伤失臂的步惊云来到身边时，他决定将麒麟臂转赠给这个年轻人。旧日力量从此随步惊云再入武林，他则把对女儿的牵挂与重新做人的愿望一并留下。
