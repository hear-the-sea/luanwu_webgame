  - key: hero_ilrock_04594
    name: 文丑丑
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: 折扇常在手中，笑脸常在雄霸面前，文丑丑是马荣成漫画《风云》里的天下会总管。他长于察言观色，替帮主管理会务，迎来送往时总能说出讨喜的话。看似只求苟安的小人物，却熟知会中秘密，也渐渐看清雄霸对弟子的猜忌。当秦霜、风云与帮主走向决裂，他终于不再只靠奉承保命，开始设法向昔日同伴传递真相。
    recruitable: true
    growth_range:
