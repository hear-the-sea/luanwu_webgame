  - key: hero_fengyun_0124
    name: 释武尊
    avatar: pig/武077.png
    archetype: military
    flavor: 少林出身的得道高僧，因感念旧恩而担任无双城护法，一手如来神掌刚猛宏大、震慑江湖。天下会大举进犯无双城之际，他为护城中无辜与独孤一方，明知敌众我寡仍坦然迎战步惊云。虽最终血洒长街、壮烈圆寂，其慈悲胸怀与铮铮铁骨却令冷酷的步惊云亦深感敬重。出自马荣成漫画《风云》
