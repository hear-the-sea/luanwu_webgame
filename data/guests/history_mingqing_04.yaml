    flavor: （1624年—1654年）明末秦淮歌妓，侯方域的恋人。李香君拒绝阮大铖的拉拢，抗拒逼婚时撞头血溅扇面；侯方域后来将扇面交给杨龙友，制成《桃花扇》，李香君的晚年事迹已难详考。
