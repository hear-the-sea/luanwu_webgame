      agility: 12
  - key: hist_mingqing_0110
    name: 杨继洲
    avatar: pig_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （约1522年—1620年）名济时，字继洲，号玄洲，浙江衢州人，明代针灸医家。他出身医学世家，曾任太医院医官。万历年间，他为山西巡抚赵文炳治愈痿痹，受其资助，于万历二十九年刊行《针灸大成》十卷，汇集历代针灸文献与家传经验，对后世针灸教育影响深远。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0111
    name: 汪机
    avatar: pig/文040.png
    default_gender: male
    archetype: civil
    flavor: （1463年—1539年）字省之，号石山居士，安徽祁门人，明代新安医家。他早年习儒，后转而习医，承家学行医，著有《石山医案》《医学原理》《读素问钞》《针灸问对》等。临证重视脾胃与气血，善用参、芪补益元气，对丹溪之学有所取舍，为明代新安医学的代表人物。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0112
    name: 徐春甫
    avatar: pig/文040.png
    default_gender: male
    archetype: civil
    flavor: （约1520年—1596年）字汝元，安徽祁门人，明代医家。他曾任太医院医官，嘉靖年间编成《古今医统大全》一百卷，汇辑历代医籍、医论与方术。隆庆年间，他又在北京联络同道组织一体堂宅仁医会，订立会约，是中国古代较早的医家团体。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0113
    name: 武之望
    avatar: pig/文040.png
    default_gender: male
    archetype: civil
    flavor: （1552年—1629年）字叔卿，号阳纡，陕西临潼人，明代官员、医家。万历十七年进士，历官地方，政余精研医学。他取王肯堂《证治准绳·女科》加以评注，编成《济阴纲目》，又整理内科证治为《济阳纲目》，系统汇集妇科病证与历代医论。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0118
    name: 邢侗
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: （1551年—1612年）字子愿，山东临邑人，明代书法家、官员。万历二年进士，官至太仆寺少卿。他精研晋唐法帖，家筑来禽馆，收藏历代碑帖并刻成《来禽馆帖》，与董其昌、米万钟、张瑞图并称晚明书家，著有《来禽馆集》。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0119
    name: 米万钟
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （1570年—1628年）字仲诏，号友石，祖籍陕西，后居北京，明代官员、书画家。万历二十三年进士，官至太仆寺少卿。其书法与董其昌并称“南董北米”；他又爱石成癖，人称“友石先生”，并在北京海淀营造勺园，以园林之胜闻名。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0120
    name: 莫是龙
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: （1537年—1587年）字云卿，华亭（今上海松江）人，明代画家、画论家。他出身书香门第，工诗文书画，与董其昌、陈继儒等交游。所著《画说》分山水画为南北二宗，推崇文人画，对晚明画学发展有先声之功，其作者归属后世亦有争议。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0123
    name: 曾鲸
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: （1564年—1647年）字波臣，福建莆田人，寓居南京，明末肖像画家。他吸收传统线描与设色技法，注重面部结构的明暗烘染，人称“墨骨法”，形成“波臣派”。其笔下多为文人名士肖像，弟子众多，对明清肖像画影响较大。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0125
    name: 梁辰鱼
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （1521年—1594年）字伯龙，号少白，江苏昆山人，明代戏曲家。他科场失意，以例贡入太学，性豪爽，喜游历交游。所作《浣纱记》取材吴越兴亡，以西施、范蠡故事为骨架，是较早为昆山腔创作的长篇传奇，推动了昆曲的传播；另有散曲集《江东白苎》。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0126
    name: 阮大铖
    avatar: pig/文028.png
