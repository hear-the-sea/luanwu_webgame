    default_gender: male
    archetype: civil
    flavor: （1731年—1815年）清代文学家，字姬传，号梦谷，桐城派代表人物。姚鼐曾任刑部郎中、四库全书馆纂修官，乾隆三十九年辞官后主持江南多所书院；他编选《古文辞类纂》，提出义理、考据、辞章兼备的写作主张。
