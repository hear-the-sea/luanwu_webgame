    name: 方苞
    default_gender: male
    archetype: civil
    flavor: （1668年—1749年）清代文学家，字灵皋，号望溪。方苞因戴名世《南山集》案被捕，获释后入翰林，曾参与修撰《三礼》和《四库全书》；他提出古文写作要讲“义法”，著有《方望溪先生全集》。
    growth_range:
