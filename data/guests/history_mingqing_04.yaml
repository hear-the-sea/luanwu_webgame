    default_gender: male
    archetype: civil
    flavor: （1698年—1779年）清代文学家，字才甫，号海峰。刘大櫆长期在书院讲学，曾任黟县教谕、安徽学政；他继承方苞的古文理论，强调文章的“神气、音节、字句”，姚鼐年轻时曾向他学习。
