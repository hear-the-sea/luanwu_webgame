    archetype: civil
    flavor: （1618年—1664年）明末清初诗人、名妓，本名柳隐，字如是。柳如是与钱谦益结缡后居虞山，常与文人唱和；清军南下时，她曾劝钱谦益守节，钱谦益晚年去世后，柳如是在家中自缢。
    growth_range:
    - 5
