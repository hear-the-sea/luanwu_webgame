    avatar: pig_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （1546年—1627年）字仲醇，号慕台，江苏常熟人，明代医家、本草学家。他长期游历行医，访求方药，著有《神农本草经疏》三十卷、《先醒斋医学广笔记》。其学重视脾胃，治法偏重甘寒养阴，善用石膏、麦冬等药，对后世温病学说有所启发。
    growth_range:
