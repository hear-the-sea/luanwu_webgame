    flavor: （1636年—1703年）清代权臣，索尼之子，康熙朝大学士。索额图参与擒拿鳌拜、平定三藩，并作为谈判代表签订《尼布楚条约》；晚年卷入皇太子胤礽的储位争斗，被康熙帝下令幽禁，死于幽所。
