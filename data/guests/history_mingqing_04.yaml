heroes:
  blue:
  - key: hist_mingqing_0129
    name: 方苞
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （1668年—1749年）清代文学家，字灵皋，号望溪，安徽桐城人。他因戴名世《南山集》案入狱，获释后入值南书房，官至礼部右侍郎。论文主张“义法”，要求言有物、言有序，为桐城派开创者，著有《望溪文集》《狱中杂记》等。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0130
    name: 刘大櫆
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （1698年—1779年）清代文学家，字才甫，号海峰，安徽桐城人。他科举屡试不第，长期以教书、游幕为生，曾任黟县教谕。论文继承方苞之说，在《论文偶记》中强调神气、音节与字句，姚鼐曾向他问学，著有《海峰诗文集》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0131
    name: 姚鼐
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （1731年—1815年）清代文学家，字姬传，号梦谷，桐城派代表人物。姚鼐曾任刑部郎中、四库全书馆纂修官，乾隆三十九年辞官后主持江南多所书院；他编选《古文辞类纂》，提出义理、考据、辞章兼备的写作主张。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0145
    name: 柳如是
    avatar: monkey/其他随机角色/文084_女.png
    default_gender: female
    archetype: civil
    flavor: （1618年—1664年）明末清初诗人，本名杨爱，后改名柳隐，字如是，号河东君。她早年流落秦淮，工诗善画，后嫁钱谦益，居常熟绛云楼。清军南下时，相传她劝钱谦益殉国未果；钱谦益去世后，她在家族争产中自尽，著有《湖上草》等。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0146
    name: 李香君
    avatar: monkey_wen_female9.png
    default_gender: female
    archetype: civil
    flavor: （1624年—1654年）明末秦淮歌妓，名香，秦淮八艳之一，与侯方域相恋。相传她拒绝阮大铖的拉拢，抗拒逼婚时以头撞柱，血染诗扇，杨龙友就血痕点染成桃花；孔尚任据此写成传奇《桃花扇》。侯方域《李姬传》记其事迹，晚年行踪已难详考。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0155
    name: 李光地
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: （1642年—1718年）清代大臣、理学家，字晋卿，号厚庵，福建安溪人。康熙朝官至文渊阁大学士，曾举荐施琅统率水师平台湾，并主持编纂《朱子全书》《性理精义》。他为学宗程朱，卒于任上，谥文贞，著有《榕村全集》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0156
    name: 纳兰明珠
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （1635年—1708年）清代大臣，叶赫那拉氏，字端范，满洲正黄旗人。康熙朝官至武英殿大学士，三藩之乱前力主撤藩，又参与收复台湾、防备沙俄等朝政，长期受康熙帝倚重。后与索额图结党相争，为人所劾，被罢去大学士，不复柄用。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0157
    name: 赫舍里·索额图
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （1636年—1703年）清代大臣，赫舍里氏，索尼之子，满洲正黄旗人。康熙八年参与擒拿鳌拜，三藩之乱时入值中枢，康熙二十八年作为首席代表与俄国签订《尼布楚条约》。晚年卷入皇太子胤礽的储位之争，被幽禁，死于禁所。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0108
    name: 吴有性
    avatar: pig/武064.png
    default_gender: male
    archetype: civil
    flavor: （1582年—1652年）明末医学家，字又可，江苏吴县人。崇祯年间疫病流行，他在疫区行医，观察病情，提出疫病由“戾气”从口鼻侵入，与伤寒不同，应另立治法，著成《温疫论》。此书对后世温病学说影响较大，他被视为温病学的重要先驱。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0117
    name: 张景岳
    avatar: pig/文040.png
    default_gender: male
    archetype: civil
    flavor: （1563年—1640年）明代医学家，字介宾，号景岳，浙江山阴人。他早年游历北方，曾投身军旅，中年后专心医道，将《黄帝内经》分类编注为《类经》，又撰《景岳全书》。他重视命门阳气，治虚损多用温补，为明代温补学派的代表。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0121
    name: 孙承宗
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （1563年—1638年）明末大臣，字稚绳，号恺阳，河北高阳人。天启年间以兵部尚书督师辽东，主持修筑关宁锦防线，并提拔袁崇焕等将领，前后经营辽东三年余。崇祯十一年清军攻破高阳，他率家人守城，城破后自尽，年七十六。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0124
    name: 魏良辅
    avatar: monkey_wu_male9.png
    default_gender: male
    archetype: civil
    flavor: （1489年—1566年）明代戏曲音乐家，字师召，江西南昌人，寓居太仓。他吸收海盐腔、余姚腔等长处，改良昆山腔的唱法，形成吐字细腻、行腔婉转的“水磨腔”，并以《曲律》总结演唱要领，为昆曲的形成奠定基础。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0114
    name: 王肯堂
    avatar: pig/文040.png
    default_gender: male
    archetype: civil
    flavor: （1549年—1613年）明代医学家，字宇泰，号损庵，江苏金坛人。万历十七年进士，官至福建参政。他因母病研习医学，广集历代医方，编成《证治准绳》，分科论述内、外、妇、儿等证治；另有笔记《郁冈斋笔麈》，杂涉天文、历法与佛学。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0115
    name: 陈实功
    avatar: pig/文040.png
    default_gender: male
    archetype: civil
    flavor: （1555年—1636年）明代外科医家，字毓仁，号若虚，江苏南通人。他长期在民间行医，擅治痈疽、疮疡，主张内服与外治并重，所著《外科正宗》系统总结外科证治与手术方法。书中列“医家五戒十要”，强调医者应不分贫富、恪守医德。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0116
    name: 李中梓
    avatar: pig_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （1588年—1655年）明末清初医家，字士材，号念莪，松江华亭人。他屡试不第后专攻医术，主张治病兼顾脾肾，提出“脾为后天之本，肾为先天之本”，著有《医宗必读》《内经知要》《本草通玄》等，在江南行医授徒，门人颇多。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0122
    name: 陈洪绶
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （1598年—1652年）明末清初画家，字章侯，号老莲，浙江诸暨人。他工人物、花鸟，画风古拙奇崛，曾为《九歌》《水浒》等作版画插图，《水浒叶子》尤负盛名。明亡后一度出家，又还俗卖画，晚年流寓绍兴、杭州，以画艺自给。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0138
    name: 万斯同
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （1638年—1702年）清初史学家，字季野，号石园，浙江鄞县人，黄宗羲弟子。他以布衣身份应召入明史馆，不署官职、不受俸禄，前后在京二十余年，为《明史》核定体例、删削史稿，出力最多，另著有《儒林宗派》等。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0152
    name: 索尼
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: （1601年—1667年）清初大臣，满洲赫舍里氏，康熙初年四辅政大臣之首。顺治朝他因不附多尔衮一度受挫，顺治帝亲政后复受重用。康熙即位后与鳌拜等同受顾命，晚年称病不预朝政，康熙六年上疏请皇帝亲政，不久病逝，谥文忠。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0154
    name: 施世纶
    avatar: pig/文050.png
    default_gender: male
    archetype: civil
    flavor: （1659年—1722年）清代官员，字文贤，号浔江，施琅之子，汉军镶黄旗人。历任泰州知州、扬州与江宁知府、顺天府尹、漕运总督等职，任内清理积案、开仓赈济、弹劾贪吏，以清廉刚正著称，民间称为“施青天”，卒于漕运总督任上。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0148
    name: 董小宛
    avatar: monkey/其他随机角色/文064_女.png
    default_gender: female
    archetype: civil
    flavor: （1624年—1651年）明末清初秦淮名妓，名白，字青莲，一字小宛，秦淮八艳之一。她与如皋才子冒襄相识后嫁入冒家，居水绘园，侍奉长辈、操持家务，并工诗善画。顺治八年病逝，年仅二十八岁，冒襄撰《影梅庵忆语》追述两人相处始末。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
