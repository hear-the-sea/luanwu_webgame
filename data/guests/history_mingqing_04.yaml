    default_gender: male
    archetype: civil
    flavor: （1635年—1708年）清代权臣，叶赫那拉氏，康熙朝大学士。纳兰明珠参与平定三藩、收复台湾和对俄谈判等政务，曾长期得到康熙帝信任；后来因结党与索额图争斗失势，被罢去大学士，晚年病死。
