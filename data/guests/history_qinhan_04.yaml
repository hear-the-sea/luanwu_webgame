  - key: hist_qinhan_0180
    name: 田蚡
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前131年）西汉外戚、权臣，长陵人，汉武帝生母王娡的同母弟。武帝初年封武安侯，后官至丞相，骄横贪权，任官多出其门，与魏其侯窦婴争田结怨。元光四年灌夫使酒骂座案起，他借机构陷，窦婴、灌夫先后被杀；同年他病中屡见二人为祟，惊惧而死。
