heroes:
  purple:
  - key: hist_qinhan_0151
    name: 马援
    avatar: monkey/秦汉/马援.png
    default_gender: male
    archetype: military
    flavor: （前14年—49年）伏波将军，马革裹尸。他半生戎马，南征交趾，立铜柱为界；北击匈奴，西破羌人。他六十二岁时仍请缨出征，在军中以豪言激励士气。他不仅战功赫赫，更以严谨的家风著称，《诫兄子严敦书》流传千古。史载其晚年因军中物议与诬告受牵连，死后一度被夺爵，这种身后翻案并不罕见：边将功劳再大，也可能在政争与流言里被重新解释。马援留下的，不只是战场记忆，还有一套对后辈的处世警戒——如何守节、如何慎交、如何在功名与风险之间自保。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0153
    name: 主父偃
    avatar: monkey/秦汉/主父偃.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前126年）纵横策士，推恩令主。他出身贫寒，早年备受冷落，入朝后一年四迁。他向武帝提出“推恩令”，允许诸侯王将封地分给子弟，以分割方式持续削弱诸侯国的力量，兵不血刃地缓解长期隐患。他为人刻薄，行事锋利，甚至以“丈夫生不五鼎食，死即五鼎烹”自况，最终被齐王自杀案牵连而族诛。主父偃的悲剧感来自反差：他能提出极具制度穿透力的方案，却无法在权力网络中维持人缘与安全。对武帝而言，策士可以被使用，但绝不会被允许成为不可替代的中心；一旦政策完成、风险上升，主父偃很容易从“奇谋之臣”变成需要被清理的麻烦。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_qinhan_0154
    name: 公孙弘
    avatar: monkey/秦汉/公孙弘.png
    default_gender: male
    archetype: civil
    flavor: （前200年—前121年）西汉丞相，出身寒微而以经术入仕，是武帝朝“儒者入政府”的象征人物之一。史书写公孙弘，常把他放在两种期待之间：一方面他以儒学名义参与政务，使经术更贴近国家制度；另一方面他在权力中心必须讲求可行与折中，于是又容易被批评为圆滑、善顺时势。公孙弘的意义不在于把他当成纯粹的思想家，而在于看见儒学如何被转译为行政语言：如何进入奏章、如何进入官制、如何成为整合人心与官僚的工具。经术一旦入朝，就要面对利益与风险，公孙弘正是在这种现实里完成了上升，也在现实里留下争议。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0166
    name: 扶苏
    avatar: monkey/秦汉/扶苏.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前210年）秦始皇长子。史载他性情较为宽厚，曾因进谏而被遣往北方随军，其处境本就显示秦廷继承问题并不安稳。始皇死后，扶苏与蒙恬遭矫诏赐死，未能继承帝位，成为秦帝国迅速崩塌的关键转折之一。扶苏之死常与赵高操控政局并提，后世据此反思秦制的薄弱点：皇位继承缺乏公开可检验的程序，诏命与印玺集中在少数人手里，便给密室操作留下巨大空间。扶苏并非单纯的“可惜太子”，他更像一面镜子，照见帝国在最高权力交接时的脆弱——当制度无法保障继承，个人再贤也可能被一纸伪诏终结。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0182
    name: 章邯
    avatar: monkey/秦汉/章邯.png
    default_gender: male
    archetype: military
    flavor: （？—前205年）秦末名将。陈胜、吴广起事后，章邯奉命迎击，征发骊山刑徒与戍卒成军，连破陈胜、项梁等部，一度稳住秦廷危局。后在巨鹿与项羽相持，因朝中赵高专权、后援不继，兵败后率部降楚，被项羽封为雍王。楚汉相争时，他据守关中，为汉军所败，最终自杀。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0185
    name: 范增
    avatar: monkey/秦汉/范增.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前204年）楚汉之际谋士，项羽重要智囊，号“亚父”。史载他在关键关口屡劝项羽果断处置对手、把握战机，尤其鸿门宴前后的判断常被后世反复咀嚼。范增的悲剧不在于“不会出主意”，而在于他与主帅的权力关系：谋臣能提出方案，却不能替主帅承担心理负担；当主帅在仁义名声、宗族情感与现实算计之间摇摆时，再高明的策略也可能被搁置。范增愤而离去、途中病亡的结局，使他成为“良谋不被用”的经典符号，但符号背后更值得看的，是乱世决策的真实成本：优柔寡断不是性格小毛病，而可能直接改写天下归属。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 8
      intellect: 56
      defense: 22
      agility: 14
  - key: hist_qinhan_0189
    name: 赵佗
    avatar: monkey/秦汉/赵佗.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前137年）秦末南海龙川人，秦将。秦亡后据岭南自立，建立南越政权，长期与汉廷在“称臣—称王—互市”之间周旋。赵佗的强处不只是能打，更在能“把南方管起来”：一方面沿用秦的郡县与军政框架，保持行政效率；一方面又必须面对百越族群与岭南环境的差异，通过安抚、联姻与贸易等方式稳住地方。对汉廷而言，南越既是边疆安全问题，也是海上与南方资源的门户；而赵佗则在中央力量暂时难以深入的年代，把自己经营成不可忽视的地方王者。理解赵佗，等于理解早期帝国如何在远方建立弹性的统治边界。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0190
    name: 赵高
    avatar: duck_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前207年）秦朝宦官，赵国人，通晓狱法，秦时任中车府令，教胡亥律令。秦始皇死后，他与李斯合谋矫诏，立胡亥为二世，逼死扶苏、蒙恬。此后他诛戮大臣，诬杀李斯，把持朝政，“指鹿为马”即其权势之写照。二世三年，他弑杀胡亥，改立子婴；不久被子婴设计诛杀，夷三族。
    growth_range:
    - 6
    - 10
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0192
    name: 陈胜
    avatar: monkey/其他随机角色/武044_男_.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前208年）秦末起义领袖，阳城人，字涉。秦二世元年，他与吴广率戍卒在大泽乡起义，喊出“王侯将相宁有种乎”，点燃反秦烽火。攻占陈县后，陈胜自立为王，号“张楚”，分遣部将略地，起义迅速蔓延。但内部号令不一，周文兵败，吴广被杀，章邯攻破陈县。陈胜退至下城父，被车夫庄贾杀害，起义由盛转衰。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0195
    name: 刘庄
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （28年—75年）东汉明帝，光武帝刘秀第四子，母为阴丽华。即位后总揽权柄，严察吏治；又崇儒重学，亲临辟雍，命皇族子弟讲经。永平年间，他派窦固等出击北匈奴，取伊吾卢，并遣班超经营西域；又命王景治理黄河，河患稍息。相传佛教亦在此时传入，洛阳白马寺即建于其朝。吏治整肃、边事稳定，是东汉前期的治世。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  blue:
