      agility: 16
  - key: hist_qinhan_0183
    name: 细君公主
    avatar: monkey_wen_female10.png
    default_gender: female
    archetype: civil
    flavor: （生年不详—前101年）西汉宗室女，江都王刘建之女。元封年间，她奉汉武帝之命和亲乌孙，为昆莫猎骄靡的右夫人。因语言风俗不通，她作《悲愁歌》抒写思乡之情；昆莫年老，又命她按乌孙习俗改嫁其孙军须靡，生女少夫。约前101年病逝于乌孙，汉廷随后以解忧公主续嫁，和亲以联乌孙、牵制匈奴。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0184
    name: 缇萦
    avatar: monkey/其他随机角色/文084_女.png
    default_gender: female
    archetype: civil
    flavor: （生卒年不详）西汉临淄人，名医淳于意之女。文帝十三年，淳于意因故获罪，当受肉刑，被押解长安；缇萦随父入京，上书文帝，陈述受刑者肢体残毁、欲改过而无由，愿没入官婢以赎父罪。文帝感其孝诚，下诏减轻肉刑：黥刑改为髡钳，劓刑、斩左趾改笞刑，斩右趾改弃市。缇萦救父成为汉代刑制改革的重要契机。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0188
    name: 袁盎
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前148年）西汉名臣，楚人，后徙居安陵，以敢于直谏著称。文帝时，他曾谏止淮南王刘长骄纵，刘长被废死后又劝文帝分封其子。景帝时与晁错不和，七国之乱中建议诛晁错以谢诸侯。他反对景帝传位梁王刘武，招致梁王怨恨，前148年被梁王遣刺客刺杀。直谏而不善自保，是汉初廷争的典型人物。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0155
    name: 公孙贺
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前92年）西汉重臣，北地义渠人。他娶卫皇后之姊，以外戚受武帝信任，历任太仆、丞相，封葛绎侯。其子公孙敬声任太仆时骄奢不法，擅用北军钱，获罪下狱；公孙贺请求追捕游侠朱安世以赎子罪，反遭朱安世诬告巫蛊。征和元年，父子下狱而死，家族被诛。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0156
    name: 冯劫
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—约前208年）秦朝将领，二世时与右丞相冯去疾、左丞相李斯同列朝堂。陈胜起兵、天下大乱后，三人共同进谏，请停止阿房宫工程、减轻徭役赋税，以缓民困。秦二世大怒，将他们交吏问罪；冯劫不愿受辱，与冯去疾相继自杀。其谏虽未能挽回秦政，却可见秦末君臣在危局中的最后抗争。
