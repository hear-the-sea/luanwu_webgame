heroes:
  purple:
  - key: hist_qinhan_0151
    name: 马援
    default_gender: male
    archetype: military
    flavor: （前14年—49年）伏波将军，马革裹尸。他半生戎马，南征交趾，立铜柱为界；北击匈奴，西破羌人。他六十二岁时仍请缨出征，在军中以豪言激励士气。他不仅战功赫赫，更以严谨的家风著称，《诫兄子严敦书》流传千古。史载其晚年因军中物议与诬告受牵连，死后一度被夺爵，这种身后翻案并不罕见：边将功劳再大，也可能在政争与流言里被重新解释。马援留下的，不只是战场记忆，还有一套对后辈的处世警戒——如何守节、如何慎交、如何在功名与风险之间自保。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0153
    name: 主父偃
    default_gender: male
    archetype: military
    flavor: （生年不详—前126年）纵横策士，推恩令主。他出身贫寒，早年备受冷落，入朝后一年四迁。他向武帝提出“推恩令”，允许诸侯王将封地分给子弟，以分割方式持续削弱诸侯国的力量，兵不血刃地缓解长期隐患。他为人刻薄，行事锋利，甚至以“丈夫生不五鼎食，死即五鼎烹”自况，最终被齐王自杀案牵连而族诛。主父偃的悲剧感来自反差：他能提出极具制度穿透力的方案，却无法在权力网络中维持人缘与安全。对武帝而言，策士可以被使用，但绝不会被允许成为不可替代的中心；一旦政策完成、风险上升，主父偃很容易从“奇谋之臣”变成需要被清理的麻烦。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0154
    name: 公孙弘
    default_gender: male
    archetype: civil
    flavor: （前200年—前121年）西汉丞相，出身寒微而以经术入仕，是武帝朝“儒者入政府”的象征人物之一。史书写公孙弘，常把他放在两种期待之间：一方面他以儒学名义参与政务，使经术更贴近国家制度；另一方面他在权力中心必须讲求可行与折中，于是又容易被批评为圆滑、善顺时势。公孙弘的意义不在于把他当成纯粹的思想家，而在于看见儒学如何被转译为行政语言：如何进入奏章、如何进入官制、如何成为整合人心与官僚的工具。经术一旦入朝，就要面对利益与风险，公孙弘正是在这种现实里完成了上升，也在现实里留下争议。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0166
    name: 扶苏
    default_gender: male
    archetype: civil
    flavor: （生年不详—前210年）秦始皇长子。史载他性情较为宽厚，曾因进谏而被遣往北方随军，其处境本就显示秦廷继承问题并不安稳。始皇死后，扶苏与蒙恬遭矫诏赐死，未能继承帝位，成为秦帝国迅速崩塌的关键转折之一。扶苏之死常与赵高操控政局并提，后世据此反思秦制的薄弱点：皇位继承缺乏公开可检验的程序，诏命与印玺集中在少数人手里，便给密室操作留下巨大空间。扶苏并非单纯的“可惜太子”，他更像一面镜子，照见帝国在最高权力交接时的脆弱——当制度无法保障继承，个人再贤也可能被一纸伪诏终结。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0182
    name: 章邯
    default_gender: male
    archetype: military
    flavor: （生年不详—前205年）秦末名将。陈胜吴广起事后，章邯奉命仓促出战，史载他征发骊山刑徒与戍卒成军，短时间内连破义军，一度把濒临崩裂的秦廷拉回到“还能打”的状态。可他越能打，越暴露秦制的悖论：中央不信任前线，将领得不到稳定的支援与授权；赵高专权、朝命反复，又把军功变成随时可翻案的风险。巨鹿失利后章邯降楚，被项羽封雍王，继而在汉军进关时败亡。写章邯，最该写的是他夹在两种崩坏之间——对外是天下反叛的洪流，对内是中枢失控的撕裂；他用兵再强，也救不了一个已经失去自我修复能力的帝国。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0185
    name: 范增
    default_gender: male
    archetype: civil
    flavor: （生年不详—前204年）楚汉之际谋士，项羽重要智囊，号“亚父”。史载他在关键关口屡劝项羽果断处置对手、把握战机，尤其鸿门宴前后的判断常被后世反复咀嚼。范增的悲剧不在于“不会出主意”，而在于他与主帅的权力关系：谋臣能提出方案，却不能替主帅承担心理负担；当主帅在仁义名声、宗族情感与现实算计之间摇摆时，再高明的策略也可能被搁置。范增愤而离去、途中病亡的结局，使他成为“良谋不被用”的经典符号，但符号背后更值得看的，是乱世决策的真实成本：优柔寡断不是性格小毛病，而可能直接改写天下归属。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0189
    name: 赵佗
    default_gender: male
    archetype: military
    flavor: （生年不详—前137年）秦末南海龙川人，秦将。秦亡后据岭南自立，建立南越政权，长期与汉廷在“称臣—称王—互市”之间周旋。赵佗的强处不只是能打，更在能“把南方管起来”：一方面沿用秦的郡县与军政框架，保持行政效率；一方面又必须面对百越族群与岭南环境的差异，通过安抚、联姻与贸易等方式稳住地方。对汉廷而言，南越既是边疆安全问题，也是海上与南方资源的门户；而赵佗则在中央力量暂时难以深入的年代，把自己经营成不可忽视的地方王者。理解赵佗，等于理解早期帝国如何在远方建立弹性的统治边界。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0159
    name: 刘盈
    default_gender: male
    archetype: civil
    flavor: （前210年—前188年）汉惠帝，刘邦次子。即位时国政多为吕后所握，他能施展的空间有限，因此史书常把他的形象写得温仁而无力。关于“人彘”惨剧，史载其见之震骇，这种震骇并非单纯的情感戏剧，而是对汉初宫廷权力运作的直观冲击：亲情、法度与威慑在同一瞬间被撕开。惠帝在位期间仍有一些制度调整被归到他名下，如对秦代严苛条文的松动与对丞相体系的倚重；这些措施未必都出自他个人意志，却确实推动汉初政治从战争动员转向休养生息。刘盈早逝，使他更像汉初“强力政治”阴影下的一位短命守成者。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0187
    name: 蒙毅
    default_gender: male
    archetype: military
    flavor: （生年不详—前210年）秦将蒙恬之弟，秦始皇近臣。史载他掌管近侍，陪侍始皇巡行，长期处在宫廷中枢。秦始皇死后，赵高、胡亥排斥蒙氏，蒙毅被囚于代，后与蒙恬相继遇害。诏令与时序在传世记载中颇多曲折，但一个近臣在继承风波中的处境，已足见秦廷权力的险峻。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0149
    name: 路博德
    default_gender: male
    archetype: military
    flavor: （生卒年不详）西汉将领，史载其在南越征讨中居重要位置，与楼船将军杨仆等分兵推进，最终促成岭南并入汉廷。南越战事并不只是打一场仗：海陆交通、粮运补给、地方豪强与旧官僚的去留，都决定能否在战后站稳脚跟。史书所写路博德“以招抚为主”等做法，提示他不仅靠武力，也靠对地方人心与利益结构的拿捏；能让对手放下抵抗，有时比杀伤更能节省成本。路博德的经历显出汉代对南方扩张是一套系统工程：军事只是开门，郡县化与行政接管才是长期胜负。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0150
    name: 郑吉
    default_gender: male
    archetype: military
    flavor: （生年不详—前49年）西汉将领，史载为首任西域都护。郑吉的工作性质并不止于“打一仗”，更接近把远域纳入可治理空间：屯田、驻防、联络诸国、处理矛盾、保障通道，都需要长期投入与稳定的行政枢纽。设都护府与幕府的意义也不仅是名号，而是让汉廷在西域拥有持续发号施令与调度资源的抓手，从而把影响力从军事行动延伸到制度存在。郑吉并非只以武力取胜，他更像西域经营的“第一代管家”——既要懂军务，也要懂外交与地方政治，把复杂的多国网络纳入一个可运转的秩序框架。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
