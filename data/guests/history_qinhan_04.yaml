  - key: hist_qinhan_0172
    name: 刘衎
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （前9年—6年）西汉平帝，汉元帝之孙，中山王刘兴之子。哀帝死后无子，王莽迎立年仅九岁的刘衎为帝，改元元始，由王莽以大司马辅政。平帝在位期间，王莽专断朝政，隔绝其母卫氏入京，并逐步培植势力。元始五年，年仅十四岁的平帝去世，史载或疑为王莽毒杀。他死后王莽立孺子婴，西汉名存实亡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0173
    name: 刘骜
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （前51年—前7年）西汉成帝，汉元帝之子，母为王政君。即位后以舅父王凤为大司马大将军，王氏外戚由此把持朝政。他宠爱赵飞燕、赵合德姊妹，先废许皇后，改立赵飞燕为后；因纵情声色，在位二十余年始终无子。绥和二年，刘骜暴死于赵合德宫中，皇位由侄子刘欣继承。外戚与后宫之患，在其朝中同时加深。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0181
    name: 申屠嘉
    avatar: monkey/其他随机角色/文049_男.png
