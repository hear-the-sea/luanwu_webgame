  - key: hist_qinhan_0152
    name: 马融
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: （79年—166年）东汉经学家，字季长，扶风茂陵人，马援从孙。他遍注《周易》《尚书》《毛诗》及三礼，门徒常千余人，郑玄、卢植皆出其门下；又善辞赋、音律。马融曾任南郡太守，因忤大将军梁冀免官，后又依附梁冀，作《西第颂》阿谀，为时论所讥。讲学时前授生徒、后列女乐，生活豪侈。经学成就与士节争议并存。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0158
    name: 刘奭
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （前74年—前33年）西汉元帝，汉宣帝之子。少好儒术，即位后以萧望之、周堪等儒臣辅政，减轻刑罚、宽恤百姓；又委信宦官弘恭、石显，使二人得以干预朝政，儒臣多遭排挤。竟宁元年，匈奴呼韩邪单于来朝，汉匈和亲，边境暂安。柔仁好儒而失于制衡，西汉中后期宦官与外戚之患自此渐显。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0160
    name: 司马谈
    avatar: monkey/其他随机角色/文_男123.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前110年）西汉太史令，司马迁之父。司马谈负责观测天象、制定历法和掌管典籍，著有《论六家要旨》，比较儒、墨、道、法等学派。临终前，他嘱咐司马迁继任太史令并完成史书，司马迁后来因此撰成《史记》。
    growth_range:
