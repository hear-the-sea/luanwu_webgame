  - key: hist_qinhan_0157
    name: 冯去疾
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—约前208年）秦朝右丞相，秦始皇晚年与李斯共同处理朝政。秦二世即位后，他与将军冯劫、左丞相李斯共同进谏，请停止阿房宫工程、减轻徭役，以缓民困。二世大怒，将三人交吏问罪；冯去疾不愿受辱，与冯劫相继自杀。秦末中枢在危局中最后的一次进谏，就此以悲剧收场。
