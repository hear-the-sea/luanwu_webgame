    name: 灌夫
    avatar: pig/武010.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前131年）西汉将领，颍阴人。七国之乱时，其父灌孟战死，灌夫率家奴数十人冲入吴军营垒，重伤而返，由此以勇悍闻名，历任中郎将、淮阳太守、太仆。晚年失势，与魏其侯窦婴交好，因在田蚡婚宴上使酒骂座被劾，元光四年与窦婴同被处死。刚直使气，终以酒席失言招祸。
