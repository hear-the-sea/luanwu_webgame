    name: 左宗棠
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （1812年—1885年）晚清军政重臣、民族英雄，字季高，湖南湘阴人。早年入幕佐军，后领楚军平定浙闽与陕甘，创办福州船政局、兰州制造局推动近代工业。光绪初年力排海防塞防之争，年过六旬抬棺西征，以“缓进急战”之策收复除伊犁外新疆全境，力保西北万里疆土。
