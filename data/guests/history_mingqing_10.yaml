    default_gender: male
    archetype: civil
    flavor: （1873年—1929年）清末民初杰出思想家、学者与政治活动家，字卓如，号任公，广东新会人。师从康有为，公车上书后主编《时务报》，投身戊戌变法；流亡海外期间创办《新民丛报》，首倡“中华民族”与“新史学”。其政论文章笔锋常带感情，著述宏富，辑为《饮冰室合集》。
