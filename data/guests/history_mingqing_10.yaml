    flavor: （1792年—1841年）清代著名思想家、文学家，字璱人，号定庵，浙江仁和人。嘉道年间目睹朝政僵化与边患渐生，著《明良论》《尊隐》等文猛烈抨击时弊，呼吁变法革新，并建议新疆建省。其《己亥杂诗》三百一十五首剑气箫心、瑰丽雄奇，开启近代中国思想启蒙先声。
