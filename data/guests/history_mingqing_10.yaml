  - key: hist_mingqing_0502
    name: 曾国藩
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （1811年—1872年）晚清重臣、战略家与理学家，字伯涵，号涤生，湖南湘乡人。咸丰年间以在籍侍郎组建湘军，历经挫折而攻克安庆、天京，平定太平天国。战后倡导洋务运动，创办安庆内军械所、江南制造总局并派遣幼童留美。其修身治军之法与《曾国藩家书》影响深远。
