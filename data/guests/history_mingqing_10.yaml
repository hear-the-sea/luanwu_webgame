    flavor: （1837年—1909年）晚清洋务重臣，字孝达，号香涛，直隶南皮人。历任两广、湖广总督，主政湖北近二十年，创办汉阳铁厂、湖北枪炮厂、自强学堂并编练新军，使武汉崛起为近代重镇。著《劝学篇》，倡导“中学为体，西学为用”，在晚清工业与教育转型中举足轻重。
