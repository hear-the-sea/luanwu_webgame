    avatar: pig/武049.png
    default_gender: male
    archetype: military
    flavor: （1849年—1894年）清末北洋水师名将，字正卿，广东番禺人。毕业于福州船政学堂，治军严明、精熟海战，任致远舰管带。1894年甲午黄海海战中，致远舰弹药将尽且舰身重创，他毅然下令开足马力撞向日舰吉野号，不幸中鱼雷沉没，坠海后拒不独生，与全舰官兵壮烈殉国。
