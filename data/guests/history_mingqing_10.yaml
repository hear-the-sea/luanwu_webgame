    archetype: military
    flavor: （1818年—1903年）清末抗法名将，字南干，号萃亭，广东钦州人。行伍出身，沉勇善战，历任广西提督。1885年中法战争危机时刻，他以近七旬高龄奉命出山，于镇南关前筑长墙御敌，并亲持长矛率子跃出壕沟肉搏冲锋，取得镇南关大捷并乘胜克复谅山，重创法军。
