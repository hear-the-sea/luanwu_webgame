  - key: hist_mingqing_0505
    name: 李善长
    avatar: pig/文032.png
    default_gender: male
    archetype: civil
    flavor: （1314年—1390年）明朝开国元勋、首任左丞相，字百室，濠州定远人。元末投奔朱元璋，常留守后方筹措军饷、安抚降附，朱元璋比之为汉初萧何。明朝建立后，他主持制定礼法、官制与盐铁钱法，封韩国公，位列开国功臣之首。晚年因胡惟庸案牵连，七十七岁全家遇害。
    growth_range:
    - 6
    - 10
    attribute_weights:
      force: 12
      intellect: 56
      defense: 20
      agility: 12
  - key: hist_mingqing_0506
    name: 魏忠贤
    avatar: duck_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （1568年—1627年）明末权宦，直隶肃宁人。天启年间依附明熹宗乳母客氏，执掌司礼监与东厂，勾结内外官僚形成“阉党”，大兴诏狱残害杨涟、左光斗等东林党人，权势熏天，各地谄媚者甚至为其广建生祠。崇祯帝即位后迅速清算阉党，魏忠贤于贬谪途中自缢身亡。
