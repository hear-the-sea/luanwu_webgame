    name: 李鸿章
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: （1823年—1901年）晚清重臣，字少荃，安徽合肥人。同治初年组建淮军，历任直隶总督兼北洋大臣近三十年。作为洋务运动核心人物，他主持创办江南制造总局、轮船招商局、开平煤矿与北洋水师。晚年屡在国力积弱之际出面交涉外交、签署条约，一生功过交织，折射晚清变局。
