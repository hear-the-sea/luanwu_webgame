    flavor: （1854年—1921年）清末民初启蒙思想家、翻译家与教育家，字又陵，福建侯官人。早年毕业于福州船政学堂并留学英国海军学院，归国后任北洋水师学堂总办。甲午战后译介《天演论》《原富》《法意》等西学名著，以“物竞天择，适者生存”警醒国人，并确立“信、达、雅”译学准则。
