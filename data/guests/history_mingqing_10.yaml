    archetype: civil
    flavor: （1785年—1850年）清代著名政治家、思想家，字元抚，福建侯官人。历任江苏巡抚、湖广总督，兴修水利、整顿吏治。道光十九年以钦差大臣赴粤禁烟，主持虎门销烟，沉重打击鸦片走私；同时组织编译西方书报《四洲志》，被誉为近代中国“开眼看世界第一人”。后虽遭贬戍伊犁，仍兴办坎儿井造福边疆。
