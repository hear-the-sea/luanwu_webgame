    archetype: civil
    flavor: （1645年—1704年）清代著名戏曲家，字昉思，号稗畦，浙江钱塘人。一生坎坷不遇，历时十余年三易其稿，写成传奇巨著《长生殿》，以唐明皇与杨贵妃的爱情悲剧折射安史之乱的家国兴亡。全剧音律严密、词采华美，轰动京师，却因忌日演剧案获罪革籍，与孔尚任并称“南洪北孔”。
