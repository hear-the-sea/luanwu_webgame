    flavor: （1836年—1896年）清末淮军名将、台湾首任巡抚，字省三，安徽合肥人。早年随李鸿章转战东南与中原，中法战争爆发后奉命督办台湾军务，率军民于基隆、淡水顽强抗击法军登陆，保全台湾。战后主政台湾六年，筑铁路、架电报、建学堂、理赋税，开创台湾近代化基业。
