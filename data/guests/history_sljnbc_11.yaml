heroes:
  blue:
  - key: hist_sljnbc_0501
    name: 胡车儿
    default_gender: male
    archetype: military
    flavor: （生卒年不详）胡车儿是张绣麾下悍将，史书写他，多落在“力能负重、奔走如飞”的惊人勇力上。宛城风雨骤起时，他的名字紧挨着曹军受创的记忆出现。此人未必有统军定策之名，却把汉末乱军里“猛将可改一夜胜负”的凶险意味，写得格外分明。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 49
      intellect: 16
      defense: 24
      agility: 11
  - key: hist_sljnbc_0511
    name: 刘繇
    default_gender: male
    archetype: military
    flavor: （156年—197年）刘繇为东汉宗室，历任扬州刺史，曾据曲阿，与袁术、孙策先后角力。江东群雄并起之际，他既有清流名望，也负守土之责，却终究压不住时代翻涌的兵锋。虽未能成就霸业，但在孙氏席卷东南之前，他仍是江东汉家官府最后一层沉稳而黯淡的旧影。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 49
      intellect: 13
      defense: 29
      agility: 9
  - key: hist_sljnbc_0539
    name: 沙摩柯
    default_gender: male
    archetype: military
    flavor: （生卒年不详）沙摩柯为五溪蛮首领，章武年间率部响应蜀汉，随军东出，见于夷陵鏖兵。史笔不多，却足以看出其人山野悍气与部众锋锐。比起中原名将，他更像自溪谷深处拔出的重矛，提醒后人：三国战场从来不只是汉家州郡的棋局，边地豪杰同样能在血火中压出自己的声响。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 49
      intellect: 14
      defense: 28
      agility: 9
  - key: hist_sljnbc_0552
    name: 文丑
    default_gender: male
    archetype: military
    flavor: （生卒年不详）文丑为袁绍帐下名将，与颜良并称河北双壁，勇名久震北方。白马、延津之间，曹袁争锋正烈，他提兵而出，几乎就是袁氏军威最锋利的一角。虽败亡甚速，但这位猛将留下的，不只是“勇”字本身，更是官渡前夕河北霸主那种压得人透不过气的锋芒。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 48
      intellect: 16
      defense: 26
      agility: 10
  - key: hist_sljnbc_0563
    name: 袁熙
    default_gender: male
    archetype: military
    flavor: （？—207年）袁熙为袁绍次子，曾镇守幽州，居北地重镇，也因甄氏婚事而常被后人提及。只是乱世从不容宗门子弟安稳继承，袁氏兄弟兵戎相向之后，他这一支很快便随大势崩散。与其说袁熙败给某一场战，不如说他败给了河北豪门由盛转衰时那股再难收束的离心之潮。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 49
      intellect: 13
      defense: 26
      agility: 12
  - key: hist_sljnbc_0568
    name: 杨奉
    default_gender: male
    archetype: military
    flavor: （生卒年不详）杨奉起自白波军，后卷入献帝东归、关中争夺与河洛形势之中，一时护驾，一时拥兵，行止多变却并非无足轻重。汉末朝廷将倾未倾之际，正是这类人左右着皇权最后的残火。他身上既有草莽武人的粗砺，也有乱世弄潮者的机心，是东汉崩解过程里极典型的一张侧脸。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 47
      intellect: 16
      defense: 27
      agility: 10
  - key: hist_sljnbc_0586
    name: 韩嵩
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）韩嵩为荆州士人，先事刘表，后归曹魏，长于政务筹议，也熟于大势消长。与其说他靠豪语立名，不如说他总能在纷乱局面中把话说到利害处、把事办到分寸间。荆襄士族在政权更替中如何自保、如何任事、如何不失体面，从韩嵩身上都能看见一层克制而老练的光泽。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 13
      intellect: 52
      defense: 20
      agility: 15
  - key: hist_sljnbc_0515
    name: 李傕
    default_gender: male
    archetype: military
    flavor: （生卒年不详）李傕本为董卓部将，董卓死后，他与郭汜等反攻长安，挟天子、据朝廷，把关中搅成血色泥潭。西凉军的悍烈、武人夺权的野蛮，在他身上显得毫无遮掩。若说董卓是掀翻洛阳旧秩序的巨手，李傕便是把那片废墟继续踩得更深的人，令东汉最后一点朝仪都蒙上铁骑与刀兵的尘土。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 17
      defense: 23
      agility: 14
  - key: hist_sljnbc_0523
    name: 孟达
    default_gender: male
    archetype: military
    flavor: （生卒年不详）孟达先依刘璋，后事刘备，又降曹魏，末了再与诸葛亮暗通消息，终于兵败身死。其人并非无能，相反颇有才用，故每到边郡要地，常有人想借他一手稳局。只是他始终站在魏蜀之间那道最薄的冰面上，心机太深，立场太轻，遂成三国夹缝政治里最鲜活也最危险的注脚。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 43
      intellect: 11
      defense: 23
      agility: 23
  - key: hist_sljnbc_0560
    name: 颜良
    default_gender: male
    archetype: military
    flavor: （生卒年不详）颜良为袁绍麾下骁将，与文丑并称，白马城下尤见其锋。曹营闻其来，多有惮色，足见这位河北猛将在当时分量极重。后来虽为关羽斩于阵前，结局快得像一抹寒光，但也正因此，颜良的名字始终带着战阵最前沿那种骤起骤灭的锐意，像一柄刚出鞘便见血的长刀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 48
      intellect: 15
      defense: 28
      agility: 9
  - key: hist_sljnbc_0504
    name: 轲比能
    default_gender: male
    archetype: military
    flavor: （生卒年不详）轲比能为鲜卑首领，能整合诸部，号令草原，势力一度雄踞塞北，并与曹魏长期角逐。他并非只会纵马弯弓的部落酋长，更懂得联盟、统摄与借势，因此才能在北疆风雪之间坐大声名。若从更远处看，此人已不只是边患之主，更是三国北方民族政治重新聚合时绕不开的一座高坡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 11
      defense: 27
      agility: 18
  - key: hist_sljnbc_0512
    name: 刘虞
    default_gender: male
    archetype: military
    flavor: （？—193年）刘虞为汉室宗亲，历任幽州牧，以宽和安边闻名，胡汉多归其心。群雄竞起之际，他仍想依凭名义、教化与仁厚，把北疆秩序拢在汉家旗帜之下。只是这份温和终究敌不过刀马横行，竟死于公孙瓒之手。其人身后清名愈重，也愈让人看清乱世对“正人”二字究竟何其苛薄。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 12
      defense: 27
      agility: 19
  - key: hist_sljnbc_0531
    name: 麴义
    default_gender: male
    archetype: military
    flavor: （生卒年不详）麴义为袁绍部将，以所领先登营精悍善战著称，界桥一役大破公孙瓒白马义从，最能见他用兵之狠与准。河北群雄互吞的年月里，他是真正在战场上替袁绍抢下局面的硬手。后来失宠被诛，结局颇凉，可那一场踏碎白马精骑的锋锐，仍足够让他在乱世名将之列占一席冷亮的位置。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 45
      intellect: 15
      defense: 23
      agility: 17
  - key: hist_sljnbc_0562
    name: 袁尚
    default_gender: male
    archetype: military
    flavor: （生卒年不详）袁尚为袁绍幼子，因受偏爱而得继嗣之势，也因此把袁氏兄弟之争彻底点燃。邺城风雨、兄弟兵戈、外敌压境，这些最坏的局面几乎都压在他身上。若说袁绍留下的是北方最雄厚的家业，那么袁尚接到的却已是一艘开始进水的大船；他越挣扎，越把袁氏覆亡的纹路显得清楚。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 15
      defense: 28
      agility: 15
  green:
  - key: hist_sljnbc_0489
    name: 步阐
    default_gender: male
    archetype: military
    flavor: （生卒年不详）步阐为步骘之子，出身江东名门，久镇西陵，原是东吴西线可倚之人。及至孙皓猜忌日深，他举城降晋，旋即引出一场牵动吴晋边局的大变。西陵城头不过数月风云，却把东吴末年君臣相疑、边镇自危的病灶暴露得极彻底，步阐的名字便因此带上一层沉沉的末世寒意。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 45
      intellect: 16
      defense: 23
      agility: 16
  - key: hist_sljnbc_0490
    name: 爨谷
    default_gender: male
    archetype: military
    flavor: （生卒年不详）爨谷活跃于蜀汉南中，名字常在征伐、抚纳与地方军务的边角处闪现。他未必是史家浓墨重彩的大人物，却立在部族豪强与州郡政令之间，像一根拴住边地局势的硬索。蜀汉要把西南山川真正纳入掌中，靠的从来不只是丞相一纸军令，也有爨谷这类地方人物在暗处撑起的分量。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 13
      defense: 27
      agility: 16
  - key: hist_sljnbc_0491
    name: 虞察
    default_gender: male
    archetype: military
    flavor: （生卒年不详）虞察见载不多，约为三国间地方武职人物，常年辗转在州郡前线。史书只给他寥寥数笔，没有传奇战功，也无赫赫家声，但越是这种人物，越贴近乱世真实的纹理。城要有人守，军令要有人接，败局要有人收拾，虞察便像无数中层将校的缩影，名字不响，肩上却尽是硬差。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 45
      intellect: 16
      defense: 22
      agility: 17
  - key: hist_sljnbc_0493
    name: 丁原
    default_gender: male
    archetype: military
    flavor: （生卒年不详）丁原为东汉末并州刺史，出镇边地，手下最有名的人便是吕布。何进身死、洛阳大乱之际，他本欲拥兵勤王，却反被心腹所杀，身死得极快，也极像那个时代的残酷笔法。丁原未及真正入主中枢，便已倒在权力门槛之前；而他的死，也恰是汉末京师秩序轰然塌陷的开场鼓点。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 43
      intellect: 14
      defense: 25
      agility: 18
  - key: hist_sljnbc_0495
    name: 公孙脩
    default_gender: male
    archetype: military
    flavor: （生卒年不详）公孙脩为辽东公孙氏宗室，身在那片远海寒风中的割据之地，命运几乎与家门兴亡绑在一处。公孙氏盛时据险自雄，朝廷鞭长莫及；等到魏军东来，昔日宗室子弟也只能同赴残局。史书未给他太多篇幅，却足以让人看见辽东孤镇由自立到覆灭时，那种无处可退的苍凉。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 45
      intellect: 16
      defense: 25
      agility: 14
  - key: hist_sljnbc_0497
    name: 顾容
    default_gender: male
    archetype: military
    flavor: （生卒年不详）顾容事迹散见于吴地军务记载，像那类并不抢眼却总被派去扛事的将校人物。比起一战成名的猛将，他更接近守线、调兵、安顿营伍的“实手”，功劳不必轰烈，却少不得。乱世兵火连绵，真正让防线不至一夜崩塌的，往往就是顾容这样的人，名字平，却极有分量。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 47
      intellect: 11
      defense: 26
      agility: 16
  - key: hist_sljnbc_0499
    name: 公孙晃
    default_gender: male
    archetype: military
    flavor: （生卒年不详）公孙晃为辽东公孙氏宗族人物，生在幽海一隅，自幼便活在家族势力的阴影与庇护之下。公孙氏据险自雄时，宗族子弟多半自觉前路宽阔；等到大军压境，才知所谓门第不过潮头一浪。公孙晃虽非辽东局面的主宰者，却正好见证了这座边地小朝廷由繁盛走向崩解的全过程。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 11
      defense: 24
      agility: 21
  - key: hist_sljnbc_0503
    name: 柯吾
    default_gender: male
    archetype: military
    flavor: （生卒年不详）柯吾名不甚显，约活动于边地军政之间，身上兼有部族首领与战时将校的双重颜色。史书对这类人物往往惜墨如金，可真正的边疆摩擦、招抚与反复，偏偏都落在他们身上。柯吾像一块立在风口的石头，不必高大，却总挡在汉地政权与边地豪强彼此试探、彼此撞击的第一线。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 17
      defense: 26
      agility: 13
  - key: hist_sljnbc_0505
    name: 李勖
    default_gender: male
    archetype: military
    flavor: （生卒年不详）李勖见载较简，应为三国间地方武将，长于州郡战事里的守备、调度与整伍。他没有名将那样耀目的战绩，却常出现在真正耗人的位置上：前线要顶，后路要护，兵心还不能散。正因如此，李勖这类人物虽难入传奇，却最能写出乱世前线那种日复一日、磨人筋骨的真实分量。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 47
      intellect: 16
      defense: 23
      agility: 14
  - key: hist_sljnbc_0506
    name: 娄圭
    default_gender: male
    archetype: military
    flavor: （生卒年不详）娄圭字子伯，荆州名士，早年周旋群雄之间，后归曹操，为关中局势出过筹画。此人机略不浅，眼光也狠，常能从纷乱局面里迅速看见利害所系。比起温吞持重的儒生谋臣，娄圭身上自有一股带刺的锐气，像藏在袖中的短刃，平日不轻露，一旦开口，往往便直指局心。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 47
      intellect: 13
      defense: 27
      agility: 13
  - key: hist_sljnbc_0508
    name: 吕威璜
    default_gender: male
    archetype: military
    flavor: （生卒年不详）吕威璜为袁绍部将，官渡前后随军征战，名字虽不如颜良、文丑响亮，却同样是河北军阵里真正能压住场面的硬手。大军对垒时，最吃力的往往不是主帅，而是这种要扛住一线、稳住士气的中坚将领。吕威璜的存在，正让人看见袁氏军锋并非只靠名将招牌，而有一层厚实的底力在下头托着。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 43
      intellect: 15
      defense: 24
      agility: 18
  - key: hist_sljnbc_0509
    name: 令狐浚
    default_gender: male
    archetype: military
    flavor: （生卒年不详）令狐浚事迹分散在州郡军务记载之间，应是那类能战也能守的地方武官。史笔写他，没有惊心动魄的大捷，却总像把他放在最费力的位置上：险地要镇，乱军要整，残局还得有人收。这样的人不靠传奇立名，却常是乱局里最先被想起、也最不容倒下的一根梁木。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 45
      intellect: 18
      defense: 26
      agility: 11
  - key: hist_sljnbc_0513
    name: 吕旷
    default_gender: male
    archetype: military
    flavor: （生卒年不详）吕旷为袁绍部将，常与吕翔并见，河北大战之后又转入曹营。像他这样的将领，既没有资格决定天下归属，也没有余地置身事外，只能在一次次大势翻覆中求取生路。其去留未必关乎忠义高论，却很真实地写出了乱世军人身不由己的一面，刀在手里，命却未必由己。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 16
      defense: 25
      agility: 11
  - key: hist_sljnbc_0516
    name: 李邹
    default_gender: male
    archetype: military
    flavor: （生卒年不详）李邹名见汉末兵事记载，约为活跃于地方战局中的武将人物。史书对他着墨极少，几乎不给性情、出身与结局留白之外的内容，可这份简略反倒更像乱世本身。无数中下层将校皆如此，披甲上阵，奔走四方，最后只剩一笔姓名。李邹之所以值得写，正在于他代表了那一大片被历史风沙迅速掩埋的人。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 23
      agility: 17
  - key: hist_sljnbc_0517
    name: 梁纲
