    - 7
    attribute_weights:
      force: 47
      intellect: 16
      defense: 23
      agility: 14
  - key: hist_sljnbc_0506
    name: 娄圭
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）字子伯，荆州人。少与曹操有旧，后归其帐下。建安十六年潼关之战，曹军渡渭屡为马超骑兵所扰，娄圭献策以沙筑城、灌水使冻，一夜成垒，曹军得以立足。后与习授同车，语涉不逊，为人告发，遂为曹操所杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 47
      intellect: 13
      defense: 27
      agility: 13
  - key: hist_sljnbc_0508
