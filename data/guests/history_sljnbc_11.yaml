    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）辽东襄平人，公孙康嫡子、公孙渊之兄。按任子之制入洛阳为官，实为曹魏牵制辽东的人质。公孙渊在辽东渐露反意，公孙晃多次上表朝廷，言其必反。景初二年公孙渊败亡后，公孙晃仍以连坐与家属同被赐死。
    growth_range:
