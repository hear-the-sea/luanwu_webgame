    name: 胡车儿
    default_gender: male
    archetype: military
    flavor: （生卒年不详）胡车儿是张绣麾下悍将，史书写他，多落在“力能负重、奔走如飞”的惊人勇力上。宛城风雨骤起时，他的名字紧挨着曹军受创的记忆出现。此人未必有统军定策之名，却把汉末乱军里“猛将可改一夜胜负”的凶险意味，写得格外分明。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 49
      intellect: 16
      defense: 24
      agility: 11
  - key: hist_sljnbc_0511
    name: 刘繇
    default_gender: male
    archetype: military
    flavor: （156年—197年）刘繇为东汉宗室，历任扬州刺史，曾据曲阿，与袁术、孙策先后角力。江东群雄并起之际，他既有清流名望，也负守土之责，却终究压不住时代翻涌的兵锋。虽未能成就霸业，但在孙氏席卷东南之前，他仍是江东汉家官府最后一层沉稳而黯淡的旧影。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 49
      intellect: 13
      defense: 29
      agility: 9
  - key: hist_sljnbc_0539
    name: 沙摩柯
    default_gender: male
    archetype: military
    flavor: （生卒年不详）沙摩柯为五溪蛮首领，章武年间率部响应蜀汉，随军东出，见于夷陵鏖兵。史笔不多，却足以看出其人山野悍气与部众锋锐。比起中原名将，他更像自溪谷深处拔出的重矛，提醒后人：三国战场从来不只是汉家州郡的棋局，边地豪杰同样能在血火中压出自己的声响。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 49
      intellect: 14
      defense: 28
      agility: 9
  - key: hist_sljnbc_0552
    name: 文丑
    default_gender: male
    archetype: military
    flavor: （生卒年不详）文丑为袁绍帐下名将，与颜良并称河北双壁，勇名久震北方。白马、延津之间，曹袁争锋正烈，他提兵而出，几乎就是袁氏军威最锋利的一角。虽败亡甚速，但这位猛将留下的，不只是“勇”字本身，更是官渡前夕河北霸主那种压得人透不过气的锋芒。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 48
      intellect: 16
      defense: 26
      agility: 10
  - key: hist_sljnbc_0563
    name: 袁熙
    default_gender: male
    archetype: military
    flavor: （？—207年）袁熙为袁绍次子，曾镇守幽州，居北地重镇，也因甄氏婚事而常被后人提及。袁氏兄弟兵戎相向后，他这一支随河北豪门由盛转衰的潮流崩散，最终败给了再难收束的离心之势。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 49
      intellect: 13
      defense: 26
      agility: 12
  - key: hist_sljnbc_0568
    name: 杨奉
    default_gender: male
    archetype: military
    flavor: （生卒年不详）杨奉起自白波军，后卷入献帝东归、关中争夺与河洛形势之中，一时护驾，一时拥兵，行止多变却并非无足轻重。汉末朝廷将倾未倾之际，正是这类人左右着皇权最后的残火。他身上既有草莽武人的粗砺，也有乱世弄潮者的机心，是东汉崩解过程里极典型的一张侧脸。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 47
      intellect: 16
      defense: 27
      agility: 10
  - key: hist_sljnbc_0586
    name: 韩嵩
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）韩嵩为荆州士人，先事刘表，后归曹魏，长于政务筹议，也熟于大势消长。他总能在纷乱局面中把话说到利害处、把事办到分寸间；荆襄士族在政权更替中的克制与老练，从韩嵩身上都能看见。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 13
      intellect: 52
      defense: 20
      agility: 15
  - key: hist_sljnbc_0515
    name: 李傕
    default_gender: male
    archetype: military
    flavor: （生卒年不详）李傕本为董卓部将，董卓死后，他与郭汜等反攻长安，挟天子、据朝廷，把关中搅成血色泥潭。西凉军的悍烈、武人夺权的野蛮，在他身上显得毫无遮掩。若说董卓是掀翻洛阳旧秩序的巨手，李傕便是把那片废墟继续踩得更深的人，令东汉最后一点朝仪都蒙上铁骑与刀兵的尘土。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 17
      defense: 23
      agility: 14
  - key: hist_sljnbc_0523
    name: 孟达
    default_gender: male
    archetype: military
    flavor: （生卒年不详）孟达先依刘璋，后事刘备，又降曹魏，末了再与诸葛亮暗通消息，终于兵败身死。其人并非无能，相反颇有才用，故每到边郡要地，常有人想借他一手稳局。只是他始终站在魏蜀之间那道最薄的冰面上，心机太深，立场太轻，遂成三国夹缝政治里最鲜活也最危险的注脚。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 43
      intellect: 11
      defense: 23
      agility: 23
  - key: hist_sljnbc_0560
    name: 颜良
    default_gender: male
    archetype: military
    flavor: （生卒年不详）颜良为袁绍麾下骁将，与文丑并称，白马城下尤见其锋。曹营闻其来，多有惮色，足见这位河北猛将在当时分量极重。后来虽为关羽斩于阵前，结局快得像一抹寒光，但也正因此，颜良的名字始终带着战阵最前沿那种骤起骤灭的锐意，像一柄刚出鞘便见血的长刀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 48
      intellect: 15
      defense: 28
      agility: 9
  - key: hist_sljnbc_0504
    name: 轲比能
    default_gender: male
    archetype: military
    flavor: （生卒年不详）轲比能为鲜卑首领，能整合诸部，号令草原，势力一度雄踞塞北，并与曹魏长期角逐。他并非只会纵马弯弓的部落酋长，更懂得联盟、统摄与借势，因此才能在北疆风雪之间坐大声名。若从更远处看，此人已不只是边患之主，更是三国北方民族政治重新聚合时绕不开的一座高坡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 11
      defense: 27
      agility: 18
  - key: hist_sljnbc_0512
    name: 刘虞
    default_gender: male
    archetype: military
    flavor: （？—193年）刘虞为汉室宗亲，历任幽州牧，以宽和安边闻名，胡汉多归其心。群雄竞起之际，他仍想依凭名义、教化与仁厚，把北疆秩序拢在汉家旗帜之下。只是这份温和终究敌不过刀马横行，竟死于公孙瓒之手。其人身后清名愈重，也愈让人看清乱世对“正人”二字究竟何其苛薄。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 12
      defense: 27
      agility: 19
  - key: hist_sljnbc_0531
    name: 麴义
    default_gender: male
    archetype: military
    flavor: （生卒年不详）麴义为袁绍部将，以所领先登营精悍善战著称，界桥一役大破公孙瓒白马义从，最能见他用兵之狠与准。河北群雄互吞的年月里，他是真正在战场上替袁绍抢下局面的硬手。后来失宠被诛，结局颇凉，可那一场踏碎白马精骑的锋锐，仍足够让他在乱世名将之列占一席冷亮的位置。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 45
      intellect: 15
      defense: 23
      agility: 17
  - key: hist_sljnbc_0562
    name: 袁尚
    default_gender: male
    archetype: military
    flavor: （生卒年不详）袁尚为袁绍幼子，因受偏爱而得继嗣之势，也因此把袁氏兄弟之争彻底点燃。邺城风雨、兄弟兵戈、外敌压境，这些最坏的局面几乎都压在他身上。若说袁绍留下的是北方最雄厚的家业，那么袁尚接到的却已是一艘开始进水的大船；他越挣扎，越把袁氏覆亡的纹路显得清楚。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 15
      defense: 28
      agility: 15
  green:
  - key: hist_sljnbc_0489
    name: 步阐
    default_gender: male
    archetype: military
    flavor: （生卒年不详）东吴名臣步骘之子，长期镇守西陵。孙皓朝猜忌加深时，步阐举城归晋；吴将陆抗随即围西陵，晋军援救不及，城破后步阐被杀。西陵本是吴国西线重镇，却在君臣相疑中转成了战场。步阐这一降未能替自己求得安稳，反把东吴末年边将自危的裂缝劈得更开。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 45
      intellect: 16
      defense: 23
      agility: 16
  - key: hist_sljnbc_0490
    name: 爨谷
    default_gender: male
    archetype: military
    flavor: （生卒年不详）南中爨氏相关人物，事迹只在蜀汉西南军政的零星记载中留下痕迹。爨氏所处的南中并非一纸诏令便能驯服的地方，山川、部落与州郡彼此牵制，像一盘没有平整棋面的棋局；地方人物的一次站队，便可能改变边地风向。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 13
      defense: 27
      agility: 16
  - key: hist_sljnbc_0491
    name: 虞察
    default_gender: male
    archetype: military
    flavor: （生卒年不详）虞察的姓名散见于三国军政记录，完整履历已难考。没有可靠材料为他安排显赫门第或一场定鼎大捷，能留下的只是地方军伍中一枚并不耀眼的身影。大时代的战报写主帅，城门、驿路和败军收束却要靠许多无名之人；虞察的分量，正在这几笔没有展开的劳苦里。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 45
      intellect: 16
      defense: 22
      agility: 17
  - key: hist_sljnbc_0493
    name: 丁原
    default_gender: male
    archetype: military
    flavor: （生卒年不详）东汉末并州刺史，率兵入洛阳后任执金吾，麾下有吕布这样的悍将。何进死后，丁原与董卓争夺京师兵权，吕布受董卓利诱，反手将他刺杀。丁原没有来得及成为一方霸主，先在中枢门槛上倒下；可他的死让董卓顺利吞并并州军，也让洛阳的秩序从争执直接滑进了刀光。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 43
      intellect: 14
      defense: 25
      agility: 18
  - key: hist_sljnbc_0495
    name: 公孙脩
    default_gender: male
    archetype: military
    flavor: （生卒年不详）辽东公孙氏相关人物，姓名与家族末局相连，但个人官职、行迹在史料中都很简略。公孙氏据辽东时，山海之远足以让一方政权自成天地；魏军东征后，这座孤镇的宗族成员也难逃覆亡。公孙脩没有被写成独当一面的名将，倒像一枚被家族大势卷走的棋子，正好映出辽东割据从自雄到崩塌的冷意。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 45
      intellect: 16
      defense: 25
      agility: 14
  - key: hist_sljnbc_0497
    name: 顾容
    default_gender: male
    archetype: military
    flavor: （生卒年不详）顾容见于吴地军务记载，与地方军政事务相连。江东的城防、调发与营伍不会因名将不在场便自行运转；他的名字像营门旁一枚旧木牌，朴素，却替这些日常差事留下了凭证。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 47
      intellect: 11
      defense: 26
      agility: 16
  - key: hist_sljnbc_0499
    name: 公孙晃
    default_gender: male
    archetype: military
    flavor: （生卒年不详）辽东公孙氏宗族人物，生平记载不丰，更多只能放回公孙氏割据的大背景中理解。辽东远离中原，家族得以据险自立，宗室子弟一度拥有中原难比的回旋余地；魏军压境、家门覆亡之后，这层庇护也顷刻消散。公孙晃未必主宰过一场战事，却让人看见边地小政权的荣枯如何连着宗族一起沉浮。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 11
      defense: 24
      agility: 21
  - key: hist_sljnbc_0503
    name: 柯吾
    default_gender: male
    archetype: military
    flavor: （生卒年不详）柯吾是三国边地活动人物，具体部属与职衔已难由现存记载坐实。这样的名字通常出现在汉地政权与部族势力往来的缝隙里：或战、或降、或暂时结盟，边令很少能一口气传到山外。柯吾没有留下足以铺成传奇的战绩，却像风口的一块界石，提醒人们边疆的局势从来不是黑白分明的一条线。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 17
      defense: 26
      agility: 13
  - key: hist_sljnbc_0505
    name: 李勖
    default_gender: male
    archetype: military
    flavor: （生卒年不详）李勖的行迹见于三国兵事，身影落在州郡军伍承接命令的日常：守备、调动与整队，都要有人去做。名将负责劈开缺口，李勖这类将校负责让队伍别在缺口前先散掉。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 47
      intellect: 16
      defense: 23
      agility: 14
  - key: hist_sljnbc_0506
    name: 娄圭
    default_gender: male
    archetype: military
    flavor: （生卒年不详）娄圭字子伯，荆州人，后归曹操，曾参与西方军务筹画。史书称其有才略，能从地势、粮道与人心中迅速抓住要害；可他言语锋利，也因此在曹操麾下获罪被杀。娄圭像袖中的短刃，确实能切开乱局，却未必懂得何时收锋。谋士最难的不是看破一时利害，而是让主上愿意听完自己的话。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 47
      intellect: 13
      defense: 27
      agility: 13
  - key: hist_sljnbc_0508
    name: 吕威璜
    default_gender: male
    archetype: military
    flavor: （生卒年不详）袁绍部将，与颜良、文丑等同列河北军中的勇将。吕威璜名声不如前二人响亮，却曾在官渡前后的军阵中担任硬仗角色；大军能摆出声势，靠的不只是主帅和头牌，也靠这些中坚把一线顶住。史书没有给他留下独立传记，正如许多战将的命运：姓名被记下，刀锋却和那场败局一起沉入尘土。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 43
      intellect: 15
      defense: 24
      agility: 18
  - key: hist_sljnbc_0509
    name: 令狐浚
    default_gender: male
    archetype: military
    flavor: （生卒年不详）令狐浚的姓名见于地方军政记载，战报之外，险地守备与乱军收束仍要有人承接；他的名字便留在这些不见旌旗的差事回声里。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 45
      intellect: 18
      defense: 26
      agility: 11
  - key: hist_sljnbc_0513
    name: 吕旷
    default_gender: male
    archetype: military
    flavor: （生卒年不详）袁绍部将，常与吕翔并见于河北军中，袁氏败后转归曹操。吕旷没有独立改变天下的兵力，去留却随着主旗更换而改变；这不是一句“忠”或“逆”便能说尽的处境。乱世军人握着刀，往往先要面对粮道、家属与败局，所谓选择常常是在夹缝中留下的一条活路。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 16
      defense: 25
      agility: 11
  - key: hist_sljnbc_0516
    name: 李邹
    default_gender: male
    archetype: military
    flavor: （生卒年不详）李邹的姓名见于汉末兵事片段。兵荒马乱中，许多中下层将校披甲奔走，最后只剩史官笔下一行字；李邹便让这些被大人物旗帜遮住的人重新露出一点轮廓。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 23
      agility: 17
  - key: hist_sljnbc_0517
    name: 梁纲
    default_gender: male
    archetype: military
    flavor: （生卒年不详）袁术部将，曾在淮南军中任事。梁纲的姓名多与袁术末年的战事相连，未留下足以独立成传的奇谋；但袁术僭号后，军势与人心一同下坠，麾下将领也只能随主上沉浮。若把袁术的帝号看作一面绣得过分花哨的旗，梁纲便是旗下一根被风折断的枪杆，先前确实站过，终究没能撑住。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 47
      intellect: 15
      defense: 24
      agility: 14
  - key: hist_sljnbc_0519
    name: 雷薄
    default_gender: male
    archetype: military
    flavor: （生卒年不详）雷薄原为袁术部将，后来与陈兰等据灊山一带，自成武装。袁术败亡后，旧部不再有稳定粮饷与号令，雷薄的去向便带着浓重的流寇色彩；山险给了他们立足处，也把他们困在逐利与求生之间。这样的将领不适合写成忠勇名将，却很能说明汉末权力真空如何把兵变成一团无主的火。
    growth_range:
    - 3
    - 7
    attribute_weights:
