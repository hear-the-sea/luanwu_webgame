  - key: hist_sljnbc_0490
    name: 爨谷
    avatar: pig_wu_male9.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）建宁郡同乐县人，南中爨氏首领。景元四年蜀汉灭亡，蜀汉旧将霍弋率南中诸郡降魏，仍受命经略交州。霍弋举荐爨谷为交趾太守，命其率军由南中南下，接应反吴的吕兴。交趾道远险阻，爨谷未及抵达便病故途中，部众改由同行诸将统领。爨氏此后世代据有建宁，渐为南中大姓。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 13
      defense: 27
      agility: 16
  - key: hist_sljnbc_0491
    name: 虞察
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）会稽余姚人，东吴征虏将军，为虞喜、虞预之父。虞氏为江东著姓，子弟多以经学、史才闻名。吴亡之际，他坚守城池，不肯降晋，城破后殉难。其子虞喜不入仕途，专治天文历算，提出岁差之说；虞预长于史学，著有《会稽典录》，父子皆有名于江左。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 45
      intellect: 16
