heroes:
  blue:
  - key: hist_sljnbc_0511
    name: 刘繇
    avatar: pig/武049.png
    default_gender: male
    archetype: military
    flavor: （156年—197年）东汉宗室、官员，字正礼，齐悼惠王刘肥之后。刘繇少有清名，被朝廷任为扬州刺史，因袁术盘踞淮南，只得渡江驻于曲阿。他联结地方势力与袁术、孙策相争，部众一度颇盛，然用人不当，终为孙策所破，退往豫章，不久病卒。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 49
      intellect: 13
      defense: 29
      agility: 9
  - key: hist_sljnbc_0539
    name: 沙摩柯
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）东汉末武陵五溪蛮首领。章武元年，刘备东征孙吴，遣马良联络五溪诸蛮，沙摩柯率部响应，随蜀军进至夷陵。猇亭兵败后，蜀军溃散，沙摩柯战死，吴军得其首级。其在《三国演义》中另有射杀甘宁的情节，属小说家言。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 49
      intellect: 14
      defense: 28
      agility: 9
  - key: hist_sljnbc_0552
    name: 文丑
    avatar: monkey/其他随机角色/武047_男.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）文丑为袁绍帐下名将，与颜良并称河北双壁，勇名久震北方。白马、延津之间，曹袁争锋正烈，他提兵而出，几乎就是袁氏军威最锋利的一角。虽败亡甚速，但这位猛将留下的，不只是“勇”字本身，更是官渡前夕河北霸主那种压得人透不过气的锋芒。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 48
      intellect: 16
      defense: 26
      agility: 10
  - key: hist_sljnbc_0563
    name: 袁熙
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （？—207年）袁绍次子。袁绍平定河北后，以袁熙为幽州刺史，镇守北边。官渡之后袁氏内讧，袁谭与袁尚相攻，袁熙与袁尚据守幽州，后为曹操所败，北投乌桓。建安十二年，二人逃往辽东，被公孙康所杀，首级送往曹操。其妻甄氏在邺城陷落后改嫁曹丕。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 49
      intellect: 13
      defense: 26
      agility: 12
  - key: hist_sljnbc_0568
    name: 杨奉
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）杨奉起自白波军，后卷入献帝东归、关中争夺与河洛形势之中，一时护驾，一时拥兵，行止多变却并非无足轻重。汉末朝廷将倾未倾之际，正是这类人左右着皇权最后的残火。他身上既有草莽武人的粗砺，也有乱世弄潮者的机心，是东汉崩解过程里极典型的一张侧脸。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 47
      intellect: 16
      defense: 27
      agility: 10
  - key: hist_sljnbc_0586
    name: 韩嵩
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）东汉末荆州士人，字德高，义阳人。韩嵩为刘表从事中郎，长于政务筹议，在荆襄士人中颇负时望。他曾奉使许都，曹操表为侍中、零陵太守。他回荆州后力劝刘表归附朝廷、遣子为质，触怒刘表而被囚。刘琮降曹后获释，入魏官至大鸿胪。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 13
      intellect: 52
      defense: 20
      agility: 15
  - key: hist_sljnbc_0515
    name: 李傕
    avatar: duck_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）李傕本为董卓部将，董卓死后，他与郭汜等反攻长安，挟天子、据朝廷，把关中搅成血色泥潭。西凉军的悍烈、武人夺权的野蛮，在他身上显得毫无遮掩。若说董卓是掀翻洛阳旧秩序的巨手，李傕便是把那片废墟继续踩得更深的人，令东汉最后一点朝仪都蒙上铁骑与刀兵的尘土。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 17
      defense: 23
      agility: 14
  - key: hist_sljnbc_0523
    name: 孟达
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）孟达先依刘璋，后事刘备，又降曹魏，末了再与诸葛亮暗通消息，终于兵败身死。其人并非无能，相反颇有才用，故每到边郡要地，常有人想借他一手稳局。只是他始终站在魏蜀之间那道最薄的冰面上，心机太深，立场太轻，遂成三国夹缝政治里最鲜活也最危险的注脚。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 43
      intellect: 11
      defense: 23
      agility: 23
  - key: hist_sljnbc_0560
    name: 颜良
    avatar: pig_wu_male9.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）颜良为袁绍麾下骁将，与文丑并称，白马城下尤见其锋。曹营闻其来，多有惮色，足见这位河北猛将在当时分量极重。后来虽为关羽斩于阵前，结局快得像一抹寒光，但也正因此，颜良的名字始终带着战阵最前沿那种骤起骤灭的锐意，像一柄刚出鞘便见血的长刀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 48
      intellect: 15
      defense: 28
      agility: 9
  - key: hist_sljnbc_0504
    name: 轲比能
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）轲比能为鲜卑首领，能整合诸部，号令草原，势力一度雄踞塞北，并与曹魏长期角逐。他并非只会纵马弯弓的部落酋长，更懂得联盟、统摄与借势，因此才能在北疆风雪之间坐大声名。若从更远处看，此人已不只是边患之主，更是三国北方民族政治重新聚合时绕不开的一座高坡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 11
      defense: 27
      agility: 18
  - key: hist_sljnbc_0512
    name: 刘虞
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: （？—193年）刘虞为汉室宗亲，历任幽州牧，以宽和安边闻名，胡汉多归其心。群雄竞起之际，他仍想依凭名义、教化与仁厚，把北疆秩序拢在汉家旗帜之下。只是这份温和终究敌不过刀马横行，竟死于公孙瓒之手。其人身后清名愈重，也愈让人看清乱世对“正人”二字究竟何其苛薄。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 12
      defense: 27
      agility: 19
  - key: hist_sljnbc_0531
    name: 麴义
    avatar: monkey/其他随机角色/武066_男_.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）麴义为袁绍部将，以所领先登营精悍善战著称，界桥一役大破公孙瓒白马义从，最能见他用兵之狠与准。河北群雄互吞的年月里，他是真正在战场上替袁绍抢下局面的硬手。后来失宠被诛，结局颇凉，可那一场踏碎白马精骑的锋锐，仍足够让他在乱世名将之列占一席冷亮的位置。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 45
      intellect: 15
      defense: 23
      agility: 17
  - key: hist_sljnbc_0562
    name: 袁尚
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）袁尚为袁绍幼子，因受偏爱而得继嗣之势，也因此把袁氏兄弟之争彻底点燃。邺城风雨、兄弟兵戈、外敌压境，这些最坏的局面几乎都压在他身上。若说袁绍留下的是北方最雄厚的家业，那么袁尚接到的却已是一艘开始进水的大船；他越挣扎，越把袁氏覆亡的纹路显得清楚。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 15
      defense: 28
      agility: 15
