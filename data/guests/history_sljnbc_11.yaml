  - key: hist_sljnbc_0509
    name: 令狐浚
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （？—249年）本名浚，字公治，太原人，后以令狐愚之名行世。他是扬州刺史（后迁太尉）王凌之甥；令狐愚本人以兖州刺史屯驻平阿。二人见司马懿父子专权，遂谋立楚王曹彪为帝，以图匡扶魏室。事未发而令狐愚病卒。嘉平三年王凌事泄兵败，自尽而死，司马懿追究旧案，令狐愚虽已下葬，仍被发棺暴尸，淮南一系由此尽平。
    growth_range:
