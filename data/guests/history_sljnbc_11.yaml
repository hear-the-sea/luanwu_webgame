    default_gender: male
    archetype: military
    flavor: （生卒年不详）临淮淮阴人，东吴丞相步骘之子。步协死后，步阐继任西陵督，镇守长江上游要冲。凤凰元年，他因惧遭孙皓猜忌，举西陵降晋，晋遣杨肇率军接应。吴将陆抗急围西陵，先破晋援军，城破后步阐被杀，夷及三族。
