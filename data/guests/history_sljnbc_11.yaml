  - key: hist_sljnbc_0505
    name: 李勖
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）东吴监军使者。建衡元年，孙皓命他与督军徐存率军由建安海路南下，会同虞汜、陶璜等部合击交趾。海道险远，行军不利，李勖以建安道不通利，杀导将冯斐，引军退还。孙皓以其擅杀将领、无功而返，将其处死，海路一途自此未再成行。
    growth_range:
