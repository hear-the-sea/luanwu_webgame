    default_gender: male
    archetype: military
    flavor: （生卒年不详）东平人，袁绍、袁尚父子部将，与弟吕翔并以骁勇见用，长期领兵于河北。建安九年曹操围攻邺城，袁尚自平原回救，吕旷兄弟见袁氏大势已去，自阳平率众归降，皆被封为列侯。袁尚军势益孤，不久败走中山，河北遂定。
