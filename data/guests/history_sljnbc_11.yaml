      agility: 17
  - key: hist_sljnbc_0493
    name: 丁原
    avatar: pig/武049.png
    default_gender: male
    archetype: military
    flavor: （？—189年）字建阳，东汉末并州刺史。丁原本出寒门，为人粗略而有武勇，善骑射，张辽、张杨等皆曾在其麾下。灵帝死后，他率并州兵入洛阳，拜执金吾，与董卓争夺朝政。吕布本为其主簿，甚见亲待，董卓诱以利禄，吕布遂杀丁原，并其部众改投董卓，洛阳兵权尽归董氏。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 43
      intellect: 14
      defense: 25
      agility: 18
  - key: hist_sljnbc_0495
    name: 公孙脩
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）辽东襄平人，公孙氏割据辽东的末代子弟，公孙渊之子。景初元年公孙渊自立为燕王，改元绍汉，与曹魏决裂。景初二年司马懿率军东征，围襄平，适逢大雨，辽水暴涨，城中困敝，人相食。城破后公孙渊父子突围东南走，被魏军追斩于梁水之上，公孙氏三世之业至此而终。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 45
      intellect: 16
      defense: 25
      agility: 14
  - key: hist_sljnbc_0497
    name: 顾容
    avatar: monkey_wu_male7.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）吴郡吴县人，东吴将领，官至交州刺史。吴郡顾氏为江东著姓，顾容以军略受任，长期经略岭南。交趾之乱时，吴廷命其驻军合浦，扼守自海道入交州的要冲，与晋军相持经年。晋军来攻，吴军战败，同僚刘俊、修则皆阵亡，交州局势自此逐渐倒向晋方。
    growth_range:
