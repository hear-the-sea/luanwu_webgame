    default_gender: male
    archetype: military
    flavor: （生卒年不详）三国时羌族首领，活动于曹魏与蜀汉对峙的凉州、陇右一带。诸葛亮北伐期间，柯吾曾率部反抗曹魏，其名见于地方记载；因史料零散，部众规模与最终结局均不详。
    growth_range:
