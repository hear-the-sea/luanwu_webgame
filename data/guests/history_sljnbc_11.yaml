    avatar: monkey/其他随机角色/武044_男_.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）袁绍麾下将领。官渡相持时奉命与淳于琼、眭元进同守乌巢，护卫全军粮秣。建安五年曹操引军夜袭乌巢，袁绍仅遣轻骑往救，主力仍攻曹营，救援不及；吕威璜力战不得脱，死于阵中。乌巢一失，袁军粮尽，张郃、高览遂降曹操。
    growth_range:
