  - key: myth_moon_wu_gang
    name: 吴刚
    archetype: military
    avatar: wugang.png
    flavor: （生卒年不详）中国古代月宫神话人物，因触犯天规，被罚在月中砍伐桂树。那株桂树高大异常，斧痕方现便随即愈合，使他的劳作永无尽头。关于获罪缘由，古籍与后世传说说法不一，既有学仙有过之说，也有怠惰受罚之说。“吴刚伐桂”由此成为中秋月宫叙事的重要组成，也常被用来寄托世人对执念、惩戒与无尽劳作的想象。月色之下，桂影婆娑，而他始终停留在那棵永不倒下的树前。
    default_gender: male
    default_morality: 78
    growth_range:
