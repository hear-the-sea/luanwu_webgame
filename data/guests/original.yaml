  - key: orig_crayon_shinchan_purple
    name: 蜡笔小新
    archetype: military
    flavor: 野原新之助，来自春日部的五岁幼稚园小孩，天真、顽皮、胆大又不按常理出牌。他看似总在胡闹，却常能用最直接的行动打破僵局；面对危险时也会为了家人和朋友爆发出惊人的勇气。小新并不靠拳脚取胜，他厉害在谁也猜不到下一步会做什么。越是紧张严肃的场面，他越能用一通胡闹把对手节奏打乱，偏偏还常常误打误撞地把事情办成。
