  - key: orig_edward_purple
    name: 爱德华
    avatar: aidehua.png
    archetype: military
    flavor: 爱德华来自西方，以炼金术士之名游历诸国，既精通金属转化、药剂淬炼，也擅长将复杂的炼成理论用于实战。他始终相信，真正高明的炼金术不该停留于瓶罐与图纸之间，而应能在瞬息万变的战场上化作决定胜负的力量。多年游历与试验，让他将学者的精密与武者的果决熔于一身，举手投足间都带着炉火锻出的冷峻与自信。有人视他为异乡怪杰，也有人敬他为掌控钢铁与火焰的战斗炼金术士，而爱德华只把自己看作不断逼近“真理”的求索者。
