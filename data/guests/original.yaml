  - key: orig_edward_blue
    name: 爱德华
    avatar: aidehua.png
    archetype: military
    flavor: 爱德华出身西方炼金术世家，自幼沉迷于金属转化、药剂淬炼与机关改造之术。与寻常术士不同，他并不满足于在书斋中推演公式，而是执意将炼金术带上战场，用药火、钢铁与爆鸣验证自己的理论。长期与炉火和兵器为伴，使他练就了远超常人的体魄与战斗直觉，也让他在冷静推算之外，多了几分武人的锋锐。对爱德华而言，炼金并非单纯的学问，而是一种足以改造武器、改造战局，甚至改造命运的力量。
    default_gender: male
