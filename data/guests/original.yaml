  - key: myth_moon_jade_rabbit
    name: 玉兔
    archetype: civil
    avatar: yutu.png
    flavor: （生卒年不详）中国古代月宫神话中的灵兔，常与嫦娥、桂树和广寒宫一同出现。传说它终日在月下持杵捣药，所制或为长生不死之药，或为济世仙丹，各地说法不尽相同。古人仰望月面的斑驳阴影，将其想象成白兔伏在药臼旁，玉兔遂成为月亮最鲜明的化身之一。此后它又融入中秋祭月等民间习俗，在诗词、绘画与器物中反复出现，寄托着人们对团圆、安宁与长生的朴素愿望。
    default_gender: female
    default_morality: 90
    growth_range:
    - 4
    - 7
    recruitable: true
    attribute_weights:
      force: 6
      intellect: 38
      defense: 16
      agility: 40
