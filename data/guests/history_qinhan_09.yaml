      agility: 14
  - key: hist_qinhan_0481
    name: 邵骚
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: 邵骚（卒于前208年），秦末赵王武臣的左丞相。陈胜派武臣北略赵地，武臣自立为赵王，以张耳为右丞相、陈馀为大将军，邵骚居左。秦将诈书离间、李良受辱于赵王姊后举兵袭邯郸，邵骚与武臣同被杀，张耳、陈馀因耳目众多得脱。
