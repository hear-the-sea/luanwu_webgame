    default_gender: male
    archetype: civil
    flavor: （生卒年不详）卫国末代君主，史称卫君角。秦二世时，卫国被秦正式吞并，卫君角也失去国祚；他不是州县吏员，而是一个旧诸侯国在帝国车轮下留下的最后名字。卫国延续数百年，终结时没有惊天大战，只有王号被收回、宗庙从此换了主人，乱世最冷的刀往往落得很安静。
