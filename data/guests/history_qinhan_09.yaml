    name: 邢三姑
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: 邢三姑（生卒年不详），秦代女性，云间（今上海松江一带）人，相传本名降圣。其地秦时属会稽郡，她不见于正史，姓名与籍贯主要见于地方传说和后世方志。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 58
      defense: 21
      agility: 5
  - key: hist_qinhan_0467
    name: 项声
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: 项声（生卒年不详），楚汉相争时项氏宗族将领。九江王英布本为项羽所封，叛楚归汉后，项羽派项声与龙且率军攻九江，大破英布；此后项声又与薛公等略定淮北。汉将灌婴进军下邳时将其击败。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 56
      defense: 19
      agility: 12
  - key: hist_qinhan_0469
    name: 辕生
    avatar: monkey/其他随机角色/文061_男.png
    default_gender: male
    archetype: civil
    flavor: 辕生（生卒年不详），楚汉相争时刘邦帐下谋士。汉三年，刘邦困于荥阳，欲退回关中收兵再战，辕生建议他南出武关、深壁不战，使项羽分兵南顾，同时让韩信经营河北、联结燕齐，待楚军力分再图荥阳。刘邦依计行事，局势得以转缓。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 54
      defense: 23
      agility: 8
  - key: hist_qinhan_0470
    name: 蜀卓氏
    avatar: pig/文044.png
    default_gender: male
    archetype: civil
    flavor: 蜀卓氏（生卒年不详），秦汉之际蜀地富商家族。其先为赵人，以冶铁致富；秦破赵后被迁，卓氏夫妻推车而行，不肯就葭萌狭地，自请远徙临邛。当地有铁山，卓氏鼓铸冶铁、运筹经营，富至僮仆千人，田池射猎之乐拟于人君；临邛卓氏至汉武帝时仍有卓王孙，以冶铁富甲一方，其女即卓文君。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 17
      intellect: 56
      defense: 23
      agility: 4
  - key: hist_qinhan_0471
    name: 赵子儿
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: 赵子儿（生卒年不详），汉高祖刘邦后宫美人。她少时与管夫人、薄姬相善，曾相约“先贵无相忘”。薄姬原为魏王豹宫人，魏豹败亡后入汉；赵子儿与管夫人则先得宠幸。二人曾在成皋台上笑谈旧约，刘邦闻讯后召幸薄姬，薄姬遂生代王刘恒，即后来的汉文帝。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 52
      defense: 17
      agility: 17
  - key: hist_qinhan_0473
    name: 刘媪
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: 刘媪（生卒年不详），汉高祖刘邦之母、刘太公之妻，其家世居沛县丰邑中阳里。史书未载其本名，只称“媪”。相传她曾在大泽边歇息，梦与神遇，其后生下刘邦，此为汉家附会受命之说。刘邦称帝后追尊其为昭灵夫人，吕后时又尊为昭灵后。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 57
      defense: 22
      agility: 10
  - key: hist_qinhan_0475
    name: 宛孔氏
    avatar: pig/文044.png
    default_gender: male
    archetype: civil
    flavor: 宛孔氏（生卒年不详），秦汉之际南阳冶铁富商家族。其先为梁人，以铁冶为业，秦伐魏后被迁往南阳。孔氏在当地大举鼓铸，修治陂池，又以车骑交游诸侯，兼通商贾之利，家财至数千金；南阳行商多仿效其排场与经营方式。
    growth_range:
