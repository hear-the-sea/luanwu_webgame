  - key: hist_qinhan_0478
    name: 正先
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: 正先（生卒年不详），秦人。秦末赵高以郎中令、中丞相之职把持朝政，正先曾公开非议其专权，因而被杀。后世记秦末故事者常举此事，以见赵高借诛杀异己立威、朝臣由是噤声之状；其后赵高又害李斯、弑二世，秦廷再无人敢言。
    growth_range:
