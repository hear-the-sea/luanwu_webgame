heroes:
  blue:
  - key: hist_qinhan_0452
    name: 安期生
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）秦汉之际方士，齐地琅琊人，以卖药海上、谈论神仙闻名。相传秦始皇东巡时曾与他交谈，赏赐甚厚；后世又说汉武帝曾遣使寻访。其事多见于《史记·封禅书》及方士传说，后世多将其视为神仙中人。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 15
      intellect: 50
      defense: 16
      agility: 19
  - key: hist_qinhan_0459
    name: 绮里季
    avatar: monkey_wen_male10.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）秦汉之际隐士，商山四皓之一，相传姓吴名实。秦末避乱，与东园公、夏黄公、甪里先生隐居商山。汉高祖晚年欲废太子刘盈，吕后依张良之计迎四皓入朝辅佐，高祖见其名望，遂罢废立之议。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 11
      intellect: 54
      defense: 17
      agility: 18
  - key: hist_qinhan_0526
    name: 蒯彻
    avatar: pig_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）楚汉之际谋士，范阳人。他向韩信分析天下形势，劝其据齐地自立，与刘邦、项羽三分天下，韩信未从。汉朝建立后，刘邦因他劝韩信而欲将其烹杀，蒯彻以“秦失其鹿，天下共逐”自辩，终获赦免。史书因避汉武帝刘彻名讳，多称其为蒯通。
    growth_range:
    - 5
    - 10
    attribute_weights:
      force: 14
      intellect: 51
      defense: 17
      agility: 18
  - key: hist_qinhan_0527
    name: 毛亨
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉经学家，相传为鲁人，一说河间人。秦火之后，他整理并训释《诗经》，作《毛诗故训传》，后将所学传给毛苌。毛诗在东汉以后逐渐取代齐、鲁、韩三家诗，成为流传至今的《诗经》文本。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 15
      intellect: 56
      defense: 23
      agility: 6
  - key: hist_qinhan_0461
    name: 孔鲋
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: （前264年—前208年）秦末儒者，字子鱼，孔子九世孙。秦焚诗书时，相传他将家藏典籍藏于旧宅墙壁中，后世称为“鲁壁藏书”。陈胜起兵后，他应召为博士，随军至陈；陈胜败亡前后去世。其藏书与传经之举，对汉代儒学复兴有象征意义。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 56
      defense: 18
      agility: 14
  - key: hist_qinhan_0476
    name: 巴寡妇清
    avatar: monkey/其他随机角色/文064_女.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）秦代巴郡女商人，名清，夫死后守持家业，经营丹砂矿开采与贸易，积累巨富。她以财力自卫，乡里不敢侵犯。秦始皇曾以宾客之礼召见，并为其修筑“女怀清台”，以示褒扬。其事迹见于《史记·货殖列传》，是先秦秦汉少有的留名女商人。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 15
      intellect: 50
      defense: 20
      agility: 15
  - key: hist_qinhan_0480
    name: 乌氏倮
    avatar: pig/文044.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）秦代乌氏（今甘肃平凉一带）人，边地富商。他经营畜牧，以山谷计马牛之多，又用丝织品与戎王交易，换回成倍牲畜，因而富甲一方。秦始皇时，朝廷准其比照封君，按时与列臣一同朝见。其事迹载于《史记·货殖列传》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 18
      agility: 16
  - key: hist_qinhan_0492
    name: 史禄
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）秦代水利官员，一作监禄。秦始皇南征百越时，他主持开凿灵渠，沟通湘水与漓水，连接长江、珠江两大水系，使军粮与兵员得以水运南下。灵渠此后长期为岭南与中原往来的通道。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 51
      defense: 18
      agility: 19
  - key: hist_qinhan_0495
    name: 朱家
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）秦汉之际鲁地游侠。项羽部将季布被刘邦悬赏通缉，朱家将其收留家中，又通过夏侯婴向刘邦进言，使季布获赦。他仗义疏财，衣食简朴，家中不留余财，以急人之难著称。司马迁在《史记·游侠列传》中记其行事。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 51
      defense: 18
      agility: 17
  - key: hist_qinhan_0496
    name: 随何
    avatar: monkey/其他随机角色/文男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）楚汉之际刘邦麾下谋士，任谒者。刘邦与项羽相持时，他奉命出使九江，向英布陈说利害，促其背楚归汉。英布归附后牵制楚军。汉朝建立后，刘邦曾当众称其为“腐儒”，随何据理自辩，被任为护军中尉，其辩才也为时人所称。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 11
      intellect: 57
      defense: 17
      agility: 15
  - key: hist_qinhan_0508
    name: 屠睢
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）秦代将领，官至尉。秦始皇派他率军南征百越，秦军深入岭南后因地形、补给与越人抵抗陷入苦战。屠睢在作战中遇袭身亡，所部受挫。此后秦廷继续用兵，并由任嚣、赵佗等人经营岭南，最终设置桂林、南海、象郡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 11
      defense: 24
      agility: 21
  green:
  - key: hist_qinhan_0491
    name: 卢敖
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: 卢敖（生卒年不详），秦汉之际方士与游学人物，一说即《史记》所载为秦始皇入海求仙的燕人卢生。相传他曾遍游名山，与方士、士人往来；《淮南子·道应训》记其游于北海、遇异人之事，后世神仙传记又多加附会。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 58
      defense: 23
      agility: 5
  - key: hist_qinhan_0474
    name: 夏无且
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 夏无且（生卒年不详），秦代侍医，随侍秦始皇左右。秦王政二十年（前227年），荆轲献图刺秦，事起仓促，群臣不得持兵；夏无且以随身药囊投击荆轲，秦王得以拔剑自卫。事后秦王赐其黄金二百溢，并称“无且爱我”。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 50
      defense: 16
      agility: 22
  - key: hist_qinhan_0523
    name: 哀章
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: 哀章（生卒年不详），梓潼人，游学长安，好为大言。王莽居摄时，他私造铜匮、金策，诈称天帝与赤帝符命，书中列王莽为真天子，并自列佐命大臣之名，黄昏时持匮送入高庙。王莽借以代汉称帝，建立新朝，哀章因此封国将、美新公，位至四辅。新莽覆亡时，哀章亦被杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 55
      defense: 17
      agility: 14
  - key: hist_qinhan_0518
    name: 董偃
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: 董偃（生卒年不详），西汉人，馆陶公主（窦太主）的宠臣。他少时随母卖珠出入公主家，被公主收养，及长以姿容应对得幸，号“董君”。后经爰叔谋划，献长门园于汉武帝，得武帝召见，称为“主人翁”。东方朔上书指其私侍公主、导上奢侈，武帝遂疏远之，董偃年三十而卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 57
      defense: 21
      agility: 8
  - key: hist_qinhan_0482
    name: 羊千
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: 羊千（又称羊子，生卒年不详），秦始皇时期博士。《汉书·艺文志》儒家类著录《羊子》四篇，注称作者为故秦博士，其书凡百章，今已亡佚。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 17
      intellect: 54
      defense: 17
      agility: 12
  - key: hist_qinhan_0483
    name: 卫君角
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: 卫君角（生卒年不详），姬姓、子南氏，名角，战国卫国末代君主。约前229年继其父卫元君之位，其时卫国仅余野王一地，附属于秦。前221年秦统一六国，卫国犹存；至前209年，秦二世将其废为庶人，卫国祭祀断绝，其国祚延续至秦二世时。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 56
      defense: 16
      agility: 16
  - key: hist_qinhan_0484
    name: 襄彊
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: 襄彊（生卒年不详），秦末被拥立的楚王。陈胜、吴广起兵后建立张楚政权，派葛婴率军徇地蕲县以东。葛婴至东城，为号召楚地反秦，立襄彊为楚王；不久得知陈胜已自立为王，遂杀襄彊以自明，但回到陈县后仍被陈胜处死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 55
      defense: 19
      agility: 11
  - key: hist_qinhan_0485
    name: 阮翁仲
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: 阮翁仲（生卒年不详），相传为秦代巨人，身形高大，一说姓李。秦始皇时命其守临洮，威震匈奴；其死后，始皇铸铜像立于咸阳宫门外。后世陵墓神道两侧所立石人像即称“翁仲”，其名遂由传说人物转为石像通称。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 52
      defense: 16
      agility: 19
  - key: hist_qinhan_0486
    name: 鲍白令之
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: 鲍白令之（生卒年不详），秦始皇时博士，一说为大臣。据《说苑·至公》所载，始皇曾问群臣五帝禅贤、三王世继孰优，令之直言：陛下大兴宫室、役使百姓，行的是桀纣之道，却想比肩禅让之君。始皇怒而诘问，他从容辨析，始皇默然无以应。其言论赖刘向所录而存。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 53
      defense: 18
      agility: 15
  - key: hist_qinhan_0487
    name: 黄疵
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: 黄疵（又作黄公疵，生卒年不详），秦朝博士。《汉书·艺文志》名家类著录《黄公》四篇，注称作者名疵，曾任秦博士，并作有歌诗，其歌诗见于秦时歌诗之列。原书与歌诗均已亡佚，今仅存书目。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 50
      defense: 23
      agility: 15
  - key: hist_qinhan_0488
    name: 陈恢
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: 陈恢（生卒年不详），秦末汉初人，南阳郡守齮的舍人。宛城为南阳郡治，城坚粮足，刘邦围城后本欲弃之西进，陈恢出城进言，劝其约降而不强攻，以免顿兵坚城、腹背受敌。刘邦采纳，封郡守为殷侯，另封陈恢千户，遂得以率军西入武关。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 57
      defense: 16
      agility: 15
  - key: hist_qinhan_0490
    name: 韩谈
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: 韩谈（生卒年不详），秦朝宦官，秦二世末在子婴身边任事。赵高弑二世后立子婴为秦王。子婴在位仅四十六日，称病不朝，与韩谈及二子密谋，待赵高入谒时由韩谈将其刺杀，并夷其三族。韩谈由此见于《史记》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 53
      defense: 23
      agility: 13
  - key: hist_qinhan_0493
    name: 丞相启
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: 丞相启（生卒年不详），秦王政时期秦国丞相，其名见于秦简及兵器铭文。秦制兵器由相邦、丞相督造，铭文多刻监造者官爵姓名；启的任职约在前235年至前222年间，与吕不韦、昌平君等人在位时间相近。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 51
      defense: 22
      agility: 15
  - key: hist_qinhan_0494
    name: 项雎
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 项雎（后改名刘雎，生卒年不详），项伯（项缠）之子。楚汉相争时随父在项羽军中，鸿门宴后其父转助刘邦；汉朝建立，项氏一支受赐刘姓。项伯受封射阳侯，卒后由项雎嗣爵。后项雎因罪被夺去侯位，射阳侯国废除。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 54
      defense: 16
      agility: 19
  - key: hist_qinhan_0497
    name: 项缠
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: 项缠（字伯，后称项伯，生卒年不详），楚国项氏贵族、项羽季父。鸿门宴前夜，他驰告张良，使刘邦预知项羽意图；宴上项庄舞剑，项伯亦拔剑起舞，以身翼蔽刘邦。汉初赐姓刘氏，封射阳侯；其子项雎嗣爵后因罪失侯，射阳侯国废除。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 52
      defense: 23
      agility: 13
  - key: hist_qinhan_0504
    name: 骆甲
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: 骆甲（生卒年不详），秦末汉初将领，原为秦军骑士，熟悉骑战，后归附刘邦。楚汉相争时，汉王择骑将，军中推举骆甲与李必；二人自陈为秦地旧卒，恐士卒不服，请以汉王亲信为帅。刘邦乃拜灌婴为中大夫，以骆甲、李必为左右校尉，同领郎中骑兵，在荥阳以东大破楚骑。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 46
      intellect: 17
      defense: 28
      agility: 9
  - key: hist_qinhan_0507
    name: 苏角
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: 苏角（生卒年不详），秦朝将领。秦末巨鹿之战，他与王离、涉间统率长城军围赵王歇于巨鹿，章邯驻军棘原，筑甬道自黄河输粮。项羽渡河后破釜沉舟，连战九捷，断绝甬道，秦军大溃。苏角力战而死，王离被俘，涉间自焚；秦军在关东的精锐经此一战损失殆尽。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 18
      defense: 24
      agility: 14
  - key: hist_qinhan_0510
    name: 杨熊
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: 杨熊（生卒年不详），秦末秦军将领。前207年，刘邦西进途中与杨熊战于白马，再战于曲遇以东，秦军大败。杨熊退走荥阳；荥阳为秦军屯粮重镇，地处白马、曲遇之西，秦二世遣使在此将其斩首示众。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 27
      agility: 13
  - key: hist_qinhan_0513
    name: 赵贲
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: 赵贲（生卒年不详），秦末秦军将领，驻守开封一带。开封即战国魏都大梁故地，地当鸿沟水运与中原入关要道；秦二世时东方乱起，郡县守将各据城自守。刘邦西进途中与赵贲军交战，曹参等部击破其军。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 28
      agility: 12
  - key: hist_qinhan_0453
    name: 班壹
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: 班壹（生卒年不详），班氏先祖。秦末避乱迁居楼烦，其地近边，畜牧之利甚厚。班壹经营马牛羊，至数千群。汉初边地弛禁，他以财力雄于边郡，出入弋猎、旌旗鼓吹，年百余岁而终。后世班氏徙居扶风安陵，班彪、班固即出其族。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 58
      defense: 18
      agility: 11
  - key: hist_qinhan_0455
    name: 共尉
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: 共尉（又作共驩，生卒年不详），临江王共敖之子。共敖原为楚怀王柱国，项羽分封诸侯时据江陵为临江王；其卒后，共尉继立。汉五年（前202年），刘邦遣卢绾、刘贾围攻江陵，围城数月，共尉出降，被押至洛阳处死，临江国随之废除。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 52
      defense: 21
      agility: 15
  - key: hist_qinhan_0456
    name: 韩终
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: 韩终（生卒年不详），战国末至秦代方士，一作韩众。秦始皇好神仙方术，屡遣方士入海求蓬莱等三神山；东巡碣石后，又命韩终与侯公、石生寻求仙人与不死之药。韩终此后未返，下落不明，后世神仙传记中多有附会。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 55
      defense: 21
      agility: 9
  - key: hist_qinhan_0458
    name: 胡毋敬
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 胡毋敬（又作胡母敬，生卒年不详），秦朝太史令、文字学家。秦统一后推行“书同文”，李斯作《仓颉篇》、赵高作《爰历篇》、胡毋敬作《博学篇》，三篇皆取史籀大篆加以省改，形成小篆，颁行天下作为识字与书写范本。汉初闾里书师将三篇合编，统称《仓颉篇》，其影响延续至汉代。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 57
      defense: 22
      agility: 7
  - key: hist_qinhan_0460
    name: 孔树
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: 孔树（又作孔祔，字子文，生卒年不详），孔子九世孙，孔谦之子，孔鲋与孔腾之兄弟。秦末孔鲋相传藏经于旧宅壁中，汉初孔腾受封奉祀君；孔树本人事迹仅见于孔氏世系，未列官职，生平事迹无考。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 57
      defense: 19
      agility: 11
  - key: hist_qinhan_0515
    name: 丁缓
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: 丁缓（生卒年不详），西汉长安巧匠。相传他造七轮扇，七轮相连、轮径皆丈，一人运转即满堂生风；又作被中香炉，以机环回转，炉体始终持平，可置于被褥之间；另有常满灯等奇巧器物。这些记载多见于《西京杂记》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 50
      defense: 17
      agility: 19
  - key: hist_qinhan_0516
    name: 刁间
    avatar: pig/文044.png
    default_gender: male
    archetype: civil
    flavor: 刁间（又作刀间，生卒年不详），西汉齐地商人。齐俗轻贱奴仆，刁间偏加任用，收容他人视为难制的黠奴，派其经营渔盐与商贾之利，甚至听其乘车骑交结郡守国相。奴仆乐为尽力，刁间由此起富数千万，其事见《史记·货殖列传》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 57
      defense: 18
      agility: 12
  - key: hist_qinhan_0517
    name: 杜穉季
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: 杜穉季（生卒年不详），西汉霸陵人，关中游侠。霸陵为文帝陵邑，地处长安东郊，豪族游侠多聚居于此。杜穉季交结外戚、列侯，凭声势在关中行事无所顾忌，其名附见于《汉书》所记长安一带的豪侠之中。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 52
      defense: 22
      agility: 13
  - key: hist_qinhan_0519
    name: 樊少翁
    avatar: pig/文044.png
    default_gender: male
    archetype: civil
    flavor: 樊少翁（生卒年不详），西汉长安商人。豆豉以豆发酵制成，耐贮易运，为汉代都市常见调味之物；樊少翁以制作、贩卖豆豉起家，家赀至巨万，京师称为“长安豉”，在当时以贩豉列名富商。后世南昌豆豉业者相传奉其为行业祖师。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 53
      defense: 19
      agility: 12
  - key: hist_qinhan_0521
    name: 郭舍人
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 郭舍人（生卒年不详），汉武帝时宫中幸倡，以诙谐善辩常侍左右。他曾与东方朔以射覆、隐语相难，朔应声而答，舍人终不能屈；《史记·滑稽列传》褚少孙所补东方朔事中留有其言行，后世遂将他与东方朔并列为宫廷滑稽之士。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 50
      defense: 16
      agility: 21
  - key: hist_qinhan_0522
    name: 胡毋生
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: 胡毋生（又作胡母生，字子都，生卒年不详），西汉齐人，专治《春秋公羊传》。汉景帝时立为博士，与董仲舒同业；后以年老归乡教授，齐地讲《春秋》者多出其门下，公孙弘亦曾从受其学。公孙弘后官至丞相、封平津侯，公羊学由此渐盛。胡毋生与董仲舒并称汉初公羊学的重要经师。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 52
      defense: 19
      agility: 14
  - key: hist_qinhan_0524
    name: 金王孙
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: 金王孙（生卒年不详），西汉人，王娡的前夫。王娡之母臧儿听信卜者“两女皆当贵”之言，强行将已嫁的金氏女接回，送入太子宫中，金王孙虽怒而不能阻。王娡后生汉武帝，金王孙所出之女金俗在武帝时被寻访封为修成君。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 57
      defense: 23
      agility: 9
  - key: hist_qinhan_0528
    name: 谬忌
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: 谬忌（生卒年不详），西汉方士，亳人。汉武帝时，他上书陈说太一之祀，称天神以太一为贵、五帝为其辅佐，古时天子春秋祭太一于东南郊。武帝令太祝在长安东南郊立祠，依其方常祀，太一由此成为汉廷郊祀中的最高神位。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 51
      defense: 23
      agility: 14
  - key: hist_qinhan_0529
    name: 桥桃
    avatar: pig/文029.png
    default_gender: male
    archetype: civil
    flavor: 桥桃（又作桥姚，生卒年不详），西汉边地商人。汉廷开拓边塞、移民实边之际，他经营畜牧，已有马千匹、牛两千头、羊万头，积粟以万钟计。边郡军需与交通仰赖马牛，桥姚因此富名于时，其事迹见于《史记·货殖列传》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 55
      defense: 22
      agility: 10
  - key: hist_qinhan_0531
    name: 师史
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 师史（生卒年不详），西汉初年周人，居洛阳，以贩运致富。洛阳地处齐、秦、楚、赵之间，为四方商路枢纽；师史动用数百辆车转运货物，行贾遍及诸郡国。当地贫民多投富家学习经商，久出在外、过邑不入家门，师史借此人力积累至七千万。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 56
      defense: 19
      agility: 10
  - key: hist_qinhan_0534
    name: 田子春
    avatar: pig_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 田生（字子春，生卒年不详），西汉齐人，游士。吕后时，他游说营陵侯刘泽，得金二百斤，随后入长安，令其子投事吕后宠信的大谒者张卿。田生借张卿之口促成吕后封刘泽为琅琊王，又劝刘泽速赴封国；吕后使人追之，已不及。刘泽即汉初琅琊王，后徙燕。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 53
      defense: 21
      agility: 14
  - key: hist_qinhan_0536
    name: 毋盐氏
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: 毋盐氏（又作无盐氏，生卒年不详），西汉初年长安放贷商人。吴楚七国之乱起，长安列侯、封君从军需筹措行装，向子钱家借贷；因关东胜负未决，诸家多不肯出借，唯毋盐氏以十倍之息贷出千金。三个月后吴楚平定，其一岁之中获利十倍，由此富甲关中，事见《史记·货殖列传》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 57
      defense: 18
      agility: 10
  - key: hist_qinhan_0537
    name: 卫长君
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: 卫长君（生卒年不详），西汉河东平阳人，卫子夫、卫青之兄，其母卫媪。卫子夫原为平阳公主府中讴者，入宫得汉武帝宠幸；卫青亦由骑从渐至大将军。卫长君早卒，未及亲见卫氏显贵。其妹为皇后、弟为大将军后，卫氏一门封侯数人，贵盛一时。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 56
      defense: 23
      agility: 8
  - key: hist_qinhan_0539
    name: 郇越
    avatar: pig/文018.png
    default_gender: male
    archetype: civil
    flavor: 郇越（字臣仲，生卒年不详），太原人，西汉末隐士。他与同族兄弟郇相同有清名，活动于汉成帝至王莽时期。汉成帝以后外戚王氏世代秉政，王莽居摄、代汉之际士人仕隐分流，郇越退居不仕，终身未入仕途。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 58
      defense: 18
      agility: 13
  - key: hist_qinhan_0462
    name: 任氏
    avatar: pig/文044.png
    default_gender: male
    archetype: civil
    flavor: 任氏（生卒年不详），秦汉之际宣曲富商，其先曾任督道仓吏。秦亡时豪杰争抢金玉，任氏独窖藏仓粟；楚汉相持荥阳，粮价腾贵，米石至万钱，豪杰所藏金玉尽归任氏。任氏立家约，非自家田畜所出不衣不食，公事未毕不得饮酒食肉，以此富数世。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 50
      defense: 20
      agility: 18
  - key: hist_qinhan_0463
    name: 田角
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: 田角（生卒年不详），秦末齐国人。田儋战死后，齐人立故齐王建之弟田假为王，以田角为相、田间为将。田荣怒而逐田假，田假奔楚，田角逃往赵国，其弟田间因求救于赵也留而不归。田荣另立田巿为齐王，并以楚杀田假、赵杀田角兄弟为出兵助项梁的条件。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 55
      defense: 18
      agility: 13
  - key: hist_qinhan_0465
    name: 崔广
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 崔广（字少通，相传即夏黄公，生卒年不详），齐人，秦末避乱隐居商山，为“商山四皓”之一。四人须眉皓白，年皆八十余。汉高祖欲废太子刘盈，吕后依张良之计迎四皓为辅；高祖见太子得四人追随，认为羽翼已成，遂罢废立之议。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 53
      defense: 22
      agility: 11
  - key: hist_qinhan_0466
    name: 徐公
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: 徐公（生卒年不详），秦末范阳县令。陈胜部将武臣北略赵地，兵锋将至，蒯通入城游说徐公：秦法严酷，其为令十年，结怨必多，一旦秦法弛废，仇家将群起相攻；不如以城归降，转祸为福。徐公从之。蒯通又劝武臣以侯印、车骑厚待降者，赵地三十余城闻风归附。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 56
      defense: 19
      agility: 13
  - key: hist_qinhan_0472
    name: 郑昌
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: 郑昌（生卒年不详），秦末吴县县令，与项梁、项羽相善。项羽分封诸侯时，韩王成被废杀，项羽改立郑昌为韩王，以阻挡汉军东进。汉二年（前205年），刘邦遣韩信攻韩，韩信急击郑昌于阳城，郑昌兵败投降，刘邦遂改立韩信为韩王。此郑昌与西汉经学家郑昌并非一人。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 57
      defense: 19
      agility: 12
  - key: hist_qinhan_0498
    name: 蔡赐
    avatar: pig/武076.png
    default_gender: male
    archetype: military
    flavor: 蔡赐（生卒年不详），上蔡人，秦末张楚政权大臣，封房君，官至上柱国。陈胜称王后，擢蔡赐为上柱国，位在诸将之上。周文西征军败于章邯后，陈胜曾召他商议对策。章邯破伍徐、进击陈县时，蔡赐率军迎战而死；不久陈胜亦为车夫庄贾所害，张楚政权随之瓦解。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 13
      defense: 29
      agility: 10
  - key: hist_qinhan_0503
    name: 李必
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: 李必（生卒年不详），秦末汉初将领，秦军骑士出身，后归附刘邦。刘邦择骑将时，与骆甲同被军中推举。李必以旧秦军卒、难服众心为由，请以汉王亲信统兵；于是灌婴受命统领郎中骑兵，李必与骆甲分任校尉，在荥阳以东击破楚军骑队。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 49
      intellect: 13
      defense: 26
      agility: 12
  - key: hist_qinhan_0506
    name: 涉间
    avatar: pig_wu_male9.png
    default_gender: male
    archetype: military
    flavor: 涉间（生卒年不详），秦朝将领。秦末巨鹿之战，他与王离、苏角率长城军围赵王歇于巨鹿，章邯驻棘原、筑甬道输粮。项羽渡河后破釜沉舟，九战绝其甬道，秦军大败，苏角战死、王离被俘。涉间拒绝降楚，自焚而死。此役秦军关东主力尽失，诸侯将入辕门皆膝行而前。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 45
      intellect: 14
      defense: 27
      agility: 14
  - key: hist_qinhan_0514
    name: 秦嘉
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: 秦嘉（生卒年不详），秦末东海起兵首领。陈胜称王后，他与朱鸡石等围攻东海郡守于郯，又自立为大司马，不受陈胜所遣武平君的节制，并假借王命杀之。陈胜兵败、下落不明时，秦嘉立景驹为楚王，项梁以背陈王之罪进击，秦嘉战败身死，景驹亦死于梁地。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 46
      intellect: 16
      defense: 26
      agility: 12
  - key: hist_qinhan_0520
    name: 樊重
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: 樊重（字君云，生卒年不详），西汉末南阳湖阳人，以经营田产、水利与池鱼畜牧致富，广开田土三百余顷，赀至巨万。他治家谨严，三世共财，年八十余终；临终遗令焚削乡邻借贷文契，债家争相来偿，诸子遵命不受。其女樊娴都嫁刘钦，生刘縯、刘仲、刘秀，樊重因此被追封为寿张侯。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 53
      defense: 17
      agility: 16
  - key: hist_qinhan_0525
    name: 孔腾
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: 孔腾（字子襄，生卒年不详），孔子九世孙，孔鲋之弟。秦末其兄孔鲋相传藏经于旧宅壁中，孔腾在汉初续承家学，汉惠帝时被立为博士。高祖十二年（前195年），刘邦过鲁，以太牢祭祀孔子，孔腾受封奉祀君，后迁长沙王太傅，主孔氏祀事与经学传授。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 19
      agility: 11
  - key: hist_qinhan_0530
    name: 司马季主
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 司马季主（生卒年不详），西汉楚地占卜者，在长安东市设卜肆。中大夫宋忠与博士贾谊曾同往问卜，季主与弟子纵论天地之道、阴阳吉凶，又讥讽公卿尸位、肯定卜者的操守，使二人无言以对。其事见于《史记·日者列传》，后世遂以他为隐于市井的高士。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 54
      defense: 16
      agility: 16
  - key: hist_qinhan_0533
    name: 田仲
    avatar: pig/武079.png
    default_gender: male
    archetype: civil
    flavor: 田仲（生卒年不详），西汉初楚地游侠，以任侠闻名，喜好剑术。鲁地朱家曾藏匿亡命的季布，为当时游侠所推重；田仲长期师事朱家，待之如父，自认行事不及。《史记·游侠列传》于朱家传后附记其名，称“楚田仲以侠闻”。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 23
      agility: 7
  - key: hist_qinhan_0535
    name: 田禄伯
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: 田禄伯（生卒年不详），西汉吴王刘濞部将。七国之乱起，吴王率军西向，田禄伯建议分兵五万，沿江淮而上，收淮南、长沙，由武关西入，与主力会于关中。吴王太子以兵权不可假人为由反对，此策未行。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 57
      defense: 16
      agility: 13
  - key: hist_qinhan_0538
    name: 夏贺良
    avatar: monkey/其他随机角色/文_男123.png
    default_gender: male
    archetype: civil
    flavor: 夏贺良（生卒年不详），西汉末方士。汉哀帝建平年间，他借赤精子谶语上言汉家历运中衰、当再受命，劝哀帝改元易号。朝廷一度改元太初元将、号陈圣刘太平皇帝，不久以其言无验，将夏贺良下狱诛杀，附议的李寻等减死徙边。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 54
      defense: 17
      agility: 13
  - key: hist_qinhan_0540
    name: 新垣平
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: 新垣平（生卒年不详），西汉赵地方士。汉文帝时以望气之术进见，奏请立渭阳五帝庙，又诈令人献刻有“人主延寿”的玉杯，促成文帝改元。后有人上书告发其言皆诈，事下吏治，新垣平被诛夷，此后文帝亦怠于改正朔、神明之事。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 57
      defense: 18
      agility: 9
  - key: hist_qinhan_0541
    name: 虞常
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: 虞常（生卒年不详），西汉长水人，随卫律降匈奴，而其母、弟仍留汉地。苏武出使匈奴时，虞常与副使张胜密谋射杀卫律、劫持单于之母归汉，事泄后被擒。卫律审理此案，虞常供出张胜，随即被斩；苏武因使团牵连被扣，遂有北海牧羊之事。其行事主要见于《汉书·苏武传》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 52
      defense: 16
      agility: 18
