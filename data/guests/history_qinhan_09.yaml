    name: 沈遂
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: 沈遂（字佐时，生卒年不详），秦朝博士。沈遂本人事迹失载；据后世谱牒，子沈倧为左庶长、竹邑侯，孙沈遵曾任汉齐王太傅，沈氏一支在秦汉之际延续仕宦。
    growth_range:
