    default_gender: male
    archetype: civil
    flavor: （1638年—1712年）清代大臣、学者，字子端，号说岩，山西阳城人。康熙朝历任工部、户部、吏部尚书，官至文渊阁大学士，并任经筵讲官。他主持编纂《康熙字典》《佩文韵府》等书，为政清谨，卒于任上，谥文贞。
    growth_range:
    - 5
    - 9
