    default_gender: male
    archetype: civil
    flavor: （1696年—1771年）字汝咨，号榕门，广西临桂人。雍正元年进士，外任三十余年，历官江苏、江西、河南、陕西、两广、两湖等地督抚。乾隆朝官至东阁大学士。他重视教化与民生，辑《五种遗规》训饬吏治士习，卒谥文恭。
