    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （1746年—1809年）字君直，一字稚存，号北江，江苏阳湖人。乾隆五十五年一甲第二名进士，曾任贵州学政。嘉庆四年上书直陈时政，触怒仁宗，获罪流放伊犁，未及百日即赦还。他精于舆地与音韵，著《治平篇》论人口与土地，另有《春秋左传诂》《东晋疆域志》。
