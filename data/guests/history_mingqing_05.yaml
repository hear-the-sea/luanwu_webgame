    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （1720年—1770年）清代大臣，富察氏，字春和，满洲镶黄旗人，乾隆帝孝贤皇后之弟。乾隆朝官至保和殿大学士、领侍卫内大臣，曾以经略身份督师平定大小金川，后率军征缅甸，染瘴疫班师，回京不久病逝，谥文忠，配享太庙。
