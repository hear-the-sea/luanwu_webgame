      agility: 12
  - key: hist_mingqing_0180
    name: 钱大昕
    default_gender: male
    archetype: civil
    flavor: （1728年—1804年）字晓征，号竹汀，清代伟大的史学家、科学家与考据大师。他在考据学上具有神般的洞察力与极高的天赋，所著《二十二史考异》被誉为清代史学研究的最高峰。钱大昕不仅精通经史子集，在数学、历法、金石学、音韵学等多个领域亦有极深造诣，被同代学人推崇为“一代全才”。他在学术上主张实事求是，认为“无征不信”，强调通过跨学科的手段发现历史真相。他在官场中亦能保持清流本色，为人耿直。钱大昕通过极其辛勤的文献搜罗与实地考证，为后世留下了海量的文化种子。他那种致力于文化保存的自觉担当，展现了清代士大夫的责任感。他在主持书院期间培养了大量杰出人才，是古典教育体制下的完美范本。
    growth_range:
