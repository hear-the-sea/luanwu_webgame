  - key: hist_mingqing_0197
    name: 叶天士
    default_gender: male
    archetype: civil
    flavor: （1667年—1746年）名桂，号香岩，清代最杰出的医学家之一，温病学派的奠基人。他凭借对疾病演变规律的深刻洞察，提出了著名的“卫气营血”辨证理论，为中医治疗流行性传染病建立了系统的科学标准，拯救了无数生命。叶天士医术极其高超，民间流传着无数其妙手回春、起死回生的神奇故事。他不仅理论造诣深厚，在临床实践上亦极其务实，坚决反对因循守旧。叶天士的一生是医学职业精神的最高体现。他那种求真务实、巨细靡遗的诊疗态度，将中国传统医学的实操能力推向了前所未有的精密高度。他留下的《温热论》被尊为中医温病学的“圣经”，其学术思想至今依然是中国传统医药学中最核心的理论基石之一。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0198
    name: 吴鞠通
    default_gender: male
    archetype: civil
    flavor: （1758年—1836年）名瑭，字配珩，清代著名的医学家，温病学派的集大成者。他在继承叶天士理论的基础上，进一步确立了以“三焦辨证”为核心的温病诊疗体系，使得温病的治疗方法更加严密、科学且体系化。吴鞠通所著的《温病条辨》是中国医学史上的重要里程碑，该书极大地提高了当时社会应对大规模突发疫病的能力。他的一生在基层行医、钻研多年，积德累功，深受百姓爱戴。吴鞠通那种追求实证、精益求精的职业精神，显著提高了当时中医的临床治愈率。他在处理重大公共卫生危机中表现出的沉稳、专业与责任感，展现了极其卓越的科学素养与医学道德，其影响力跨越了时代与国界。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0199
    name: 王清任
    default_gender: male
    archetype: civil
    flavor: （1768年—1831年）字勋臣，清代著名的医学家、解剖学家。他在中国医学史上具有划时代的革命性意义，因为他敢于挑战流传千年的“圣人”医书在人体解剖学上的错误定见。王清任通过实地观察死刑犯尸体及受灾弃婴的尸体，撰写了震撼医林的《医林改错》，纠正了古书中关于脏腑位置、形状的诸多误差。基于其实践发现，他开创了极其重要的“活血化瘀”治疗学派，发明了血府逐瘀汤等至今仍广泛应用的千古名方。他的一生体现了极其强烈的求实精神与对客观真相的执着追求。王清任那种追求真理、不惜被保守派视为“异端”的勇气，使其成为了中国传统医学向近代科学跨越过程中的第一先驱，展现了中国医学实证研究的高峰。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0189
    name: 王时敏
    default_gender: male
    archetype: civil
    flavor: （1592年—1680年）字逊之，号烟客，清初著名的画家，位列“四王”之首。他出身于明代显赫的豪门，明亡后隐居著书创作，在艺术上坚定主张继承宋元名家的正统法度，尤其在临摹黄公望、董源等人的作品方面具有极其深厚的造诣。王时敏的画风温润细腻、气韵典雅，确立了清初文人山水画的主流地位。他通过对传统绘画技法的精密整理与传承，为后世画坛确立了极其严谨且具规范性的审美范式。他的一生致力于艺术的延续与人才的培养，其长孙王原祁、得意门生王翚等均受其深远影响。王时敏那种追求文化纯正性与艺术自律的人格魅力，使其成为了清初画坛公认的领袖，展现了士大夫阶层对华夏文明命脉的深沉守护。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
