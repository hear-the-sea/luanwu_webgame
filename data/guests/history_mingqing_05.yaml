    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （1632年—1717年）清初画家，字石谷，号耕烟散人，江苏常熟人。他先后师从王鉴、王时敏，遍临宋元名迹，融会南北宗画法。康熙三十年奉命主持绘制《康熙南巡图》，以山水著称，弟子众多，形成“虞山派”，为“四王”之一。
    growth_range:
