    default_gender: male
    archetype: civil
    flavor: （1753年—1818年）字渊如，号季逑，江苏阳湖人。乾隆五十二年一甲第二名进士，官至山东督粮道。他精于经学、校勘，著《尚书今古文注疏》，辑刻《平津馆丛书》，又编《寰宇访碑录》著录碑刻，与洪亮吉齐名。
