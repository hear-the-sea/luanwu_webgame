      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0162
    name: 刘统勋
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: （1698年—1773年）清代大臣，字延清，号尔钝，山东诸城人，刘墉之父。乾隆朝官至东阁大学士、首席军机大臣，多次奉命督修黄河、运河，查办地方亏空与贪腐，并主持赈务。他为官刚直，敢于直谏，乾隆三十八年卒于入朝途中，谥文正。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0163
    name: 阿桂
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: （1717年—1797年）清代将领、大臣，章佳氏，字广庭，满洲正蓝旗人。乾隆朝历任伊犁将军、定边将军，参与平定准噶尔与大小金川，官至武英殿大学士、军机大臣。他为政持重，与和珅不睦，嘉庆二年病逝，谥文成。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0164
    name: 刘墉
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: （1720年—1805年）清代大臣、书法家，字崇如，号石庵，山东诸城人，刘统勋之子。乾隆朝历任安徽、江苏学政及江宁知府、湖南巡抚等职，曾参与查办山东巡抚国泰贪案，官至体仁阁大学士。其书法用墨厚重，卒谥文清。
    growth_range:
