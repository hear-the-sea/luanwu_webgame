  - key: hist_mingqing_0190
    name: 王鉴
    default_gender: male
    archetype: civil
    flavor: （1598年—1677年）字玄照，号湘碧，清初著名的画家，“四王”之一。他出身名门望族，在绘画上不仅具有极高的艺术天赋，更展现出卓越的临摹与整合能力。王鉴的山水画色调明快、笔墨浑厚，尤其在对“青绿山水”的现代化改造与技法提升上做出了重要贡献。他的一生游历广泛，对历代古画的鉴赏力极高，通过对宋元名迹的深度钻研，构建了属于自己的艺术殿堂。他那种在传统内部寻求微创新的姿态，反映了清初精英阶层一种平稳、理性的艺术心态。他的作品不仅具有极高的艺术价值，更为中国山水画从古典向清代模式的跨越起到了关键的桥梁作用，其追求艺术真实与自然高度统一的风格使其在画史上地位显赫。
