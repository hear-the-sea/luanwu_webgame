    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: （1744年—1794年）字容甫，江苏江都人，扬州学派名家。出身孤贫，少时由母亲授读，后以拔贡生游幕校书，终身未第。所作《哀盐船文》写仪征盐船火灾，杭世骏评为“惊心动魄，一字千金”；又著《述学》，考论诸子，为《墨子》《荀子》辩白。
