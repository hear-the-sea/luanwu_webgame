    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （1725年—1806年）字德甫，号述庵，又号兰泉，江苏青浦人。乾隆十九年进士，官至刑部右侍郎。他究心金石，辑《金石萃编》一百六十卷，收录历代碑刻；又编《明词综》《国朝词综》《湖海诗传》，著有《春融堂集》。早年与王鸣盛、钱大昕等同列“吴中七子”。
