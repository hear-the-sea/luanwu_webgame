  - key: hist_mingqing_0190
    name: 王鉴
    default_gender: male
    archetype: civil
    flavor: （1598年—1677年）字玄照，号湘碧，清初著名的画家，“四王”之一。他出身名门望族，在绘画上不仅具有极高的艺术天赋，更展现出卓越的临摹与整合能力。王鉴的山水画色调明快、笔墨浑厚，尤其在对“青绿山水”的现代化改造与技法提升上做出了重要贡献。他的一生游历广泛，对历代古画的鉴赏力极高，通过对宋元名迹的深度钻研，构建了属于自己的艺术殿堂。他那种在传统内部寻求微创新的姿态，反映了清初精英阶层一种平稳、理性的艺术心态。他的作品不仅具有极高的艺术价值，更为中国山水画从古典向清代模式的跨越起到了关键的桥梁作用，其追求艺术真实与自然高度统一的风格使其在画史上地位显赫。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0191
    name: 王翚
    default_gender: male
    archetype: civil
    flavor: （1632年—1717年）字象文，号耕烟散人，清初著名画家，由于他综合了南北宗诸家之长且技法全面，被后世誉为“画圣”。王翚在康熙年间受命主持编绘了宏篇巨制《康熙南巡图》，展现了其处理大规模、多场景复杂叙事与地理景观的非凡能力。他的山水画既有宋画的严谨骨法，又有元画的灵动气韵，达到了集大成的境地。王翚一生致力于将中国传统绘画技法进行系统化的整理与规范，他那种精益求精、旨在追求艺术完美的职业态度，显著提升了清代职业画家的社会地位。王翚那种能够在大时代的背景下不随波逐流、只对艺术本身负责的精神，使其成为了民族文化的忠实守护者，其作品在思想深度与艺术高度上达到了高度统一。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
