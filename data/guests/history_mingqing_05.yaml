    flavor: （1725年—1805年）字伟人，号惺园，陕西韩城人。乾隆二十六年状元，授修撰，历任军机大臣、东阁大学士，并任上书房总师傅，为颙琰讲学。他居官清介，不与和珅同流；相传和珅曾戏握其手，王杰正色以对。嘉庆四年和珅获罪，他参与审办，后以老病乞休，卒谥文端。
