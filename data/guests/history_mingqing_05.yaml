      agility: 12
  - key: hist_mingqing_0181
    name: 章学诚
    default_gender: male
    archetype: civil
    flavor: （1738年—1801年）字实斋，号少岩，清代伟大的史学理论家与思想家。他提出了具有划时代意义的“六经皆史”论断，深刻揭示了古代学术与历史发展之间的内在逻辑联系。章学诚在史学方法论上具有开创之功，主张史书编纂应同时具备“史德、史才、史学、史识”，即除了才学之外，更强调史家的道德操守与洞察力。他的一生虽然仕途极其坎坷、常年处于生活清贫之中，但在学术追求上表现出极高的坚韧性与原创力。章学诚的思想具有强烈的系统性，他那种能够从浩如烟海的古典文献中提炼出宏大哲学命题的能力，使其成为了中国传统史学向现代学术转型的关键人物，其著作《文史通义》至今仍是研究史学理论的必读经典。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0195
    name: 郑燮
    default_gender: male
    archetype: civil
    flavor: （1693年—1765年）字克柔，号板桥，清代著名文学家、画家，“扬州八怪”之一。他在担任山东潍县知县期间，面对特大灾荒毅然决定开仓赈济，并因忤逆上司、维护百姓利益而愤然辞官，留下了“一枝一叶总关情”的千古名句。郑板桥在艺术上擅长画竹、兰、石，独创了融合隶、楷、行、草于一体的“六分半书”。他的作品中充满了对劳苦百姓的深切关怀与对权贵势力的蔑视。他那种追求人格独立、追求社会公义的强烈道德感，使其成为了中国传统文化中“民本思想”的杰出代言人。郑板桥的一生是清官本色与名士风骨的完美结合，其艺术创作中表现出的那种极其强烈的生命意识，使其名字跨越阶层，深受百姓爱戴。
    growth_range:
