      agility: 12
  - key: hist_mingqing_0190
    name: 王鉴
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: （1598年—1677年）明末清初画家，字玄照，号湘碧，江苏太仓人，王世贞曾孙。明末曾任廉州知府，入清后隐居不仕，专意山水。他师法董源、巨然及元四家，长于青绿设色，与王时敏并称“二王”，同为清初“四王”正统画派的奠基者。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
