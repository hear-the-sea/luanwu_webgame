    default_gender: male
    archetype: civil
    flavor: （1642年—1715年）清初画家，字茂京，号麓台，江苏太仓人，王时敏之孙。康熙进士，官至户部侍郎，曾主持内廷书画鉴定，并任《佩文斋书画谱》总裁。他继承家学，山水宗黄公望，笔墨浑厚，门下众多，形成“娄东派”，为“四王”之一。
    growth_range:
