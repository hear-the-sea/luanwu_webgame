  - key: hist_mingqing_0172
    name: 戴震
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （1724年—1777年）清代学者，字东原，安徽休宁人。他博览经史，精于音韵、训诂与历算，乾隆年间入四库全书馆任纂修。所著《孟子字义疏证》借疏解经义阐发理欲之辨，《原善》《声韵考》等亦有影响，乾隆四十二年在京病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0173
    name: 段玉裁
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （1735年—1815年）清代文字学家，字若膺，号懋堂，江苏金坛人，戴震弟子。他历任贵州玉屏、四川巫山知县，后辞官专治小学，以三十余年之力写成《说文解字注》，订正原文、阐明体例，为清代《说文》学的代表作，晚年寓居苏州。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0174
    name: 王念孙
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （1744年—1832年）清代学者，字怀祖，号石臞，江苏高邮人。乾隆年间进士，历任工部官员、永定河道等职，后辞官专事著述。他用十余年写成《广雅疏证》，以音求义、校订讹误，又著《读书杂志》考订群书，与其子王引之同为乾嘉考据学的代表。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0175
    name: 王引之
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: （1766年—1834年）清代学者、官员，字伯申，江苏高邮人，王念孙之子。嘉庆进士，官至工部尚书。他继承家学，精于训诂，所著《经传释词》系统考释古书虚词，《经义述闻》多本其父之说，与王念孙并称“高邮王氏父子”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0180
    name: 钱大昕
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （1728年—1804年）清代史学家、考据学家，字晓征，号竹汀，江苏嘉定人。乾隆进士，曾任翰林院编修、广东学政，晚年主讲钟山、紫阳等书院。他精研经史、音韵、金石与历算，所著《廿二史考异》校订历代正史，另有《潜研堂文集》等。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0181
    name: 章学诚
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （1738年—1801年）清代史学家，字实斋，号少岩，浙江会稽人。乾隆进士，曾任国子监典籍，长期以讲学、修志为业，参与编纂《湖北通志》等方志。所著《文史通义》提出“六经皆史”，并主张史家应兼具史才、史学、史识与史德，对后世史学影响深远。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0195
    name: 郑燮
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （1693年—1765年）清代书画家、文学家，字克柔，号板桥，江苏兴化人，扬州八怪之一。乾隆进士，曾任山东范县、潍县知县，潍县灾荒时开仓赈济，后因忤逆上司称病去职。回扬州后以卖画为生，擅画竹、兰、石，书法自成一体，著有《板桥集》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0197
    name: 叶天士
    avatar: pig_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （1667年—1746年）清代医家，名桂，字天士，号香岩，江苏吴县人。他出身医学世家，先后从多位医家问学，擅长治温热病，提出卫气营血辨证，以辨病邪深浅与传变。其言论由门人整理为《温热论》，医案辑成《临证指南医案》，对温病学影响很大。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0198
    name: 吴鞠通
    avatar: pig/文040.png
    default_gender: male
    archetype: civil
    flavor: （1758年—1836年）清代医家，名瑭，字配珩，号鞠通，江苏淮安人。他因父亲病逝而发愤学医，精研吴又可、叶天士诸家之说，提出以三焦分部辨治温病，著成《温病条辨》，系统整理温病治法与方剂，与叶天士同为温病学代表人物。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0199
    name: 王清任
    avatar: pig_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （1768年—1831年）清代医家，字勋臣，河北玉田人。他长期行医，重视人体脏腑的实际形态，借观察尸体的机会订正古书中的脏腑图说，写成《医林改错》。书中主张气血辨治，创制血府逐瘀汤等方剂，对后世活血化瘀治法影响较大。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0189
    name: 王时敏
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （1592年—1680年）明末清初画家，字逊之，号烟客，江苏太仓人。明末以荫官至太常寺少卿，入清后不仕，家居作画。他师法黄公望等元人，笔墨苍润，为“四王”之首，并提携王翚、教导其孙王原祁，对清初正统画派影响很大。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
