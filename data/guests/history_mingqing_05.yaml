    flavor: （1642年—1715年）字茂京，号麓台，清初著名画家，王时敏之孙，“四王”之一，“娄东派”领袖。他在艺术上极其强调“笔墨之妙”，主张通过对墨色的反复叠加、皴擦与逻辑构建，营造出一种类似建筑感的画面结构与深厚的文化底蕴。王原祁的画风苍劲雄厚、意境古朴，深受康熙皇帝的推崇与喜爱，曾官至户部侍郎。他在画坛具有极高的理论话语权，其创作过程更像是一种针对哲学命题的精密推演。他的一生致力于确立并巩固“娄东派”在清代官修艺术体系中的权威地位。王原祁那种追求艺术真理与个人风格高度统一的努力，使其作品中蕴含了一种极具穿透力的文化沉重感，其影响力贯穿了整个清代画坛。
