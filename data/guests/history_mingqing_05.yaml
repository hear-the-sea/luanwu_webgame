    default_gender: male
    archetype: civil
    flavor: （1730年—1797年）字纕蘅，号秋帆，江苏镇洋人。乾隆二十五年状元，官至湖广总督。他开府一方，延揽邵晋涵等学者，以多年之力编成《续资治通鉴》，又著《关中金石记》《中州金石记》，于史学与金石均有收罗。
