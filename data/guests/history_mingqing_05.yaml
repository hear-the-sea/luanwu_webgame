  - key: hist_mingqing_0172
    name: 戴震
    default_gender: male
    archetype: civil
    flavor: （1724年—1777年）字东原，号慎修，乾嘉学派的理论领袖，清代最伟大的哲学家与考据学家之一。他以大无畏的精神公然挑战传统理学的“存天理、灭人欲”说教，在《孟子字义疏证》中提出了“理存于欲”的进步观点，深刻揭示了理学教条对基本人性的长期压抑与摧残。戴震在考据学、音韵学与历算学上亦造诣惊人，其治学之严谨被誉为“乾嘉第一”。他在整理《永乐大典》与修纂《四库全书》中发挥了不可替代的核心作用。戴震的一生是追求极致真理与科学实证的化身，他那带有现代曙光的哲学思考，预示了传统文化向近代化转型的巨大可能，其学术精神对后世产生了极其深远的影响，被梁启超誉为“前清第一学术泰斗”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0173
    name: 段玉裁
    default_gender: male
    archetype: civil
    flavor: （1735年—1815年）字若膺，号懋堂，清代伟大的语言学家、文字学家与考据大家。他作为戴震的杰出弟子，历时三十载呕心沥血写成的《说文解字注》，是中国古代文字学研究的巅峰之作，使得汉字演变的客观规律得到了系统且精密的梳理。段玉裁在学术上主张不苟且、不盲从，强调通过详尽的排比与逻辑推演发现文字背后的历史真相。他在退休后依然保持极高强度的科研钻研，直至生命最后一刻。他那种“板凳甘坐十年冷”的坚韧精神，为中国传统语言学的现代化转型奠定了最坚实的基石。段玉裁不仅复原了汉字的本义，更通过文字的考古学构建了我们认知上古文明的权威阶梯，其成果至今仍被奉为该领域的“圣经”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0174
    name: 王念孙
    default_gender: male
    archetype: civil
    flavor: （1744年—1832年）字怀祖，号石臞，乾嘉学术的集大成者，高邮王氏学派创始人。他在音韵学、训诂学上具有神般的洞察力与精密的逻辑分析能力，所著《广雅疏证》被学术界誉为不朽之作，将古汉语训诂推向了前所未有的高度。王念孙在官场中亦以清廉正直、敢于任事著称，曾任御史等职，深受朝廷器重。他在学术上特别强调通过语言内部逻辑解读古籍，开创了极其严密的科学考据方法论。王念孙那种求真务实、巨细靡遗、言必有据的治学态度，将中国古代对传统文献的理解推向了极其精密的高度。他的一生是专业精神的极致体现，其学术成果至今仍是研究华夏古典文化与上古汉语的必经之门，展现了人类理性在特定学科能达到的巅峰。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0175
    name: 王引之
    default_gender: male
    archetype: civil
    flavor: （1766年—1834年）字伯申，号述庵，王念孙之子，父子合称“高邮二王”。他在学术上发扬了家学精髓，在虚词研究上取得了突破性的成果，其名著《经传释词》是中国语言学史上的经典之作，解决了许多古籍阅读中的疑难问题。王引之在官场中亦表现卓越，官至工部尚书，在处理复杂的行政事务与文化工程中展现了缜密的思维与卓越的领导力。他的一生是家族学术传承与政治成就完美统一的代表。王引之那种在极其琐碎的文字细节中寻找大逻辑的才华，展现了清代学术在精密化方向上的最高成就。他是乾嘉汉学的杰出代言人，其治学风范为后世学子确立了极其严谨的学术标准，确保了中华古典文明在考据领域的纯正传承。
    growth_range:
