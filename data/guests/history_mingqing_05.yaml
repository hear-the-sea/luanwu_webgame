    avatar: monkey/其他随机角色/文_男123.png
    default_gender: male
    archetype: civil
    flavor: （1763年—1820年）字理堂，号里堂，江苏甘泉人。乾隆六十年举人，会试不第后不复应举，筑雕菰楼闭门著述，以教书奉母。所著《孟子正义》疏解赵岐注，《雕菰楼易学三书》自成体系；兼治算学，有《里堂学算记》，又撰《剧说》《花部农谭》，推重地方戏曲。
    growth_range:
