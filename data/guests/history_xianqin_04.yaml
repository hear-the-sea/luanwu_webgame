  purple:
  - key: hist_xianqin_0150
    name: 项燕
    default_gender: male
    archetype: military
    flavor: （?—前223年）楚国名将，抗秦之魂。他是楚国末期最杰出的将领，也是西楚霸王项羽的祖父。秦将李信率二十万大军伐楚，年轻气盛，轻敌冒进。项燕老谋深算，诱敌深入，伏击秦军，大败李信，斩杀七都尉，这是战国后期楚军对秦军最辉煌的胜利。秦始皇震怒，起用老将王翦，发兵六十万再伐。项燕拼死抵抗，终因力量悬殊，兵败身死（一说自刎殉国）。楚国灭亡之际，民间流传"楚虽三户，亡秦必楚"的预言。十余年后，他的孙子项羽在巨鹿之战破釜沉舟，推翻暴秦，预言成真。项燕虽败，其精神不灭。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 42
      intellect: 16
      defense: 24
      agility: 18
  - key: hist_xianqin_0153
    name: 褒姒
    default_gender: female
    archetype: civil
    flavor: （?—前771年）烽火戏诸侯，西周终结者。她出身褒国，据说生性冷淡，从不展颜欢笑。周幽王对她一见倾心，宠爱无度，千方百计只为博她一笑。有佞臣献策：点燃烽火，诸侯以为京畿有难，必率军来援；待他们发现是虚惊，慌张撤退的狼狈模样定能让王后开颜。果然，褒姒看到诸侯匆忙赶来又悻悻而去，终于莞尔一笑。此后幽王多次戏弄，诸侯不再响应。及至犬戎真正入侵，烽火狼烟却无人来救，西周灭亡。"烽火戏诸侯"的故事警示后人：失信于人，必自食其果。褒姒虽是祸首的替罪羊，却成为亡国红颜的代名词。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 8
      intellect: 54
      defense: 18
      agility: 20
  - key: hist_xianqin_0154
    name: 妲己
    default_gender: female
    archetype: civil
    flavor: （生卒年不详）有苏氏女，商纣王妃。先秦文献将她写入殷商末年的宫廷叙事，后世又以酒池、炮烙等故事不断铺陈其形象；《封神演义》更将她塑为狐妖。史书中的妲己只留下王妃与亡国末世相连的剪影，红颜祸水的骂名，则是后世层层叠上的回声。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 8
      intellect: 54
      defense: 18
      agility: 20
  - key: hist_xianqin_0159
    name: 聂政
    default_gender: male
    archetype: military
    flavor: （?—前397年）击杀韩相，刺客传奇。他本是魏国轵邑深井里人，以屠狗为业，与寡母相依为命。严仲子与韩相侠累有隙，重金聘请聂政行刺。聂政以母在为由婉拒，待母亲去世、姐姐出嫁后，他独闯韩国都城。他手持利剑，直入相府，连杀数十人，将侠累斩杀于阶下。事成之后，他深知若被生擒，必连累姐姐，遂以剑自毁面目、剜出双眼、剖腹自尽，使人无法辨认。其姐聂嫈闻讯赶来，认出弟弟遗体，伏尸大哭曰："此吾弟聂政也！"言毕亦自尽于其侧。聂政的忠义与决绝、聂嫈的勇气与亲情，成为《刺客列传》中最动人的篇章，令后世击节叹赏。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 46
      intellect: 10
      defense: 22
      agility: 22
  - key: hist_xianqin_0164
    name: 庞涓
    default_gender: male
    archetype: military
    flavor: （?—前341年）魏国大将，马陵惨死。他与孙膑同出鬼谷门下，论才学本在伯仲之间，却因嫉妒心起，设计陷害同门，致孙膑受膑刑、面刺黥字。他自以为除去心腹大患，却不料孙膑诈疯逃往齐国，成为他最可怕的对手。桂陵之战，他中围魏救赵之计；马陵之战，他中增兵减灶之计，率军追入绝地。万弩齐发之际，他在火光中看到树上刻字"庞涓死于此树之下"，仰天长叹"遂成竖子之名"后自刎而亡。嫉贤妒能者的悲剧结局，警示后人千古。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 40
      intellect: 16
      defense: 24
      agility: 20
  - key: hist_xianqin_0166
    name: 惠施
    default_gender: male
    archetype: civil
    flavor: （约前390年—前317年）庄子挚友，名家大师。他博学多才，"学富五车"的典故正是形容他的著作之丰。他与庄子亦敌亦友，濠梁之辩成为千古名篇："子非鱼，安知鱼之乐？""子非我，安知我不知鱼之乐？"两人唇枪舌剑，妙趣横生。庄子评他"逐万物而不反"，批评他过于追求外在知识而忽略内在修养；然庄子晚年过惠施墓，叹无人可语，可见二人情谊之深。他曾任魏国相国，在政治上也颇有建树。惠施是庄子精神上最好的对手，两人的辩论丰富了中国古代哲学的内涵。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 8
      intellect: 58
      defense: 18
      agility: 16
  - key: hist_xianqin_0160
