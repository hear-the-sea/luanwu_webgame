heroes:
  purple:
  - key: hist_xianqin_0153
    name: 褒姒
    avatar: monkey/先秦与神话/褒姒.png
    default_gender: female
    archetype: civil
    flavor: （?—前771年）周幽王的王后，褒国女子，姓姒。幽王宠爱她，废申后及太子宜臼，改立褒姒之子伯服，引起申侯不满。后世传说幽王为博她一笑，屡次点燃烽火戏弄诸侯，待到犬戎入侵，救兵不至，此说见于《史记》，细节未必尽实。幽王最终被申侯联合犬戎杀死于骊山之下，西周灭亡。褒姒常被指为亡国祸水，实则是王室废立之争的导火索。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 8
      intellect: 54
      defense: 18
      agility: 20
  - key: hist_xianqin_0154
    name: 妲己
    avatar: monkey/先秦与神话/妲己.png
    default_gender: female
    archetype: civil
    flavor: （生卒年不详）有苏氏女，商纣王妃。先秦文献将她写入殷商末年的宫廷叙事，后世又以酒池、炮烙等故事不断铺陈其形象；《封神演义》更将她塑为狐妖。史书中的妲己只留下王妃与亡国末世相连的剪影，红颜祸水的骂名，则是后世层层叠上的回声。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 8
      intellect: 54
      defense: 18
      agility: 20
  - key: hist_xianqin_0159
    name: 聂政
    avatar: monkey/先秦与神话/聂政.png
    default_gender: male
    archetype: military
    flavor: （?—前397年）击杀韩相，刺客传奇。他本是魏国轵邑深井里人，以屠狗为业，与寡母相依为命。严仲子与韩相侠累有隙，重金聘请聂政行刺。聂政以母在为由婉拒，待母亲去世、姐姐出嫁后，他独闯韩国都城。他手持利剑，直入相府，连杀数十人，将侠累斩杀于阶下。事成之后，他深知若被生擒，必连累姐姐，遂以剑自毁面目、剜出双眼、剖腹自尽，使人无法辨认。其姐聂嫈闻讯赶来，认出弟弟遗体，伏尸大哭曰："此吾弟聂政也！"言毕亦自尽于其侧。聂政的忠义与决绝、聂嫈的勇气与亲情，成为《刺客列传》中最动人的篇章，令后世击节叹赏。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 46
      intellect: 10
      defense: 22
      agility: 22
  - key: hist_xianqin_0164
    name: 庞涓
    avatar: monkey/先秦与神话/庞涓.png
    default_gender: male
    archetype: military
    flavor: （?—前341年）魏国大将，马陵惨死。他与孙膑同出鬼谷门下，论才学本在伯仲之间，却因嫉妒心起，设计陷害同门，致孙膑受膑刑、面刺黥字。他自以为除去心腹大患，却不料孙膑诈疯逃往齐国，成为他最可怕的对手。桂陵之战，他中围魏救赵之计；马陵之战，他中增兵减灶之计，率军追入绝地。万弩齐发之际，他在火光中看到树上刻字"庞涓死于此树之下"，仰天长叹"遂成竖子之名"后自刎而亡。嫉贤妒能者的悲剧结局，警示后人千古。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 40
      intellect: 16
      defense: 24
      agility: 20
  - key: hist_xianqin_0166
    name: 惠施
    avatar: monkey/先秦与神话/惠施.png
    default_gender: male
    archetype: civil
    flavor: （约前390年—前317年）庄子挚友，名家大师。他博学多才，"学富五车"的典故正是形容他的著作之丰。他与庄子亦敌亦友，濠梁之辩成为千古名篇："子非鱼，安知鱼之乐？""子非我，安知我不知鱼之乐？"两人唇枪舌剑，妙趣横生。庄子评他"逐万物而不反"，批评他过于追求外在知识而忽略内在修养；然庄子晚年过惠施墓，叹无人可语，可见二人情谊之深。他曾任魏国相国，在政治上也颇有建树。惠施是庄子精神上最好的对手，两人的辩论丰富了中国古代哲学的内涵。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 8
      intellect: 58
      defense: 18
      agility: 16
  - key: hist_xianqin_0160
    name: 豫让
    avatar: monkey/先秦与神话/豫让.png
    default_gender: male
    archetype: military
    flavor: （?—前453年）士为知己者死。他本是智伯家臣，智伯死后欲为其报仇。先以漆涂身、吞炭变声，又伏于桥下欲刺赵襄子，皆未遂。临死前请求赵襄子脱衣，以剑击其衣袍象征报仇，然后自刎。豫让的故事，是忠诚与义气的极致演绎。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 44
      intellect: 12
      defense: 24
      agility: 20
  - key: hist_xianqin_0167
    name: 邹衍
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （约前324年—约前250年）战国齐国稷下学者，阴阳家的代表人物。邹衍以“五德终始”解说王朝更替，认为历代兴亡都对应土、木、金、火、水五德的转移；他又提出“大九州”说，推测中国之外另有广袤地域。齐、燕两国君主都曾礼遇他，晚年入燕讲学。其学说为后世改制与正统论提供了思想框架，影响深远而争议并存。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 8
      intellect: 58
      defense: 20
      agility: 14
  blue:
  - key: hist_xianqin_0169
    name: 田忌
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）战国齐国将领。田忌与齐威王赛马时采纳孙膑调换马匹的次序，以下驷对上驷、上驷对中驷，赢得千金；他任孙膑为军师，参与桂陵、马陵两次对魏作战，屡挫魏军。后来田忌与相国邹忌争权，遭谗出奔楚国，晚年才返回齐国。其成败多系于用人与相位之争，是战国名将中较少独立掌权的一位。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 16
      defense: 24
      agility: 20
  - key: hist_xianqin_0176
    name: 蒙武
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （?—约前219年）战国秦国将领，蒙骜之子、蒙恬之父。秦王政二十四年，蒙武随王翦攻楚，参与击破楚军、逼死项燕的战事；楚国灭亡后，其事迹史载渐略。蒙氏祖孙三代都在秦军任将，是秦国统一战争中少见的将门世家。蒙武的功业多依托王翦的统筹，独立统兵的事迹并不突出。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 14
      defense: 26
      agility: 18
  - key: hist_xianqin_0180
    name: 魏冉
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: （?—约前264年）战国秦国大臣，封穰侯，秦宣太后的异父弟。魏冉在秦昭襄王即位时出力甚多，四次出任丞相，主持伐楚、攻魏，并举荐白起为将，使秦国向东扩张。范雎入秦后，他指出穰侯权势过重，魏冉因此被罢相，迁回封地陶，最终死于该地。魏冉有功于秦，也因专权而招忌，是外戚执政的典型。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 52
      defense: 20
      agility: 14
  - key: hist_xianqin_0165
    name: 公孙龙
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （前320年—前250年）战国名家学者，赵国人。公孙龙以“白马非马”“离坚白”等辩题游说诸侯，曾为平原君门客，与孔子后裔孔穿等辩论；《公孙龙子》保存了后人整理的部分言论，《白马论》《坚白论》等篇影响较大，其说也常被批评为诡辩。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 18
      agility: 16
  - key: hist_xianqin_0170
    name: 邹忌
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （约前385年—前319年）战国齐国大臣，封于下邳，号成侯，名忌。邹忌以自己不如城北徐公美貌、却受妻妾与门客称赞为喻，劝齐威王广开言路，使齐国一度政治清明；他后来担任相国，参与朝政，却与战功卓著的田忌发生政争，排挤这位大将。邹忌长于讽谏与政务，其相位之争也暴露出齐国朝臣间的倾轧。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_xianqin_0183
    name: 毛遂
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）战国赵国平原君门客。秦军围邯郸时，毛遂自荐随平原君出使楚国；楚王迟迟不肯出兵，他按剑上前，陈说楚赵联合的利害，促成两国歃血结盟。平原君回国后奉他为上客。“毛遂自荐”由此成为主动任事的典故，其胆识固然可嘉，但后世也常借此讨论自荐与知人的分寸。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 52
      defense: 20
      agility: 14
  - key: hist_xianqin_0189
    name: 甘罗
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （约前256年—?）战国秦国使者，甘茂之孙。十二岁时，甘罗事奉相国吕不韦，说服张唐出使燕国；随后又出使赵国，劝赵王攻燕并献五城，使秦国不战而得地。秦王因此封他为上卿，赐以田宅。甘罗少年成名，其事迹见于《史记·樗里子甘茂列传》，后世多将其视为早慧使臣的代表。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 18
      agility: 16
  - key: hist_xianqin_0181
    name: 赵奢
    avatar: monkey/其他随机角色/武044_男_.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）战国赵国将领。赵奢任田部吏收税时，依法处治平原君赵胜的家臣，并陈说守法与国用的关系，因此得到赵惠文王赏识；阏与之战中，他先示弱骄敌，再急行军抢占北山，大败秦军。赵奢生前曾评儿子赵括把用兵看得太轻易，断定其若为将必致败军，后来长平之败果然应验。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 14
      defense: 26
      agility: 18
  - key: hist_xianqin_0187
    name: 鲁仲连
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （约前305年—约前245年）战国游士，齐国人。秦军围邯郸时，魏国使者辛垣衍主张尊秦为帝以求安，鲁仲连当面反驳，指出尊秦将失诸侯之权，促使赵国坚持抵抗；秦军撤退后，平原君欲赠金封爵，他坚辞不受，离开赵国。鲁仲连以布衣之身排难解纷而不居功，被后世视为义士的典型。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_xianqin_0192
    name: 申不害
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （?—前337年）战国韩国相国，郑国人。申不害受到韩昭侯任用后，在韩国执政十五年，以考核官吏、隐藏君主意图等“术”整顿政务，使韩国国治兵强，诸侯不来侵伐；他主张君主以术驾驭臣下，与商鞅重“法”、慎到重“势”并称。申不害死后，韩昭侯仍继续使用其政令，韩国也渐失其强势。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0197
    name: 姬丹
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （?—前226年）燕王喜之子，燕太子丹。太子丹早年在赵国为质，与同在赵国的嬴政相识；秦王政即位后，他又入秦为质，因受冷遇而逃回燕国。回国后，他招揽田光、荆轲谋划刺秦，事败后秦军攻燕，燕王喜为求自保杀死太子丹，将其首级献给秦国。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 50
      defense: 20
      agility: 16
  - key: hist_xianqin_0174
    name: 司马错
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）战国秦国将领。秦惠文王时，司马错与张仪争论先攻韩国还是先取蜀地，他认为得蜀可以广地、富国、强兵，秦王采纳其议，命他率军灭蜀，随后平定巴地。此后他又参加秦国对楚国的战争，攻取黔中等地。司马错的主张着眼于长远国力，与张仪急取中原的思路形成对照。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 18
      defense: 26
      agility: 18
  - key: hist_xianqin_0177
    name: 蒙骜
    avatar: pig/武010.png
    default_gender: male
    archetype: military
    flavor: （?—前240年）战国秦国将领，原为齐国人，蒙武之父、蒙恬祖父。蒙骜在秦昭襄王、庄襄王和秦王政时期长期领兵，攻韩、伐赵、击魏，曾攻取成皋、荥阳，设置三川郡，又夺取魏国东郡等地，使秦国疆域不断向东推进。他死后，蒙武、蒙恬相继为秦将。蒙氏三代事秦，是秦统一过程中重要的将门力量。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 14
      defense: 26
      agility: 18
  - key: hist_xianqin_0194
    name: 公孙衍
    avatar: monkey/其他随机角色/文男213.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）战国纵横家，魏国人，号犀首。公孙衍曾任秦国大良造，率军攻取魏国雕阴等地，后离秦入魏，转而组织合纵，游说燕、赵、韩、魏和中山互相尊王，并多次策动诸侯攻秦。他与张仪一纵一横，长期在外交上对立，是战国中期合纵派的代表人物。其成败随诸侯利害而起伏，也映照出纵横家的处境。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_xianqin_0196
    name: 唐雎
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）战国魏国安陵君使臣。秦王政提出用五百里土地换取安陵五十里封地，安陵君不愿，派唐雎入秦交涉。唐雎坚持安陵是祖先所受封地，不能割让；面对秦王“天子之怒”的威胁，他以布衣之怒相抗，表示愿与秦王同归于尽，秦王只得道歉，安陵得以保全。此事见于《战国策》，唐雎的胆识也为后世所称道。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 52
      defense: 22
      agility: 12
  - key: hist_xianqin_0156
    name: 师旷
    avatar: monkey/其他随机角色/文039_男.png
    default_gender: male
    archetype: civil
    flavor: （约前572年—约前532年）春秋晋国乐师，字子野，双目失明。师旷精通音律，善弹琴，曾为晋平公奏乐，并能从乐声推测政事得失；他也多次直谏晋平公，反对穷兵黩武、大兴土木，主张爱惜民力。后世流传师旷以音乐占卜、辨别吉凶的故事，多带传说色彩。其人以乐官而参政，是先秦乐师中影响较大的一位。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 18
      agility: 16
  - key: hist_xianqin_0157
    name: 文种
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （?—前472年）春秋越国大夫，楚国人。文种与范蠡一同辅佐越王勾践，在会稽战败后，他提出离间吴国君臣、贿赂吴太宰嚭、疲耗吴国等计策，帮助越国恢复国力并最终灭吴。勾践称霸后，范蠡劝他离去，文种未听，留在越国，后被赐剑自杀。文种长于谋国而短于自处，其结局常与“鸟尽弓藏”的感叹相连。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_xianqin_0161
    name: 申包胥
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋楚国大夫，与伍子胥曾为旧友。伍子胥引吴军攻破楚都后，申包胥赴秦国求援，在秦廷外倚墙哭泣七日七夜，终于打动秦哀公，秦国出兵击退吴军，楚国得以复国。事后楚王论功行赏，申包胥拒绝接受，退隐山野。其哭秦庭之举，体现了对故国的执着，也被后世视为忠义与外交胆识的象征。
    growth_range:
    - 5
    - 9
    attribute_weights:
