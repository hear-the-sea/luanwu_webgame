heroes:
  purple:
  - key: hero_qin_shubao
    name: 秦叔宝
    archetype: military
    flavor: 隋唐名将，勇冠三军，战场上敢为先锋，屡立奇功。其人忠义有节，重视军纪与士气，能令部下信服。传闻他守门护民、为民请命，既是猛将也是仁将，声望遍及军中与民间。出自《隋唐演义》。无论成败如何，秦叔宝所面对的战场条件都具有典型性，因此其经验常被后人用作比较案例。
    default_gender: male
    default_morality: 80
    recruitable: true
    avatar: monkey/隋唐演义/秦叔宝.png
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 45
      intellect: 15
      defense: 25
      agility: 15
  - key: hero_luo_cheng
    name: 罗成
    avatar: monkey/隋唐演义/罗成.png
    archetype: military
    flavor: 银枪白马，骁勇善战，身法迅捷如风，冲阵时如银电贯空。年少英气逼人，心思却谨慎，擅长以奇招克敌。演义中他是罗艺之子、秦琼的表弟，出身将门，曾与秦琼等人在瓦岗军中并肩作战，后归唐效力；淤泥河一战中计陷于河岸，被乱箭射死。出自《隋唐演义》。其短暂一生以少年意气与沙场锋芒留下鲜明形象。
    default_gender: male
    default_morality: 75
    recruitable: true
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 45
      intellect: 15
      defense: 25
      agility: 15
  - key: hero_cheng_yaojin
    name: 程咬金
    avatar: monkey/任务/程咬金.png
    archetype: military
    flavor: 号混世魔王，性格豪爽直率，言行不拘小节，笑骂皆真。其人武力刚猛，冲锋时气势如虹，常凭一股蛮劲破敌阵。虽粗中有细，关键时刻能护住同伴，令人又敬又服。出自《隋唐演义》。其关键决断对政局节奏产生了放大效应，也因此成为研究隋唐时期政治机制时难以绕开的节点。
    default_gender: male
    default_morality: 70
    recruitable: true
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 45
      intellect: 15
      defense: 25
      agility: 15
  - key: hero_suitang_0102
    name: 宇文成都
    archetype: military
    default_gender: male
    default_morality: 35
    recruitable: true
    avatar: monkey_wu_male2.png
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 48
      intellect: 12
      defense: 25
      agility: 15
    flavor: 大隋天宝大将，宇文化及之子，位列隋唐第二条好汉。身长一丈、腰大十围，手使四百斤凤翅镏金镋，曾于南阳关外力战雄阔海、伍云召、伍天锡三大好汉而不落下风。虽出身奸臣之家，却傲骨铮铮、忠于职守，明知敌不过李元霸仍昂然迎战，战死沙场而不屈。出自《隋唐演义》。
  - key: hero_suitang_0103
    name: 裴元庆
    archetype: military
    default_gender: male
    default_morality: 70
    recruitable: true
    avatar: monkey_wu_male3.png
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 48
      intellect: 10
      defense: 20
      agility: 22
    flavor: 隋唐第三条好汉，裴仁基第三子，年少成名、英气勃发，手使一对三百斤八棱梅花亮银锤。四明山一役硬接李元霸三锤不退，震动天下群雄；后因不满宇文化及陷害，随父归附瓦岗军，屡立奇功。虽少年性烈易激，最终误入庆坠山火雷阵陨落，却以银锤少年之姿名传千古。出自《隋唐演义》。
  - key: hero_suitang_0104
    name: 雄阔海
    archetype: military
    default_gender: male
    default_morality: 75
    recruitable: true
    avatar: monkey_wu_male4.png
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 46
      intellect: 10
      defense: 30
      agility: 14
    flavor: 紫面天王雄阔海，太行山好汉，位列隋唐第四条好汉，手使一根一百六十斤熟铜棍，力大无穷且豪气干云。曾单人空手打虎，又与伍云召、伍天锡合战宇文成都，威震四方。扬州夺魁之战中，为救被困城门的反王群雄，双手死死托住千斤闸，力竭而亡，其忠义气概令天下豪杰动容。出自《隋唐演义》。
  - key: hero_suitang_0105
    name: 伍云召
    archetype: military
    default_gender: male
    default_morality: 85
    recruitable: true
    avatar: monkey_wu_male5.png
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 44
      intellect: 18
      defense: 20
      agility: 18
    flavor: 南阳侯伍云召，忠孝王伍建章之子，位列隋唐第五条好汉，手使亮银枪，坐骑照夜玉狮子，文武兼备、仪表堂堂。其父遭宇文化及陷害满门抄斩后，他在南阳关起兵反隋，孤身杀透重围、怀抱幼子突围奔河北，忠孝节义冠绝当世，是隋唐群雄中罕见的儒雅名将。出自《隋唐演义》。
  - key: hero_suitang_0107
    name: 樊梨花
    archetype: military
    default_gender: female
    default_morality: 85
    recruitable: true
    avatar: monkey_wu_female.png
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 38
      intellect: 26
      defense: 16
      agility: 20
    flavor: 西凉寒江关守将樊洪之女，师从梨山老母，精通兵法阵图与移山倒海奇术，善使绣绒刀与诛仙剑，是大唐征西大元帅。她胸怀大义，识破番邦局势后毅然归唐，历经三休三请的曲折仍不改忠贞，率军平定西凉、屡破奇阵，乃隋唐演义系列中最负盛名的巾帼统帅。出自《隋唐演义》。
  - key: hero_suitang_0108
    name: 伍天锡
    archetype: military
    default_gender: male
    default_morality: 65
    recruitable: true
    avatar: monkey_wu_male7.png
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 46
      intellect: 12
      defense: 26
      agility: 16
    flavor: 沱罗寨寨主，伍云召族弟，位列隋唐第六条好汉。生得身高一丈、豹头环眼，手使一对二百斤半月混天镗，武艺刚猛无匹。早年啸聚山林，后因敬重族兄忠义而共赴反隋大业，四明山曾与雄阔海、伍云召联手力战宇文成都，扬州城外死于李元霸双锤之下，堪称一世枭雄。出自《隋唐演义》。
  - key: hero_suitang_0109
    name: 罗松
    archetype: military
    default_gender: male
    default_morality: 80
    recruitable: true
    avatar: monkey_wu_male8.png
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 18
      agility: 22
    flavor: 字永年，罗艺长子、罗成同父异母之兄，枪法集罗家枪与姜家枪之大成，深沉稳重、深藏不露。曾在一字长蛇阵外一枪挑开李元霸与罗士信的铁锤铁枪，技惊四座却不恋功名。他心胸宽广，毫无兄弟龃龉，将绝学精义倾囊相授，是隋唐江湖中公认的一代枪术宗师。出自《隋唐演义》。
  - key: hero_suitang_0122
    name: 薛丁山
    archetype: military
    default_gender: male
    default_morality: 80
    recruitable: true
    avatar: pig_wu_male6.png
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 40
      intellect: 22
      defense: 20
      agility: 18
    flavor: 平辽王薛仁贵之子，自幼随王敖老祖习武学阵，手使方天画戟，兼通奇门兵法，乃大唐二路征西元帅。他临危受命率军救父，历经锁阳城、寒江关诸役，与樊梨花历经波折终成眷属，夫妻同心平定西凉。性格虽偶有执拗，然大节不亏，堪称唐代演义中承前启后的中兴名将。出自《隋唐演义》。
  orange:
  - key: hero_suitang_0101
    name: 李元霸
    archetype: military
    default_gender: male
    default_morality: 50
    recruitable: true
    avatar: monkey_wu_male1.png
    growth_range:
    - 8
    - 13
    attribute_weights:
      force: 55
      intellect: 5
      defense: 25
      agility: 15
    flavor: 隋唐第一条好汉，李渊第四子，生得面如病鬼、骨瘦如柴，却天生神力，手使一对八百斤擂鼓瓮金锤，坐骑万里云。四明山一战单骑破十八路反王大军，紫金山锤震群雄，天下无人能接其三合。性情憨直暴烈，唯有对二哥李世民言听计从，最终举锤骂天而亡，留下千古神力传说。出自《隋唐演义》。
  blue:
  - key: hero_suitang_0110
    name: 魏文通
    archetype: military
    default_gender: male
    default_morality: 60
    recruitable: true
    avatar: monkey_wu_male9.png
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 45
      intellect: 15
      defense: 24
      agility: 16
    flavor: 潼关元帅魏文通，位列隋唐第九条好汉，因面貌酷似关公、手使一口青龙大刀，人称花刀大帅、赛关爷。他统兵严谨，受杨林调遣追击秦琼，九战瓦岗群雄而不怯，刀法沉雄凌厉。最终在战场被神箭手王伯当一箭射杀，虽忠于隋室，其武勇与气节仍令对手钦敬。出自《隋唐演义》。
  - key: hero_suitang_0111
    name: 尚师徒
    archetype: military
    default_gender: male
    default_morality: 68
    recruitable: true
    avatar: monkey_wu_male10.png
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 20
      defense: 25
      agility: 15
    flavor: 临潼关总兵，位列隋唐第十条好汉，身怀提炉枪、呼雷豹、夜明盔、唐猊铠四件稀世珍宝，人称四宝大将。他治军仁厚，深得军民爱戴，曾力拒瓦岗军数月。后因力战难支，不愿屈节降敌，将坐骑与兵刃赠予秦琼后自刎殉国，留下一段英雄惜英雄的悲壮佳话。出自《隋唐演义》。
  - key: hero_suitang_0112
    name: 新文礼
    archetype: military
    default_gender: male
    default_morality: 50
    recruitable: true
    avatar: monkey_wu_male11.png
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 26
      agility: 14
    flavor: 弘霓关总兵，位列隋唐第十一条好汉，手使二百斤铁方槊，身长丈二、膂力过人，人称八马将。他驻守关隘严密，曾以火雷阵诱杀猛将裴元庆，使瓦岗军元气大伤。虽为大隋效命而与群雄为敌，然其临阵死战不退、宁折不弯，终在群雄合围下重伤自尽，颇具悍将本色。出自《隋唐演义》。
  - key: hero_suitang_0113
    name: 定彦平
    archetype: military
    default_gender: male
    default_morality: 78
    recruitable: true
    avatar: monkey_wu_male12.png
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 20
      defense: 20
      agility: 18
    flavor: 双枪老将定彦平，又称丁彦平，系北齐遗将，一手双枪神出鬼没，绿林与官军皆敬其威名。他曾受杨林之邀出山助阵，却收罗成为义子并倾囊传授破双枪之法。待阵前见义子反戈破阵，虽心痛却未怀恨，最终看破红尘归隐山林，尽显一代武学前辈的洒脱与胸襟。出自《隋唐演义》。
  - key: hero_suitang_0114
    name: 丘瑞
    archetype: military
    default_gender: male
    default_morality: 82
    recruitable: true
    avatar: monkey_wu_male13.png
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 38
      intellect: 24
      defense: 24
      agility: 14
    flavor: 大隋昌平王，老成持重的开国宿将，与秦琼之父秦彝交情深厚。虽年迈仍能披挂上阵，手使一杆长枪威风不减当年。奉旨征讨瓦岗山时，见杨广昏庸、宇文化及专权，又感念秦琼忠义，遂毅然倒戈归顺瓦岗，后为救旧部不惜以身殉义，深得两军敬重。出自《隋唐演义》。
  - key: hero_suitang_0115
    name: 左天成
    archetype: military
    default_gender: male
    default_morality: 55
    recruitable: true
    avatar: monkey_wu_male14.png
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 44
      intellect: 16
      defense: 24
      agility: 16
    flavor: 武安州总兵，手使一口金背砍山刀，坐骑黄骠马，武艺高强且颇懂阵法。曾奉命镇守四平山要隘，连败瓦岗数员战将，令义军一度束手无策。后在阵前与雄阔海、裴元庆等绝顶猛将激战，终因寡不敌众战死沙场，是隋末演义中极具分量的一方守关大将。出自《隋唐演义》。
  - key: hero_suitang_0116
    name: 谢映登
    archetype: military
    default_gender: male
    default_morality: 80
    recruitable: true
    avatar: monkey_wu_male16.png
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 22
      defense: 12
      agility: 28
    flavor: 瓦岗寨贾家楼四十六友之一，出身名门，素以神射绝技闻名天下，百步穿杨、箭无虚发，兼通兵法与道家养生之术。起义初期屡以冷箭解救秦琼、程咬金于危难之中，立下汗马功劳。待大唐基业初定，他看淡荣华富贵，飘然辞官修道而去，成为瓦岗群雄中结局最超脱的一人。出自《隋唐演义》。
  - key: hero_suitang_0117
    name: 尤俊达
    archetype: military
    default_gender: male
    default_morality: 72
    recruitable: true
    avatar: pig_wu_male1.png
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 38
      intellect: 22
      defense: 20
      agility: 20
    flavor: 铁面天王尤俊达，绿林响马出身，瓦岗寨五虎将之一，手使五股托天叉，胆大心细、机变百出。早年与程咬金合伙劫取靠山王皇纲，揭开瓦岗群雄聚义的序幕；入瓦岗后多次充当先锋与奇兵，后归唐南征北战，性格爽朗重义，极善周旋于江湖绿林之间。出自《隋唐演义》。
  - key: hero_suitang_0118
    name: 王君可
    archetype: military
    default_gender: male
    default_morality: 82
    recruitable: true
    avatar: pig_wu_male2.png
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 43
      intellect: 17
      defense: 24
      agility: 16
    flavor: 瓦岗寨大刀王君可，生得绿袍金甲、长髯飘胸，手使一口青龙偃月大刀，人称美髯公、赛关羽。他为人忠厚仗义，在贾家楼结拜中位列前茅，瓦岗起兵后常为冲阵先锋，刀法大开大合、势不可挡。后随秦琼等人归唐，屡立战功，是瓦岗军中极受敬重的仁义猛将。出自《隋唐演义》。
  - key: hero_suitang_0119
    name: 东方伯
    archetype: military
    default_gender: male
    default_morality: 58
    recruitable: true
    avatar: pig_wu_male3.png
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 16
      defense: 20
      agility: 20
    flavor: 新文礼之内兄，手使一对镔铁虎头戟，坐骑枣红马，武艺高强、性情刚烈。听闻妹夫新文礼兵败身亡，他孤身持戟杀奔瓦岗营前叫阵，连挑义军数将，枪戟并举如疾风骤雨，非寻常战将所能抵挡。最终在乱军中力战而死，其悍勇之名深印于隋唐演义之中。出自《隋唐演义》。
  - key: hero_suitang_0120
    name: 梁师泰
    archetype: military
    default_gender: male
    default_morality: 65
    recruitable: true
    avatar: pig_wu_male4.png
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 45
      intellect: 10
      defense: 27
      agility: 18
    flavor: 挂锤庄庄主，四猛八大锤之一，手使一对一百六十斤镔铁轧油锤，天生神力、豪爽直率。因折服于李元霸的无双神勇，甘愿追随其左右充当开路先锋，随唐军转战四方、逢山开路。后在沙场与单雄信交锋时不幸中计阵亡，其憨勇忠直的形象令人难忘。出自《隋唐演义》。
  - key: hero_suitang_0121
    name: 罗通
    archetype: military
    default_gender: male
    default_morality: 78
    recruitable: true
    avatar: pig_wu_male5.png
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 16
      agility: 24
    flavor: 罗成之子，少年英雄，年仅十六岁便在演武场夺得扫北元帅印，继承祖传罗家枪法，英姿飒爽、锋芒毕露。率军北征突厥，连破敌阵救出被困的李世民，立下不世之功。他性情孤傲重承诺，晚年出征西凉时盘肠大战老将王不超，同归于尽，尽显罗家满门忠烈本色。出自《隋唐演义》。
  - key: hero_suitang_0106
    name: 秦用
    avatar: monkey_wu_male9.png
    archetype: military
    flavor: 大明府黄脸汉将，秦琼义子，位列隋唐四猛之一，号称“铜锤将”。他手使一对八棱梅花亮银锤，勇猛绝伦，曾助瓦岗军大破铜旗阵，更在阵前一锤砸死突厥大将红海，少年英气令敌军闻风丧胆。出自《隋唐演义》。
    default_gender: male
