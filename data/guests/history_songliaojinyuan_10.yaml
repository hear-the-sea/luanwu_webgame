    archetype: military
    flavor: 明玉珍（1331—1366），元末红巾军将领。随徐寿辉起兵，入蜀后据有四川，至正二十二年称帝，国号大夏；在位时减轻赋役，死后其子明昇继位并降明。
    growth_range:
    - 3
    - 7
    attribute_weights:
