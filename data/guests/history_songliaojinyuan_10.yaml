      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0473
    name: 脱脱帖木儿
    default_gender: male
    archetype: military
    flavor: 脱脱帖木儿，即脱脱（1314—1355），字大用，蔑儿乞氏，元末政治家、军事家。曾任丞相，推行“脱脱更化”，恢复科举并参与主持宋、辽、金三史修纂；征高邮失利后被罢相，流云南并死。
    growth_range:
