    default_gender: male
    archetype: military
    flavor: 也速，蒙古人，月阔察儿之子，元末将领、丞相。随脱脱镇压芝麻李，参与淮西、淮东、海州等战事，官至辽阳行省左丞相；明军北伐时率军北逃。
    growth_range:
