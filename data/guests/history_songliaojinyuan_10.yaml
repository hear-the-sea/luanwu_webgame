    default_gender: male
    archetype: military
    flavor: 方国珍（1319—1374），台州黄岩人，盐贩出身。至正八年起兵海上，据有浙东；多次接受元廷招安并与朱元璋周旋，最终归降明朝，卒于南京。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
