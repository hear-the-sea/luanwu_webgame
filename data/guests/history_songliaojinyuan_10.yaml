    default_gender: male
    archetype: military
    flavor: 答失蛮（1258—1317），哈剌鲁氏，元朝大臣。随忽必烈取云南、伐南宋，参与征讨乃颜及西北叛王；历任司农卿、宣徽院使，官至参知政事，谥忠亮。
