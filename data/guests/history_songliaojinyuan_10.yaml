    archetype: military
    flavor: 察罕帖木儿（？—1362），字廷瑞，元末将领，乃蛮人。组织地方武装镇压红巾军，攻取关陕、河南等地，官至河南行省平章政事；围益都时被田丰、王士诚刺杀。
    growth_range:
