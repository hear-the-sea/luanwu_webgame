    flavor: 哈剌哈孙（1257—1309），斡剌纳儿氏，元朝大臣。历任湖广、江浙行省平章政事及中书右丞相；元成宗死后召海山、爱育黎拔力八达入京，拥立元武宗，因定难功封太傅，谥忠献。
