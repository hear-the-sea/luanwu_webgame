    default_gender: male
    archetype: military
    flavor: 韩山童（？—1351），元末红巾军首领。与刘福通在颍州起事，宣称“明王出世”；不久被元军捕杀，其子韩林儿后来被拥立为小明王。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
