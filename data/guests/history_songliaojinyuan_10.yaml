    flavor: 管道升（1262—1319），字仲姬，号瑶姬，元代女书画家，赵孟頫之妻。工书善画，尤擅墨竹、兰梅，传世有《竹石图》等，著有《管夫人诗集》。
    growth_range:
    - 3
