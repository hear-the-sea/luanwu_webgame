heroes:
  blue:
  - key: hist_songliaojinyuan_0462
    name: 张养浩
    default_gender: male
    archetype: civil
    flavor: （1270年-1329年）元朝政治家、散曲家。他的《山坡羊·潼关怀古》"兴，百姓苦；亡，百姓苦"千古传诵，道尽了历史的沧桑。评价张养浩时，往往需要把作品风格、思想立场与身处时局放在同一框架里观察。其散曲中强烈的民生关切，使他在元代文人谱系里始终保持鲜明辨识度。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0464
    name: 阿术
    default_gender: male
    archetype: military
    flavor: （1227年-1281年）元朝名将，兀良合台之子。他攻灭大理，参与灭宋。他是元朝统一战争的主力将领。无论成败如何，阿术所面对的战场条件都具有典型性，因此其经验常被后人用作比较案例。从战役链条看，阿术并非孤立节点，其表现通常与同代将领协同关系紧密相连。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0465
    name: 兀良合台
    default_gender: male
    archetype: military
    flavor: （1200年-1272年）元朝名将，速不台之子。他攻灭大理，征服安南，威震南方。他是元朝向西南扩张的主帅。兀良合台的军事表现通常放在宋辽金元之际攻守格局中审视，其得失与兵力组织、补给条件和战略窗口密切相关。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0474
    name: 刘福通
    default_gender: male
    archetype: military
    flavor: （1321年-1363年）红巾军领袖，元末农民起义的领导者。他拥立韩林儿为帝，建立龙凤政权。他是朱元璋崛起的铺路人。若从政权运作层面审视，刘福通的事迹之所以关键，在于它清楚呈现了宋辽金元之际国家能力与统治边界的变化。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0480
    name: 张士诚
    default_gender: male
    archetype: military
    flavor: （1321年-1367年）元末割据势力，占据苏州。他建立大周政权，与朱元璋争雄。他最终兵败被俘，自缢身亡。张士诚的军事表现通常放在宋辽金元之际攻守格局中审视，其得失与兵力组织、补给条件和战略窗口密切相关。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0490
    name: 王冕
    default_gender: male
    archetype: civil
    flavor: （1287年-1359年）元代画家、诗人。他以画梅著称，"只留清气满乾坤"道尽高洁品格。王冕的历史面貌通常要结合文体表现、价值取向与现实处境三层信息来判断。王冕相关材料在后世多次被重释，说明其作品内部张力具备跨时期的解释弹性。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0495
    name: 赛典赤
    default_gender: male
    archetype: civil
    flavor: （1211年-1279年）元朝名臣，回族政治家。他治理云南多年，推行儒学，建设水利，使云南经济文化大为发展。从人物史角度看，赛典赤的经历兼具代表性与特殊性，适合用于说明时代结构与个人命运的交错。若把赛典赤放回同代关系网络中观察，其许多选择会呈现出更清晰的现实动因。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0459
    name: 鲜于枢
    default_gender: male
    archetype: civil
    flavor: （1256—1301）字伯机，元代书法家。鲜于枢善行草，悬腕回腕，笔势遒劲纵逸，与赵孟頫并称“南赵北鲜”；《石鼓歌》《醉时歌》等帖可见其不受拘束的气势。晚年官位不显，居杭州困踬而终，纸上纵马的人生，现实里却未必有宽阔驿路。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0460
    name: 邓文原
    default_gender: male
    archetype: civil
    flavor: （1258年-1328年）元代书法家，与赵孟頫、鲜于枢并称“元初三大家”。邓文原的书法有法度，却不失文人气，既受赵孟頫一脉影响，又自成清劲面貌。元初书坛并非只有一家笔意，他的字像在规矩之内留出一条小径，后人临帖时也得沿着这条小径重新走一遍。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0461
    name: 康里巎巎
    default_gender: male
    archetype: civil
    flavor: （1295年-1345年）元代书法家，蒙古族，官至奎章阁学士。康里巎巎善草书，笔势劲健纵逸，奔放中仍有法度；他的身份与书学经历也显示元代书坛并非单一汉地传统，而是多种文化在同一纸面交汇。草书最怕只剩狂乱，他的快笔有骨，才真正快得起来。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0463
    name: 答失蛮
    default_gender: male
    archetype: military
    flavor: 元朝将领，世祖时期随军征宋，参与灭宋多场战事，并因军功获得升擢。答失蛮的早年经历、族属与具体战历已很难复原，元史征伐诸传只留下他的名字与战场位置。对一位史料稀薄的将领，最准确的赞语不是百战百胜，而是承认他曾在那场统一战争中真正任过事。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0466
    name: 唆都
    default_gender: male
    archetype: military
    flavor: 元朝将领，至元年间奉命征讨缅甸，率军深入蒲甘腹地。远征遭遇暑湿、疫病、补给困难与地形阻隔，虽曾展现元军军威，士卒损失也很重；这场远征既有军事推进，也付出了沉重代价。南方雨林不是草原，马背上的旧经验到了这里，也得先向泥水低头。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0467
    name: 也先帖木儿
    default_gender: male
    archetype: military
    flavor: 也先帖木儿（？—1294年），元朝将领。至元年间镇守西北，屡与海都部交战，后受命节制河西、甘肃诸军，经营西北防线。具体守边战事记载有限，但元廷大德年间仍可见其旧部驻守要隘；边防的功劳有时不在一场大捷，而在敌军始终没能轻易越过那条线。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0468
    name: 土土哈
    default_gender: male
    archetype: military
    flavor: （1237年-1297年）元朝名将，长期镇守西北，参与击退海都军，是元廷边防的重要支柱。土土哈不只凭个人勇力取胜，还要统合诸军、守住粮道与要隘；蒙古诸王反复来攻，正考验将领能否把帝国的资源变成一条稳定防线。能在草原对手面前站住，靠的是耐心与组织，而不只是快马弯刀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0469
    name: 察罕帖木儿
    default_gender: male
    archetype: military
    flavor: 察罕帖木儿（约？—1362），本贯沈丘，元末将领。至正年间起兵镇压红巾军，连复关陕、河南诸路，官至河南行省平章政事，成为元廷在中原的重要屏障。后来他在益都被降将田丰、王士诚诱杀，元廷随之失去一位能把地方兵力拢起来的主帅；乱世最怕的不是没有将军，而是将军死在自己人的酒席边。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0470
    name: 扩廓帖木儿
    default_gender: male
    archetype: military
    flavor: （？—1375年）即王保保，元末名将，继承义父察罕帖木儿的军队与事业。朱元璋称其为“天下奇男子”，并非只夸勇力，更因为扩廓帖木儿在元廷日渐衰弱时仍能长期与明军周旋。他既是元朝最后的支柱，也身处地方军阀化的趋势之中；他的功业与处境，共同构成了这段末世风云。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0471
    name: 李思齐
    default_gender: male
    archetype: military
    flavor: （？—1374年）元末将领，长期镇守关陕，与扩廓帖木儿争夺军权。两人冲突使元军内讧，关陕力量彼此消耗，也给明军推进留下机会；但李思齐并非一人便能决定元朝生死，他的选择是地方军队坐大、中央失控的症状之一。末世的内斗，常让敌人还没出剑，自己先把盾牌砍出了缺口。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0472
    name: 孛罗帖木儿
    default_gender: male
    archetype: military
    flavor: 孛罗帖木儿（？—1365年），元末权臣。至正年间与扩廓帖木儿争夺兵权，率军进入大都、控制朝廷并挟制顺帝，专擅一时；至正二十五年被顺帝密令刺杀于宫中。军队进城便能夺权，却不能因此获得真正的合法性，孛罗帖木儿的跋扈把元廷内部最后的缝隙也撕得更大。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0473
    name: 脱脱帖木儿
    default_gender: male
    archetype: military
    flavor: （生卒年不详，约卒于1362年前）元朝宗室，元末镇守辽东。红巾军横扫中原时，脱脱帖木儿以保境为先，使辽东暂免大规模战火；其死后纳哈出接掌当地，直到洪武二十年才归降明朝。史料对他生平记载零散，但守住一隅不让乱火蔓延，也是一种很实际的功劳。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0475
    name: 韩山童
    default_gender: male
    archetype: military
    flavor: 元末白莲教首领。至正十一年（1351），韩山童与刘福通等在颍州起事，以“明王出世”为号召，拉开红巾军大起义的序幕；不久被元军捕杀，其子韩林儿后来被拥立为小明王，继续抗元。韩山童本人没能走完这条路，却把一粒火星递进了元末最干燥的草原。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0476
    name: 郭子兴
    default_gender: male
    archetype: military
    flavor: （1302年-1355年）红巾军领袖，朱元璋的岳父。郭子兴起兵后据濠州，收留并重用朱元璋，为后者后来崛起提供了重要起点；但他与部众、同僚之间也有权力摩擦，并非一位只会提携后辈的慈长。乱世收下一名年轻部将，谁能想到他日后会把整座天下的棋盘接过去。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0477
    name: 徐寿辉
    default_gender: male
    archetype: military
    flavor: 徐寿辉（1320年—1360年），元末红巾军领袖，天完政权建立者。至正十一年起兵蕲州，攻克湖广、江西北部多处州县，建都蕲水称帝；后来势力渐衰，被部将陈友谅架空，至正二十年在采石遇刺。草莽起兵时人人喊他明主，等地盘与兵权变多，最危险的刀往往来自自己的帐篷。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0478
    name: 明玉珍
    default_gender: male
    archetype: military
    flavor: 红巾军徐寿辉部将，后来率军入蜀，至正二十二年（1362）称帝，国号大夏，建元天统。明玉珍据有四川后，轻徭薄赋、休养生息，与朱元璋政权相持数年；至正二十六年病卒，子明昇继位，洪武四年降明。乱世诸侯都能称帝，真正难的是在山河握到手后让百姓喘口气。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0479
    name: 方国珍
    default_gender: male
    archetype: military
    flavor: 方国珍（1319—1374），台州黄岩人，盐贩出身。至正八年聚众海上起兵，据有浙东庆元、台州、温州三路，凭水军与海路称雄；他多次接受元廷招安又反复，也曾与朱元璋通好，最终兵败归降，安置南京而卒。方国珍最会的不是一味死战，而是看风向调帆；在海上这叫求生，在史家笔下便容易成了反复。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0481
    name: 也速
    default_gender: male
    archetype: military
    flavor: 也速，蒙古宗室后裔，约活动于十三世纪中后期。史料只见他曾受命统兵镇守北方边地，姓名散见于元廷戍防与宗室名录；《元史》未立专传，仕历、军功与生卒都难详考。对这样的边地宗王，能确定的不是一套传奇战法，而是他曾在帝国北线承担过一段职责。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0482
    name: 帖木儿不花
    default_gender: male
    archetype: military
    flavor: （？—约1290年）蒙古将领，参与元初多场征服与镇抚战事。帖木儿不花活动在蒙古帝国由冲锋转向治理的阶段，既要听军令，也要面对地方的实际反应；战马踏过的疆域，最终还要靠日常治理才能站稳。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0483
    name: 塔察儿
    default_gender: male
    archetype: military
    flavor: （？—约1260年）蒙古宗室，东道诸王之一，出自成吉思汗弟弟的后裔，分封东北而拥兵甚众。自太宗至世祖朝，塔察儿参与征伐与朝议，既是皇族也是地方兵力的主人，立场自然受蒙古内部格局牵动。晚年事迹已少见记载；大汗的诏令传得很远，宗王自己的算盘也不小。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0484
    name: 脱欢
    default_gender: male
    archetype: military
    flavor: 脱欢（1304—1362），权臣燕铁木儿之子。父亲拥立元顺帝后不久去世，脱欢袭爵，起初仍参与朝政，却已远不及乃父权势；顺帝亲政后渐被疏远，最终出任外职。燕铁木儿家族的荣光来得太盛，脱欢一生都在它的余影里行走，想凭自己的脚印留下名字并不容易。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0485
    name: 燕铁木儿
    default_gender: male
    archetype: military
    flavor: 元钦察人，宿卫出身。泰定帝去世后，燕铁木儿发动政变，拥立文宗图帖睦尔；两都之战又率军击败上都军，因功封太平王，长期总揽朝政。1333年病卒后，家族势力迅速瓦解。燕铁木儿把皇位扶上去，也把自己的手伸得太深，最终朝廷与家族都很难安稳收场。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0486
    name: 哈剌哈孙
    default_gender: male
    archetype: civil
    flavor: （1257年-1308年）元朝名臣，历仕世祖、成宗、武宗三朝，官至中书右丞相。成宗去世后，哈剌哈孙力主迎立武宗，使政权避免在继承关口立即失序；施政又重视协调蒙汉官僚关系。朝廷风浪越大，越需要有人先把船舵握住，他的功劳正在这种不显赫却关键的稳住局面。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
