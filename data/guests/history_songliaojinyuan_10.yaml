    archetype: civil
    flavor: 欧阳玄（1283—1358），字原功，号圭斋，元代文学家、史学家、官员。官至翰林学士承旨，至正年间参与纂修宋、辽、金三史并任总裁官，著有《圭斋文集》。
    growth_range:
