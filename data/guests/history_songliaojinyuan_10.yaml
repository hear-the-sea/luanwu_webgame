    default_gender: male
    archetype: military
    flavor: 孛罗帖木儿（？—1365），散只兀氏，元末将领。随父答失八都鲁镇压红巾军，后与察罕、扩廓帖木儿争夺晋冀；至正二十四年率军攻入大都，次年被元顺帝密令刺杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
