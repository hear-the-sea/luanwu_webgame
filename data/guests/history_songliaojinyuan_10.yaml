    default_gender: male
    archetype: civil
    flavor: 柯九思（1290—1343），字敬仲，号丹丘生，元代书画家、鉴赏家。元文宗时任奎章阁鉴书博士，精于书画鉴定，擅画墨竹，著有《丹丘生集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
