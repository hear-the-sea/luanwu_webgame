    name: 鲜于枢
    default_gender: male
    archetype: civil
    flavor: 鲜于枢（1256—1301），字伯机，元代书法家、官员。善行草，取法晋唐，与赵孟頫并称“南赵北鲜”；传世有《石鼓歌》《醉时歌》等墨迹。
