    archetype: military
    flavor: 帖木儿不花，答答里带人，元初蒙古将领。至元七年（1270）从攻襄阳，击败宋将范文虎；随伯颜渡江，参与攻取建康、临安等地，后官至中书左丞、四川行省平章政事。
