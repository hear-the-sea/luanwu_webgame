    default_gender: male
    archetype: military
    flavor: 也先帖木儿（？—1332），忽必烈第五子忽哥赤之子，元朝宗王，袭封云南王。元军征缅甸时奉命镇抚大理等处，后进封营王；与元末同名官员及南坡之变人物有别。
