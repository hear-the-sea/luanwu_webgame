    name: 李思齐
    default_gender: male
    archetype: military
    flavor: 李思齐（1323—1374），字世贤，罗山人，元末明初将领。与察罕帖木儿组织武装镇压红巾军，后据陕西长安，与扩廓帖木儿争战；洪武二年降明，奉使招降王保保，返途中受伤而卒。
    growth_range:
