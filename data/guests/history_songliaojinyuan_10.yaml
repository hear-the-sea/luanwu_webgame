    default_gender: male
    archetype: military
    flavor: 塔察儿，铁木哥斡赤斤之孙，蒙古东道宗王、将领。继承斡赤斤兀鲁思，参与攻宋；蒙哥时期统军攻樊城，忽必烈与阿里不哥争位时支持忽必烈并随征阿里不哥，后仍领其部。
