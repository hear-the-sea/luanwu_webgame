    default_gender: male
    archetype: military
    flavor: 徐寿辉（1320—1360），元末红巾军领袖，天完政权建立者。至正十一年起兵蕲州，势力扩及湖广、江西；后受陈友谅控制，至正二十年在采石被刺杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
