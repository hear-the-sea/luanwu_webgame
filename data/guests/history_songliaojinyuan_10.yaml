    archetype: military
    flavor: 燕铁木儿（1285—1333），钦察人，土土哈之孙、床兀儿之子。元泰定帝死后在大都发动政变，拥立元文宗，官至中书右丞相、知枢密院事，封太平王，长期掌握朝政。
    growth_range:
