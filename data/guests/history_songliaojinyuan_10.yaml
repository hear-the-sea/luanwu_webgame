heroes:
  blue:
  - key: hist_songliaojinyuan_0462
    name: 张养浩
    default_gender: male
    archetype: civil
    flavor: （1270年-1329年）元朝政治家、散曲家。他的《山坡羊·潼关怀古》"兴，百姓苦；亡，百姓苦"千古传诵，道尽了历史的沧桑。评价张养浩时，往往需要把作品风格、思想立场与身处时局放在同一框架里观察。其散曲中强烈的民生关切，使他在元代文人谱系里始终保持鲜明辨识度。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0464
    name: 阿术
    default_gender: male
    archetype: military
    flavor: （1227年-1281年）元朝名将，兀良合台之子。他攻灭大理，参与灭宋。他是元朝统一战争的主力将领。无论成败如何，阿术所面对的战场条件都具有典型性，因此其经验常被后人用作比较案例。从战役链条看，阿术并非孤立节点，其表现通常与同代将领协同关系紧密相连。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0465
    name: 兀良合台
    default_gender: male
    archetype: military
    flavor: （1200年-1272年）元朝名将，速不台之子。他攻灭大理，征服安南，威震南方。他是元朝向西南扩张的主帅。兀良合台的军事表现通常放在宋辽金元之际攻守格局中审视，其得失与兵力组织、补给条件和战略窗口密切相关。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0474
    name: 刘福通
    default_gender: male
    archetype: military
    flavor: （1321年-1363年）红巾军领袖，元末农民起义的领导者。他拥立韩林儿为帝，建立龙凤政权。他是朱元璋崛起的铺路人。若从政权运作层面审视，刘福通的事迹之所以关键，在于它清楚呈现了宋辽金元之际国家能力与统治边界的变化。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0480
    name: 张士诚
    default_gender: male
    archetype: military
    flavor: （1321年-1367年）元末割据势力，占据苏州。他建立大周政权，与朱元璋争雄。他最终兵败被俘，自缢身亡。张士诚的军事表现通常放在宋辽金元之际攻守格局中审视，其得失与兵力组织、补给条件和战略窗口密切相关。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0490
    name: 王冕
    default_gender: male
    archetype: civil
    flavor: （1287年-1359年）元代画家、诗人。他以画梅著称，"只留清气满乾坤"道尽高洁品格。王冕的历史面貌通常要结合文体表现、价值取向与现实处境三层信息来判断。王冕相关材料在后世多次被重释，说明其作品内部张力具备跨时期的解释弹性。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0495
    name: 赛典赤
    default_gender: male
    archetype: civil
    flavor: （1211年-1279年）元朝名臣，回族政治家。他治理云南多年，推行儒学，建设水利，使云南经济文化大为发展。从人物史角度看，赛典赤的经历兼具代表性与特殊性，适合用于说明时代结构与个人命运的交错。若把赛典赤放回同代关系网络中观察，其许多选择会呈现出更清晰的现实动因。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0459
    name: 鲜于枢
    default_gender: male
    archetype: civil
    flavor: 1256年至1301年在世，元代书法家，字伯机。善行草，悬腕回腕之法自成一家，笔势遒劲纵逸。与赵孟頫并称南赵北鲜，传世有《石鼓歌》《醉时歌》《苏轼海棠诗》等帖。晚年官位不显，居杭州困踬而终。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0460
    name: 邓文原
    default_gender: male
    archetype: civil
    flavor: （1258年-1328年）元代书法家。他与赵孟頫、鲜于枢并称“元初三大家”。其作品常被后世书家临摹评点。他的书法兼具法度与文人气，既承赵孟頫一路，也形成自身面貌，是理解元代书风分化的重要线索。这使他在元代书史中不仅有名作，也有明确的风格位置。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0461
    name: 康里巎巎
    default_gender: male
    archetype: civil
    flavor: （1295年-1345年）元代书法家，蒙古族。他的草书飘逸洒脱，是元代书法的另一高峰。其草书以劲健纵逸见长，既保留游牧文化的力度感，又与中原书学传统深度融合，辨识度极高。后世论草书气骨与速度感时，常把他列作典型范例。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0463
    name: 答失蛮
    default_gender: male
    archetype: military
    flavor: 元朝将领，世祖时期从征南宋，参与攻灭赵宋的多场战事。史料对其早年经历及族属背景记载甚少，可确知者为灭宋战役中积功获擢。其名见于元史征伐诸传，然生平细节多已湮没，后世评价常受限于记载缺失。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0466
    name: 唆都
    default_gender: male
    archetype: military
    flavor: 元朝将领，至元年间奉命征讨缅甸，率军深入蒲甘腹地。战事艰难，虽展军威但损失亦重，缅地暑湿疫病交加，士卒多病损。远征细节散见于元史及西南诸夷列传，其生平本末记录不全，后世难窥全貌。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0467
    name: 也先帖木儿
    default_gender: male
    archetype: military
    flavor: 也先帖木儿（?—1294年），元朝将领。至元年间率军镇守西北，屡与叛王海都部交战，戍边有劳。元世祖命其节制河西、甘肃诸军，巩固西北防线。其守边细节史籍记载有限，大德年间犹见其旧部仍驻要隘。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0468
    name: 土土哈
    default_gender: male
    archetype: military
    flavor: （1237年-1297年）元朝名将，击败海都的功臣。他在西北边疆多次击退海都军，是元朝边防的柱石。在土土哈身上，可见将领个人能力与军政体系边界之间持续拉扯的现实。这些结论也常被用于横向比较不同政权在同类压力下的应对能力。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0469
    name: 察罕帖木儿
    default_gender: male
    archetype: military
    flavor: 1328年至1362年在世，元末将领。本贯沈丘，至正间起兵镇压红巾军，连复关陕、河南诸路，官至河南行省平章政事。被降将田丰、王士诚诱杀于益都，元廷遂失中原屏障。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0470
    name: 扩廓帖木儿
    default_gender: male
    archetype: military
    flavor: （?-1375年）即王保保，元末名将。他继承义父察罕帖木儿的事业，是元朝最后的支柱。朱元璋称他为"天下奇男子"。关于扩廓帖木儿的讨论长期活跃，正因为其个案能集中呈现国家能力的边界问题。这也意味着，其历史位置不宜被简化为“成”或“败”，而应在过程维度中加以解释。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0471
    name: 李思齐
    default_gender: male
    archetype: military
    flavor: （?-1374年）元末将领，镇守关陕。他与扩廓帖木儿争权，导致元军内讧。他的行为加速了元朝的灭亡。李思齐战场表现在不同文献中呈现差异化叙述，值得结合成书背景一并辨析。李思齐相关史料之所以常被引用，在于其个案能够同时呈现前线压力与后方治理的联动关系。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0472
    name: 孛罗帖木儿
    default_gender: male
    archetype: military
    flavor: 孛罗帖木儿（?—1365年），元末权臣。至正年间与扩廓帖木儿争兵权，率军入大都控制朝廷，挟制顺帝，专擅朝政。其跋扈激化元廷内部分裂，至正二十五年被顺帝密令刺杀于宫中。内讧加速了元朝统治的瓦解。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0473
    name: 脱脱帖木儿
    default_gender: male
    archetype: military
    flavor: ?至1362年在世，元朝宗室，元末镇守辽东。当红巾军横扫中原之际保境自守，使辽东暂免大规模战火。其死后纳哈出继守其地，直至洪武二十年方归降明朝。生平详情史籍记载零散。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0475
    name: 韩山童
    default_gender: male
    archetype: military
    flavor: 元末白莲教首领，与刘福通等于至正十一年（1351年）在颍州发动起义，以"明王出世"为号召，揭开元末红巾军大起义序幕。不久被元军捕杀，其子韩林儿被刘福通拥立为小明王，继续抗元事业直至覆亡。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0476
    name: 郭子兴
    default_gender: male
    archetype: military
    flavor: （1302年-1355年）红巾军领袖，朱元璋的岳父。他收留朱元璋，是朱元璋事业的起点。研究郭子兴时，战术层面的得失与政治层面的约束应被并列考察，二者缺一不可。这种多维度分析路径，能有效避免将复杂战局简化为单一英雄叙事。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0477
    name: 徐寿辉
    default_gender: male
    archetype: military
    flavor: 徐寿辉（1320年—1360年），元末红巾军领袖，天完政权建立者。至正十一年起兵蕲州，以弥勒教聚众，攻克湖广、江西北部诸州县，建都蕲水，称帝。后势力渐衰，为部将陈友谅架空，至正二十年被陈友谅遣人刺杀于采石。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0478
    name: 明玉珍
    default_gender: male
    archetype: military
    flavor: 红巾军徐寿辉部将，后率军入蜀，1362年称帝，国号大夏，建元天统。据四川全境，轻徭薄赋、休养生息，与朱元璋对峙数年。1366年病卒，子明昇嗣位，洪武四年降明。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0479
    name: 方国珍
    default_gender: male
    archetype: military
    flavor: 方国珍（1319—1374），台州黄岩人，盐贩出身。至正八年聚众海上起兵反元，据有浙东庆元、台州、温州三路，以水军之利称雄。曾屡受元廷招安反复无常，亦与朱元璋遣使通好。至正二十七年兵败归降，授广西行省左丞，安置南京，病卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0481
    name: 也速
    default_gender: male
    archetype: military
    flavor: 也速，蒙古宗室后裔，约活动于13世纪中后期。史载曾受命统兵镇守北方边地，其名散见于元廷戍防与宗室名录。然《元史》未立专传，其仕宦履历、军功战绩及生卒确年皆已难详考。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0482
    name: 帖木儿不花
    default_gender: male
    archetype: military
    flavor: （?-约1290年）蒙古将领，征战四方。他参与了多次征服战役，是蒙古帝国扩张时期的重要将领。围绕帖木儿不花的记录常见立场分歧，也因此能够有效揭示官方叙述与后世阐释之间的距离。在帖木儿不花身上，政策设计、执行链条与地方反馈之间的落差表现得尤为清楚。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0483
    name: 塔察儿
    default_gender: male
    archetype: military
    flavor: （?-约1260年）蒙古宗室，东道诸王之一，成吉思汗弟后裔，分封东北，拥兵甚众。自太宗至世祖朝参预征伐与朝议，其宗室身份使其立场常随蒙古内部格局而动。史载晚年事跡甚少，约卒于中统年间。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0484
    name: 脱欢
    default_gender: male
    archetype: military
    flavor: 脱欢（1304—1362），权臣燕铁木儿之子。其父拥立元顺帝后旋卒，脱欢袭爵，初仍预朝政，然权势已大逊于乃父。顺帝亲政后渐见疏远，后出为外职。其生平散见于元末政争记载，始终受制于燕铁木儿家族盛极而衰的阴影之下。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0485
    name: 燕铁木儿
    default_gender: male
    archetype: military
    flavor: 元钦察人，宿卫出身。泰定帝崩后发动政变，拥立文宗图帖睦尔。两都之战中率军击败上都军，以功封太平王，总揽朝政，权倾一时。1333年病卒，家族势力随之瓦解。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0486
    name: 哈剌哈孙
    default_gender: male
    archetype: civil
    flavor: （1257年-1308年）元朝名臣，历仕世祖、成宗、武宗三朝，官至中书右丞相。成宗去世后力主迎立武宗，对政权平稳过渡起关键作用。施政以稳健务实著称，注重协调蒙汉官僚关系以维持朝局稳定。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0487
    name: 马祖常
    default_gender: male
    archetype: civil
    flavor: （1279年-1338年）元朝文学家，回族。他的诗歌雄浑大气，是元代少数民族诗人的代表。若只看单一维度容易低估马祖常，其意义更体现在文本、立场与时代的交叉点上。马祖常留下的表达范式被后世反复激活，使其在文学传统中始终保持可见度。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0488
    name: 欧阳玄
    default_gender: male
    archetype: civil
    flavor: 欧阳玄（1283—1358），字原功，庐陵人。元朝翰林学士，以文章受知于朝。至正年间受命参与纂修宋、辽、金三史，任总裁官，负责发凡起例及统稿审定。一时朝廷制诰碑铭多出其手。晚年致仕，卒于大都，赠楚国公，谥曰文。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0489
    name: 危素
    default_gender: male
    archetype: civil
    flavor: （1303年-1372年）元末明初文学家。他入仕元朝，后归降明朝，参与《元史》的编修工作。他横跨元明之际的政治与文坛，其史学参与和文章风格都体现出过渡时代知识人的现实调适能力。明初修史与文坛重建过程中，危素都扮演了过渡性角色。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
