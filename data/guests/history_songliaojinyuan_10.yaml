    default_gender: male
    archetype: military
    flavor: 扩廓帖木儿，即王保保，元末将领，察罕帖木儿外甥兼养子。1362年接掌察罕军队，攻破益都；后与孛罗帖木儿及明军交战，元亡后成为北元支柱，1375年卒于漠北。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
