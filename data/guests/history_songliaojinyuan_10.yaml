heroes:
  blue:
  - key: hist_songliaojinyuan_0462
    name: 张养浩
    avatar: pig/文032.png
    default_gender: male
    archetype: civil
    flavor: （1270年—1329年）元代官员、散曲家，字希孟，号云庄，济南人。他历任监察御史、礼部尚书等职，因直言敢谏屡遭挫折，中年辞官归隐。1329年关中大旱，他应召出任陕西行台中丞，赴任赈济灾民，积劳成疾，数月后病逝。《山坡羊·潼关怀古》相传作于此次赴陕途中。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0464
    name: 阿术
    avatar: monkey_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （1227年—1281年）元代将领，兀良合台之子，蒙古兀良哈部人。他早年随父征讨云南、安南，后参加鄂州之战。至元年间，他参与围攻襄阳、樊城，并统率水军。元军东下后，他随伯颜攻入南宋腹地，参与临安受降，官至中书左丞相，1281年病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0465
    name: 兀良合台
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: （1200年—1272年）蒙古将领，速不台之子。他随蒙哥之弟忽必烈远征大理，1253年攻克大理城，随后又率军进入安南，迫其称臣。此后他长期镇守云南，安抚诸部、设置驿站，并配合攻宋。晚年入朝，1272年病逝。其子阿术亦为元军名将。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0474
    name: 刘福通
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: （？—1363年）元末红巾军首领，颍州人。1351年，他与韩山童在颍州起事，事败后韩山童遇害，他继续统众，攻克朱皋、亳州等地。1355年拥立韩林儿为帝，国号宋，并分兵北伐，一度攻入河南、山东。后据守安丰，1363年城池被攻破时遇害。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0480
    name: 张士诚
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: （1321年—1367年）元末起义军首领，泰州人，盐贩出身。1353年，他与兄弟起兵盐场，攻占高邮，次年在当地称诚王，国号大周，后以平江（今苏州）为中心扩张势力，并一度接受元廷招安。他与朱元璋争夺江南，1367年平江城破被俘，押往应天后自尽。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0490
    name: 王冕
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （1287年—1359年）元代画家、诗人，字元章，号煮石山农，浙江诸暨人。他出身农家，相传少时放牛仍勤于读书学画。成年后屡试不第，遂隐居会稽九里山，以画梅、刻印和诗文自给。其墨梅挺拔清逸，兼工篆刻，对后世文人画与印学均有影响。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0495
    name: 赛典赤
    avatar: pig/文031.png
    default_gender: male
    archetype: civil
    flavor: （1211年—1279年）元代官员，回回人，一名乌马儿。他早年随蒙古军任职，后任陕西、四川行省平章。1274年出任云南行省平章，在任内设置路府州县，兴修滇池水利、开垦田地，并建学校、推行儒学，卒于昆明。云南行省制度由此逐步确立。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0459
    name: 鲜于枢
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: 鲜于枢（1246—1302），字伯机，号困学民（一作困学山民），渔阳人，元代书法家、官员。曾任太常寺典簿等职，晚年寓居杭州，筑困学斋。其行草取法晋唐，笔力劲健，与赵孟頫齐名，同为元初书坛代表；传世墨迹有《石鼓歌》《醉时歌》《老子道德经卷》等。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0460
    name: 邓文原
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: 邓文原（1258—1328），字善之，一字匪石，绵州人，元代官员、文学家、书法家。历任杭州路儒学正、江浙行省儒学提举、翰林待制等职，长期在江南兴学。其书法与赵孟頫、鲜于枢并称元初书坛三大家，著有《巴西文集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0461
    name: 康里巎巎
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: 康里巎巎（1295—1345），字子山，号正斋、恕叟，康里部人，元代书法家。历任礼部尚书、奎章阁学士院大学士、翰林学士承旨，曾知经筵事。楷书师法虞世南，行草取法钟繇、王羲之，书风遒媚雄健；相传其下笔迅疾，日可书三万字。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0463
    name: 答失蛮
    avatar: pig/武076.png
    default_gender: male
    archetype: military
    flavor: 答失蛮（1258—1317），哈剌鲁氏，元朝大臣。出身将门，早年入充宿卫，至元间随军征讨乃颜及西北诸叛王，屡有军功。历官司农卿、宣徽院使，分掌农桑水利与内廷供帐；后官至参知政事，历世祖、成宗、武宗、仁宗四朝，卒谥忠亮。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0466
    name: 唆都
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: 唆都（？—1285），扎剌儿氏，元朝将领。早年参与平定李璮之乱，后从攻襄阳，并在伯颜南征中领兵渡江，追击南宋流亡宗室于闽广沿海。至元十九年率舟师远征占城（今越南中南部），又随镇南王脱欢征安南，撤军时战死，谥襄愍。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0467
    name: 也先帖木儿
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: 也先帖木儿（？—1332），元朝宗王，忽必烈第五子、云南王忽哥赤之子。父死后袭封云南王，镇守云南多年；元军征缅甸期间，奉命抚定大理等处。后进封营王，历事数朝，卒于至顺三年。当时另有同名官员，非此宗王。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0468
    name: 土土哈
    avatar: monkey_wu_male8.png
    default_gender: male
    archetype: military
    flavor: 土土哈（1237—1297），钦察人，元代名将。其父班都察率钦察部归附蒙古，他承袭部众，入充宿卫，随忽必烈征讨阿里不哥、昔里吉、乃颜及海都等，屡立战功。官至钦察亲军都指挥使，长期主持漠北边防，其孙燕铁木儿后为元末权臣。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0469
    name: 察罕帖木儿
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: 察罕帖木儿（？—1362），字廷瑞，乃蛮人，元末将领。至正年间组织地方义兵镇压红巾军，转战关陕、河南，收复汴梁等地，累官河南行省平章政事，成为元廷倚重的方镇。后围益都，为降将田丰、王士诚所刺杀；其甥兼养子扩廓帖木儿接掌其军。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0470
    name: 扩廓帖木儿
    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: 扩廓帖木儿（？—1375），本姓王，小字保保，察罕帖木儿外甥兼养子，元末将领。1362年接掌察罕所部，攻破益都，后与孛罗帖木儿及明军争战。元亡后辅佐北元，1372年在岭北之战大败明军，被朱元璋称为“奇男子”，1375年卒于漠北。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0471
    name: 李思齐
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: 李思齐（1323—1374），字世贤，罗山人，元末明初将领。至正年间与察罕帖木儿组织义兵镇压红巾军，后据守陕西，官至陕西行省平章政事，与扩廓帖木儿长期争战。洪武二年降明，受命招降王保保不成，返程中受伤，不久去世。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0472
    name: 孛罗帖木儿
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
    flavor: 孛罗帖木儿（？—1365），散只兀氏，元末将领。父答失八都鲁镇压红巾军兵败后忧愤而卒，他统其部众，镇守大同，后与察罕帖木儿、扩廓帖木儿争夺晋冀。至正二十四年率军攻入大都，入为中书右丞相，挟制朝政，次年被元顺帝设计刺杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0473
    name: 脱脱帖木儿
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: 脱脱帖木儿（1314—1355），字大用，蔑儿乞氏，元末政治家。至元六年（1340）协助元顺帝罢黜权臣伯颜，后任中书右丞相，推行“脱脱更化”，恢复科举、主持修纂宋辽金三史，并负责治理黄河。至正十四年征高邮时遭谗去职，流放云南，次年被矫诏赐死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0475
    name: 韩山童
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: 韩山童（？—1351），元末红巾军首领，白莲教领袖。至正十一年与刘福通等在颍州聚众起事，以“明王出世”“弥勒下生”相号召，并自称宋室后裔，事泄被捕杀。其妻携子韩林儿逃匿，韩林儿后为红巾军拥立为小明王。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0476
    name: 郭子兴
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: 郭子兴（1302—1355），定远人，元末红巾军首领。至正十二年聚众起兵，占据濠州，朱元璋前来投奔，被任为十夫长，并以养女马氏妻之。后与孙德崖等诸将不和，部众渐归朱元璋。1355年病逝，其部由朱元璋接掌。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0477
    name: 徐寿辉
    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: 徐寿辉（1320—1360），罗田人，元末红巾军领袖，天完政权建立者。布贩出身，至正十一年与彭莹玉等在蕲州起兵，不久称帝，国号天完，势力一度扩及湖广、江西。后为部将陈友谅挟制，至正二十年于采石被陈友谅杀害。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0478
    name: 明玉珍
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: 明玉珍（1331—1366），随州人，元末红巾军将领、大夏政权建立者。早年随徐寿辉起兵，至正十七年率军入蜀，据有重庆及四川大部。至正末年称帝，国号大夏，在位时减轻赋役、保境安民；死后其子明昇继位，洪武四年降明。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0479
    name: 方国珍
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: 方国珍（1319—1374），台州黄岩人，盐贩出身。至正八年与其兄弟起兵海上，据有庆元、台州、温州等浙东之地，拥船队往来海运。他多次接受元廷招安，周旋于元室与朱元璋之间，吴元年归降朱元璋，后卒于南京。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0481
    name: 也速
    avatar: monkey/其他随机角色/武044_男_.png
    default_gender: male
    archetype: military
    flavor: 也速，蒙古人，月阔察儿之子，元末将领。至正年间随脱脱镇压芝麻李起事，参与淮西、淮东及海州等地战事，后累官辽阳行省左丞相。至正末年明军北伐、元廷北迁前后，他率部转战北方。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0482
    name: 帖木儿不花
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: 帖木儿不花，答答里带人，元初蒙古将领。至元七年（1270）随军围攻襄阳，于襄阳外围击败来援的宋将范文虎；后随伯颜渡江南下，参与攻取建康、临安等役。累官中书左丞、四川行省平章政事，是元初平定南宋的参与者之一。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0483
    name: 塔察儿
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: 塔察儿，铁木哥斡赤斤之孙，蒙古东道宗王、将领。承袭斡赤斤兀鲁思，统领辽东诸部，为东道藩屏。蒙哥汗时受命统军攻宋，进围樊城；忽必烈与阿里不哥争位时，他率东道诸王拥立忽必烈，并随军征讨阿里不哥，事后仍领其部众。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0484
    name: 脱欢
    avatar: pig/武076.png
    default_gender: male
    archetype: military
    flavor: 脱欢（1292—1328），斡剌纳儿氏，元朝官员，大臣哈剌哈孙之子。因父拥立元武宗有功，入充宿卫；仁宗朝任御史中丞、御史大夫，后历任江南行台及江浙行省要职，曾主持疏浚吴淞江（今苏州河），兴修太湖下游水利。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0485
    name: 燕铁木儿
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: 燕铁木儿（1285—1333），钦察人，土土哈之孙、床兀儿之子。泰定帝死后，他在大都发动政变，拥立元文宗，并于两都之战中击败上都一方。官至中书右丞相、知枢密院事，封太平王，独揽朝政，直至1333年病逝。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0486
    name: 哈剌哈孙
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: 哈剌哈孙（1257—1309），斡剌纳儿氏，元朝大臣。历任湖广、江浙行省平章政事及中书右丞相，以干练著称。元成宗死后，他封锁宫门、稳定大都，迎立海山（元武宗）与爱育黎拔力八达，因定难之功封太傅，谥忠献。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
