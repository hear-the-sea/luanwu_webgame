    default_gender: male
    archetype: military
    flavor: 土土哈（1237—1297），钦察人，元代名将。随忽必烈征讨阿里不哥、昔里吉、乃颜及海都等，屡立战功；任钦察亲军都指挥使，长期参与漠北边防。
    growth_range:
