    default_gender: male
    archetype: military
    flavor: 脱欢（1292—1328），斡剌纳儿氏，元朝官员，哈剌哈孙之子。因父拥立武宗入宿卫，仁宗时任御史中丞、御史大夫，后历任江南行台及江浙行省要职，主持疏浚吴淞江。
    growth_range:
