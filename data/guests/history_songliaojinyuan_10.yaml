    default_gender: male
    archetype: military
    flavor: 唆都（？—1285），扎剌儿氏，元朝将领。参与平定李璮、攻取襄阳和南宋江南诸地；至元十九年率军攻占城，后随脱欢征安南，撤军途中战死，谥襄愍。
