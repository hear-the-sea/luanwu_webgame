    name: 邓文原
    default_gender: male
    archetype: civil
    flavor: 邓文原（1258—1328），字善之，绵州人，元代官员、文学家、书法家。历任江浙行省儒学提举、翰林待制等，书法与赵孟頫、鲜于枢并称元初三大家，著《巴西文集》。
    growth_range:
