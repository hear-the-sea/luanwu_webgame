    default_gender: male
    archetype: civil
    flavor: 盛懋，字子昭，嘉兴人，元代画家。擅山水、人物、花鸟，承南宋院体画法并吸收元代文人画笔墨，设色精工；与吴镇同里，画风一繁一简，各具面目。
    growth_range:
