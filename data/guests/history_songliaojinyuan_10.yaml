    default_gender: male
    archetype: civil
    flavor: 曹知白（1272—1355），字又玄，号云西，华亭人，元代画家、藏书家。山水师法李成、郭熙，画风清润疏秀；与黄公望、倪瓒等交游，传世有《寒林图》等。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
