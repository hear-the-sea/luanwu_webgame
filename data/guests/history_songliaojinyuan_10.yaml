    name: 郭子兴
    default_gender: male
    archetype: military
    flavor: 郭子兴（1302—1355），元末红巾军首领。至正十二年起兵据濠州，收纳并重用朱元璋；死后其部由朱元璋等接掌，对明朝建立有重要影响。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
