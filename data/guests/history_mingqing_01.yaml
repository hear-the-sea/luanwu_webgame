heroes:
  orange:
  - key: hist_mingqing_0001
    name: 朱元璋
    avatar: monkey/orange/朱元璋.png
    default_gender: male
    archetype: military
    flavor: （1328年—1398年）明太祖，明朝开国皇帝。少时贫困，曾为僧，元末投身起义军，以应天为根据地，先后击败陈友谅、张士诚等对手。1368年称帝建明，继而遣军北伐，结束元朝在中原的统治。即位后奖励垦荒，兴修水利，整顿户籍赋役，恢复战乱后的生产；又建立卫所，修订律令，废除中书省与丞相，使六部直接对皇帝负责。他勤政务实，对贪腐深恶痛绝，整肃功臣时却也极为严酷，胡惟庸、蓝玉等大案株连甚广。从寒微走向帝位，他始终不忘饥馑流离之苦，也将强烈的警惕与控制带入新朝。
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0002
    name: 朱棣
    avatar: monkey/orange/朱棣.png
    default_gender: male
    archetype: military
    flavor: （1360年—1424年）明成祖，年号永乐。原封燕王，驻守北平，后发动靖难之役夺取皇位。即位后整顿军政，营建北京宫殿，疏通漕运，于1421年迁都北京，将帝国中枢移向北疆。他五次亲征漠北，任内命郑和六次下西洋，扩大远洋交通与朝贡往来；又组织编纂《永乐大典》，汇聚典籍，保存文献。夺位后的清洗，与远征、营建所耗民力，同样伴随着永乐盛业。1424年，他死于北征归途。朱棣行事强硬，敢作大举，即便年老多病仍亲履行阵，一生雄心仿佛始终不肯停歇。
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0003
    name: 努尔哈赤
    avatar: monkey/明清/努尔哈赤.png
    default_gender: male
    archetype: military
    flavor: （1559年—1626年）清朝奠基者，满洲枭雄。以十三副遗甲起兵，创八旗制，萨尔浒一战奠定后金霸权。他采取“凭尔几路来，我只一路去”的策略大败明军主力。虽然他在宁远之战中受红夷大炮重创后去世，但他建立的军事与行政体制，为大清定鼎中原打下了最坚实的基础。努尔哈赤的一生是满洲民族崛起的缩影，他不仅是一位杰出的军事家，更是满洲文明的塑造者，其推动的满文创制与八旗社会结构，深刻影响了此后三百年的中国历史。其建立的八旗制度，更是清朝统治力量的核心保障。
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0004
    name: 玄烨
    avatar: monkey/明清/玄烨.png
    default_gender: male
    archetype: civil
    flavor: （1654年—1722年）康熙皇帝，名玄烨，八岁登基，十六岁（虚岁）智擒鳌拜，开始亲政。此后他平定三藩之乱、收复台湾、亲征噶尔丹，并通过雅克萨之战与《尼布楚条约》划定中俄东段边界。他主持编纂《康熙字典》等书，对数学、天文、地理亦有兴趣。他在位六十一年，为清朝前期的稳定奠定了基础。
    growth_range:
    - 8
    - 14
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  purple:
  - key: hist_mingqing_0005
    name: 朱瞻基
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （1399年—1435年）明宣宗，仁宗朱高炽之子。即位后减轻赋役、整顿吏治，宣德元年亲自平定汉王朱高煦叛乱。他重用“三杨”等大臣，延续仁宗以来的宽和政策，史称“仁宣之治”。朱瞻基雅好书画，传世有《三鼠图》等作品。宣德十年病逝，年仅三十六岁。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0006
    name: 朱佑樘
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （1470年—1505年）明孝宗，宪宗之子。幼年因万贵妃一党排斥，久藏宫中，成化二十三年即位。他勤于政务，重用刘健、李东阳、谢迁等大臣，减少宫中冗费，罢黜佞幸，朝政较为清明，史称“弘治中兴”。弘治十八年病逝，年三十六岁。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0007
    name: 朱厚熜
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （1507年—1567年）明世宗，兴献王朱祐杬之子。武宗无子，他以藩王入继大统。即位后因“大礼议”与群臣争论生父名分，最终追尊父亲为皇帝，皇权由此进一步加强。他前期整顿吏治、抑制宦官，后期长期居西苑修道，重用严嵩，朝政渐趋败坏。嘉靖四十五年病逝。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0008
    name: 朱翊钧
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （1563年—1620年）明神宗，穆宗之子，十岁即位，由张居正辅政。亲政后先后处理宁夏、朝鲜和播州战事，即“万历三大征”。他因立储问题与群臣争执，长期不上朝，朝政运转受到影响。晚年又面对辽东战事和财政困难，泰昌元年病逝。其在位四十八年，为明朝在位最久的皇帝。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0009
    name: 朱由检
    avatar: monkey/明清/朱由检.png
    default_gender: male
    archetype: civil
    flavor: （1611年—1644年）崇祯皇帝，明朝的亡国之君。他十六岁即位，以雷霆万钧之势铲除阉党魏忠贤，试图重振纲纪。他一生勤政节俭，宵衣旰食，在位十七年从未懈怠，却面对着前朝积攒下来的千疮百孔：辽东战事糜烂、中原流寇横行、连年大旱饥荒。他性格多疑，频繁更换首辅，且错杀良将袁崇焕，导致边防形势进一步恶化。崇祯十七年，李自成大军压境，他在煤山自缢，留下了“朕凉德藐躬，上干天咎”的绝笔。他在崩坏局势中试图自救，有着守社稷、殉江山的决心，却终无回天之术，其勤勉与悲剧终局成为了中国历史上最令人感叹的篇章之一。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 18
      intellect: 50
      defense: 22
      agility: 10
  - key: hist_mingqing_0010
    name: 姚广孝
    avatar: monkey/明清/姚广孝.png
    default_gender: male
    archetype: civil
    flavor: （1335年—1421年）法名道衍，被誉为“黑衣宰相”。他本为出家人，却精通兵法韬略与阴阳术数，是朱棣最为倚重的核心幕僚。在靖难之役中，他坐镇北京调控全局，多次在关键转折点为朱棣出谋划策，是朱棣夺取天下的第一功臣。夺位后，他不居功、不还俗，白昼入朝辅政，晚间回归僧寮，表现出超然物外的政治智慧。他主持迁都北京，并担任《永乐大典》和《明太祖实录》的最高负责人。姚广孝的一生充满了神秘色彩，是能将出世之学与入世之功完美结合的奇人，死后配享太庙，荣宠至极，其智慧与节操深受后世政治家与文人的敬仰。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0011
    name: 王守仁
    avatar: monkey/明清/王守仁.png
    default_gender: male
    archetype: civil
    flavor: （1472年—1529年）阳明先生，中国历史上罕见的“真三不朽”圣人。他在贵州龙场悟道，创立了影响深远的“心学”体系，提出“致良知”与“知行合一”，打破了程朱理学的长期禁锢。王阳明不仅是伟大的哲学家，更是用兵如神的统帅。他平定宁王叛乱，仅用三十五天便生擒逆魁；剿灭南赣匪患时，其奇谋妙计令敌胆寒。他的一生践行了“此心光明”的最高境界。其学说远播日韩，成为明治维新等重大历史变革的思想源泉。他那种将内心修行与社会实践高度统一的人格力量，至今依然是无数人追求的精神标杆。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 20
      intellect: 52
      defense: 20
      agility: 8
  - key: hist_mingqing_0012
    name: 刘基
    avatar: monkey/明清/刘基.png
    default_gender: male
    archetype: civil
    flavor: （1311年—1375年）字伯温，明朝开国第一功臣，被民间誉为“诸葛亮转世”。他博通经史，尤精天文兵法，在朱元璋起兵初期为其制定了“先陈后张”的战略方针，助其在鄱阳湖之战中火攻摧毁陈友谅的百万水军。他运筹帷幄之中，决胜千里之外，为明朝江山的建立立下汗马功劳。民间流传的《烧饼歌》将其形象神化为未卜先知的先知。正如俗语所言“三分天下诸葛亮，一统江山刘伯温”，这位浙东才子以超凡智慧成就了草莽英雄的帝业。他在政治上倡导严明法度，虽晚年深陷政治旋涡，但其智慧与功勋永远闪耀。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0013
    name: 张居正
    avatar: monkey/明清/张居正.png
    default_gender: male
    archetype: civil
    flavor: （1525年—1582年）万历朝首辅，明代重要政治家、改革家。他推行“一条鞭法”与“考成法”，整顿吏治，清丈全国田亩，使财政状况一度好转，国库积银达四百余万两。他在任十年间，边境相对安宁，赋役趋于均平，史称“万历中兴”。张居正独揽大权、刚愎任事，身后遭到清算，但其改革成果使明朝得以延续数十年，后世称其为“救时宰相”。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0014
    name: 胤禛
    avatar: monkey/明清/胤禛.png
    default_gender: male
    archetype: civil
    flavor: （1678年—1735年）雍正皇帝，以勤政与铁腕改革著称。他在位期间针对康熙晚年积弊，推行摊丁入亩、火耗归公、改土归流等改革，减轻贫民负担并充实国库。他设立军机处，强化皇权，推行密折制度。雍正帝每日处理政务十余小时，留下的朱批奏折字数逾千万，其勤勉在清代君主中颇为突出。他在位仅十三年，扭转了官场腐败的颓势，为乾隆时期的繁荣奠定了基础。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0015
    name: 弘历
    avatar: monkey/明清/弘历.png
    default_gender: male
    archetype: civil
    flavor: （1711年—1799年）乾隆皇帝，清朝的盛世之君。他在位六十年，实际执掌帝国权力长达六十三年，将康乾盛世推向了最高峰。他自号“十全老人”，平定准噶尔、收复大小和卓，确立了清朝对西域的统治。文化上，他主持纂修了《四库全书》，汇集了中华古典文明的精髓。乾隆时期的中国，疆域辽阔，人口激增，国力与经济规模居世界前列。然而，他晚年宠信大贪官和珅，官场风气渐趋奢靡，闭关锁国政策也使中国逐渐落后于工业革命浪潮。乾隆一朝既是古典文明最灿烂的余晖，也埋下了晚清衰败的伏笔。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0017
    name: 皇太极
    avatar: monkey/明清/皇太极.png
    default_gender: male
    archetype: military
    flavor: （1592年—1643年）清太宗，清朝杰出的军事统帅与真正的开国总设计师。他改国号为“大清”，并通过一系列制度改革，大量任用汉臣与蒙臣，将原本松散的部落联盟改造为高度集权的帝国。皇太极不仅继承了父亲努尔哈赤的勇武，更展现出卓越的政治家胸怀与远见。他六次亲征漠南蒙古，征服朝鲜，并多次统兵绕过关宁锦防线突袭明朝关内，沉重打击了大明国力。他在沈阳病逝，虽未亲见清军定鼎北京，但其建立的政治体制与民族政策是清朝能够稳固统治中原近三百年的核心根基。他善于权谋，通过反间计除掉袁崇焕，展现了极深的政治城府。他那种深知中原文化重要性并果断吸纳整合的能力，使其成为满洲历史上最伟大的领袖之一。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0018
    name: 多尔衮
    avatar: monkey/明清/多尔衮.png
    default_gender: male
    archetype: military
    flavor: （1612年—1650年）清初著名的政治家、军事家，清军入关并定鼎中原的灵魂人物。在明清易代的历史关头，他果断联合吴三桂于山海关大败大顺军，随后亲率清军占领北京并统一北方。作为摄政王，多尔衮权势滔天，实际掌握着大清帝国的最高权力。他主持了“剃发易服”等严酷政策，虽然激起了汉人的广泛反抗，但在军事上他迅速横扫江南各省，确立了清朝在全国的统治地位。多尔衮的一生是力量与意志的极端体现，他以果断且往往冷酷的决策决定了十七世纪中国的版图走向。尽管他在死后一度遭到顺治帝的政治清算，但无可否认其作为大清江山第一功臣的显赫历史地位。他那种顶级军事才干与现实主义政治手腕的结合，使其成为了那个时代的风云人物。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  blue:
  - key: hist_mingqing_0016
    name: 福临
    avatar: monkey/明清/福临.png
    default_gender: male
    archetype: civil
    flavor: （1638年—1661年）顺治皇帝，名福临，清军入关后的首位皇帝。他在多尔衮死后亲政，缓和民族矛盾，重用汉臣，崇尚汉文化。顺治帝情感细腻，董鄂妃的离世使他深受打击，一度沉心佛学。他在位十八年，为清朝在中原的统治奠定初步框架。官方记载其死因为天花，民间则有五台山出家的传说，为其增添了几分神秘色彩。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
