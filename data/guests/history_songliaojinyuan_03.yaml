      agility: 16
  - key: hist_songliaojinyuan_0139
    name: 杜衍
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: 杜衍（978—1057），字世昌，越州山阴人。大中祥符进士，庆历四年拜相，支持范仲淹等推行新政，与范仲淹、富弼同被指为朋党，在位仅百余日即罢；为官清俭，尤以拒绝内降恩泽著称，工书法，封祁国公，谥正献。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0140
    name: 庞籍
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: 庞籍（988—1063），字醇之，单州成武人。大中祥符进士，仁宗朝历任殿中侍御史、知延州，长期主持陕西防务，整顿堡寨、招募边民屯耕，并力荐狄青。庆历间任枢密副使，后拜枢密使、同中书门下平章事，封颍国公；司马光少时受其知遇，卒谥庄敏。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0141
    name: 薛居正
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: 薛居正（912—981），字子平，开封浚仪人。后唐进士，历仕后晋、后汉、后周，入宋后累官参知政事，开宝六年拜门下侍郎、同平章事。开宝间奉诏监修《旧五代史》，为二十四史之一；原书后散佚，清四库馆臣从《永乐大典》辑出，列为正史。卒赠太尉、中书令，谥文惠。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0142
    name: 李昉
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: 李昉（925—996），字明远，深州饶阳人。后汉进士，历仕后汉、后周，入宋官至平章事、监修国史；太平兴国间主持编纂《太平御览》《太平广记》《文苑英华》三大类书，其中《太平御览》初名《太平总类》，卒谥文正。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0143
    name: 徐铉
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: 徐铉（916—991），字鼎臣，扬州广陵人。早年仕南唐，官至吏部尚书，与韩熙载并称“韩徐”，随李煜归宋；精篆书，奉诏与句中正等校订《说文解字》，所成“大徐本”流传后世，与弟徐锴并称“二徐”，著有《骑省集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0144
    name: 李沆
    avatar: pig/文032.png
    default_gender: male
    archetype: civil
    flavor: 李沆（947—1004），字太初，洺州肥乡人。太平兴国进士，咸平初拜相。真宗问治道，以不用浮薄新进为对；任相主张持重守成，不轻改法制，常以水旱、盗贼等事奏闻，使皇帝知民间疾苦，时称“圣相”，卒谥文靖。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0145
    name: 向敏中
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: 向敏中（949—1020），字常之，开封人。太平兴国进士，历知广州、枢密副使、参知政事，咸平四年拜同中书门下平章事，大中祥符五年复相。为政端谨，任地方官时重视审理积案，相传在西京曾察出僧人之冤、捕获真凶；卒赠太尉、中书令，谥文简。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0146
    name: 张咏
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: 张咏（946—1015），字复之，号乖崖，濮州鄄城人。太平兴国进士，淳化、咸平间两知益州，值蜀中兵乱之后，抚定军民、整顿吏治，蜀人赖以安。官至礼部尚书，与寇准友善，寇准问政，张咏劝其读《霍光传》。为政刚果，著有《乖崖集》，卒谥忠定。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
