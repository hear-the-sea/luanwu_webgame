heroes:
  blue:
  - key: hist_songliaojinyuan_0109
    name: 文彦博
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （1006年-1097年）北宋名相，历仕四朝五十年。他出将入相，功勋卓著，是北宋政坛的常青树。他主持平定贝州王则起义，又多次出任宰相，政绩斐然。其稳健持重，使北宋初政局屡转危为安。其政绩在史书中被反复称述。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0110
    name: 吕蒙正
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: （944年—1011年）北宋宰相，字圣功，河南洛阳人。吕蒙正少时家贫，苦读入仕，太平兴国二年考中进士第一，先后三次拜相，以宽厚持重、敢于直言著称；他曾主持编修《太宗实录》，大中祥符四年病逝，卒谥文穆。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0111
    name: 赵恒
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （968年—1022年）宋真宗，宋太宗第三子，初名德昌，后改名恒。至道三年即位，初期勤于政事，史称“咸平之治”；景德元年，赵恒在寇准力劝下亲征澶州，与辽订立澶渊之盟，此后宋辽维持长期和平；他晚年封禅泰山、尊奉天书，乾兴元年病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0112
    name: 章惇
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: 章惇（1035—1106），字子厚，建州浦城人。熙宁间为新党骨干，元丰五年知枢密院事，参与对西夏用兵；哲宗亲政后拜尚书左仆射兼门下侍郎，主持“绍述”，恢复熙宁新法；徽宗即位后因反对其继位遭贬，卒于湖州，《宋史》列入奸臣传。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0113
    name: 曾公亮
    avatar: pig/文050.png
    default_gender: male
    archetype: civil
    flavor: 曾公亮（999—1078），字明仲，泉州晋江人。天圣进士，历官翰林学士、枢密使，嘉祐末拜相，历仕仁宗、英宗、神宗三朝，曾荐王安石；与丁度奉诏编《武经总要》，书中记载宋代军制、兵器及火药配方，卒赠太师，谥宣靖。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0114
    name: 丁谓
    avatar: duck_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: 丁谓（966—1037），字谓之，后改字公言，苏州长洲人。淳化进士，真宗朝官至宰相，封晋国公，主持营建玉清昭应宫，以凿渠取土、引水运材、填渠成景统筹工役；后与寇准争权，仁宗初贬崖州，后徙道州，卒。《宋史》列入奸臣传。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0115
    name: 范纯仁
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: 范纯仁（1027—1101），字尧夫，苏州吴县人，范仲淹次子。皇祐进士，历知庆州、河中府，元祐三年官至宰相，主张宽简持重、渐改新法，与司马光尽废新法之议不合；绍圣后累贬永州，卒谥忠宣，著有《范忠宣公集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0116
    name: 张耒
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: 张耒（1054—1114），字文潜，号柯山，楚州淮阴人。熙宁进士，官至起居舍人，为“苏门四学士”之一；诗学白居易、张籍，语言平易，多写民生日常，苏轼称其文汪洋冲澹，著有《柯山集》，晚年因党籍屡遭贬谪。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0117
    name: 陈师道
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: 陈师道（1053—1102），字履常，号后山居士，彭城人。受曾巩、苏轼赏识，历任徐州教授、秘书省正字；诗宗杜甫，注重锤炼法度，黄庭坚称其“闭门觅句”，与黄庭坚并称“黄陈”，为江西诗派代表，著有《后山集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0118
    name: 王禹偁
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: 王禹偁（954—1001），字元之，济州巨野人。太平兴国进士，历右拾遗、知制诰、翰林学士，以直言敢谏三次遭贬，世称王黄州；诗学白居易，文倡韩柳古文，《待漏院记》《黄州新建小竹楼记》为名篇，著有《小畜集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0119
    name: 宋祁
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: 宋祁（998—1061），字子京，开封雍丘人，与兄宋庠并称“二宋”。天圣进士，历官翰林学士、史馆修撰，与欧阳修等合修《新唐书》，独撰列传；词作《玉楼春》有“红杏枝头春意闹”之句，世称“红杏尚书”，卒谥景文。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0120
    name: 林逋
    avatar: pig/文018.png
    default_gender: male
    archetype: civil
    flavor: 林逋（967—1028），字君复，杭州钱塘人。早岁游历江淮，后归隐西湖孤山，二十年足不及城市，种梅养鹤，终身不仕不娶，世称“梅妻鹤子”。真宗闻其名，赐粟帛并诏州县岁时问劳；卒后仁宗赐谥和靖先生，葬于孤山。工诗善行书，《山园小梅》中“疏影横斜水清浅，暗香浮动月黄昏”最为传诵，有《林和靖诗集》传世。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0121
    name: 钱惟演
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 钱惟演（977—1034），字希圣，杭州临安人，吴越王钱俶之子，随父归宋。博学能文，真宗朝历翰林学士、枢密副使，仁宗初任参知政事，预修《册府元龟》。诗宗李商隐，与杨亿、刘筠唱和，为西昆体代表，参与编纂《西昆酬唱集》。喜奖掖后进，欧阳修、梅尧臣等曾游其幕府；后因附会丁谓出镇外郡，卒谥文僖。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0122
    name: 王曾
    avatar: pig/文032.png
    default_gender: male
    archetype: civil
    flavor: 王曾（978—1038），字孝先，青州益都人。咸平五年乡试、会试、殿试皆第一，为北宋少见的连中三元者；仁宗初任参知政事，因忤丁谓罢政，后官至宰相，封沂国公，处事清谨持重，卒谥文正，著有《王文正公笔录》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0123
    name: 张方平
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: 张方平（1007—1091），字安道，号乐全居士，南京应天府人。景祐进士，历知益州、三司使、参知政事，以宽简治蜀；神宗朝论新法不便，曾荐举苏洵及苏轼、苏辙父子，后以太子少师致仕，卒谥文定，著有《乐全集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0124
    name: 吕公着
    avatar: pig/文048.png
    default_gender: male
    archetype: civil
    flavor: 吕公著（1018—1089），字晦叔，寿州人，吕夷简之子，父子皆位至宰相。熙宁初因论新法不便出知颍州，元祐初与司马光同秉朝政，主持废除熙丰新法、起用旧党；历官御史中丞、枢密使、宰相，卒赠申国公，谥正献。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0125
    name: 王珪
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: 王珪（1019—1085），字禹玉，成都华阳人。庆历进士，久掌内外制诰，历翰林学士、参知政事，神宗朝拜尚书左仆射兼门下侍郎，久居相位，朝廷大典册多出其手。其奏对多承上意，不轻有建白，时人讥为“三旨相公”。哲宗即位后封岐国公，卒谥文恭，著有《华阳集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0126
    name: 刘挚
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: 刘挚（约1030—1097），字莘老，永静东光人。嘉祐进士，熙宁间任监察御史里行，因论新法不便出监衡州盐仓；元祐初召还，累官尚书右丞，元祐六年拜尚书右仆射兼中书侍郎，为旧党朔党领袖，主张渐废新法、去其太甚。绍圣后连遭贬谪，卒于新州贬所，谥忠肃，著有《忠肃集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0127
    name: 吕大防
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: 吕大防（1027—1097），字微仲，京兆蓝田人。皇祐进士，历知州县，元祐初入朝为尚书左丞，元祐三年拜尚书左仆射兼门下侍郎。司马光去世后主持朝政，延续废除新法、恢复旧制，为政务求持重。绍圣后贬循州安置，卒于途中，与弟大忠、大钧、大临并称“蓝田四吕”。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0128
    name: 范祖禹
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: 范祖禹（1041—1098），字淳夫，成都华阳人。嘉祐进士，从司马光编修《资治通鉴》十五年，分掌唐代史事，另著《唐鉴》，因精通唐史被称为“唐鉴公”；元祐间任翰林学士兼侍讲，绍圣后因党争贬化州，卒于贬所。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0129
    name: 吕惠卿
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: 吕惠卿（1032—1111），字吉甫，泉州晋江人。嘉祐进士，受王安石重用，参与制定青苗、免役等新法，官至参知政事；元丰间知延州，参与对西夏用兵，后与王安石失和，新党内部攻讦，徽宗时遭贬，被《宋史》列入奸臣传。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0130
    name: 蔡确
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: 蔡确（1037—1093），字持正，泉州晋江人。嘉祐进士，元丰五年拜尚书右仆射兼中书侍郎，为新党重臣并参与对西夏用兵；元祐初罢相，出知安州，因《夏日登车盖亭诗》被指讥讽朝政，酿成“车盖亭诗案”，贬新州安置，卒于贬所。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0131
    name: 邢恕
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: 邢恕（约1035—1109），字和叔，郑州阳武人。嘉祐进士，早年从程颢学，博通经史，受吕公著荐举入朝。后依附蔡确、章惇，元祐间坐蔡确党贬监永州酒税；绍圣初复起，官至御史中丞，希章惇之意排斥元祐旧臣，被《宋史》列入奸臣传。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0132
    name: 蔡卞
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: 蔡卞（1048—1117），字元度，兴化军仙游人，蔡京之弟、王安石女婿。熙宁进士，绍圣间参与推行新法，历官中书舍人、尚书左丞、知枢密院事；工书法，与蔡京并称“二蔡”，著有《毛诗名物解》，《宋史》列入奸臣传。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0133
    name: 曾布
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: 曾布（约1036—1107），字子宣，建昌军南丰人，曾巩之弟。嘉祐进士，熙宁间参与王安石变法，后因政见不合外任；绍圣初知枢密院事，徽宗初拜相，旋与蔡京相争罢贬，卒于润州，今存《曾公遗录》，《宋史》列入奸臣传。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0134
    name: 吴充
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: 吴充（1021—1080），字冲卿，建州浦城人，与兄吴育并以文学政事知名。宝元进士，熙宁间任参知政事，王安石罢相后拜同中书门下平章事。其子吴安持娶王安石之女，吴充虽与王氏联姻，议论新法却多持中立，为政务求持重。元丰三年卒，赠司空，谥正宪。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0135
    name: 陈瓘
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 陈瓘（1057—1124），字莹中，号了斋，南剑州沙县人。元丰二年进士，历官太学博士、右正言，屡次弹劾章惇、蔡京，指摘其借绍述之名更张朝政，因此一再贬谪。崇宁间被编管通州，后徙楚州，卒于贬所，谥忠肃；著有《尊尧集》《了斋集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0136
    name: 邹浩
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: 邹浩（1060—1111），字志完，常州晋陵人。元丰五年进士，元符中任右正言，上疏反对册立刘妃为后，被除名编管新州。徽宗即位后召还，官至中书舍人；崇宁间名列元祐党籍，再贬岭南。著有《道乡集》，卒谥忠。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0137
    name: 陈尧佐
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: 陈尧佐（963—1044），字希元，阆州阆中人，陈尧叟之弟、陈尧咨之兄。进士出身，任两浙转运使时主持修治钱塘江堤，知滑州以木龙减水势；官至宰相，工隶书，卒谥文惠。兄弟三人皆进士，尧叟、尧咨分别为状元。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0138
    name: 陈尧咨
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: 陈尧咨（970—1034），字嘉谟，阆州阆中人。咸平三年状元，历任知荆南、知永兴军，官至武信军节度使，曾参与西北边防。以善射闻名，欧阳修《归田录》所载《卖油翁》即记其射技与自矜之态；其兄陈尧叟亦中状元，兄弟并显于时，卒谥康肃。
    growth_range:
