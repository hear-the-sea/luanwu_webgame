    name: 王钦若
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 王钦若（963—1025），字定国，临江军新喻人。淳化进士，真宗朝官至宰相，封冀国公，领衔编修《册府元龟》；澶渊之战主张迁都金陵，为寇准所阻，时人因其迎合天书、排挤正人，与丁谓等同被讥为“五鬼”，《宋史》列入奸臣传。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0148
    name: 陈彭年
    avatar: pig/文048.png
    default_gender: male
    archetype: civil
    flavor: 陈彭年（961—1017），字永年，建昌军南城人。雍熙进士，历官翰林学士、参知政事。大中祥符间奉诏与丘雍等增订《切韵》，编成《广韵》，为宋代官修韵书之要籍，并参与《册府元龟》《玉篇》校订。真宗朝附会天书封禅，与王钦若、丁谓等被时人目为“五鬼”，卒谥文僖。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
