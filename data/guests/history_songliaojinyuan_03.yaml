    name: 胡瑗
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: 胡瑗（993—1059），字翼之，泰州如皋人，世称安定先生。长期在苏州、湖州讲学，创经义、治事分斋的“苏湖教法”，后主持太学；主张“明体达用”，与孙复、石介并称宋初三先生，著有《周易口义》《洪范口义》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0150
    name: 孙复
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 孙复（992—1057），字明复，号富春，晋州平阳人，世称泰山先生。早年举进士不第，退居泰山讲学近二十年，石介等皆师事之；庆历间由范仲淹、富弼荐为国子监直讲，后迁殿中丞。著《春秋尊王发微》，以尊王攘夷为旨，与胡瑗、石介并称“宋初三先生”。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0151
    name: 石介
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: 石介（1005—1045），字守道，号徂徕先生，兖州奉符人。天圣进士，任国子监直讲，与胡瑗、孙复并称宋初三先生；庆历间作《庆历圣德诗》褒贬时政，新政失败后出判濮州，未行而卒，倡导古文、排斥佛老，著有《徂徕集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0152
    name: 刘敞
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: 刘敞（1019—1068），字原父，号公是，临江新喻人。庆历进士，历知制诰、翰林侍读学士，曾出使契丹；精研《春秋》，著有《春秋权衡》《七经小传》，对诸经训诂多有新解，兼通金石、天文、地理，欧阳修常就疑义咨问。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0153
    name: 杨亿
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: 杨亿（974—1020），字大年，建州浦城人。少以神童名，年十一受太宗召试，授秘书省正字，后赐进士及第。真宗朝官至翰林学士，参与编纂《册府元龟》。诗宗李商隐，与刘筠、钱惟演唱和，并称“杨刘”，所编《西昆酬唱集》为西昆体代表，著有《武夷新集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0154
    name: 刘筠
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: 刘筠（971—1031），字子仪，大名人。咸平元年进士，历知制诰、翰林学士，官至御史中丞，曾参与编修《册府元龟》。与杨亿、钱惟演唱和，并称“杨刘”，为西昆体代表诗人；《西昆酬唱集》收其诗甚多，作品用典精切、辞藻工丽。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0155
    name: 穆修
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: 穆修（979—1032），字伯长，郓州汶阳人。大中祥符进士，历任泰州司理参军、蔡州文学参军；家贫，曾鬻书于相国寺，倡导韩愈、柳宗元古文，校刻韩柳文集并加以传播，对尹洙、苏舜钦及欧阳修的古文创作有影响。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0156
    name: 尹洙
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: 尹洙（约1001—1047），字师鲁，河南府人。天圣进士，历馆阁校勘、泾原路经略安抚副使，参与宋夏战事；庆历新政失败后贬监均州酒税，卒。与欧阳修同倡古文，文章简练，著有《叙燕》《息戍》及《河南先生文集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0157
    name: 苏舜钦
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: 苏舜钦（1008—1048），字子美，梓州铜山人。景祐进士，任集贤校理、监进奏院；庆历间支持范仲淹新政，四年因进奏院祠神会用卖废纸钱宴客被劾除名，退居苏州筑沧浪亭，后复官湖州长史。与梅尧臣并称“苏梅”。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0158
    name: 郑獬
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: 郑獬（1022—1072），字毅夫，安州安陆人。皇祐五年进士第一，历官知制诰、翰林学士、权知开封府。曾上疏论冗兵之弊，并批评青苗法扰民，因与王安石政见不合出知杭州，后徙青州，卒。为文雄健，著有《郧溪集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
