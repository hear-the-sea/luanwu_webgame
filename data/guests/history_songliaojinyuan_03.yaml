  - key: hist_songliaojinyuan_0109
    name: 文彦博
    default_gender: male
    archetype: civil
    flavor: （1006年-1097年）北宋名相，历仕四朝五十年。他出将入相，功勋卓著，是北宋政坛的常青树。他主持平定贝州王则起义，又多次出任宰相，政绩斐然。其稳健持重，使北宋初政局屡转危为安。其政绩在史书中被反复称述。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0110
    name: 吕蒙正
    default_gender: male
    archetype: civil
    flavor: （944年-1011年）北宋名相，三次拜相。他从寒门子弟到宰相，是科举制度的典范。他宽厚大度，不记私仇。相传《破窑赋》为他所作，鼓励后人不要因一时困顿而灰心。其身世经历被视为科举励志的典型。其励志之名在民间广为流传。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0111
    name: 赵恒
    default_gender: male
    archetype: civil
    flavor: （968年-1022年）宋真宗，澶渊之盟的签订者。他在寇准的力劝下亲征澶州，最终与辽国达成和约。虽然每年需要缴纳岁币，却换来了百年和平。他崇尚道教，封禅泰山，政治上毁誉参半。其政策与礼制多有争议，后世评价分歧。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0112
    name: 章惇
    default_gender: male
    archetype: civil
    flavor: 字子厚，建州浦城人。嘉祐二年进士，王安石变法中为新党核心。哲宗亲政后拜尚书左仆射，尽复熙丰新法，严惩元祐党臣，手段峻急。徽宗立，累贬至雷州司户参军，徙睦州卒。《宋史》入奸臣传，然其施政才干近代渐获重评。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0113
    name: 曾公亮
    default_gender: male
    archetype: civil
    flavor: （999年-1078年）北宋名相，《武经总要》主编。他主持编修了中国古代最重要的军事百科全书，记载了火药武器的配方。他历仕三朝，政绩卓著。其编纂成果为后世军事研究所重。其书亦见证宋代军器发展。曾公亮所面对的并非单纯兵力对抗，还包括补给、地理与盟友稳定性的复合压力。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0114
    name: 丁谓
    default_gender: male
    archetype: civil
    flavor: （966年-1037年）北宋权臣，营造宫殿的能臣。他用一条渠道同时解决运输、清淤、填地三个问题，展现了惊人的工程才能。然而他陷害寇准，被列为奸臣。其贪权与陷害亦为史家所痛斥。其行径成为权臣误国的注脚。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0115
    name: 范纯仁
    default_gender: male
    archetype: civil
    flavor: （1027年-1101年）范仲淹之子，北宋名臣。他继承父志，为官清廉，多次出任宰相。他临终遗言"布衣而葬"，展现了范氏家风。其清俭家风成为范氏后人楷模。其事迹体现范氏清廉传统。把范纯仁放进同代互动网络考察，更能看清其个人策略与公共秩序之间的相互作用。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0116
    name: 张耒
    default_gender: male
    archetype: civil
    flavor: 张耒（1054—1114），字文潜，楚州淮阴人。熙宁进士，苏门四学士之一。诗风平易，学白居易、张籍，多写田家疾苦与日常琐事，有《柯山集》传世。晚年因党争贬谪，境遇潦倒而终。其诗在北宋末已见流传，然散佚亦多，今存者仅为原稿之半。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0117
    name: 陈师道
    default_gender: male
    archetype: civil
    flavor: （1053年-1102年）北宋诗人，江西诗派代表。他诗风质朴刚健，与黄庭坚并称"黄陈"。他一生贫困，却坚守文人风骨，不为五斗米折腰。其坚守操守，体现寒士不屈之气。其精神成为寒士自励的榜样。陈师道既能支撑作品层面的精读，也能连接更宏观的历史议题，研究价值相当稳定。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0118
    name: 王禹偁
    default_gender: male
    archetype: civil
    flavor: 王禹偁（954—1001），字元之，济州钜野人。太平兴国进士，官至知制诰。为文宗韩柳，力倡古文，早于欧阳修近半世纪。性刚直，屡因直言遭贬，曾作《三黜赋》以明志。其诗文开北宋革新之先声，惜生平事迹多存于后人追述，早年交游细节已难确考。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0119
    name: 宋祁
    default_gender: male
    archetype: civil
    flavor: （998年—1061年）北宋词人、史学家。与欧阳修同修《新唐书》，主撰列传。词句"红杏枝头春意闹"传诵一时，得号"红杏尚书"。文名与史才并显于时，著述颇丰，然其生平若干细节仍存空白。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0120
    name: 林逋
    default_gender: male
    archetype: civil
    flavor: （967年-1028年）北宋隐逸诗人，"梅妻鹤子"的典故来源。他隐居西湖孤山二十年，以梅为妻，以鹤为子。"疏影横斜水清浅，暗香浮动月黄昏"是咏梅绝唱。其梅鹤情怀成为隐逸文化象征。其逸趣与清寂成为隐士典型。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0121
    name: 钱惟演
    default_gender: male
    archetype: civil
    flavor: （977年-1034年）北宋文学家，吴越王钱镠之孙。他是西昆体的重要作家，诗文华丽典雅。他仕途显达，却始终保持文人本色。其文采与家世相映，为西昆体重镇。其文风代表西昆体的成熟面貌。钱惟演留下的表达范式被后世反复激活，使其在文学传统中始终保持可见度。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0122
    name: 王曾
    default_gender: male
    archetype: civil
    flavor: （978年-1038年）北宋名相，连中三元的传奇人物。他科举考试中连中解元、会元、状元，是北宋唯一的"三元及第"。他为官清廉，深受百姓爱戴。其清廉政声与科举传奇并称。其名与科举神话并传后世。把王曾放入长时段视野中观察，可见其影响并非瞬时，而是逐步累积并被重释。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0123
    name: 张方平
    default_gender: male
    archetype: civil
    flavor: 张方平（1007—1091），字安道，应天宋城人。少颖悟，举茂才异等科。历仕仁、英、神、哲四朝，曾知益州、判三司。在蜀时识拔苏洵父子，荐苏轼于欧阳修。其为政尚宽简，论事切直，然具体政绩记载零散，晚年事迹尤稀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0124
    name: 吕公着
    default_gender: male
    archetype: civil
    flavor: （1018年-1089年）北宋名相，旧党领袖。他反对王安石变法，主张渐进改革。他为人宽厚，深得朝野敬重。其温厚作风使旧党得以凝聚。其宽厚人格赢得广泛声望。其政声亦为后世史家反复讨论。吕公著的统治风格并非单点特征，而是由时代压力与个人偏好共同塑形。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0125
    name: 王珪
    default_gender: male
    archetype: civil
    flavor: （1019年-1085年）北宋宰相，"三旨相公"的典故来源。他为相十六年，凡事唯诺，被讥为"取圣旨、领圣旨、已得圣旨"。其唯诺之名成为后世负面典故。其名声多被后世作为反面例。就人物史研究而言，王珪常被用来讨论“个人抉择”与“制度约束”如何彼此嵌套。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0126
    name: 刘挚
    default_gender: male
    archetype: civil
    flavor: 字莘老，永静军东光人。嘉祐四年进士。哲宗即位高太后听政，由吏部尚书拜尚书右仆射。为朔党领袖，力主废罢熙丰新法，与蔡确、章惇等新党抗衡。绍圣间哲宗亲政，遭报复连贬，授鼎州团练副使，卒于贬所。著有《忠肃集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0127
    name: 吕大防
    default_gender: male
    archetype: civil
    flavor: （1027年-1097年）北宋名相，旧党首领。他主政期间废除新法，恢复旧制。他死于贬谪途中，是党争的牺牲品。其被贬结局彰显党争残酷。其遭遇凸显党争的残酷性。其经历常被视作党争悲剧代表。吕大防相关材料在后续研究中被持续援引，主要因为其兼具人物史细节与制度史参照价值。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0128
    name: 范祖禹
    default_gender: male
    archetype: civil
    flavor: （1041年-1098年）北宋史学家，《资治通鉴》编修助手。他协助司马光编修《资治通鉴》，又独自完成《唐鉴》。他是北宋最杰出的史学家之一。其史识精审，为宋代史学奠定坚实基础。从接受史角度看，范祖禹的影响并非线性扩散，而是经由多轮筛选与重构后持续显现。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0129
    name: 吕惠卿
    default_gender: male
    archetype: civil
    flavor: （1032年—1111年），北宋新党重臣，泉州晋江人。嘉祐进士，受王安石擢拔，参与制定青苗、免役诸法，官至参知政事。后与安石交恶，互劾不已。哲宗朝遭贬，徽宗时致仕。其才识为世所称，然反复于党争之间，毁誉参半。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0130
    name: 蔡确
    default_gender: male
    archetype: civil
    flavor: （1037年-1093年）北宋宰相，新党首领。他继王安石之后推行新法，因车盖亭诗案被贬。他的遭遇是北宋党争激烈的缩影。其政治起落映照出新旧党争的激烈对立。其政治生涯常被视作党争的典型案例。后世对蔡确评价持续分化，往往源于短期秩序与长期成本在其政策中并未同步兑现。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0131
    name: 邢恕
    default_gender: male
    archetype: civil
    flavor: （1035年-1109年）北宋大臣，党争中的投机者。他先附新党，后投旧党，又归新党，是党争时代的政治变色龙。其反复无常被视为党争乱象的缩影。其行止为后世谈党争者所讥评。邢恕相关材料在后续研究中被持续援引，主要因为其兼具人物史细节与制度史参照价值。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0132
    name: 蔡卞
    default_gender: male
    archetype: civil
    flavor: （1048年-1117年）北宋大臣，蔡京之弟。他是王安石的女婿，积极推行新法。他书法精妙，与兄蔡京齐名。其书法成就为党争之外的艺术亮点，颇受后世称道。其书法与政事并存，为后世评价所及。围绕蔡卞的研究通常会在文本细读与时代语境之间往返，以避免人物评价被单一路径固化。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0133
    name: 曾布
    default_gender: male
    archetype: civil
    flavor: 曾巩之弟。初助王安石行新法，后因市易务之争与之疏离。徽宗初拜相，欲调和元祐、绍圣两派，为蔡京弹劾罢去，贬死润州。在吕惠卿与王安石之间周旋多年，史籍对其晚年举措评价分歧较大。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0134
    name: 吴充
    default_gender: male
    archetype: civil
    flavor: （1021年-1080年）北宋宰相，王安石的亲家。他虽与王安石为姻亲，却反对某些新法政策。他为人正直，不因私废公。其持论公正，为党争中的清流代表之一。吴充所处权力结构并不线性清晰，其关键选择通常受多方博弈共同塑造。观察吴充的决策轨迹，可见其在财政、人事与边防三重压力下不断调整治理重心。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0135
    name: 陈瓘
    default_gender: male
    archetype: civil
    flavor: 陈瓘（1057—1124），字莹中，南剑州沙县人。元丰进士，官至左司谏。以弹劾蔡京、章惇而名震朝野，著有《尊尧集》辨史事。崇宁后被贬窜远州，终卒于贬所。其言论多赖门人辑录，晚年流徙中若干行迹已不可详考。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0136
    name: 邹浩
    default_gender: male
    archetype: civil
    flavor: （1060年-1111年）北宋名臣，敢言直谏的典范。他因反对立刘妃为后而被贬岭南。他的忠直得到后世敬仰。其遭贬仍不改节，彰显士大夫风骨。就人物史研究而言，邹浩常被用来讨论“个人抉择”与“制度约束”如何彼此嵌套。邹浩相关材料在后续研究中被持续援引，主要因为其兼具人物史细节与制度史参照价值。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0137
    name: 陈尧佐
    default_gender: male
    archetype: civil
    flavor: 陈尧佐（963—1044），字希元，阆州阆中人。端拱进士，与兄尧叟、弟尧咨并称"陈氏三状元"。历知滑州、并州等地，以治水著称，曾筑长堤防钱塘潮。晚年拜同中书门下平章事。其家世显赫而个人早年交游记载甚略，治水细节亦仅见零星碑刻。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0138
    name: 陈尧咨
    default_gender: male
    archetype: military
    flavor: （970年—1034年）北宋文武官员。以善射闻名，曾自矜其技，遇卖油翁酌油穿钱孔而钱不湿，翁言"惟手熟尔"，尧咨遂悟。后转武职，曾任知州、节度使，戍守西北边镇。史载其"性刚"，治军尚严，然边事记述简略，具体战功不详。其事由欧阳修《卖油翁》一文广传，成勤习精进之典范。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0139
    name: 杜衍
    default_gender: male
    archetype: civil
