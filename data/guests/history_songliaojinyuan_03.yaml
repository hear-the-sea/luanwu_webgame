    name: 文彦博
    default_gender: male
    archetype: civil
    flavor: （1006年-1097年）北宋名相，历仕四朝五十年。他出将入相，功勋卓著，是北宋政坛的常青树。他主持平定贝州王则起义，又多次出任宰相，政绩斐然。其稳健持重，使北宋初政局屡转危为安。其政绩在史书中被反复称述。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0110
    name: 吕蒙正
    default_gender: male
    archetype: civil
    flavor: （944年-1011年）北宋名相，三次拜相。他从寒门子弟到宰相，是科举制度的典范。他宽厚大度，不记私仇。相传《破窑赋》为他所作，鼓励后人不要因一时困顿而灰心。其身世经历被视为科举励志的典型。其励志之名在民间广为流传。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0111
    name: 赵恒
    default_gender: male
    archetype: civil
    flavor: （968年-1022年）宋真宗，澶渊之盟的签订者。他在寇准的力劝下亲征澶州，最终与辽国达成和约。虽然每年需要缴纳岁币，却换来了百年和平。他崇尚道教，封禅泰山，政治上毁誉参半。其政策与礼制多有争议，后世评价分歧。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
