heroes:
  blue:
  - key: hist_songliaojinyuan_0109
    name: 文彦博
    default_gender: male
    archetype: civil
    flavor: （1006年-1097年）北宋名相，历仕四朝五十年。他出将入相，功勋卓著，是北宋政坛的常青树。他主持平定贝州王则起义，又多次出任宰相，政绩斐然。其稳健持重，使北宋初政局屡转危为安。其政绩在史书中被反复称述。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0110
    name: 吕蒙正
    default_gender: male
    archetype: civil
    flavor: （944年-1011年）北宋名相，三次拜相。他从寒门子弟到宰相，是科举制度的典范。他宽厚大度，不记私仇。相传《破窑赋》为他所作，鼓励后人不要因一时困顿而灰心。其身世经历被视为科举励志的典型。其励志之名在民间广为流传。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0111
    name: 赵恒
    default_gender: male
    archetype: civil
    flavor: （968年-1022年）宋真宗，澶渊之盟的签订者。他在寇准的力劝下亲征澶州，最终与辽国达成和约。虽然每年需要缴纳岁币，却换来了百年和平。他崇尚道教，封禅泰山，政治上毁誉参半。其政策与礼制多有争议，后世评价分歧。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0112
    name: 章惇
    default_gender: male
    archetype: civil
    flavor: 字子厚，建州浦城人。嘉祐二年进士，王安石变法时成为新党骨干；哲宗亲政后拜尚书左仆射，尽复熙丰新法，对元祐旧臣处置峻急。徽宗即位后，他由权力中枢一路贬至雷州、睦州，终于任所。章惇的笔锋像刀，既能剖开积弊，也容易伤及旁人；《宋史》列入奸臣传，才干与严酷遂一并留下。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0113
    name: 曾公亮
    default_gender: male
    archetype: civil
    flavor: （999年-1078年）北宋宰相，与丁度等奉诏编修《武经总要》，把军制、守城、器械乃至火药配方收进一部书中。曾公亮历仕仁、英、神三朝，既是朝廷文臣，也认真面对边防这门硬功夫。案头的笔看似不带寒光，落在兵书上却能替后世留下宋代军器的谱录。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0114
    name: 丁谓
    default_gender: male
    archetype: civil
    flavor: （966年-1037年）北宋权臣，修建宫殿时借一条渠道兼顾运料、清淤与填土，工程手腕确有巧处。可惜手上能理水，心中未必能容人；他与寇准相争并促成其失势，后来专权跋扈，终被列入奸臣之中。丁谓的故事提醒人，机关算尽也许能把泥水导走，却未必能替自己导出一条善终之路。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0115
    name: 范纯仁
    default_gender: male
    archetype: civil
    flavor: （1027年-1101年）范仲淹之子，北宋名臣，历官至宰相。父亲留下“先忧后乐”的名声，他没有靠家世挥霍这块招牌，而以宽厚清俭自持。临终有“布衣而葬”之意，范家不以相门排场压过士人本色。范纯仁的刀不在腰间，在取舍之间：身居高位，仍不肯把清白换成富贵。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0116
    name: 张耒
    default_gender: male
    archetype: civil
    flavor: 张耒（1054—1114），字文潜，楚州淮阴人，苏门四学士之一。诗学白居易、张籍，少摆玄虚架子，常把田家疾苦和日常小事写得有声有色，《柯山集》传世。晚年受党争牵连而屡遭贬谪，处境潦倒，却仍守着自己的笔锋；他写的是寻常人间，落笔却比许多高谈阔论更近民心。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0117
    name: 陈师道
    default_gender: male
    archetype: civil
    flavor: （1053年-1102年）北宋诗人，江西诗派重要作家，与黄庭坚并称“黄陈”。陈师道一生贫困，诗却不肯软弱，讲究锤炼字句，也保留寒士的硬骨头。后山居士在缺衣少食时仍守住文人的自尊，诗中既有生活的窘迫，也有不肯低头的锋芒；这位诗人若入江湖，大约是囊中无银、剑气不减的那一种。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0118
    name: 王禹偁
    default_gender: male
    archetype: civil
    flavor: 王禹偁（954—1001），字元之，济州钜野人，太平兴国进士，官至知制诰。作文宗法韩愈、柳宗元，力倡古文；性情刚直，屡因直言触忤而被贬，遂作《三黜赋》自明心志。他的文章像一柄早出鞘的剑，为北宋古文革新先声；至于早年交游，史料已不甚完整，不能替他续写太多逸闻。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0119
    name: 宋祁
    default_gender: male
    archetype: civil
    flavor: （998年—1061年）北宋词人、史学家，与欧阳修同修《新唐书》，主要负责编写列传。词中“红杏枝头春意闹”一语传遍京城，宋祁也因此得“红杏尚书”之称。能在史笔与春色之间来回换招，既要考据，也要有灵气；他的生平细节虽有缺页，留下的文名却很鲜明。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0120
    name: 林逋
    default_gender: male
    archetype: civil
    flavor: （967年-1028年）北宋隐逸诗人，长居西湖孤山。后人以“梅妻鹤子”写他的生活，并非真有一纸婚书，却恰好道出他与梅鹤相伴的清寂；“疏影横斜水清浅，暗香浮动月黄昏”更把一枝梅写出了江湖绝学般的身段。林逋不入仕途，不等于无所作为，他把孤山过成了自己的山门。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0121
    name: 钱惟演
    default_gender: male
    archetype: civil
    flavor: （977年-1034年）吴越王钱镠之孙，北宋文学家与重臣。钱惟演出身显贵，诗文也带着西昆体的华饰与典雅，是馆阁文坛的重要作家；他的仕途并非隐士清谈，而是家世、权力与文章彼此缠绕。若说西昆体是一袭锦袍，他既穿得起，也知道怎样在袖口藏进一管笔。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0122
    name: 王曾
    default_gender: male
    archetype: civil
    flavor: （978年-1038年）北宋名相，科举中连中解元、会元、状元，成就“三元及第”的佳话。王曾后来入相，为官以清谨著称，未让状元的光环变成骄气。别人赶考要过三道关，他像是一路把榜首当作落脚点；真正难的，却是入仕之后仍守得住清名。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0123
    name: 张方平
    default_gender: male
    archetype: civil
    flavor: 张方平（1007—1091），字安道，应天宋城人，历仕仁、英、神、哲四朝。任蜀地时识拔苏洵父子，又荐苏轼于欧阳修，可谓替宋代文坛递出过几封改变格局的荐书。他为政尚宽简，论事直切；自己未必处处站在风口，却有识人之眼，能从人群里挑出尚未出鞘的名剑。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0124
    name: 吕公着
    default_gender: male
    archetype: civil
    flavor: （1018年-1089年）吕夷简之子，北宋名臣，元祐年间成为旧党重臣。面对王安石新法，他主张守成与渐改，不喜把朝堂争论化成你死我活的刀战。吕公著性情宽厚，能容异议，却并非没有立场；在党争最盛时，肯把剑尖压低一寸，本身就是一种政治选择。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0125
    name: 王珪
    default_gender: male
    archetype: civil
    flavor: （1019年-1085年）北宋宰相，居相位十六年。后人讥他凡事只会“取圣旨、领圣旨、已得圣旨”，遂有“三旨相公”之名；这句笑谈虽尖刻，却也映出他在强势君权与新旧党争之间少有独立锋芒。王珪未必全无才具，只是手里的笏板常像被无形的线牵着，难以挥出自己的招式。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0126
    name: 刘挚
    default_gender: male
    archetype: civil
    flavor: 字莘老，永静军东光人，嘉祐四年进士。哲宗初年高太后听政，他由吏部尚书拜尚书右仆射，成为朔党领袖，主张废罢熙丰新法。哲宗亲政后，新党反攻，刘挚连遭贬谪，最终死于贬所。《忠肃集》留下他的文章，也留下一个党争时代的旧臣如何被潮水反复推搡的身影。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0127
    name: 吕大防
    default_gender: male
    archetype: civil
    flavor: （1027年-1097年）北宋名相，元祐年间的旧党重臣。司马光去世后，他主持朝政，延续废新法、复旧制的路线；绍圣以后新党得势，吕大防被连番贬逐，终于死在谪途。朝堂上争的是法令，落到个人身上却是漫长的驿路与风霜，他的一生正被这两层代价夹在中间。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0128
    name: 范祖禹
    default_gender: male
    archetype: civil
    flavor: （1041年-1098年）北宋史学家，曾协助司马光编修《资治通鉴》，又撰成《唐鉴》。他看史不只数战功，还反复追问君臣得失与治乱根由，笔下有一股劝诫当世的锋意。范祖禹后来也卷入党争而遭贬，史家与政客两种身份在他身上并未各走各路，反而一同受了时代的风雪。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0129
    name: 吕惠卿
    default_gender: male
    archetype: civil
    flavor: （1032年—1111年）泉州晋江人，北宋新党重臣。受王安石擢拔，参与青苗、免役等法的制定，官至参知政事；后来与王安石交恶，彼此攻讦，旧日同道终于成了对手。吕惠卿有改革之才，也有党争中的锐利与反复，像一把快刀，能破局，却不总能控制刀锋最后落向谁。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0130
    name: 蔡确
    default_gender: male
    archetype: civil
    flavor: （1037年-1093年）北宋宰相，新党重臣，继王安石之后推动熙丰新法。元祐年间退居时作《夏日登车盖亭诗》，后来被指涉讪朝政，酿成“车盖亭诗案”，蔡确由此被贬远地，客死途中。能在朝堂执掌法令，也会因一首诗跌下云端；党争这柄剑，往往连剑鞘里的文字也不放过。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0131
    name: 邢恕
    default_gender: male
    archetype: civil
    flavor: （1035年-1109年）北宋大臣，身处新旧党争交界，政治立场几度转折。邢恕先后依附不同阵营，既有时势逼迫，也有自择进退的一面，后世遂讥为反复之臣。旁观者看他像变色龙，身在风浪中的人却知道每一次换色都要付账；只是账本翻到最后，他的名声仍难翻身。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0132
    name: 蔡卞
    default_gender: male
    archetype: civil
    flavor: （1048年-1117年）北宋大臣，蔡京之弟，又是王安石的女婿，正站在新党亲缘与权力网络的交叉口上。蔡卞参与推行新法，书法也颇精，与蔡京并称“二蔡”；只是同样一管笔，写字能传雅名，写奏章便会卷入党争。论蔡卞，不能只看他的墨迹，也不能只把他缩成家族名单。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0133
    name: 曾布
    default_gender: male
    archetype: civil
    flavor: 曾巩之弟，早年参与王安石变法，后来因市易务等政见与王安石渐行渐远。徽宗初年拜相，他试图调和元祐、绍圣两派，却被蔡京弹劾罢相，贬居润州而死。曾布一生都在阵营之间寻找可行的缝隙，最后发现朝堂的缝隙往往只够刀尖通过，不够一个宰相全身而退。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0134
    name: 吴充
    default_gender: male
    archetype: civil
    flavor: （1021年-1080年）北宋宰相，与王安石有姻亲关系，却没有因此全盘赞同新法。吴充在政争中能分辨亲疏与公议，不因家门关系便把所有奏章都盖上同一个印。其立场未必处处讨好任何一党，正因如此，才显出一个宰相在财政、边防与人事压力间维持判断的难处。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0135
    name: 陈瓘
    default_gender: male
    archetype: civil
    flavor: 陈瓘（1057—1124），字莹中，南剑州沙县人，元丰进士，官至左司谏。面对蔡京、章惇等权臣，他连番上疏弹劾，著《尊尧集》辨析史事与名分；崇宁以后因此屡遭贬窜，终于卒于贬所。陈瓘的长处不是圆滑周旋，而是明知言出会伤身，仍把谏章写成了出鞘之刃。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0136
    name: 邹浩
    default_gender: male
    archetype: civil
    flavor: （1060年-1111年）北宋谏臣，因上疏反对册立刘妃为后而触怒权贵，遭贬岭南。被放逐并没有让他改换口风，反而使“敢言”二字从朝堂口号变成了自己的行路代价。邹浩不是不知刀锋所向，只是不肯把沉默当作护身符；这份直劲，正是士大夫风骨最硬的一面。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0137
    name: 陈尧佐
    default_gender: male
    archetype: civil
    flavor: 陈尧佐（963—1044），字希元，阆州阆中人，端拱进士。后世有“陈氏三状元”的称呼，但其中高中状元的是兄陈尧叟与弟陈尧咨，尧佐本人以进士及第入仕。他历知滑州、并州等地，以治水见长，晚年入相；陈家兄弟各有一门绝技，尧佐不靠弓箭扬名，而是同洪水较劲。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0138
    name: 陈尧咨
    default_gender: male
    archetype: military
    flavor: （970年—1034年）北宋文武官员，以善射闻名。欧阳修所记“卖油翁”故事里，他先为箭术自矜，见老人从钱孔注油而不沾钱，才听到“惟手熟尔”这句当头棒喝；箭法再准，也得服输给一勺油。陈尧咨后来任知州、节度使并戍守西北，史载性刚、治军严，边地任事的具体战绩传世记载较为简略。
    growth_range:
