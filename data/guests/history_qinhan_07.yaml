      agility: 16
  - key: hist_qinhan_0320
    name: 冯奉世
    default_gender: male
    archetype: military
    flavor: （生年不详—前39年）西汉将领，史载其在西域与边疆事务中立功。与“奇袭定天下”的叙事不同，冯奉世所代表的是西汉中后期边政的常态：对外征讨不再是一次性远征，而是持续的制度性经营，需要军事行动、行政设置与外交安排相互配合。边地的安全常建立在反复的出兵、屯田、安置与谈判之上，而将领的能力也因此不只体现在战场，更体现在能否把战果变成可治理的秩序。冯奉世的价值，正在于让人看到汉廷如何用“长期投入”维持边境——那不是一时豪举，而是一套需要耐心与资源的国家工程。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0321
    name: 田千秋
    default_gender: male
    archetype: civil
