  - key: hist_qinhan_0346
    name: 窦固
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: （生年不详—88年）东汉将领，字孟孙，扶风平陵人，窦融之侄，娶光武帝女涅阳公主。永平十六年，窦固率军出击北匈奴，攻取伊吾卢城，并派班超出使西域。汉章帝时，他历任大鸿胪、光禄勋，封显亲侯，死后谥为文侯。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0305
    name: 李蔡
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前118年）西汉将领，陇西成纪人，李广的堂弟。他文帝时与李广同为郎官，武帝时曾任轻车将军，随卫青出击匈奴，因功封乐安侯，后来升任丞相。李蔡因侵占汉景帝陵园壖地获罪，被交付法吏追究，最终自杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0323
    name: 翟方进
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前7年）西汉末年重臣，字子威，汝南上蔡人，家贫力学，以明《春秋》入仕。他历任朔方刺史、京兆尹、御史大夫，后拜丞相，封高陵侯。绥和二年，天象出现荧惑守心，汉成帝下诏责问，翟方进被迫自杀，死后按丞相之礼治丧。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0324
    name: 王嘉
    avatar: pig/文031.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前2年）西汉末年大臣，字公仲，右扶风平陵人，曾任丞相，封新甫侯，以敢于直谏著称。汉哀帝宠信董贤、屡次封赏过滥时，王嘉多次上书反对，并封还诏书。后来他被劾以迷国罔上之罪，下狱后于狱中绝食而死。
