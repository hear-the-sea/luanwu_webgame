  - key: hist_qinhan_0322
    name: 石显
    default_gender: male
    archetype: civil
    flavor: （生年不详—前33年）西汉元帝时期的宦官权力人物，史书多以负面笔墨书写其结党与操控人事。石显值得关注的地方，不只是个人品行，而是他所代表的权力通道：当皇帝决断不足、外朝派系互相牵制时，近侍掌握出入奏章与传达诏命的环节，就可能把“服务”变成“控制”，把私党变成制度阴影。石显现象说明宦官权力并不必然从“叛乱”开始，而常从日常的文书与人事运作开始累积，直到朝臣发现很多决定已经绕开公卿系统。理解石显，也就更能理解西汉后期政治为何会疲软：不是某一人突然夺权，而是权力在缝隙里长期外流，最终形成难以纠正的结构。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0328
    name: 刘玄
    default_gender: male
    archetype: civil
    flavor: （生年不详—25年）新莽末年起义政权领袖之一，史称更始帝。王莽政权崩溃过程中，刘玄在绿林军支持下称帝，入长安建立政权，但内部控制力弱，军政整合不足，最终被赤眉军所败。更始政权最致命的短板在于“缺少一套可复制的治理”：起义军可以凭战势推翻旧朝，却很难立刻把多支武装、地方豪强与旧官僚重新编进同一张网。长安的宫阙可以迅速易主，郡县的税赋与治安却不会自动听命；更始朝在奖惩、征发与任官上的摇摆，使支持者迅速离心。写刘玄，不是简单嘲笑其无能，而是提醒：乱世里真正稀缺的不是推翻的勇气，而是把胜利变成秩序的能力。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0330
    name: 刘盆子
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）赤眉军所立的傀儡皇帝。赤眉入关后为求号召与名分而立刘盆子，实权仍在军中。形势逆转后他被迫归降，其后如何安置在史书中亦多有简略。刘盆子的故事很残酷：对拥立者而言，他是一面旗；对他自己而言，却是被推上高处的少年。乱世武装往往需要借宗室名号来“让天下相信”，但这份相信并不会保护被立者，反而把他绑在军心与战势的起伏上。刘盆子被立、被弃、被降的过程，把合法性讲得很现实——名号可以制造，但秩序要靠治理；当治理做不到时，皇帝也只能成为战局的附属品。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0307
    name: 卜式
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉商人出身的政治人物。国家财用紧张、边事频仍时，卜式主动献财助国，因而获得朝廷赏识并进入仕途。财富在他手里换成了官场的席位，也让人看见汉代社会流动的另一条路径：除了读书与军功，钱粮同样能叩开宫门。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
