  - key: hist_qinhan_0318
    name: 陈汤
    default_gender: male
    archetype: military
    flavor: （生年不详—前6年）西汉将领，曾与甘延寿出兵西域，斩郅支单于，声威远播。远征千里、兵力有限，胜利既靠决断，也要承担越权与问责的风险；陈汤后来屡遭议论，正是功名与朝廷规矩相撞的回声。边塞的捷报传到长安时，往往也带着一封等待裁断的奏章。
