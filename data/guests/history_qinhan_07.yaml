  - key: hist_qinhan_0330
    name: 刘盆子
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）新莽末年赤眉军拥立的皇帝，泰山式人，城阳景王刘章之后。他原是军中放牛的少年，建武元年被赤眉军以抽签方式推上帝位，年方十五。赤眉军败后，他随众归降刘秀，被任命为赵王郎中；后来因病失明，刘秀赐给他荥阳官地，以租税养其终身。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0307
    name: 卜式
    avatar: pig/文035.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉商人、牧羊人，河南人，以经营田畜致富。汉武帝征讨匈奴时，他主动上书愿献出一半家产助军，被召入朝任中郎，后历任缑氏令、齐王太傅等职，官至御史大夫。卜式不赞成盐铁官营等政策，因与武帝意旨不合，被改拜太子太傅，实为疏远。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0320
    name: 冯奉世
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前39年）西汉将领，字子明，上党潞人，曾任卫尉、右将军。宣帝时他奉命出使西域，恰逢莎车王杀害汉朝所立之王与汉使，冯奉世当机立断，调集诸国兵力攻破莎车，另立新王。回朝后他因功封关内侯，晚年任执金吾，后出击陇西羌人。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0321
    name: 田千秋
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前77年）西汉丞相，原任高寝郎。巫蛊之祸后，他上书为卫太子刘据申辩，汉武帝感悟，召见并提拔他为大鸿胪，不久拜丞相、封富民侯。田千秋为相宽厚持重，昭帝时继续辅政，因年老得乘小车入宫，时称“车丞相”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0325
    name: 赵广汉
    avatar: pig/文050.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前65年）西汉官员，字子都，涿郡蠡吾人，曾任京兆尹，以查办盗贼和豪强著称。赵广汉善于布置耳目、追查案件，京城治安一度好转；后来他因怀疑丞相魏相夫人杀害婢女而加以追究，触怒朝廷，被劾以摧辱大臣等罪，最终被处死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0334
    name: 盖延
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
    flavor: （生年不详—39年）东汉开国将领，字巨卿，渔阳要阳人，以勇力闻名。他初为渔阳太守彭宠部下，后与吴汉等归附刘秀，参与平定河北、关东，曾率军围攻梁王刘永于睢阳。盖延后任左冯翊，因功封安平侯，建武十五年卒于官。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
