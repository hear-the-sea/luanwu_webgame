    name: 伏生
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前168年）西汉学者，名胜，济南人，秦代曾任博士。秦始皇焚书时，伏生将《尚书》藏于墙壁之中；汉初寻求经书，他年逾九十不能入朝，汉文帝派晁错前去受业，由伏生口授、其女转述，整理成二十八篇今文《尚书》。
