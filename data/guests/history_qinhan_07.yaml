      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0328
    name: 刘玄
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—25年）新莽末年绿林军拥立的皇帝，字圣公，南阳蔡阳人，汉光武帝刘秀的族兄。地皇四年，绿林军立他为更始帝，次年攻入长安；他猜忌功臣，杀害刘縯等人。赤眉军西进后，刘玄出降，受封长沙王，不久被赤眉将领谢禄缢杀。
    growth_range:
