  - key: hist_qinhan_0301
    name: 孔安国
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉经学家，孔子后裔，名与古文经学传统相连。秦火之后典籍散佚，孔安国在残缺与歧文之间整理师承，使经典重新成为可传授、可议政的国家语言。后世对其传承虽有争论，他在汉代学术史留下的那道书脉仍清晰可见。
