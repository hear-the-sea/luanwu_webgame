  - key: hist_qinhan_0315
    name: 萧望之
    default_gender: male
    archetype: civil
    flavor: （生年不详—前46年）西汉大臣与儒者。以守正敢言著称，政治生涯多有起伏，终因党争与权力斗争而死。萧望之面对皇帝、近臣与外戚的牵制，仍把名节看作立身之本；可西汉后期的风向越来越快，刚直之士最终被逼到绝路。儒者入仕的光亮与代价，都落在他身上。
    growth_range:
