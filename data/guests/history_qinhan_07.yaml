    name: 石显
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前33年）西汉宦官，字君房，济南人。他少年时因罪受腐刑入宫，汉元帝时官至中书令，与弘恭一同掌管机要，深受信任。石显曾排挤萧望之、周堪等朝臣，权倾一时；元帝死后，他失去成帝信任，被免官徙归故郡，途中病死。
    growth_range:
