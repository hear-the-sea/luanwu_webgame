    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0316
    name: 匡衡
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉经学家、丞相，字稚圭，东海承人。相传他幼年家贫，凿壁引光读书，尤精《诗经》，时人有“无说《诗》，匡鼎来”之语。汉元帝时官至丞相，封乐安侯；成帝即位后，因多占封地被免为庶人，归乡终老。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0318
    name: 陈汤
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前6年）西汉将领，字子公，山阳瑕丘人，曾任西域都护副校尉。他与甘延寿未经正式诏令发兵，远征康居，攻破郅支城、斩杀郅支单于，因功封关内侯。战后他因擅发诸国兵等事被免官，晚年一度被徙往敦煌，后返回长安。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0319
    name: 甘延寿
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）西汉将领，字君况，北地郁郅人，以良家子善骑射入仕，曾任西域都护。他与副校尉陈汤未经正式诏令发兵，远征康居，攻破郅支城并斩杀郅支单于；回朝后因功封义成侯，后来升任城门校尉、护军都尉，卒于官。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0329
    name: 刘縯
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: （生年不详—23年）新莽末年起兵的汉室宗亲，字伯升，南阳蔡阳人，汉光武帝刘秀之兄。他在舂陵起兵，联合绿林军，率军围攻宛城，声威日盛；更始帝刘玄即位后忌其功高，在李轶、朱鲔等人谋划下将他杀害。刘秀称帝后追谥其为齐武王。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0345
    name: 邓绥
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （81年—121年）东汉和帝皇后，太傅邓禹之孙女，父邓训。和帝去世后，她先后迎立殇帝、安帝，以太后身份临朝称制十余年。执政期间任用邓骘等辅政，减免赋役、赈济灾民，又派兵平定西羌；建光元年去世，谥和熹皇后。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0332
    name: 寇恂
    avatar: pig/文032.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—36年）东汉开国名臣，字子翼，上谷昌平人，曾任河内太守。刘秀经营河北时，寇恂与耿况率郡兵归附，镇守河内、转运军粮，使后方安定。此后他出任颍川太守、执金吾，参与平定各地割据，封雍奴侯，死后谥威侯。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0333
    name: 贾复
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: （生年不详—55年）东汉开国将领，字君文，南阳冠军人，少年时好学，兼习《尚书》。他随刘秀征战河北、关中等地，作战勇猛，屡立战功，曾任执金吾、左将军，封胶东侯。天下平定后他交出兵权，以列侯身份居第，死后谥刚侯。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0337
    name: 祭遵
    avatar: monkey/其他随机角色/武044_男_.png
    default_gender: male
    archetype: military
    flavor: （生年不详—33年）东汉将领，字弟孙，颍川颍阳人。他少年好学，家富而自奉俭约，随刘秀征战河北、关中，任军市令时执法不避权贵。祭遵后任征虏将军，封颍阳侯，治军严整，不许士卒扰民；征讨隗嚣时病逝军中，刘秀命人护送灵柩回洛阳安葬。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0343
    name: 阴丽华
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （5年—64年）东汉皇后，南阳新野人，汉光武帝刘秀的元配，汉明帝刘庄之母。刘秀早年有“娶妻当得阴丽华”之语；称帝后先立郭圣通为后，建武十七年郭后被废，改立阴丽华为皇后。她性情谦和，明帝即位后被尊为皇太后，死后谥光烈皇后。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0347
    name: 耿恭
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）东汉将领，字伯宗，扶风茂陵人，永平年间任西域戊己校尉。匈奴围攻疏勒城时，耿恭率部坚守数月，粮尽后煮铠甲弓弩充饥，仍拒绝投降。汉军援兵到达后，他随军撤回玉门关，所部仅余十三人，后世论者常将其与苏武并论。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0348
    name: 杨震
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （54年—124年）东汉名臣，字伯起，弘农华阴人，通晓经籍，时人称为“关西孔子”。他任荆州刺史时举荐王密，王密夜里送金，他以“天知、地知、你知、我知”拒绝。杨震后官至太尉，因屡次弹劾宦官、外戚而遭忌恨，被免官遣归，途中饮鸩而死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0301
    name: 孔安国
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉经学家，鲁人，孔子后裔，汉武帝时曾任博士、谏大夫，后出任临淮太守。相传古文《尚书》等典籍出自孔子旧宅墙壁，孔安国加以整理传授，开创古文经学一脉；旧题孔安国所传《古文尚书》后世颇有真伪之争。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0311
    name: 上官桀
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前80年）西汉将领、外戚，字少叔，陇西上邽人，官至太仆、左将军。汉武帝临终时，他受遗诏与霍光等人共同辅佐昭帝，孙女被立为昭帝皇后。此后上官桀与霍光争权，联合桑弘羊、燕王刘旦等人谋变，事泄后被族诛。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0315
    name: 萧望之
    avatar: pig/文050.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前46年）西汉大臣、儒者，字长倩，东海兰陵人，以经术入仕。汉宣帝时他任御史大夫、太子太傅，受遗诏辅佐元帝。元帝即位后，萧望之与宦官石显、弘恭不和，遭诬陷免官；后来石显等又奏请逮捕他，他不愿受辱，饮鸩自杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0331
    name: 樊崇
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）新莽末年赤眉军首领，琅邪人。天凤年间他在莒县起兵，部众以朱染眉相识别，故称赤眉，众至数十万。樊崇率军击败王莽军队，西入长安，拥立刘盆子为帝；后为刘秀所败，归降后被封为列侯，不久因谋反被杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0344
    name: 明德马皇后
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （40年—79年）东汉明帝皇后，扶风茂陵人，伏波将军马援之女。她十三岁入宫，明帝即位后立为皇后，章帝刘炟由她抚养。马皇后生活俭朴，好读《春秋》《楚辞》，多次劝止加封马氏宗亲；章帝即位后被尊为皇太后，仍约束外戚，不使兄弟干预朝政。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0308
    name: 郭解
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）西汉游侠，字翁伯，河内轵县人，以轻财好施、替人排难闻名。他的外甥曾仗势强灌人酒而被人杀死，郭解认为外甥理亏，放走了凶手。武帝时郭解被迁往茂陵，其门客又杀死议论他的儒生，官府追究此事，郭解虽不知情，仍被族诛。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
