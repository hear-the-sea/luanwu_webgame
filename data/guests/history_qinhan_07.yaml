  - key: hist_qinhan_0329
    name: 刘縯
    default_gender: male
    archetype: military
    flavor: （生年不详—23年）新莽末年起兵的汉室宗亲，刘秀之兄。史载其早有大志，聚众起事并在关键战役中发挥作用，后因更始政权内部猜忌而被杀。刘縯的悲剧把起义联盟的内在不稳定写得极清楚：共同敌人强大时，联盟可以靠共同目标维系；一旦局势转向、权力开始分配，内部矛盾便会迅速上升，功劳反而可能变成威胁。刘縯既是军事动员者，也是政治竞争者，他的存在会让领导层不安；而在缺乏稳定机制的政权里，“不安”往往会被直接处理成清算。刘縯之死说明，光武中兴之前的混乱并非只有外敌，还有同阵营之间围绕合法性与控制权的残酷争夺。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0345
    name: 邓绥
    default_gender: female
    archetype: civil
    flavor: （81年—121年）东汉皇太后，和帝崩后临朝摄政，是东汉中期少见的强势女性统治者之一。史书记其任用能臣、减轻赋役、整饬吏治，使政治一度趋于稳定，这些举措体现她对“可持续治理”的理解：幼主在位时最怕的不是没有新政，而是秩序失控、财赋崩坏与官吏腐败同时发作。邓绥的难处也在于外戚身份带来的结构风险——太后掌权能提供权力中心与行政连续性，也会引发朝臣对家族坐大的长期担忧。邓绥的政治评价之所以相对正面，很大程度在于她能把个人与家族的利益压在制度需要之下，至少在一段时间里让东汉不至于被宫廷派系彻底撕碎。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0332
    name: 寇恂
    default_gender: male
    archetype: civil
    flavor: （生年不详—36年）东汉开国名臣，兼具将略与吏治能力。光武中兴的难处不在“打赢一仗”，而在于战后如何让郡县重新运转：赋税、徭役、治安、粮运都要有人收拾。寇恂的名声便建立在这种“把地方盘活”的工作上——既能在军事压力下守住要害，又能安抚百姓、整饬吏治，使前线与后方互相支撑。史书记他，多把笔墨落在守边、理政与处置人心上；从他的经历可见，东汉的统一并非只靠战功，更靠一批能把秩序落到细处的官员。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0333
    name: 贾复
    default_gender: male
    archetype: military
    flavor: （生年不详—55年）东汉开国将领。随刘秀征战，屡立战功，后受封。贾复的价值在于他代表光武统一战争中的“主力将领层”：统一不是一蹴而就的决战，而是多线作战、反复攻守与长期整合。对这样的将领而言，战功不仅体现在冲锋，还体现在能否守住新占地区、安抚民众、稳定军心，让战线不断向前而不在后方塌陷。贾复等人的存在提醒我们，开国战争的胜利靠的是系统协作：前线能打，后方能供，地方能接管；任何一环断裂，战果就会迅速被抵消。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0337
    name: 祭遵
    default_gender: male
    archetype: military
    flavor: （生年不详—33年）东汉将领，以敢断与守纪闻名，事迹见于光武统一战争与战后整饬。对开国政权而言，最难的不只是击败敌人，还要让新占地区愿意服从；祭遵治军严整，不许扰民自取，能把乱军治成可用之兵。其早卒如一阵短促的疾风，却在新朝最需要立规矩时留下了清晰的刀痕。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
