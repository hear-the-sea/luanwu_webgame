heroes:
  purple:
  - key: hist_suitang_0176_sudingfang
    name: 苏定方
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （592年—667年）唐代将领，名烈，字定方，冀州武邑人。早年随李靖击破东突厥，曾率部夜袭阴山。显庆年间，他先后率军击灭西突厥、擒获阿史那贺鲁，又渡海攻灭百济、俘其国王义慈。官至左骁卫大将军，封邢国公。其用兵长于奔袭，为唐朝经略西域与东北的重要将领。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 38
      intellect: 20
      defense: 32
      agility: 10
  blue:
  - key: hist_suitang_0135_lijifu
    name: 李吉甫
    avatar: pig/文050.png
    default_gender: male
    archetype: civil
    flavor: （758年—814年）唐代宰相、地理学家，字弘宪，赵郡人。宪宗元和年间两度拜相，支持削平西川刘辟、镇海李锜等藩镇，并奏请裁减冗官、整顿吏治。他主持编成《元和郡县图志》，按道州记述沿革、山川与户口，是现存较早的全国地理总志。其学通今古，为政务实，元和九年卒于相位，谥忠懿（一作忠）。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 50
      defense: 24
      agility: 12
  - key: hist_suitang_0136_peixiu
    name: 裴休
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （791年—864年）唐代宰相、书法家，字公美，河内济源人。长庆年间进士，大中年间拜相，曾主持整顿漕运与茶税，居相位五年，以持重称。他笃信佛教，与黄檗希运往来密切，为《传心法要》作序；书法尤精楷体。晚年出任荆南节度使，以老病致仕。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 50
      defense: 24
      agility: 14
  - key: hist_suitang_0137_lizongmin
    name: 李宗闵
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （？—847年）唐代宰相，字损之，宗室出身，贞元末年进士及第。历仕宪宗至宣宗诸朝，曾任中书舍人、吏部侍郎，大和年间拜相。他与李德裕积怨甚深，是牛李党争中牛党的核心人物，数度入相又屡遭贬斥。晚年被贬于封州，卒于贬所。其才思敏捷，然党争之中几度沉浮，后世评价多有争议。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 24
      agility: 14
  - key: hist_suitang_0138_linghuchu
    name: 令狐楚
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （766年—837年）唐代大臣、文学家，字壳士，宜州华原人。贞元年间进士，历任翰林学士、中书舍人等职，元和末年一度拜相。他以骈文著称，章奏制诰典雅工整，李商隐早年曾入其幕府并受提携。后历镇宣武、天平、山南西道，卒于兴元任所，谥文。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 24
      agility: 14
  - key: hist_suitang_0139_linghutao
    name: 令狐绹
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （798年—872年）唐代宰相，字子直，令狐楚之子，太和年间进士。宣宗时由翰林学士、中书舍人累迁至同平章事，居相位近十年，处事谨慎，颇得宣宗信任。后出镇淮南、凤翔，卒于任所。他与诗人李商隐有旧交，李商隐曾数次投诗干谒而未获援引。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 24
      agility: 14
  - key: hist_suitang_0140_baiminzhong
    name: 白敏中
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （？—870年）唐代宰相，字用晦，白居易从弟。长庆年间进士，会昌末年至大中年间拜相，为宣宗朝重臣，居相位数年。后出镇邠宁、凤翔、荆南等地，晚年以病辞官。咸通十一年去世。其为政谨守成规，仕途与牛李党争相始终。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 46
      defense: 24
      agility: 16
  - key: hist_suitang_0150_lichun
    name: 李春
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）隋代匠师，相传主持设计建造赵州桥（安济桥）。该桥为单孔敞肩石拱桥，横跨洨河，以肩部小拱减轻桥身重量、宣泄洪水，历经千余年仍存。其生平事迹记载极少，姓名主要因后世桥铭而流传。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 50
      defense: 24
      agility: 14
  - key: hist_suitang_0142_choushiliang
    name: 仇士良
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: （？—843年）唐代宦官，循州兴宁人，历侍顺宗至武宗数朝。曾任神策军中尉，长期掌握禁军。大和九年甘露之变中，他率禁军反击，诛杀宰相王涯等朝臣，自此专擅朝政，文宗受制于其手；武宗即位后渐加裁抑，他被迫致仕，退居家中不久病死。其专权主要在大和至会昌初年。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 18
      intellect: 44
      defense: 24
      agility: 14
  - key: hist_suitang_0143_tianlingzi
    name: 田令孜
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: （？—893年）唐代宦官，蜀人，本姓陈，后冒姓田。僖宗时任神策军中尉，专擅朝政，僖宗呼之为“阿父”。广明元年黄巢攻陷长安，他随僖宗逃往成都。后出任西川监军，与西川节度使王建交恶，兵败被擒，景福二年被杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 18
      intellect: 44
      defense: 24
      agility: 14
  - key: hist_suitang_0144_wangji
    name: 王绩
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （590年—644年）隋唐之际诗人，字无功，号东皋子，绛州龙门人，王通之弟。隋末曾任六合丞，唐初待诏门下省，后任太乐丞，因不耐官场拘束、嗜酒而辞官归隐。其诗多写田园山水，语言朴素自然，《野望》为传世名作。他自撰墓志，卒于家中。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 52
      defense: 20
      agility: 18
  - key: hist_suitang_0145_dushenyan
    name: 杜审言
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: （645年—708年）唐代诗人，字必简，襄州襄阳人，杜甫祖父。咸亨年间进士，历任隰城尉、洛阳丞。神龙初年因依附张易之兄弟被流放峰州，后召回任国子监主簿、修文馆直学士。他与李峤、崔融、苏味道并称“文章四友”，近体诗格律严整，对杜甫家学影响颇深。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 50
      defense: 22
      agility: 16
  - key: hist_suitang_0146_songzhiwen
    name: 宋之问
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （656年—712年）唐代诗人，字延清，汾州人。上元年间进士，历任尚方监丞、左奉宸内供奉等职。他与沈佺期并称“沈宋”，对律诗的定型多有推动。宋之问先后依附张易之兄弟与武三思，中宗、睿宗之际屡遭贬谪，先天年间被赐死于桂州。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 50
      defense: 22
      agility: 16
  - key: hist_suitang_0175_houjunji
    name: 侯君集
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
    flavor: （？—643年）唐初将领，豳州三水人。早年随李世民征战，参与玄武门之变，贞观年间官至兵部尚书。他曾随李靖击灭东突厥，后又率军攻灭高昌，然因私取战利、纵兵掠民而下狱。侯君集由此心怀怨望，贞观十七年参与太子李承乾谋反，事泄被杀，功臣名位亦被削除。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 22
      defense: 32
      agility: 8
  - key: hist_suitang_0177_liurengui
    name: 刘仁轨
    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: （601年—685年）唐代将领、大臣，字正则，汴州尉氏人。龙朔三年，他在白江口之战中率唐军与新罗联军大败倭国与百济联军，焚其战船，稳定了唐朝在朝鲜半岛的局势。后入朝任宰相，封乐城县公。刘仁轨历仕高宗、武则天两朝，以老成持重见称，卒年八十五。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 22
      defense: 32
      agility: 10
  - key: hist_suitang_0179_lidaozong
    name: 李道宗
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: （600年—653年）唐宗室将领，字承范，唐高祖堂侄。武德年间参与平定刘武周，贞观年间从征吐谷浑、高句丽，以战功封江夏郡王。他曾奉命护送文成公主入吐蕃和亲，后因房遗爱谋反案受牵连，流放象州，途中病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 20
      defense: 32
      agility: 12
  - key: hist_suitang_0151_zhangxutuo
    name: 张须陀
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （565年—616年）隋代将领，弘农阌乡人。曾任齐郡丞、河南道讨捕大使，先后击败卢明月、孙宣雅等起兵势力，是隋末镇压民变的重要将领。大业十二年，他在荥阳与瓦岗军交战，中李密埋伏而兵败，力战阵亡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 18
      defense: 32
      agility: 14
  - key: hist_suitang_0154_peiju
    name: 裴矩
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: （547年—627年）隋唐之际大臣、地理学家，字弘大，河东闻喜人。隋炀帝时他主持与西域诸国的往来，招徕商旅，并据见闻撰成《西域图记》，记述丝路沿途山川与风俗。隋亡后一度辗转于宇文化及、窦建德，归唐后任民部尚书、太常卿，封安邑县公，卒谥敬。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 26
      agility: 12
  - key: hist_suitang_0158_doujiande
    name: 窦建德
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （573年—621年）隋末河北起义军首领，贝州漳南人。大业年间起兵，据河北称长乐王，后建夏政权，任用士人、劝课农桑，在乱世中颇得民心。武德四年，他率军救援洛阳的王世充，在虎牢关被李世民击败俘获，押至长安后处死，夏政权随之瓦解。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 34
      intellect: 24
      defense: 30
      agility: 12
  - key: hist_suitang_0170_lijiancheng
    name: 李建成
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （589年—626年）唐高祖长子，隋末随父在太原起兵，攻取长安后被立为太子。武德年间他常留守长安，主持政务，并参与平定刘黑闼等战事。随着秦王李世民功业日盛，兄弟围绕储位矛盾激化，武德九年玄武门之变中，李建成与李元吉一同被杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 34
      intellect: 24
      defense: 28
      agility: 14
  - key: hist_suitang_0149_yuwenkai
    name: 宇文恺
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （555年—612年）隋代建筑家，字安乐，朔方夏州人。开皇年间他奉命规划大兴城，将宫城、皇城与里坊分区布置；大业初年又主持营建东都洛阳，并参与仁寿宫、显仁宫等工程。官至工部尚书，以精于工程制度著称。大业八年卒。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 50
      defense: 24
      agility: 14
  - key: hist_suitang_0152_laihuer
    name: 来护儿
    avatar: monkey_wu_male7.png
    default_gender: male
    archetype: military
    flavor: （约550年—618年）隋代将领，字崇善，江都人。历任右骁卫大将军、涿郡留守，隋炀帝三征高句丽时多次率水军渡海进攻，为东路主力。大业十四年江都兵变，宇文化及等弑杀隋炀帝，来护儿率部抵抗，兵败后被杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 18
      defense: 32
      agility: 14
  - key: hist_suitang_0160_yuwenhuaji
    name: 宇文化及
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: （？—619年）隋末将领，宇文述之子。大业十四年，他在江都发动兵变，弑杀隋炀帝，拥立秦王杨浩为帝，自掌大权。随后率军北上，在魏县称许帝。武德二年，窦建德攻破其军，宇文化及被擒杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 32
      intellect: 20
      defense: 30
      agility: 18
  - key: hist_suitang_0161_dufuwei
    name: 杜伏威
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （598年—624年）隋末江淮起义军首领，齐州章丘人。与辅公祏一同起兵，转战淮南，后归附唐朝，受封吴王，赐姓李氏。入朝后官至太子太保，然辅公祏起兵反唐，他因此在长安受到猜疑，武德七年去世。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 34
      intellect: 22
      defense: 30
      agility: 14
  - key: hist_suitang_0162_zhairang
    name: 翟让
    avatar: monkey/任务/翟让.png
    default_gender: male
    archetype: military
    flavor: （？—617年）瓦岗军创建者之一，东郡韦城人，曾任东郡法曹。隋末他率众起兵，据瓦岗寨，聚集饥民，成为中原反隋的重要力量。李密投奔后，翟让主动让出首领之位。大业十三年，他在宴席上被李密部将杀害，瓦岗军由此由李密独掌。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 18
      defense: 28
      agility: 18
  - key: hist_suitang_0163_luoshixin
    name: 罗士信
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: （约600年—622年）隋末唐初将领，齐州历城人。十四岁即随张须陀从军，以骁勇闻名；张须陀阵亡后先后归附王世充、唐朝。归唐后随李世民征讨刘黑闼，奉命守洺水城，城破被俘，拒绝投降而遇害，年仅二十余岁。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 12
      defense: 32
      agility: 16
  - key: hist_suitang_0164_shanxiongxin
    name: 单雄信
    avatar: monkey/任务/单雄信.png
    default_gender: male
    archetype: military
    flavor: （？—621年）隋末将领，曹州济阴人。早年与徐世勣一同参加瓦岗军，以骁勇著称；瓦岗失败后转投王世充，任郑国大将军。武德四年虎牢关之战后，他被唐军俘获，旧友徐世勣为其求情未果，终因拒绝归降而被处死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 16
      defense: 30
      agility: 16
  - key: hist_suitang_0166_liheita
    name: 刘黑闼
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （？—623年）隋末唐初河北武装首领，窦建德旧部。窦建德被唐处死后，他在河北起兵，联结突厥，自称汉东王，一度收复窦建德旧地。武德年间先后与李世民、李建成交战，战事反复。武德六年兵败逃亡，被部下擒送唐军后处死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 20
      defense: 28
      agility: 16
  - key: hist_suitang_0167_xiaoxian
    name: 萧铣
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: （583年—621年）隋末割据荆楚的首领，梁宣帝曾孙。隋末他在江陵起兵，称梁王，后即帝位，据有长江中游。武德四年，唐军李孝恭、李靖率军顺江而下攻破江陵，萧铣以城中兵少、不愿百姓遭难而开城投降，被押往长安处死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 30
      intellect: 24
      defense: 30
      agility: 16
  - key: hist_suitang_0168_liuwuzhou
    name: 刘武周
    avatar: pig/武049.png
    default_gender: male
