heroes:
  purple:
  - key: hist_suitang_0157_limi
    name: 李密
    default_gender: male
    archetype: military
    flavor: （582年-619年）隋末起义领袖，出身世族而能与草莽结盟，终成为瓦岗军核心。其以夺取洛口仓、控制粮道壮大声势，一度被视为问鼎中原的强力竞争者。但他在内部整合与对外联盟上多有失策，与翟让矛盾激化并引发猜忌；对王世充作战失利后选择归唐，旋又卷入旧部与新朝之间的危险地带，终在途中遇袭而亡。李密的兴亡像一条曲折线：才智足以成势，却难以建立稳定的权威与信任。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 34
      intellect: 26
      defense: 28
      agility: 12
  - key: hist_suitang_0159_wangshichong
    name: 王世充
    default_gender: male
    archetype: military
    flavor: （？-621年）隋末军政人物，凭禁军与官僚体系控制洛阳，后逼立皇帝并自称郑帝。其擅长权谋与城市防守，能在群雄并起的夹缝中把握中枢资源，却也因猜忌与苛刻失去人心。与瓦岗、窦夏互相牵制之际，唐军以虎牢关决战击破其战略支点，王世充遂降而被处置。其失败不在一时勇怯，而在政权过度依赖军事与恐惧，缺乏能持久凝聚的合法性与秩序。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 32
      intellect: 28
      defense: 28
      agility: 12
  - key: hist_suitang_0141_wangxianzhi
    name: 王仙芝
    default_gender: male
    archetype: military
    flavor: （? - 878年）晚唐农民起义首领之一，起事于民生困顿与赋役失衡的背景之下。与黄巢同处一个大动荡浪潮，但两者并非始终同一行动体：王仙芝早期起兵的路线、招抚与战败过程，反映地方社会从抗税、流民到武装叛乱的逐级升级。史书记其屡战屡走，显示起义军往往依赖机动与民间支持，而一旦补给与联盟断裂，便容易被分割围剿。王仙芝这段经历提示：黄巢之乱并非突然而至，它前面有一连串地方危机的"预演"；而每一次被压下去的火苗，都会为更大的爆燃积蓄燃料。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 36
      intellect: 18
      defense: 28
      agility: 18
