  - key: hist_qinhan_0254
    name: 田横
    default_gender: male
    archetype: military
    flavor: （生年不详—前202年）秦末齐地重要人物，田氏宗族领袖之一。楚汉胜负已定后，田横仍坚持不降，史载其自刎以全节，部下亦多殉死。田横之所以被后世反复讲述，不在他掌过多少城池，而在他把“名节”当成最后的政治资源：当现实已无转圜，他选择用死亡保住齐地旧贵族的尊严叙事。这样的选择未必能改变局势，却能改变记忆——胜利者夺天下，失败者争名分。田横故事里那种沉重的坚持，折射出秦汉之际旧秩序崩解时，人们如何用忠义语言为自身定位、为群体留下一点可被追忆的体面。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0261
    name: 龙且
    default_gender: male
    archetype: military
    flavor: （生年不详—前203年）楚军名将。楚汉相争中统兵东进，与韩信在潍水对战而败亡。龙且在史书中以骁勇著称，其败亡也提示楚军并非没有能战之将，而是在战略判断与战场信息上逐渐落入下风：韩信善用地形与工程手段，把水势与阵势合为陷阱，使勇猛难以抵消不利局面。龙且战死之后，楚军士气与东线形势受到冲击，这场失败因此不仅是一名将领的倒下，也是楚汉战争天平继续倾斜的一记重锤。勇力有时敌不过筹划与组织，龙且的败局正是如此。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0262
    name: 钟离昧
    default_gender: male
    archetype: military
    flavor: （生年不详—前201年）楚军名将。项羽败亡后，钟离昧投奔韩信，终因刘邦猜忌而走到绝境，死于楚汉余波。战场上的功名没有替他换来新秩序的容身处，反而让他成为权力重新划线时的一根刺。战争结束并不等于安稳开始，钟离昧的归宿正写着这层冷意。
    growth_range:
