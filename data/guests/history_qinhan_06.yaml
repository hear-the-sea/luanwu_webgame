  - key: hist_qinhan_0267
    name: 灌婴
    default_gender: male
    archetype: military
    flavor: （生年不详—前176年）西汉开国将领。楚汉战争中他多次统军立功；吕后去世、诸吕掌兵之际，灌婴与群臣迎立文帝，使政变收束在可控范围内。能在关键时刻以兵权压住局面，也能在胜利后接受重新分配，正是开国将领难得的战后克制。
    growth_range:
