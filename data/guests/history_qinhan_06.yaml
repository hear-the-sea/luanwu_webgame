heroes:
  blue:
  - key: hist_qinhan_0254
    name: 田横
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前202年）秦末齐地田氏宗族领袖，田荣之弟。田荣死后，他收拢齐军，立田广为齐王而自任国相；韩信破齐后，田横自立为齐王，兵败投奔彭越。汉朝建立后，他率五百余人入海岛，应召赴洛阳途中自刎，部众闻讯亦相继死难。田横以气节著称，其事迹长期为后世所传述。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0261
    name: 龙且
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前203年）楚军名将，项羽麾下重要将领。龙且早年随项羽征战，曾与项声击破叛楚的英布；后来奉命率军救齐，在潍水与韩信对峙。韩信堵塞潍水上游，诱其半渡后放水冲击，楚军大败，龙且战死。他勇猛善战，此役轻敌冒进，使楚军失去齐地援军。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0262
    name: 钟离昧
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前201年）楚军名将，项羽麾下骨干。楚汉相争中，他屡次率军与汉军交战，刘邦曾用陈平之计离间项羽君臣。项羽败亡后，钟离昧投奔旧交韩信；刘邦下令追捕，韩信欲将其交出，钟离昧遂自刎，韩信持其首级向刘邦请罪。其结局可见汉初君臣猜忌之深。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0267
    name: 灌婴
    avatar: monkey_wu_male7.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前176年）西汉开国将领，睢阳人，早年以贩卖丝织品为业。秦末从刘邦起兵，后统领骑兵，在垓下追击项羽，所部参与斩杀项羽。汉初封颍阴侯，历任太尉、丞相；吕后去世后，他与周勃、陈平合谋诛除诸吕，迎立汉文帝。灌婴由商贩而至将相，是汉初军功集团的重要成员。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0280
    name: 刘贺
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前59年）西汉昌邑王，汉武帝之孙。汉昭帝去世无嗣，霍光迎立刘贺为帝；在位仅二十七日，霍光即以行为失当为由奏请太后将其废黜，另立宣帝。刘贺后被封为海昏侯，迁居豫章，死于封国。海昏侯墓出土大量器物，可见其生前生活与葬制之奢。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0282
    name: 王政君
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （前71年—13年）西汉元帝皇后，汉成帝生母，王莽的姑母。成帝即位后她以皇太后身份临朝，王氏子弟由此相继掌权；哀帝、平帝两朝，她以太皇太后之尊支持王莽辅政。王莽代汉时，她拒绝交出传国玉玺，怒掷于地，相传玉玺因此缺损一角，但终未能阻止新朝建立。她历元、成、哀、平四朝，晚年目睹王氏代汉。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0288
    name: 刘濞
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （前215年—前154年）西汉吴王，汉高祖之侄，封国在东南沿海。他利用封地铜矿与海盐之利，铸钱煮盐，招纳各地流亡人口，吴国因此富庶。汉景帝采纳晁错削藩之议后，刘濞联合楚、赵等六国起兵，以“清君侧”为名；吴楚联军被周亚夫击破，他逃往东越，最终被东越王所杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0293
    name: 汲黯
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前112年）西汉大臣，濮阳人，以直言敢谏著称。他崇尚黄老之学，任东海太守时政尚清静，不苛细务，郡中渐治；入朝任主爵都尉，屡次当面指出汉武帝与张汤的过失，不为权势所屈。后出任淮阳太守，在任十年去世。汲黯行事刚直，其名声在武帝朝颇为突出。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0264
    name: 纪信
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前204年）汉初将领，随刘邦起兵。楚汉相争时，刘邦被项羽围困于荥阳，粮道断绝；纪信假扮刘邦，乘汉王车驾出城诈降，吸引楚军注意，刘邦得以率数十骑从西门突围。项羽识破后将其处死。纪信以身代主，后世多以其为忠义之臣。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0269
    name: 王陵
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前181年）西汉开国功臣，沛县人，刘邦早年以兄礼相待。楚汉相争时，项羽劫持其母以招降王陵，其母为坚定其志而自尽。汉朝建立后，王陵任右丞相；吕后欲封诸吕为王，他以白马之盟“非刘氏而王，天下共击之”当面反对，被改任太傅，遂称病辞官，居家不出。其守盟之举为后世所称。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0279
    name: 孺子婴
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （5年—25年）西汉宗室，名刘婴，汉宣帝玄孙。汉平帝去世后无子，王莽立年幼的刘婴为皇太子，号孺子，自任摄政，称“假皇帝”；王莽代汉后，刘婴被废为定安公。更始年间，方望等人拥刘婴至临泾立为天子，不久更始军攻来，刘婴被杀。他一生为他人所立，始终未能亲政。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0285
    name: 班婕妤
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （生卒年不详）西汉成帝嫔妃，班况之女，以才学与德行著称。成帝曾邀她同乘一辇，她以“圣贤之君皆有名臣在侧”为由推辞，时人称贤。赵飞燕姐妹得宠后，她自请退居长信宫侍奉王太后，相传作《怨歌行》以寄托心境，此后不复参与后宫之争。后世多称其贤德。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0278
    name: 戚夫人
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （生年不详—前194年）汉高祖宠妃，生子赵王刘如意。刘邦晚年曾有意改立刘如意为太子，因大臣反对而作罢。戚夫人由此深为吕后所忌。刘邦死后，吕后先将她囚于永巷，剃发戴枷、罚作舂米，继而加以残害，戚夫人最终死于迫害。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0287
    name: 邓通
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉文帝宠臣，蜀郡南安人。他因善划船得文帝赏识，官至上大夫；文帝又赐其蜀地严道铜山，允许自行铸钱，邓氏钱一度流通天下。文帝去世后，景帝免其官职并追夺家产，邓通寄食于他人，最终穷困而死。其一生起落与文帝一朝的宠幸密切相关。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0292
    name: 韩安国
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前127年）西汉大臣，梁国成安人，早年因犯法入狱，获释后重新得到重用，“死灰复燃”的典故便出自他的故事。韩安国曾任御史大夫、将军，参与对匈奴的军事筹划，后来因行军迟缓被免职，病死于归途中。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0294
    name: 郅都
    avatar: pig/文050.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前148年）西汉官员，河东杨县人，以执法严酷著称。他任济南太守时，诛除当地豪强首恶，郡内秩序迅速安定；后迁中尉，行法不避权贵，宗室列侯见之侧目，时称“苍鹰”。临江王刘荣被审时，郅都禁止其上书自辩，刘荣自杀，窦太后由此衔恨，最终借故将其处死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0299
    name: 杜周
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前95年）西汉官员，南阳杜衍人，曾任张汤属官，后任廷尉。杜周执法多揣摩武帝意旨，皇帝想重办的便深究，想宽宥的便寻找理由释放；有人责其不依律法，他答“前主所是著为律，后主所是疏为令”。他任廷尉多年，后官至御史大夫，死于任上。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0253
    name: 田荣
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前205年）秦末齐地田氏宗族，田儋之弟。田儋战死后，他收拢残部，驱逐齐王田假，改立田巿，自任国相。项羽分封诸侯时未加封田荣，他遂起兵驱逐田都、攻杀田巿与田安，自立为齐王。项羽北上伐齐，田荣兵败，逃至平原后被当地人所杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0258
    name: 魏豹
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前204年）秦末魏王，魏王咎之弟。魏咎死后，魏豹借楚军之力收复魏地，被立为魏王；项羽分封时改封西魏王。此后他先归附刘邦，彭城之战后又转而附楚；韩信攻魏，将其俘获，送至荥阳。刘邦命他同守荥阳，守将周苛以其反复难信，将其处死。魏豹多次易主，最终未能保全自身。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0266
    name: 雍齿
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前189年）汉初将领，沛县人，与刘邦同乡。秦末他随刘邦起兵，奉命守丰邑，却接受魏将周市招诱而叛汉，使刘邦久攻丰邑不下。此后雍齿复归刘邦，随军征战有功。汉朝建立后，诸将因争功而心有不安，张良建议刘邦先封雍齿为什方侯，以示不念旧怨，众心遂定。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0276
    name: 刘肥
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前189年）西汉齐王，刘邦庶长子，封有七十余城。惠帝即位后，刘肥入朝，惠帝以家人之礼让他上座，吕后见状不悦，命人进酒；刘肥察觉有异，遂听从内史建议，献城阳郡为鲁元公主汤沐邑，才得以脱身返回齐国。他以此保全身家，其后齐国仍为汉初大藩。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0296
    name: 义纵
    avatar: pig/武076.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前117年）西汉酷吏，河东人，因姐姐义姁得太后宠信而入仕。他任河内都尉时打击豪强，境内治安肃然；后迁定襄太守，大规模拘捕狱囚及探视者，一日处决甚众，郡中震恐。武帝推行告缗令时，义纵认为此举扰民，拘留使者，被指阻挠诏令，最终获罪被杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0297
    name: 王温舒
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前104年）西汉酷吏，阳陵人，曾任广平都尉、河内太守。他办案喜用严刑与连坐，任河内太守时拘捕郡中豪强及其党羽，株连甚广，以此树立威名；后又奉命治理长安一带的盗贼。晚年因贪贿枉法及滥杀被追究，事发后自杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0252
    name: 田儋
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前208年）秦末齐地起义领袖，狄县人，出身田氏宗族。陈胜起兵后，他杀死狄县县令，收编当地兵众，自立为齐王，并逐步平定齐地。秦将章邯围攻魏王咎于临济，田儋率军救援，在临济城下被章邯击败杀死。他死后齐地复乱，田荣收拢其残部继续割据。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0255
    name: 臧荼
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前202年）秦末汉初将领，原为燕王韩广部将。项羽分封诸侯时，臧荼被封为燕王，韩广则被徙为辽东王；臧荼随后攻杀韩广，兼并辽东之地。汉高祖即位后，臧荼起兵反汉，刘邦亲自率军征讨，将其击败俘杀，改立卢绾为燕王。其反叛使燕地统治权转归汉廷亲信。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  green:
  - key: hist_qinhan_0250
    name: 武臣
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: 武臣（生卒年不详—前208年），陈胜部将，受命与张耳、陈余北略赵地。他进入邯郸后自立为赵王，以张耳为相、陈余为将；陈胜命其西入关时，他听从张耳、陈余之劝，转而北略燕、代，扩张自己的地盘。后部将李良受秦方诱降，回军袭邯郸，武臣被杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0251
    name: 赵歇
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: 赵歇（生卒年不详），战国赵国王室后裔。陈胜起义后，张耳、陈余立其为赵王，都信都；巨鹿之战中他被秦将王离围困，赖项羽救赵解围。项羽分封时改封其为代王，陈余又迎其复为赵王。韩信破赵后，赵歇被俘，不久遇害。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0256
    name: 韩成
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: 韩成（生卒年不详—前206年），战国韩国宗室。项梁立其为韩王，以张良为辅，但韩国故地多被秦军占据，韩成与张良往来游击，未能稳固据有韩地。项羽分封诸侯时，以其无军功、又亲近刘邦，不许就国，将其降为侯，随后在彭城杀之。
    growth_range:
