    flavor: 尹齐（生卒年不详），东郡茌平人，西汉酷吏。初以刀笔吏迁至御史，事张汤，受其举荐，督察盗贼，斩伐不避贵戚，历任关内都尉、中尉等职，声名一度超过宁成。他为人木强少文，任中尉时豪恶之吏藏匿，政事多有废弛，后复为淮阳都尉，病死任上，家产不足五十金。
