# 基础门客模板

heroes:
  black:
  - key: base_black_military
    name: 布衣百姓
    archetype: military
    flavor: 田垄间讨生活的庄稼人。蓑衣沾雨，草鞋带泥，识得节气水土，也练出一副耐劳筋骨。江湖风波原本隔着几重山水，奈何乱世从不绕过柴门。为护一方炊烟，拿起锄柄守过夜，也跟着乡勇巡过路；如今投身庄园，所求不过一碗安稳饭，却肯为这碗饭守到天亮。
    default_gender: unknown
    default_morality: 60
    avatar: buyi.png
    growth_range:
    - 1
    - 3
    attribute_weights:
      force: 45
      intellect: 15
      defense: 25
      agility: 15
  - key: base_black_military_2
    name: 布衣百姓
    archetype: military
    flavor: 市井里的一介寻常百姓。生在长街，长在巷尾，卖过杂货，也替人跑过腿。武艺平平，却有一双识人的眼和一张会转圜的嘴；哪条巷子能抄近路，哪家铺子肯赊半斗米，心里都有一本账。遇事从不逞英雄，真到危急时却肯为相熟之人挡一回风雨，这份不声张的情分，比漂亮话更靠得住。
    default_gender: unknown
    default_morality: 60
    avatar: buyi.png
    growth_range:
    - 1
    - 3
    attribute_weights:
      force: 45
      intellect: 15
      defense: 25
      agility: 15
  - key: base_black_military_3
    name: 布衣百姓
    archetype: military
    flavor: 偏僻山村里的守村乡民。春耕秋收之外，也曾在山匪来犯的夜里敲响铜锣，提着柴刀守住村口。没有名师传艺，几招把式全从猎户与老兵手中学来，粗浅却实用。踏入江湖并非为了扬名，只因身后尚有故土值得惦念；每逢险境，反而比平日更沉得住气。
    default_gender: unknown
    default_morality: 60
    avatar: buyi.png
    growth_range:
    - 1
    - 3
    attribute_weights:
      force: 45
      intellect: 15
      defense: 25
      agility: 15
  - key: base_black_military_4
    name: 布衣百姓
    archetype: civil
    flavor: 走街串巷谋生的手艺人。幼时便随长辈学得一门手艺，也练出察言观色的本领。一方木案、几件旧器，到了手里总能料理得妥帖；酒肆茶棚里的只言片语，也能听出几分真消息。虽不通高深经史，却懂人情冷暖与买卖进退，在账房和市集之间自有一套生存章法。
    default_gender: unknown
    default_morality: 60
    avatar: buyi.png
    growth_range:
    - 1
    - 3
    attribute_weights:
      force: 15
      intellect: 45
      defense: 20
      agility: 20
  - key: base_black_military_5
    name: 布衣百姓
    archetype: military
    flavor: 兵火中失去故乡的流民。一场战乱烧断归路，背着半旧行囊辗转多地，替镖队赶过车，也在荒寺守过夜。一路吃尽风霜，练出的不是高明武艺，而是逢险不乱、见苦能熬的性子。如今终于寻得落脚之处，平日虽沉默寡言，受人一分善意却会牢牢记住；若庄园有难，也肯把这里当作故乡守住。
    default_gender: unknown
    default_morality: 60

    avatar: buyi.png
    growth_range:
    - 1
    - 3
    attribute_weights:
      force: 45
      intellect: 15
      defense: 25
      agility: 15
  gray:
  - key: base_gray_civil
    name: 灰阶谋士
    archetype: civil
    flavor: 未入仕途的寒门读书人。寒窗十载，墨痕满袖，白日替人抄书糊口，夜里借一盏残灯研读经史兵策。无人指点，便以旧卷为师；不曾身入庙堂，便在茶楼一角听商旅谈南北风声，从过客言语中辨江湖得失。听得多了，纸上谋略便也沾了人间烟火。寡言慎行，遇事先观后断；纵无惊世奇谋，也能在纷乱中觅得一线转机。
    default_gender: unknown
    default_morality: 65
    growth_range:
    - 2
    - 5
    attribute_weights:
      force: 15
      intellect: 45
      defense: 20
      agility: 20
  - key: base_gray_military
    name: 灰阶兵长
    archetype: military
    flavor: 半是书生、半是游侠的江湖行客。带着一柄旧剑、一卷残书，走过不少驿路。本有求取功名之志，却在途中卷入一场不平事，自此半只脚踏进江湖。剑法不以凌厉见长，胜在眼稳手准；护院、押镖、探路皆曾做过。平日仍有读书人的克制，临敌时却绝不犹疑，是个能守规矩、也敢在规矩之外救人的行路客。
    default_gender: unknown
    default_morality: 50
    growth_range:
    - 2
    - 5
    attribute_weights:
      force: 45
      intellect: 15
      defense: 25
      agility: 15
  red:
  - key: base_red_military
    name: 占位
    archetype: military
    flavor: 身经百战的基层军官，久历沙场，熟悉各类阵势与敌军习性。做事干脆果断，不尚空谈，常以身先士卒树立威信。虽非名将，却擅长在混战中稳定队形、维持补给与传令链路，是战线里最容易被忽视却最难替代的骨干，往往决定一场硬仗能否扛到最后。
    default_gender: unknown
    default_morality: 50
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 45
      intellect: 15
      defense: 25
      agility: 15
