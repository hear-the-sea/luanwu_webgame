    name: 耶律休哥
    default_gender: male
    archetype: military
    flavor: （？—998年）辽朝将领，字逊宁。耶律休哥在高梁河之战中与耶律斜轸合击宋军，击败宋太宗；后来他任南京留守，负责辽国南面边防，死后追封宋王。
