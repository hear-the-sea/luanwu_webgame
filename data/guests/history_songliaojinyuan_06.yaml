    name: 耶律德光
    default_gender: male
    archetype: military
    flavor: （902年-947年）辽太宗，辽朝第二位皇帝。他灭后晋，建立大辽国号，推动契丹汉化。他在中原称帝，虽然统治短暂，却开创了北方民族入主中原的先例。耶律德光所作决断并非孤立行为，而是内政派系与外部形势共同作用的产物。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
