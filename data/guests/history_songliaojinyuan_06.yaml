heroes:
  blue:
  - key: hist_songliaojinyuan_0273
    name: 耶律德光
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （902年-947年）辽太宗，辽朝第二位皇帝。他灭后晋，建立大辽国号，推动契丹汉化。他在中原称帝，虽然统治短暂，却开创了北方民族入主中原的先例。耶律德光所作决断并非孤立行为，而是内政派系与外部形势共同作用的产物。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0274
    name: 耶律休哥
    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: （？—998年）辽朝宗室将领，字逊宁。太平兴国四年，耶律休哥与耶律斜轸在高梁河合击宋军，宋太宗败走；雍熙三年宋军北伐，他率军救援燕京，在岐沟关大败曹彬部；后任南京留守，总领南面边防，统和十六年病逝，追封宋王。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0275
    name: 耶律隆绪
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （972年—1031年）辽圣宗，名耶律隆绪，辽景宗长子，乾亨四年即位，年幼由母萧太后摄政。统和年间改国号为大契丹，亲政后重用汉臣、整顿部族与赋税，并多次南下与宋交战，最终订立澶渊之盟；太平十一年病逝，在位四十九年。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0280
    name: 韩德让
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: （941年—1011年）辽代大臣，汉人，字致尧，后赐名耶律隆运，蓟州玉田人。韩德让深受萧太后信任，辅佐辽圣宗，任南院枢密使、大丞相，总揽汉地军政，参与对宋作战与澶渊和议；他位兼将相，卒后葬于乾陵附近。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0259
    name: 曾几
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: 曾几（1084—1166），字吉甫，号茶山，祖籍赣州，徙居河南，南宋诗人。早年入仕，因力主抗金触怒秦桧，罢官后隐居上饶茶山；秦桧死后复起，官至敷文阁待制，卒谥文清。陆游曾从其学诗，他论诗重句法锻炼，风格清淡自然，著有《茶山集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0260
    name: 朱敦儒
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: 朱敦儒（1081—1159），字希真，号岩壑，洛阳人，两宋之交词人。早年在洛阳隐居，屡辞征召，词风清旷疏放；靖康之变后南渡，亲历乱离，笔下转为慷慨悲凉。绍兴初被召入朝，赐进士出身；后因秦桧延其教子，出任鸿胪少卿，为时论所讥。著有《樵歌》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0261
    name: 张元干
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: 张元干（1091—约1161），字仲宗，号芦川居士，福州永福人，两宋之交词人。靖康元年金军围汴京，他入李纲幕府，参与守城；南渡后作《贺新郎》寄李纲、送胡铨，词中痛斥和议，触怒秦桧，被削籍下狱。其词早年清丽，后转为慷慨悲凉，著有《芦川词》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0262
    name: 朱淑真
    avatar: monkey/其他随机角色/文064_女.png
    default_gender: female
    archetype: civil
    flavor: 朱淑真，号幽栖居士，宋代女诗人、词人，相传为钱塘人，出身仕宦之家，自幼聪慧，工诗词而通音律。其生卒年及婚姻旧说纷纭，一般以为所适非偶，相传因情志不遂抑郁而终。传世有《断肠诗集》《断肠词》，多写闺情、春愁与身世之感，笔致婉丽，后世论闺秀词人每以她与李清照并举。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0263
    name: 严羽
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: 严羽，字仪卿，一字丹丘，号沧浪逋客，邵武人，南宋诗论家、诗人，生卒年不详。所著《沧浪诗话》分诗辨、诗体、诗法、诗评、考证五门，以禅喻诗，标举妙悟、兴趣，主张师法盛唐，反对以才学、议论为诗；明代格调派论诗多本其说。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0264
    name: 戴复古
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: 戴复古（1167—约1248），字式之，号石屏，台州黄岩人，南宋江湖诗派代表。他少承家学，后从陆游学诗，一生布衣，负书游历江湖数十年，足迹遍及东南；晚年归乡隐居。其诗多写民生疾苦与战乱残破，《淮村兵后》即为传诵之作，著有《石屏集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0265
    name: 刘辰翁
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 刘辰翁（1232—1297），字会孟，号须溪，吉州庐陵人，南宋末诗人、词人。景定三年进士，宋末曾任书院山长；宋亡后隐居不仕，词承辛弃疾一派，多寄托亡国之痛。又长于评点，曾评《世说新语》等书，著有《须溪集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0266
    name: 方岳
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: 方岳（1199—1262），字巨山，号秋崖，徽州祁门人，南宋诗人、词人。绍定五年进士，历任南康军教授及州郡官职，因性格刚直、屡忤权贵而仕途坎坷，多次罢黜。其诗学杨万里，不事雕琢，多写山水田园与民生疾苦，亦工词，著有《秋崖集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0267
    name: 叶梦得
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: 叶梦得（1077—1148），字少蕴，号石林，苏州吴县人，两宋之际政治家、学者、词人。绍圣四年进士，历仕哲宗、徽宗、钦宗、高宗四朝，南渡后任江东安抚大使、知建康府，主持江防。晚年退居湖州卞山，以藏书、著述自娱；其词早年婉丽，南渡后转向简淡，著有《石林词》《石林诗话》《石林燕语》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0268
    name: 刘一止
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 刘一止（1079—1160），字行简，湖州归安人，南宋初文学家、官员。宣和三年进士，历任州县与馆阁之职，官至敷文阁直学士，以议论刚直见称。其词清丽婉约，晨行之作《喜迁莺·晓行》描摹旅次景色，传诵一时，人称“刘晓行”；诗文亦温雅有法，著有《苕溪集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0269
    name: 汪元量
    avatar: monkey/其他随机角色/文039_男.png
    default_gender: male
    archetype: civil
    flavor: 汪元量（约1241—约1317），字大有，号水云，钱塘人，南宋末宫廷琴师、诗人。宋亡后随三宫北迁大都，曾到狱中探望文天祥并以诗唱和；后自请为道士南归。其诗多记临安陷落与遗民生活，有《湖山类稿》《水云集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0270
    name: 林景熙
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 林景熙（1242—1310），字德旸，号霁山，温州平阳人，南宋遗民诗人。咸淳七年进士，曾任泉州教授；宋亡后隐居不仕，与谢翱、唐珏等遗民交游，相传曾参与收葬宋六陵遗骨。其诗文多寄故国之思，著有《霁山集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0271
    name: 郑思肖
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: 郑思肖（1241—1318），字忆翁，号所南，连江人，南宋遗民诗人、画家。宋亡后改名“思肖”以寓思赵，隐居苏州，坐卧必南向，以示不忘故国；擅画墨兰而不画土根，人问则称“地为番人夺去”。其诗多寄故国之思，《寒菊》传诵，著有《心史》，明末自井中出土。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0272
    name: 高翥
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: 高翥（1170—1241），初名公弼，字九万，号菊涧，绍兴余姚人，南宋诗人、画家，江湖诗派中人。他一生未仕，长期漫游江湖，以诗画自给，兼工乐府；《清明日对酒》写祭扫所见，流传甚广。其诗多写江南风物与身世之感，笔调清畅，著有《菊涧集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0276
    name: 耶律斜轸
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: 耶律斜轸（？—999），字韩隐，辽景宗、圣宗时期名将，娶后族之女，为萧太后所倚重。979年高梁河之战，他与耶律休哥分率左右翼夹击宋军，宋太宗败走；986年宋军三路北伐，他任山西路统帅，击退潘美，于陈家谷俘获杨业。后官至北院枢密使，封魏王，统和十七年卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0277
    name: 耶律倍
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: 耶律倍（899—937），契丹名图欲，辽太祖耶律阿保机长子，封东丹王、人皇王。他通晓汉学，兼擅诗文、书画与医学，有《射骑图》传世。太祖死后让位于耶律德光，后出奔后唐，赐名李赞华，937年后唐灭亡时遇害。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0278
    name: 耶律璟
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: 耶律璟（931—969），即辽穆宗，辽太宗长子，在位十九年。他嗜酒好猎，常昼寝不朝，时人称为“睡王”；又滥用刑罚，近侍多有怨惧，很少临朝听政，军政多委于大臣。应历十九年，他在游猎夜饮后，被近侍小哥等弑杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0279
    name: 韩延徽
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: 韩延徽（882—959），字藏明，幽州安次人，辽朝汉臣。初为刘守光幕僚，出使契丹被留，辅佐耶律阿保机，建议筑城郭、分市里以安置汉人降众，教其耕垦婚配，又参与创制礼仪；曾一度南归后唐，重返辽廷，太祖赐名“匣列”。历仕太祖、太宗、世宗三朝，官至南府宰相。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0281
    name: 室昉
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: 室昉，字梦奇，辽朝南京人，自幼笃学，会同初年登进士第，历仕太宗至圣宗五朝。景宗临终受遗诏，与韩德让、耶律斜轸同辅年幼的圣宗。统和初年监修国史，与邢抱朴等纂修《辽朝实录》，并参与整顿吏治、减免赋役，官至枢密使，卒年七十五。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0282
    name: 萧挞凛
    avatar: monkey/其他随机角色/文_男123.png
    default_gender: male
    archetype: military
    flavor: 萧挞凛（？—1004），字驼宁，辽朝将领，通晓天文，封兰陵郡王。986年宋军北伐，他随耶律斜轸在山西作战，于陈家谷俘获杨业；后长期主持边防。1004年随辽圣宗、萧太后南下，在澶州城下被宋军床子弩射杀。主帅阵亡使辽军受挫，宋辽随即议和，缔结澶渊之盟。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0283
    name: 萧惠
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: 萧惠，字伯仁，小字脱古思，辽朝外戚，娶辽圣宗之女秦国长公主，拜驸马都尉。历任西北路招讨使等职，主持辽宋、辽夏边务；1044年辽兴宗亲征西夏，他统率南路军，因轻敌冒进被夏军击败。其女萧挞里为辽兴宗皇后，萧惠以椒房之亲累封魏国王。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0284
    name: 萧思温
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: 萧思温，字寅古，辽朝外戚，娶辽太宗之女燕国公主。辽穆宗遇弑后，他与高勋等拥立耶律贤，即辽景宗，官至北院枢密使兼北府宰相。其女萧绰为景宗皇后，即后来的承天太后。970年从景宗游猎时遇刺身亡，后查明为国舅萧海只等指使。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0285
    name: 耶律仁先
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: 耶律仁先（1013—1072），字糺邻，辽朝宗室、名臣。1042年奉使宋朝，与刘六符同宋廷交涉，促成宋增岁币；后随辽兴宗征西夏，出任东京留守。清宁九年耶律重元举兵作乱，他与耶律良等率宿卫讨平，以功加号“于越”，官至北院枢密使，封宋王。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0286
    name: 耶律洪基
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: 耶律洪基（1032—1101），即辽道宗，辽兴宗长子，在位四十六年。即位初平定耶律重元之乱；中年信用耶律乙辛，皇后萧观音被诬赐死，太子耶律浚遭废被害，朝政由此紊乱。晚年察觉其奸，诛杀乙辛一党。道宗通晓汉文，好诗赋，但辽朝国势自此渐衰。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0287
    name: 耶律延禧
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
