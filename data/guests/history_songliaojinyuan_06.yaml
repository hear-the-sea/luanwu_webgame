heroes:
  blue:
  - key: hist_songliaojinyuan_0273
    name: 耶律德光
    default_gender: male
    archetype: military
    flavor: （902年-947年）辽太宗，辽朝第二位皇帝。他灭后晋，建立大辽国号，推动契丹汉化。他在中原称帝，虽然统治短暂，却开创了北方民族入主中原的先例。耶律德光所作决断并非孤立行为，而是内政派系与外部形势共同作用的产物。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0274
    name: 耶律休哥
    default_gender: male
    archetype: military
    flavor: （？-998年）辽朝名将，多次击败宋军。他守卫辽南疆，与宋朝对峙多年。高梁河之战，他与耶律斜轸联手大败宋太宗，奠定了辽宋边界格局。围绕耶律休哥的争议长期存在，本质上是在讨论不同历史条件下“可行策略”的边界。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0275
    name: 耶律隆绪
    default_gender: male
    archetype: military
    flavor: （972年-1031年）辽圣宗，辽朝鼎盛时期的皇帝。他在位期间，辽朝达到极盛，与宋朝签订澶渊之盟。他推行汉化政策，促进了契丹与汉族的融合。耶律隆绪的政策选择不能孤立理解，必须结合当时财政压力、边疆局势与朝局互动来判断。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0280
    name: 韩德让
    default_gender: male
    archetype: civil
    flavor: （941年-1011年）辽朝重臣，萧太后的情人。他与萧太后共同执政，对辽朝鼎盛贡献巨大。他虽是汉人，却获赐国姓耶律。从治理实践看，韩德让的经历可被当作观察宋辽金元之际国家动员能力与统治半径消长的窗口。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0259
    name: 曾几
    default_gender: male
    archetype: civil
    flavor: （1085年-1166年）南宋诗人，号茶山，曾教授陆游。曾几的诗清新平淡，重视眼前景物与日常情味，不以奇险字句夺人；陆游早年从他那里学到的，正是如何在寻常处见功夫。名师不一定要把弟子教成自己的影子，茶山更像给陆游递了一盏稳火，让他后来自己烧出烈酒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0260
    name: 朱敦儒
    default_gender: male
    archetype: civil
    flavor: （1081年-1159年）南宋词人，号樵歌。靖康之变前，他的词尚有闲适旷达之气；山河易色后，词中多出漂泊、衰乱与故国之感。朱敦儒并非一开始就把每句都写成悲歌，而是亲历时代转折后，才让原本的疏狂染上沉郁；樵夫的歌声，后来也带了乱世的风。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0261
    name: 张元干
    default_gender: male
    archetype: civil
    flavor: （1091年—约1161年）北宋末南宋初词人。靖康之后，张元干的词由宴游转向悲壮，既写亡国之痛，也写抗金之志；作《贺新郎》送胡铨，更因触怒秦桧而被削籍除名。官身可以剥去，词里的刀却收不回去，晚年寓居福州仍以诗词自遣。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0262
    name: 朱淑真
    default_gender: female
    archetype: civil
    flavor: （约1135年—约1180年）南宋女词人，后世常与李清照并称。朱淑真的词多写闺中感受，却不只是“闺怨”二字能收尽：孤独、婚姻束缚、春色易逝与自我才情，都在细密字句里争一席之地。她的生平材料并不完整，作品却替宋代女性留下了不肯被旁人代言的声音。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0263
    name: 严羽
    default_gender: male
    archetype: civil
    flavor: （约1192年—约1245年）南宋诗论家，《沧浪诗话》作者。严羽提出“别材别趣”“妙悟”等说法，认为诗有不同于学问文章的感兴与境界，不可只靠堆典故取胜。他像替诗坛立了一块提醒牌：剑谱背得再熟，也不等于临阵有剑意。后世论诗常与他交锋，正说明这块牌子一直立在路旁。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0264
    name: 戴复古
    default_gender: male
    archetype: civil
    flavor: 戴复古（1167—约1248），台州黄岩人，一生未仕，以布衣身份游历闽、浙、赣、淮。诗学陆游，却不只写个人襟抱，《织妇叹》《淮村兵后》直面战乱下的民生困苦，在江湖诗派中格外有泥土气。有《石屏集》传世，与刘克庄、严羽等交游；他的行囊不挂官印，装的却是一路见闻。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0265
    name: 刘辰翁
    default_gender: male
    archetype: civil
    flavor: 刘辰翁（1232—1297），庐陵人，号须溪。南宋末年以词名世，常与蒋捷、张炎等并列；宋亡后隐居不仕，词中亡国之痛与身世飘零交织，悲凉而不失遒劲。他又长于评点，批注《世说新语》及杜甫、李贺诗集。既替自己哭故国，也替前人的文章挑灯细看，须溪的笔始终没有闲下来。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0266
    name: 方岳
    default_gender: male
    archetype: civil
    flavor: （1199年-1262年）字巨山，号秋崖，徽州祁门人，绍定五年进士，官至吏部侍郎。方岳诗风刚健质直，能写山水田园，也敢把民间疾苦与时政讽喻写进诗中；因屡次触忤贾似道而被贬。秋崖不是只会对着秋山发愁，山里的风、百姓的苦和朝堂的弊，他都要在诗里问上一问。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0267
    name: 叶梦得
    default_gender: male
    archetype: civil
    flavor: （1077年-1148年）两宋之际词人、政治家，号石林。叶梦得经历北宋覆亡与南宋初建，词风既有豪放雄健，也有对山川风物的细密体察；任官所见的兵乱、民情与制度压力，常在词文背后留下暗纹。他不是躲在词牌后的闲客，手里一支笔，另一边还握着经世的笏板。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0268
    name: 刘一止
    default_gender: male
    archetype: civil
    flavor: 刘一止（1079—1160），字行简，湖州归安人，宣和三年进士。南渡后历官至敷文阁直学士，诗风平易晓畅，不以雕琢遮住真情；靖康之后的动荡与个人漂泊，常从他的诗句里缓缓透出。《苕溪集》如一条看似平静的水面，水下却一直有乱世的暗流。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0269
    name: 汪元量
    default_gender: male
    archetype: civil
    flavor: （约1241年—约1317年）南宋遗民诗人、琴师。汪元量随宋室北迁，亲眼见到宫廷与故国一同被带离江南，诗中留下许多近乎现场的细节。琴声本该娱人，在他手里却成了替亡国者记事的弦；旧调一拨，江山易色的回声便已刺耳。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0270
    name: 林景熙
    default_gender: male
    archetype: civil
    flavor: （1242年-1310年）南宋遗民诗人，号霁山。宋亡后隐居不仕，往来吴越，与谢翱等遗民唱和；相传又曾与唐珏等收葬宋帝陵骨殖于兰亭，作《冬青花》记其事。林景熙的诗沉郁而不失清峻，故土之思不是口号，而像冬青一样，在寒地里仍守着一点颜色。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0271
    name: 郑思肖
    default_gender: male
    archetype: civil
    flavor: （1241年-1318年）南宋遗民画家、诗人，号所南。郑思肖画兰而不画土，后人多以此理解为故土沦丧、无处着根；这一笔的含义虽有传说成分，却确实成为遗民书画中最醒目的意象之一。他不在画面上补一寸土地，正像拒绝替新朝承认那片土地已经改了主人。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0272
    name: 高翥
    default_gender: male
    archetype: civil
    flavor: （1170年-1241年）南宋诗人，号菊磵。常被误传为“清明时节雨纷纷”的作者，实际上那句出自杜牧；高翥所作《清明日对酒》等诗，则以扫墓、纸灰与春日景象写出清明的民间哀乐。他的诗清新自然，少摆名家架子，正因不靠误认也站得住，才更值得把名字还给他自己的作品。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0276
    name: 耶律斜轸
    default_gender: male
    archetype: military
    flavor: 耶律斜轸（？—999），辽景宗、圣宗朝名将。乾亨元年高梁河之战，他与耶律休哥分进合击，大破宋军；统和四年又随承天太后南征，在狼牙村俘获宋将杨业。斜轸善用骑兵迂回侧击，与休哥并称辽初双璧。战场上他不急着正面硬撞，常先绕到敌人的退路上等答案自己送来。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0277
    name: 耶律倍
    default_gender: male
    archetype: civil
    flavor: 耶律倍（899—937），辽太祖耶律阿保机长子，契丹名图欲，封东丹王，曾治理渤海故地。他通汉学、能诗画，藏书万卷，本有继承大位的资格，却在太祖死后被述律后拥立次子德光，只得让位。耶律倍浮海奔后唐，最终死于后唐内乱；一个能以笔墨安顿山河的人，偏偏一生没有自己的安稳国土。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0278
    name: 耶律璟
    default_gender: male
    archetype: military
    flavor: （931年-969年）辽穆宗，太宗耶律德光长子，在位十九年。耶律璟嗜酒好猎，常不视朝政，醉后滥施刑罚，令群臣与近侍都心怀恐惧；应历十九年行猎于怀州时，终于被近侍小哥等六人弑杀。《辽史》称其“荒耽于酒，畋猎无厌”，这位君主把猎场当作朝堂，最后连身边人也成了围猎者。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0279
    name: 韩延徽
    default_gender: male
    archetype: civil
    flavor: 韩延徽（882—959），字藏明，幽州安次人。早年为刘守光幕僚，出使契丹后被留用，转而辅佐耶律阿保机；他帮助辽朝筑城郭、安置汉民、厘定制度，使游牧政权逐步拥有治理城郭与农耕人口的章法。历仕太祖、太宗、世宗三朝，官至南府宰相。韩延徽像把两种政治语言译成同一份公文，翻译得好，便能让一个新王朝站稳脚。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0281
    name: 室昉
    default_gender: male
    archetype: civil
    flavor: （？—约1054年）辽朝名臣，精通汉学，参与推动中枢官制与文教制度的调整。室昉所处的辽朝并非简单照搬中原旧制，而是在契丹旧俗与汉地行政之间反复调试；他的作用更像掌尺的工匠，把制度一寸寸量到能用为止。个人生卒与具体行事已不尽详，能确认的是他在辽中期建制中留下了分量不轻的名字。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0282
    name: 萧挞凛
    default_gender: male
    archetype: military
    flavor: （？—1004年）辽朝名将，随萧太后南征至澶州。萧挞凛在城下被宋军床子弩射杀，辽军前锋失去主将，战场压力随之骤增；次年宋辽订立澶渊之盟，后世遂常把他的死与议和转折相提。弩箭射落的是一员将领，留下的却是两国都不得不重新估量的战局。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0283
    name: 萧惠
    default_gender: male
    archetype: military
    flavor: （约975年-1056年）辽朝将领，长期镇守南疆，参与辽宋与辽夏边事。萧惠有出兵取胜的战绩，也经历过边地进退，不能只用“西夏克星”一语盖棺；辽军要在草原、城寨与长途粮运之间作战，胜负从来不只由勇力决定。名将的难处，常在战报之外的那条漫长补给线上。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0284
    name: 萧思温
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）辽朝外戚重臣，萧绰之父，出身萧氏望族。景宗即位后，他位居中枢，女儿萧绰又成为皇后，萧氏由此更深地嵌入辽朝权力核心；萧思温后来遇刺身亡，外戚的荣耀与风险一并落在家门上。辽廷的棋局还没落定，他已经把最重的一枚棋子交给了下一代。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0285
    name: 耶律仁先
    default_gender: male
    archetype: civil
    flavor: （1013年-1072年）辽朝宗室、重臣，长期参与中枢政务与军国决策。耶律仁先在辽中期辅政有年，曾参与平定重元之乱，既要维护皇权，也要在宗室与外戚之间收束裂缝。这样的功劳少有华丽传说，却像梁柱一样支撑屋檐；朝廷看似安稳时，往往正有人在暗处托住它。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0286
    name: 耶律洪基
    default_gender: male
    archetype: military
    flavor: 耶律洪基（1032—1101），即辽道宗，兴宗长子，在位四十六年，为辽帝中最长。即位初曾平定重元之乱，后来笃信佛教、广建寺塔，又宠信耶律乙辛，致皇后萧观音被诬死、太子浚被废杀，朝廷因而失去许多忠直之臣。晚年虽诛乙辛，旧伤已深；长寿并不等于长治，君主若把耳目交给近幸，四十六年也足够把国势磨薄。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0287
    name: 耶律延禧
    default_gender: male
    archetype: military
    flavor: 耶律延禧（1075—1128），辽天祚帝。即位后信用萧奉先、疏远忠良，面对女真兴起又屡失先机；天庆五年亲征护步答冈惨败，辽军主力受重创。保大五年他在应州被金军俘获，降封海滨王，终卒于金国。辽国的长城并非一日倒塌，却在他手里接连失去守门的人。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0288
    name: 耶律章奴
