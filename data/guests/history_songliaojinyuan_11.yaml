    flavor: 姚友仲，北宋末将领，姚兕之孙、姚古之子。姚兕历泾原、鄜延等路，以边功显名，《宋史》为之立传；姚古官至熙河经略使。靖康元年金军南下，姚友仲随父辈参与京畿防御，时人称其忠勇；其具体战功与结局记载简略。
