    archetype: civil
    flavor: 范正国，字子仪，苏州吴县人，北宋末南宋初官员，范纯仁第四子、范仲淹之孙。曾任广南东路转运判官，掌一路财赋与州县监察。绍兴二年（1132），他奏请以父亲范纯仁生前所受御书“世济忠直之碑”为神道碑额，朝廷诏许，范氏家声由此更显。其生卒年不详。
