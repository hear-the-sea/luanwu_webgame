  - key: hist_songliaojinyuan_0537
    name: 姚铉
    default_gender: male
    archetype: civil
    flavor: 姚铉（968—1020），北宋文臣、学者。真宗大中祥符四年（1011）编成《唐文粹》一百卷，选录唐代古文，推动宋初古文风气；曾知郓州并主持迁建州城以避黄河水患。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 50
      defense: 21
      agility: 17
