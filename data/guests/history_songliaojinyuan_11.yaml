    name: 龙海基
    default_gender: male
    archetype: civil
    flavor: 龙海基，北宋六诏山区哈尼族强现部首领。仁宗皇祐年间，因向导狄青部将杨文广追击侬智高有功，受宋廷任命世领六诏山区，辖维摩、王弄等部。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 58
      defense: 21
      agility: 6
  - key: hist_songliaojinyuan_0530
    name: 李若拙
    default_gender: male
    archetype: civil
    flavor: 李若拙（944—1001），字藏用，京兆万年人，北宋初政治人物。960年进士，历任御史、河东转运使等；雍熙三年与李觉出使交州，带回南越岁币及被扣宋使。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 58
      defense: 21
      agility: 10
  - key: hist_songliaojinyuan_0531
    name: 梅执礼
    default_gender: male
    archetype: civil
    flavor: 梅执礼（1079—1127），字和胜，婺州浦江人，北宋官员。历任吏部、户部官，靖康元年任户部尚书；金军搜括金银时因数额不足被杀，南宋追赠资政殿学士，谥节愍。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 58
      defense: 16
      agility: 11
  - key: hist_songliaojinyuan_0532
    name: 钱勰
    default_gender: male
    archetype: civil
    flavor: 钱勰（1034—1097），字穆父，临安人，吴越钱氏后裔，北宋政治人物、书法家。历知尉氏、如皋，任提点刑狱、盐铁判官；元丰六年出使高丽，后知开封府，著《会稽公集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 54
      defense: 19
      agility: 13
  - key: hist_songliaojinyuan_0533
    name: 石以定
    default_gender: male
    archetype: civil
    flavor: 石以定，北宋黔地部族首领。熙宁六年（1073）与龙番、罗番、方番等八百九十人入朝，向宋廷进贡丹砂、毡、马，获赐袍带、钱帛。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 56
      defense: 16
      agility: 12
