    flavor: 石知颙，真定府人，北宋宦官。景德元年（1004）契丹大举南犯，他任天雄军、澶州巡检使，戍守镇州、定州、高阳关三路，并押大阵。是年宋辽议和，订澶渊之盟。后任高阳关驻泊行营钤辖，掌一路堡寨兵马。天禧三年（1019）卒。
