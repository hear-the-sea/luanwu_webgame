heroes:
  blue:
  - key: hist_songliaojinyuan_0502
    name: 喻皓
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）北宋著名都料匠，相传为浙东人，以营造术闻名。开封开宝寺木塔的建造常与其名相连；沈括《梦溪笔谈》记载他解释木塔“似倾而正”的构造道理。所著《木经》三卷虽已失传，其条文长期为宋代营造所沿用。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 54
      defense: 21
      agility: 11
  - key: hist_songliaojinyuan_0576
    name: 滕宗谅
    avatar: pig/武076.png
    default_gender: male
    archetype: military
    flavor: （991年—1047年）北宋官员，字子京，河南府人，与范仲淹同年进士。滕宗谅任庆州知州期间整修城防、招抚流民，后因公使钱案被贬知岳州，重修岳阳楼并请范仲淹作《岳阳楼记》；他晚年改知苏州，到任不久病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 13
      defense: 26
      agility: 19
  green:
  - key: hist_songliaojinyuan_0552
    name: 焦赞
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）焦赞，北宋将领，正史无传，事迹主要出自杨家将故事系统。元明以来的杂剧与小说将其写成杨业部将，与孟良并称，二人常一同冲阵、破围、劫寨，民间遂有“焦不离孟”之语。其官职、战绩与生卒年皆无可考的可靠史料。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 47
      intellect: 16
      defense: 23
      agility: 14
  - key: hist_songliaojinyuan_0496
    name: 巢谷
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: 巢谷，字元修，眉州眉山人，北宋士人。少举进士不第，后弃文习武，游历秦凤、泾原，与将领韩存宝交好，并教其兵法。韩存宝获罪后，巢谷避祸隐名。苏轼、苏辙兄弟谪居岭海时，他已年逾七十，先徒步至循州见苏辙，又欲渡海往儋州访苏轼，途中病卒于新会。苏辙为之作《巢谷传》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 56
      defense: 17
      agility: 14
  - key: hist_songliaojinyuan_0497
    name: 孔延龄
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 孔延龄，北宋兖州曲阜人，孔子四十五代孙，孔仁玉之孙、孔冕之子。孔仁玉在五代孔氏遭难后复承庙祀，被后世谱系尊为中兴祖。大中祥符元年（1008），宋真宗封禅泰山，亲至阙里祭孔，加谥孔子为玄圣文宣王，并改曲阜县为仙源县。孔延龄后以太常博士知仙源县事，兼理一方庙祀与县政。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 53
      defense: 23
      agility: 13
  - key: hist_songliaojinyuan_0498
    name: 孔端立
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: 孔端立，字子植，北宋末金初曲阜人，孔子四十八代孙，衍圣公孔宗愿之孙、孔若愚第四子。靖康之变后，衍圣公孔端友随宋室南渡，孔氏遂有南北二宗，曲阜祖庭由留居北方的族人主持。孔端操于1133年去世后，孔端立一度权主祀事；金熙宗天眷三年（1140）改立孔端操之子孔璠袭封衍圣公，孔端立五十五岁卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 55
      defense: 16
      agility: 18
  - key: hist_songliaojinyuan_0499
    name: 孔若愚
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 孔若愚，字公直，北宋曲阜人，孔子四十七代孙，衍圣公孔宗愿第三子，孔若蒙、孔若虚之弟。宋仁宗至和二年（1055），宋廷改封孔子后裔为衍圣公，首受此封者即其父孔宗愿。其兄孔若蒙、孔若虚相继承袭封号，孔若愚本人则未仕，以儒士身份居家，五十四岁卒；其子孔端立后来一度权主孔氏祀事。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 57
      defense: 18
      agility: 14
  - key: hist_songliaojinyuan_0500
    name: 刘永年
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: 刘永年，字君锡，益州华阳人，定籍太原，北宋外戚，刘美之孙、刘从德之子。刘美为章献明肃刘皇后之兄，真宗末年至仁宗初年刘太后临朝，刘氏一门恩泽甚厚。刘永年以外戚恩荫入仕，四岁即授内殿崇班，此系武臣阶官，以示恩宠。后历任廉州团练使、陕西都监、皇城司干办等职，并曾以副使身份出使契丹，参与平定地方叛乱。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 17
      intellect: 50
      defense: 21
      agility: 12
  - key: hist_songliaojinyuan_0501
    name: 王仁睿
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: 王仁睿，北宋宦官，宋太宗即位前的潜邸旧人。太宗登基后，他历任内小底都知、洛苑副使，掌内廷财用出入。太平兴国七年（982）秦王赵廷美被指谋逆，贬往房州，王仁睿参与查办此案。他四十一岁去世，朝廷追赠内侍官职。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 52
      defense: 22
      agility: 15
  - key: hist_songliaojinyuan_0503
    name: 吴仁裕
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: 吴仁裕，北宋时人，后东渡高丽。高丽成宗朝整顿官制、招纳宋人，吴仁裕渡海入仕，任军器监，掌管兵器营造。此后定居海州，子孙在当地繁衍，成为高丽社会中源自宋地的姓氏支系之一。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 17
      intellect: 50
      defense: 17
      agility: 16
  - key: hist_songliaojinyuan_0504
    name: 孔端操
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: 孔端操，北宋末南宋初曲阜人，孔子四十八代孙，孔宗愿之孙、孔若蒙次子。建炎二年（1128），衍圣公孔端友随宋高宗南渡，孔端操留居曲阜，守护孔林、孔庙，孔氏自此分为南、北二宗。他留居金人控制下的阙里，曾获金廷免赋。1132年，伪齐刘豫授其为权袭衍圣公，次年去世；其子孔璠后来受金封为衍圣公。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 51
      defense: 19
      agility: 14
  - key: hist_songliaojinyuan_0505
    name: 王景绝
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: 王景绝，太原人，历五代至北宋初，生卒年不详。少时游历燕、赵，曾入昭义军幕府参预文书。他后来弃去吏职，遍搜四方书籍，晚年聚书数千卷。太原本为北汉辖地，太平兴国四年（979）宋灭北汉，王景绝方入宋；端拱年间（988—989）卒于汴京。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 52
      defense: 20
      agility: 15
  - key: hist_songliaojinyuan_0506
    name: 陈太初
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 陈太初，眉山人，北宋人物。幼年与苏轼同从眉山道士张易简读书，后曾任郡中小吏，继而弃官学道，隐居不仕。苏轼谪居黄州时，听闻他已在汉中尸解，遂将此事记入《东坡志林》。所谓尸解，是道教称修道者遗形而去的说法，其事带有传说色彩，陈太初的生卒年亦不详。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 51
      defense: 23
      agility: 12
  - key: hist_songliaojinyuan_0508
    name: 窦贞固
    avatar: pig/文048.png
    default_gender: male
    archetype: civil
    flavor: 窦贞固（892—969），字体仁，同州白水人，五代至北宋初大臣，窦专之子。后唐时入仕，历仕后唐、后晋、后汉、后周四朝，官至门下侍郎、同平章事、司徒，参预机务，以老成持重见称。入宋时他已年近七旬，受封沂国公，开宝二年（969）卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 17
      agility: 13
  - key: hist_songliaojinyuan_0510
    name: 范世京
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: 范世京，字延祖，苏州长洲人，北宋中期官员，范师道之子。皇祐五年（1053）进士，历任柘城主簿、历阳令、海盐知县。主簿掌一县簿书，县令总领县政，他长期在州县任职，熟于吏事，后以孝养父母闻名乡里。秘书丞为文臣清选，他官至秘书丞而致仕，四十一岁卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 17
      intellect: 57
      defense: 22
      agility: 4
  - key: hist_songliaojinyuan_0511
    name: 范墉
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: 范墉，吴越国旧臣，北宋官员，范仲淹之父。太平兴国三年（978）吴越王钱俶纳土归宋，范墉随之入宋，后任武宁军节度掌书记。武宁军治徐州，他在范仲淹年幼时去世，家道中落，其妻谢氏携子改适朱氏，范仲淹少时因此备尝艰辛。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 52
      defense: 20
      agility: 14
  - key: hist_songliaojinyuan_0513
    name: 范正平
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: 范正平，字子夷，苏州吴县人，范纯仁次子、范仲淹之孙。曾任开封府界官员。崇宁年间蔡京当政，元祐党人子弟多受排抑，他因之被贬，其间又曾代弟承担罪责。著有《荀里退居编》，宣和末至南宋初追赠直秘阁，生卒年不详。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 53
      defense: 22
      agility: 12
  - key: hist_songliaojinyuan_0514
    name: 范正思
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: 范正思（1051—1108），字子思，一作子默，苏州吴县人，范纯仁第三子、范仲淹之孙。其父范纯仁官至宰相，卒后他守丧多年，以孝行见称。官至朝奉郎、武骑尉，著有《惜羞集》《纂忠宣言行录》。大观二年（1108）卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 54
      defense: 22
      agility: 10
  - key: hist_songliaojinyuan_0515
    name: 范正民
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: 范正民，字子政（一作子正），苏州吴县人，范纯仁长子、范仲淹之孙。其父范纯仁官至宰相，范氏一门以儒学显。范正民以父祖恩荫补单州团练推官，未及显达，三十余岁即去世。其人博学能文，生前有文集百卷，惜毁于兵火，今已不存。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 53
      defense: 21
      agility: 12
  - key: hist_songliaojinyuan_0517
    name: 范直筠
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: 范直筠，字端伯，苏州吴县人，后迁居乐平，范正国长子、范仲淹曾孙。其父范正国曾任广东运判。乾道元年（1165），范直筠请画家扬无咎作梅花图。扬无咎字补之，号逃禅老人，清江人，以墨梅著称；所绘《四梅花图》分未开、欲开、盛开、将残四段，为宋代墨梅名迹。范直筠的生卒年与官职不详。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 51
      defense: 20
      agility: 18
  - key: hist_songliaojinyuan_0519
    name: 范纯礼
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 范纯礼（1031—1106），字彝叟，苏州吴县人，范仲淹第三子。历任知遂州、京西转运副使、发运使等职，元祐初入为给事中，掌封驳政令。徽宗即位后，他知开封府，官至尚书右丞，与兄长范纯仁同为一时名臣。后因党争贬谪，崇宁五年（1106）卒，谥恭献。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 56
      defense: 20
      agility: 13
  - key: hist_songliaojinyuan_0521
    name: 范纯佑
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 范纯佑（1024—1063），字天成，苏州吴县人，范仲淹长子。师从学者胡瑗，通兵书及道家之学。庆历年间随父经略陕西，庆历二年（1042）参与修筑庆州大顺城，以扼西夏南下之路。后因病早卒，年约四十，有子范正臣。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 17
      intellect: 50
      defense: 18
      agility: 15
  - key: hist_songliaojinyuan_0522
    name: 范雩
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: 范雩，字伯达，苏州吴县人，北宋进士，范成大之父。宣和六年（1124）登进士第。南宋时入秘书省，任正字、校书郎、秘书郎等职，掌校勘典籍、编修图籍，又曾为玉牒所检讨。绍兴十三年（1143）致仕，著有《禹稷颜回同道论》。其子范成大后以诗名世，与陆游、杨万里、尤袤并称南宋中兴四大诗人。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 56
      defense: 21
      agility: 9
  - key: hist_songliaojinyuan_0523
    name: 葛胜仲
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: 葛胜仲（1072—1144），字鲁卿，丹阳人，北宋末南宋初官员、词人。绍圣四年（1097）进士，历知湖州、邓州等州，官至显谟阁待制。他曾奉诏续修《太常因革礼》，于礼制多所考订；工于填词，著有《丹阳集》，卒谥文康。其子葛立方亦以诗文名，撰有《韵语阳秋》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 54
      defense: 22
      agility: 13
  - key: hist_songliaojinyuan_0524
    name: 刘承珪
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 刘承珪（后改名承规，949—1012），字大方，楚州山阳人，北宋宦官。历事太祖、太宗、真宗三朝，长期掌内藏库及宫苑营造，曾校定权衡度量之制。又参与编修实录、国史及《册府元龟》，大中祥符五年（1012）卒，谥忠肃。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 52
      defense: 20
      agility: 17
  - key: hist_songliaojinyuan_0525
    name: 李从善
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: 李从善，字子师，南唐元宗李璟第七子，后主李煜之弟，封邓王。开宝四年（971）他奉使入宋，宋太祖将其留居汴京，厚加礼遇而不遣还，以牵制南唐。李煜多次上表请放弟归国，均未获准；开宝八年南唐灭亡后，李从善随之仕宋，受封南楚国公。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 53
      defense: 17
      agility: 16
  - key: hist_songliaojinyuan_0526
    name: 李神祐
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: 李神祐（951—1016），开封人，北宋宦官，李神福之弟。兄李神福亦为内侍，兄弟并掌宫禁。开宝年间，他随宋太祖征南唐，又曾从征北汉，并参与平定周琼等叛乱。太宗时，他督军屯边、治理黄河，历任洛苑使、内都知；内都知为入内内侍省要职，掌内廷供奉。大中祥符九年（1016）卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 50
      defense: 23
      agility: 13
  - key: hist_songliaojinyuan_0527
    name: 梁适
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: 梁适（1000—1070），字仲贤，东平人，梁颢之子，北宋政治家。仁宗时官至同中书门下平章事，曾历知澶州、秦州、并州。嘉祐年间经略屈野河一带，与西夏交涉划界，熙宁三年（1070）卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 50
      defense: 16
      agility: 23
  - key: hist_songliaojinyuan_0528
    name: 蓝元震
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: 蓝元震（？—1077），北宋宦官，蓝继宗养子。明道元年（1032）宫中失火，他传召宿卫护驾，由此见知。后历任诸陵都监、群牧都监、入内押班，分掌皇陵事务与马政。熙宁年间，他曾参与查察青苗法在地方的施行。熙宁十年（1077）卒于入内副都知任上。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 55
      defense: 19
      agility: 13
  - key: hist_songliaojinyuan_0529
    name: 龙海基
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: 龙海基，北宋六诏山区哈尼族强现部首领。皇祐年间侬智高起兵邕州，狄青率军南征，部将杨文广追入西南山地。龙海基为宋军向导，熟悉当地道路与部族分布，因功受宋廷任命，世领六诏山区，辖维摩、王弄等部，龙氏由此成为当地世袭首领。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 58
      defense: 21
      agility: 6
  - key: hist_songliaojinyuan_0530
    name: 李若拙
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: 李若拙（944—1001），字藏用，京兆万年人，北宋初文臣。建隆元年（960）进士，历任御史、河东转运使等职。雍熙三年（986）与李觉出使交州，交涉黎桓扣留宋使之事，后携岁币及被扣宋使归国，咸平四年（1001）卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 58
      defense: 21
      agility: 10
  - key: hist_songliaojinyuan_0531
    name: 梅执礼
    avatar: pig/文050.png
    default_gender: male
    archetype: civil
    flavor: 梅执礼（1079—1127），字和胜，婺州浦江人，北宋官员。历任吏部、户部官职，靖康元年（1126）任户部尚书。靖康二年金军攻陷汴京，索取金银，他因所括数额不足，与陈知质、程振、安扶等同遭杀害；南宋追赠资政殿学士，谥节愍。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 58
      defense: 16
      agility: 11
  - key: hist_songliaojinyuan_0532
    name: 钱勰
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: 钱勰（1034—1097），字穆父，临安人，吴越钱氏后裔，北宋官员、书法家。历任知尉氏、如皋，提点刑狱、盐铁判官。元丰六年（1083）奉命出使高丽，后知开封府。其书法与文章为时人所重，著有《会稽公集》，绍圣四年（1097）卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 54
      defense: 19
      agility: 13
  - key: hist_songliaojinyuan_0533
    name: 石以定
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: 石以定，北宋黔地部族首领。熙宁六年（1073），石以定与诸番首领等八百九十人入朝，进贡丹砂、毡、马，朝廷赐予袍带、钱帛，以维系西南边地的隶属关系。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 56
      defense: 16
      agility: 12
  - key: hist_songliaojinyuan_0534
    name: 王守规
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: 王守规，真定栾城（今河北栾城）人，北宋宦官，王守忠之弟。仁宗朝宫中夜间失火，他及时引导仁宗自西华门出避，以此见称。西华门为宫城西门，夜间失火时宫禁混乱，他护帝而出。后历任内侍省官职，官至宣庆使、康州防御使、内侍右班副都知，卒赠昭武军留后。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 52
      defense: 22
      agility: 14
  - key: hist_songliaojinyuan_0535
    name: 谢德权
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: 谢德权，字士衡，福州人，北宋官员，南唐将领谢文节之子。南唐灭亡后入宋，任殿前承旨、陕西巡检。他曾参与整治开封街衢，拆除沿街侵建，使京城道路复通；又主持修筑咸阳渭水浮桥，便利两岸往来。任内还曾监察刑狱、审理积案，以办事强干见称。其生卒年不详。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 54
      defense: 22
      agility: 9
  - key: hist_songliaojinyuan_0536
    name: 阎士良
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: 阎士良，北宋宦官，曾任知御药院，掌内廷御药供奉。仁宗明道二年（1033）郭皇后被废，景祐二年（1035）郭氏暴卒，外间传言与内侍阎文应有关；阎士良受此事牵连，罢知御药院，改任内殿崇班。此后他仍在仁宗朝内侍省供职。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 57
      defense: 23
      agility: 7
  - key: hist_songliaojinyuan_0537
    name: 姚铉
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: 姚铉（968—1020），字宝之，庐州合肥人，北宋文臣、学者。太平兴国八年（983）进士。大中祥符四年（1011）编成《唐文粹》一百卷，选录唐代诗文，以古雅为宗，对宋初古文风气有所推动。他曾知郓州，主持迁建州城以避黄河水患，天禧四年（1020）卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 50
      defense: 21
      agility: 17
  - key: hist_songliaojinyuan_0538
    name: 张继能
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: 张继能（957—1021），字守拙，太原人，北宋宦官、将领。太宗、真宗时参与讨伐李继迁，咸平三年（1000）又随军平定王均之乱。曾任边地都监、巡检安抚使，因清远军失守被贬，后复任入内内侍省副都知，天禧五年（1021）卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 51
      defense: 20
      agility: 13
  - key: hist_songliaojinyuan_0539
    name: 张茂则
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: 张茂则（1015—1094），字平甫，开封人，北宋宦官。历事仁宗、英宗、神宗三朝，官至入内都知。性俭素，以清谨忠勤见称。仁宗病中，他曾就宫门安危进言；晚年因元祐党籍之事受到牵连，绍圣元年（1094）卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 58
      defense: 22
      agility: 9
  - key: hist_songliaojinyuan_0540
    name: 赵禼
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: 赵禼（1026—1091），字公才，邛州依政人，北宋政治家、将领。他久任西北边臣，参与西夏边务，主张固守绥州，并请筑绥德城以扼横山要路。熙宁末年，交趾侵扰岭南，宋廷用兵安南，他出任安南行营经略招讨副使（招讨使为郭逵）。后知延州，官至端明殿学士，卒赠右光禄大夫。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 54
      defense: 18
      agility: 16
  - key: hist_songliaojinyuan_0542
    name: 朱寿昌
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: 朱寿昌（1014—1083），字康叔，扬州天长人，北宋官员。其父朱巽，生母刘氏在他幼年时离去，母子音讯断绝五十余年。熙宁年间，朱寿昌弃官寻母，历尽艰辛，终得与母相认，其时母亲已年逾七十。此事传出，苏轼等士大夫多有诗文称道。后复出仕，官至司农少卿，成为后世“二十四孝”中弃官寻母故事的人物。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 50
      defense: 20
      agility: 14
  - key: hist_songliaojinyuan_0544
    name: 陈希亮
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: 陈希亮（1014—1077），字公弼，眉州青神人，北宋官员、良吏。历知长沙、凤翔等地，治事严明，敢于抑制豪强。知凤翔时筑凌虚台，命属下苏轼作《凌虚台记》。苏轼年少气盛，陈希亮待之甚严，二人一度不洽；苏轼晚年追念其为人，仍为之作《陈公弼传》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 50
      defense: 17
      agility: 22
  - key: hist_songliaojinyuan_0546
    name: 种朴
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: 种朴，北宋将领，种谔之子，出于种氏将门。元符二年（1099）宋军进取河湟，攻下青唐、邈川，以其地置鄯州、湟州。河湟本吐蕃唃厮啰政权故地，吐蕃诸部随后反攻，新附州县动荡，种朴在战事中阵亡，其时官知河州。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 13
      defense: 23
      agility: 16
  - key: hist_songliaojinyuan_0547
    name: 甘昭吉
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: 甘昭吉，字祐之，开封人，北宋宦官。任英州、韶州巡检时捕盗有功，迁内殿崇班。嘉祐八年（1063）仁宗去世、英宗即位，当夜禁中事务纷杂，他护卫有功，超迁供备库使、康州刺史。后任永昭陵使，主持仁宗陵寝营建与奉祀。永昭陵在河南巩县，为北宋帝陵之一。其卒年不详。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 16
      defense: 25
      agility: 17
  - key: hist_songliaojinyuan_0548
    name: 高延德
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: 高延德，北宋将领，宝元三年（1040）任塞门寨主。西夏军攻塞门寨时，宋援军未至，寨破，他被李元昊俘获，留于西夏。庆历初年，元昊欲与宋议和，遣高延德携书赴延州见范仲淹，范仲淹作书答复。他归宋后仍因陷敌之事被追究，流配远地。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 18
      defense: 26
      agility: 8
  - key: hist_songliaojinyuan_0550
    name: 韩守英
    avatar: pig/武010.png
    default_gender: male
    archetype: military
    flavor: 韩守英，字德华，开封府祥符人，北宋宦官。由西头供奉官累升入内内侍押班、副都知。契丹围攻河东岢岚军时，他与张志言、折惟昌率军渡黄河至朔州，攻破狼水寨，俘获数百人，并缴获军资。折惟昌出自府州折氏将门，府州折氏世为府州守臣，他时任府州守将。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 47
      intellect: 12
      defense: 28
      agility: 13
  - key: hist_songliaojinyuan_0553
    name: 刘几
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: military
    flavor: 刘几（1008—1088），字伯寿，洛阳人，北宋官员、词人。皇祐年间随狄青征讨侬智高，参与归仁铺之战。后知保州，治绩称为河北第一。元丰三年（1080）应召入太常，参与考定雅乐，晚年退居嵩山玉华峰，元祐三年（1088）卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 47
      intellect: 13
      defense: 26
      agility: 14
  - key: hist_songliaojinyuan_0554
    name: 刘惟简
    avatar: pig/武076.png
    default_gender: male
    archetype: military
    flavor: 刘惟简，开封人，北宋宦官。他由入内黄门累迁昭宣使、康州刺史，外任高阳关路兵马都监。高阳关为河北沿边三关之一，扼守宋辽通道，都监掌一路兵马与堡寨事务。其内职至入内押班，绍圣三年（1096）去世，追赠昭化军留后。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 47
      intellect: 18
      defense: 27
      agility: 8
  - key: hist_songliaojinyuan_0555
    name: 啰麻
    avatar: pig/武076.png
    default_gender: male
    archetype: military
    flavor: 啰麻，凉州人，北宋初党项夏州政权属官。凉州地处河西要冲，宋初为党项、吐蕃与宋廷多方角逐之地。大中祥符八年（1015），凉州守将苏守信去世，啰麻自行接管府事，但属下诸部不服，未能稳固其位，此后凉州局势更趋纷乱。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 14
      defense: 27
      agility: 11
  - key: hist_songliaojinyuan_0556
    name: 李光祚
    avatar: monkey_wu_male8.png
    default_gender: male
    archetype: military
    flavor: 李光祚，北宋初党项族将领，初为李继捧牙将。李继捧即献银、夏等五州归宋、受赐姓名赵保忠者。淳化五年（994）宋将李继隆进讨时，李光祚随李继捧坚壁清野，并奉命向李继迁传话，此事见于《宋史·夏国传》，其后事迹不详。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 45
      intellect: 17
      defense: 27
      agility: 11
  - key: hist_songliaojinyuan_0557
    name: 李大信
    avatar: pig_wu_male4.png
    default_gender: male
    archetype: military
    flavor: 李大信，北宋初党项羌首领，任蕃部都指挥使，隶于李继迁麾下。淳化四年（993），李继迁图谋收复祖上经营的五州故地，遣李大信领兵攻宋庆州。宋军据城拒守，党项军未能得手，战败撤回。此后李大信的事迹不见于史册。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 47
      intellect: 16
      defense: 22
      agility: 15
  - key: hist_songliaojinyuan_0559
    name: 李继冲
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: 李继冲，党项族，西夏皇族，李继迁之弟。太平兴国七年（982），其族兄李继捧献银、夏等五州归宋，受赐姓名赵保忠；李继冲与李继迁不肯附宋，逃往地斤泽，招集部众，积蓄力量。此后党项势力渐盛，李继冲出任绥州刺史兼右司马指挥使、行军司马。其卒年不详。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 46
      intellect: 16
      defense: 25
      agility: 13
  - key: hist_songliaojinyuan_0560
    name: 李舜举
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: 李舜举，字公辅，开封人，北宋宦官、将领。元丰五年（1082）宋廷谋控横山，徐禧主张在银州附近筑永乐城，李舜举曾言其地险远、难以久守，未被采纳。城成不久即遭西夏大军围攻，援绝而陷，李舜举与徐禧等俱死于城中。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 45
      intellect: 15
      defense: 23
      agility: 17
  - key: hist_songliaojinyuan_0561
    name: 吕璹
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: 吕璹，字季玉，北宋泉州晋江人。他任开封府司录参军，为府中属官，掌京城刑狱。宦官史志聪役使禁军卫士伐木，致人死命，案发后有关部门多所回护。吕璹坚持推究，不肯曲法，最终史志聪获贬，他也以断狱刚直见称于时。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 17
      defense: 23
      agility: 18
  - key: hist_songliaojinyuan_0563
    name: 秦翰
    avatar: monkey_wu_male7.png
    default_gender: male
    archetype: military
    flavor: 秦翰（？—1008），字仲文，镇州获鹿人，北宋初宦官、将领。太宗朝参与平定蜀中叛乱，又随军讨赵保忠，此后多次在宋辽边境领兵。景德元年（1004）澶渊之战中负责管勾大阵，辽军请和后奉命留守澶州，大中祥符元年（1008）卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 14
      defense: 25
      agility: 13
  - key: hist_songliaojinyuan_0564
    name: 孙行友
    avatar: monkey_wu_male8.png
    default_gender: male
    archetype: military
    flavor: 孙行友，五代至北宋初武将，孙方谏之弟，兄弟皆以定州一带为根基。后周时他任义武军留后，义武军治定州，地当契丹南下要路，故屡次上书奏报所侦得的契丹军情。北宋初，他因狼山佛寺聚众之事被削夺官爵并遭囚禁，后得释。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 15
      defense: 25
      agility: 12
  - key: hist_songliaojinyuan_0565
    name: 盛佶
    avatar: pig/武046.png
    default_gender: male
