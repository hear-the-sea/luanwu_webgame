    name: 蓝元震
    default_gender: male
    archetype: civil
    flavor: 蓝元震（？—1077），北宋宦官，蓝继宗养子。1032年宫中火灾时传召宿卫护驾，后任诸陵都监、群牧都监、入内押班；曾参与查察青苗法，卒于入内副都知任上。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 55
      defense: 19
      agility: 13
