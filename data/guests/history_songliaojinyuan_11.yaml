    default_gender: male
    archetype: military
    flavor: （生卒年不详）焦赞在正史中着墨不多，却因杨家将故事长期流传。民间演义多写他与孟良并称，常为抗辽军中的冲阵先锋，以勇猛、急烈、善破围著称。后世记住焦赞，主要不是因显赫官爵，而是因他在杨家将叙事里成了北宋猛将形象的一部分。
