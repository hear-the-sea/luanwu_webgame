  - key: hist_songliaojinyuan_0536
    name: 阎士良
    default_gender: male
    archetype: civil
    flavor: 阎士良，北宋宦官，曾任知御药院。郭皇后暴卒后，因阎文应相关事件受牵连，卸知御药院职，改任内殿崇班；后仍在仁宗朝供职。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 57
      defense: 23
