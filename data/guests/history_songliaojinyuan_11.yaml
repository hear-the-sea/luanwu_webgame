    name: 李神祐
    default_gender: male
    archetype: civil
    flavor: 李神祐（951—1016），开封人，北宋宦官，李神福之弟。随宋太祖征北汉、南唐，参与平定周琼等叛乱；宋太宗时督军屯边、治河，历任洛苑使、内都知。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 50
      defense: 23
      agility: 13
  - key: hist_songliaojinyuan_0527
    name: 梁适
    default_gender: male
    archetype: civil
    flavor: 梁适（1000—1070），字仲贤，东平人，梁颢之子，北宋政治家。历知澶州、秦州、并州；嘉祐三年主持收复西夏侵占的屈野、河西等地，收复约六百里边地并重定宋夏边界。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 50
      defense: 16
      agility: 23
