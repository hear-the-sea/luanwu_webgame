  - key: hist_songliaojinyuan_0535
    name: 谢德权
    default_gender: male
    archetype: civil
    flavor: 谢德权，字士衡，福州人，北宋官员，南唐将领谢文节之子。入宋后任殿前承旨、陕西巡检，参与整治开封街道，修筑咸阳浮桥并监察审案，以办事强干见称。
    growth_range:
    - 3
