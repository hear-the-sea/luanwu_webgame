    flavor: 邓守恩，并州人，北宋宦官，十岁入宫服事宋太宗。真宗朝黄河屡决，他曾以修河钤辖身份参与堵口，滑州一段河道治理后复归故道。此后任文思院使，又掌皇城司、国信司，负责宫禁稽察与外国使节往来；其间奉旨审理狱案，为多人平反。
