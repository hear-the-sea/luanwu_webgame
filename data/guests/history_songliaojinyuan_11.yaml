    flavor: （生卒年不详）孔若愚亦属宋代孔氏后裔，其名见于孔门世系与奉祀相关记录。宋廷对孔庙、祭田、袭封秩序极为看重，相关人物往往因承接祀典而被史料保存。后世提到孔若愚，着眼点并非个人传奇，而是他所处的孔门礼制传承链条。
