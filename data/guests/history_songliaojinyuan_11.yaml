heroes:
  blue:
  - key: hist_songliaojinyuan_0502
    name: 喻皓
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）喻皓是北宋著名都料匠，以营造术闻名。开封开宝寺塔常与其名相连，沈括《梦溪笔谈》还记下他解释木塔“似倾而正”的构造道理。其所著《木经》虽已失传，却长期被视作宋代营造法的重要源头。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 14
      intellect: 54
      defense: 21
      agility: 11
  - key: hist_songliaojinyuan_0576
    name: 滕宗谅
    default_gender: male
    archetype: military
    flavor: （991年—1047年）滕宗谅是北宋边臣，任庆州知州时整修城防、招辑流民，西北军政颇有成效。后又重修巴陵岳阳楼，请范仲淹作《岳阳楼记》，遂使一座楼、一篇文与其姓名一并流传。被记住的不只是文名缘分，也有实打实的治边政绩。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 42
      intellect: 13
      defense: 26
      agility: 19
  - key: hist_songliaojinyuan_0552
