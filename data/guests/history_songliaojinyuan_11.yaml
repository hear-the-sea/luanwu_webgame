    name: 李从善
    default_gender: male
    archetype: civil
    flavor: 李从善，字子师，南唐元宗李璟第七子、后主李煜之弟，封邓王。开宝四年（971）奉使入宋，被宋太祖留居；南唐灭亡后归宋，封南楚国公。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 53
      defense: 17
      agility: 16
