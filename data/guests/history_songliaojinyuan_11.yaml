    default_gender: male
    archetype: military
    flavor: 石全彬，字长卿，真定府人，北宋宦官，石知颙之孙。其祖石知颙亦为北宋宦官，曾戍守河北沿边。石全彬由入内小黄门累迁西头供奉官。仁宗时张贵妃居宁华殿，命他提举殿阁；张贵妃死后追册为温成皇后。石全彬后任延福宫使、武信军节度观察留后，其卒年不详。
