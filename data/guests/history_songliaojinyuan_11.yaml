    name: 王守规
    default_gender: male
    archetype: civil
    flavor: 王守规，真定栾城人，北宋宦官，王守忠之弟。仁宗朝宫中夜火时及时引导仁宗出西华门，后历任内侍官，官至宣庆使、康州防御使、内侍右班副都知，卒赠昭武军留后。
    growth_range:
