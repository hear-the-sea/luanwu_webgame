    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 54
      defense: 21
      agility: 11
  - key: hist_songliaojinyuan_0576
    name: 滕宗谅
    default_gender: male
    archetype: military
    flavor: （991年—1047年）滕宗谅是北宋边臣，任庆州知州时整修城防、招辑流民，西北军政颇有成效。后又重修巴陵岳阳楼，请范仲淹作《岳阳楼记》，遂使一座楼、一篇文与其姓名一并流传。被记住的不只是文名缘分，也有实打实的治边政绩。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 13
      defense: 26
      agility: 19
