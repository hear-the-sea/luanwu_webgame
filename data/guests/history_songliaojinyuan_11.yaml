    default_gender: male
    archetype: civil
    flavor: 陈省华（939—1006），字善则，阆州阆中人，北宋大臣。长子陈尧叟、三子陈尧咨皆中状元，次子陈尧佐亦进士及第，兄弟三人相继登科，世称“三陈”。陈尧叟、陈尧佐后来皆位至宰相；陈尧咨即欧阳修《卖油翁》中的陈康肃公，以善射自负。陈省华本人历任县令及中央官职，教子有方，景德三年（1006）卒。
