    name: 刘承珪
    default_gender: male
    archetype: civil
    flavor: 刘承珪（后改名刘承规，949—1012），字大方，楚州山阳人，北宋宦官。历事太祖、太宗、真宗，掌内藏库及宫苑营造，参与编修实录、国史、《册府元龟》，卒谥忠肃。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 52
      defense: 20
      agility: 17
