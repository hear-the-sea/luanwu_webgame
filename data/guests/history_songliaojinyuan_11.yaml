  green:
  - key: hist_songliaojinyuan_0496
    name: 巢谷
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）巢谷是北宋蜀人，早年弃文习武，与苏轼、苏辙兄弟交厚。苏氏南谪岭海后，他不顾年老路远，执意南下探访，最后病死新州道中。正史与文集记住他的原因，不在官位高下，而在危难之际仍肯赴千里之行的义气。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 56
      defense: 17
      agility: 14
  - key: hist_songliaojinyuan_0497
    name: 孔延龄
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）孔延龄为宋代孔子后裔，名字多见于朝廷优礼孔门、维持曲阜奉祀的记录。宋廷不断以赐爵、赐田、修庙和整饬祀典来巩固孔氏宗主地位，他正是这一套礼制运作中的人物。后世记其名，主要是因其身处宋代尊孔制度的核心脉络。
    growth_range:
    - 3
    - 6
    attribute_weights:
      force: 11
      intellect: 53
      defense: 23
      agility: 13
  - key: hist_songliaojinyuan_0498
    name: 孔端立
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）孔端立为宋代孔氏后裔，相关记载主要见于袭封、奉祀与修葺庙学等孔门事务。宋朝尊崇孔子，不只停在诏书文字，还要靠曲阜孔氏承祀、主持祭礼，他的名字便在这些具体事务中被保存下来。此类人物虽少战功政绩，却是礼制传承不可缺的一环。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 55
      defense: 16
      agility: 18
  - key: hist_songliaojinyuan_0499
