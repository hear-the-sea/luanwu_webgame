    flavor: 赵崇韬，五代后蜀将领。孟昶在位时设殿直四番，他以都知统领其中。剑门扼入蜀陆路，宋军王全斌部自北路伐蜀，蜀军节节败退，赵崇韬奉命守剑门，兵败被擒。乾德三年（965）孟昶出降，他随旧主东迁汴京，入宋后事迹不显。
