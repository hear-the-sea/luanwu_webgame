heroes:
  blue:
  - key: hist_songliaojinyuan_0502
    name: 喻皓
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）喻皓是北宋著名都料匠，以营造术闻名。开封开宝寺塔常与其名相连，沈括《梦溪笔谈》还记下他解释木塔“似倾而正”的构造道理。其所著《木经》虽已失传，却长期被视作宋代营造法的重要源头。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 54
      defense: 21
      agility: 11
  - key: hist_songliaojinyuan_0576
    name: 滕宗谅
    default_gender: male
    archetype: military
    flavor: （991年—1047年）北宋官员，字子京。滕宗谅任庆州知州时整修城防、招抚流民；调任巴陵后重修岳阳楼，请范仲淹作《岳阳楼记》，后任苏州知州，病逝于任上。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 13
      defense: 26
      agility: 19
  green:
  - key: hist_songliaojinyuan_0552
    name: 焦赞
    default_gender: male
    archetype: military
    flavor: （生卒年不详）北宋将领，正史记载较少。杨家将演义把焦赞写成杨业部下，常与孟良并称，负责冲阵破围；其官职、战绩和生卒年缺乏可靠史料。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 47
      intellect: 16
      defense: 23
      agility: 14
  - key: hist_songliaojinyuan_0496
    name: 巢谷
    default_gender: male
    archetype: civil
    flavor: 巢谷，字元修，眉州眉山人，北宋士人。少举进士，后弃文习武，曾游秦凤、泾原，与韩存宝交好并教兵书。苏轼、苏辙谪居岭海时，他年逾七十徒步往访，途中病逝于新会。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 56
      defense: 17
      agility: 14
  - key: hist_songliaojinyuan_0497
    name: 孔延龄
    default_gender: male
    archetype: civil
    flavor: 孔延龄，北宋兖州曲阜人，孔子四十五代孙，孔仁玉之孙、孔冕之子。宋真宗大中祥符元年（1008）封禅泰山时至阙里祭孔，曲阜因此改名仙源县，后任太常博士、知仙源县事。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 53
      defense: 23
      agility: 13
  - key: hist_songliaojinyuan_0498
    name: 孔端立
    default_gender: male
    archetype: civil
    flavor: 孔端立，字子植，北宋末金初曲阜人，孔子四十八代孙，衍圣公孔宗愿之孙、孔若愚第四子。孔端操于1133年去世后，他一度权主祀事；金熙宗天眷三年改立孔璠袭封衍圣公，端立五十五岁卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 55
      defense: 16
      agility: 18
  - key: hist_songliaojinyuan_0499
    name: 孔若愚
    default_gender: male
    archetype: civil
    flavor: 孔若愚，字公直，北宋曲阜人，孔子四十七代孙，衍圣公孔宗愿第三子，孔若蒙、孔若虚之弟。一生未仕，以儒士身份居家，五十四岁卒；其子孔端立后来一度权主孔氏祀事。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 57
      defense: 18
      agility: 14
  - key: hist_songliaojinyuan_0500
    name: 刘永年
    default_gender: male
    archetype: civil
    flavor: 刘永年，字君锡，北宋外戚，益州华阳人，定籍太原，刘美之孙、刘从德之子。四岁授内殿崇班，历任廉州团练使、陕西都监、皇城司干办等，曾任使契丹副使并参与平定地方叛乱。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 17
      intellect: 50
      defense: 21
      agility: 12
  - key: hist_songliaojinyuan_0501
    name: 王仁睿
    default_gender: male
    archetype: civil
    flavor: 王仁睿，北宋宦官，宋太宗潜邸旧人。太宗即位后历任内小底都知、洛苑副使，掌理宫中财用；曾参与查办秦王赵廷美相关案件，卒年四十一，追赠内侍官职。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 52
      defense: 22
      agility: 15
  - key: hist_songliaojinyuan_0503
    name: 吴仁裕
    default_gender: male
    archetype: civil
    flavor: 吴仁裕，北宋人物，后迁居高丽。高丽成宗时期渡海入仕，任军器监，后定居海州，其后裔在高丽延续。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 17
      intellect: 50
      defense: 17
      agility: 16
  - key: hist_songliaojinyuan_0504
    name: 孔端操
    default_gender: male
    archetype: civil
    flavor: 孔端操，北宋末南宋初曲阜人，孔子四十八代孙，孔宗愿之孙、孔若蒙次子。1128年孔端友南渡后留守金占曲阜的孔林、孔庙，曾获金廷免赋；1132年受伪齐授为权袭衍圣公，次年卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 51
      defense: 19
      agility: 14
  - key: hist_songliaojinyuan_0505
    name: 王景绝
    default_gender: male
    archetype: civil
    flavor: 王景绝，太原人，五代至北宋初人物。少游燕、赵，曾入潞州幕府；后不复为吏，搜集四方书籍，晚年藏书数千卷。北汉亡后入宋，宋太宗端拱年间卒于汴京。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 52
      defense: 20
      agility: 15
  - key: hist_songliaojinyuan_0506
    name: 陈太初
    default_gender: male
    archetype: civil
    flavor: 陈太初，眉山人，北宋人物。幼年与苏轼同从道士张易简读书，曾任郡小吏；后学道隐居，苏轼谪黄州时听闻其已在汉中“尸解”。其事主要见《东坡志林》，带有道教传说色彩。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 51
      defense: 23
      agility: 12
  - key: hist_songliaojinyuan_0508
    name: 窦贞固
    default_gender: male
    archetype: civil
    flavor: 窦贞固（892—969），字体仁，白水人，五代至北宋初大臣，窦专之子。历仕后唐、后晋、后汉、后周，官至司徒、门下侍郎同平章事；入宋后封沂国公。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 17
      agility: 13
  - key: hist_songliaojinyuan_0510
    name: 范世京
    default_gender: male
    archetype: civil
    flavor: 范世京，字延祖，苏州长洲人，北宋官员，范师道之子。皇祐五年（1053）进士，历柘城主簿、历阳令、海盐知县，以孝养父母闻名，官至秘书丞致仕，四十一岁卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 17
      intellect: 57
      defense: 22
      agility: 4
  - key: hist_songliaojinyuan_0511
    name: 范墉
    default_gender: male
    archetype: civil
    flavor: 范墉，吴越国旧臣，北宋官员，范仲淹之父。太平兴国三年（978）随吴越王钱俶归宋，入宋后任武宁军节度掌书记；其子范仲淹后来成为北宋名臣。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 52
      defense: 20
      agility: 14
  - key: hist_songliaojinyuan_0513
    name: 范正平
    default_gender: male
    archetype: civil
    flavor: 范正平，字子夷，北宋官员，范纯仁长子、范仲淹之孙。曾任开封府界官，因蔡京排挤及替弟承担罪责被贬；著《荀里退居编》，宣和末至南宋初追赠直秘阁。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 53
      defense: 22
      agility: 12
  - key: hist_songliaojinyuan_0514
    name: 范正思
    default_gender: male
    archetype: civil
    flavor: 范正思（1051—1108），字子思（一作子默），苏州吴县人，范纯仁次子、范仲淹之孙。服父丧十年，官至朝奉郎、武骑尉，著有《惜羞集》《纂忠宣言行录》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 54
      defense: 22
      agility: 10
  - key: hist_songliaojinyuan_0515
    name: 范正民
    default_gender: male
    archetype: civil
    flavor: 范正民，字子政（一作子正），苏州吴县人，范纯仁长子、范仲淹之孙。以荫补单州团练推官，年三十余卒；博学有文，曾有文集百卷，后毁于兵火。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 53
      defense: 21
      agility: 12
  - key: hist_songliaojinyuan_0517
    name: 范直筠
    default_gender: male
    archetype: civil
    flavor: 范直筠，字端伯，苏州吴县人，后迁乐平，范正国长子、范仲淹曾孙。南宋乾道元年（1165）曾请扬无咎作梅花图，后世据此考见其范氏家世及书画交游。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 51
      defense: 20
      agility: 18
  - key: hist_songliaojinyuan_0519
    name: 范纯礼
    default_gender: male
    archetype: civil
    flavor: 范纯礼（1031—1106），字彝叟，苏州吴县人，范仲淹第三子。历知遂州，任京西转运副使、发运使等；元祐初入为给事中，徽宗时知开封府、任尚书右丞，后谪居，卒谥恭献。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 56
      defense: 20
      agility: 13
  - key: hist_songliaojinyuan_0521
    name: 范纯佑
    default_gender: male
    archetype: civil
    flavor: 范纯佑（1024—1063），苏州吴县人，范仲淹长子。师从胡瑗，通兵书、道家之学，曾随父守御西夏，庆历二年参与在庆州修筑大顺城；四十岁病逝，子范正臣。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 17
      intellect: 50
      defense: 18
      agility: 15
  - key: hist_songliaojinyuan_0522
    name: 范雩
    default_gender: male
    archetype: civil
    flavor: 范雩，字伯达，苏州吴县人，北宋进士，范成大之父。宣和六年（1124）进士，南宋任秘书省正字、校书郎、玉牒所检讨、秘书郎，绍兴十三年（1143）致仕，著《禹稷颜回同道论》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 56
      defense: 21
      agility: 9
  - key: hist_songliaojinyuan_0523
    name: 葛胜仲
    default_gender: male
    archetype: civil
    flavor: 葛胜仲（1072—1144），字鲁卿，丹阳人，北宋末南宋初官员、词人。绍圣四年进士，历知湖州、邓州等，官至显谟阁待制；曾奉诏续《太常因革礼》，著有《丹阳集》，谥文康。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 54
      defense: 22
      agility: 13
