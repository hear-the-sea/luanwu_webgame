    flavor: 全师雄，后蜀旧将，曾任文州刺史。乾德三年（965）宋军平蜀，主帅王全斌约束不严，降卒怨愤，拥全师雄为首起兵，蜀中州县多被卷入。宋廷调集入蜀诸军分路进讨，至乾德四年（966）乱平。全师雄在作战中中箭，退至金堂，因伤重而死。
