    default_gender: male
    archetype: civil
    flavor: 张可久，字小山，庆元人，元代散曲家，清丽派代表。长期任小吏，仕途不显；散曲作品今存甚多，后人辑为《小山乐府》，与乔吉并称“张乔”。
    growth_range:
