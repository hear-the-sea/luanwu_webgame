    name: 张禧
    default_gender: male
    archetype: military
    flavor: 张禧（约1217—1291），安次人，元初将领。参与攻取樊城、襄阳，授水军万户；后随元军渡江作战，官至昭勇大将军，所部以军纪严整著称。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
