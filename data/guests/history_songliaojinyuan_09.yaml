    default_gender: male
    archetype: civil
    flavor: （1231年—1280年）元代大臣，维吾尔族，字善甫。廉希宪早年入忽必烈幕府，参与平定阿里不哥，历任中书平章政事、云南平章，反对滥杀，至元十七年病逝。
    growth_range:
