    default_gender: male
    archetype: civil
    flavor: 杨惟中（1205—1259），字彦诚，弘州人，蒙古帝国大臣。参与攻宋时搜求儒士与经书，建太极书院并聘赵复讲学；历任中书令等职，推动蒙古政权吸收中原典章。
    growth_range:
