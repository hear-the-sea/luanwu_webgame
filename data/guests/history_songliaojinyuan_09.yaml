    default_gender: male
    archetype: civil
    flavor: 贯云石（1286—1324），维吾尔族，号酸斋，元代散曲家、诗人。作品有《酸斋乐府》，与号甜斋的徐再思齐名，后人合辑二人散曲为《酸甜乐府》。
    growth_range:
