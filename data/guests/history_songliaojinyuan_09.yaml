    name: 李璮
    default_gender: male
    archetype: military
    flavor: 李璮（？—1262），潍州人，元初山东益都世侯。中统三年（1262）起兵反元，将海州、涟水等地献给南宋；后据济南抵抗，城破被杀，其乱促使元廷削弱汉人世侯兵权。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
