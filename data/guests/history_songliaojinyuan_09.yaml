    default_gender: male
    archetype: civil
    flavor: 赵复（？—约1256），字仁甫，德安人，宋末元初理学家。1235年被蒙古军俘获，北上后讲授程朱理学，编《传道图》《希贤录》《师友图》等，推动理学北传。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
