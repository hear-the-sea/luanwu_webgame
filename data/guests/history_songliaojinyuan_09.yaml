    default_gender: male
    archetype: civil
    flavor: 虞集（1272—1348），字伯生，号道园，元代文学家、学者。任奎章阁侍书学士，参与编修《经世大典》；与杨载、范梈、揭傒斯并称元诗四大家，著《道园学古录》。
    growth_range:
    - 3
    - 7
    attribute_weights:
