    default_gender: male
    archetype: civil
    flavor: 郑德辉，即郑光祖，平阳人，元代杂剧、散曲作家，元曲四大家之一。曾任杭州路吏，代表作有《倩女离魂》《王粲登楼》，散曲今存小令六首、套数二套。
    growth_range:
