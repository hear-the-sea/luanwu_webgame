    name: 阿合马
    default_gender: male
    archetype: civil
    flavor: 阿合马（？—1282），元朝色目大臣，忽必烈朝长期主持财政。整顿税制、推行专卖与交钞，增加国用；因苛征和专权引发怨恨，至元十九年被王著刺杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
