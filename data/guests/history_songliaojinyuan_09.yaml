    default_gender: male
    archetype: civil
    flavor: 杨载（1271—1323），字仲弘，浦城人，元代进士、诗人。参与修《武宗实录》，著《诗法家数》《杨仲宏集》等，与虞集、范梈、揭傒斯并称元诗四大家。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
