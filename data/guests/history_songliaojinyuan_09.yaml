    default_gender: male
    archetype: civil
    flavor: 纪君祥，元代大都人，杂剧作家。著有《赵氏孤儿冤报冤》，简称《赵氏孤儿》，取材于《左传》《史记》等关于赵氏孤儿的记载，是其现存代表作。
    growth_range:
