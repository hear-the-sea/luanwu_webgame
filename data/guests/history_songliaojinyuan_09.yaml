    name: 乔吉
    default_gender: male
    archetype: civil
    flavor: 乔吉（约1280—1345），字梦符，号笙鹤翁，太原人，寓居杭州，元代杂剧、散曲作家。著有《两世姻缘》等杂剧，散曲清丽，与张可久并称“张乔”。
    growth_range:
    - 3
    - 7
    attribute_weights:
