    default_gender: male
    archetype: civil
    flavor: 范梈（1272—1330），字亨父，又字德机，清江人，元代诗人。工于诗，与虞集、杨载、揭傒斯齐名，被誉为元诗四大家之一。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
