    default_gender: male
    archetype: military
    flavor: 董文炳（1217—1278），字彦明，真定藁城人，元初将领。参与攻宋，至元十三年（1276）率军进临安并受降宋恭帝，后任江淮行省平章政事等职。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
