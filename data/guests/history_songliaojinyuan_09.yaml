    name: 海都
    default_gender: male
    archetype: military
    flavor: 海都（约1235—1301），窝阔台之孙，窝阔台系诸王领袖。阿里不哥败后联合察合台系诸王长期与元廷对抗，曾进逼和林；大德五年（1301）与元军交战后负伤而死。
