    name: 张柔
    default_gender: male
    archetype: military
    flavor: 张柔（1190—1268），字德刚，易州定兴人，金末元初将领。金末组织乡兵，后归附蒙古，参与灭金并攻破汴京，收得《金实录》；元初为汉军世侯，其子张弘范亦为元将。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0420
    name: 严实
    default_gender: male
    archetype: military
    flavor: 严实（1182—1240），字武叔，金末元初汉人世侯。金兴定年间任长清令，后归附蒙古，统辖东平等地，拥有军民财权；蒙古建汉军后，其部隶属史天泽。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
