    name: 姚枢
    default_gender: male
    archetype: civil
    flavor: 姚枢（1203—1280），字公茂，营州柳城人，元初政治家、理学家。曾任蒙古军前书记，后辅佐忽必烈，荐举许衡、郝经等儒士，参与元初典制建设。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0427
