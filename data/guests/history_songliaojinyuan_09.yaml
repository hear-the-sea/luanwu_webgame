    default_gender: male
    archetype: civil
    flavor: 郝经（1223—1275），字伯常，泽州陵川人，元初学者、使臣。中统元年（1260）奉命出使南宋，至真州后被贾似道扣留十六年；获释北归后病卒，著有《陵川集》《续后汉书》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
