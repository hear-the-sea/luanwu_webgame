    archetype: civil
    flavor: 张可久，字小山，庆元人，元代散曲家，清丽派代表。一生仕途不显，仅任路吏、桐庐典史等微职，晚年寓居杭州。今存小令八百余首、套数九套，为元散曲作家中存作最多者，后人辑为《小山乐府》。其作多写山水、怀古与酬赠，讲究格律词藻，与乔吉并称“张乔”。
