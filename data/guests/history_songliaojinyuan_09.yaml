    name: 窦默
    default_gender: male
    archetype: civil
    flavor: 窦默（1196—1280），字汉卿，金末元初医家、理学家。精通针灸与医术，兼传程朱理学，受忽必烈召用；至元十七年加昭文馆大学士。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
