    default_gender: male
    archetype: civil
    flavor: 揭傒斯（1274—1344），字曼硕，龙兴富州人，元代文学家、书法家、史学家。历任翰林待制、集贤学士，著《揭文安公集》，与虞集、杨载、范梈并称元诗四大家。
    growth_range:
