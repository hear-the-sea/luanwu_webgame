    default_gender: male
    archetype: military
    flavor: 乃颜（？—1287），成吉思汗弟别里古台的后裔，东道蒙古宗王。至元二十四年（1287）起兵反元，忽必烈亲征后在辽东战败，被处死；其乱促使元廷加强对东道诸王的控制。
