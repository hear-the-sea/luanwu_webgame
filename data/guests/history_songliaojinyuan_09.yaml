    name: 徐再思
    default_gender: male
    archetype: civil
    flavor: 徐再思（约1280—1330），字德可，号甜斋，元代散曲家。作品清丽，多作小令；其《甜斋乐府》与贯云石《酸斋乐府》因字号相对，后人合辑为《酸甜乐府》。
    growth_range:
