    default_gender: male
    archetype: military
    flavor: （1212年—1275年）南宋将领，后降元。刘整向忽必烈建议先取襄阳、樊城，并在元军中训练水军、建造战船；襄阳陷落后，他任万户，继续参加元军南征。
