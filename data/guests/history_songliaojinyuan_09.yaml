    default_gender: male
    archetype: civil
    flavor: 孛儿只斤·图帖睦尔（1304—1332），元文宗，两度即位。崇尚汉学，设奎章阁，命儒臣编修《经世大典》；其在位时权臣燕帖木儿执政，朝局受到牵制。
