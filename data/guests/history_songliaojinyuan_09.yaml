heroes:
  blue:
  - key: hist_songliaojinyuan_0411
    name: 孛儿只斤·铁穆耳
    default_gender: male
    archetype: military
    flavor: （1265年-1307年）元成宗，忽必烈之孙。他在位期间停止对外扩张，与各汗国修好。"成宗之治"使元朝获得短暂太平。孛儿只斤·铁穆耳的军事表现通常放在宋辽金元之际攻守格局中审视，其得失与兵力组织、补给条件和战略窗口密切相关。研究孛儿只斤·铁穆耳时，战术层面的得失与政治层面的约束应被并列考察，二者缺一不可。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0413
    name: 孛儿只斤·爱育黎拔力八达
    default_gender: male
    archetype: civil
    flavor: （1285年-1320年）元仁宗，元朝第四位皇帝。他推行汉化，恢复科举，是元朝最有文化修养的皇帝。孛儿只斤·爱育黎拔力八达的政策选择不能孤立理解，必须结合当时财政压力、边疆局势与朝局互动来判断。相关研究与通俗叙述至今仍常把其作为典型案例。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0415
    name: 孛儿只斤·妥懽帖睦尔
    default_gender: male
    archetype: military
    flavor: （1320年-1370年）元顺帝，元朝末代皇帝。他在位时期红巾军起义爆发，最终退出大都，元朝灭亡。评估孛儿只斤·妥懽帖睦尔的施政取向，需同时放进财政、边防与权力结构等条件中考察，才不至于失真。其生平与作品也因此在相关领域持续被引用与讨论。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0416
    name: 安童
    default_gender: male
    archetype: civil
    flavor: （1245年-1293年）元朝名相，木华黎的曾孙。他辅佐忽必烈三十年，是元朝政治的核心人物。观察安童的行动轨迹，往往能同步看见当时制度与社会结构的转向。安童的生平与宋辽金元之际制度环境关系紧密，其选择往往折射出官僚体系的真实运行边界。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0417
    name: 史天泽
    default_gender: male
    archetype: military
    flavor: （1202年-1275年）元朝名将，汉军世侯。他率军攻灭南宋，统一天下。他是元朝汉人将领中地位最高的人物。史天泽的军事表现通常放在宋辽金元之际攻守格局中审视，其得失与兵力组织、补给条件和战略窗口密切相关。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0421
    name: 刘整
    default_gender: male
    archetype: military
    flavor: （1212年-1275年）南宋降将，元朝水军统帅。他向忽必烈建议"欲灭南宋，先取襄阳"，是元朝水军的创建者。刘整的军事表现通常放在宋辽金元之际攻守格局中审视，其得失与兵力组织、补给条件和战略窗口密切相关。从比较视角看，刘整的行动路径可用于检验同类将领在相近压力下的应对差异。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0431
    name: 廉希宪
    default_gender: male
    archetype: civil
    flavor: （1231年-1280年）元朝名臣，维吾尔族。他推行汉法，辅佐忽必烈平定阿里不哥。他是元朝多民族融合的典范。廉希宪相关材料不断被后人调用，主要因为它为观察宋辽金元之际政治文化与社会心理提供了清晰入口。廉希宪的行为逻辑常被放在宋辽金元之际制度环境中解读，由此可见个人选择与结构约束的双向牵引。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0409
    name: 海都
    default_gender: male
    archetype: military
    flavor: （1235年-1301年）窝阔台之孙，窝阔台汗国实际创立者。至元六年于塔剌速河畔称汗，联合察合台系诸王与元廷对抗三十年，兵锋曾抵和林。大德五年与元军交战中负伤而卒，汗国随之瓦解。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0410
    name: 乃颜
    default_gender: male
    archetype: military
    flavor: 乃颜（?-1287年），蒙古宗室，成吉思汗弟铁木哥斡赤斤后裔，封地在大兴安岭以东。至元二十四年（1287年）联合海都等西北诸王叛乱，忽必烈亲征，乃颜兵败于辽河上游，被处死。其叛乱暴露了元廷对东道诸王控制之薄弱。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0412
    name: 孛儿只斤·海山
    default_gender: male
    archetype: military
    flavor: （1281年-1311年）元武宗，答剌麻八剌之子。大德年间出镇漠北，屡败海都、笃哇。成宗崩，得爱育黎拔力八达与哈剌哈孙之助继位。在位滥赏宿卫，设尚书省推行至大钞法，财用日绌。至大四年正月病卒，在位仅三年有余。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0414
    name: 孛儿只斤·图帖睦尔
    default_gender: male
    archetype: civil
    flavor: 孛儿只斤·图帖睦尔，元文宗，两度登基。其人通汉学，建奎章阁，命儒臣纂修《经世大典》。在位期间权臣燕帖木儿专权，天灾频仍，实政建树有限；兄弟继承与皇位争夺，也使其身后评价颇为复杂。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0418
    name: 董文炳
    default_gender: male
    archetype: military
    flavor: （1217年-1278年）元朝名将，攻灭南宋的功臣。他率军攻克临安，俘获宋恭帝。他是灭宋战争的主力将领。董文炳所作决断并非孤立行为，而是内政派系与外部形势共同作用的产物。董文炳的相关记述并非单声道文本，恰因保留多方视角，才更便于比较官修叙事与后世议论的偏向。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0419
    name: 张柔
    default_gender: male
    archetype: military
    flavor: 张柔（1190-1268年），易州定兴人。金末组织乡兵自保，后降蒙古，授行军万户。参与灭金之战，破汴京，取《金实录》北归。后随忽必烈攻鄂州，有功。为元初汉军世侯之一，其子张弘范统兵灭宋。史籍记载有限，后世评价多分歧。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0420
    name: 严实
    default_gender: male
    archetype: military
    flavor: （1182年-1240年）元朝汉军世侯，山东大将。他投靠蒙古后镇守山东，是蒙古统治北方的重要力量。严实所面对的并非单纯兵力对抗，还包括补给、地理与盟友稳定性的复合压力。严实相关史料之所以常被引用，在于其个案能够同时呈现前线压力与后方治理的联动关系。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0422
    name: 张禧
    default_gender: male
    archetype: military
    flavor: （1222年-1293年）东安州人，元初将领。从伯颜攻宋，参与襄樊之战，率水军断宋人江面联络。至元十一年渡江，丁家洲之战领舟师力战。宋亡后驻守沿江，官至昭勇大将军。史称其驭军严整，所部秋毫无犯。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0423
    name: 郭侃
    default_gender: male
    archetype: military
    flavor: 郭侃（1217-1277年），华州郑县人，唐汾阳王郭子仪后裔。幼年由史天泽养大，后随旭烈兀西征，参与攻陷巴格达（1258年），又攻取叙利亚诸城。中统年间归朝，官至万户。其西征事迹汉文史料记载简略。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0424
    name: 李璮
    default_gender: male
    archetype: military
    flavor: 李璮（？—1262），元初汉军世侯，据山东益都一带。中统三年举兵反元，转而联络南宋，旋被史天泽等围困于济南，兵败被杀。其乱使忽必烈加速削夺汉人世侯兵权，成为元初中央集权过程中的关键事件。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0425
    name: 王文统
    default_gender: male
    archetype: civil
    flavor: （1190年-1262年）益都人，李璮岳丈。元初任中书平章政事，主理国家财政。中统三年李璮反元，文统因通谋事泄，被忽必烈处死。其整顿盐课、推行交钞之策，虽济国用于一时，然身陷逆案，终归覆灭。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0426
    name: 姚枢
    default_gender: male
    archetype: civil
    flavor: 姚枢（1203-1280年），营州柳城人。初为蒙古军前书记，后弃官隐居苏门山，钻研程朱理学。忽必烈召入幕府，上书言治国之道，荐许衡、郝经等儒士。历任中书左丞、翰林学士承旨，参与制定元初典制。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0427
    name: 郝经
    default_gender: male
    archetype: civil
    flavor: 郝经（1223—1275），字伯常，泽州陵川人。元世祖即位，充国信使出使南宋。至真州，被贾似道扣留十六年，系狱不屈，读书著述不辍。至元十二年宋元议和，始得北归，未几病卒。著有《陵川集》《续后汉书》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0428
    name: 窦默
    default_gender: male
    archetype: civil
    flavor: （1196年-1280年）元朝名医，理学家。他精通医术，又传播程朱理学，是元初文化界的重要人物。若只看单一维度容易低估窦默，其意义更体现在文本、立场与时代的交叉点上。学界持续关注窦默，核心原因在于其作品既可做文学分析，也可支撑历史语境解读。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0429
    name: 赵复
    default_gender: male
    archetype: civil
    flavor: （1189年-1256年）元朝儒士，北方理学的传播者。他将程朱理学传入北方，被称为"北方理学的播种者"。从人物史角度看，赵复的经历兼具代表性与特殊性，适合用于说明时代结构与个人命运的交错。把赵复放入同代写作谱系考察，可更直观地辨认其风格位置与叙事贡献。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0430
    name: 杨惟中
    default_gender: male
    archetype: civil
    flavor: 杨惟中（1205年—1259年），字彦诚，弘州人。金末归附蒙古，后为忽必烈潜邸旧臣，向忽必烈讲授儒家经典，对忽必烈推行汉法有一定影响。元宪宗时曾任中书令等职，参与经略中原事务。其生平记载较为简略，具体事迹多不可详考。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0432
    name: 阿合马
    default_gender: male
    archetype: civil
    flavor: （？—1282年）元朝理财大臣，色目人。忽必烈时主持财政约二十年，整顿税制、增设课税，国库虽充而民怨日深。至元十九年，千户王著矫诏将其刺杀于大都。其理财之术虽效于一时，却加剧了元廷与汉地的紧张。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0433
    name: 卢世荣
    default_gender: male
    archetype: civil
    flavor: 卢世荣（？—1285），元世祖时理财大臣。阿合马死后受命主持财政，推行盐铁专卖、立市易司、整治钞法，因触动权贵利益遭弹劾，至元二十二年被诛。史籍对其具体施政记载有限。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0434
    name: 桑哥
    default_gender: male
    archetype: civil
    flavor: （?-1291年）元朝权臣，吐蕃人。他主持财政改革，搜刮民财，最终被处死。他是元朝理财官员的典型命运。把桑哥放回当时语境，会发现其写作与处世并行演变，文体与思想并不是分离的两条线。对桑哥的持续讨论说明，其材料既具叙事价值，也具备方法论上的比较价值。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0435
    name: 虞集
    default_gender: male
    archetype: civil
    flavor: 虞集（1272—1348），字伯生，号道园，祖籍仁寿，侨居临川。以荐授大都路儒学教授，累官至奎章阁侍书学士。与杨载、范梈、揭傒斯并称"元诗四大家"。诗文典雅精丽，为元文坛领袖。曾预修《经世大典》。有《道园学古录》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0436
    name: 揭傒斯
    default_gender: male
    archetype: civil
    flavor: （1274年-1344年）元朝文学家，"元诗四大家"之一。他的诗歌清新自然，散文亦有盛名。揭傒斯留下的表达范式被后世反复激活，使其在文学传统中始终保持可见度。从接受史角度看，其影响并非线性扩散，而是多次被重释后重新进入主流叙述。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0437
    name: 范梈
    default_gender: male
    archetype: civil
    flavor: （1272年-1330年）元朝诗人，"元诗四大家"之一。他的诗歌雄浑豪放，继承了杜甫的传统。评价范梈时，往往需要把作品风格、思想立场与身处时局放在同一框架里观察。若把范梈与同类作者并观，更能看出其笔法侧重与叙事重心的独到之处。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0438
    name: 杨载
    default_gender: male
    archetype: civil
    flavor: 杨载（1271—1323），字仲弘，浦城人，元诗四大家之一。其诗格律严谨、风骨遒劲，虞集评其诗如"百战健儿"。代表作有《宗阳宫望月》等。曾官至宁国路总管府推官，有《杨仲弘集》传世。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0439
    name: 萨都剌
    default_gender: male
    archetype: civil
    flavor: 萨都剌（约1272—？），字天锡，号直斋，回回人。泰定四年进士，历官江南诸道行台侍御史等。以诗词名世，词风豪放雄浑，《念奴娇·登石头城》《满江红·金陵怀古》尤负盛名。有"元词第一人"之誉。晚年寓居杭州。有《雁门集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0440
    name: 张可久
    default_gender: male
    archetype: civil
    flavor: 张可久，字小山，庆元（今浙江宁波）人，约生于至元年间，卒于至正年间。以路吏转首领官，仕途不显，足迹多在江南。一生专力散曲创作，今存小令八百五十余首、套数九套，为元人存曲最多者。曲风清丽典雅，与乔吉齐名，世称"张乔"。有《小山乐府》传世。生平细节留存不多，多赖其曲作自述推测。
    growth_range:
