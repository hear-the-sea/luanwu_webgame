    name: 王文统
    default_gender: male
    archetype: civil
    flavor: 王文统，元初政治人物，李璮幕僚并为其岳父。曾任中书平章政事，主持财政，推行盐课、交钞等改革；中统三年李璮反元后，因涉嫌通谋被忽必烈处死。
    growth_range:
