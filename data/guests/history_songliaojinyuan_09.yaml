    default_gender: male
    archetype: civil
    flavor: 萨都剌，字天锡，号直斋，元代色目诗人、画家、书法家，一说为回回人。泰定四年进士，历官江南诸道行台侍御史等，著有《雁门集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
