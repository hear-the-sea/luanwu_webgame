    name: 郭侃
    default_gender: male
    archetype: military
    flavor: 郭侃（1217—1277），字仲和，华州郑县人，元初汉人将领。随旭烈兀西征，参与攻陷巴格达及进攻叙利亚诸城；归朝后任万户，官至陕西行省平章政事。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
