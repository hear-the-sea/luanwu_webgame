    default_gender: male
    archetype: civil
    flavor: 睢景臣，字景贤，元代散曲、杂剧作家。现存散曲以套曲《哨遍·高祖还乡》最为知名，借乡民视角描写刘邦还乡，具有讽刺意味。
    growth_range:
