    default_gender: male
    archetype: military
    flavor: （1202年—1275年）元代汉军将领，真定史氏首领。史天泽早年随蒙古军攻金，后参加襄阳、樊城和临安战事；元世祖时任中书右丞相，主持汉地军政，死后追封镇阳王。
