    default_gender: male
    archetype: civil
    flavor: 卢世荣（？—1285），元世祖时期理财官。阿合马死后主持财政，提出盐法、贸易、钞法等改革；因触犯权贵遭弹劾，至元二十二年被处死。
    growth_range:
