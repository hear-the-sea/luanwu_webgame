    default_gender: male
    archetype: civil
    flavor: 桑哥（？—1291），藏族，元朝宰相。忽必烈时主持财政，整顿钱粮、推行改革；因专权、征敛等遭弹劾，至元二十八年被处死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
