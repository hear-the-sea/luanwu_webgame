heroes:
  blue:
  - key: hist_songliaojinyuan_0411
    name: 孛儿只斤·铁穆耳
    default_gender: male
    archetype: military
    flavor: （1265年-1307年）元成宗，忽必烈之孙。他在位期间停止对外扩张，与各汗国修好。"成宗之治"使元朝获得短暂太平。孛儿只斤·铁穆耳的军事表现通常放在宋辽金元之际攻守格局中审视，其得失与兵力组织、补给条件和战略窗口密切相关。研究孛儿只斤·铁穆耳时，战术层面的得失与政治层面的约束应被并列考察，二者缺一不可。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0413
    name: 孛儿只斤·爱育黎拔力八达
    default_gender: male
    archetype: civil
    flavor: （1285年-1320年）元仁宗，元朝第四位皇帝。他推行汉化，恢复科举，是元朝最有文化修养的皇帝。孛儿只斤·爱育黎拔力八达的政策选择不能孤立理解，必须结合当时财政压力、边疆局势与朝局互动来判断。相关研究与通俗叙述至今仍常把其作为典型案例。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0415
    name: 孛儿只斤·妥懽帖睦尔
    default_gender: male
    archetype: military
    flavor: （1320年-1370年）元顺帝，元朝末代皇帝。他在位时期红巾军起义爆发，最终退出大都，元朝灭亡。评估孛儿只斤·妥懽帖睦尔的施政取向，需同时放进财政、边防与权力结构等条件中考察，才不至于失真。其生平与作品也因此在相关领域持续被引用与讨论。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0416
    name: 安童
    default_gender: male
    archetype: civil
    flavor: （1245年-1293年）元朝名相，木华黎的曾孙。他辅佐忽必烈三十年，是元朝政治的核心人物。观察安童的行动轨迹，往往能同步看见当时制度与社会结构的转向。安童的生平与宋辽金元之际制度环境关系紧密，其选择往往折射出官僚体系的真实运行边界。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0417
    name: 史天泽
    default_gender: male
    archetype: military
    flavor: （1202年-1275年）元朝名将，汉军世侯。他率军攻灭南宋，统一天下。他是元朝汉人将领中地位最高的人物。史天泽的军事表现通常放在宋辽金元之际攻守格局中审视，其得失与兵力组织、补给条件和战略窗口密切相关。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0421
    name: 刘整
    default_gender: male
    archetype: military
    flavor: （1212年-1275年）南宋降将，元朝水军统帅。他向忽必烈建议"欲灭南宋，先取襄阳"，是元朝水军的创建者。刘整的军事表现通常放在宋辽金元之际攻守格局中审视，其得失与兵力组织、补给条件和战略窗口密切相关。从比较视角看，刘整的行动路径可用于检验同类将领在相近压力下的应对差异。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0431
    name: 廉希宪
    default_gender: male
    archetype: civil
    flavor: （1231年-1280年）元朝名臣，维吾尔族。他推行汉法，辅佐忽必烈平定阿里不哥。他是元朝多民族融合的典范。廉希宪相关材料不断被后人调用，主要因为它为观察宋辽金元之际政治文化与社会心理提供了清晰入口。廉希宪的行为逻辑常被放在宋辽金元之际制度环境中解读，由此可见个人选择与结构约束的双向牵引。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0409
    name: 海都
    default_gender: male
    archetype: military
    flavor: （1235年-1301年）窝阔台之孙，窝阔台系势力的实际领袖。至元六年在塔剌思河一带称汗后，海都联合察合台系诸王与元廷长期对抗，兵锋曾逼近和林；大德五年与元军交战负伤而死，汗国也随之松散。海都不是一场叛乱的匆匆过客，而是让蒙古帝国东西裂痕延续数十年的对手。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0410
    name: 乃颜
    default_gender: male
    archetype: military
    flavor: 乃颜（？—1287年），蒙古宗室，出自成吉思汗弟铁木哥斡赤斤一系，封地在大兴安岭以东。至元二十四年，他联合海都等诸王起兵，忽必烈亲征后，乃颜在辽河上游战败并被处死。宗王握有封地与部众，便有另立旗帜的本钱；乃颜之乱让元廷看见，帝国东道并不是一声诏令就能牢牢拴住的马。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0412
    name: 孛儿只斤·海山
    default_gender: male
    archetype: military
    flavor: （1281年-1311年）元武宗，答剌麻八剌之子。大德年间出镇漠北，曾与海都、笃哇交战；成宗去世后，在爱育黎拔力八达与哈剌哈孙支持下继位。海山在位时厚赏宿卫，设尚书省、推行至大钞法，虽有扩张财政与整顿权力的意图，却也使国用日绌。武功和花钱都很快，国库的马却没那么能跑。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0414
    name: 孛儿只斤·图帖睦尔
    default_gender: male
    archetype: civil
    flavor: 孛儿只斤·图帖睦尔，元文宗，两度登基。通汉学，建奎章阁，命儒臣纂修《经世大典》，试图用文治为蒙古皇权添一层典章外衣；但权臣燕帖木儿专权，天灾又频，实政受到牵制。兄弟继承与皇位争夺使他的帝位来得曲折，文治工程与政治亏欠也一起留在身后。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0418
    name: 董文炳
    default_gender: male
    archetype: military
    flavor: （1217年-1278年）元朝名将，参与灭宋战争，率军攻取临安并受降宋恭帝。董文炳的军功属于元军整体推进，也有他在江南战场上统兵、安抚与接管的具体作为；“灭宋功臣”四字很重，不能遮住被征服者的失国之痛。对元廷是功业，对南宋遗民却是断裂，这两种声音都应留在他的简介里。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0419
    name: 张柔
    default_gender: male
    archetype: military
    flavor: 张柔（1190—1268），易州定兴人。金末组织乡兵自保，后来归附蒙古，授行军万户；参与灭金，攻破汴京时还带回《金实录》，替后世保存了金朝史料。随后随忽必烈攻鄂州，成为元初汉军世侯之一；其子张弘范后来统兵灭宋。张柔的一生横跨金亡、元兴两场巨变，既有地方自保的现实，也有替新主开疆的选择。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0420
    name: 严实
    default_gender: male
    archetype: military
    flavor: （1182年-1240年）元初汉军世侯、山东将领，归附蒙古后长期镇守山东。严实既要领兵作战，也要在金宋旧地安置部众、维持粮道与地方秩序，是蒙古统治北方的重要支柱之一。世侯的刀能开城，真正难的是开城之后让人愿意继续种田、交粮、听令。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0422
    name: 张禧
    default_gender: male
    archetype: military
    flavor: （1222年-1293年）东安州人，元初将领。随伯颜攻宋时参与襄樊之战，率水军切断宋军江面联络；至元十一年渡江，又在丁家洲领舟师力战。宋亡后张禧驻守沿江，官至昭勇大将军，史称驭军严整、所部秋毫无犯。水战要快，接管要稳，他两样都不肯丢。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0423
    name: 郭侃
    default_gender: male
    archetype: military
    flavor: 郭侃（1217—1277），华州郑县人，唐汾阳王郭子仪后裔。幼年由史天泽抚养，后来随旭烈兀西征，参与攻陷巴格达，又攻取叙利亚诸城；中统年间归朝，官至万户。汉文史料对其西征细节较简略，但这位汉人将领把战马一路骑到两河流域，足见蒙古帝国的战场有多远。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0424
    name: 李璮
    default_gender: male
    archetype: military
    flavor: 李璮（？—1262），元初汉军世侯，据有山东益都一带。中统三年起兵反元，又联络南宋，旋被史天泽等围困于济南，兵败被杀。李璮之乱不仅是一个世侯的反叛，也使忽必烈加速削夺汉人世侯兵权；地方握兵过重，中央便会把每一座城都看成潜在的刀柄。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0425
    name: 王文统
    default_gender: male
    archetype: civil
    flavor: （1190年-1262年）益都人，李璮岳丈，元初任中书平章政事，主持财政。王文统整顿盐课、推行交钞，确曾让国用得到补充；中统三年李璮反元后，他因通谋嫌疑被忽必烈处死。理财能救一时的国库，却救不了卷入逆案的身家；岳家关系既给他权势，也成了最后的绳结。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0426
    name: 姚枢
    default_gender: male
    archetype: civil
    flavor: 姚枢（1203—1280），营州柳城人。早年任蒙古军前书记，后来弃官隐居苏门山，钻研程朱理学；忽必烈召入幕府后，他上书论治国，荐许衡、郝经等儒士，参与制定元初典制。姚枢把山林里的书卷带进蒙古王帐，试图让新帝国学会如何以文书而非只以弓马治理天下。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0427
    name: 郝经
    default_gender: male
    archetype: civil
    flavor: 郝经（1223—1275），字伯常，泽州陵川人。元世祖即位后出使南宋，至真州便被贾似道扣留，十六年间身陷囹圄，却仍读书著述，不改使者之节。至元十二年宋元议和，他才得以北归，不久病卒，留下《陵川集》《续后汉书》。使节被关住了，笔却没有被关住，这就是郝经最硬的一招。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0428
    name: 窦默
    default_gender: male
    archetype: civil
    flavor: （1196年-1280年）元初名医、理学家，精通医术，也传播程朱之学。窦默既替人诊脉，也替新政权讲解义理与经典；医学要辨寒热虚实，理学要辨人心与制度，两个领域都容不得只凭声势下药。他在元初文化转型中留下的，正是医者与儒者两种身份相互照见的身影。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0429
    name: 赵复
    default_gender: male
    archetype: civil
    flavor: （1189年-1256年）元初儒士，北方理学的重要传播者。赵复在战乱与政权更替中保存、讲授程朱之学，使北方士人重新接上宋代理学的脉络，后世遂称其为“北方理学的播种者”。播种听来温和，实际却要在兵火后的荒地里护住书卷，让一门学问重新发芽。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0430
    name: 杨惟中
    default_gender: male
    archetype: civil
    flavor: 杨惟中（1205年—1259年），字彦诚，弘州人。金末归附蒙古，后来成为忽必烈潜邸旧臣，向他讲授儒家经典，对元廷采用汉法有所影响；元宪宗时又任中书令等职，参与经略中原。杨惟中站在征服与治理的交界处，既懂蒙古军政，也替新统治者解释中原典章，许多细节虽已散失，这个位置却很关键。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0432
    name: 阿合马
    default_gender: male
    archetype: civil
    flavor: （？—1282年）元朝理财大臣，色目人，主持忽必烈朝财政近二十年。阿合马整顿税制、增设课税，确使国库一度充实，却也因苛征与用人引发广泛怨恨；至元十九年，千户王著借伪诏将他刺杀于大都。会算钱不等于会安民，阿合马把财政之术用得太锋利，最后连护身的官印也挡不住民怨与政敌。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0433
    name: 卢世荣
    default_gender: male
    archetype: civil
    flavor: 卢世荣（？—1285），元世祖时理财大臣。阿合马死后，他受命主持财政，推行盐铁专卖、设市易司、整治钞法，意在补足国用，却触动权贵与旧有利益，遭弹劾后于至元二十二年被诛。财政改革像在旧账堆里拔刀，账目未必理清，先会割伤握刀的人。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0434
    name: 桑哥
    default_gender: male
    archetype: civil
    flavor: （？—1291年）元朝权臣，吐蕃人，主持财政改革。桑哥整顿钱粮、强化征敛，使朝廷短期得利，却加重百姓负担并树敌无数，最终被处死。元廷需要他的算筹，又害怕他的权势；理财官做到这一步，算盘珠子每响一下，都像在替自己倒数。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0435
    name: 虞集
    default_gender: male
    archetype: civil
    flavor: 虞集（1272—1348），字伯生，号道园，祖籍仁寿，侨居临川。由荐举入仕，累官至奎章阁侍书学士，曾参与修《经世大典》；与杨载、范梈、揭傒斯并称“元诗四大家”。虞集诗文典雅而有学养，既能写馆阁文章，也能在异族新朝中保存士人的古典尺度，《道园学古录》因此格外耐读。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0436
    name: 揭傒斯
    default_gender: male
    archetype: civil
    flavor: （1274年-1344年）元代文学家，与虞集、杨载、范梈并称“元诗四大家”。揭傒斯的诗清新而有骨，散文也见功力，既能写个人情怀，也能承接馆阁文书的庄重。元代文坛不是只有豪放奇崛一条路，他把清润一路走稳，后人读来仍觉气息干净。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0437
    name: 范梈
    default_gender: male
    archetype: civil
    flavor: （1272年-1330年）元代诗人，与虞集、揭傒斯、杨载并称“元诗四大家”。范梈诗风雄浑豪放，取法杜甫，却没有把古人的沉郁照搬成旧衣；元代山河、仕途与个人漂泊都进入他的笔下。若说诗坛是一座大营，他的诗像夜里传来的角声，开阔、有力，还带着时代的冷意。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0438
    name: 杨载
    default_gender: male
    archetype: civil
