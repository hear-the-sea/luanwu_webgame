heroes:
  blue:
  - key: hist_songliaojinyuan_0411
    name: 孛儿只斤·铁穆耳
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （1265年—1307年）元成宗，名铁穆耳，忽必烈之孙、真金之子。1294年即位后，他停止大规模的对外远征，与西北的察合台、窝阔台等汗国达成和解，并整顿站赤、减免部分赋税。他任用哈剌哈孙等处理朝政，晚年多病，1307年病逝于大都。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0413
    name: 孛儿只斤·爱育黎拔力八达
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （1285年—1320年）元仁宗，名爱育黎拔力八达，答剌麻八剌之子、元武宗之弟。1311年即位后，他任用汉臣，整顿吏治与国子学，并于1313年下诏恢复科举，1315年首次开科取士，史称“延祐复科”。他推行以儒术治国的方针，1320年病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0415
    name: 孛儿只斤·妥懽帖睦尔
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （1320年—1370年）元顺帝，名妥懽帖睦尔，元明宗长子，1333年即位。亲政初期任用脱脱推行“更化”，恢复科举、修撰三史，并治理黄河。元末红巾军起事后，朝政与军情日益失控；1368年明军逼近，他撤离大都北返草原，1370年病逝于应昌。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0416
    name: 安童
    avatar: pig/文048.png
    default_gender: male
    archetype: civil
    flavor: （1245年—1293年）元代大臣，木华黎曾孙。他少年入侍忽必烈，1265年出任中书右丞相，时年二十余岁。任内主张以儒术治国，与主管财赋的阿合马政见不合，一度被罢免；阿合马死后复相，仍参预中枢。1293年病逝，被追封东平王。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0417
    name: 史天泽
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （1202年—1275年）元代汉军将领，字润甫，大兴永清人（家于真定），真定史氏首领。他早年随蒙古军攻金，后统领汉地军民。忽必烈即位后，他历任中书右丞相、左丞相，主持中原军政，并参与平定李璮之乱。至元年间，他随伯颜南下攻宋，南征途中病还真定，至真定而卒，后追封镇阳王。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0421
    name: 刘整
    avatar: monkey/其他随机角色/武047_男.png
    default_gender: male
    archetype: military
    flavor: （1212年—1275年）南宋将领，字武仲，邓州人，后降蒙古。因受上司猜忌，他于1261年归附蒙古，并向忽必烈提出先取襄阳、樊城以破南宋防线。他主持训练水军、监造战船，弥补蒙古军水战短板。襄阳陷落后，他继续参与南征，受命行省淮西，筹划渡江，1275年病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0431
    name: 廉希宪
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （1231年—1280年）元代大臣，字善甫，畏兀儿（维吾尔）人。他早年入忽必烈幕府，因熟习儒书而被称为“廉孟子”。忽必烈与阿里不哥争位时，他镇守京兆，平定关陇的阿里不哥支持者，后任中书平章政事，受命行省云南，以疾未赴。他为政主张宽简，反对滥杀，1280年病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0409
    name: 海都
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: 海都（约1235—1301），窝阔台之孙、合失之子，窝阔台系诸王领袖，以海押立为根据地。阿里不哥败后，他于1269年与察合台汗八剌、金帐汗忙哥帖木儿在塔剌思会盟，长期与元廷对抗，一度进逼和林。大德五年（1301）与元军交战后负伤而死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0410
    name: 乃颜
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: 乃颜（？—1287），成吉思汗幼弟铁木哥斡赤斤的后裔，东道蒙古宗王。至元二十四年（1287），他联合哈丹、势都儿等东道诸王起兵反元；忽必烈亲征，在辽东将其击败，乃颜被擒处死。事后元廷强化辽阳行省，进一步约束东道诸王。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0412
    name: 孛儿只斤·海山
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
    flavor: 孛儿只斤·海山（1281—1311），元武宗，答剌麻八剌之子、元仁宗之兄。大德年间总兵漠北，与海都、笃哇交战，封怀宁王。即位后设尚书省，推行至大银钞，厚赏宿卫与宗王，造成财政压力；与弟爱育黎拔力八达相约兄终弟及，1311年病逝。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0414
    name: 孛儿只斤·图帖睦尔
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: 孛儿只斤·图帖睦尔（1304—1332），元武宗次子，元文宗。1328年泰定帝死后于大都即位，旋让位于兄和世㻋；明宗暴卒后再次即位。在位期间设奎章阁学士院，命儒臣编修《经世大典》，雅好汉学；因拥立之功，权臣燕帖木儿专擅朝政，朝局受到牵制。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0418
    name: 董文炳
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
    flavor: 董文炳（1217—1278），字彦明，真定藁城人，元初将领，出身真定董氏汉军世侯。袭父职领兵，随蒙古军攻宋，至元十三年（1276）参与进逼临安，接受宋恭帝降表，入城后封存府库、约束军士。后拜中书左丞、佥书枢密院事，至元十五年病逝。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0419
    name: 张柔
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: 张柔（1190—1268），字德刚，易州定兴人。金末组织乡兵自保，后归附蒙古，随军灭金，攻破汴京时收得《金实录》，为后来修《金史》保存了史料。受命镇守保州，重建城郭、招集流亡、兴办学校；官至蔡国公，卒谥忠武。其子张弘范亦为元军名将。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0420
    name: 严实
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: 严实（1182—1240），字武叔，泰安长清人，金末元初汉人世侯。金兴定年间任长清令，后归附蒙古，拜行尚书省事，统辖东平一带五十余城，握有军民财权。他招纳流亡、优礼士人，东平渐成元初汉地文化重镇；其部后隶史天泽。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0422
    name: 张禧
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: 张禧（约1217—1291），东安州安次人，元初水军将领。早年从军攻宋，在樊城、襄阳之战中率舟师参战，以功授水军万户。此后随伯颜大军渡江，转战江淮，累官昭勇大将军。所部水师训练有素，渡江作战时以军纪严整见称。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0423
    name: 郭侃
    avatar: pig_wu_male9.png
    default_gender: male
    archetype: military
    flavor: 郭侃（1217—1277），字仲和，华州郑县人，元初汉人将领。出身武将世家，祖郭宝玉、父郭德海均为蒙古军将领。随旭烈兀西征，参与攻陷报达（巴格达），又随军进入叙利亚；归朝后任万户，官至陕西行省平章政事。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0424
    name: 李璮
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: 李璮（？—1262），潍州人，李全之子，元初山东益都世侯。父李全为金末红袄军首领，先降宋、后降蒙古，李璮袭其职，据有益都。中统三年（1262）起兵反元，将海州、涟水等地献给南宋，后据济南抵抗，城破被杀。其乱促使元廷削弱汉人世侯兵权。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0425
    name: 王文统
    avatar: pig/文029.png
    default_gender: male
    archetype: civil
    flavor: 王文统，字以道，益都人，金末元初政治家，李璮岳父。少读权谋之书，以才术自负。忽必烈即位后任中书平章政事，主持财政，推行盐课、交钞等法，一时国用赖之。中统三年李璮起兵反元，他因与李璮通书信涉嫌同谋，被忽必烈处死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0426
    name: 姚枢
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 姚枢（1203—1280），字公茂，号雪斋，营州柳城人，后徙洛阳，元初政治家、理学家。金亡后曾为燕京行台郎中，旋弃官隐居辉州苏门山讲学。忽必烈召入藩邸，咨询治道，他荐举许衡、郝经等儒士，参预元初典制建设，官至翰林学士承旨。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0427
    name: 郝经
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: 郝经（1223—1275），字伯常，泽州陵川人。早年入忽必烈幕府，中统元年（1260）以翰林侍读学士充国信使赴宋，被贾似道拘禁于真州十六年。拘系期间著《续后汉书》《陵川集》，相传曾系书雁足以通消息；获释北归后不久病卒，谥文忠。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0428
    name: 窦默
    avatar: pig_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: 窦默（1196—1280），字汉卿，广平肥乡人，金末元初医家、理学家。金末避乱河南，从名医学针灸，兼习程朱之书。忽必烈为藩王时召见问治道，后任翰林侍讲学士，至元十七年加昭文馆大学士。著有《针经指南》，所传《标幽赋》为针灸歌赋名篇。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0429
    name: 赵复
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 赵复（生卒年不详），字仁甫，德安人，宋末元初理学家。1235年蒙古军攻陷德安，他被俘北上，为姚枢所识，遂至燕京，在太极书院讲授程朱之学。编《传道图》《希贤录》《师友图》，又著《伊洛发挥》标举宗旨，理学由此在北方传开。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0430
    name: 杨惟中
    avatar: pig/文048.png
    default_gender: male
    archetype: civil
    flavor: 杨惟中（1205—1259），字彦诚，弘州人，蒙古帝国大臣。曾奉命出使西域诸国，后从皇子阔出攻宋，于军前搜求儒士与经籍，得赵复等人。建太极书院，聘赵复讲学；历任中书令等职，推动蒙古政权吸收中原典章制度。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0432
    name: 阿合马
    avatar: pig/文029.png
    default_gender: male
    archetype: civil
    flavor: 阿合马（？—1282），回回人，元世祖朝大臣。以善于理财得宠，自中统三年起领中书左右部，兼诸路都转运使，专理财赋，后任中书平章政事近二十年。他推行盐、铁专卖与钞法，增加国用，也因苛敛专权招致怨恨，至元十九年被王著等刺杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0433
    name: 卢世荣
    avatar: pig/文029.png
    default_gender: male
    archetype: civil
    flavor: 卢世荣（？—1285），大名人，元世祖时理财官。阿合马死后，由桑哥荐入朝，至元二十一年任中书右丞，主持财政。他提出整顿钞法、盐课，设市舶、铁冶等官营之利以增国用，因触犯权贵屡遭弹劾，至元二十二年被处死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0434
    name: 桑哥
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: 桑哥（？—1291），藏族，元朝宰相。通晓多种语言，由西蕃译史起家，得忽必烈信任。至元年间任尚书省右丞相，主持财政，设征理司钩考天下钱粮，整顿盐、钞诸课以增国用；因专权聚敛屡遭劾奏，至元二十八年被处死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0435
    name: 虞集
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: 虞集（1272—1348），字伯生，号道园，祖籍仁寿，侨居崇仁，元代文学家、学者，南宋丞相虞允文五世孙。历官国子助教、翰林直学士，官至奎章阁侍书学士，参与编修《经世大典》。著有《道园学古录》，与杨载、范梈、揭傒斯并称元诗四大家。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0436
    name: 揭傒斯
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: 揭傒斯（1274—1344），字曼硕，龙兴富州人，元代文学家、书法家、史学家。由程钜夫荐入翰林，历任翰林待制、集贤学士，至正年间任辽、金、宋三史总裁官，书未成而卒于史馆。著《揭文安公集》，与虞集、杨载、范梈并称元诗四大家。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0437
    name: 范梈
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: 范梈（1272—1330），字亨父，一字德机，清江人。家贫力学，以诗文受荐入仕，曾任翰林国史院编修官、福建闽海道知事等职，持身廉介。其诗宗法杜甫，讲究法度，著有《范德机诗集》，与虞集、杨载、揭傒斯并称元诗四大家。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0438
    name: 杨载
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
