    default_gender: male
    archetype: military
    flavor: 孛儿只斤·海山（1281—1311），元武宗，答剌麻八剌之子。大德年间出镇漠北，曾与海都、笃哇交战；即位后设尚书省，推行至大钞，厚赏宿卫，造成财政压力。
    growth_range:
