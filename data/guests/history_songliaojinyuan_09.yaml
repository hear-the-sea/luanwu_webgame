    default_gender: male
    archetype: civil
    flavor: （1245年—1293年）元代大臣，木华黎曾孙。安童幼年入侍忽必烈，历任中书右丞相，曾因与阿合马等权臣冲突被罢职，后来复相，至元三十年病逝。
