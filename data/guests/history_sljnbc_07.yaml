  - key: hist_sljnbc_0315
    name: 步练师
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （？—238年）名练师，临淮淮阴人，与丞相步骘同族。汉末随母东渡江东，以美貌得孙权宠幸，宠冠后庭。生孙鲁班、孙鲁育二女。她性情不妒，常推荐宫人，故长期受宠。孙权称帝后欲立为后，群臣多议立徐氏，此事拖延十余年；她死后被追赠皇后印绶，史称步皇后。
    growth_range:
