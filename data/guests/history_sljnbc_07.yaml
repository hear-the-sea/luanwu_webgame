  - key: hist_sljnbc_0302
    name: 孙峻
    default_gender: male
    archetype: military
    flavor: （219年—256年）东吴权臣，孙权托孤之臣，曾与诸葛恪共同辅政。诸葛恪北伐失利后，他发动政变将其诛杀，继而把持朝政；史书对他的评价多从专权与险狠落笔。孙峻的刀不是冲在阵前，而是从中枢背后落下；他赢得了一时宫门，却把东吴推得更靠近权臣政治。
    growth_range:
