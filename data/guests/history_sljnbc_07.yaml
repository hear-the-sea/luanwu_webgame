  - key: hist_sljnbc_0310
    name: 孙静
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）字幼台，孙坚季弟。孙坚初起兵时，他纠合乡曲与宗族五六百人自保，众皆归附。孙策攻会稽，太守王朗据固陵坚守，孙静献策由查渎小道绕袭高迁屯，孙策从其计，遂定会稽，以功拜奋武校尉。他眷恋宗族坟墓，不愿出任外职，多留镇后方；孙权统事后迁昭义中郎将，卒于家。
    growth_range:
