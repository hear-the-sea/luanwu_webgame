heroes:
  blue:
  - key: hist_sljnbc_0306
    name: 凌统
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: （189年—217年）东吴将领，凌操之子。余杭人，其父凌操为孙策部将，在与黄祖交战时被甘宁射杀。凌统年仅十五岁便继承父业统领部曲，随军征战屡立功勋。孙权攻合肥时，他与甘宁共为先锋，大破魏军。合肥之战撤退时，张辽突袭孙权后军，凌统率亲兵拼死护卫孙权突围，亲兵战死殆尽，他身受数十处创伤仍死战不退，直到孙权安全渡河。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0307
    name: 朱治
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （156年—224年）东汉末至三国吴将领，字君理，丹阳故鄣人。朱治早年随孙坚征战，孙坚死后转佐孙策，参与平定江东。孙策遇刺后，他与张昭等人共同拥立孙权，并曾举孙权为孝廉。孙权任其为吴郡太守、安国将军，封毗陵侯，黄武三年卒。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_sljnbc_0308
    name: 吕范
    avatar: pig/文050.png
    default_gender: male
    archetype: civil
    flavor: （？—228年）忠亮雅正，军中执法。汝南细阳人，年轻时在家乡为县吏，后避乱江东，投奔孙策。他不仅是谋士，更兼管军中财务钱粮，所有账目清清楚楚，从无差错。他性情豪爽，喜好排场，出行时前呼后拥车马华丽，孙权曾问他为何如此铺张，他答曰"臣为将军效力，当扬我军威仪，使敌人知我东吴有人"。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_sljnbc_0317
    name: 陆凯
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （198年—269年）东吴大臣，吴郡吴县人，字敬风，陆逊族侄。他早年从军，参与多次征战，后转任地方官员，政绩卓著。晚年官至左丞相，成为东吴朝廷的核心人物。孙皓即位后荒淫暴虐，大臣多不敢言。他多次上疏直谏，言辞恳切，不惧触怒暴君。他在临终前仍上疏劝谏孙皓减轻赋税、停止劳役，真正做到了鞠躬尽瘁。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0327
    name: 孙休
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （235年—264年）东吴景帝，字子烈，孙权第六子。他早年被封为琅琊王，远离权力中心。权臣孙綝废黜孙亮后，迎立他为帝。他即位后表面对孙綝恭顺，暗中却与张布、丁奉等密谋除掉权臣。永安元年（258年）腊日宴会上，丁奉趁孙綝不备将其擒获，当场斩杀。他由此夺回皇权，亲理朝政。他在位期间重视文教，设立国学，选拔人才，东吴政局一度好转。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0334
    name: 陆机
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （261年—303年）西晋文学家，吴郡华亭人，字士衡，陆逊之孙。他与弟陆云并称"二陆"，是太康年间最杰出的文学家。东吴灭亡后他入洛阳，以文才名动一时。他的《文赋》是中国文学批评史上的重要著作，系统阐述了文学创作的理论。他的诗赋骈文皆为当时翘楚。八王之乱中他被成都王司马颖任命为后将军，统兵讨伐长沙王司马乂。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0338
    name: 阮籍
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （210年—263年）魏晋文学家，字嗣宗，陈留尉氏人，“竹林七贤”之一。阮籍曾任步兵校尉，世称“阮步兵”。魏晋易代之际，他以饮酒、佯狂避祸，对礼法之士常以白眼相待，遇所敬者方见青眼。其《咏怀诗》八十二首多寄托忧生之嗟，辞意隐晦，开后世咏怀一体。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0339
    name: 山涛
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （205年—283年3月3日）竹林七贤之一，河内怀县人，字巨源。他早年与嵇康、阮籍等交游，为竹林七贤之一。他后入仕司马氏，历任尚书吏部郎、吏部尚书等要职，主持官员选拔三十余年，知人善任，所荐人才多为时用。他曾推荐嵇康出仕，嵇康愤而作《与山巨源绝交书》与之断交。然嵇康被杀时将儿子托付给他，他尽心抚养嵇绍成人。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0340
    name: 刘伶
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （约221年—约300年）西晋文人，字伯伦，沛国人，“竹林七贤”之一。刘伶曾为建威参军，泰始初对策盛言无为之化，因不合时宜而罢官。他纵酒放达，常乘鹿车携酒，使人荷锸相随，称“死便埋我”；所作《酒德颂》托大人先生之口，写任性适意、蔑视礼法的襟怀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0341
    name: 向秀
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （约227年—272年）魏晋文人、思想家，字子期，河内怀县人，“竹林七贤”之一。向秀好老庄之学，所注《庄子》妙析奇致，开玄学新义；嵇康被杀后，他应郡举入仕。一次途经嵇康、吕安旧居，闻邻人吹笛，感怀亡友，遂作《思旧赋》，短章之中寄意深长。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0342
    name: 左思
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （约250年—305年）西晋文学家，字太冲，齐国临淄人。左思貌寝口讷而辞藻壮丽，构思十年写成《三都赋》，又请皇甫谧作序，张载、刘逵等为之注释，一时豪门贵室竞相传写，洛阳为之纸贵。其《咏史诗》八首借史抒怀，寄托寒门士人沉沦下僚的不平之气。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0343
    name: 贾南风
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （256年—300年4月）西晋惠帝皇后，平阳襄陵人，贾充之女。她貌丑而性妒，凶悍善谋。晋惠帝司马衷即位后，她逐渐掌握朝政大权。她先是联合楚王司马玮诛杀辅政大臣杨骏和汝南王司马亮，随后又杀司马玮灭口。她专权期间诛杀异己，废太子司马遹并将其杀害，引发诸王不满。赵王司马伦以为太子报仇为名起兵，将她废黜赐死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0344
    name: 王戎
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （234年—305年）竹林七贤之一，琅琊临沂人，字濬冲。他少有神童之名，年幼时见道边李树多子，众人争采，他独不动，言"树在道边而多子，此必苦李"，果如其言。他与阮籍、嵇康等为竹林之游，然入仕后善于谋身保位，历任吏部尚书、司徒等要职，是七贤中官位最高者。他为人吝啬，家有好李，恐人得种，每售必钻核，时人讥之。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 40
