    flavor: （？—215年）东吴将领，统率“庐江上甲”，以勇猛与厚待士卒见长。合肥之战中，他率精兵作战，最终战死；孙权失去的不只一名猛将，也失去一支愿意跟他同生共死的部曲。陈武平日以俸禄养士，到了阵前，士卒便以性命还他。
