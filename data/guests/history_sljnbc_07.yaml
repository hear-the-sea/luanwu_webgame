  - key: hist_sljnbc_0303
    name: 孙綝
    default_gender: male
    archetype: military
    flavor: （231年—258年）东吴权臣，孙峻死后掌握朝廷，先后杀害吕据、朱异、滕胤等人，甚至废黜孙亮改立孙休。孙綝的专横来自宫门与禁军，而非民望；他把废立当作换锁，朝臣便只能在每次开门前猜谁还活着。后来孙休与丁奉等诛杀他，权力的刀终于回到主人手中。
