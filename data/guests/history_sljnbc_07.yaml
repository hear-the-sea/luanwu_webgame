  - key: hist_sljnbc_0302
    name: 孙峻
    avatar: pig/武076.png
    default_gender: male
    archetype: military
    flavor: （219年—256年）字子远，吴郡富春人，孙坚弟孙静之曾孙。孙权末年任武卫都尉、侍中，临终受遗诏辅政。建兴二年（253年）与吴主孙亮合谋诛杀诸葛恪，自任丞相、大将军，督中外诸军事。五凤二年（255年）乘魏将毌丘俭等起兵，率军袭寿春。次年再攻魏，途中病卒，年约三十八岁，后事托付堂弟孙綝。
