    flavor: （？—256年）东吴骠骑将军，吕范之子，文武兼备。孙綝专权时，他与滕胤谋划讨伐，率军未入京便因事泄败走，最终自杀。吕据继承父亲的名位，却没有继承足以护身的时局；军队可以替你开路，却不能替你保密。
