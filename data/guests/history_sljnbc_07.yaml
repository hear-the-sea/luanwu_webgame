    name: 程秉
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）字德枢，汝南南顿人。早年师从经学家郑玄，避乱交州时与刘熙讲论经义，遂博通五经。孙权闻其名，任为太子太傅，辅佐太子孙登。黄武四年（225年）以守太常之职，为孙登迎娶周瑜之女。著有《周易摘》《尚书驳》等约三万余言，后卒于官。
