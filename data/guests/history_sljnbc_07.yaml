  - key: hist_sljnbc_0309
    name: 吴景
    avatar: pig/武010.png
    default_gender: male
    archetype: military
    flavor: （？—203年）吴郡吴县人，孙坚夫人吴氏之弟，孙策、孙权的舅父。早年随孙坚征伐，拜骑都尉。孙坚死后曾领丹阳太守，后与孙贲攻讨樊能、笮融等，助孙策平定江东。袁术僭号后，吴景弃广陵郡东归孙策，复为丹阳太守。建安八年（203年）卒于任上。
