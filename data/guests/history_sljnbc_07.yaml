    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （？—200年）琅琊人，东汉末方士。往来吴、会之间，立精舍、烧香读道书，以符水为人治病，当地百姓多信奉之。建安五年（200年）孙策在城门楼上会集诸将，于吉经过，诸将宾客多下楼迎拜，孙策以其惑众，将其收捕处死。后世流传孙策见其影像于镜中而创裂等神异故事，多属传说。
