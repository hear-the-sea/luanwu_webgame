    flavor: （？—？）东吴经学家、太常、太子太傅，师从郑玄，博通五经。避乱交州时，他以讲学保存士林火种；归吴后又主持礼制、教授太子孙登。程秉的功劳不在破阵，而在让一个靠军队建立的政权也有典章可循，礼乐一立，刀兵才不至于永远当家。
