    default_gender: male
    archetype: military
    flavor: （？—213年）东吴猛将，随孙策起兵，后为孙权平定山越、征讨黄祖。黄祖水军战事中，他率先登船夺旗；后来在一次水战中为护孙权而死，史书以“猛虎之勇”称之。董袭的勇不是传说里的无伤冲锋，而是明知船板摇、箭雨密，仍先一步踏上敌船。
