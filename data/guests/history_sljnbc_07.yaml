    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: （177年—215年）字仲异，孙静之子，孙权堂兄。早年以恭义校尉领兵，后为丹阳太守，招抚部众至万余人。建安十一年（206年）与周瑜共讨麻、保二屯。濡须之战时劝孙权持重，未被采纳。官至奋威将军，好读典籍，在军中设立学官，令将吏子弟数百人受业，年三十九卒。
