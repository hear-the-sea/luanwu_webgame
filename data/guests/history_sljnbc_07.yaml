    name: 陈武
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
    flavor: （？—215年）字子烈，庐江松滋人。十八岁时往寿春谒见孙策，身长七尺七寸，随军征讨有功，拜别部司马。孙权统事后，任为督五校，所领多为庐江上甲精兵。陈武仁厚好施，乡里与远方宾客多依附其门下。建安二十年（215年）随孙权攻合肥，遭张辽突袭，力战而死，孙权亲临其丧。
