  - key: hist_sljnbc_0303
    name: 孙綝
    avatar: pig/武076.png
    default_gender: male
    archetype: military
    flavor: （231年—259年）字子通，吴郡富春人，孙峻堂弟。孙峻死后继掌朝政，任侍中、武卫将军，领中外诸军事。吕据、滕胤举兵反对，被他击败诛杀。永安元年（258年）废吴主孙亮为会稽王，迎立孙休，自任丞相、荆州牧。孙休表面优礼，暗中与张布、丁奉定计，于腊日宴会将其擒杀，时年约二十八岁。
