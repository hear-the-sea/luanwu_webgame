    default_gender: male
    archetype: civil
    flavor: （？—200年）东汉末方士，在江东以符水、道术聚集信众。孙策认为其惑众乱军，命人将他处死；后来孙策遇刺，民间遂把两件事编成神异因果。关于于吉法术的叙述属于当时信仰与后世传说，却能让人看见乱世里人们如何把病痛和战乱寄托于符水与神异。
