    name: 全琮
    default_gender: male
    archetype: military
    flavor: （198年—249年）东吴将领、驸马，出身江东世家。孙权把女儿孙鲁班嫁给他后，他既参与军务，也承担豪族与军府之间的联络；石亭之战中曾负责断后。全琮并非只靠姻亲得势，早年赈济流民、组织部曲的眼光，同样是乱世立身的本钱。
