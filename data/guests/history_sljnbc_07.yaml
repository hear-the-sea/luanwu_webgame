    flavor: （177年—215年）孙静之子，东吴宗室中少见的儒将。孙瑜好学通经，也参与山越平定与江东军务；赤壁之战随周瑜出征，文才并未妨碍他上马。孙氏宗亲多以武力立名，他走的是把经书放进军帐、把兵法带回州郡的路。
