  - key: hist_sljnbc_0304
    name: 董袭
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: （？—213年或217年）字元代，会稽余姚人。早年随孙策平定江东，后从孙权讨黄祖。建安十三年（208年）与凌统各率敢死士为前锋，突入黄祖蒙冲，亲手斩断缆绳，使大军得进。此后参与讨平山越，官至偏将军。濡须口之战中，五楼船遇暴风倾覆，他拒绝弃船逃生，随船沉没。
