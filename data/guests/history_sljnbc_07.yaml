      agility: 22
  - key: hist_sljnbc_0312
    name: 严畯
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）字曼才，彭城人。避乱江东，与诸葛瑾、步骘齐名友善，时称“东吴三友”。他博通《诗》《书》三礼，曾出使蜀汉，为诸葛亮所敬重。鲁肃死后，孙权欲以其代督陆口，他以书生不闲军事固辞，时人称其能让。后官至尚书令，著有《孝经传》等。
