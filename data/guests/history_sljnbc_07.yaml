      agility: 20
  - key: hist_sljnbc_0316
    name: 诸葛靓
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）字仲思，琅琊阳都人，诸葛诞之子。诸葛诞在寿春起兵反司马氏时，遣他入吴为质求援；事败后留在东吴，官至右将军、大司马。西晋灭吴后，因父亲被司马氏所杀，他终身不仕晋朝，也不面向朝廷而坐，时人称其至孝。其姊为琅琊王司马伷之妻。
