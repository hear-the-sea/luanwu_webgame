    name: 全琮
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （198年—249年）字子璜，吴郡钱唐人。父全柔为孙氏部将，全琮以父荫领兵。黄武七年（228年）与陆逊等在石亭大破魏将曹休，后领东安太守，招抚山越，数年间得万余人。官至卫将军、徐州牧、右大司马，娶孙权长女孙鲁班。为人和顺，善承颜纳规，赤乌十二年（249年）卒。
