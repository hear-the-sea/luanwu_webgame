heroes:
  purple:
  - key: hist_sljnbc_0425
    name: 貂蝉
    default_gender: female
    avatar: diaochan.png
    archetype: civil
    flavor: （生卒不详）中国古代四大美女之一，主要见于《三国演义》等文学作品。据演义描述，她本是司徒王允家中歌女，天姿国色。王允为除掉权臣董卓，设下连环计，将她先许与吕布后献于董卓，使二人反目成仇。她周旋于董卓、吕布之间，以美色离间二人关系。最终吕布被她所惑，刺杀董卓于未央宫前。她在完成使命后下落成谜，有说法称她随吕布至下邳。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  green:
  - key: hist_sljnbc_0401
    name: 姚兴
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （366年—416年）十六国后秦皇帝，字子略，姚苌长子。即位后击灭前秦残余势力苻登，夺取洛阳等要地，但在柴壁之战中败于北魏。他崇奉佛教，迎鸠摩罗什入长安主持译经，同时兴办学校、奖励儒学，晚年国势渐衰。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0402
    name: 范缜
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （450年—510年）南朝思想家，字子真，南阳舞阴人，出身寒微而博通经史。他著《神灭论》，以刀刃与锋利比喻形体与精神，主张形亡则神灭，反对佛教神不灭之说。竟陵王萧子良、梁武帝先后组织名士与之辩难，他始终不屈，后官至国子博士。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0403
    name: 江淹
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （444年—505年）南朝文学家，字文通，济阳考城人。他少孤家贫，早年以《恨赋》《别赋》著称，历仕宋、齐、梁三朝，官至金紫光禄大夫，封醴陵侯。相传他晚年梦见郭璞索还五色笔，此后文思衰退，遂有“江郎才尽”之说。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0404
    name: 陈叔宝
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （553年—604年）陈朝末代皇帝，字元秀，史称陈后主。他在位时大修临春、结绮等楼阁，与妃嫔文士宴饮赋诗，《玉树后庭花》即出于此时。589年隋军攻入建康，他与张丽华等藏身井中被俘，陈朝灭亡，后卒于洛阳。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0405
    name: 徐陵
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: （507年—583年）南朝文学家、政治家，字孝穆，东海郯人。他早年与庾信齐名，诗文并称“徐庾体”；曾出使北齐，因侯景之乱被留数年。入陈后官至尚书左仆射，主持编成《玉台新咏》，所收以汉至梁的艳情诗为主。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0406
    name: 宇文护
    avatar: pig/武049.png
    default_gender: male
    archetype: military
    flavor: （513年—572年）西魏、北周权臣，字萨保，宇文泰之侄，封晋国公。宇文泰临终将诸子与国事托付于他，他迫使西魏恭帝禅位，拥立宇文觉建立北周，以大冢宰身份专权十余年，先后废杀孝闵帝、明帝。572年，周武帝宇文邕与近臣合谋，在宫中将其袭杀，北周皇权始归武帝。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0407
    name: 杨忠
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: （507年—568年）西魏、北周将领，隋文帝杨坚之父。他出身弘农杨氏，早年随独孤信辗转南北，后归宇文泰麾下，位列西魏十二大将军，参与邙山之战与攻取江陵等役。因军功官至柱国大将军，封随国公；隋朝建立后，被追尊为武元皇帝。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0408
    name: 高洋
    avatar: pig/武076.png
    default_gender: male
    archetype: military
    flavor: （529年—559年）北齐开国皇帝，字子进，高欢次子。兄长高澄遇刺后，他执掌东魏朝政，550年受禅建北齐，史称文宣帝。在位前期整顿吏治、修筑长城，并多次出兵抵御北方部族，国力较强；后期纵酒暴虐，559年病逝。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 22
      defense: 24
      agility: 18
  - key: hist_sljnbc_0409
    name: 吕虔
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）三国曹魏将领，字子恪，任城人。曹操任其为泰山太守，郡内郭祖、公孙犊等据山为寇，他到任后开示恩信，寇党相继归降；后官至徐州刺史、威虏将军，封万年亭侯。史载他将佩刀赠予王祥，断定其当登三公，“吕虔佩刀”由此成为典故。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 12
      defense: 40
      agility: 14
  - key: hist_sljnbc_0410
    name: 胡质
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: （？—250年）东汉末至曹魏官员，字文德，寿春人。历任常山、东莞太守及荆州刺史，后官至征东将军、都督青徐诸军事；吴将朱然围樊城时，他率轻兵赴援。为官以清廉著称，去世时家无余财。其子胡威自京师省亲，他仅赠绢一匹，胡威仍追问绢从何来，父子清慎为时人所称。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0411
    name: 审配
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （？—204年）东汉末袁绍部下，字正南，魏郡人。袁绍领冀州后任其为治中，典掌机要，与逢纪同统军务；官渡之战时因收捕许攸家人，促使许攸转投曹操。袁绍死后，审配拥立袁尚，坚守邺城，曹操引漳水灌城，最终因其侄审荣开门而降，他被擒后拒降，面北受刑而死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0412
    name: 郭图
    avatar: monkey/其他随机角色/文041_男.png
    default_gender: male
    archetype: civil
    flavor: （？—205年）东汉末袁绍谋士，字公则，颍川人。他早年参与劝说韩馥让出冀州，迎袁绍入主；官渡之战中，乌巢被袭时主张急攻曹营，事败后又构陷率军来降的张郃，使其转投曹操。袁绍死后，他与辛评辅佐袁谭，与审配等相争，南皮城破时为曹操所杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_sljnbc_0413
    name: 逢纪
    avatar: pig/文010.png
    default_gender: male
    archetype: civil
    flavor: （？—202年）东汉末袁绍谋士，字元图，南阳人。初平二年，他与荀谌等人劝说韩馥让出冀州，迎袁绍入主；此后与审配同统军务，参预河北军政。袁绍死后，逢纪与审配矫遗命拥立袁尚，与袁谭相争，后袁谭求援不得，迁怒于他，将其杀害。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_sljnbc_0414
    name: 赵累
    avatar: monkey/其他随机角色/武047_男.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）三国蜀汉将领，官至都督，长期随关羽镇守荆州。219年吕蒙袭取江陵，关羽后方瓦解，部众离散，赵累仍随关羽退守麦城，再行突围。据《三国志》记载，他与关羽父子在临沮一同被吴军擒获，此后下落史书未载，生平仅零星见于相关纪传。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0415
    name: 向宠
    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （？—240年）三国蜀汉将领，襄阳宜城人，向朗之侄。夷陵之战蜀军大败，诸营溃散，唯有向宠所部完整撤回，受到刘备称许。诸葛亮在《出师表》中称其“性行淑均，晓畅军事”，荐以统领宿卫；后任中领军，征讨汉嘉蛮夷时遇害。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0416
    name: 虞翻
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （164年—233年）东汉末至三国东吴经学家，字仲翔，会稽余姚人。他精通《周易》，历事孙策、孙权，以刚直敢谏著称，曾多次因犯颜获罪，晚年被流放交州。在交州仍开门授徒，注《易》《老子》《论语》等，门徒常至数百人。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0417
    name: 石崇
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （249年—300年）西晋官员、富豪，字季伦，渤海南皮人，石苞第六子。他任荆州刺史时劫掠商旅致富，在洛阳筑金谷园，与王恺争豪斗富，又以文会结纳潘岳等人，号为“金谷二十四友”。八王之乱中，他因拒绝交出宠姬绿珠而得罪孙秀，被司马伦一党处死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0418
    name: 慧远
    avatar: pig/武066.png
    default_gender: male
    archetype: civil
    flavor: （334年—416年）东晋高僧，俗姓贾，雁门楼烦人。他师从道安，后居庐山东林寺，与刘遗民等结社念佛，后世称为白莲社，并被尊为净土宗初祖。著《沙门不敬王者论》等，主张沙门不礼敬君王，兼通儒道，对佛教中国化影响深远。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0419
    name: 李雄
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （274年—334年）十六国成汉开国皇帝，字仲俊，巴氐人，李特第三子。李特、李流相继死后，他统领流民军攻取成都，304年称成都王，306年称帝，国号大成。在位时轻徭薄赋、缓和社会矛盾，又攻取汉中等地，使益州局面渐趋安定。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0420
    name: 石虎
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （295年—349年）后赵皇帝，字季龙，石勒之侄，封中山王。石勒死后他掌握朝政，废黜石弘自立，迁都邺城。在位期间大兴宫室、广征民力，又严刑峻法，社会负担沉重；同时尊礼高僧佛图澄，境内佛事兴盛。349年病死，诸子争位，后赵迅速陷入内乱。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0421
    name: 王僧辩
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: （？—555年）南梁将领，太原祁人，出身乌丸王氏。侯景之乱中，他受湘东王萧绎之命东讨，与陈霸先分道并进，收复建康，平定侯景，以功任司徒、尚书令。梁元帝死后，他迎立北齐扶植的萧渊明，与陈霸先意见相左，555年被陈霸先自京口起兵袭杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0422
    name: 周文育
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （509年—559年）南陈开国将领，字景德，义兴阳羡人。他本姓项，名猛奴，少孤家贫，年十一能泅水数里，后被周荟收为养子，遂改姓周。随陈霸先平定侯景之乱，又参与讨伐萧勃、王琳等势力，以勇战知名；559年在军中宴席上被熊昙朗杀害。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0423
    name: 侯安都
    avatar: monkey/其他随机角色/武047_男.png
    default_gender: male
    archetype: military
    flavor: （520年—563年）南陈将领，字成师，始兴曲江人。他早年随陈霸先起兵，参与平定侯景之乱，又协助袭杀王僧辩。陈霸先去世后，侯安都定策拥立陈蒨为帝，官至司空；因居功骄横、招纳亡命，563年被陈文帝收捕后赐死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0424
    name: 萧皇后
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （567年—647年）西梁明帝萧岿之女，隋炀帝皇后。她性情婉顺，通晓文墨，隋文帝为晋王杨广聘为妃；杨广即位后立为皇后，曾作《述志赋》委婉规谏。隋亡后辗转于宇文化及、窦建德及突厥处，贞观四年归唐，受到礼遇，卒于长安。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0426
    name: 焦触
    avatar: monkey/其他随机角色/武男22.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）东汉末袁绍部将。袁绍据冀州时，焦触与张南同在其麾下；袁绍死后，二人起兵攻逐袁尚、袁熙，焦触自号幽州刺史，率幽州诸郡背袁归降曹操，受封列侯。此后他在曹魏官至征虏将军，封都亭侯，其余事迹史书记载不多。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0427
    name: 郤俭
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （？—188年）东汉益州刺史。中平五年，马相、赵祗等人在绵竹起兵，聚合疲役之民数千，先杀绵竹令李升，继而攻破雒县，郤俭遇害。史载他在任期间赋敛烦苛，成为民变的背景；乱事随后由贾龙等平定，刘焉得以入主益州。他是蜀汉学者郤正的祖父。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0428
    name: 刘焉
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （？—194年）东汉宗室、益州牧，字君郎，江夏竟陵人。他建议朝廷改刺史为州牧以镇抚地方，随后自请出任益州牧。入蜀后打击豪强、收编东州兵，借张鲁之力阻断斜谷，又造作乘舆，渐有割据之志；194年病卒，其子刘璋继任。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0429
    name: 张方
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （？—约305年）西晋河间王司马颙部将，河间人，家世贫贱，以材勇得宠信。八王之乱中，他率军自关中攻入洛阳，纵兵掠夺，又挟持晋惠帝迁往长安，使朝政受制于司马颙。他久统重兵，渐为司马颙所忌，最终被司马颙遣人杀死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
