heroes:
  purple:
  - key: hist_sljnbc_0425
    name: 貂蝉
    default_gender: female
    archetype: civil
    flavor: （生卒不详）中国古代四大美女之一，主要见于《三国演义》等文学作品。据演义描述，她本是司徒王允家中歌女，天姿国色。王允为除掉权臣董卓，设下连环计，将她先许与吕布后献于董卓，使二人反目成仇。她周旋于董卓、吕布之间，以美色离间二人关系。最终吕布被她所惑，刺杀董卓于未央宫前。她在完成使命后下落成谜，有说法称她随吕布至下邳。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  green:
  - key: hist_sljnbc_0401
    name: 姚兴
    default_gender: male
    archetype: civil
    flavor: （366年—416年）后秦第二任君主，在位时国力达到高峰。姚兴延请鸠摩罗什入长安译经，也重视儒学与学校；他不只用兵，也试图以文教把羌族政权安在中原制度上。后秦的疆域靠刀守，文化秩序靠另一种耐心，他两头都在经营。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0402
    name: 范缜
    default_gender: male
    archetype: civil
    flavor: （约450年—515年）南朝思想家、官员，出身贫寒而博通经史。面对梁武帝时代盛行的佛教，他著《神灭论》，主张形体消亡则精神亦随之，不信灵魂不灭。范缜的笔锋不向人身，而向一套流行信念；在满朝谈佛之时敢把问题问到底，本身就是思想上的拔剑。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0403
    name: 江淹
    default_gender: male
    archetype: civil
    flavor: （444年—505年）南朝文士，历仕宋、齐、梁，早年以《恨赋》《别赋》名动文坛。“江郎才尽”传说说他梦得五色笔，后来又被郭璞索回，文思遂衰；传说虽未必可信，却抓住了文人最怕的那一刻：笔还在手，心中却忽然没有旧日的火。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0404
    name: 陈叔宝
    default_gender: male
    archetype: civil
    flavor: （553年—604年）陈朝末帝，长于诗文音律，却把宫廷过成了宴席。隋军南下时，他仍沉溺后宫与歌舞，建康陷落后与张丽华藏入景阳井；亡国不只是一首《玉树后庭花》，更是军报一次次被酒宴挡在门外。陈叔宝的才情没有救得了城，也未必该替他的失政遮掩。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0405
    name: 徐陵
    default_gender: male
    archetype: civil
    flavor: （507年—583年）南朝文臣、文学家，与庾信并称“徐庾”，主持编纂《玉台新咏》。他擅长骈文与宫体诗，能把辞采织得精巧，却也身处梁陈宫廷文艺的繁丽气氛。徐陵的文章像一柄雕花的短剑，锋刃未必用来杀敌，却把六朝语言的光泽留了下来。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0406
    name: 宇文护
    default_gender: male
    archetype: military
    flavor: （513年—572年）北周权臣，宇文泰死后拥立、废杀皇帝，长期把持朝政。宇文护能统兵，也能在诸帝之间操纵权柄，却没看见宇文邕多年的忍耐已成了反击的刀。建德七年，宇文邕伏兵诛杀他并夷族；权臣把皇帝当棋子，终究也会被棋盘反噬。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0407
    name: 杨忠
    default_gender: male
    archetype: military
    flavor: （507年—568年）北周柱国，隋文帝杨坚之父，早年随独孤信、宇文泰征战。杨忠攻江陵、御突厥，军功累积至随国公；他又宽厚待士，能让武人愿意效死。隋朝尚未出现时，他已替杨氏把兵权与声望一寸寸打出来。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0408
    name: 高洋
    default_gender: male
    archetype: military
    flavor: （529年—559年）北齐开国皇帝，高欢次子，前期整饬吏治、修律、拓境，国势一度强盛。后期却沉溺酒色、喜怒失常，屡杀朝臣宗室。高洋像一把双刃重刀：前半截能劈开东魏旧局，后半截却反过来砍伤自己的朝廷。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 22
      defense: 24
      agility: 18
  - key: hist_sljnbc_0409
    name: 吕虔
    default_gender: male
    archetype: military
    flavor: （？—？）曹魏将领，长期治理泰山，善用剿抚平定山地盗乱，也参与东莱、利城等战事。传说他有一柄名刀，赠给王祥后王祥位至三公；刀能不能带来官运难考，吕虔本人治郡用兵的本领却有史可据。名器是传说，能把乱郡理顺才是硬功。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 12
      defense: 40
      agility: 14
  - key: hist_sljnbc_0410
    name: 胡质
    default_gender: male
    archetype: civil
    flavor: （？—250年）曹魏大臣、刺史，以清廉和守边见长。胡质历任地方与荆州军政，去世时家中无金银积蓄，儿子胡威也承其清节。能在兵粮、官位和家族都需花钱的时代守住一间空屋，胡质的“富”不在库中，在百姓还愿意信官府。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0411
    name: 审配
    default_gender: male
    archetype: civil
    flavor: （？—204年）袁绍谋士，刚直守邺，袁绍死后拥立袁尚。曹操围邺时，他粮尽援绝仍不肯开城投降，城破被擒，面对招降依旧拒绝。审配的判断未必尽善，却把“守城”二字守到了最后；旗倒之后，他仍不肯替敌军说一句软话。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0412
    name: 郭图
    default_gender: male
    archetype: civil
    flavor: （？—205年）袁绍谋士，才辩过人，却在关键处屡使袁军走向更险的路。官渡时他反对持重，乌巢被袭后又建议分兵攻曹营；袁绍败后，他还诬陷张郃、高览，推动袁氏兄弟继续相争。郭图的短处不是没有谋，而是每一计都只看眼前输赢，未看整盘棋已在崩。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_sljnbc_0413
    name: 逢纪
    default_gender: male
    archetype: civil
    flavor: （？—202年）袁绍谋士，曾协助夺取冀州，才决而有断。袁绍死后，逢纪虽与审配有隙，仍在继承问题上支持袁尚，袁谭与袁尚的裂痕由此加深。一个谋士可以替主公开疆，也可能在继承之争中把裂缝推成断崖；逢纪最后死于袁谭之手，便是这场内耗的回声。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_sljnbc_0414
    name: 赵累
    default_gender: male
    archetype: military
    flavor: （？—220年）关羽部将，荆州失陷后随关羽退守麦城、突围。赵累的记载极简，却在主帅败局已定、众人各散时仍与关羽父子同被擒杀。名将身边总有一些不被传记展开的人，赵累的功劳没有奇谋可写，只有最后没有离开。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0415
    name: 向宠
    default_gender: male
    archetype: military
    flavor: （？—240年）蜀汉将领，向朗之侄，夷陵败后所部完整撤回，受刘备称许。诸葛亮在《出师表》中称其“性行淑均，晓畅军事”，荐为统领禁军；他后来任中领军，负责宿卫宫禁。向宠的本领不在一战封神，而在败军中能保队伍、平日里能守军纪。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0416
    name: 虞翻
    default_gender: male
    archetype: civil
    flavor: （164年—233年）东吴经学家、大臣，精《周易》，以直谏著名。虞翻多次犯颜，触怒孙权而被流放交州；在那里仍授徒讲学，不改其锋。这样的读书人像一把太直的剑，放在宫中容易伤人，丢到边地也不会自行弯折。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0417
    name: 石崇
    default_gender: male
    archetype: civil
    flavor: （249年—300年）西晋富豪、权贵，靠任荆州刺史时劫掠商旅聚财，筑金谷园与王恺斗富。蜡烛当柴、锦缎作步障、铁如意击珊瑚，豪奢故事层层叠上去；后来八王之乱中他因卷入权力斗争被杀。石崇的金谷园很美，却像一座没有城防的富城，刀兵一到，财富先替主人招来仇家。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0418
    name: 慧远
    default_gender: male
    archetype: civil
    flavor: （334年—416年）东晋高僧，庐山东林寺白莲社的创建者之一，倡导净土信仰。慧远兼通儒道，不以佛门与中土文化相斥，聚僧俗讲学修行；“影不出山、迹不入俗”的名声也让他成为东晋士林的精神坐标。慧远的锋刃不在战阵，而在能守住信念与世俗权力之间的界线。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0419
    name: 李雄
    default_gender: male
    archetype: military
    flavor: （274年—334年）成汉建立者，继承父辈流民军，在成都立国。李雄在位较久，减轻赋税、宽缓刑政，使益州在西晋末乱局中得到喘息；他的政权有族群与流民背景，却没有只靠掠夺维持。成都城头的旗帜换了，百姓能否安生才是新王朝真正的试题。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0420
    name: 石虎
    default_gender: male
    archetype: military
    flavor: （295年—349年）后赵权臣、皇帝，早年战功显赫，夺位后却大兴土木、穷奢极欲，征发民夫数以百万计。石虎的宫殿越造越高，百姓的骨头却被压在地基下；他用暴力扩张国家，也用暴政掏空国家。将军的锋利不能替帝王的残酷辩护。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0421
    name: 王僧辩
    default_gender: male
    archetype: military
    flavor: （？—555年）南梁将领，侯景之乱中与陈霸先合力收复建康、诛侯景，后镇守京师。梁元帝死后，他主张迎立北齐支持的萧渊明，陈霸先不从，双方最终决裂，王僧辩被杀。功臣在外能并肩杀敌，回朝后却可能因拥立一人而拔刀相向；梁室的残局没有给他留下两全之路。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0422
    name: 周文育
    default_gender: male
    archetype: military
    flavor: （509年—559年）南陈开国将领，出身寒微，原姓项，因被周氏收养而改姓。周文育随陈霸先讨侯景、平王僧辩，常任前锋，后来镇守岭南、平定萧勃。没有名门给他铺路，他便用一场场冲阵把自己的名字钉进陈朝的开国军功簿。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0423
    name: 侯安都
    default_gender: male
    archetype: military
    flavor: （520年—563年）南陈开国将领，陈霸先旧部，拥立陈文帝有功。侯安都勇而能战，却在功成后骄纵跋扈，屡对朝廷失礼，最终因政治冲突被赐死。能替新朝夺天下是一门功夫，知道何时收起功劳却是另一门；侯安都只练成了前一门。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0424
    name: 萧皇后
    default_gender: female
    archetype: civil
    flavor: （567年—648年）隋炀帝皇后，西梁明帝之女，历经隋末政变与突厥迁徙。杨广死后，她先后被宇文化及、窦建德控制，后随突厥使者北去，长期生活于塞外；她的处境随王朝和部族权力反复转手，却始终保有皇室身份与应对风云的从容。萧皇后不是“乱世美人”四字能写尽的人，她更像一枚被各方争夺、却一直没有碎掉的玉。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0426
    name: 焦触
    default_gender: male
    archetype: military
    flavor: （？—？）袁绍旧部，后来归曹操，赤壁前曾主动请缨驾驶战船侦察。北方将领面对江东水战多有不熟，焦触敢上船并不等于他能扭转战局，却显示出临事敢担的军人性格。船未必驶出奇功，敢把脚放上甲板，也是一道门槛。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0427
    name: 郤俭
    default_gender: male
    archetype: civil
    flavor: （？—188年）东汉益州刺史，赋敛繁重，激起马相、赵祗等人的民变。成都失守后，他被起义军杀死；郤俭的结局不只是一名官员的败亡，也说明横征暴敛会替叛乱招募最先一批人。城墙能挡刀，挡不住百姓心里的反噬。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0428
    name: 刘焉
    default_gender: male
    archetype: civil
    flavor: （？—194年）东汉益州牧，汉室宗亲，曾建议恢复州牧制度，入蜀后逐步掌握益州。他诛豪强、收东州兵、修筑成都城，建立了割据基础；“天子之气”的传闻或许带有术数色彩，真正让他站稳的仍是兵、粮与地方关系。刘焉把益州当作避乱之地，也把州牧制度推向了群雄自立。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0429
    name: 张方
    default_gender: male
    archetype: military
    flavor: （？—304年）河间王司马颙部将，八王之乱中率军攻入洛阳，烧掠宫城并挟持晋惠帝西迁。张方的战功建立在百姓和宫室的毁坏上，权势坐大后又令司马颙猜忌，最终被杀并以首级求和。替权臣抢来一座城，未必能替自己买到活路。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0430
    name: 刘曜
    default_gender: male
    archetype: military
    flavor: （？—329年）前赵末帝，刘渊养子，善射能文，曾攻取洛阳、长安。靳准之乱后，他诛靳氏、迁都长安，改国号为赵，试图整顿吏治、兴学延才；但石勒崛起，前赵最终败亡。刘曜有将略也有治心，却没能把乱世里聚起的兵马变成稳定的帝国。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0431
    name: 苻融
    default_gender: male
    archetype: civil
    flavor: （？—383年）前秦宗室名将，苻坚之弟，兼有文才与军略。淝水之战前，他与王猛等劝苻坚慎伐东晋，指出晋室未乱、人心未离；出兵后他仍任前锋，最终战死。苻融的悲剧在于看见了险局，却没有阻止雄主把大军推过江；明白棋势的人，有时也只能陪棋局一起落子。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
