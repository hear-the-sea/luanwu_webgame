    - 12
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0020
    name: 常遇春
    default_gender: male
    archetype: military
    flavor: （1330年—1369年）字伯仁，号“常十万”，明朝开国第一猛将。他曾豪言只需十万兵马便可横行天下，故此得名。在鄱阳湖大战中，他身先士卒，顶着漫天箭雨突击陈友谅水寨，立下头功。北伐元朝时，他作为先锋势如破竹，直取大都，其勇武令蒙元守军闻风丧胆。常遇春作战不仅骁勇无比，更兼具出色的战略眼光，是朱元璋最为倚重的进攻利剑。可惜天妒英才，他在柳河川归途中暴病而亡，年仅四十岁。朱元璋闻讯大恸，追封其为开平王。他以其短暂而辉煌的一生诠释了战神之名，其威名与勇武至今仍令后世神往，被誉为大明江山的开拓先锋。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0022
    name: 戚继光
    default_gender: male
    archetype: military
    flavor: （1528年—1588年）字元敬，号南塘，明代最杰出的军事天才。针对倭寇战法，他独创“鸳鸯阵”与特殊的兵器体系，编练出纪律严明、战斗力强悍的“戚家军”，在东南沿海百战百胜，基本肃清了困扰明朝数十年的倭患。晚年他北调蓟州，主持修建了宏伟的砖石长城防线，使北疆安宁。他所著《纪效新书》与《练兵实纪》是中国古代军事科学的瑰宝。戚继光不仅是战场上的常胜将军，更是推动中国军事变革的一代宗师，其保家卫国的功勋永垂不朽，被誉为中国近世战术之祖和伟大的民族英雄。他那种致力于实战效率而非虚荣的专业军事态度，彻底改写了明军的整体战斗力水平。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0023
    name: 郑成功
    default_gender: male
    archetype: military
    flavor: （1624年—1662年）“国姓爷”，明末清初著名的民族英雄。他出身海商世家，在国家危急关头毅然起兵抗清，坚守东南沿海。面对陆上局势的逆转，他展现出卓越的战略眼光，亲率庞大舰队横渡海峡，历经数月艰苦围战，最终迫使荷兰殖民者签字投降，收复了离开祖国三十八年的宝岛台湾。他开辟荆榛，在台湾设县治、兴教育、推广屯田，将中华文化深深根植于宝岛。虽然他英年早逝，但他坚守民族气节、维护国家主权完整的崇高精神，早已成为连接海峡两岸的情感纽带。其“收复宝岛”的伟业在中华民族历史上具有极其神圣的地位，被尊为“开台圣王”。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0024
    name: 于谦
    default_gender: male
    archetype: civil
    flavor: （1398年—1457年）字廷益，大明社稷的救星，著名的忠臣良将。土木堡之变后，明英宗被俘，瓦剌大军直指北京。在满朝文武惶恐、朝廷计划南迁之际，于谦力排众议，抱着“社稷为重，君为轻”的信念，亲自披甲登上城头组织浴血奋战，最终击退也先，保住了大明江山与华夏文化。他为官廉洁，两袖清风，深得民心。然而在夺门之变后，他遭到徐有贞等人的陷害被冤杀。其在狱中写下的《石灰吟》：“粉身碎骨浑不怕，要留清白在人间”，正是他一生刚正不阿形象的真实写照。其浩然正气流传千古，他那种“独立于危难、不计个人荣辱”的境界，是中国文臣精神的最高标杆。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0026
    name: 袁崇焕
    default_gender: male
    archetype: military
    flavor: （1584年—1630年）字元素，明末辽东战场的擎天一柱。他以文官之身毅然出关，镇守孤城宁远，凭借先进的红夷大炮战术与坚韧的防守意志，在宁远大战中重创后金汗努尔哈赤，取得了明军多年未有的辉煌胜利。此后他苦心经营关宁锦防线，使皇太极的八旗劲旅屡次受挫。然而，面对清朝的离间计和崇祯帝的多疑性格，这位赤胆忠心的统帅最终被以通敌罪名逮捕，并处以极其惨烈的凌迟极刑。直到乾隆年间真相大白，袁崇焕终被后世公认为力挽狂澜的民族悲情英雄。其忠义之魂永远守望着辽东的关隘，其悲剧命运也成了大明王朝灭亡史中最沉重的一声叹息。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0027
    name: 李时珍
    default_gender: male
    archetype: civil
    flavor: （1518年—1593年）字东璧，晚号濒湖山人，大明伟大的医药学家，被后世尊为“药圣”。他出身医学世家，深感古代医书由于传抄与主观臆断而导致错误百出，立志重修本草。李时珍背起药篓，走遍名山大川，不顾严寒酷暑亲自采摘标本，甚至多次以身试药以求药效准确。历时二十七载，在参考了八百余部古籍的基础上，他终于写成了不朽巨著《本草纲目》。此书不仅系统记录了一千八百九十二种药物，更包含了他对生物、化学、地质的深刻见解，被西方科学界誉为“东方百科全书”。他那种求真务实、舍身求法的科学实证精神，跨越时空，至今仍是中医药界乃至世界医学界的最高楷模。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0029
    name: 徐渭
    default_gender: male
    archetype: civil
    flavor: （1521年—1593年）字文清，号青藤道士，明代杰出的文学家、书画家、戏曲家与军事谋略家。他的一生充满传奇与悲剧色彩，性格狂放不羁且由于仕途坎坷、精神受创而多次自杀未遂。他在绘画上具有极强的爆发力，开创了大写意花鸟画风，其笔墨奔放、意境凄冷且气势夺人，深刻影响了后来的八大山人、石涛及齐白石。徐渭在戏曲方面亦有开创之功，其作品《四声猿》被誉为明代杂剧的巅峰。他在协助胡宗宪抗倭期间，展现了卓越的军事眼光。他的一生是在穷困潦倒与精神折磨中，将个人强烈的情感倾注于笔端的艺术苦旅，成为了中国艺术史上最孤独且伟大的天才之一，其灵魂在法度之外寻求到了极致的真实。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0030
    name: 朱载堉
    default_gender: male
    archetype: civil
    flavor: （1536年—1611年）字伯勤，号句曲山人，明朝杰出的科学家、音律学家与历算家。他虽贵为郑王之子，却淡泊爵位，曾为抗议父亲蒙冤而潜心居住于简陋的土室中钻研学术长达十九年。他最大的成就即是发明了“十二平均律”，这一极其精密的物理声学成果彻底解决了自古以来音律转调的难题，其等分律思想在时间上早于欧洲等温体系的成熟与普及，被国际学术界誉为“东方文艺复兴时期的科学巨匠”。朱载堉在数学（如算盘开方）、历法、计量学等领域亦有极深造诣，其巨著《乐律全书》是中华科学文明的一座丰碑。他那种追求客观真理高于皇权富贵的姿态，展现了明代学者中极其难能可贵的人格光辉与理性实证精神。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0031
    name: 阎应元
    default_gender: male
    archetype: military
    flavor: （生年不详—1645年）明末抗清英雄，江阴保卫战的灵魂人物。他原为一名普通的典吏，在民族存亡的关头，被江阴百姓推举为统帅。他以卓越的防御指挥艺术与坚不可摧的志向，率领数万城中民众，凭借简陋武器抵挡了清朝多尔衮麾下二十万精锐大军长达八十一天的猛烈进攻，阵斩清军将士万余人。城破后他由于不肯降清，投水自尽未遂后慷慨就义。其绝命联“八十日带发效忠，表太祖十七代皇帝；十万人同心死义，留大明三百里江山”气贯长虹，是华夏民族气节的最高写照。他被后世尊为“忠义之身”，证明了在大厦将倾之际，区区一介小官亦能用鲜血和勇气为普通民众守住尊严。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0032
    name: 唐寅
    default_gender: male
    archetype: civil
    flavor: （1470年—1524年）字伯虎，号六如居士，明代“吴中四才子”之首。他自幼才华横溢、名震江南，却在赴京会试时无辜卷入舞弊案，仕途理想彻底破碎。从此他寄情于诗画，放浪形骸于姑苏烟雨之中，自嘲为“江南第一风流才子”。他的画作笔墨精妙，山水、仕女画臻至化境，既有文人的典雅脱俗，又不失世俗生活的灵动。桃花坞里桃花庵，他在诗歌中寻求心灵的绝对自由。虽然民间广为流传的“点秋香”多为虚构附会，但那个才华卓绝、一生坎坷而又傲骨嶙峋的艺术形象，早已成为江南文人文化的最佳精神代表。他那种在贫病交加中依然能保持浪漫情怀与艺术傲骨的姿态，使其成为了后世文人心中永恒的偶像。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0037
    name: 曹雪芹
    default_gender: male
    archetype: civil
    flavor: （1715年—1763年）名霑，字梦阮，号雪芹，清代伟大的文学家，不朽巨著《红楼梦》的作者。他出身于显赫一时的江宁织造曹家，早年过着锦衣玉食的生活，中岁遭遇家道中落，落入穷困潦倒的境地。在贫病交加、举家食粥的凄凉晚年，曹雪芹于北京西郊披阅十载，增删五次，以极其深邃的哲学眼光与卓越的艺术造诣，通过贾、王、史、薛四大家族的兴衰，深刻剖析了封建社会末期的制度腐朽与人性悲剧。这部作品不仅是一部凄婉动人的爱情挽歌，更是一部涵盖了建筑、医药、饮食、礼俗等方方面面的中国古典文明百科全书。曹雪芹以其超越时代的思想光辉和人文关怀，在世界文学史上矗立起了一座无法超越的高山，其天才与痴诚将永远启迪着每一个感悟命运的灵魂。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0038
    name: 纳兰性德
    default_gender: male
    archetype: civil
    flavor: （1655年—1685年）字容若，号楞伽山人，清初著名的文学家、词人，被誉为“满洲第一才子”。他出身极其显赫，其父为武英殿大学士纳兰明珠。纳兰性德自幼才华横溢，年纪轻轻即登进士第，并担任康熙皇帝的一等侍卫。尽管身为权贵子弟，他却心向自然，性格细腻多情，其词作风格哀感顽艳、清丽脱俗，尤其是他的悼亡词与边塞词，字里行间充满了对平凡真情的向往与对繁华枷锁的厌倦。其名句“人生若只如初见，何事秋风悲画扇”传诵三百年而不衰。纳兰性德年仅三十一岁便英年早逝，他的一生犹如一束清冷的流光，虽短暂却惊艳了整个大清文坛。他那种将高度的文化修养与敏感的诗人灵魂完美结合的特质，使其成为了中国词学史上一座永恒的丰碑。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0040
    name: 黄宗羲
    default_gender: male
    archetype: civil
    flavor: （1610年—1695年）字太冲，号南雷，明末清初杰出的思想家、史学家、哲学家，被誉为“中国思想启蒙之父”。他在青年时代积极参与复社活动，投身抗清斗争，兵败后隐居著书。黄宗羲博通经史、天文、历算、地理，他在学术上主张经世致用，反对空谈心性。其名著《明夷待访录》对君主专制制度进行了极其深刻的批判，提出了“天下为主，君为客”的进步思想，带有明显的早期民主启蒙色彩。他在史学上开创了浙东史学派，强调史学研究应服务于现实改革。黄宗羲的一生是知识分子在民族危难与政权更替中保持独立人格与深度反思的过程。他那种敢于挑战两千年皇权传统的政治胆略与深厚的学术底蕴，使其成为了中国学术史上的一座巍峨丰碑。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0041
    name: 郑和
    default_gender: male
    archetype: military
    flavor: （1371年—1433年）三保太监，明朝著名的航海家、外交家。在明成祖朱棣的支持下，他率领当时世界上规模最大、技术最先进的宝船舰队，先后七次远涉重洋。他的足迹遍及东南亚、印度洋，最远到达红海和非洲东海岸，航程总计十六万海里。这不仅是一次宣扬大明国威的和平之旅，更极大地促进了中外商贸与文化交流，并使明代远洋航行与朝贡外交活动在15世纪达到高峰。其航行时间早于哥伦布远航，但两者历史背景与后续影响并不相同。尽管下西洋由于耗资巨大在后期停止，但郑和的名字已成为中国海洋精神的永恒象征。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0042
    name: 顾炎武
    default_gender: male
    archetype: civil
    flavor: （1613年—1682年）字宁人，号亭林，明末清初伟大的思想家、史学家与语言学家，与黄宗羲、王夫之并称“清初三先生”。他在明亡后坚守民族志节，周游天下考察地理与民情，提出了“天下兴亡，匹夫有责”的响亮口号。他在学术上极其推崇“经世致用”，开创了清代严谨的考据学风。其名著《日知录》涵盖了政治、经济、法律、地理、历史等各个领域，通过极其缜密的文献排比与实地调研，系统地总结了明代政治腐败的教条教训。顾炎武在音韵学上亦有极其显赫的成就，复原了上古音韵体系。他那种追求真理、不向新朝屈服的高傲品格，使其成为了中国知识分子追求人格独立与社会责任的永恒标杆。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0028
    name: 董其昌
    default_gender: male
    archetype: civil
    flavor: （1555年—1636年）字玄宰，号思翁，晚明书画艺术的领袖，官至礼部尚书。他在艺术理论上提出著名的“南北宗”论，推崇平淡天真的文人画风格，对后世中国画产生了决定性的影响。董其昌的书法综合了晋、唐、宋名家之长，风格高雅、清劲婉丽，其笔墨追求意境的空灵与气韵的自然，被誉为书法史上的集大成者。他在绘画上主张以古人为师而又不失个人灵性，其艺术趣味主宰了清代长达三百年的审美风潮。尽管他在乡间的家族行为在史书中颇具争议，但其作为中国艺术史上转型期的一代宗师地位不容置疑。他那种将儒家官员的儒雅风范与极高艺术自律完美结合的境界，确立了晚明士大夫的文化高度。
