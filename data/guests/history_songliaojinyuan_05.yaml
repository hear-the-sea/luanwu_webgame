    flavor: 吕祖谦（1137—1181），字伯恭，号东莱，婺州金华人，南宋理学家、史学家，金华学派代表。隆兴元年（1163）进士，复中博学宏词科，讲学于丽泽书院；与朱熹、张栻并称东南三贤，曾参与编纂《近思录》，并奉诏编成北宋诗文总集《宋文鉴》。
