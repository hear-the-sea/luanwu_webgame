heroes:
  blue:
  - key: hist_songliaojinyuan_0209
    name: 姜夔
    default_gender: male
    archetype: civil
    flavor: （约1155年-1221年）南宋词人、音乐家。他词风清空骚雅，自成一派。他的词多附有工尺谱，是研究宋代音乐的珍贵资料。他在词、乐、谱之间建立起罕见的互证关系，后世讨论南宋审美转型时，几乎都绕不开姜夔这一坐标人物。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0211
    name: 赵鼎
    default_gender: male
    archetype: civil
    flavor: （1085年-1147年）南宋名相，主战派领袖。他两度为相，力主抗金。他反对秦桧的投降政策，被贬谪至海南，绝食而死，以死明志。研究赵鼎时，常需把战术判断与组织条件并列考察，才能准确理解其成败背后的结构性因素。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0222
    name: 王坚
    default_gender: male
    archetype: military
    flavor: （1198年-1264年）南宋名将，钓鱼城保卫战的守将。他坚守钓鱼城三十六年，蒙哥汗就是死在他守卫的城下。他创造了军事史上的奇迹。无论成败如何，王坚所面对的战场条件都具有典型性，因此其经验常被后人用作比较案例。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  green:
  - key: hist_songliaojinyuan_0210
    name: 史弥远
    default_gender: male
    archetype: civil
    flavor: （1164年-1233年）南宋权相，主政二十六年。他发动政变杀死韩侂胄，主张与金议和。他专权揽政，但也维持了朝局稳定。从人物史角度看，史弥远的经历兼具代表性与特殊性，适合用于说明时代结构与个人命运的交错。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0212
    name: 胡铨
    default_gender: male
    archetype: civil
    flavor: （1102年-1180年）南宋名臣，铁骨铮铮的谏官。他上书请斩秦桧、王伦、孙近三人，被贬海南二十年。他宁死不屈，是南宋最著名的主战派。从史料脉络看，胡铨的政治选择更多是多重压力叠加下的结果。这也使其在同代人物中长期保持较高辨识度与讨论价值。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0213
    name: 王淮
    default_gender: male
    archetype: civil
    flavor: 王淮（1126年-1189年），南宋宰相，婺州金华人。绍兴十五年进士。孝宗淳熙八年拜右丞相、兼枢密使。主政期间与金维持和议，内政以宽简为务。荐用朱熹、吕祖谦等人，然对道学亦有所抑。卒赠太师，谥文定。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0214
    name: 周必大
    default_gender: male
    archetype: civil
    flavor: （1126年-1204年）南宋名相，文章泰斗。他历仕四朝，两度为相。他主持编修国史，著述丰富，是南宋文化的重要推动者。从人物史角度看，周必大的经历兼具代表性与特殊性，适合用于说明时代结构与个人命运的交错。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0215
    name: 赵汝愚
    default_gender: male
    archetype: civil
    flavor: （1140年-1196年）南宋名相，宗室宰相。他拥立宋宁宗即位，却被韩侂胄排挤，贬谪而死。他的悲剧是南宋权力斗争的缩影。赵汝愚常被置入人物谱系讨论，正因为其经历与时代结构变化贴合度很高。围绕其用人取向与政治节奏的讨论，至今仍是理解南宋中枢博弈的重要切口。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0216
    name: 叶适
    default_gender: male
    archetype: civil
    flavor: （1150年-1223年）南宋思想家，永嘉学派代表。他主张经世致用，批评空谈义理。他的学说对后世实学思想影响深远。评价叶适时，往往需要把作品风格、思想立场与身处时局放在同一框架里观察。其“务实而不废义理”的路径，使他在宋元思想史讨论中始终占据关键位置。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0217
    name: 陈亮
    default_gender: male
    archetype: civil
    flavor: （1143年-1194年）南宋思想家，永康学派代表。他主张北伐，批评苟安。他与朱熹有著名的"王霸义利之辩"。他的爱国热情感染了无数后人。从陈亮作品的语气与题材变化，可以清楚追踪其人生处境对表达方式的持续影响。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0218
    name: 魏了翁
    default_gender: male
    archetype: civil
    flavor: （1178年-1237年）南宋理学家，鹤山先生。他传承朱熹学说，著述颇丰。他为官正直，多次直谏，是南宋理学的重要人物。学界持续关注魏了翁，核心原因在于其作品既可做文学分析，也可支撑历史语境解读。相关研究与通俗叙述至今仍常把其作为典型案例。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0219
    name: 真德秀
    default_gender: male
    archetype: civil
    flavor: （1178年-1235年）南宋理学家，西山先生。他是朱熹的再传弟子，著《大学衍义》，影响深远。他为官清正，是南宋理学官僚的代表。真德秀的历史面貌通常要结合文体表现、价值取向与现实处境三层信息来判断。他在学术与政务之间的双重实践，也为后世提供了理学入世的一条可行范式。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0220
    name: 刘克庄
    default_gender: male
    archetype: civil
    flavor: （1187年-1269年）南宋词人，豪放派代表。他词风慷慨激昂，关注国事。他一生坎坷，却始终保持爱国热情。在研究路径上，刘克庄兼具文本细读价值与时代观察价值，因此常被列为入门与进阶讨论的共同案例。这类材料在教学与研究中都具有高复用价值，常被用来训练“文本-时代”双向阅读。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0221
    name: 吴潜
    default_gender: male
    archetype: civil
    flavor: （1195年-1262年）南宋名相，状元宰相。他历仕三朝，两度为相。他力主抗蒙，却被贾似道排挤，贬谪而死。在吴潜身上，可见将领个人能力与军政体系边界之间持续拉扯的现实。借由吴潜的案例，后世研究者能够从胜败之外看清组织能力、情报质量与战略目标的对应关系。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0223
    name: 曹友闻
    default_gender: male
    archetype: military
    flavor: 曹友闻：南宋抗蒙将领，同庆府人。端平三年（1236），蒙古阔端部攻蜀，友闻率部扼守仙人关，力挫敌锋。后于大安军阳平关与蒙军血战，因寡不敌众，与弟友万同日战死。其坚守迟滞了蒙军南下步伐，宋廷后追谥毅节。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0224
    name: 杨存中
    default_gender: male
    archetype: military
    flavor: （1102—1166），南宋殿前都指挥使。代州崞县人，追随高宗南渡，以骑射见长，在藕塘、柘皋等役中大破金军。后期依附秦桧，得以久掌禁旅。统兵近四十年，为南宋前期禁军核心将领。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0226
    name: 刘宝
    default_gender: male
    archetype: military
    flavor: 刘宝：南宋将领，原为岳家军部将，曾随岳飞参与郾城、颍昌等役。岳飞遇害后，刘宝仍在军中效力，后官至镇江都统制。然其独立领军后无显著战绩可述，史料对其事迹记载零散，晚年结局亦不详。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0227
    name: 毕再遇
    default_gender: male
    archetype: military
    flavor: 毕再遇：南宋名将，兖州人，字德卿。开禧二年（1206）随军北伐，于泗州、六合、楚州等地屡破金军，以用兵灵活著称。曾施悬羊击鼓之计智退追兵，传为佳话。北伐整体失利后仍坚守淮东。嘉定十年（1217）病卒，谥忠毅。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0228
    name: 赵范
    default_gender: male
    archetype: military
    flavor: 赵范：南宋将领，赵方之子，赵葵之兄。端平年间始主理京湖防务，继孟珙之后承担抗蒙重任。然其军事才能不及其弟赵葵，面对蒙古攻势屡遭败绩，辖区逐步缩减。晚年仕途沉寂，卒于宝祐年间。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0229
    name: 高达
    default_gender: male
    archetype: military
    flavor: （？-约1276年）南宋将领。元军南攻时据守江陵，屡拒蒙军招降，率部力战死守。城破被执，不屈而死。《宋史》载其忠烈殉国，然生平细节传世甚少，后世知其名而难详其事。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0230
    name: 向士璧
    default_gender: male
    archetype: military
    flavor: （？-1275年）南宋将领，四川抗蒙名将。他坚守合州，继承余玠遗志。他的坚守为南宋延续了国祚。关于向士璧相关战事的记载并不一致，这种差异本身也反映了不同史家立场。对其得失的讨论越深入，越能还原该时期军事系统的真实运行方式。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0231
    name: 姜才
    default_gender: male
    archetype: military
    flavor: （？—1276），南宋末将领。濠州人，隶李庭芝麾下，骁勇善战。德祐元年元军围扬州，才率部死守，屡挫敌锋。城陷被执，押赴瓜洲，不屈被杀。临刑时怒骂不止，观者无不落泪。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0232
    name: 夏贵
    default_gender: male
    archetype: military
    flavor: 夏贵（1197—1279），南宋晚期淮西主帅。出身行伍，积功至淮西制置使，镇守淮西近三十年，屡退蒙军。开庆元年蒙古攻淮，守城有功。德祐元年元军大举南下，贵以庐州降元，旧部多不从。降后事迹宋元两方正史均鲜记载，卒年系据元人零星著录推定。贵一生戎马，战守屡有功，唯晚节失据，后人评骘分歧。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0233
    name: 吕文德
    default_gender: male
    archetype: military
    flavor: （1199年-1269年）南宋将领。镇守京湖多年，主持沿江防务。襄阳被围期间任荆湖制置使，然援襄迟缓、调度受到朝野指摘。其才足御边而德不胜任，身后毁誉参半。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0234
    name: 吕文焕
    default_gender: male
    archetype: military
    flavor: （1236—？），吕文德之弟，南宋襄阳守将。咸淳三年起困守襄阳，外援断绝，城中粮尽，至人相食。坚守六年，终以孤城无援，于咸淳九年降元。后为元招降沿江州郡，加速宋亡。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0235
    name: 史嵩之
    default_gender: male
    archetype: civil
    flavor: （1189年-1257年）南宋权相，史弥远之侄。绍定至淳祐间历参知政事、右丞相。主政间主和蒙古，对内排击异己。淳祐四年遭父丧，乞终制不许，夺情起复，朝野交章弹劾而罢。去位后闲居而终。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0236
    name: 陈文龙
    default_gender: male
    archetype: civil
    flavor: 陈文龙（1232—1277），莆田人，咸淳四年状元。历官监察御史、参知政事，以论劾贾似道被贬。德祐二年元军攻兴化，文龙毁家纾难，据城死守。城破被执，绝食不屈而死。与文天祥俱以状元死节，闽中至今祀之。存世诗文十馀篇，皆抗元死节前之作。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0237
    name: 谢枋得
    default_gender: male
    archetype: civil
    flavor: （1226—1289），南宋遗民，字君直，号叠山。信州弋阳人，宝祐进士。曾率兵抗元，兵败流亡。宋亡后隐于闽中，麻衣蔬食，誓不仕元。至元二十六年被强征至大都，悯忠寺绝食五日而死。门人私谥文节。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0238
    name: 邓剡
    default_gender: male
    archetype: civil
    flavor: （1232年-1303年）南宋词人，字光荐，号中斋，庐陵人。与文天祥同乡交厚。崖山之役被俘，与天祥同囚金陵，狱中唱和。宋亡拒仕元朝，后出家为僧，有《中斋集》传世。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0239
    name: 王应麟
    default_gender: male
    archetype: civil
    flavor: 王应麟（1223—1296），鄞县人，淳祐元年进士，博学强记，官至礼部尚书。宋亡后杜门不出，以著述终老。传世有《困学纪闻》二十卷，考据经史，清儒极推重之。又纂类书《玉海》二百卷。旧传蒙学《三字经》出其手，然宋元书目均未著录，学者存疑。应麟治学以征实见长，不务空言。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0240
    name: 黄震
    default_gender: male
    archetype: civil
    flavor: 黄震（1213—1280），南宋理学家，师承朱熹再传弟子。著有《黄氏日抄》百卷，以考辨经义、针砭时弊见长，尤重躬行实践，于浙东学派中自成一家。晚年讲学不辍，为宋末理学重要传播者。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0241
    name: 文及翁
    default_gender: male
    archetype: civil
    flavor: 文及翁，字时举，号本心，宝祐元年状元，官至签书枢密院事。其《贺新郎·游西湖》借游湖直刺朝野苟安偏安之弊，为宋末词中罕有的讽政之作。词作存世虽寡，篇篇寓家国沉痛。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0242
    name: 史达祖
    default_gender: male
    archetype: civil
    flavor: （1163年-1220年）南宋词人，词风婉约。他的词精工细腻，与姜夔、吴文英齐名。他是南宋婉约派的重要作家。史达祖的历史面貌通常要结合文体表现、价值取向与现实处境三层信息来判断。围绕史达祖的不同评价长期并存，也正因为其经历本身就触及当时最敏感的价值议题。
    growth_range:
