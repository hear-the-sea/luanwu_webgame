    archetype: civil
    flavor: 吴文英，字君特，号梦窗，四明（今浙江宁波）人，南宋词人。一生未仕，长期往来苏杭，曾入吴潜、嗣荣王赵与芮幕中；词作讲究音律与辞藻，意象绵密，张炎评其词如七宝楼台，眩人眼目。《梦窗词》按甲乙丙丁四稿编次，今存三百余首。
