    flavor: 尤袤（1127—1194），字延之，号遂初居士，常州无锡人，南宋诗人、藏书家。绍兴十八年（1148）进士，历官知台州、礼部尚书；与杨万里、范成大、陆游并称中兴四大诗人，家富藏书，所编《遂初堂书目》是宋代重要的私藏书目。
