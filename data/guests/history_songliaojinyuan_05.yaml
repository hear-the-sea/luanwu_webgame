heroes:
  blue:
  - key: hist_songliaojinyuan_0209
    name: 姜夔
    default_gender: male
    archetype: civil
    flavor: （约1155年-1221年）南宋词人、音乐家。他词风清空骚雅，自成一派。他的词多附有工尺谱，是研究宋代音乐的珍贵资料。他在词、乐、谱之间建立起罕见的互证关系，后世讨论南宋审美转型时，几乎都绕不开姜夔这一坐标人物。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0211
    name: 赵鼎
    default_gender: male
    archetype: civil
    flavor: （1085年-1147年）南宋名相，主战派领袖。他两度为相，力主抗金。他反对秦桧的投降政策，被贬谪至海南，绝食而死，以死明志。研究赵鼎时，常需把战术判断与组织条件并列考察，才能准确理解其成败背后的结构性因素。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0222
    name: 王坚
    default_gender: male
    archetype: military
    flavor: （1198年-1264年）南宋名将，钓鱼城保卫战的守将。他坚守钓鱼城三十六年，蒙哥汗就是死在他守卫的城下。他创造了军事史上的奇迹。无论成败如何，王坚所面对的战场条件都具有典型性，因此其经验常被后人用作比较案例。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  green:
  - key: hist_songliaojinyuan_0210
    name: 史弥远
    default_gender: male
    archetype: civil
    flavor: （1164年-1233年）南宋权相。开禧北伐失利后，他联合杨皇后等诛杀韩侂胄，转而维持与金的和议；此后长期专权，又参与拥立宋理宗，把朝廷内外都纳入自己的权力秤盘。史弥远不是只会搅局的奸臣，也确实让中枢在一段时期保持运转；只是他把朝堂稳成了自己的家门，后来人便很难不记住那份专擅。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0212
    name: 胡铨
    default_gender: male
    archetype: civil
    flavor: （1102年-1180年）南宋谏臣。绍兴八年上书，请斩秦桧、王伦、孙近，言辞锋利到几乎把朝堂的帷幕一把扯开，因此被贬岭南，长期不得北归。胡铨不是不知道主战会招来祸患，只是不肯把求和写成太平；二十年风雨磨不钝这柄谏剑，反让“铁骨”二字有了重量。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0213
    name: 王淮
    default_gender: male
    archetype: civil
    flavor: 王淮（1126年-1189年），婺州金华人，绍兴十五年进士。孝宗淳熙年间拜右丞相、兼枢密使，主政时对金维持和议，内政偏于宽简；他曾荐用朱熹、吕祖谦等人，却也并非对道学全无疑虑。王淮的政坛身法不是一味趋同，而是在安边、用人与学术声望之间反复拿捏，步子稳，却不见得没有棱角。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0214
    name: 周必大
    default_gender: male
    archetype: civil
    flavor: （1126年-1204年）南宋名相，历仕四朝，两度入相。周必大主持或参与编修国史，文章与政务都见长，留下的文集也让南宋朝廷的日常声息得以传世。他不像边将凭一战成名，而是以几十年案头功夫把国史、诏令与文墨一层层接起来；朝堂的长局，往往更考验这种耐力。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0215
    name: 赵汝愚
    default_gender: male
    archetype: civil
    flavor: （1140年-1196年）南宋宗室宰相。宋光宗失政后，赵汝愚与韩侂胄等拥立宁宗即位，旋即与韩氏争权；他最终被排挤出朝，贬谪而死。扶君登位时是定海针，权力重排后却成了被拔掉的钉子。赵汝愚的悲剧不只在个人失势，也在于南宋中枢把救急之举变成了新的权力战场。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0216
    name: 叶适
    default_gender: male
    archetype: civil
    flavor: （1150年-1223年）南宋思想家，永嘉学派代表，号水心。叶适重视经世致用，主张把财赋、军政与民生这样的硬问题带进学问，反对只在义理名目上空转；但他的务实也并非抛弃义理，而是要让道理经得起行事检验。若理学是内功，他偏要先问这内功能不能下山办事。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0217
    name: 陈亮
    default_gender: male
    archetype: civil
    flavor: （1143年-1194年）南宋思想家、文学家，永康学派代表，号龙川。陈亮反对偏安，屡陈恢复中原之策；与朱熹往复书信时，又展开著名的“王霸义利之辩”，不肯把现实功业简单斥为不义。一个人能把道理讲得锋利，也能把山河写得滚烫，陈亮的文字至今仍有战鼓般的回声。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0218
    name: 魏了翁
    default_gender: male
    archetype: civil
    flavor: （1178年-1237年）南宋理学家，号鹤山。魏了翁承朱学而不止于讲章，任官时多次直谏，面对权势也不肯把原则折成圆角。他的学问重视修身与治事相接，既能在书院论心性，也会在朝堂谈民政。鹤山之“鹤”不是避世高飞，而是偶尔振翅飞到最嘈杂的地方鸣一声。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0219
    name: 真德秀
    default_gender: male
    archetype: civil
    flavor: （1178年-1235年）南宋理学家，号西山，朱熹再传弟子。所著《大学衍义》把修身、治国的理学论述编成一套可供君臣取法的政治读本；真德秀为官也以清正敢言著称。纸上讲的是格物诚意，朝中面对的却是财赋、边患与人事，他试图让理学不只停在书斋门槛内。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0220
    name: 刘克庄
    default_gender: male
    archetype: civil
    flavor: （1187年-1269年）南宋词人、诗人，词风豪放而多涉国事。刘克庄仕途屡起屡落，既写风花，也写边患与故国之思；他的豪情不是少年一怒，而是历经退黜后仍不肯熄灭的火。江湖布衣与朝廷文臣的两种身份在他笔下交错，使一句词常带着半生风霜。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0221
    name: 吴潜
    default_gender: male
    archetype: civil
    flavor: （1195年-1262年）南宋状元宰相，历仕三朝，两度入相。面对蒙古压力，吴潜主张整军备战，却与贾似道等人的权力路线相冲，最终遭排挤贬谪而死。状元的文章能写得漂亮，边报却不会因此变得温柔；吴潜的结局，正是主战判断与朝廷权力彼此不容时留下的裂痕。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0223
    name: 曹友闻
    default_gender: male
    archetype: military
    flavor: 南宋抗蒙将领，同庆府人。端平三年（1236），蒙古阔端部攻蜀，曹友闻率军扼守仙人关，先挫敌锋；后来在大安军阳平关与蒙军血战，因寡不敌众，与弟曹友万同日战死。兄弟并肩守关，没能守住性命，却为蜀道争得了时间，宋廷追谥毅节。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0224
    name: 杨存中
    default_gender: male
    archetype: military
    flavor: （1102—1166）代州崞县人，南宋殿前都指挥使，原名杨沂中，后改名杨存中。随高宗南渡，以骑射见长，在藕塘、柘皋等战事中击破金军，统兵近四十年。晚年与秦桧集团关系密切，得以久掌禁旅；他的军功与仕途依附并存，正是南宋将领难以避开的双刃局。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0226
    name: 刘宝
    default_gender: male
    archetype: military
    flavor: 南宋将领，早年为岳家军部将，曾随岳飞参与郾城、颍昌等战事。岳飞遇害后，刘宝仍在军中任职，后来做到镇江都统制；但他独立领军后的战绩并不显著，史料也没有留下完整晚年。名将麾下的一员偏将，离开主帅的战旗后，究竟能走多远，刘宝的经历给出了沉默的答案。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0227
    name: 毕再遇
    default_gender: male
    archetype: military
    flavor: 南宋名将，兖州人，字德卿。开禧二年（1206）北伐时，毕再遇在泗州、六合、楚州等地屡破金军，善于因势设奇；“悬羊击鼓”之计便是他智退追兵的传说。北伐大局虽败，他仍守住淮东，嘉定十年病卒，谥忠毅。兵法有时不是硬碰硬，能让敌人追着一阵假鼓声跑，也是一门真功夫。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0228
    name: 赵范
    default_gender: male
    archetype: military
    flavor: 南宋将领，赵方之子、赵葵之兄。端平年间主持京湖防务，继孟珙之后承担抗蒙重任；可与善战的弟弟赵葵相比，赵范应对蒙古攻势较为失利，辖区也逐步收缩。将门兄弟同桌论剑，未必人人都能使出同样的招式；他的功过，须放回兵力、地势与残局压力中看。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0229
    name: 高达
    default_gender: male
    archetype: military
    flavor: （？—约1276年）南宋将领，元军南下时据守江陵。高达屡拒招降，率部苦战守城，城破被俘后仍不屈而死。《宋史》留下他的忠烈，却没有留下太多早年履历；对这样一位史料寥寥的守将，能确认的不是传奇细节，而是城破之后仍未低头。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0230
    name: 向士璧
    default_gender: male
    archetype: military
    flavor: （？—1275年）南宋将领，长期参与四川抗蒙防务，曾守合州一带，承接余玠经营山城的路线。向士璧的战事记载有出入，能确定的是他把孤城与蜀道当作南宋最后的屏障来守。后世若把所有延国之功都压在一人肩上，未免太重；但他在危局中接过旧旗的姿态，确实值得记下。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0231
    name: 姜才
    default_gender: male
    archetype: military
    flavor: （？—1276）濠州人，南宋末将领，隶李庭芝麾下。德祐元年元军围扬州，姜才率部死守，屡次挫敌；城陷被执、押赴瓜洲时仍不肯屈服，临刑前怒骂不止。扬州已无可退之路，他把最后一口气也用来骂敌，这份刚烈使旁观者无不落泪。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0232
    name: 夏贵
    default_gender: male
    archetype: military
    flavor: 夏贵（1197—1279），南宋晚期淮西主帅，出身行伍，镇守淮西近三十年，屡有退蒙之功。开庆年间守城有功，德祐元年元军大举南下时却以庐州降元，旧部多不相从；降后事迹又少见于宋元正史，卒年亦只可据零星材料推定。夏贵一生战守皆有本事，唯独最后把刀放下，遂让后人始终争论不休。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0233
    name: 吕文德
    default_gender: male
    archetype: military
    flavor: （1199年-1269年）南宋将领，镇守京湖多年，主持沿江防务。襄阳被围时任荆湖制置使，朝野屡以援襄迟缓、调度失当相责；他确有御边才干，却也在关键处留下了难以洗去的疑云。吕文德的名字像一面有裂纹的盾：挡过边患，裂痕也恰恰出现在最要紧的地方。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0234
    name: 吕文焕
    default_gender: male
    archetype: military
    flavor: （1236—？）吕文德之弟，南宋襄阳守将。咸淳三年以后，襄阳与樊城被元军围困，外援断绝、粮尽至人相食；吕文焕守了约六年，终于在孤城无援时降元。后来他替元招降沿江州郡，加速南宋崩解。守城六年是真，降城之后替新主开门也是真，历史不会替这两笔互相抵消。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0235
    name: 史嵩之
    default_gender: male
    archetype: civil
    flavor: （1189年-1257年）史弥远之侄，南宋权相，历任参知政事、右丞相。主政时倾向与蒙古议和，对内又排击异己；淳祐四年父丧，他请求服满丧期却未获准，夺情起复后遭朝野交章弹劾，终于罢相。史嵩之的权力来得有家门助力，退场时却被礼法、舆论与政敌一同反噬。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0236
    name: 陈文龙
    default_gender: male
    archetype: civil
    flavor: 陈文龙（1232—1277），莆田人，咸淳四年状元。历官监察御史、参知政事，因论劾贾似道而被贬；德祐二年元军攻兴化，他毁家纾难，率众据城死守。城破被执后绝食不屈而死，与文天祥同以状元之身殉宋。文章留得不多，最后写在身上的那一篇，却是城破之后仍不肯改色。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0237
    name: 谢枋得
    default_gender: male
    archetype: civil
    flavor: （1226—1289）字君直，号叠山，信州弋阳人，宝祐进士。曾率兵抗元，兵败后流亡；宋亡便隐居闽中，麻衣蔬食，发誓不仕元。至元二十六年被强征到大都，入悯忠寺绝食而死，门人私谥文节。谢枋得把遗民二字活成了日常选择，不在朝堂拔剑，却连一口降世的饭也不肯咽下。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0238
    name: 邓剡
    default_gender: male
    archetype: civil
    flavor: （1232年-1303年）字光荐，号中斋，庐陵人，与文天祥同乡交厚。崖山之后被俘，曾与文天祥同囚金陵，狱中仍以诗词唱和；宋亡后拒仕元朝，晚年出家为僧，有《中斋集》传世。国破之后还能写诗，不是把苦难写轻，而是让故国的声音在囚室里多留一会儿。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0239
    name: 王应麟
    default_gender: male
    archetype: civil
    flavor: 王应麟（1223—1296），鄞县人，淳祐元年进士，官至礼部尚书。宋亡后闭门著述，留下《困学纪闻》与二百卷《玉海》，以考据经史、广搜掌故见长。旧传《三字经》出自其手，但宋元书目没有确证，仍当存疑。王应麟治学像查一桩旧案，证据不到，宁可把“相传”二字留在门外。
    growth_range:
