    archetype: civil
    flavor: 蒋捷（约1245—约1305），字胜欲，号竹山，常州宜兴人，宋末元初词人。咸淳十年（1274）进士，宋亡后隐居不仕，词多写身世飘零与故国之思，语言清畅，有《竹山词》传世，《虞美人·听雨》尤为后人传诵。
