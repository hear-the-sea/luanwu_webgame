    flavor: 刘过（1154—1206），字改之，号龙洲道人，吉州太和人，南宋布衣词人。终身未仕，漫游江湖，屡次上书言恢复之事而不报；与辛弃疾、陆游、陈亮等交游唱和，其词多抒抗金报国之志，风格豪纵，有《龙洲集》《龙洲词》传世。
