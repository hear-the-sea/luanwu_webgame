    flavor: 胡安国（1074—1138），字康侯，号武夷先生，建州崇安人，南宋理学家、经学家。绍圣四年（1097）进士，曾任中书舍人、给事中等职；以《春秋》学名家，所著《春秋传》阐发君臣名分与华夷之辨，元代以后被列为科举用书，卒谥文定。
