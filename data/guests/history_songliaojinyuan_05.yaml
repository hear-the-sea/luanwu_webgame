    flavor: 李侗（1093—1163），字愿中，号延平，南剑州剑浦人，南宋学者，世称延平先生。师从罗从彦，得二程洛学正传，终身未仕，主张默坐澄心、体认天理；长期隐居讲学，朱熹于绍兴二十三年（1153）从其问学，问答辑为《延平答问》。
