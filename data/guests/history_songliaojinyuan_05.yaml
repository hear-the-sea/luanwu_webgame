heroes:
  blue:
  - key: hist_songliaojinyuan_0209
    name: 姜夔
    avatar: monkey/其他随机角色/文039_男.png
    default_gender: male
    archetype: civil
    flavor: （约1155年—1221年）南宋词人、音乐家，字尧章，号白石道人，饶州鄱阳人。姜夔终身布衣，长期游历江浙，精通音律，所著《白石道人歌曲》保存多首附工尺谱的词曲；其《扬州慢》《暗香》等作品声律清婉，自成一格。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0211
    name: 赵鼎
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: （1085年—1147年）南宋大臣，字元镇，解州闻喜人。赵鼎两度拜相，主张抗金、反对秦桧议和，为相期间整饬朝政、荐用主战人士；后遭秦桧排挤，先后贬谪潮州、吉阳军，绍兴十七年绝食而卒，著有《忠正德文集》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0222
    name: 王坚
    avatar: pig/武010.png
    default_gender: male
    archetype: military
    flavor: （1198年—1264年）南宋将领，曾任合州知州。王坚镇守钓鱼城，增筑城防、屯田积粮，与部将张珏协力设防；开庆元年蒙古军大举来攻，他率军民坚守数月，蒙哥汗死于城下，蒙古军被迫撤围；后任湖北安抚使、知江陵府，病逝于任所。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  green:
  - key: hist_songliaojinyuan_0210
    name: 史弥远
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: 史弥远（1164—1233），字同叔，庆元府鄞县人，南宋宰相、权臣。淳熙年间进士，开禧北伐失败后参与诛杀韩侂胄，嘉定元年（1208）拜相，主持对金和议；宁宗去世后联合杨皇后废赵竑、拥立理宗，此后长期独揽朝政。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0212
    name: 胡铨
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: 胡铨（1102—1180），字邦衡，号澹庵，吉州庐陵人，南宋政治家、文学家。建炎年间进士，绍兴八年（1138）上疏请斩秦桧、王伦、孙近，声震朝野，因此连遭贬谪，流落岭海近二十年；孝宗即位后复起，官至资政殿学士，以刚直敢言著称，著有《澹庵文集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0213
    name: 王淮
    avatar: pig/文032.png
    default_gender: male
    archetype: civil
    flavor: 王淮（1126—1189），字季海，婺州金华人，南宋绍兴年间进士、宰相。淳熙年间拜相，历任参知政事、右丞相，主持政务多年，重视整军、理财与边防，为相时提拔士人；后因台州唐仲友案与朱熹交恶，朝议纷争，晚年罢相归乡。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0214
    name: 周必大
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: 周必大（1126—1204），字子充，号平园，吉州庐陵人，南宋政治家、文学家。绍兴年间进士，历仕高宗至宁宗，官至左丞相，封益国公；学识博洽，晚年主持校刻《文苑英华》《欧阳文忠公集》，对宋代文献保存有功，卒谥文忠。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0215
    name: 赵汝愚
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: 赵汝愚（1140—1196），字子直，饶州余干人，南宋宗室、宰相。乾道二年（1166）状元，历任吏部尚书、知枢密院事；绍熙五年（1194）与韩侂胄等促成宁宗即位，拜右丞相，后与韩侂胄争权失利，贬谪外放，途中卒于衡州，谥忠定。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0216
    name: 叶适
    avatar: pig/文029.png
    default_gender: male
    archetype: civil
    flavor: 叶适（1150—1223），字正则，号水心，温州永嘉人，南宋思想家、文学家，永嘉学派集大成者。淳熙五年（1178）进士，历官太常博士、权兵部侍郎等；主张经世致用，重视财赋、军政与民生，开禧北伐时曾主持江淮防务，著有《水心文集》《习学记言》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0217
    name: 陈亮
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: 陈亮（1143—1194），字同甫，号龙川，婺州永康人，南宋思想家、文学家，永康学派代表。他屡次上书陈述抗金方略，与朱熹展开王霸义利之辩；绍熙四年中状元，授签书建康府判官，未及赴任而卒，著有《龙川文集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0218
    name: 魏了翁
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: 魏了翁（1178—1237），字华父，号鹤山，邛州蒲江人，南宋学者、政治家，蜀学代表。庆元五年（1199）进士，讲学蜀中并创建鹤山书院，后历任地方与中枢官职，屡次上书论政；学兼经史，著有《鹤山集》《九经要义》等。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0219
    name: 真德秀
    avatar: pig/文032.png
    default_gender: male
    archetype: civil
    flavor: 真德秀（1178—1235），字景元（一作希元），号西山，建州浦城人，南宋理学家、政治家。庆元五年（1199）进士，学承朱熹，历任江东转运使、知泉州等职，有惠政；端平年间入朝参预政事，官至参知政事，所著《大学衍义》以经史阐发修身治国之道，卒谥文忠。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0220
    name: 刘克庄
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: 刘克庄（1187—1269），字潜夫，号后村，兴化军莆田人，南宋诗人、词人，江湖诗派领袖。早年以荫入仕，曾因《落梅》诗被指讪谤而遭废黜多年；后官至工部尚书，晚年以文名重一时，诗词多涉时事民生，著有《后村先生大全集》《后村诗话》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0221
    name: 吴潜
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: 吴潜（1195—1262），字毅夫，号履斋，宣州宁国人，南宋嘉定十年（1217）状元、宰相。理宗朝两度拜相，曾任知绍兴府、浙东安抚使等职；面对蒙古南侵主张整军备战、反对议和，后与贾似道政见不合，被贬循州，卒于贬所。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0223
    name: 曹友闻
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: 曹友闻（？—1236），字允叔，南宋将领。宝庆二年（1226）进士，长期率部戍守川陕边境，熟悉川陕形势；端平三年（1236）蒙古军大举攻蜀，他率部在仙人关、阳平关一带设防，力战不敌，全军覆没，本人战死，谥毅节。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0224
    name: 杨存中
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
    flavor: 杨存中（1102—1166），本名杨沂中，字正甫，代州崞县人，南宋将领。绍兴年间参与平定苗刘兵变，又在藕塘、柘皋等役中抗击金军；长期统领殿前司，官至殿前都指挥使，封恭国公，晚年仍参与江淮防务，卒谥武恭。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0226
    name: 刘宝
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: 刘宝，南宋将领，生卒年不详。绍兴、隆兴年间历任殿前司及镇江军中要职，隆兴元年（1163）北伐时统率镇江军马，曾出任镇江府驻扎御前诸军都统制，负责长江下游防务。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0227
    name: 毕再遇
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: 毕再遇，字德卿，南宋将领，以勇武和善用奇兵著称。其父毕进为岳飞旧部；开禧二年（1206）北伐中屡为先锋，率敢死军攻取泗州，又在六合设伏以寡敌众击退金军，保全江北要地；后历任统制、都统制等军职，嘉定年间致仕，卒谥忠毅。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0228
    name: 赵范
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: 赵范，字武仲，衡山人，南宋将领，赵方之子、赵葵之兄。早年随父抗金，绍定四年（1231）李全据淮东叛宋时，他与赵葵合兵讨平；官至京湖制置使，金亡之际反对仓促联蒙出兵，端平元年（1234）后又参与收拾河南、京湖军务。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0229
    name: 高达
    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: 高达，南宋末年京湖将领，早年隶京湖制置司，景定、咸淳间多次参与京湖战事，后任湖北制置副使，所部久戍江陵，江汉防务多倚之。德祐元年（1275）元将阿里海牙进攻江陵，他开城归降，此后在元朝任职，卒年不详。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0230
    name: 向士璧
    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: 向士璧，字君玉，常州人，南宋将领，绍定五年（1232）进士。官至湖南制置副使兼知潭州，长期任职湖南、四川等地；开庆元年（1259）蒙古军围潭州，他倾家财充军费，率军民坚守数月，迫使敌军撤围，后遭贾似道排挤，被贬而死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0231
    name: 姜才
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: 姜才（？—1276），南宋末年将领，隶属淮东制置使李庭芝，镇守扬州。他骁勇善战，元将阿术围城期间屡次率部出城突袭，并曾追击押送宋室北上的元军；德祐二年（1276）随李庭芝突围至泰州，城陷被俘，拒绝招降而遇害。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0232
    name: 夏贵
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: 夏贵，字用和，南宋末年淮西将领，曾任淮西安抚使、知庐州，长期统兵淮西，守御庐州、寿春一线，屡与蒙古军交锋。德祐元年（1275）元军沿江东下，他在阳逻堡一带迎战失利，南宋江防随之瓦解，遂以淮西归降，入元后受任官职，约卒于至元年间。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0233
    name: 吕文德
    avatar: pig_wu_male9.png
    default_gender: male
    archetype: military
    flavor: 吕文德，南宋将领，早年以战功起家，长期统兵京湖、四川，屡次抵御蒙古军，官至京湖制置使。开庆元年（1259）鄂州之战中率部守御有功；他依附权相贾似道，晚年主持襄阳防务，因允许蒙古在樊城外设榷场而受后世批评，咸淳五年（1269）卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0234
    name: 吕文焕
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: 吕文焕，吕文德之弟，南宋襄阳守将。咸淳三年（1267）起元将阿术、刘整长期围困襄阳，他与樊城互为犄角，坚守六年，屡次向朝廷求援而援军不至；咸淳九年（1273）樊城失守后，他以襄阳降元，此后随元军东下招降沿江州郡。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0235
    name: 史嵩之
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: 史嵩之（1189—1257），字子申（一作子由），庆元府鄞县人，史弥远之侄，南宋宰相。嘉定十三年（1220）进士，任京湖制置使时遣孟珙与蒙古合兵灭金，端平元年（1234）金亡；后拜右丞相，主张对蒙议和，因夺情起复遭朝野反对，晚年闲居多年。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0236
    name: 陈文龙
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: 陈文龙（1232—1277），字君贲，兴化军莆田人，南宋咸淳四年（1268）状元，初名子龙，度宗赐名文龙。官至参知政事，临安陷落后在兴化军组织抗元，元将唆都遣使劝降遭拒；城破被俘，押解途中绝食而死，谥忠肃。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0237
    name: 谢枋得
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: 谢枋得（1226—1289），字君直，号叠山，信州弋阳人，南宋遗民、文学家。宝祐四年（1256）进士，与文天祥同榜；宋末曾率兵抗元，宋亡后隐居卖卜，屡拒元朝征召，后被强押至大都，绝食而死。所编《文章轨范》流行于后世，门人私谥文节。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0238
    name: 邓剡
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: 邓剡（1232—约1303），字光荐，号中斋，吉州庐陵人，南宋遗民、词人，与文天祥同乡交厚。景定三年（1262）进士，官至礼部侍郎；崖山兵败后投海被俘，曾与文天祥一同被押北上，后获释。宋亡不仕，著有《中斋集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0239
    name: 王应麟
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: 王应麟（1223—1296），字伯厚，号深宁居士，庆元府鄞县人，南宋学者。淳祐元年（1241）进士，历任馆阁及礼部官职，博通经史制度；宝祐四年（1256）任覆考官时识拔文天祥，后编成大型类书《玉海》，另有《困学纪闻》。宋亡后闭门著述，相传《三字经》亦出其手。
    growth_range:
