    default_gender: male
    archetype: civil
    flavor: 黄震（1213—1280），字东发，庆元府慈溪人，南宋学者、官员。宝祐四年（1256）进士，曾任史馆检阅，因言事忤旨出为地方官；所著《黄氏日抄》考辨经史，并直陈民穷、兵弱、财匮之弊。宋亡后隐居不仕，门人私谥文洁先生。
