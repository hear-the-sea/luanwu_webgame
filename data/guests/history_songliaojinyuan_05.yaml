    default_gender: male
    archetype: civil
    flavor: 文及翁，字时学，号本心，绵州人，寓居吴兴，南宋官员、词人。宝祐元年（1253）进士，历任馆阁与中枢官职，官至签书枢密院事；宋亡后拒绝仕元，闭门校书。其《贺新郎·游西湖》借湖山景物寄寓故国之思，为宋末遗民词所重。
