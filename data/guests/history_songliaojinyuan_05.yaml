    flavor: 洪迈（1123—1202），字景卢，号容斋，饶州鄱阳人，洪皓之子。绍兴年间中博学宏词科，绍兴三十二年（1162）出使金国，因国书礼仪之争受阻而还，后官至端明殿学士；学识博洽，所著《容斋随笔》考论经史诗文，《夷坚志》则广录宋代传闻志怪。
