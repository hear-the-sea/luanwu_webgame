    default_gender: male
    archetype: civil
    flavor: 史达祖，字邦卿，号梅溪，汴人，南宋词人，生卒年不详。曾为韩侂胄幕僚，韩败后被牵连失官，晚年困顿以终；词以咏物见长，描摹工细、用语精丽，《双双燕·咏燕》尤为名篇，除咏物外亦多节序、酬赠之作，有《梅溪词》传世。
