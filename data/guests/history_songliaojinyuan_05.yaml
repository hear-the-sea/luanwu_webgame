    archetype: civil
    flavor: 张炎（1248—约1320），字叔夏，号玉田，临安人，宋末元初词人、词论家。出身世家，为南渡名将张俊后裔；宋亡后流落江湖，元初曾北上大都，后南归。所著《词源》论词律、作法与审美，标举清空骚雅，另有词集《山中白云词》。
