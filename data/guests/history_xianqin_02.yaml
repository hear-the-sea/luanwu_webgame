    default_gender: male
    archetype: civil
    flavor: （生卒年不详）《榖梁传》作者，春秋学大师。他与公羊高同传《春秋》，但解经风格不同。《榖梁传》偏重礼义，文辞简约，与《公羊传》《左传》并称春秋三传。榖梁学派虽不如公羊学盛行，但也是经学的重要组成部分。作为《榖梁传》作者，春秋学大师，榖梁赤的表达重心并不局限于个人情绪，往往还能映照先秦时期的公共议题。
