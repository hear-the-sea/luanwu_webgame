heroes:
  blue:
  - key: hist_xianqin_0045
    name: 许行
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （约前390年—约前315年）战国农家代表人物，楚国人。许行主张贤者应与民并耕而食、饔飧而治，反对不劳而食；相传他率弟子数十人自楚至滕，衣褐捆屦、织席为生，劝滕文公实行农家主张。孟子在滕与其门徒辩论，批评其说扰乱分工、难以治国。农家思想虽未获采用，却留下关于社会分工的较早讨论。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0046
    name: 杨朱
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （约前440年—约前360年）战国思想家，魏国人，一说秦人。杨朱主张贵己重生、全性保真，反对以物累形，孟子将其概括为“拔一毛而利天下，不为也”。其学与墨家并称显学，孟子感叹“杨朱、墨翟之言盈天下”。杨朱没有著作传世，言论散见于《孟子》《庄子》《列子》《淮南子》等书，后世对其评价分歧较大。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 20
      agility: 14
  - key: hist_xianqin_0047
    name: 邓析
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （前545年—前501年）春秋郑国大夫，名家先驱，善辩说与诉讼。邓析私造竹刑，写在竹简上公之于众，又教人辩讼；据《吕氏春秋》记载，他与人约定大狱收衣、小狱收襦裤作为报酬。郑国执政驷歂后来将他处死，却仍沿用其竹刑。其学说重名实之辨，被视为名家的早期代表。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0048
    name: 尹文
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （约前360年—约前280年）战国齐国稷下学者，与宋钘并称，同倡“见侮不辱”“禁攻寝兵”。尹文主张以名分辨正是非、以宽柔待人，反对以强凌弱。他与宋钘同在稷下讲学，其说兼采名、道、法诸家；现存《尹文子》为后人辑录整理，未必尽出其手，但仍可考见其学派主张。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 20
      agility: 14
  - key: hist_xianqin_0049
    name: 宋钘
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （约前370年—约前291年）战国思想家，宋国人，又称宋荣子、宋牼。宋钘主张情欲寡浅、见侮不辱，反对争斗，曾周行天下游说诸侯罢兵；《孟子》记他欲往楚、秦劝两国息战。《庄子·天下》称其对外禁攻寝兵、对内节制情欲。其说与尹文相近，二人常被并称，在当时颇有影响。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 20
      agility: 14
  - key: hist_xianqin_0050
    name: 甘德
    avatar: monkey/其他随机角色/文_男123.png
    default_gender: male
    archetype: civil
    flavor: （约前400年—约前340年）战国天文学家，齐国人，一说楚人，与魏人石申并称“甘石”。甘德长期观测木星、土星等五大行星及恒星位置，撰有《天文星占》八卷；后世将其与石申的观测、星占内容合辑，形成《甘石星经》。二人测定的恒星位置是现存较早的系统性天文记录，对后世历法与星占均有影响。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 6
      intellect: 62
      defense: 18
      agility: 14
  - key: hist_xianqin_0051
    name: 石申
    avatar: monkey/其他随机角色/文_男123.png
    default_gender: male
    archetype: civil
    flavor: （约前400年—约前340年）战国天文学家，魏国人，与齐人甘德合称“甘石”。石申撰《天文》八卷，系统观测五大行星与恒星的运行和位置，记录了众多恒星的位置；后世将其观测与星占内容辑为《石氏星经》。其工作与甘德齐名，为古代恒星分区与历法推算留下了较早的数据。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 6
      intellect: 62
      defense: 18
      agility: 14
  - key: hist_xianqin_0052
    name: 智瑶
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （?—前453年）春秋末晋国智氏家主，名瑶，又称智伯。智瑶执掌晋国国政后向韩、魏、赵索取土地，赵襄子拒绝，他便联合韩、魏围攻晋阳。围城日久，赵襄子说服韩、魏倒戈，决晋水灌智军，智瑶兵败被杀，智氏随之覆亡。其恃强而骄、轻忽同盟，是晋阳之战由胜转败的重要原因。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 18
      defense: 24
      agility: 18
  - key: hist_xianqin_0053
    name: 田骈
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （约前370年—约前290年）战国齐国稷下学者，又称陈骈，主张“贵齐”，即齐同万物、因循自然。田骈与慎到、宋钘等人同在稷下讲学，兼论名、道、法诸家，因善辩而有“天口骈”之称；相传他以道术游说齐王。《田子》二十五篇见于《汉书·艺文志》，后已散佚，今只能从诸子引述中考见其思想。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 20
      agility: 14
  - key: hist_xianqin_0054
    name: 公羊高
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）战国初期齐国学者，旧题《春秋公羊传》的传授者。相传公羊高受《春秋》于子夏，以口授方式讲解经义，其学在子孙与弟子间世代相传。至西汉景帝时，公羊寿与胡毋生等人才将口传内容著于竹帛，形成今本《公羊传》。该书以问答体阐发《春秋》义例，是研究春秋学的重要典籍。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 20
      agility: 14
  - key: hist_xianqin_0068
    name: 夫差
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: （约前528年—前473年）春秋末吴国君主，阖闾之子。夫差继位后于夫椒之战大败越国，迫使勾践入吴臣服；随后他北上争霸，在黄池会盟中与晋国争长。夫差听信伯嚭、疏远伍子胥，连年用兵消耗国力，勾践乘虚袭吴。前473年吴国灭亡，夫差退守姑苏后自杀。其由盛转衰，常被后世视为骄矜失察之戒。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 14
      defense: 26
      agility: 18
  - key: hist_xianqin_0069
    name: 阖闾
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （?—前496年）春秋吴国君主，名光，一作阖庐。阖闾借专诸以鱼肠剑刺杀吴王僚后即位，任用伍子胥、孙武整顿军备，前506年柏举之战大破楚军，攻入楚都郢。晚年他兴兵伐越，在槜李之战中被越军所伤，回师途中去世。阖闾一朝是吴国国力上升的重要阶段，其用人纳谏也常为后人所称。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 14
      defense: 24
      agility: 18
  - key: hist_xianqin_0070
    name: 荆轲
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: （?—前227年）战国末卫国游侠，好读书击剑，人称荆卿。荆轲受燕太子丹礼遇，携樊於期首级与督亢地图入秦，地图中暗藏匕首，欲劫持秦王政。易水送别时，高渐离击筑，留下“风萧萧兮易水寒”之句。图穷匕见后行刺未成，他被秦王侍卫所杀。其行事勇决而谋略不足，后世对其评价褒贬不一。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 14
      defense: 22
      agility: 20
  - key: hist_xianqin_0071
    name: 妇好
    avatar: monkey/其他随机角色/武083_女_.png
    default_gender: female
    archetype: military
    flavor: （?—约前1200年）商王武丁的王后，庙号“辛”，甲骨文中多次出现她的名字。妇好曾率军征伐土方、羌方、巴方等方国，相传与武丁配合伏击巴方，是现存较早的伏击战记载；她还主持祭祀与占卜，参与商王室事务。1976年殷墟妇好墓被发现，出土大量青铜器、玉器，为研究商代社会提供了重要实物。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 16
      defense: 24
      agility: 18
  - key: hist_xianqin_0072
    name: 蹇叔
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （约前690年—约前610年）春秋秦国大夫，经百里奚举荐为秦穆公所用，与百里奚共同辅政。前627年秦穆公出兵袭郑，蹇叔认为劳师袭远必败，哭送随军之子，预言“吾见师之出而不见其入也”。秦军在崤山果然被晋军截击，全军覆没。蹇叔以老成谋国著称，其哭师之谏成为后世论兵忌远袭的典故。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 22
      agility: 12
  - key: hist_xianqin_0073
    name: 由余
    avatar: pig/文010.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋戎族谋士，祖先为晋人，后流落西戎。由余奉命出使秦国，秦穆公发现其贤能，采纳内史廖之策，以女乐离间戎王并挽留由余。由余归降秦国后，向穆公陈述戎地形势与攻取之策；秦穆公用其谋征伐西戎，益国十二、开地千里，遂霸西戎。其经历也反映了春秋时期华戎之间的人才流动。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_xianqin_0074
    name: 赵鞅
    avatar: monkey/其他随机角色/武044_男_.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前476年）春秋末晋国卿，名鞅，又称赵简子，赵武之孙。前513年，他将范宣子刑书铸于铁鼎公布，是较早公开成文法的事例之一，晚于郑子产铸刑书；范氏、中行氏作乱时，他退守家臣董安于营建的晋阳，并在铁之战中击败对手。赵鞅改革田赋、整顿军制，扩大赵氏封邑与兵力，为后来三家分晋奠定基础。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 18
      defense: 26
      agility: 16
  - key: hist_xianqin_0075
    name: 赵无恤
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （?—前425年）春秋末晋国赵氏家主，名无恤，赵鞅之子，史称赵襄子。晋阳之战中，他坚守孤城，说服韩、魏倒戈，合攻灭智氏，奠定三家分晋的格局。此后他诱杀代王、吞并代地，向北扩展赵氏疆土。赵襄子能忍善谋、用人不疑，但其继嗣安排也留下争议，死后赵氏由宗族后人继立。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 18
      defense: 24
      agility: 18
  - key: hist_xianqin_0076
    name: 魏斯
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （前472年—前396年）战国魏国君主，即魏文侯。魏斯任用李悝主持变法、吴起训练“魏武卒”、西门豹治理邺地，又任翟璜、乐羊等各当其才；前403年魏与韩、赵被周天子列为诸侯。他礼遇子夏、田子方、段干木等学者，开战国养士之风。魏国由此在诸侯中率先强盛，成为战国初期的头号强国。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 22
      defense: 24
      agility: 18
  - key: hist_xianqin_0077
    name: 魏击
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: （?—前370年）战国魏国君主，即魏武侯，魏文侯之子。魏击继位后继续对外用兵，曾攻秦、伐齐，任用吴起镇守西河。其后他猜忌吴起，吴起离魏奔楚，魏国西线由此渐失优势；武侯一朝的连年征战也消耗了魏国国力。魏国虽仍称强，但霸业已不如文侯时期稳固。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 16
      defense: 26
      agility: 18
  - key: hist_xianqin_0078
    name: 李悝
    avatar: pig/文048.png
    default_gender: male
    archetype: civil
    flavor: （前455年—前395年）战国魏国大臣，法家代表人物，一说即李克。魏文侯任其为相，李悝推行“尽地力之教”，鼓励精耕细作，又行“平籴法”，以官仓购销平抑粮价；他编定《法经》六篇，并主张食有劳而禄有功，冲击世卿世禄。其变法使魏国富强，商鞅后来入秦，相传也曾参考《法经》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 58
      defense: 18
      agility: 14
  - key: hist_xianqin_0079
    name: 西门豹
    avatar: pig/文031.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）战国魏国官员，魏文侯时任邺令。邺地旧俗为“河伯娶妇”，百姓苦于赋敛，西门豹到任后借仪式将巫妪、三老投入漳水，破除这一陋俗；随后他征发民力开凿十二渠，引漳水灌溉农田，使邺地生产恢复。其治邺兼顾除弊与兴利，后世将西门豹视为循吏与破除迷信的典型。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 52
      defense: 20
      agility: 14
  - key: hist_xianqin_0080
    name: 乐羊
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）战国魏国将领。魏文侯命乐羊率军攻中山，战事持续三年；中山君将其子杀害并送来肉羹，乐羊仍坚持进军，最终灭中山。魏文侯虽封他于灵寿，却对其狠忍心存疑虑。相传后来伐齐的燕将乐毅即出自其家族。乐羊之事常被用来讨论为将者如何取舍私情与军令。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 14
      defense: 26
      agility: 18
  - key: hist_xianqin_0081
    name: 季梁
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋随国大夫，以贤能著称。楚武王侵随时，季梁劝随侯先修民事、再事鬼神，提出“夫民，神之主也”，主张以民为本、谨慎应战；随侯采纳后整饬内政，楚国一时不敢进犯。季梁死后，随国失去重要辅佐，仍屡受楚国进逼。其重民轻神之论，是先秦民本思想较早的表述。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0082
    name: 羊舌肸
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （?—前514年）春秋晋国大夫，字叔向，博学多识。他与郑国子产、齐国晏婴同时，常议论诸侯政局；前536年郑国铸刑书，叔向致信子产，认为公布成文法会使民知争端、轻视上命。《国语》还记有“叔向贺贫”一事，他以德行与政绩劝诫韩宣子。叔向后任晋国太傅，以直言和熟悉典章著称。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0083
    name: 赵武
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （约前591年—前541年）春秋晋国卿，名武，赵朔之子，谥文，史称赵文子。下宫之难后，赵氏一度覆灭，赵武在程婴等人保护下幸存，成年后复立赵氏宗族。前546年晋楚弭兵之会，他代表晋国参与盟誓；后官至晋国正卿，主持赵氏祭祀与国政。赵武为人温和有礼。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 52
      defense: 20
      agility: 14
  - key: hist_xianqin_0084
    name: 程婴
    avatar: monkey/其他随机角色/文037_男.png
