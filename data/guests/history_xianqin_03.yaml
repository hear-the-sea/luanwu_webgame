    flavor: （?—前636年）割股奉君，隐居不仕。他是晋国公子重耳的忠实追随者，在重耳流亡途中，途经卫国时粮尽，众人饥饿难耐。他悄然离去，竟割下自己大腿的肉烹羹献上，救了重耳一命。十九年颠沛流离，他始终不离不弃。待重耳复国成为晋文公后，遍封功臣，唯介之推不言禄、不表功，带着母亲悄然隐居于绵山。文公寻他不得，听信小人之言，放火烧山逼其出仕。大火三日，介之推抱木而死，誓不下山。文公悔恨交加，下令每年此日禁火寒食，以示哀悼。寒食节因此而来，延续千年。介之推的高风亮节——忠而不求报、功成而身退——成为士人品格的最高境界。
