  - key: hist_xianqin_0136
    name: 箕子
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）殷商贤臣，《洪范》作者。他是商纣王的叔父，位高权重却无法阻止纣王的暴政。多次进谏无果后，他选择披发佯狂、装疯卖傻，沦为奴隶以求保全性命。周武王灭商后，专程拜访箕子于箕山，虚心请教治国之道。箕子授以《洪范九畴》，阐述天地人伦的治理法则，成为后世帝王治国的重要典籍。他是殷商三仁之一，后被封于朝鲜之地，据传开创了箕子朝鲜。他以智慧与隐忍保全自身，更将殷商文化传播至东方，功在千秋。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 8
      intellect: 58
      defense: 22
      agility: 12
  - key: hist_xianqin_0137
    name: 傅说
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）殷商名相，版筑贤臣。他出身卑微，本是傅岩之地筑墙夯土的工人，每日挥汗如雨、劳作不息。商王武丁求贤若渴，一日梦见圣人，醒后命画工绘出梦中形象，遣人四处寻访。终在傅岩找到与梦中圣人一模一样的傅说，立即起用为相。傅说不负重托，辅佐武丁励精图治，开疆拓土，使殷商国力达到鼎盛，史称"武丁中兴"。他提出"非知之艰，行之惟艰"的名言，强调实践重于空谈。从版筑工人到一代名相，傅说的逆袭是"野无遗贤"的最佳注脚，也是贤才遇明主的千古佳话。
