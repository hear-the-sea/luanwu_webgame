    name: 比干
    default_gender: male
    archetype: civil
    flavor: （?—约前1046年）殷商忠臣，剖心谏君。纣王无道，他以死相谏；纣王令其剖心验证圣人七窍，他毅然剖腹取心。这等忠贞，惊天地泣鬼神。后世尊其为文财神，认为他公正无私，因无心而无偏。比干的死，是殷商亡国的先兆；他的忠诚，却成为千古士人的楷模。
