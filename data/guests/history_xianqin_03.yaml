heroes:
  blue:
  - key: hist_xianqin_0095
    name: 闵损
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （前536年—前487年）孔子弟子，字子骞，鲁国人，列孔门德行科，以孝著称。继母以芦花为他絮衣，父亲察觉后欲休妻，闵损劝道“母在一子寒，母去三子单”，继母因此悔悟。季氏请他出任费宰，他辞而不就。孔子称赞他孝行纯笃，人们对其父母兄弟也无异议。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0096
    name: 冉雍
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （前522年—?）孔子弟子，字仲弓，鲁国人，列孔门德行科。其父出身低微，孔子以“犁牛之子骍且角”为喻，认为贤才不应因家世被弃，又称“雍也可使南面”。仲弓曾任季氏宰，问政于孔子，得“先有司、赦小过、举贤才”之教，以宽厚持重见称。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0097
    name: 冉耕
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （约前544年—约前480年）孔子弟子，字伯牛，鲁国人，列孔门德行科。冉耕患恶疾，孔子前去探望，自窗外执其手叹道“亡之，命矣夫！斯人也而有斯疾也”，惋惜之情溢于言表。他病中仍守礼，后世将其与颜渊、闵损、冉雍并列，视为孔门德行的代表。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 20
      agility: 14
  - key: hist_xianqin_0098
    name: 原宪
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （约前515年—?）孔子弟子，字子思。原宪曾任孔子家宰，孔子赠以粟九百，他推辞不受。孔子去世后，他退居卫国陋巷，安贫乐道。子贡乘驷马高车来访，见他衣冠敝旧而以为耻，原宪答道“无财谓之贫，学道而不能行谓之病”，自谓贫而非病，子贡听后惭愧而去。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 20
      agility: 14
  - key: hist_xianqin_0099
    name: 漆雕开
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （前540年—?）孔子弟子，漆雕氏，名开，字子开。孔子劝他出仕，他答道“吾斯之未能信”，即尚未确信自己的修养，孔子听后欣然。漆雕开以谨慎自守著称，《韩非子·显学》将“漆雕氏之儒”列为孔门后学八儒之一，可见其学派在战国仍有传承。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 20
      agility: 14
  - key: hist_xianqin_0100
    name: 公西赤
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: （前509年—?）孔子弟子，字子华，鲁国人。公西赤熟悉礼仪和辞令，孔子认为他可以“束带立于朝，可使与宾客言”。他曾自述志向，愿在宗庙祭祀、诸侯会盟时身着礼服，担任主持礼仪的小相。孔子因此说“赤也为之小，孰能为之大”，肯定其礼乐才能。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0101
    name: 樊须
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （前515年—?）孔子弟子，字子迟，春秋末年鲁国人（一说齐人）。樊须曾三次向孔子问仁，分别得到“爱人”“居处恭、执事敬、与人忠”“先难而后获”的回答。他又请教种田、种菜，孔子自谦不如老农老圃，并批评他舍本逐末。樊须仍以勤学好问见称。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_xianqin_0102
    name: 澹台灭明
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （前512年—?）孔子弟子，字子羽，鲁国武城人。澹台灭明相貌不佳，孔子起初以为他材质浅薄，后来感叹“以貌取人，失之子羽”。他南游吴、楚，收徒讲学，门下弟子相传有三百人，名声响于诸侯。子游任武城宰时，曾称赞他“行不由径”，即不走邪路。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0103
    name: 庆忌
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: （?—前515年）吴王僚之子，勇力过人。阖闾刺杀吴王僚夺取王位后，庆忌出奔卫国，结交诸侯，欲为父报仇。阖闾派要离前往行刺，要离取得信任后刺伤庆忌。庆忌中剑后认为要离是勇士，放他回国，自己随即身亡。其事见于《吴越春秋》等书记载。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 48
      intellect: 10
      defense: 24
      agility: 18
  - key: hist_xianqin_0104
    name: 韩起
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （?—前514年）春秋晋国卿，名起，谥宣，韩氏宗主。韩起曾出使鲁国，在太史氏处看到《易象》与《鲁春秋》，感叹“周礼尽在鲁矣”。他后来继任晋国正卿，执掌国政二十余年，晚年将韩氏宗主权柄交给韩须。韩氏由此成为晋国重要的世卿家族。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 52
      defense: 20
      agility: 14
  - key: hist_xianqin_0105
    name: 魏舒
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: （?—前509年）春秋晋国卿，名舒，谥献。魏舒在大原与狄人作战时，鉴于地形险隘，毁弃战车、改列步兵方阵，大败狄军，成为春秋车战向步战转变的著名战例。他后来任晋国正卿，主持分割祁氏、羊舌氏的田邑，设置十县并任用贤能，孔子称其“近不失亲，远不失举”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 14
      defense: 26
      agility: 18
  - key: hist_xianqin_0106
    name: 钟子期
    avatar: monkey/其他随机角色/文039_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋楚国人，相传以打柴为生。钟子期听伯牙鼓琴，能准确听出琴声所寄的高山与流水之意，伯牙引为知音。子期死后，伯牙认为世间再无人能懂自己的琴声，于是破琴绝弦，终身不再弹奏。“高山流水”与“知音”的典故即由此而来，后世以之比喻知己难遇。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 18
      agility: 16
  - key: hist_xianqin_0107
    name: 伯牙
    avatar: monkey/其他随机角色/文039_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋琴师，相传为楚人。伯牙曾向成连学琴，三年未成，成连带他至东海蓬莱山，听海水激荡、林鸟悲鸣，琴艺由此大进。后来他鼓琴时，樵夫钟子期能听出高山流水之意，二人结为知音。子期死后，伯牙破琴绝弦，终身不再鼓琴。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 18
      agility: 16
  - key: hist_xianqin_0108
    name: 史鱼
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （?—前502年）春秋卫国大夫，名鰌，字子鱼。史鱼多次劝卫灵公任用蘧伯玉、罢黜弥子瑕，始终未能如愿。临终前他嘱咐儿子不要将灵柩停于正堂，以尸谏方式促使国君醒悟。卫灵公往吊时问明缘由，终于进用蘧伯玉、疏远弥子瑕。孔子称赞他“邦有道，如矢；邦无道，如矢”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 22
      agility: 12
  - key: hist_xianqin_0109
    name: 蘧瑗
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （约前585年—约前484年）春秋卫国大夫，名瑗，字伯玉，谥成子。蘧瑗历仕卫国，以贤德著称，孔子称他“君子哉蘧伯玉！邦有道则仕，邦无道则可卷而怀之”。他五十岁时回首往事，感叹前四十九年皆有过失，留下“行年五十而知四十九年非”的自省之语，卫人亦以君子相称。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 22
      agility: 12
  - key: hist_xianqin_0113
    name: 辛甲
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）商末周初史官。辛甲原为商纣大夫，相传曾进谏七十五次而纣王不听，于是离开商朝投奔周文王。周文王任用他为太史，命百官各陈规谏以匡正王政。今存《虞人之箴》即出自辛甲所纂之书，是先秦谏诤传统的重要文献。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0114
    name: 散宜生
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）商末周初大臣，为文王所倚重。周文王被纣王囚于羑里时，散宜生与闳夭、太颠等人寻求美女、奇物与良马献给纣王，使文王得以获释。周武王伐纣时，他随军参与灭商，后来列为周室功臣。后世将他与闳夭、太颠、南宫适并称为文王四友。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_xianqin_0115
    name: 闳夭
    avatar: pig/文010.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）商末周初大臣，与散宜生、太颠同为周文王谋士。文王被囚羑里时，闳夭参与搜集美女、奇物与良马献给纣王，使文王获释。武王灭商后，命闳夭为比干之墓培土表彰，以安抚商地人心。后世将他与散宜生、太颠、南宫适并称为文王四友。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_xianqin_0116
    name: 南宫适
    avatar: pig/武049.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）西周初年大臣，名适，一作括。南宫适为文王所重用，《尚书·君奭》将其列为文王重臣。武王伐纣时他参与牧野之战；商朝灭亡后，他奉命散发鹿台所藏的财货、发放钜桥的粮粟，以赈济贫弱百姓。后世将他与闳夭、散宜生、太颠并称为文王四友。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 16
      defense: 26
      agility: 18
  - key: hist_xianqin_0117
    name: 华元
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: （?—前573年）春秋宋国执政，宋戴公之后。前607年宋郑大棘之战前，华元杀羊犒军却漏掉车夫羊斟，羊斟怀恨驾车直入郑军，华元被俘，宋军因此大败。他后来逃回宋国，并于前579年促成晋、楚两国在宋国举行弭兵之会，使中原诸侯获得短暂和平。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 18
      defense: 26
      agility: 18
  - key: hist_xianqin_0118
    name: 向戌
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋宋国大夫，名戌，官至左师。向戌在宋国执政时倡议弭兵，于前546年邀请晋、楚及鲁、卫、郑等诸侯会于宋，约定各国停止征战、共尊晋楚为霸主。这次会盟使中原各国得以休战十余年，向戌也因斡旋有功而名重诸侯。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_xianqin_0119
    name: 子罕
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋宋国执政，名乐喜，字子罕，官司城。有人献玉给他，子罕以“不贪为宝”为由拒绝，并说若收下玉，两人都失去了自己的宝物。献玉者担心怀璧招祸，子罕便将他安置在自家，请玉工琢玉售出，使其富足后再送他回乡。宋人因此称子罕清廉。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 22
      agility: 12
  - key: hist_xianqin_0120
    name: 华父督
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （?—前682年）春秋宋国大夫，名督，字华父。华父督贪恋孔父嘉之妻，因而杀死孔父嘉；随后又弑宋殇公，从郑国迎立公子冯为宋庄公，长期把持宋国朝政。前682年，南宫万作乱弑宋闵公，华父督也在乱中被杀。其家族华氏此后仍是宋国显族。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 16
      defense: 26
      agility: 18
  - key: hist_xianqin_0121
    name: 孔父嘉
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: （?—前710年）春秋宋国大司马，名嘉，字孔父，孔子六世祖。宋穆公临终时，将宋殇公托付给孔父嘉辅佐。华父督为夺其妻而杀孔父嘉，宋国朝局随之动荡。其子孙后来避难迁往鲁国，以孔为氏。孔氏在鲁国延续数代，至叔梁纥生孔子，孔子即出自这一支。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 16
      defense: 26
      agility: 18
  - key: hist_xianqin_0122
    name: 子目夷
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （?—前611年）春秋宋国公子，宋桓公之子，宋襄公之兄，字子鱼，曾任宋国左师。前638年泓水之战，子目夷劝宋襄公趁楚军渡河未毕、阵列未成时出击，襄公拘守礼法而不听，宋军因此大败，襄公受伤。后世多以子目夷之谋为善用战机之例。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_xianqin_0123
    name: 骊姬
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （?—前651年）春秋晋献公宠妃，骊戎之女，生子奚齐。骊姬为使奚齐继位，谗害太子申生，申生被迫自杀，公子重耳、夷吾相继出奔，史称“骊姬之乱”。晋献公死后，奚齐、卓子先后被大夫里克等人杀死，骊姬也在动乱中身亡。这场内乱使晋国政局长期动荡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 56
      defense: 18
      agility: 18
  - key: hist_xianqin_0124
    name: 孟明视
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）春秋秦国将领，百里奚之子，名视，字孟明。前627年崤之战，孟明视与西乞术、白乙丙率秦军东进，被晋军伏击，全军覆没，三人被俘，后获释归秦。秦穆公仍任用他领兵，前625年彭衙之战再败，前624年王官之战渡河焚舟，取王官及郊，以报崤之役（一说大败晋军），秦穆公遂得西戎称霸。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 14
      defense: 26
      agility: 18
  - key: hist_xianqin_0125
    name: 白乙丙
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）春秋秦国将领，蹇叔之子，名丙，字白乙，又称白乙丙。前627年崤之战，白乙丙与孟明视、西乞术同率秦军东征，遭晋军伏击，兵败被俘，后得释返秦。秦穆公不因败绩加罪，仍令其领兵；前624年秦军伐晋，取王官及郊，以报崤之役（一说大败晋军）。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 14
      defense: 28
      agility: 18
  - key: hist_xianqin_0126
    name: 西乞术
    avatar: monkey_wu_male1.png
