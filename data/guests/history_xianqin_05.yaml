    name: 姬戎人
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （？—前272年，一说前271年）姬戎人即燕惠王，燕昭王之子，在位约七年。他做太子时与乐毅有隙，即位后中齐人反间，以骑劫代替乐毅，乐毅出奔赵国；田单随即以火牛阵反攻，燕军败于即墨，此前攻取的齐地大多失守。乐毅后作《报燕惠王书》表明心迹，燕惠王仍召其子乐间为昌国君。其事迹见于《史记·乐毅列传》等。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 18
      defense: 26
      agility: 22
  - key: hist_xianqin_0215
    name: 魏遬
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （？—前277年）魏遬即魏昭王，魏襄王之子，在位约十九年。即位初年魏国与秦连年交战，前293年秦将白起在伊阙大破韩魏联军，魏将公孙喜被俘；此后魏昭王献出河东四百里求和，又纳安邑于秦，仍挡不住秦军兵临大梁。传世文献对其内政记载不多，其在位时魏国正由盛转衰。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 20
      defense: 26
      agility: 20
  - key: hist_xianqin_0216
    name: 韩然
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （？—前239年）韩然即韩桓惠王，韩釐王之子，在位三十余年。其时秦国东进，韩国屡失城邑；他曾派水工郑国入秦主持修渠，意图以浩大工程拖耗秦国，结果郑国渠反而使关中富饶。前262年秦取野王，上党与本土隔绝，韩桓惠王欲将上党献秦，太守冯亭却转献赵国，最终引发长平之战。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 32
      intellect: 20
      defense: 26
      agility: 22
  - key: hist_xianqin_0217
    name: 冯亭
    avatar: pig/武049.png
    default_gender: male
    archetype: military
    flavor: （？—前260年）冯亭，战国后期韩国上党太守。前262年秦取野王，上党与韩国本土隔绝，他不愿降秦，转而将上党十七城献与赵国；赵孝成王接受平原君建议受地，派廉颇驻守长平，秦赵冲突由此激化。长平之战中冯亭随赵军出战，兵败而死。其献地之举，也成为长平之祸的导火线。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 14
      defense: 26
      agility: 18
  - key: hist_xianqin_0219
    name: 郑安平
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
