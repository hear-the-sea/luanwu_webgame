    name: 士蒍
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）晋献公时的老臣，以能看局势著称。骊姬得宠、公子相疑时，他已察觉祸乱将起，多次进言却难以扭转。关于虞虢之谋，关于公室将乱，史书都爱把士蒍放在“早知如此”的位置上。这样的人在春秋政坛并不少见：眼光很远，话也说得明白，可君主未必要听。士蒍的价值，不在力挽狂澜，而在他让后人看见晋国祸根其实早早就埋下了。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0246
    name: 叔詹
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）郑国大夫，最出名的本事是识人。晋公子重耳流亡过郑，郑文公对他颇为轻慢，叔詹却看出这位落魄公子身边尽是可用之人，断言日后必成大器，并劝国君要么厚待、要么除掉，切莫放着结怨。郑文公没有听，后来重耳果然返晋称霸，郑国也只能为当年的怠慢付账。叔詹的判断不复杂，却准得惊人。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0247
    name: 壶叔
    default_gender: male
    archetype: military
    flavor: （生卒年不详）晋公子重耳流亡时的随从之一。与狐偃、赵衰这些大名臣相比，壶叔在史书里笔墨很少，更多时候只是从亡群像中的一个名字。可十九年奔走列国，能一路跟到最后的人，没有谁是真正轻松的。壶叔这样的小人物，正好补足了“霸主归国”故事里常被忽略的一面：重耳身后，始终有一群并不显赫却一直没散的人。
    growth_range:
