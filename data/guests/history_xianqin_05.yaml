heroes:
  purple:
  - key: hist_xianqin_0222
    name: 干将
    avatar: monkey/先秦与神话/干将.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）相传为春秋时楚国的铸剑师，与妻莫邪齐名。据《搜神记》等书记载，楚王命他铸剑，三年铸成雌雄二剑；干将藏起雄剑，只献雌剑，被楚王所杀。其子赤（一作赤比）长大后依母亲指点取出雄剑，在山中遇客，托其复仇，客斩楚王头，三人之头同葬，后世称为"三王墓"。《吴越春秋》则记他为吴王阖闾铸剑，情节不同。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 40
      intellect: 16
      defense: 26
      agility: 18
  - key: hist_xianqin_0223
    name: 莫邪
    avatar: monkey/先秦与神话/莫邪.png
    default_gender: female
    archetype: civil
    flavor: （生卒年不详）投身炉中，成就神剑。她是铸剑师干将的妻子，美丽贤淑、深明大义。当丈夫为吴王铸剑屡铸不成时，她毅然投身熔炉，以血肉之躯祭炼神兵。传说她投炉之时，火焰由红转青，铁汁如泉涌出，神剑终于铸成。干将为纪念爱妻，将雌剑命名为"莫邪"。她的牺牲不仅成就了绝世神兵，更成为中国古代工匠精神与夫妻深情的象征。后世将"干将莫邪"并称，既指这对神剑，也颂扬这段可歌可泣的爱情。莫邪之名，因铸剑传奇而永垂不朽。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 10
      intellect: 54
      defense: 18
      agility: 18
  - key: hist_xianqin_0224
    name: 欧冶子
    avatar: monkey_wu_male7.png
    default_gender: male
    archetype: military
    flavor: （约前550年—?）春秋越国铸剑师。相传他为越王勾践铸造湛卢、纯钧、胜邪、鱼肠、巨阙五剑，又与干将合铸龙渊、泰阿、工布，名重一时。相传他善于辨矿、炼铁和淬火，能依铜锡配比铸出性能不同的剑。后世铸剑行业多奉他为祖师。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 40
      intellect: 18
      defense: 24
      agility: 18
  blue:
  - key: hist_xianqin_0226
    name: 庖丁
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）战国厨师，事迹见于《庄子·养生主》。庖丁为梁惠王分解牛体，依循筋骨缝隙运刀，所用之刀十九年仍如新磨；他自称所好者是“道”，已超过技艺本身。解牛完毕后提刀四顾、从容收刀，梁惠王由此领悟养生之理。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 18
      agility: 16
  - key: hist_xianqin_0204
    name: 姬职
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （约前335年—前279年）战国燕国君主，名职。燕昭王在子之之乱、齐国破燕之后即位，采纳郭隗建议，筑宫招贤、厚礼待士，任用乐毅、邹衍等人；五国伐齐时乐毅攻下齐国七十余城，他未及见战事结束便去世。其在位期间燕国由弱转强。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 22
      defense: 24
      agility: 18
  - key: hist_xianqin_0212
    name: 嬴驷
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （前356年—前311年）战国秦惠文王，秦孝公之子，秦国第一位称王的君主。嬴驷即位后处死商鞅，却保留其新法；他任用张仪推行连横，支持司马错攻灭蜀国、夺取巴蜀，又在对楚、韩、魏的战事中扩张疆土，为秦国东进奠定基础。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 20
      defense: 24
      agility: 18
  - key: hist_xianqin_0213
    name: 嬴稷
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （前325年—前251年）战国秦昭襄王，秦惠文王之子，在位五十六年。嬴稷早年由宣太后与魏冉辅政，后来采纳范雎之策亲政，任用白起在伊阙、长平等战中大破诸侯军队；晚年因邯郸之围与白起生隙，将其赐死，不久死于咸阳。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 22
      defense: 24
      agility: 16
  - key: hist_xianqin_0214
    name: 嬴渠梁
    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （前381年—前338年）战国秦孝公，秦献公之子。嬴渠梁即位后发布求贤令，任用卫鞅主持变法，推行县制、奖励军功、开垦田地，并将都城迁至咸阳；秦国由此富强。孝公死后，卫鞅失去支持，被继位的惠文王处死，但其变法得以延续。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 22
      defense: 24
      agility: 16
  - key: hist_xianqin_0202
    name: 田因齐
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （?—前320年）战国齐威王，田齐君主。田因齐即位初年沉于逸乐，淳于髡以“三年不鸣”的隐语进谏，他自此振作，任用邹忌为相、田忌与孙膑为将，先后在桂陵、马陵之战大败魏军；又扩建稷下学宫，使齐国一度称雄东方。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 20
      defense: 26
      agility: 18
  - key: hist_xianqin_0207
    name: 魏罃
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （约前400年—前319年）战国魏惠王，名罃，魏武侯之子。魏罃将都城迁至大梁，一度称王于逢泽，却在桂陵、马陵两战中接连败给齐军，国势由盛转衰；晚年他接待孟子，留下“王何必曰利”的问答，死后由太子嗣位。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 34
      intellect: 20
      defense: 26
      agility: 20
  - key: hist_xianqin_0208
    name: 赵何
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （约前310年—前266年）战国赵惠文王，名何。赵何任用廉颇、蔺相如、赵奢等文武之臣，经历完璧归赵、渑池会盟与阏与之战，屡次在外交和军事上挫退秦国的锋芒；其在位时赵国国力强盛，成为东方诸国中抗秦的主力。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 22
      defense: 24
      agility: 18
  - key: hist_xianqin_0210
    name: 熊槐
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （?—前296年）战国楚怀王，名槐。熊槐听信张仪以商於之地换取楚齐断交的许诺，断交后却只得到六里，怒而发兵又遭败绩；他后来两度入秦，第二次被秦昭襄王扣留，最终客死于咸阳，屈原也因受靳尚等人排挤而见疏。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 32
      intellect: 20
      defense: 26
      agility: 22
  - key: hist_xianqin_0200
    name: 樊于期
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （?—前227年）战国末年秦国将领，因获罪于秦王政而逃亡燕国，被燕太子丹收留。荆轲谋划刺秦时，提出以樊于期的首级和督亢地图取信秦王；樊于期得知后自刎，将首级交与荆轲。事见《史记·刺客列传》，其首级成为荆轲入秦的凭信。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 12
      defense: 26
      agility: 20
  - key: hist_xianqin_0201
    name: 田辟疆
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （?—前301年）战国齐宣王，名辟疆。田辟疆在位时扩建稷下学宫，广招诸子学者，留下与孟子论齐桓公、晋文公之事的问答；他喜听三百人合奏竽乐，后世由此衍生“滥竽充数”的故事。齐曾趁燕国内乱出兵占领燕地，后因诸侯干预而退。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 18
      defense: 26
      agility: 20
  - key: hist_xianqin_0203
    name: 田地
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （?—前284年）战国齐湣王，名地。田地即位后国力强盛，灭宋国，并与秦昭襄王一度并称东西二帝；其扩张引起诸侯忌惮，燕昭王联合五国伐齐，乐毅连下七十余城。田地出逃至莒，被前来援救的楚将淖齿所杀，齐国自此由盛转衰。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 16
      defense: 26
      agility: 20
  - key: hist_xianqin_0206
    name: 韩昭侯
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （?—前333年）战国韩昭侯，韩国君主，在位约三十年。韩昭侯任用申不害为相，主持改革内政、整饬吏治，申不害以“术”考核群臣，韩国因此国治兵强，诸侯一时不敢来侵；申不害执政约十五年，死后韩国渐衰，昭侯晚年死于新郑。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 34
      intellect: 22
      defense: 26
      agility: 18
  - key: hist_xianqin_0209
    name: 赵丹
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （?—前245年）战国赵孝成王，赵惠文王之子，名丹。长平之战时，赵丹听信反间，任用赵括取代廉颇；赵军被秦军包围后，赵括战死，四十余万赵军投降。秦军围攻邯郸时，他听从平原君等人的主张守城，魏国信陵君率军救赵，秦军退去。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 34
      intellect: 18
      defense: 26
      agility: 22
  - key: hist_xianqin_0211
    name: 熊横
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （?—前263年）战国楚顷襄王，楚怀王之子，名横。熊横即位后国势不振，秦将白起攻破楚都郢，楚王室东迁至陈；他后来在城阳召见庄辛，采纳其“亡羊补牢”的劝谏，得淮北之地，最终在陈去世。其事迹多见于《战国策·楚策》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 34
      intellect: 20
      defense: 26
      agility: 20
  - key: hist_xianqin_0218
    name: 郑国
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）战国韩国水工。韩国为拖耗秦国国力，派郑国入秦主持开渠；秦王政察觉后欲杀他，郑国表示渠成可为秦国带来万世之利，遂得继续施工。郑国渠引泾水灌溉关中盐泽，使大片农田变为沃野，秦国更加富庶，为日后兼并六国提供了物质基础。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0228
    name: 郭隗
    avatar: pig_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）战国燕国谋士。燕昭王询问招贤之策时，郭隗讲述古代君主以五百金买千里马骨、引来更多良马的故事，并劝昭王先礼遇自己；昭王遂为他筑宫、以师礼相待，乐毅、邹衍、剧辛等人相继入燕。后世相传昭王所筑即黄金台。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0238
    name: 庆父
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: （?—前660年）春秋鲁国公子，鲁庄公之弟。庆父与庄公夫人哀姜合谋，在庄公死后先后杀死公子般与鲁闵公，图谋君位，鲁国因此大乱；大夫季友拥立僖公并借助齐国的支持，庆父出奔莒国，后被遣返途中自缢。后世由此有“庆父不死，鲁难未已”之说。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 18
      defense: 24
      agility: 20
  - key: hist_xianqin_0242
    name: 夷吾
    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （?—前637年）春秋晋惠公，名夷吾，晋献公之子。骊姬之乱后，夷吾在秦穆公支持下回国即位，曾许诺割让河西之地却未兑现；韩原之战中他被秦军俘获，获释后杀死里克、丕郑等拥立功臣，晋国内政由此不稳，其子圉后来入秦为质。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 18
      defense: 26
      agility: 20
  - key: hist_xianqin_0243
    name: 里克
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （?—前650年）春秋晋国大夫。骊姬之乱后，里克先后杀死奚齐、卓子，骊姬亦死于乱中，他欲迎立公子重耳，重耳辞不受；于是改迎夷吾为晋惠公。惠公即位后以他连弑二君为由，逼里克自杀，事见《史记·晋世家》等书。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 14
      defense: 26
      agility: 18
  - key: hist_xianqin_0232
    name: 钟离春
    avatar: monkey_wen_female5.png
    default_gender: female
    archetype: civil
    flavor: （生卒年不详）战国齐国女子，名钟离春，齐宣王时人，相传为无盐人。钟离春主动求见齐宣王，当面指出齐国外有强敌、内多谗臣、国君耽于游乐、贤才不用等弊病，被后世概括为“四殆”；相传齐宣王采纳她的劝告，并立她为王后，齐国因此一度安定。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 58
      defense: 18
      agility: 16
  green:
