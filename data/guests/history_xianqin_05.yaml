  - key: hist_xianqin_0249
    name: 魏犨
    default_gender: male
    archetype: military
    flavor: （生卒年不详）晋国从亡之臣，以勇力见称，后为魏氏兴起的重要前辈。重耳流亡十九年，他始终随行，复国后也在晋军中占有一席之地。魏犨的单独事迹不如狐偃、先轸那样耀眼，但魏氏后来能在晋国卿族中坐大，追本溯源，往往要提到这批早年追随重耳的旧臣。比起一时独胆斗狠，他真正留下的是家族起家的资历与战功。
    growth_range:
