  - key: hist_xianqin_0248
    name: 头须
    default_gender: male
    archetype: military
    flavor: （生卒年不详）晋公子重耳流亡时的御者。车夫在史书里通常最不显眼，可流亡十九年，穿州过国、躲追兵、避饥寒，真正把人平安送到下一站的，恰恰离不开这样的人。头须没有狐偃那样的谋，没有先轸那样的名将声望，却一直跟在重耳身边，把自己的位置守到了最后。若没有这些沉默的随从，从亡故事往往撑不到复国那一天。
    growth_range:
