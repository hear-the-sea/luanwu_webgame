heroes:
  blue:
  - key: hist_suitang_0293
    name: 杜淹
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （？—628年）唐初大臣，字执礼，京兆杜陵人，杜如晦之叔。隋文帝时隐居太白山求仕，被流放江表；隋末任御史中丞，后为王世充政权吏部尚书。归唐后历任御史大夫、检校吏部尚书，参预朝政，封安吉郡公。其人辩给多才，历仕数主而终获信用。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 11
      intellect: 57
      defense: 21
      agility: 11
  - key: hist_suitang_0286
    name: 崔仲方
    avatar: pig/文031.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）北周、隋代官员，字不齐，博陵安平人。少有文武才干，随北周武帝攻晋州，又参与擒获陈将吴明彻。入隋后历任内史舍人、太常少卿等职，曾上《平陈之策》，建议上游大造舟师、下游密营渡计，文帝颇采其议。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 56
      defense: 21
      agility: 9
  - key: hist_suitang_0289
    name: 陈棱
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: military
    flavor: （？—619年）隋代将领，字长威，庐江襄安人。大业六年与张镇周自义安渡海远征流求，破其军并俘获而归，此行是隋代经略海疆的重要行动之一；后任江都太守，参与镇压江淮变乱。隋末江都兵变后辗转依附杜伏威，武德二年为李子通所杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 14
      defense: 26
      agility: 16
  - key: hist_suitang_0291
    name: 杜正伦
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: （？—658年）唐初大臣，相州洹水人。武德年间任齐州总管府录事参军，后入秦王府文学馆。贞观中历任给事中、中书侍郎，迁中书令，兼太子右庶子，以直言辅导太子。显庆三年因与李义府不协，被诬结党，贬横州刺史，卒于贬所。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 17
      intellect: 52
      defense: 16
      agility: 15
  - key: hist_suitang_0292
    name: 戴胄
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （？—633年）唐初大臣，字玄胤，相州安阳人。明习律令，太宗时由兵部员外郎迁大理少卿。任内多次据法驳正诏敕，曾为诈冒资荫者争辩，主张断案当依律令而非临时敕旨。其执法刚正，太宗亦多所采纳，后官至尚书右丞，贞观七年病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 53
      defense: 17
      agility: 16
  - key: hist_suitang_0295
    name: 高季辅
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: （？—654年）唐初大臣，本名冯，以字季辅行世，渤海蓨人。归唐后任监察御史，纠劾不避权贵。贞观中迁中书舍人、太子右庶子，曾上表陈时政得失，为太宗所嘉纳。官至中书令、侍中，以清正称，永徽五年因病去世，谥曰宪。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 22
      agility: 12
  - key: hist_suitang_0297
    name: 令狐熙
    avatar: pig/文050.png
    default_gender: male
    archetype: civil
    flavor: （约540年—602年）北周、隋代官员，字长熙，敦煌人，令狐整之子、令狐德棻之父。历任北周吏部中大夫，入隋后任鸿胪少卿、吏部尚书，后出为桂州总管，在岭南安抚夷民、兴办学校，颇得民心。仁寿二年卒于任上。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 56
      defense: 16
      agility: 14
  - key: hist_suitang_0302
    name: 裴蕴
    avatar: pig/文048.png
    default_gender: male
    archetype: civil
    flavor: （？—618年）隋代大臣，河东闻喜人，性明辩有吏干，善候人主意旨。炀帝时历任民部侍郎、御史大夫，主持括户与赋税事务，检括隐漏人口以增国用；又与裴矩、虞世基等参预朝政。大业九年参与镇压杨玄感起兵，江都兵变时为宇文化及部下所杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 11
      intellect: 54
      defense: 22
      agility: 13
  - key: hist_suitang_0303
    name: 裴虔通
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）隋代将领，早年即为晋王杨广的亲信，官至监门直阁。大业末年天下大乱，禁军将士思归，裴虔通与司马德戡等乘势举事。大业十四年参与江都兵变，率兵进入宫城，共推宇文化及为主。归唐后以弑君之罪流放欢州，卒于岭南。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 14
      defense: 26
      agility: 16
  - key: hist_suitang_0305
    name: 苏瓌
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: （639年—710年）唐初大臣，字昌容，京兆武功人，苏威曾孙、苏颋之父。历任朗州、歙州、扬州等地刺史，以清慎著称。景龙年间入朝为相，官至尚书右仆射，曾按治郑普思以方术惑众之罪，不避中宗袒护。景云元年病逝，追赠司空。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 11
      intellect: 58
      defense: 23
      agility: 8
  - key: hist_suitang_0309
    name: 韦世康
    avatar: pig/文048.png
    default_gender: male
    archetype: civil
    flavor: （531年—597年）北周、隋代大臣，京兆杜陵人，韦夐之子，娶襄乐公主。历仕北周、隋两朝，官至吏部尚书、荆州总管，封上庸郡公。掌管选举，以廉慎公平著称，颇能擢用人才；与其弟韦洸、韦艺并有时名。开皇十七年去世，谥曰文。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 15
      intellect: 55
      defense: 23
      agility: 7
  - key: hist_suitang_0314
    name: 宇文忻
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）北周、隋代将领，宇文贵之子，骁勇有谋略，每战常为先锋。北周时随军灭齐，又参与伐陈及平定尉迟迥之乱，以功封英国公。北周末依附杨坚，赞成其代周；入隋后任右领军大将军，开皇六年与梁士彦、刘昉谋反，事泄被诛。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 14
      defense: 26
      agility: 16
  - key: hist_suitang_0317
    name: 袁聿修
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （511年—582年）北齐、北周、隋代官员，字叔德，陈郡阳夏人，官至吏部尚书。巡察河南时，兖州刺史邢邵赠以白绸，他退还不受，时人称为“清郎”。其清介自守为时论所重，北齐亡后历仕北周、隋，开皇二年卒于熊州刺史任上。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 21
      agility: 9
  - key: hist_suitang_0320
    name: 宇文智及
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: military
    flavor: （？—619年）隋末将领，宇文化及之弟。为人凶狡，兄弟专擅，为众所怨。大业十四年与司马德戡等合谋发动江都兵变，杀隋炀帝，推宇文化及为主。宇文化及称帝后封其为齐王；后裹挟百官北还，为窦建德所败，兄弟同被擒获处死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 14
      defense: 26
      agility: 16
  - key: hist_suitang_0239
    name: 杜楚客
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: （？—655年）唐初官员，京兆杜陵人，杜如晦之弟。以门荫入仕，历官以清谨称；隋末曾被王世充囚禁，归唐后任给事中、蒲州刺史，曾为叔父杜淹求情。后任魏王李泰府长史，因李泰谋夺储位事败而受牵连，贬为庶人，卒于安固。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 13
      intellect: 56
      defense: 23
      agility: 8
  - key: hist_suitang_0242
    name: 侯白
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）隋代文士，字君素，魏郡临漳人，以博学机辩、诙谐善谈著称，言谈捷给，闻者绝倒。隋初举秀才，为儒林郎，后受隋文帝之召入秘书省修史。相传著有志怪小说《旌异记》十五卷，另传《启颜录》亦出其手，多记谐谑故事。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 52
      defense: 22
      agility: 10
  - key: hist_suitang_0247
    name: 李士谦
    avatar: pig/文037.png
    default_gender: male
    archetype: civil
    flavor: （523年—？）北齐、隋代隐士，字子约，赵郡平棘人。幼年以孝闻名，博通经史、天文与术数。北齐、隋两朝多次征召，皆称病不仕，终身以讲学、赈施为事。家资丰厚而自奉俭约，荒年常散粟赈济乡里，乡里德之，时人称为善士。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 56
      defense: 16
      agility: 16
  - key: hist_suitang_0249
    name: 鲁广达
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: military
    flavor: （？—589年）南朝陈将领，以忠勇著称，少有志节，临阵勇决，每战身先士卒。曾任晋州刺史，参与平定侯景之乱，后迁中领军。隋军灭陈时率部力战于建康，兵败被俘；陈亡后悲愤成疾而卒，陈朝旧臣江总为其题棺致哀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 14
      defense: 26
      agility: 16
  - key: hist_suitang_0264
    name: 杨师道
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: （？—647年）唐初大臣，字景猷，弘农华阴人，隋观王杨雄之子，娶唐高祖女桂阳公主。曾任灵州总管，击退东突厥；后历任侍中、中书令、尚书右仆射，封安德郡公。性周慎，未尝泄禁中语，其诗清警，为时人所称，贞观二十一年去世。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 50
      defense: 20
      agility: 16
  - key: hist_suitang_0274
    name: 刘炫
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （约546年—？）隋代经学家，字光伯，河间景城人，与刘焯并称“二刘”。通晓五经，曾与刘焯同修国史、考定群书，著有《论语述议》《春秋述议》等。隋文帝命牛弘搜求遗书时，刘炫伪造《连山易》《鲁史记》等百余卷送官求赏，事发后被除名。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 50
      defense: 23
      agility: 11
  green:
  - key: hist_suitang_0248
    name: 李玄霸
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （599年—614年）唐高祖李渊第三子，母为太穆皇后窦氏，与李世民同母。大业十年病逝，年仅十六，无子。武德元年追封卫王，谥曰怀，故史称卫怀王。正史对其生平记载寥寥，后世《说唐》等演义将其改写成力大无穷的李元霸，与真实形象相去甚远。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 55
      defense: 18
      agility: 11
  - key: hist_suitang_0255
    name: 王玄应
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）隋末王世充长子。其父本隋朝东都守将，大业末据洛阳，先拥立越王杨侗，武德二年废侗称帝，国号郑，立玄应为太子。武德四年唐军围洛阳，王世充出降，玄应随父被押解至长安，后与父一同遇害，具体经过史载不一。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 57
      defense: 22
      agility: 7
  - key: hist_suitang_0319
    name: 颜思鲁
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）隋唐之际官员、学者，字孔归，琅琊临沂人，颜之推长子。承颜氏家学，精于文字音韵，隋时任东宫学士，入唐后为秦王府记室参军。其子颜师古注《汉书》，为唐初经学名家；后人颜真卿亦以书法、忠节著称。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 52
      defense: 22
      agility: 11
  - key: hist_suitang_0257
    name: 王仁则
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）隋末王世充集团将领，出自王氏宗族，奉命镇守洛阳外围关隘，与唐军相持。武德四年唐军围洛阳，少林寺僧志操、惠玚等助唐擒获王仁则，押送秦王李世民，此事见于《皇唐嵩岳少林寺碑》。后世“十三棍僧救唐王”之说，即由此演化而来。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 14
      defense: 26
      agility: 16
  - key: hist_suitang_0258
    name: 徐则
    avatar: pig/文036.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）隋代道士、隐士，东海郯人。少沉静寡欲，师从周弘正，通晓《老》《庄》《易》三玄，兼精天文历数，后隐居天台山，绝粒养性。晋王杨广镇守扬州时遣使征召，徐则应命而至，不久卒于扬州，年约八十二。其行止见于《隋书·隐逸传》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 51
      defense: 22
      agility: 16
  - key: hist_suitang_0260
    name: 薛收
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （592年—624年）唐初文臣，字伯褒，蒲州汾阴人，隋内史侍郎薛道衡之子。因父亲为隋炀帝所杀，屡辞征辟，不肯仕隋。入唐后任秦王府主簿、记室参军，为十八学士之一，参预平定王世充、窦建德的军谋。武德七年卒，年仅三十三。太宗即位后追念其才，追赠定州刺史，陪葬昭陵。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 50
      defense: 22
      agility: 12
  - key: hist_suitang_0262
    name: 徐孝肃
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）隋代孝子，汲郡人。宗族数十家多以豪侈相尚，独徐孝肃俭约自持，事母以孝闻名。母亲去世后，他在墓旁结庐守丧，负土筑坟，前后四十余年，终身不仕。其事迹载于《隋书·孝义传》，朝廷为旌表其门闾，乡里称之。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 55
      defense: 16
      agility: 16
  - key: hist_suitang_0263
    name: 乙弗弘礼
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）隋末唐初相士，贝州高唐人。以善相知名，相传隋炀帝为晋王时曾召其相面，弘礼直言相告，反因言辞触忌获罪。入唐后仍以相术游于公卿之间，曾为唐初大臣薛大鼎看相。其事迹主要见于《旧唐书·方伎传》，具体言论多带传闻色彩。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 57
      defense: 17
      agility: 14
  - key: hist_suitang_0265
    name: 杨伯丑
    avatar: monkey/其他随机角色/文_男123.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）隋代河东人，以卜筮闻名。通晓《周易》、天文与算术，长期在民间卖卜为生，所占多有应验。隋文帝时曾被召入朝，应对不循礼数，不久仍归乡里；隋炀帝时又有征问。其行事见于《隋书·艺术传》，带有浓厚的方术传说色彩。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 58
      defense: 16
      agility: 13
  - key: hist_suitang_0267
    name: 张公艺
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
