    name: 王仁则
    default_gender: male
    archetype: civil
    flavor: 王仁则，隋末王世充部将，事迹多见于唐初平定洛阳的相关记载。其人曾据守要地，与秦王李世民军相抗，后兵败被擒。除战事片段外，其家世、早年与终局记载不多，是隋末割据势力中较典型的守将形象。
    growth_range:
