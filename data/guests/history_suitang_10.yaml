      intellect: 51
      defense: 18
      agility: 18
  - key: hist_suitang_0258
    name: 徐则
    default_gender: male
    archetype: civil
    flavor: 徐则，隋唐之际人，生卒年里不详。仅散见记载提及其曾参与税粮征调、水渠修缮及物资转输等庶务。其行事不求闻达于上，但求账目可对、工程可用，所理之事多能延续至后任而不因人废。然完整履历散佚，仅据残文推其属踏实一路。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 51
      defense: 22
      agility: 16
  - key: hist_suitang_0259
    name: 萧世廉
    default_gender: male
    archetype: civil
    flavor: 萧世廉，隋唐之际人物，生卒与仕履不详。现存材料不足以勾勒完整生平，只能见其名附于同代人物记录之中。他并非以显赫功业传世，而是乱世文献边缘仍可辨认的一道身影。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 52
      defense: 18
      agility: 19
  - key: hist_suitang_0260
    name: 薛收
    default_gender: male
    archetype: civil
    flavor: 薛收，字伯褒，河东汾阴人。隋内史侍郎薛道衡之子。隋末乱起，遁入首阳山。入唐后为秦王府记室参军，从征王世充、窦建德，军中檄书露布多出其笔。武德七年病卒，年仅三十三。太宗即位后追赠定州刺史、太常卿。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 50
      defense: 22
      agility: 12
  - key: hist_suitang_0261
    name: 萧璿
    default_gender: male
    archetype: civil
    flavor: 萧璿，出自兰陵萧氏。隋唐之际有关其人的史载极简，可核事迹近乎空白。仅知曾历仕于隋唐之间，然具体职守不明，治行不详，生卒亦失载。其名散见于姓氏文献与宗谱摘录，生平细节已不可考。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 53
      defense: 23
      agility: 12
  - key: hist_suitang_0262
    name: 徐孝肃
    default_gender: male
    archetype: civil
    flavor: 徐孝肃，汲郡人。早孤，事母至孝。母终，负土筑坟，庐于墓侧四十余年，疏食饮水，晨夕哀临。隋末大乱，群盗四起，孝肃守墓不去。盗过其庐皆敛手，无敢犯者。朝廷闻而旌表之，蠲免徭役。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 55
      defense: 16
      agility: 16
