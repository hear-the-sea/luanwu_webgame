    archetype: civil
    flavor: （1702年—1771年）字南青，号姜埭，清代学者、文学家。姚范治经史、古文和文献考辨，著有《援鹑堂笔记》等，重视从字句、制度和史事互相印证；他也是桐城古文传统的重要前辈。其文章表面平静，内里却有一股考据家的硬劲：先把出处钉牢，再让辞章舒展。
