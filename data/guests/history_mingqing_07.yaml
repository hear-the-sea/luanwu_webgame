    default_gender: male
    archetype: civil
    flavor: （1611年—1671年）明末清初学者，字密之，号曼公。方以智明亡后曾出家为僧，晚年在广西、江西等地游历讲学；他著有《物理小识》，讨论天文、地理、医药和器物，并提出“质测”“通几”等说法，卒于投江途中。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0278
    name: 李渔
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （1611年—1680年）字笠鸿，号笠翁，浙江兰溪人，清初文学家、戏曲家。明末屡试不第，入清后移居杭州，又迁南京，开设芥子园书铺，编刻书籍、组织家班演出。他作有《笠翁十种曲》，所著《闲情偶寄》系统讨论戏曲结构、词采与演习，兼及园林、饮食等生活技艺；晚年返回杭州，卒于其地。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0279
    name: 朱舜水
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （1600年—1682年）名之瑜，字鲁屿，号舜水，浙江余姚人，明末清初学者。明亡后他奔走于舟山、安南、日本之间，谋求援助南明，事不可为。永历十三年东渡日本，应水户藩主德川光圀之邀讲学，传播儒家礼制与经世之学，后卒于江户，其言行由门人辑为《朱舜水集》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
