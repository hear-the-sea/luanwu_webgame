    archetype: civil
    flavor: （1636年—1704年）字百诗，号潜丘，山西太原人，清初学者。他长期究心经史与地理，所著《尚书古文疏证》从篇目、文字、训诂等方面列举证据，考辨东晋所献古文《尚书》为后人伪作，对清代辨伪学风影响甚大。康熙年间应博学鸿词未第，后参与修纂《大清一统志》，晚年卒于京师。
