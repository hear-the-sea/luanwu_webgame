    default_gender: male
    archetype: civil
    flavor: （1768年—1838年）字次珊，号鹿潭，清代学者、官员，阮元之婿。蒋因培处在乾嘉考据和地方文教的学术网络中，重视经史、版本与地理文献；他的生平与具体著述留存有限。作为阮元的姻亲，他有便利也有阴影，真正能留下名声的仍是自己的读书和办事。学术江湖讲门第，却终究要凭手上校过的书说话。
