    default_gender: male
    archetype: civil
    flavor: （1755年—1811年）字荷之，号莲士，乾隆四十三年状元，清代大臣。戴衢亨历任军机大臣、大学士等职，嘉庆朝参与中枢政务，长于典章、文书和人事协调；他的功劳多在把复杂事项理成可执行的章程。状元文章有锋，入阁之后更考验耐心。戴衢亨不是靠一声断喝立名，而是在一叠叠奏折间守住秩序。
