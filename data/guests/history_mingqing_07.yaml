      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0282
    name: 沈复
    avatar: pig/文029.png
    default_gender: male
    archetype: civil
    flavor: （1763年—卒年不详）字三白，号梅逸，长洲人，清代文人。他一生未入仕途，长期以幕僚、经商为业，辗转苏州、扬州等地，与妻陈芸感情深笃。嘉庆年间写成自传体笔记《浮生六记》，现存《闺房记乐》《闲情记趣》《坎坷记愁》《浪游记快》四记，以清丽笔调记述夫妻日常、游历与园林见闻，后二记已佚。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
