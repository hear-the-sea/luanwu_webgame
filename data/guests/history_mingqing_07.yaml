    default_gender: male
    archetype: civil
    flavor: （1639年—1712年）字元龙，号研溪，清初经学家，惠士奇之父、惠栋之祖。惠周惕重视汉儒训诂、经书版本和师法传承，治《易》尤有声名，为惠氏家学奠定基础。吴派汉学并非由一人一日创立，他的作用更像在家中把灯火护住，交给下一代继续添油。经书传家，传的不是口号，而是对每个古字都肯较真的脾气。
