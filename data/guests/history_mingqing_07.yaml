  - key: hist_mingqing_0271
    name: 陆世仪
    default_gender: male
    archetype: civil
    flavor: （1611年—1672年）字道和，号桴亭，明末清初学者、教育家。陆世仪重程朱之学，也强调天文、地理、水利、兵法等实学，著《思辨录辑要》等，试图让读书不脱离现实事务。明清易代后他主要在乡里讲学、著述，影响来自长期教育而非一场政治宣言。耕读并举不是一句门联，而是他认为读书人应当亲近土地和世事的生活方式。
