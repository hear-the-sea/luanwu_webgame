    default_gender: male
    archetype: civil
    flavor: （1475年—1540年）字德涵，号对山，明代文学家、官员，“前七子”成员，与王九思并称“康王”。康海任翰林时卷入刘瑾事件，刘瑾败亡后也受牵连罢归；这段仕途使他的复古文风带上了现实的阴影。他擅长诗文、散曲，作品有豪放诙谐的一面，并非只有“守正不阿”的端坐画像。名士退回乡里，文章有时比朝服更能容下他的脾气。
