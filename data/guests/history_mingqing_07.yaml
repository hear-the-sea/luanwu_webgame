    flavor: （1789年—1859年）严如熤之侄，清代学者。现存记载对严经的官历、著述及参与地方志、水利档案的情况并不完整；已知他承接严氏家族对地理、边防和地方文献的关注。其学术身影，更多留在家学传承与地方实务的交界处。
