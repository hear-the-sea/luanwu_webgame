    default_gender: male
    archetype: civil
    flavor: （1743年—1796年）字与桐，号二云，清代史学家、考据家，曾任《四库全书》纂修官。邵晋涵参与从《永乐大典》辑佚《旧五代史》，并整理史部典籍，是四库学术工程中重要的实作者；辑佚本就是多人协作的学术工程，他负责的长处在史料辨析和编次，像在旧战场上寻找散落的军令，先验真假，再排出次序。
    growth_range:
