    default_gender: male
    archetype: civil
    flavor: （1481年—1561年）字贞甫，号毅斋，明代官员、文学家，官至礼部尚书、太子太保。孙承恩长期任职礼部与翰林系统，熟悉典章、文书和朝廷礼制，也以诗文见长；他的声名更接近一位稳健的礼官文臣，而非凭空横扫政坛的改革家。礼仪看似无刀，却牵动一朝秩序。孙承恩在纸笔之间守的，正是这套不容轻慢的规矩。
