  - key: hist_mingqing_0283
    name: 钱谦益
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （1582年—1664年）字受之，号牧斋，晚号蒙叟，江苏常熟人，明末清初文学家。万历三十八年进士，崇祯朝官至礼部侍郎，因党争削籍；弘光朝任礼部尚书，清军入南京后降清，不久辞官归里。他主盟文坛数十年，编有《列朝诗集》，著有《初学集》《有学集》，晚年与柳如是同居常熟，康熙三年去世。
    growth_range:
    - 5
