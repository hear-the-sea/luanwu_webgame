    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0284
    name: 吴伟业
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （1609年—1672年）字骏公，号梅村，江苏太仓人，明末清初诗人。崇祯四年榜眼，官至翰林院编修、左庶子；弘光朝任少詹事，明亡后隐居乡里。顺治十年被迫应召出仕，授秘书院侍讲，后迁国子监祭酒，不久以丁忧归乡。其诗多纪明清易代之事，长诗《圆圆曲》流传尤广，著有《梅村家藏稿》。
