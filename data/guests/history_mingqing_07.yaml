    flavor: （1755年—1835年）字恩楷，号怿斋，清代大臣，历乾隆、嘉庆、道光三朝，官至大学士、首席军机大臣。曹振镛以老成持重著称，后人常用“多磕头、少说话”概括其谨慎圆融。道光初年他仍居中枢，擅长维持程序和人事的连续性，却也因此被批评缺少改革锋芒。稳舵能避风浪，船若要改道，还需另一种胆量。
