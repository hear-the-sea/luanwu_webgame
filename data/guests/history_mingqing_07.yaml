    flavor: （1468年—1551年）字敬夫，号渼陂，明代文学家、官员，与康海并称“康王”。王九思参与前七子所代表的复古文风，诗文和散曲皆有声名；因仕途失意，他晚年归里，终于按自己的声口写文章。官场不给位置，曲中还可以自己搭台。
