    archetype: civil
    flavor: （1740年—1818年）字晓伦，号蔗林，清代大臣、画家，董邦达之子。董诰历任户部尚书、大学士等职，亦善山水、花卉，承续家学而不止于摹仿；他还参与《四库全书》等宫廷文化工程的审校和管理。父子都入画史与政坛，容易被写成“家传神笔”，其实每一幅画、每一道政务都仍要靠本人落笔。
