    name: 臧琳
    default_gender: male
    archetype: civil
    flavor: （1653年—1733年）字玉琳，号在东，清初经学家。臧琳以《经义杂记》等著作见长，重视经文、注疏和古代制度之间的互证，是乾嘉考据学兴起前的重要学者。后世把他称作“先声”可以，若说他已经建立完整的现代学术体系便过了。书斋里最锋利的兵器不是夸张的结论，而是能指出一处异文从何而来。
