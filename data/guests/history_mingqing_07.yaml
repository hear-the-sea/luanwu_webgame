heroes:
  blue:
  - key: hist_mingqing_0267
    name: 阎若璩
    default_gender: male
    archetype: civil
    flavor: （1636年—1704年）字百诗，号潜丘，清初伟大的考据学家、史学家。他以极其严密的科学逻辑与文献排比，历时三十载撰写了震撼学术界的巨著《古文尚书疏证》，通过详实的考证彻底揭示了流传千年的“古文尚书”实为伪作，这一成果标志着清代考据学的正式成熟。阎若璩治学极其极其严谨，主张“凡学必有证据，无征不信”。他在极其清贫的环境下坚持科研，展现了对真相不懈追求的人格力量。他那种敢于挑战权威、追求理性的极致精神，使其成为了中国学术史上的一位里程碑式的人物。他的工作不仅提升了中国古代史学的科学性，也为后来的地理发现与国防建设提供了重要的实证参考，其名字代表了学术诚信与深度的最高结合。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0277
    name: 方以智
    default_gender: male
    archetype: civil
    flavor: （1611年—1671年）字密之，号曼公，明末清初杰出的科学家、哲学家与文学家。他出身名门，早年积极参与复社活动，明亡后出家为僧以守节。方以智在自然科学领域具有领先时代的远见，其巨著《物理小识》系统整理了当时传入的西洋科学知识与中国传统技术，涵盖了天文、地理、医药、力学等多个领域。他在学术上提出了“质测”与“通几”的理论，主张通过严密的实验观察来探求事物的客观物理规律。方以智的一生体现了那一时代中国精英阶层在面临政治灭亡时刻，努力寻求科技自强与文明整合的壮丽尝试。他那种跨学科的知识结构与追求真理的赤诚，使其成为了中国科学思想史上的一位重要先驱。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0278
    name: 李渔
    default_gender: male
    archetype: civil
    flavor: （1611年—1680年）字笠鸿，号笠翁，清初著名的文学家、剧作家、园林设计师与生活艺术家。他才华横溢、涉猎极广，其小说《肉蒲团》与剧作《笠翁十种曲》在当时具有极其广泛的影响力。李渔在生活美学方面造诣极深，其名著《闲情偶寄》详尽论述了戏曲表演、建筑设计、盆景艺术、饮食起居等方方面面的雅趣，代表了十七世纪中国文人追求精致生活的最高水平。他在南京修建的“芥子园”成为了当时文化名流交流的重要场所。李渔的一生是在市场化背景下追求艺术真实与生活品质的成功典范。他那种不仅关注文本创作且高度关注舞台实践与物质文化的视野，使其成为了中国文化史上的一位全能型奇才。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0279
    name: 朱舜水
    default_gender: male
    archetype: civil
    flavor: （1600年—1682年）名之瑜，号舜水，明末清初著名的思想家、教育家。他在明亡后曾长期奔走于东南亚各地，筹措资金与武力试图恢复大明，展现了极其坚贞的民族志节。在复国无望后，他应邀东渡日本讲学，受到了德川幕府与日本士林的极度尊崇。朱舜水在日本传播了实事求是的“水户学”思想，强调经世致用与忠孝大义，对日本后来的明治维新等社会变革产生了极其深远的潜移默化影响。他的一生致力于文化的跨国传承与实证学术的普及。朱舜水那种追求学术纯粹性与现实责任感高度统一的姿态，使其成为了中日文化交流史上的一座巍峨丰碑，他不仅守护了民族自尊，更在异国他乡延续了中华文明的精髓。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0283
    name: 钱谦益
    default_gender: male
    archetype: civil
    flavor: （1582年—1664年）字受之，号牧斋，明末清初著名的文坛盟主、史学家与重臣。他官至明礼部尚书，在明亡后降清，并在清初担任要职，由于这一政治抉择使其在历史上备受争议。然而作为文坛泰斗，钱谦益博通经史，其诗歌造诣极其深厚，主持编纂了《列朝诗集》，系统保存了明代三百年间的文化成果。他在晚年积极支持并暗中资助反清复明活动，展现了其内心深处复杂的纠结与痛苦。钱谦益的一生是政治、学术与个人节操剧烈冲突的极端样本。尽管人品受后世诟病，但他对于华夏典籍的整理与保存、对后辈才子（如黄宗羲等）的奖掖，在文化传承上立下了不世之功。他那种将儒家的学术理想与现实的生存困境在矛盾中统一的姿态，极具历史研究价值。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0284
    name: 吴伟业
    default_gender: male
    archetype: civil
    flavor: （1609年—1672年）字骏公，号梅村，明末清初著名的诗人与官员，与钱谦益、龚鼎孳并称“江左三大家”。他出身显赫，曾任明朝翰林院编修，明亡后由于形势所迫仕清，官至国子监祭酒，这一经历使其内心深感愧疚，晚年诗作中充满了自责与故国之思。吴伟业在诗歌艺术上造诣极其深厚，开创了叙事长诗的新境界，其名篇《圆圆曲》通过细腻的笔触描写了吴三桂与陈圆圆的命运，被誉为“一代史诗”。他那种在政治名利与个人节操间剧烈挣扎的复杂情感，使其作品具有了极强的穿透力与时代见证价值。他的一生是传统文人在政权鼎革之际精神痛苦的缩影，其诗风典雅且意蕴深厚，对后世影响巨大。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0294
    name: 曹寅
    default_gender: male
    archetype: civil
    flavor: （1658年—1712年）字子清，号楝亭，清代著名的文学家、藏书家，曹雪芹之祖父。他长期担任江宁织造，深得康熙皇帝的绝对信任，曾先后四次承办康熙南巡的接驾大典。曹寅不仅在政治与经济管理上展现了干才，更在文化领域造诣极其深厚，他主持刊刻了不朽的《全唐诗》，并撰写了多部剧作与诗集。他的一生是清初显赫勋贵家族繁华与责任的缩影。曹寅那种致力于大规模文化保护与典籍刊刻的眼光，使其成为了清初文化史上的重要推动者。他那种在权势旋涡中依然能够保持对文学艺术的纯粹热爱与对才子的广泛奖掖，展现了极其高尚的文人境界，其家族的兴衰也为后来的《红楼梦》提供了深厚的现实背景。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0282
    name: 沈复
    default_gender: male
    archetype: civil
    flavor: （1763年—1825年）字三白，号梅逸，清代著名的文学家。他在科举场中一生平淡，却以一部极其动人的自传体散文《浮生六记》名垂青史。这部作品以极其细腻、真挚的笔触记录了他与妻子陈芸（芸娘）相濡以沫的平凡生活、游历见闻与艺术雅趣，展现了中国传统文人中极其罕见的、具有现代感的生活美学与情感深度。沈复在文字中流露出的那种对大自然的热爱、对平凡琐碎幸福的捕捉以及对命运无常的淡然，使其作品具有了跨越时空的艺术穿透力。他的一生是关于“才情”与“生活真实”的温润叙事。他那种追求艺术与生活高度统一的姿态，使其成为了后世读者心中极其亲切的文化符号，他那种不仅关注宏大叙事且深度关注个体情感价值的视野，极具人文关怀。
    growth_range:
    - 5
    - 9
    attribute_weights:
