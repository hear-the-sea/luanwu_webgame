  - key: hist_xianqin_0251
    name: 董安于
    default_gender: male
    archetype: civil
    flavor: （?—前496年）赵简子家臣，长期经营晋阳。赵氏与范氏、中行氏相争时，他主持筑城备守，把城防、仓廪与水利都预先整顿妥当。后来赵氏数次遭逢强敌，晋阳始终能撑住局面，这份底子和董安于早年的经营分不开。比起阵前扬名的武将，他更像替赵氏先把退路、粮路和守城之本一点点修扎实的人。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0252
    name: 尹铎
    default_gender: male
    archetype: military
    flavor: （生卒年不详）赵氏家臣，受命镇守晋阳。赵简子把这座要地交给他时，并不要他一味搜括，而是先把百姓安顿好。尹铎减赋省役，保全民力，让晋阳人真把赵氏当作可以依靠的主人。等到赵氏遭难，孤城还能上下同守，靠的不是一时号令，而是他平日一点点养出来的人心与秩序。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 38
      intellect: 18
      defense: 26
      agility: 18
  - key: hist_xianqin_0256
    name: 赵穿
    default_gender: male
    archetype: military
    flavor: （生卒年不详）晋国赵氏族人，以刺杀晋灵公留名。彼时灵公猜忌赵盾，刺客、伏兵轮番上阵，赵氏已被逼到悬崖边上。赵穿索性先下手，在桃园杀死国君，随后迎回赵盾，另立新君。赵氏因此脱困，赵盾却也背上了“弑君”的恶名。春秋史书记这件事向来冷硬，赵穿正是那把替家族闯出活路的快刀。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 42
      intellect: 12
      defense: 26
      agility: 20
  - key: hist_xianqin_0259
    name: 鸠摩
    default_gender: male
    archetype: military
    flavor: （生卒年不详）齐国勇士，史传着墨并不算多，只留下以勇力闻名的印象。战国诸侯喜好收罗猛士充作护卫与门客，鸠摩便是这一类人物。他之所以还能被后人记住，多半因为常与孟贲、乌获等力士并称，代表了那个年代尚武好力的风气。名声靠一身气力立起，生平却也大多止于这一身气力。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 8
      defense: 26
      agility: 18
  - key: hist_xianqin_0260
    name: 孟贲
    default_gender: male
    archetype: military
    flavor: （?—前307年）战国著名力士，常与乌获并称。秦武王好勇，宠任孟贲这样以气力见长的人物，宫廷风气也跟着偏向角力逞强。武王入周举鼎而伤，终于不治，这场变故不只断送了一位国君，也让围在身边的力士顿时失了依靠。孟贲留名，不在军功政绩，而在那个尚武失度的秦廷里，他几乎就是“以勇取宠”的缩影。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 8
      defense: 26
      agility: 18
  - key: hist_xianqin_0261
    name: 任鄙
    default_gender: male
    archetype: military
    flavor: （生卒年不详）秦国力士，见于秦武王时。武王喜好角力，宫中罗致孟贲、乌获、任鄙等人，日日以勇力自矜。任鄙能被史书点到，靠的不是统兵立功，而是他恰好站在这种风气最盛的时候。等到武王举鼎失命，旧日倚重的力士也一并失去舞台。伴君最近的人，未必真能左右君主，很多时候只是被卷进同一场祸福。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 46
      intellect: 10
      defense: 26
      agility: 18
  - key: hist_xianqin_0262
    name: 乌获
    default_gender: male
    archetype: military
    flavor: （生卒年不详）秦国力士，后世常把他与孟贲并称。秦武王宠好勇士时，乌获便在君侧，以膂力闻名于朝。举鼎一事把国君的好胜推到极处，也让这批靠勇力得宠的人一夜之间失势。乌获的具体战功并不显赫，名字却长久留在典故里，成了大力士的代称之一，也像是战国尚武风气留下的一道侧影。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 8
      defense: 26
      agility: 18
  - key: hist_xianqin_0265
    name: 杜挚
    default_gender: male
    archetype: civil
