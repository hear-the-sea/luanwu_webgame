  - key: hist_xianqin_0265
    name: 杜挚
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）杜挚是秦国大夫，与甘龙同属反对商鞅变法的守旧力量。他提出“利不百，不变法；功不十，不易器”，强调变更制度必须谨慎。商鞅以强国利民相驳，改革最终推进。杜挚的言论未必只是拒绝一切变化，更代表既有贵族对改革风险和利益受损的担忧。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 52
      defense: 22
      agility: 16
  - key: hist_xianqin_0266
    name: 景监
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）景监是秦孝公近臣，商鞅入秦并得以面见君主，与他的引荐有关。《史记》所载商鞅先后以帝道、王道、霸道试说孝公的故事，带有叙事化色彩；较可确认的是，景监在秦廷中承担了引荐与沟通的中介角色。变法能否进入决策层，有时确实要先过近臣这一道门。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 52
      defense: 20
      agility: 18
  - key: hist_xianqin_0267
    name: 嬴虔
