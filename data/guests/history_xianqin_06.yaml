    flavor: （生卒年不详）乌获以勇力著称，常与孟贲并列为战国力士。后世传说把他与秦武王举鼎联系在一起，但具体过程和结局并非都能由可靠史料互证。乌获之名后来成为“力能扛鼎”的代称，反映先秦社会对个人武勇的推重。
