    default_gender: male
    archetype: military
    flavor: （生卒年不详）任鄙是秦武王身边的力士，与孟贲、乌获同见于史传。关于他是否参与举鼎及其最终结局，记载并不完整；现存材料显示，他属于秦武王时期以勇力近侍、凭宠用进身的一类人物。君主更替后，这种依附个人喜好的地位也随之变得脆弱。
