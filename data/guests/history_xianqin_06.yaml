  - key: hist_xianqin_0255
    name: 赵盾
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （？—前601年）春秋晋国正卿。赵盾执政时整顿军政、制定事典，辅佐晋襄公、晋灵公，长期主持晋国朝政。晋灵公多次加害于他，赵盾被迫出逃，途中族人赵穿杀死灵公，他返国后仍被太史董狐直书“弑君”。其治国之才为时人认可，而这场君臣冲突也使他长期背负争议。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 52
      defense: 20
      agility: 14
  - key: hist_xianqin_0269
    name: 芈八子
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （？—前265年）秦宣太后，芈姓，楚国宗室之女，秦惠文王妃、秦昭襄王之母。秦武王死后无子，她以太后身份临朝，任用魏冉等亲族辅政，稳定秦国政局。她与义渠王周旋多年，后将其除去，使义渠之地归入秦国，解除了秦的西部后患。她是中国历史上较早长期主政的太后之一。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 18
      agility: 16
  - key: hist_xianqin_0271
    name: 嫪毐
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: （？—前238年）战国秦国宫廷人物。吕不韦将他伪装成宦官送入宫中，侍奉赵太后，后受封长信侯，权势渐盛。秦王政即将亲政时，他盗用太后印信发兵作乱，事败被捕，本人被处死，党羽也受到惩处。嫪毐之乱加速了吕不韦失势，也让年轻的秦王政得以收拢权柄，是秦廷权力斗争的一个缩影。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 14
      defense: 24
      agility: 24
  - key: hist_xianqin_0272
    name: 赵太后
    avatar: monkey_wen_female10.png
    default_gender: female
    archetype: civil
    flavor: （？—前228年）秦始皇生母，史称赵姬。她原是吕不韦的姬妾，后嫁秦庄襄王，庄襄王去世后以太后身份临朝。她与嫪毐私通并生下二子，嫪毐作乱失败后，秦王政将她迁居雍地，多年后才在茅焦劝谏下恢复母子往来。她的一生与秦廷内争紧密相连，后世对其评价多围绕这段宫廷风波展开。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 52
      defense: 20
      agility: 20
  - key: hist_xianqin_0281
    name: 胡亥
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （前230年—前207年）秦二世，秦始皇幼子。他在赵高、李斯支持下即位，此后听任赵高排除异己，朝政日趋败坏。陈胜、吴广起兵后，各地反秦势力相继而起，他却很少过问政事。最终赵高发动政变，逼迫他在望夷宫自杀。胡亥在位仅三年，秦朝迅速走向崩溃，后世多把他视为继位失当、用人不明的典型。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 32
      intellect: 18
      defense: 26
      agility: 24
  - key: hist_xianqin_0253
    name: 张孟谈
    avatar: monkey/其他随机角色/文男213.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋末赵襄子谋士。智伯联合韩、魏围攻晋阳并引水灌城，赵氏形势危急。张孟谈趁夜出城，劝说韩、魏两家认清唇亡齿寒之势，转而与赵氏结盟。三家随后掘开堤坝反灌智伯军，赵襄子乘势出击，智氏由此覆灭。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 18
      agility: 16
  - key: hist_xianqin_0254
    name: 屠岸贾
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）春秋晋国大夫，其事迹主要见于《史记·赵世家》。相传晋景公时，他借赵氏内乱诬告赵氏谋反，率军诛杀赵氏族人，仅赵武被暗中保全。赵武成年后，在韩厥支持下恢复赵氏地位，并追究旧怨。后世据此演绎出“赵氏孤儿”的故事，屠岸贾也成了权臣构陷忠良的反面形象，其细节带有明显的文学加工。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 20
      defense: 24
      agility: 20
  - key: hist_xianqin_0257
    name: 姬夷皋
    avatar: monkey/其他随机角色/武047_男.png
    default_gender: male
    archetype: military
    flavor: （？—前607年）春秋晋灵公，名夷皋。他在位时荒于政事，据《左传》记载，他曾站在高台上用弹弓射人取乐，又因厨师烹熊掌不熟而将其杀死。执政赵盾多次进谏，他表面应付，暗中派人行刺，刺杀未成。后来赵盾出逃，族人赵穿在桃园起事，灵公被杀。其行事常被后世引为君主失德的教训。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 34
      intellect: 18
      defense: 26
      agility: 22
  - key: hist_xianqin_0258
    name: 姬周
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: （前586年—前558年）春秋晋悼公，名周，晋襄公曾孙。他十四岁即位，任用荀罃、韩厥、魏绛等贤臣，整顿内政，并采纳魏绛“和戎”之策，缓和与周边部族的关系。在位期间多次会合诸侯，使晋国重新振作，史称其有复霸之势。二十九岁病逝，因在位时间不长，许多举措未及充分展开。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 22
      defense: 24
      agility: 18
  - key: hist_xianqin_0263
    name: 嬴荡
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （前329年—前307年）战国秦武王，秦惠文王之子。他在位时派甘茂攻取韩国宜阳，打通秦国向中原扩张的通道，又曾前往周都洛阳观看九鼎。相传他与力士比赛举鼎，伤及胫骨，当夜去世。因无子，其弟嬴稷继位，即秦昭襄王。秦武王勇武好胜，短暂的在位成为秦国由守转攻过程中的一段插曲。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 14
      defense: 24
      agility: 18
  - key: hist_xianqin_0264
    name: 甘龙
    avatar: pig/文031.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）战国秦国大臣，秦孝公时的旧贵族代表。商鞅入秦提出变法后，甘龙在朝堂上以“圣人不易民而教，知者不变法而治”为据，主张遵循古法旧礼，反对骤改制度。秦孝公最终没有采纳他的意见，仍任用商鞅主持改革。甘龙因此成为变法争论中守旧一方的代表人物，其言论也保留了当时关于变法利弊的另一种思考。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 54
      defense: 22
      agility: 14
  - key: hist_xianqin_0273
    name: 成蟜
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （？—前239年）秦庄襄王之子，秦王政异母弟，封长安君。秦王政八年，他奉命率军攻赵，行至屯留时却举兵反叛，兵败后死于当地，部属军吏多受惩处。关于他反叛的原因和具体经过，史书记载简略，后世虽有种种推测，但都缺乏可靠佐证。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 14
      defense: 26
      agility: 22
