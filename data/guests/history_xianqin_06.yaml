  - key: hist_xianqin_0252
    name: 尹铎
    default_gender: male
    archetype: military
    flavor: （生卒年不详）尹铎是赵简子派驻晋阳的家臣。史传称他减轻赋税、体恤民力，使当地百姓愿意拥护赵氏；智伯水攻晋阳时，城中军民的守御成为赵氏反败为胜的重要条件。尹铎的故事把“平日施政”与“战时守城”联系起来，体现春秋卿族经营封邑的方式。
    growth_range:
