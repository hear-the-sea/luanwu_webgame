  - key: hist_xianqin_0256
    name: 赵穿
    default_gender: male
    archetype: military
    flavor: （生卒年不详）赵穿为赵氏族人，是晋灵公被杀一事的直接执行者。灵公屡次谋害赵盾后，赵穿在桃园刺杀国君，迎赵盾回朝并拥立晋成公。董狐据此书“赵盾弑其君”，使赵穿与赵盾的责任关系成为春秋史中的争议。此事既有弑君的伦理问题，也反映卿族与公室权力的紧张。
