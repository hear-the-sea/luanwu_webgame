    name: 颠颉
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （？—前632年）颠颉，春秋晋国大夫，晋文公重耳流亡时的随从之一。重耳出亡十九年，颠颉与狐偃、赵衰等相从，历狄、卫、齐、楚诸国。文公即位后，他因伐曹时违命焚僖负羁之宅，与魏犨同获罪，终被处死以肃军纪。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 38
      intellect: 14
      defense: 26
      agility: 22
  - key: hist_xianqin_0251
    name: 董安于
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （？—前496年）董安于，春秋晋国赵简子家臣，晋阳城的营建者之一。他主持修筑晋阳时，以荻蒿、楚条等编束为墙骨，宫室立柱或以炼铜为质，兼顾防御与储备。赵氏与范氏、中行氏交兵之际，智氏以安于为祸首，他自缢以息争端，赵氏得以暂安。晋阳后来成为赵氏根本之地，其经营之功不可没。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0252
    name: 尹铎
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）尹铎，春秋晋国赵简子家臣。赵简子命他治理晋阳，他先问所求是“茧丝”还是“保障”，得到“保障”之命后，便损减户数、宽减赋役，使民力得以休养。前455年智伯联合韩、魏围晋阳，引汾水灌城，城中悬釜而炊、易子而食，民仍无叛心。赵氏能凭晋阳反败为胜，与尹铎当年的宽政有关。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 38
      intellect: 18
      defense: 26
      agility: 18
  - key: hist_xianqin_0256
    name: 赵穿
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）赵穿，春秋晋国赵氏族人，赵盾的从弟。前615年秦晋河曲之战，他年少好勇，不听主帅调度，擅自出战，幸得臾骈相助才免于败亡。前607年，晋灵公屡次加害赵盾，赵盾出奔，赵穿于桃园袭杀灵公，迎赵盾复位，并参与拥立晋成公。太史董狐仍书“赵盾弑其君”，赵穿此举遂成《左传》中君臣与史笔争议的焦点。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 12
      defense: 26
      agility: 20
  - key: hist_xianqin_0260
    name: 孟贲
    avatar: pig/武010.png
    default_gender: male
    archetype: military
    flavor: （？—前307年）孟贲，战国秦国力士，以勇力闻名，与任鄙、乌获同得秦武王任用。《史记·秦本纪》作“孟说”，记秦武王好角力，与孟说比赛举鼎，武王折断膝骨，当夜去世。武王无子，其弟嬴稷继位为秦昭襄王，孟说一族因举鼎之事被诛。后世常以“贲育”并称，借孟贲之名形容勇猛之人。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 8
      defense: 26
      agility: 18
  - key: hist_xianqin_0261
    name: 任鄙
    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）任鄙，战国秦国力士，与乌获、孟贲同以勇力受到秦武王任用，官至大官。《史记·秦本纪》记秦武王好戏，力士皆得亲近，但未明言任鄙参与举鼎。武王死后，任鄙仍仕于秦，昭襄王时曾任汉中守，镇抚楚、蜀通道。其一生跨越武王、昭襄王两朝，是秦国以勇力起家的武人代表。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 46
      intellect: 10
      defense: 26
      agility: 18
  - key: hist_xianqin_0262
    name: 乌获
    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）乌获，战国秦国力士，与任鄙、孟贲同以勇力显名。《史记·秦本纪》载秦武王有力好戏，三人皆至大官；后世举鼎故事常把他与武王、孟贲并提，但各书记载互有出入。战国文献又以“乌获”为力大者的代称，《孟子》即以“举乌获之任”比拟人之能否用力。其具体事迹与结局已难确考。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 8
      defense: 26
      agility: 18
  - key: hist_xianqin_0265
    name: 杜挚
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）杜挚，战国秦国大夫，商鞅变法时守旧一方的代表。在孝公朝议变法时，他提出“利不百，不变法；功不十，不易器”，又主张“法古无过，循礼无邪”。商鞅则以“治世不一道，便国不法古”相驳，力主因时变法。孝公最终采纳商鞅之议，杜挚的言论借《商君书·更法》保存下来，成为守旧立场的样本。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 52
      defense: 22
      agility: 16
  - key: hist_xianqin_0266
    name: 景监
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）景监，战国秦国近臣，秦孝公的宠臣。商鞅初入秦时，正是通过景监求见孝公，才获得陈说政见的机会。据《史记·商君列传》，商鞅先后以帝道、王道、霸道进说，孝公听得昏昏欲睡，直到讲强国之术才倾心采纳。景监虽非变法主角，却承担了君主与游士之间的引荐之责，其身份也反映出秦廷近臣在用人上的作用。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 52
      defense: 20
      agility: 18
  - key: hist_xianqin_0267
    name: 嬴虔
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）嬴虔，战国秦国公子，又称公子虔，太子驷（后来的秦惠文王）之傅。商鞅推行变法时，太子触犯新法，商鞅以“法之不行，自上犯之”为由，刑其傅以立威，嬴虔因而受刑；后传其又触法被劓。孝公死后，太子驷即位，嬴虔一党告发商鞅谋反，商鞅终被处死。他与孝公的确切亲属关系，传世文献说法不一。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 16
      defense: 26
      agility: 18
  - key: hist_xianqin_0268
    name: 公孙贾
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）公孙贾，战国秦国宗室，曾任太子驷之师，与太子傅嬴虔共辅储君。商鞅变法之初，太子触犯法令，商鞅为树立法令威信，刑其傅嬴虔、黥其师公孙贾，二人因此与商鞅结怨。孝公死后，太子驷即位为秦惠文王，嬴虔等人告发商鞅谋反，商鞅终被处死。公孙贾在其中的具体作用，史书记载简略，受刑名目也有异说。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 52
      defense: 20
      agility: 18
  - key: hist_xianqin_0270
    name: 魏丑夫
    avatar: monkey_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）魏丑夫，战国秦国人物，秦宣太后晚年的宠臣。据《战国策·秦策二》，宣太后病重时下令：“为我葬，必以魏子为殉。”魏丑夫忧惧，请庸芮游说。庸芮先问太后死者是否有知，再以“若死者无知，何必以生者殉葬；若有知，先王积怒已久”相劝，太后称善而罢。此事属策士轶闻，魏丑夫的官职、家世均不见于史传。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 16
      defense: 24
      agility: 24
  - key: hist_xianqin_0295
    name: 罕虎
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （？—前529年）罕虎，字子皮，春秋郑国卿大夫，郑穆公曾孙，罕氏宗主。子展死后，他继掌郑国政务，察觉子产之才，遂让位于子产并倾力相助。子皮曾想任用年轻的尹何治邑，被子产以“学而后入政”劝止，他欣然接受。郑国在晋楚之间自立，与子皮让贤、子产执政的配合颇有关系。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0296
    name: 公孙黑
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: （？—前530年）公孙黑，字子晳，春秋郑国宗室，驷氏族人。前541年，他与公孙楚争聘大夫徐吾犯之妹，强行委禽，求婚不成便欲杀公孙楚夺妻，反被击伤；子产审理后放逐了公孙楚。前530年，公孙黑又谋划除去游氏以夺其位，因伤病未发，子产历数其专伐、争室、矫君位三罪，迫其自缢。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 14
      defense: 26
      agility: 20
  - key: hist_xianqin_0297
    name: 驷偃
    avatar: monkey/其他随机角色/文049_男.png
