heroes:
  purple:
  - key: hist_suitang_0200_huangchao
    name: 黄巢
    avatar: monkey/隋唐与五代/黄巢.png
    default_gender: male
    archetype: military
    flavor: （820年-884年）晚唐大起义领袖，出身盐贩背景并屡试不第，最终以武装反抗席卷山东、河南等地。其军队攻入长安并建立政权，虽短暂却对唐朝统治造成根本打击：财政体系崩坏、地方军阀坐大、社会秩序大幅破裂。黄巢并非单纯"诗人式叛军"，史载其军纪与屠戮亦极为残酷，反映乱世暴力的失控。其败亡后唐室虽存，国家已难回盛唐结构。谈黄巢，不能只看一场攻城，更要看到它揭开的社会裂缝与制度终局。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 36
      intellect: 22
      defense: 30
      agility: 12
  - key: hist_suitang_0207_guowei
    name: 郭威
    avatar: monkey/隋唐与五代/郭威.png
    default_gender: male
    archetype: military
    flavor: （904年-954年）后周开国皇帝，出身军旅，在五代频繁兵变的环境中凭威望与军功崛起。其入京即位并非单纯夺权，而是旧秩序崩坏后的强人整合：一方面安抚军心、稳定财政与吏治，另一方面为后周的改革打下可操作的基础。郭威用人务实，能容纳不同出身的将吏；又以收养柴荣为继承人，避免了五代常见的宗室内耗。后周能成为五代中"最像国家"的政权之一，郭威的开局与取舍是关键原因。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 36
      intellect: 24
      defense: 32
      agility: 8
  - key: hist_suitang_0208_shijingruo
    name: 石敬瑭
    avatar: monkey/隋唐与五代/石敬瑭.png
    default_gender: male
    archetype: military
    flavor: （892年-942年）后晋开国皇帝，五代外交与战略困境的代表人物。其起兵夺位时倚重契丹军力，作为交换割让幽云十六州，并以屈辱性的臣属关系换取短期安全。后世称其"儿皇帝"，更多是对这一选择的道德评判；从现实角度看，他是在内斗与外压夹击下用空间换时间。问题在于：失去燕云后中原北门洞开，宋辽长期对峙的格局由此加深。石敬瑭的名字因此常被用来讨论：乱世求存的妥协，究竟能否承受后果。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 34
      intellect: 22
      defense: 30
      agility: 14
  - key: hist_suitang_0190_yangyuhuan
    name: 杨玉环
    avatar: monkey/隋唐与五代/杨玉环.png
    default_gender: female
    archetype: civil
    flavor: （719年-756年）唐玄宗贵妃，真实历史身份是宫廷政治的一部分，后世却常被简化为"祸水"符号。她得宠于天宝时期，宫廷奢华与外戚扩张因之更受瞩目，但唐帝国走向危机的根源并不在一位女子。安史之乱后，军心与朝局需要替罪者，马嵬驿赐死使她成为盛唐崩塌的象征。杨玉环的悲剧在于：她无法决定国家大势，却要承担大势崩坏的道德指责；留在诗歌与传说中的她，既是爱情叙事，也是政治责任转移的产物。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 10
      intellect: 46
      defense: 24
      agility: 20
  blue:
  - key: hist_suitang_0181_mazhou
    name: 马周
    avatar: pig/文050.png
    default_gender: male
    archetype: civil
    flavor: （601年—648年）唐代大臣，字宾王，博州茌平人，少孤贫而好学。贞观三年（一说五年）代中郎将常何上疏论时政，得太宗赏识，授监察御史，官至中书令。他屡次谏止劳役、主张慎选刺史县令。贞观二十二年病逝，太宗为之举哀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 26
      agility: 12
  - key: hist_suitang_0182_chusuliang
    name: 褚遂良
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: （596年—658年）唐代大臣、书法家，字登善，钱塘人。历仕太宗、高宗，官至尚书右仆射，受太宗遗诏辅政，封河南郡公。高宗欲立武昭仪为皇后，他当廷谏阻，因此屡遭贬谪，最终卒于爱州。其楷书瘦劲秀逸，《雁塔圣教序》为代表作，与欧阳询、虞世南并称初唐名家。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 26
      agility: 12
  - key: hist_suitang_0183_yushinan
    name: 虞世南
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （558年—638年）唐代大臣、书法家，字伯施，越州余姚人。早年在隋为官，入唐后任秦王府记室，官至秘书监，封永兴县子。唐太宗称其德行、忠直、博学、文辞、书翰五绝俱备。他编有类书《北堂书钞》，书法承王羲之遗风，《孔子庙堂碑》为代表作。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 50
      defense: 26
      agility: 12
  - key: hist_suitang_0184_ouyangxun
    name: 欧阳询
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （557年—641年）唐代书法家、官员，字信本，潭州临湘人。隋时任太常博士，入唐后官至太子率更令、弘文馆学士，封渤海县男。其楷书法度严整，世称“欧体”，《九成宫醴泉铭》《化度寺碑》为代表作。他还奉诏参与编纂类书《艺文类聚》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 50
      defense: 24
      agility: 14
  - key: hist_suitang_0186_shangguanwaner
    name: 上官婉儿
    avatar: monkey/其他随机角色/文084_女.png
    default_gender: female
    archetype: civil
    flavor: （664年—710年）唐代女官、诗人，陕州陕县人，祖父上官仪获罪后随母没入掖庭。她因文才受武则天赏识，长期掌管诏令制诰；唐中宗时封昭容，仍执掌文诰，并主持品评群臣诗作。景龙四年唐隆政变中，她被李隆基所杀，所作诗文大多散佚。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 50
      defense: 24
      agility: 14
  - key: hist_suitang_0188_lilifu
    name: 李林甫
    avatar: duck_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （683年—753年）唐代宰相，唐宗室出身，小字哥奴。玄宗开元末至天宝年间长期掌权，官至礼部尚书、同中书门下三品，前后为相近十九年。他排挤张九龄等政敌，又建议多用胡人担任边将，被认为助长了安禄山的势力。天宝十一载病死后，遭杨国忠构陷，被追削官爵。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 28
      agility: 10
  - key: hist_suitang_0191_gaolishi
    name: 高力士
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （684年—762年）唐代宦官，本名冯元一，潘州人。早年入宫，因侍奉谨慎得唐玄宗信任，官至骠骑大将军、开府仪同三司，封齐国公。安史之乱中随玄宗入蜀，后遭李辅国排挤，流放巫州。宝应元年遇赦东归，途中得知玄宗去世，不久病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 18
      intellect: 44
      defense: 28
      agility: 10
  - key: hist_suitang_0185_yanliben
    name: 阎立本
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （约601年—673年）唐代画家、官员，雍州万年人，父阎毗、兄阎立德都以绘画和营造闻名。他历任将作大匠、工部尚书，官至中书令。阎立本擅长人物画，笔下形象形神兼备，传世《步辇图》《历代帝王图》均题其名，画风工整，为初唐人物画的代表。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 48
      defense: 26
      agility: 14
  - key: hist_suitang_0187_zhangjianzhi
    name: 张柬之
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （625年—706年）唐代大臣，字孟将，襄州襄阳人，进士出身。武则天晚年由狄仁杰举荐入相。神龙元年，他与敬晖、桓彦范等发动政变，迫使武则天退位，拥立唐中宗复位，因功封汉阳郡王。后遭武三思排挤，流放泷州，卒于贬所。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 26
      agility: 12
  - key: hist_suitang_0192_geshuhan
    name: 哥舒翰
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: （？—757年）唐代将领，突骑施人，以勇武闻名，长期镇守河西、陇右，官至河西、陇右节度使，封西平郡王。天宝八载，他率军攻取吐蕃据守的石堡城，但部众伤亡惨重。安史之乱中奉命守潼关，被迫出战后兵败被俘，同年被叛军杀害。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 20
      defense: 32
      agility: 12
  - key: hist_suitang_0195_libi
    name: 李泌
    avatar: monkey/其他随机角色/文男213.png
    default_gender: male
    archetype: civil
    flavor: （722年—789年）唐代大臣、谋士，字长源，京兆人。历仕玄宗、肃宗、代宗、德宗四朝，安史之乱中为唐肃宗筹划军政，多有建策，官至中书侍郎、同平章事，封邺县侯。他好谈神仙道术，屡次归隐又应召出仕，贞元五年病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 50
      defense: 26
      agility: 10
  - key: hist_suitang_0196lishu
    name: 李愬
    avatar: monkey/其他随机角色/武044_男_.png
    default_gender: male
    archetype: military
    flavor: （773年—821年）唐代将领，字元直，名将李晟之子，曾任唐邓节度使，用兵善出奇制胜。元和十二年，他趁雪夜率军奔袭蔡州，一举擒获淮西节度使吴元济，平定淮西之乱，因功封凉国公。此后改任魏博节度使，长庆元年卒于任所。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 24
      defense: 32
      agility: 8
  - key: hist_suitang_0197_liuyan
    name: 刘晏
    avatar: pig/文035.png
    default_gender: male
    archetype: civil
    flavor: （716年—780年）唐代大臣、理财家，字士安，曹州南华人。唐肃宗、代宗时前后掌财计二十余年，主持度支、盐铁与转运事务，改革盐法、疏浚汴水，使江淮粮米得以稳定运往关中。德宗初年遭杨炎构陷，贬为忠州刺史，随后被赐死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 50
      defense: 26
      agility: 10
  - key: hist_suitang_0198_yangyan
    name: 杨炎
    avatar: pig/文048.png
    default_gender: male
    archetype: civil
    flavor: （727年—781年）唐代宰相，字公南，凤翔天兴人。建中元年，他主持推行两税法，按户等与资产征收夏、秋两税，改变了租庸调以人丁为本的旧制，税目趋于简化，影响后世赋役制度。后与卢杞交恶，被贬为崖州司马，途中被赐死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 26
      agility: 12
  - key: hist_suitang_0199_luzhi
    name: 陆贽
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （754年—805年）唐代大臣、文学家，字敬舆，苏州嘉兴人。进士出身，德宗时任翰林学士，官至中书侍郎、同平章事，参与机要。泾原兵变中随德宗赴奉天，起草诏书并陈奏安抚、用兵之策。后为裴延龄构陷，贬忠州别驾，卒于贬所，谥号宣。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 50
      defense: 26
      agility: 10
  - key: hist_suitang_0204_yixing
    name: 一行
    avatar: pig/武066.png
    default_gender: male
    archetype: civil
    flavor: （683年—727年）唐代高僧、天文学家，本名张遂，魏州昌乐人。唐玄宗时，他主持编制《大衍历》，并与梁令瓒等制造浑天仪。开元十二年，他组织全国天文观测，命人在各地测量日影与北极高度，为计算子午线弧长提供了数据。开元十五年圆寂于长安。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 52
      defense: 24
      agility: 14
  - key: hist_suitang_0205_yijing
    name: 义净
    avatar: pig/武072.png
    default_gender: male
    archetype: civil
    flavor: （635年—713年）唐代高僧、译经家，俗姓张，齐州人。咸亨二年，他由海路前往天竺求法，在那烂陀寺研习律学多年，并游历南海诸国。证圣元年归国后主持译经，著有《南海寄归内法传》《大唐西域求法高僧传》，记述南海与天竺见闻。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 52
      defense: 24
      agility: 14
  - key: hist_suitang_0211_libian
    name: 李昪
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: （889年—943年）南唐开国君主，字正伦，徐州人，原名徐知诰，为吴国权臣徐温养子。徐温死后，他逐步掌握吴国朝政，于937年受禅称帝，初国号齐，后改称唐，定都金陵。在位期间轻徭薄赋、兴办学校，昇元七年病逝，庙号烈祖。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 18
      intellect: 46
      defense: 28
      agility: 8
  - key: hist_suitang_0232_laijunchen
    name: 来俊臣
    avatar: pig/文031.png
    default_gender: male
    archetype: civil
    flavor: （651年—697年）武周酷吏，雍州万年人，因告密得武则天任用，官至左台御史中丞。他主持多起诏狱，与党羽编撰《罗织经》，罗织罪名、株连无辜，又广布耳目监视官员，朝臣多畏之。后因罪下狱，万岁通天二年被处死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 50
      defense: 24
      agility: 12
  - key: hist_suitang_0189_yangguozhong
    name: 杨国忠
    avatar: duck_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （？—756年）唐玄宗末年宰相，本名杨钊，蒲州永乐人，杨贵妃堂兄。他因善于理财得到宠信，天宝十一载继李林甫为相，身兼度支、盐铁等数十职，权倾一时。任相后与安禄山争权，安史之乱爆发后随玄宗西逃，在马嵬驿被哗变军士所杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 44
      defense: 26
      agility: 14
  - key: hist_suitang_0203_yuantian
    name: 袁天罡
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）隋唐之际相士，益州成都人，正史称其曾任火井令，以相术闻名。相传他为幼年的武则天看相，预言其贵不可言；后世又把他与李淳风并称，并附会《推背图》等预言故事。《旧唐书》将他列入方伎传，其生卒与详细官历已难确考。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 46
      defense: 26
      agility: 16
  - key: hist_suitang_0206_wangxuance
    name: 王玄策
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）唐代使臣，籍贯不详。贞观年间多次出使天竺，其中一次恰逢中天竺内乱，使团遭阿罗那顺袭击。他脱身后向吐蕃、泥婆罗借兵，击败阿罗那顺并将其俘送长安，因功授朝散大夫。此后官历记载简略，晚年事迹不详。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 34
      intellect: 26
      defense: 28
      agility: 12
  - key: hist_suitang_0212_lijing
    name: 李璟
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: （916年—961年）南唐中主，字伯玉，李昪长子，943年即位。他擅长填词，作品风格婉约，与后主李煜并称“南唐二主”。后周世宗南征时，南唐战败，他割让江北十四州，去帝号改称国主，并迁都南昌，建隆二年卒于当地。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 26
      agility: 12
  - key: hist_suitang_0213_hanxizai
    name: 韩熙载
    avatar: monkey/其他随机角色/文052_男.png
