    archetype: military
    flavor: （前120年—前49年）西汉和亲公主，细君公主去世后，她续嫁乌孙，先后经历多位昆莫。解忧公主在乌孙生活多年，曾派冯辽持节往来汉廷与西域，并把自己的子女送往长安；晚年归汉，受到朝廷礼遇。
