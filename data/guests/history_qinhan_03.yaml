    archetype: civil
    flavor: （前130年—前51年）西汉官员，以治理郡县、安抚百姓著称。黄霸任颍川太守时，重视教化，整顿属吏，劝民务农，盗贼因而减少；他后来升任丞相，仍以宽厚慎刑闻名。
