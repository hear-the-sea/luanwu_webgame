    default_gender: female
    archetype: civil
    flavor: （生年不详—前135年）西汉窦太后，文帝皇后、景帝之母。窦漪房早年入宫，先侍奉吕后，后来成为代王刘恒的王后；刘恒即位后，她被立为皇后。她喜好黄老之学，常劝文帝、景帝节俭宽刑，武帝即位初年仍参与朝政。
