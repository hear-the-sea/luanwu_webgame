    default_gender: male
    archetype: civil
    flavor: （生年不详—38年）东汉官员，曾任南阳太守。杜诗任职时推广水力鼓风机“水排”，用于冶铁；他还兴修水利、平反冤狱、整顿吏治，百姓将他与召信臣并称为“杜母”。
