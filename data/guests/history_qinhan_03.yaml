    name: 郦食其
    default_gender: male
    archetype: civil
    flavor: （前268年—前203年）楚汉之际说客，人称“高阳酒徒”。郦食其投奔刘邦后，曾劝降陈留、筹集粮草；后来他奉命游说齐王田广归汉，韩信却同时出兵攻齐，郦食其被齐王烹杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0123
    name: 陆贾
    default_gender: male
    archetype: civil
    flavor: （约前240年—前170年）西汉谋士、说客。陆贾曾两次出使南越，劝赵佗接受汉朝册封；他还向刘邦进言“马上得之，安可马上治之”，并著《新语》十二篇。惠帝、吕后时期，他又出使南越，促成赵佗重新归附。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
