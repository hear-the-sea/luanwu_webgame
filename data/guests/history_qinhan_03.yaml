    name: 晁错
    default_gender: male
    archetype: civil
    flavor: （前200年—前154年）西汉政务官员，主张削弱诸侯王权。晁错任御史大夫时，多次上书建议削藩；七国之乱爆发后，汉景帝为安抚诸侯，采纳袁盎等人的建议处死晁错。晁错死后，叛乱仍由周亚夫率军平定。
