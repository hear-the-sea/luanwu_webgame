heroes:
  blue:
  - key: hist_qinhan_0100
    name: 丙吉
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前55年）西汉名臣，封博阳侯，官至丞相。巫蛊之祸时，他任廷尉监，在郡邸狱中设法保全襁褓中的皇曾孙刘询；刘询即位为宣帝后，他从不自陈旧恩。任丞相时以识大体著称，路见牛喘而问节气，后人称“丙吉问牛”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0101
    name: 东方朔
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （前154年—前93年）西汉辞赋家、宫廷侍臣，平原厌次人。汉武帝即位初年，他上书自荐，以诙谐机辩得召见；常借宴饮谈笑进谏，曾谏止扩建上林苑，并作《答客难》抒写士人处境。他长期任太中大夫，未居要职，后世将其列入《史记·滑稽列传》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0102
    name: 于定国
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前40年）西汉丞相，字曼倩，东海郯人，其父于公也以断狱著称。于定国少从父学律，任廷尉时主张罪疑从轻、审理审慎，时人称“民自以不冤”；后升任丞相，封西平侯，前后居官数十年，以宽平持法闻名于世。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0103
    name: 京房
    avatar: monkey/其他随机角色/文039_男.png
    default_gender: male
    archetype: civil
    flavor: （前77年—前37年）西汉易学家，东郡顿丘人，本姓李，字君明。他师从焦延寿研习《易》与灾异之说，后世纳甲筮法常托其名；曾任郎官，屡以灾异上书指陈时政，触怒中书令石显等人，被劾下狱而死。其易学经弟子传承，对后世象数之学影响颇大。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0104
    name: 卓文君
    avatar: monkey_wen_female5.png
    default_gender: female
    archetype: civil
    flavor: （生卒年不详）西汉临邛富商卓王孙之女，通音律。她新寡后与司马相如相识，相携私奔成都，因家贫又回临邛当垆卖酒；卓王孙起初恼怒，后分给二人财物，使他们得以安家。后世相传《凤求凰》《白头吟》与其婚事有关，事迹多见于《史记·司马相如列传》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0105
    name: 卫子夫
    avatar: monkey_wen_female9.png
    default_gender: female
    archetype: civil
    flavor: （生年不详—前91年）西汉皇后，平阳人，原为平阳公主府歌女。汉武帝祓禊归来路过公主府时看中她，入宫后生下太子刘据，元朔元年被立为皇后；其弟卫青、外甥霍去病皆以军功显贵。巫蛊之祸中太子起兵失败，她交出玺绶后自尽，卫氏由此衰落。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0106
    name: 召信臣
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉循吏，字翁卿，九江寿春人。任南阳太守时，他开通沟渠，修建水门数十处，扩大灌溉面积，又限制婚丧铺张、劝民节俭务农，郡中户口与垦田增多。吏民感念其政绩，称他为“召父”，后世常与杜诗并称。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0107
    name: 司马相如
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （约前179年—前118年）西汉辞赋家，著有《子虚赋》《上林赋》。司马相如早年客游梁地，后来与卓文君相识并结为夫妻；汉武帝读到他的文章后召入朝廷，曾派他出使西南夷。晚年他因病辞官，仍以辞赋和文章闻名。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0108
    name: 尉缭
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）战国末至秦代军政人物，大梁人。相传他入秦游说秦王政，建议以重金离间六国权臣，被任为国尉，因而称“尉缭”；后认为秦王为人刻薄，一度离去，又被挽留。兵书《尉缭子》旧题其所作，但作者与成书年代仍有争议。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0109
    name: 文翁
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉循吏，庐江舒人。景帝末任蜀郡太守，见蜀地僻陋，便选派子弟赴长安从博士受业，又在成都修起学官，招收郡县子弟入学，免除其徭役。蜀地学风由此兴盛，入仕者渐多，史称“文翁化蜀”，郡国兴学也多仿其制。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0111
    name: 杜诗
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—38年）东汉官员，字君公，河内汲人。任南阳太守时，他创制水力鼓风设备“水排”用于冶铁铸造农具，又修治陂池、开垦田地，使郡内百姓获利；因政绩与西汉循吏召信臣相近，南阳人称“前有召父，后有杜母”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0112
    name: 淳于意
    avatar: pig/文040.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉名医，临淄人，曾任齐太仓长，世称仓公。他师从公乘阳庆学习医经，诊病重视脉象与病因，并将病例记录下来，后世称为“诊籍”；后因故获罪当刑，幼女缇萦上书愿代父受罚，汉文帝因此下诏废除肉刑。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0113
    name: 甘英
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）东汉使者。永元九年，西域都护班超派他出使大秦（罗马），他西行至条支，抵临波斯湾一带，本欲渡海继续前行，因船人盛言航路艰险、渡海须备三年粮而折返。此行是汉使西行所至最远处，事见《后汉书·西域传》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0114
    name: 窦漪房
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （生年不详—前135年）西汉皇后、太后，清河观津人。她早年以良家子入宫侍奉吕后，后被赐给代王刘恒，生景帝刘启；刘恒即位后立为皇后。她尊崇黄老之学，主张清静节俭，景帝时以太后身份影响朝政，武帝初年曾抑制儒生推行新政。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0116
    name: 许平君
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （前90年—前71年）西汉宣帝皇后，昌邑人，父许广汉。刘询流落民间时，由掖庭令张贺作合与她成婚，生子刘奭；刘询即位后不肯另立权臣之女，坚持立她为皇后，留下“故剑情深”的典故。后她被霍显指使人毒害，谥恭哀皇后。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0119
    name: 赵合德
    avatar: monkey/其他随机角色/文064_女.png
    default_gender: female
    archetype: civil
    flavor: （生年不详—前7年）汉成帝昭仪，赵飞燕之妹。她入宫后与姐姐同受宠幸，居昭阳舍，赏赐丰厚；绥和二年成帝暴崩于她的宫中，皇太后命王莽等查问，她不堪受审而自杀。后世多将成帝之死与赵氏姐妹联系起来，但具体情形史书记载含混。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0120
    name: 赵飞燕
    avatar: monkey_wen_female9.png
    default_gender: female
    archetype: civil
    flavor: （前45年—前1年）西汉成帝皇后，出身阳阿公主家歌舞者，以体态轻盈、善舞著称。她入宫后受宠，永始元年被立为皇后，妹妹赵合德也封昭仪；哀帝即位后尊她为皇太后。哀帝死后，王莽执政，将她贬为孝成皇后，再废为庶人，她随即自杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0125
    name: 魏相
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前59年）西汉丞相，字弱翁，济阴定陶人。他历任茂陵令、河南太守，以刚正严毅闻名；宣帝时入朝任御史大夫，建议废除尚书副封旧例，使霍氏不能壅蔽章奏，后升丞相，封高平侯。元康年间匈奴未犯边，他上书劝阻兴兵，与丙吉同心辅政。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0126
    name: 黄霸
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （前130年—前51年）西汉官员，字次公，淮阳阳夏人。任颍川太守时，他劝民务农桑、节用殖财，又整顿吏治、宽缓刑罚，郡中户口渐增，治绩被称为天下第一；后升任丞相，封建成侯，以宽厚持重著称，但处理朝政不如治郡得心应手。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0127
    name: 傅介子
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前65年）西汉使者，北地义渠人。楼兰王曾依附匈奴、截杀汉使，傅介子奉命出使，携金帛至楼兰，在宴席间指使随从将其杀死，另立尉屠耆为王，改国名为鄯善。他因功封义阳侯，此行也成为汉代经营西域的著名事件。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0129
    name: 冯嫽
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: 冯嫽（生卒年不详），西汉女官，随解忧公主远嫁乌孙，嫁乌孙右大将为妻，人称“冯夫人”。她通晓史书、善于辞令，曾持汉节代表公主出使西域诸国，调解乌孙内部纷争；宣帝时乌孙内乱，她又奉命出使，安定其国，晚年归汉仍受礼遇。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 54
      defense: 18
      agility: 20
  - key: hist_qinhan_0134
    name: 季布
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）楚地游侠，项羽部将，以重然诺闻名，楚人有“得黄金百斤，不如得季布一诺”之语。项羽败亡后，刘邦悬赏缉拿，他经朱家营救、夏侯婴进言而获赦，入汉任郎中，后为河东太守。吕后时匈奴致书无礼，他力阻樊哙贸然出兵。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0136
    name: 崔寔
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—170年）东汉学者、官员，字子真，涿郡安平人。他著有《四民月令》，按月记述农事、纺织、祭祀与家庭收支，记录了汉代庄园的生产与日常安排；又作《政论》评议时政。曾任五原太守，教民纺织，后因党锢之祸免官归家，仍从事著述。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 52
      defense: 20
      agility: 18
  - key: hist_qinhan_0137
    name: 张纲
    avatar: pig/武049.png
    default_gender: male
    archetype: military
    flavor: （108年—143年）东汉官员，字文纪，犍为武阳人，张良之后。顺帝时选八使巡行州郡，他埋车轮于洛阳都亭，称“豺狼当路，安问狐狸”，上书弹劾大将军梁冀。后任广陵太守，单车入张婴营中劝降，流民归附；在职一年余病逝，百姓为之立祠。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0147
    name: 解忧公主
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （前120年—前49年）西汉和亲公主，楚王刘戊之孙。细君公主去世后，她奉命续嫁乌孙昆莫，先后按乌孙习俗改嫁军须靡、翁归靡、泥靡，生有元贵靡等子女。她在乌孙数十年，协助汉廷联络西域诸国；甘露年间以年老归汉，两年后去世。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 52
      defense: 18
      agility: 22
  - key: hist_qinhan_0148
    name: 赵破奴
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前91年）西汉将领，早年流落匈奴，后归汉从军。元封三年，他率军攻破楼兰、车师，因功封浞野侯；太初二年率骑兵出击匈奴，兵败被俘，在匈奴滞留多年后与长子逃归。征和年间受巫蛊之祸牵连，全家遇害。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0142
    name: 班勇
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: （生年不详—卒于127年以后）东汉将领，班超之子。安帝时出任西域长史，率五百人出屯柳中，联合龟兹等国击破匈奴呼衍王，重新控制车师，使汉朝在西域的声威复振；他根据见闻记述西域诸国情况。后因与敦煌太守会师失期，被征还下狱，免官归家。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 48
      intellect: 14
      defense: 26
      agility: 12
  - key: hist_qinhan_0115
    name: 袁安
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—92年）东汉名臣，字邵公，汝南汝阳人，汝南袁氏显祖。他历任楚郡太守、河南尹，以清正严明著称；和帝时窦宪兄弟专权，他屡次上书反对窦宪远征匈奴、以爵位私授子弟，不避权贵。后官至司徒，与任隗同心持正，为时人所重。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0122
    name: 郦食其
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （前268年—前203年）楚汉之际说客，陈留高阳人，人称“高阳酒徒”。他投奔刘邦后，劝其袭取陈留、夺取粮仓，又常为汉军游说诸侯；后奉命劝降齐王田广，事在汉四年；齐王已答应归汉，韩信却发兵攻齐，田广怒而将其杀害。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0123
    name: 陆贾
    avatar: monkey/其他随机角色/文041_男.png
    default_gender: male
    archetype: civil
    flavor: （约前240年—前170年）西汉谋士、说客，楚人。他随刘邦定天下，常出使诸侯，曾两次奉命前往南越，说服赵佗接受汉朝册封；又向刘邦进言“马上得之，宁可以马上治之”，并著《新语》十二篇。吕后死后，他参与陈平、周勃诛除诸吕的谋划。
