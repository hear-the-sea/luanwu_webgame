    default_gender: male
    archetype: military
    flavor: （生年不详—35年）东汉将领、使者。来歙奉刘秀之命出使陇右，后来奇袭略阳、斩杀隗嚣守将；征讨公孙述时，他在军中被刺客刺伤，仍坚持写完奏章、安排后事，最终伤重而死。
    growth_range:
