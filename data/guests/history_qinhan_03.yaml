    archetype: military
    flavor: （生年不详—卒于127年以后）东汉将领，班超之子。班勇任西域长史时，率五百人击破匈奴呼衍王，平定车师，重新恢复汉朝在西域的据点；他还撰写《西域记》，后来因行期等事受责下狱。
