    default_gender: male
    archetype: civil
    flavor: （生于前205年，卒年不详）西汉名医，号仓公，缇萦之父。淳于意行医时记录病人的脉象、病因、用药和转归，留下多份医案；后来他因事获罪将受刑，女儿缇萦上书请求代父受刑，汉文帝因此下诏改革肉刑。
