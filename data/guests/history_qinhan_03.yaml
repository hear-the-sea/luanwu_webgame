    name: 丙吉
    default_gender: male
    archetype: civil
    flavor: （生年不详—前55年）西汉名臣，曾任廷尉、丞相。巫蛊之祸时，丙吉在郡邸狱中保护尚在襁褓中的皇曾孙刘询；刘询即位后，他直到宫女上书才说明此事。任丞相时，丙吉又因“问牛”典故闻名。
