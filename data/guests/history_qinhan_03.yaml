    name: 尉缭
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）秦代军政人物，姓名与兵书《尉缭子》相连。传说他受秦王政召见，曾向秦王分析六国强弱和用兵办法；《尉缭子》还记载了军队训练、赏罚和行军等内容。关于他在秦廷任职的细节，史料记载不一。
    growth_range:
    - 5
