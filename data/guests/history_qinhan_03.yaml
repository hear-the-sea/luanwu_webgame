    default_gender: male
    archetype: civil
    flavor: （生年不详—92年）东汉名臣，汝南袁氏先祖。袁安任河南尹时，以清正严明著称；窦宪掌权后，他曾上书劝谏，反对窦氏兄弟继续掌兵。袁安后来任司徒，在朝中保持谨慎刚直的作风。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
