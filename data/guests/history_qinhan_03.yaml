  - key: hist_qinhan_0102
    name: 于定国
    default_gender: male
    archetype: civil
    flavor: （生年不详—前40年）西汉丞相，字曼倩，父亲于公也是以断狱闻名的官员。于定国任廷尉时重视证据，主张疑案从轻、审理从慎，史载百姓称“民自以不冤”。他后来升任丞相，仍以宽平断狱著称。
    growth_range:
