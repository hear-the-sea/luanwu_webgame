      agility: 16
  - key: hist_qinhan_0104
    name: 卓文君
    default_gender: female
    archetype: civil
    flavor: （生卒年不详）西汉临邛富家之女。卓文君与司马相如相识后离家相随，曾在临邛开酒店、当垆卖酒；父亲卓王孙后来接济二人，使他们得以返回成都。她与司马相如的婚事，留下“凤求凰”“白头吟”等传说。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0105
    name: 卫子夫
    default_gender: female
    archetype: civil
    flavor: （生年不详—前91年）西汉皇后，原为平阳公主府歌伎。卫子夫入宫后得到汉武帝宠幸，生下太子刘据，后来被立为皇后；她的弟弟卫青、外甥霍去病也因军功显贵。巫蛊之祸爆发后，卫子夫被迫自尽，卫氏家族随之失势。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0106
    name: 召信臣
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉循吏，字翁卿，九江人。任南阳太守时，召信臣兴修水利，建造水排、水门，开垦良田数万顷；他还禁止婚丧嫁娶铺张，提倡节俭。百姓感念其政绩，尊称他为“召父”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0107
    name: 司马相如
    default_gender: male
    archetype: civil
    flavor: （约前179年—前118年）西汉辞赋家，著有《子虚赋》《上林赋》。司马相如早年客游梁地，后来与卓文君相识并结为夫妻；汉武帝读到他的文章后召入朝廷，曾派他出使西南夷。晚年他因病辞官，仍以辞赋和文章闻名。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 22
      agility: 16
