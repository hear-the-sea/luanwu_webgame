    name: 文翁
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉循吏，庐江人。任蜀郡守时，文翁在成都兴办学校，招收地方子弟，又选拔优秀学生送往长安学习。蜀郡后来有许多学子入仕，文翁也因此被称为“文翁化蜀”。
