    archetype: military
    flavor: （生年不详—前91年）西汉将领，早年曾在匈奴，后来归汉从军。赵破奴随霍去病出征，攻破楼兰、车师等地，因军功封侯；后来在对匈奴作战中兵败被俘，获释归汉后又卷入巫蛊之祸，最终被诛。
