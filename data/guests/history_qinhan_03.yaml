  - key: hist_qinhan_0103
    name: 京房
    default_gender: male
    archetype: civil
    flavor: （前77年—前37年）西汉易学家，研习《易经》、阴阳五行和音律，纳甲筮法常与其名相连。京房曾以灾异上书批评权臣石显，因而遭到石显排挤，最终被下狱处死。
    growth_range:
    - 5
