    default_gender: male
    archetype: civil
    flavor: （生卒年不详）东汉使者，受班超派遣出使西域。甘英一路西行，抵达条支附近的海边，原想继续前往大秦，却因听说海上航行危险而返回。他将沿途见闻带回西域都护府，后来被记入西域史料。
