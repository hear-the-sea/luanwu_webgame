    archetype: civil
    flavor: （前45年—前1年）西汉成帝宠妃，后被立为皇后，以善舞和身姿轻盈著称。赵飞燕入宫后长期受宠，妹妹赵合德也随之得幸；成帝死后，她被贬为孝成皇后，哀帝即位后又被废，最终自杀。
