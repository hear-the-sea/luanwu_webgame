    flavor: （生年不详—170年）东汉学者、官员，著有《四民月令》。该书按月份记录农事、家政、祭祀和生产安排，内容来自崔寔对庄园生活的观察。崔寔曾任郡守、边郡长史，晚年因党锢之祸被禁锢，仍坚持著述。
