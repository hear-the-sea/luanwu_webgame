      intellect: 46
      defense: 22
      agility: 16
  - key: hist_qinhan_0101
    name: 东方朔
    default_gender: male
    archetype: civil
    flavor: （前154年—前93年）西汉文学家、宫廷侍臣，汉武帝时以诙谐机智闻名。东方朔常在宴饮和应对中借笑语进谏，也曾上书陈述民间疾苦；他多次得到汉武帝召见，却始终未获重用，晚年失意而终。
    growth_range:
