    flavor: （108年—143年）东汉官员，张良后裔。任御史时，张纲因不愿向梁冀行贿，将车轮埋在洛阳都亭并上书弹劾梁冀；后来任广陵太守，他只带一辆车进入张婴营中，以劝说促成叛军归降。张纲英年早逝，百姓为他立祠。
