    flavor: （生年不详—前7年）汉成帝昭仪，赵飞燕之妹。赵合德入宫后与姐姐一同受宠，长期陪伴成帝；史载成帝死于她宫中，宫人因此指责她与皇帝服食药物有关。成帝死后，赵合德自杀。
