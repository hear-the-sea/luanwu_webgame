    archetype: civil
    flavor: （前90年—前71年）西汉宣帝皇后。刘病已流落民间时，许平君与他结为夫妻并生下刘奭；刘病已即位后，仍将她立为皇后。许平君后来被霍显派人毒杀，年仅二十余岁，谥为恭哀皇后。
