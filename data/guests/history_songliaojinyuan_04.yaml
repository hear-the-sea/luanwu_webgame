    default_gender: male
    archetype: civil
    flavor: 郭熙（约1020年-约1090年），北宋画家，河阳温县人。神宗熙宁间为御画院艺学，师法李成，善画山水寒林。著《林泉高致》，提出三远说，为山水画论经典。传世作品有《早春图》《窠石平远图》等。
