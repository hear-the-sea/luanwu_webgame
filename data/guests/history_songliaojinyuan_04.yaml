    default_gender: male
    archetype: civil
    flavor: （1041年-1103年）北宋词人、政治家。他因“乌台诗案”弹劾苏轼而闻名，但词作亦有可观。与其政治名声相比，舒亶词中对景物与情绪的处理更显复杂，这种反差也让他成为宋代文人多面性的典型案例。这也让舒亶成为研究“政治身份与文学表达”关系的常见样本。
