    default_gender: male
    archetype: civil
    flavor: 李公麟（1049—1106），舒州人，熙宁进士。善白描人物，运笔如行云流水，不施丹青而神采焕然。尝绘《五马图》《临韦偃牧放图》，鞍马人物尤精绝，后世推为宋人白描第一。
