  - key: hist_songliaojinyuan_0164
    name: 李廌
    default_gender: male
    archetype: civil
    flavor: （1059年-1109年）北宋诗人，苏门六君子之一。他是苏轼的得意门生，诗文俱佳。李廌并非脱离现实处境而写作，其文本与生平阶段之间始终保持紧密关联。从接受史角度看，李廌的影响并非线性扩散，而是经由多轮筛选与重构后持续显现。
    growth_range:
    - 3
