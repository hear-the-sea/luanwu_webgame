    default_gender: male
    archetype: civil
    flavor: （1035年-1100年）北宋词人。"若到江南赶上春，千万和春住"——他的词清新明快。其事迹在地方志与文人笔记中屡有记载，作品也常被后世整理评点，流传甚广。从王观的经历来看，文体取向、思想选择与社会处境始终彼此牵动，这也构成了其在同代人物中的独特轮廓。
