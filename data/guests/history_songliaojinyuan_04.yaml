    default_gender: male
    archetype: military
    flavor: 李继隆（950—1005），字霸图，上党人。北宋初年名将，太宗明德皇后之兄。太平兴国四年从征太原，后随太宗北伐，参与高梁河之役。端拱年间屡败辽军，威震北边。至道中率军平定李继迁之叛。澶渊之盟后以疾解兵权。史称其沉厚有谋，善待士卒，为宋初边防重臣。
