heroes:
  blue:
  - key: hist_songliaojinyuan_0180
    name: 潘美
    default_gender: male
    archetype: military
    flavor: （925年-991年）北宋开国名将，曾与杨业搭档抗辽。他战功赫赫，灭南汉、征南唐皆有大功。因陈家谷之战与杨业殉国，他被后世误解为奸臣，实则是一代名将。其功过争议在史书与民间传说中反复被讨论，形象复杂而立体。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0181
    name: 曹彬
    default_gender: male
    archetype: military
    flavor: （931年-999年）北宋开国名将，仁义之将的典范。他灭南唐后约束军纪，秋毫无犯，受到百姓爱戴。他为人谨慎，不居功自傲，是北宋将领中的楷模。其事迹在史书与地方志中屡被称颂，成为治军有方的典型。若仅以一战成败评价曹彬容易失真，结合宋辽金元之际后勤与边防压力才能接近真实语境。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0182
    name: 石守信
    default_gender: male
    archetype: military
    flavor: （928年-984年）北宋开国功臣，赵匡胤的结义兄弟。他是陈桥兵变的参与者，也是杯酒释兵权的主角之一。他交出兵权后，安享富贵，得以善终。其经历在史书与传奇叙述中多有记载，反映宋初权力转移的风云。围绕石守信的军事评价长期分化，核心往往不在勇怯，而在资源条件下的取舍逻辑。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0183
    name: 高怀德
    default_gender: male
    archetype: military
    flavor: （926年-982年）北宋开国功臣，高家将的始祖。他骁勇善战，随赵匡胤平定诸国。他镇守边关，抵御辽国入侵，是北宋初年的名将。其事迹在史书与民间传说中广为流传，形象被后世不断演绎。从战役链条看，高怀德并非孤立节点，其表现通常与同代将领协同关系紧密相连。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0198
    name: 宗泽
    default_gender: male
    archetype: military
    flavor: （1059年-1128年）北宋末名臣名将，东京留守。金兵南下，朝廷震荡，他力主抗战，守汴梁而不屈；临终犹念“过河”，愿诸军收复河山。其忠烈与担当，成为靖康之变前最后的铁骨。其事迹在史书与后世评述中屡被称颂，成为忠烈人物的典型。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0208
    name: 周邦彦
    default_gender: male
    archetype: civil
    flavor: （1056年-1121年）北宋末年词人，婉约派大师。他精通音律，词风华丽典雅。他创制了许多新词牌，对宋词发展贡献巨大。其作品在词史中地位崇高，后世词论常以其为宗。作为北宋末年词人，婉约派大师，周邦彦的表达重心并不局限于个人情绪，往往还能映照宋辽金元之际的公共议题。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0159
    name: 刘攽
    default_gender: male
    archetype: civil
    flavor: （1023年-1089年）北宋史学家，参与司马光编修《资治通鉴》。刘攽长于考订异文、辨析史料真伪，遇到一处年代或字句对不上，宁可停笔查卷，也不让传闻混进正史。通史的长剑要靠许多细小磨石开刃，他的功劳便在这些不显眼的校雠工夫里。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0160
    name: 刘恕
    default_gender: male
    archetype: civil
    flavor: 刘恕（1032—1078），字道原，筠州人，北宋史学家。司马光修《资治通鉴》时，常把纷杂难考的材料交给他厘清；他又撰《资治通鉴外纪》，补叙战国以前史事。刘恕精于魏晋以后史料，可惜年仅四十七便去世，没能亲眼见到《通鉴》全书告成。史书有时像长途押镖，最熟路的镖师偏偏先行离队。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0161
    name: 王安国
    default_gender: male
    archetype: civil
    flavor: （1028年-1074年）王安石之弟，北宋诗人。王安国受家学与荆公新学熏陶，却没有把兄长的政见原样抄进自己的文章，诗中自有清峭一路。兄弟同门而异路，未必是失和，倒像一套剑法传到两人手里，各自挑了不同的招式；他的诗名不该只靠“王安石之弟”四字来照亮。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0162
    name: 王雱
    default_gender: male
    archetype: civil
    flavor: （1044年-1076年）王安石之子，新党人物，参与变法并协助编纂《三经新义》。王雱年少有才，思想与文章都带着熙宁新学的锋芒，却在三十二岁左右早逝，使王安石深受打击。新法的风雷还未散，他已经先离开棋局；后人读其文字，常能感到一种才气未尽、时代却催得太急的遗憾。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0163
    name: 郑侠
    default_gender: male
    archetype: civil
    flavor: （1041年-1119年）北宋官员，以绘《流民图》上书闻名。他把逃荒流离的百姓画到御前，使朝廷不得不直视新法施行后的民间疾苦，神宗一度因此下诏调整相关措施。郑侠没有用长篇奏议绕圈，而是让一幅画替百姓把话说到御座前；画卷无声，冲击却比击鼓还响。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0164
    name: 李廌
    default_gender: male
    archetype: civil
    flavor: （1059年-1109年）北宋诗人，苏门六君子之一，曾受苏轼赏识。李廌诗文有才气，却没有因此把自己写成无忧无虑的名士；仕途困顿、身世浮沉，都在文字里留下了回声。他像苏门中一柄未被充分传世的剑，锋芒可见，完整招式却因文集散佚而少了一些。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0165
    name: 张邦昌
    default_gender: male
    archetype: civil
    flavor: 进士出身，靖康年间官至少宰。金兵攻陷汴梁、掳走徽钦二帝后，张邦昌被强立为“大楚”皇帝，僭号仅三十三日，且不御正殿、不称诏旨。高宗即位后，他仍因受伪位而被李纲等劾奏，最终贬潭州赐死。张邦昌或有自称为宗庙忍辱的辩解，却终究没能从“受迫称帝”的阴影下脱身。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0166
    name: 吕本中
    default_gender: male
    archetype: civil
    flavor: （1084年-1145年）两宋之际诗人、诗论家，编有《江西诗社宗派图》。吕本中不只是替江西诗派列名次，更在诗学与师承之间整理出一张关系图，让后人看见同一旗号下并非人人一式剑招。宋室南渡，诗风也随山河改道；他的论诗眼光，恰好站在两段时代的渡口。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0167
    name: 张舜民
    default_gender: male
    archetype: civil
    flavor: （约1034年-约1110年）北宋文学家，词风有豪放一面，常被拿来与苏轼相提。张舜民并非只会借酒放歌，他的仕途、出塞见闻与政治处境都进入了诗词，豪语背后常藏着身世的冷意。若说苏轼是大江横放，他更像江边一骑，风来时扬鞭，回首仍看得见岸上的尘土。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0168
    name: 李之仪
    default_gender: male
    archetype: civil
    flavor: （1048年—约1127年）北宋词人，以《卜算子》“我住长江头，君住长江尾”传世。李之仪的好处不只在这一句名篇，书信与小令里同样有细密真切的情绪，把相思写得像隔着一江水递来的短笺。江湖高手讲究飞鸽传书，他却只凭几行词，便让千年后的读者也收到了信。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0169
    name: 毛滂
    default_gender: male
    archetype: civil
    flavor: （1060年—？）北宋词人，号东堂，词风清丽而不失清峭。毛滂与贺铸、周邦彦同处北宋后期词坛，却没有把婉约写成一味软语，景物里常见疏朗与冷光。北宋将尽，词也在换气；他的作品像暮色中的一盏灯，亮得不喧闹，却能看出门外的风向。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0170
    name: 舒亶
    default_gender: male
    archetype: civil
    flavor: （1041年-1103年）北宋词人、官员，因参与弹劾苏轼而与“乌台诗案”相连。政治上的一笔让后世先记住了他的立场，然而舒亶的词并非只有政争面孔，写景与写情处自有细腻转折。一个人可以在朝堂执笔，也可以在词中低声；两支笔不必互相抵消，却都应由史实来评判。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0171
    name: 王观
    default_gender: male
    archetype: civil
    flavor: （1035年—1100年）北宋词人，词作清新明快。“若到江南赶上春，千万和春住”不是苦苦挽留春色，而像把一封轻快的请帖递给远行人。王观的身影主要由作品留存，几句词独自站出来，便足以照见他的才情。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0172
    name: 蔡挺
    default_gender: male
    archetype: military
    flavor: （1014年-1079年）北宋边将兼词人，长期任职西北。蔡挺在边关要面对的是军粮、城寨与西夏压力，词中却又能写出文人的情思；文武两途在他身上并非互相装饰，而是同一段边地生活的两种回声。能在战报与词牌之间换手，固然难得，真正难的是每一边都不敷衍。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0173
    name: 王诜
    default_gender: male
    archetype: civil
    flavor: （约1036年—约1093年）北宋画家、驸马都尉，苏轼好友。王诜身在贵戚与士大夫交游之间，也因“乌台诗案”受到牵连；荣华与风波总在同一座府门里进出。他的山水画名重一时，说明这位贵公子并非只会赏画，自己也有能让后世驻足的笔墨。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0174
    name: 文同
    default_gender: male
    archetype: civil
    flavor: （1018年-1079年）北宋画家，善画墨竹。“胸有成竹”的说法便与文同画竹的经验相连：下笔之前，竹子的姿态早已在心中成形。苏轼等人推重其画，后世画家也多取法他的清劲。文同不靠浓彩争胜，只用几竿淡墨证明，竹叶也能有风雷气。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0175
    name: 李公麟
    default_gender: male
    archetype: civil
    flavor: 李公麟（1049—1106），舒州人，熙宁进士，号龙眠居士。善白描人物，不施丹青，只凭线条的起伏便画出神采；《五马图》等作品尤见鞍马人物之精。有人以为画马须有万里奔腾，他偏用几根线让马自己从纸上走出来，笔下轻，气势却不轻。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0176
    name: 郭熙
    default_gender: male
    archetype: civil
    flavor: 郭熙（约1020年—约1090年），河阳温县人，北宋画家，神宗时任御画院艺学。师法李成，善画山水寒林，传世《早春图》云气初动，山川仿佛正在醒来；《林泉高致》又提出高远、深远、平远的“三远”之说。郭熙既在纸上造山，也替后人讲清楚山该怎样远、怎样深。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0177
    name: 范宽
    default_gender: male
    archetype: civil
    flavor: 范宽（约960—约1030），华原人，北宋山水画家。传世《溪山行旅图》中巨峰压住天际，行旅人物只成山脚一线，正显出他以真山真水为师的雄浑气象。与李成、关仝并称“三家”，范宽不把山画成陪衬，而是让山自己坐到画面中央。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0178
    name: 李成
    default_gender: male
    archetype: civil
    flavor: （919年-967年）五代入宋画家，山水画名家，与范宽、郭熙并称北宋山水“三家”。李成多写寒林平远，烟霭、枯木与疏阔天际相互映衬，形成清润而高逸的画境。后世画家不断摹学他的路数，正如江湖中人反复练一门旧剑：招式传下来了，原来的风雪却未必人人画得出。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0179
    name: 燕肃
    default_gender: male
    archetype: civil
    flavor: （961年-1040年）北宋官员、画家与技术家，曾制莲花漏等计时器具，也以山水画见长。燕肃一手校准漏刻，一手经营烟云，既要让水滴走得准，也要让山势立得稳。这样的跨界，是宋代士人把器物、政务与艺事都纳入学问的一种样子。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0184
    name: 呼延赞
    default_gender: male
    archetype: military
    flavor: （生卒年不详）北宋初年将领，史书所载以勇悍善战见称。铁鞭、呼家将等鲜明形象，多经后世戏曲与说部铺陈；现存史料显示，他曾随宋初军队征讨，因战功进入将门谱系。正史中的呼延赞已足够硬朗，民间传说则为这柄刀添上更响亮的回声。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0185
    name: 李继隆
    default_gender: male
    archetype: military
    flavor: 李继隆（950—1005），字霸图，上党人，明德皇后之兄，北宋初年名将。随军征太原、北伐辽国，参与高梁河之役，后来镇守北边并多次与辽军交锋；至道年间又率军平定李继迁之叛。史称其沉厚有谋、善待士卒，外戚身份没有遮住他的军功。边关将领最怕只会靠门第，他偏用一场场守战把名号压实。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0186
    name: 王全斌
    default_gender: male
    archetype: military
    flavor: （908年-976年）北宋开国功臣，灭后蜀的主帅。王全斌率军入蜀，六十余日便攻下后蜀，进军之快足见其将略；可战后约束部伍不严，纵兵劫掠，终于被削官贬黜。攻城能快，收刀却慢，功劳与失德便在同一场平蜀战事里并肩留下。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0187
    name: 郭进
    default_gender: male
    archetype: military
