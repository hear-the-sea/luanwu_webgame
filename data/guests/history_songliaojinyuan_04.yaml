    default_gender: male
    archetype: civil
    flavor: （1018年-1079年）北宋画家，墨竹派开创者。"胸有成竹"的典故来自于他。他的墨竹影响深远。其事迹在画史与文人笔记中多有记载，风格亦为后学追慕。后世对文同的评价屡有起伏，这种变化本身就折射了时代趣味与价值排序的不断调整。
