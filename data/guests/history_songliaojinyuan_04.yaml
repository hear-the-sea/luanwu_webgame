  - key: hist_songliaojinyuan_0180
    name: 潘美
    default_gender: male
    archetype: military
    flavor: （925年-991年）北宋开国名将，曾与杨业搭档抗辽。他战功赫赫，灭南汉、征南唐皆有大功。因陈家谷之战与杨业殉国，他被后世误解为奸臣，实则是一代名将。其功过争议在史书与民间传说中反复被讨论，形象复杂而立体。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0181
    name: 曹彬
    default_gender: male
    archetype: military
    flavor: （931年-999年）北宋开国名将，仁义之将的典范。他灭南唐后约束军纪，秋毫无犯，受到百姓爱戴。他为人谨慎，不居功自傲，是北宋将领中的楷模。其事迹在史书与地方志中屡被称颂，成为治军有方的典型。若仅以一战成败评价曹彬容易失真，结合宋辽金元之际后勤与边防压力才能接近真实语境。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0182
    name: 石守信
    default_gender: male
    archetype: military
    flavor: （928年-984年）北宋开国功臣，赵匡胤的结义兄弟。他是陈桥兵变的参与者，也是杯酒释兵权的主角之一。他交出兵权后，安享富贵，得以善终。其经历在史书与传奇叙述中多有记载，反映宋初权力转移的风云。围绕石守信的军事评价长期分化，核心往往不在勇怯，而在资源条件下的取舍逻辑。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0183
    name: 高怀德
    default_gender: male
    archetype: military
    flavor: （926年-982年）北宋开国功臣，高家将的始祖。他骁勇善战，随赵匡胤平定诸国。他镇守边关，抵御辽国入侵，是北宋初年的名将。其事迹在史书与民间传说中广为流传，形象被后世不断演绎。从战役链条看，高怀德并非孤立节点，其表现通常与同代将领协同关系紧密相连。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0198
    name: 宗泽
    default_gender: male
    archetype: military
    flavor: （1059年-1128年）北宋末名臣名将，东京留守。金兵南下，朝廷震荡，他力主抗战，守汴梁而不屈；临终犹念“过河”，愿诸军收复河山。其忠烈与担当，成为靖康之变前最后的铁骨。其事迹在史书与后世评述中屡被称颂，成为忠烈人物的典型。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0208
    name: 周邦彦
    default_gender: male
    archetype: civil
    flavor: （1056年-1121年）北宋末年词人，婉约派大师。他精通音律，词风华丽典雅。他创制了许多新词牌，对宋词发展贡献巨大。其作品在词史中地位崇高，后世词论常以其为宗。作为北宋末年词人，婉约派大师，周邦彦的表达重心并不局限于个人情绪，往往还能映照宋辽金元之际的公共议题。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0159
    name: 刘攽
    default_gender: male
    archetype: civil
    flavor: （1023年-1089年）北宋史学家，《资治通鉴》编修助手。他协助司马光编纂《资治通鉴》，贡献巨大。与同时代史臣相比，刘攽更重史料校核与叙事节制，这种取向也影响了后世读《通鉴》的理解路径。他在通史编纂中的“校雠功”也因此常被后人单独称述。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0160
    name: 刘恕
    default_gender: male
    archetype: civil
    flavor: 刘恕（1032—1078），字道原，筠州人。北宋史学家，自幼博闻强记。治平年间司马光奉诏修《资治通鉴》，荐恕同修，遇纷杂难考之处多委之于恕。另撰《资治通鉴外纪》十卷，补战国以前史事。其治史严谨，于魏晋以后史事尤精。惜未及见《通鉴》成书而卒，年四十七。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0161
    name: 王安国
    default_gender: male
    archetype: civil
    flavor: （1028年-1074年）北宋诗人，王安石之弟。他诗才出众，却与兄长政见不同。他既受荆公新学影响，又保持相对独立的诗学判断，这种“同门而异路”的面貌，使其在北宋文坛别具辨识度。因此，后世评其诗名时多强调“家学之内的分歧与创造”。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0162
    name: 王雱
    default_gender: male
    archetype: civil
    flavor: （1044年-1076年）王安石之子，新党骨干。他参与变法，编纂《三经新义》。他英年早逝，令父悲痛。王雱的人生轨迹显示，作品风格与时代压力会相互塑形，因此其文本总带着鲜明的历史温度。围绕王雱形成的不同解释路径，本身也推动了相关时期研究框架的细化。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0163
    name: 郑侠
    default_gender: male
    archetype: civil
    flavor: （1041年-1119年）北宋名臣，以《流民图》上书闻名。他用画作揭示民间疾苦，促成新法暂停。郑侠并非“无争议”的人物，正是这些争议让其在历史讨论中持续具有解释力。围绕郑侠形成的不同解释路径，本身也推动了相关时期研究框架的细化。
