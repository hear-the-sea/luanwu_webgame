    default_gender: male
    archetype: civil
    flavor: 范宽（约960—约1030），华原人。传世《溪山行旅图》气象浑穆，山势逼人，峰峦浑厚而草木华滋。与李成、关仝并称三家，为北宋山水画开宗立派者。
