      agility: 12
  - key: hist_songliaojinyuan_0165
    name: 张邦昌
    default_gender: male
    archetype: civil
    flavor: 进士出身，钦宗靖康间拜少宰。金兵陷汴梁，掳二帝北去，强立其为大楚皇帝。僭号三十三日，不御正殿、不称诏旨。高宗即位，李纲等劾以失节，贬潭州赐死。临刑读所上辩状，自言为宗庙计。
    growth_range:
