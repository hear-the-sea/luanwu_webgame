    default_gender: male
    archetype: civil
    flavor: （961年-1040年）北宋科学家、画家。他发明了莲花漏等科学仪器，又善画山水。其事迹在科学史与画史中皆有记载，才艺兼备令人称道。其跨学科成就使他在技术史与艺术史上都占有一席之地。燕肃并非“无争议”的人物，正是这些争议让其在历史讨论中持续具有解释力。
