  - key: hist_songliaojinyuan_0169
    name: 毛滂
    default_gender: male
    archetype: civil
    flavor: （1060年-？）北宋词人，词风清丽。他与贺铸、周邦彦齐名，是北宋后期词坛的重要人物。其词作在婉约与清峭之间自成格调，后人论北宋末词风转向时，往往会把毛滂放在关键位置。在词史叙述中，他常被视作北宋向南宋过渡阶段的重要一环。
