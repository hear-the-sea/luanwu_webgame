    default_gender: male
    archetype: civil
    flavor: （919年-967年）五代北宋画家，山水画大师。他与范宽、郭熙并称北宋山水画三大家。其画风在画史中地位崇高，后世多有评议与摹仿。其艺术影响在后世画论中多被引用，成为山水传统的重要源流。李成留下的表达范式被后世反复激活，使其在文学传统中始终保持可见度。
