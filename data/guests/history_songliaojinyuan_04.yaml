heroes:
  blue:
  - key: hist_songliaojinyuan_0180
    name: 潘美
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （925年-991年）北宋开国名将，曾与杨业搭档抗辽。他战功赫赫，灭南汉、征南唐皆有大功。因陈家谷之战与杨业殉国，他被后世误解为奸臣，实则是一代名将。其功过争议在史书与民间传说中反复被讨论，形象复杂而立体。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0181
    name: 曹彬
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （931年—999年）北宋将领，字国华，真定灵寿人。曹彬先后参与灭后蜀、南唐等战事，为北宋统一战争的重要统帅；攻取金陵时约束部下不得妄杀，以持重廉洁著称，官至枢密使；宋真宗即位后病逝，追封济阳郡王，配享太祖庙庭。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0182
    name: 石守信
    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: （928年—984年）北宋将领，开封浚仪人。石守信在后周时与赵匡胤交好，参与陈桥兵变，助其建立宋朝；宋初任侍卫亲军马步军都指挥使，参加平定李筠、李重进，后于“杯酒释兵权”中自请解职，太平兴国九年病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0183
    name: 高怀德
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
    flavor: （926年—982年）北宋开国将领，字藏用，真定常山人，后周齐王高行周之子。高怀德随赵匡胤参与陈桥兵变，宋初任殿前都指挥使，参加平定李筠、李重进等战事，后改武胜军节度使，镇守河东、潞州等地；太平兴国七年病逝，追封渤海郡王。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0208
    name: 周邦彦
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: （1056年—1121年）北宋词人，字美成，号清真居士，钱塘人。周邦彦精通音律，曾任校书郎、提举大晟府，主持整理宫廷乐章；其词格律精严，著有《片玉词》，多写羁旅、宴饮与离情，被后世词家推为婉约派集大成者。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0176
    name: 郭熙
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: 郭熙（约1023—约1085），字淳夫，河阳温县人。熙宁年间以画艺入宫廷画院，善作山水寒林，师法李成而自出新意，代表作有《早春图》。其子郭思整理他的画论为《林泉高致》，书中提出高远、深远、平远的三远法。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0177
    name: 范宽
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: 范宽（约950—约1032），名中正，字中立，华原人，因性情宽厚，时人以“范宽”相称。他初学李成，后长期隐居终南、太华，以真山真水为师，落笔雄浑厚重；代表作《溪山行旅图》《雪景寒林图》传世，与李成、关仝并称北宋初年山水三大家。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0205
    name: 余玠
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: 余玠（约1199—1253），字义夫，蕲州人，南宋将领。淳祐二年出任四川制置使，采纳播州冉氏兄弟的建议，依山筑城，建成以钓鱼城为核心的山城防御体系，并任用王坚等将领抗击蒙古；后遭朝廷猜忌，被召还后卒。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  green:
  - key: hist_songliaojinyuan_0159
    name: 刘攽
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: 刘攽（1023—1089），字贡父，临江新喻人。庆历六年进士，与兄刘敞并称“二刘”，官至中书舍人。他应司马光之邀协修《资治通鉴》，分任两汉部分的长编，另撰《东汉刊误》，逐条校正《后汉书》的文字与史实讹误。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0160
    name: 刘恕
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: 刘恕（1032—1078），字道原，筠州高安人。少以强记闻名，举进士，官至秘书丞。司马光编《资治通鉴》时，他负责魏晋南北朝部分的长编，考订繁难史事；又自撰《通鉴外纪》《十国纪年》，补叙上古至五代史事，四十七岁卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0161
    name: 王安国
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: 王安国（1028—1074），字平甫，抚州临川人，王安石之弟。熙宁初以文才召试，赐进士及第，历任西京国子教授、秘阁校理，诗文为时人所重，著有《王校理集》。他对新法部分举措持保留态度，与兄长政见并不完全一致。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0162
    name: 王雱
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: 王雱（1044—1076），字元泽，抚州临川人，王安石之子。少有文名，《宋史》称其未冠已著书数万言；治平四年中进士，历任太子中允、崇政殿说书，官至天章阁待制兼侍讲。他参与编修《三经新义》，为新法提供经义依据，另撰《南华真经新传》发挥老庄之学。体弱多病，三十三岁早卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0163
    name: 郑侠
    avatar: pig/文031.png
    default_gender: male
    archetype: civil
    flavor: 郑侠（1041—1119），字介夫，福州福清人。治平四年进士，曾任光州司法参军。熙宁七年他将所见流民饥困之状绘成《流民图》上奏，神宗览后下诏暂罢部分新法；他因此得罪，长期贬谪，自号一拂居士，著有《西塘集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0164
    name: 李廌
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: 李廌（1059—1109），字方叔，华州人。少年时以文章谒见苏轼，受其赏识，与黄庭坚、秦观、晁补之、张耒、陈师道并称“苏门六君子”。他应举不第，仕途困顿，著有《济南集》《师友谈记》，另有《德隅斋画品》评论绘画。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0165
    name: 张邦昌
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 张邦昌（1081—1127），字子能，永静军东光人。进士出身，靖康初官至少宰，曾与康王赵构赴金营议和。汴京城破后，金人扶立他为“大楚”皇帝，在位仅三十余日；金军北撤，他迎元祐皇后垂帘并还政赵构，仍以僭位获罪，被贬潭州后赐死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0166
    name: 吕本中
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: 吕本中（1084—1145），字居仁，寿州人，世称东莱先生，出身吕氏家学。绍兴六年赐进士出身，官至中书舍人兼侍讲，因忤秦桧罢官。所著《江西诗社宗派图》梳理江西诗派师承，论诗主张“活法”；另有《紫微诗话》《童蒙训》《东莱诗集》传世。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0167
    name: 张舜民
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: 张舜民（约1034—约1110），字芸叟，号浮休居士，邠州人。治平二年进士，曾随军西北，历任监察御史、知州等职，与苏轼有诗文往还。他亲历边地，诗多写军旅见闻与个人遭际；元祐、绍圣党争中数度起伏，著有《画墁集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0168
    name: 李之仪
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: 李之仪（约1048—1117），字端叔，号姑溪居士，沧州无棣人。元丰间入苏轼定州幕府，后官至朝请大夫，因故贬居太平州。其词《卜算子·我住长江头》流传甚广，论词主张“语尽而意不尽”，著有《姑溪居士集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0169
    name: 毛滂
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 毛滂，字泽民，衢州江山人，生卒年不详。元祐年间任杭州法曹参军，以词受苏轼赏识，后知武康县。其词多写宴游、节序与离情，语言清丽疏朗，《惜分飞·富阳僧舍作别语赠妓琼芳》传诵一时，著有《东堂词》《东堂集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0170
    name: 舒亶
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: 舒亶（1041—1103），字信道，明州慈溪人。治平二年礼部试第一，元丰初任监察御史里行，与李定等弹劾苏轼，酿成“乌台诗案”，后官至御史中丞。他依附新法而得进用，亦工词，著有《舒学士词》，作品多写羁旅与宴游，风格清丽。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0171
    name: 王观
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: 王观（约1035—1100），字通叟，泰州如皋人，嘉祐二年进士，时与秦观并称“二观”。曾任江都知县等职；相传他应制作词获罪去官，遂自号“逐客”。其词语言清新明快，《卜算子·送鲍浩然之浙东》最为传诵。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0172
    name: 蔡挺
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: 蔡挺（1014—1079），字子正，应天府宋城人。进士出身，英宗、神宗两朝长期在西北任职，知渭州时整饬城寨、军器与马政，招募弓箭手屯田守边，多次参与对西夏的防御；官至枢密副使，谥敏肃。他亦能词，有《喜迁莺》写边塞见闻传世。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0173
    name: 王诜
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: 王诜（约1048—1104），字晋卿，太原人，居开封。娶英宗之女，为驸马都尉。他善画山水，师法李成，与苏轼、黄庭坚、米芾等交游，家富书画收藏；元丰二年因苏轼案受牵连贬官。传世作品有《渔村小雪图》《烟江叠嶂图》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0174
    name: 文同
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: 文同（1018—1079），字与可，梓州永泰人，世称文湖州。皇祐元年进士，曾任知洋州，元丰二年被命知湖州，未赴任而卒。他擅画墨竹，主张画竹先“胸有成竹”，所创竹法被称为“湖州竹派”；苏轼即其表弟，亦工诗，著有《丹渊集》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0175
    name: 李公麟
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: 李公麟（1049—1106），字伯时，舒州人，号龙眠居士。熙宁三年进士，官至朝奉郎。他擅长人物、鞍马与佛道像，发展出以墨线勾勒、不施色彩的白描画法，代表作有《五马图》《临韦偃牧放图》；又精于古器物与金石鉴定。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0178
    name: 李成
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: 李成（919—967），字咸熙，唐宗室后裔，先世居长安，避乱迁居青州营丘，世称李营丘。他善画寒林、平远山水，笔墨清润疏阔，与关仝、范宽并称三家；传世有《读碑窠石图》等。至北宋时其真迹已稀，米芾有“无李论”之叹。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0179
    name: 燕肃
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: 燕肃（961—1040），字穆之，青州益都人。官至龙图阁直学士、礼部侍郎，历知州郡，以廉干著称。他精通工艺，天圣年间制成莲花漏，经朝廷校验后颁行州县；又撰《海潮论》并绘海潮图，解释潮汐随月盈亏之理。他亦善山水寒林，诗画皆有传世。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0184
    name: 呼延赞
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: 呼延赞（？—约1000），并州太原人，北宋初年将领。他随宋太宗征北汉，以勇悍著称，曾任铁骑军指挥使，官至康州团练使；相传他遍体刺“赤心杀贼”四字，妻儿仆从亦令刺字，行事刚猛。后世戏曲、说部将呼家将故事附会于他，铁鞭等形象多出演义，与《宋史》本传所载不尽相同。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0185
    name: 李继隆
    avatar: monkey/其他随机角色/武047_男.png
    default_gender: male
    archetype: military
    flavor: 李继隆（950—1005），字霸图，潞州上党人，宋初名将李处耘之子，明德皇后之兄。他出身将门，参与征讨北汉、北伐辽国，端拱年间与尹继伦等在徐河击退辽军；景德元年任驾前东西排阵使，参与澶渊之盟，官至节度使，卒赠中书令，谥忠武。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0186
    name: 王全斌
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
