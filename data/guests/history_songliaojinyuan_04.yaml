    flavor: （约1036年-约1093年）北宋画家、驸马。他是苏轼好友，因"乌台诗案"受牵连。他的画作成就极高。其经历在史书与文人笔记中屡被提及，画名亦为后世所推重。王诜的文本长期被反复讨论，正因为其中的主题层次能够同时回应文学审美与时代问题。
