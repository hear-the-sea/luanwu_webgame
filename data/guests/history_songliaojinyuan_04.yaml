      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0166
    name: 吕本中
    default_gender: male
    archetype: civil
    flavor: （1084年-1145年）两宋之际诗人，《江西诗社宗派图》作者。他总结了江西诗派的发展，是重要的诗论家。他提出的诗学主张与编年式梳理，为理解江西诗派内部差异提供了清晰坐标，后世论诗常以其为参照。宋元以来不少诗话谈及宗派问题时，都会引用他的判断。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0167
    name: 张舜民
    default_gender: male
    archetype: civil
    flavor: （约1034年-约1110年）北宋文学家。他的词作豪放，与苏轼词风相近。从张舜民的经历来看，文体取向、思想选择与社会处境始终彼此牵动，这也构成了其在同代人物中的独特轮廓。若仅依赖单一叙述容易失真，而张舜民的多源材料恰好可用于校正这种偏差。
    growth_range:
    - 3
