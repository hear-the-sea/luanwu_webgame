    name: 何敬容
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （？—549年）字国礼，庐江灊县人，南朝梁宰相。中大通三年（531年）任尚书右仆射，后迁左仆射、尚书令，勤于政务，明习庶事，不喜玄学清谈，因而为士林所讥。曾与朱异同朝而政见不合，并预言侯景终将乱国。太清三年（549年）卒。
