    name: 江总
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （519—594年）字总持，济阳考城人，历仕梁、陈、隋三朝，为南朝后期重要诗人。侯景之乱后避居岭南，陈文帝时被召回，官至尚书令。陈后主时与孔范等侍宴宫中，以诗赋相唱和，时号“狎客”，于朝政少有匡正。隋灭陈后入隋，授上开府，开皇十四年（594年）卒。
