  - key: hist_sljnbc_0462
    name: 姚泓
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: （388—417年）字元子，南安赤亭羌人，后秦末主，姚兴长子。即位时诸弟争权，姚懿、姚恢先后起兵，国力已衰。义熙十三年（417年）东晋刘裕北伐，王镇恶等攻破潼关、直入长安，姚泓率群臣出降，被送往建康处死，后秦灭亡。
