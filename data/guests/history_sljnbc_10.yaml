heroes:
  blue:
  - key: hist_sljnbc_0465
    name: 谢朓
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （464年—499年）南朝齐诗人，陈郡阳夏人，字玄晖，东晋名将谢安之后。他自幼聪慧，文才卓绝，以山水诗著称于世，与谢灵运并称"大谢小谢"，又称"二谢"。他的诗风清新自然，声律和谐，对唐代诗歌影响极大。李白对他推崇备至，赞曰"蓬莱文章建安骨，中间小谢又清发"，又言"一生低首谢宣城"。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0483
    name: 宇文宪
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （544年—578年）北周齐王，代郡武川人，宇文泰第五子，北周武帝宇文邕之弟。他自幼聪慧过人，精通文史典籍，同时武艺超群，擅长骑射，是宇文氏宗室中最杰出的军事人才。北周与北齐的战争中，他多次担任主将率军出征，战功赫赫。建德五年（576年）他随武帝伐齐，在平阳之战中亲率骑兵突击，大破齐军主力，为灭齐立下首功。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 8
      defense: 18
      agility: 30
  - key: hist_sljnbc_0487
    name: 庾亮
    avatar: pig/文031.png
    default_gender: male
    archetype: civil
    flavor: （289年—340年）东晋大臣，字元规，颍川鄢陵人，明穆皇后之兄。庾亮历仕元帝、明帝，明帝时以中书令辅政。他主张削夺苏峻兵权，激起苏峻之乱，京城陷落后出奔寻阳，与温峤、陶侃合力平乱。此后出镇武昌，任荆州刺史、征西将军，咸康六年病卒。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 52
      defense: 20
      agility: 14
  green:
  - key: hist_sljnbc_0451
    name: 薛道衡
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （540—609年）字玄卿，河东汾阴人，历仕北齐、北周、隋三朝，官至内史侍郎。开皇年间出使陈国，作《人日思归》，江南士人传诵；其《昔昔盐》以“暗牖悬蛛网，空梁落燕泥”一联著称。诗风绮丽精工，于声律多有讲求，为隋代诗坛代表人物。后因作《高祖文皇帝颂》及议论时政触怒隋炀帝，被赐死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0452
    name: 邱建
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详，史籍多作“丘建”）三国曹魏将领，本为胡烈部属，后得钟会信任，任帐下督。魏灭蜀后次年（264年）钟会谋反，拘押诸将；丘建悯念旧主，请准胡烈亲兵出入送饭，消息由此传出。胡烈编称钟会欲坑杀将士，军中一夕骚动，胡渊等遂起兵攻杀钟会。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0453
    name: 温恢
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: （178—223年）字曼基，太原祁人，曹魏大臣。由孝廉入仕，历廪丘长、丞相主簿，后出任扬州刺史。建安二十四年（219年）关羽围樊城，他判断水势方涨、曹仁孤军无备，预陈关羽必乘利北上，促使援军急发。曹丕即位后任魏郡太守，迁凉州刺史、持节领护羌校尉，赴任途中病卒，年四十五。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0454
    name: 刘靖
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: （？—254年）字文恭，沛国相人，曹魏将领，扬州刺史刘馥之子。承父风而留意民政，官至镇北将军、都督河北诸军事。嘉平二年（250年）主持修筑戾陵堰、开凿车箱渠，引水灌溉蓟县南北农田，使当地得以种稻，边民受其利。卒后谥景侯。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0455
    name: 赵俨
    avatar: pig/文032.png
    default_gender: male
    archetype: civil
    flavor: （171—245年）字伯然，颍川阳翟人，曹魏重臣，与辛毗、陈群、杜袭并称“辛陈杜赵”。建安末任关中护军，招抚羌氐、安定地方；樊城之战以议郎参曹仁军事，与徐晃协调诸军待援夹击，解围有功。后历骠骑将军、尚书仆射，督雍凉诸军，正始六年（245年）官至司空，同年去世。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_sljnbc_0456
    name: 诸葛瞻
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （227—263年）字思远，琅邪阳都人，蜀汉丞相诸葛亮之子。十七岁娶后主刘禅之女，拜骑都尉，后历羽林中郎将、侍中、尚书仆射，官至卫将军、平尚书事。景耀六年（263年）邓艾偷渡阴平，他率军迎击，未听黄崇抢占险要之议，退守绵竹，兵败与长子诸葛尚一同战死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0457
    name: 黄崇
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （？—263年）蜀汉官员，镇北将军黄权之子，官至尚书郎。其父黄权于夷陵战后降魏，黄崇留仕蜀汉。景耀六年（263年）随诸葛瞻迎击邓艾，力劝诸葛瞻抢占险要、勿使魏军进入平原，未被采纳。绵竹之战中率部死战，兵败殉国。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_sljnbc_0458
    name: 陆绩
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （187—219年）字公纪，吴郡吴县人，东吴官员、经学家，陆康之子。六岁时在九江袁术席间怀橘遗亲，后被列入二十四孝。博通天文历算，作《浑天图》，注《周易》，释《太玄经》。曾任郁林太守，为官清廉，罢归时因船轻取石压舱，后世称“廉石”。年三十二卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0459
    name: 张承
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: （177—244年）字仲嗣，彭城人，东吴重臣张昭长子。少以才学知名，曾任长沙西部都尉、濡须都督，后拜奋威将军，参与讨平山越。为人刚毅正直，好甄别人物，曾断言诸葛恪终将败亡诸葛氏一族。赤乌七年（244年）卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0460
    name: 卫玠
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: （286—312年）字叔宝，河东安邑人，西晋玄学家、清谈名士，卫瓘之孙。容貌俊美，其舅王济叹“珠玉在侧，觉我形秽”。官至太子洗马，善谈《易》《老》，与王承并称中兴名士之冠。永嘉之乱中南渡建康，因体弱多病又为人围观清谈，不久去世，时人谓其“看杀”。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0461
    name: 苻登
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: （343—394年）字文高，氐族，前秦宗室、苻坚族孙。苻坚被姚苌所杀后，他在关陇收拢氐族余部，于太初元年（386年）称帝，继续与后秦作战。军中供奉苻坚神主，每战必先祈祷，士卒多为之用命。太初九年（394年）在马毛山被后秦姚兴击败，兵败被杀，谥高皇帝。
    growth_range:
    - 3
    - 7
    attribute_weights:
