    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0472
    name: 高延宗
    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （544—577年）北齐宗室，齐文襄帝高澄第五子，封安德王。武平七年（576年）北周大军攻晋阳，后主高纬弃城南逃，留守军民拥立他称帝，改元德昌。他亲自督战，一度使周武帝陷于险境，终因城破被俘，押至长安后遇害。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 12
      defense: 40
      agility: 14
  - key: hist_sljnbc_0473
    name: 高阿那肱
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—580年）北齐后主高纬宠臣，与穆提婆、韩凤并称“三贵”。早年以勇武闻名，曾从军征讨契丹、柔然；后主时长期受宠掌权，与穆提婆等干预朝政，势倾内外。北齐灭亡时降北周。大象二年（580年）响应王谦起兵反杨坚，兵败被杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0474
    name: 穆提婆
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （527—577年）本姓骆，北齐后主高纬宠臣。其母陆令萱为后主乳母，母子凭借宫廷关系干预朝政，穆提婆历任尚书左仆射、领军大将军，与高阿那肱、韩凤并称“三贵”。北齐灭亡时降北周，后因谋据宜州起兵，事泄被处死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0475
    name: 宇文觉
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （542—557年）北周孝闵帝，宇文泰嫡子（第三子）。西魏恭帝禅让后，他在堂兄宇文护拥立下称天王，建立北周，时年十六，军政皆决于大冢宰宇文护。因不甘受制，与李植、孙恒等谋诛之，事泄被废为略阳公，不久遇害，谥孝闵帝。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0476
    name: 宇文毓
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （534—560年）北周明帝，宇文泰庶长子。宇文觉被废后，由宇文护迎立为天王，武成元年（559年）正式称帝。在位时崇尚节俭，留心文教，召集儒臣讲论经义，并逐步任用亲信以分宇文护之权。武成二年（560年）被宇文护毒杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0477
    name: 尉迟迥
    avatar: pig_wu_male9.png
