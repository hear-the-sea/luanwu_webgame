    avatar: pig_wu_male9.png
    default_gender: male
    archetype: military
    flavor: （？—422年）字敬士，吴兴武康人，出身吴兴沈氏，东晋末至刘宋初年将领，沈田子之弟。随刘裕先后讨南燕、卢循、司马休之及后秦，多预前锋，以胆略著称。刘裕称帝后任中领军，封汉寿县伯，深受倚重。永初三年（422年）卒。
