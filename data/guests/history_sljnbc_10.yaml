  - key: hist_sljnbc_0467
    name: 陈顼
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （530—582年）字绍世，吴兴长城人，南朝陈第四位皇帝，庙号高宗，年号太建。陈文帝之弟，文帝死后废黜侄陈伯宗即位。在位期间平定内乱、劝课农桑、兴修水利，并于太建五年（573年）遣吴明彻北伐，一度收复淮南；后为北周所败，淮南得而复失。太建十四年（582年）卒。
