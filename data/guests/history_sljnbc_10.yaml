  - key: hist_sljnbc_0468
    name: 孔范
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）字法言，会稽山阴人，南陈官员。陈后主时任都官尚书，与江总、施文庆等出入宫宴，以辞赋侍从，又劝后主削夺将帅兵权，谓诸将不过匹夫之勇。祯明三年（589年）隋军渡江，他率军迎战，阵未成而先溃，建康失陷后被俘送入长安。
