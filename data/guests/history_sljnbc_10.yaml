    name: 沈田子
    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: （？—418年）吴兴武康人，东晋末年将领，沈林子之兄。随刘裕北伐南燕、后秦，义熙十三年（417年）率军自武关入关中，与诸军共破长安。刘裕南归后留守关中，因与王镇恶争功，假称受刘裕密令将其诛杀；长史王修以擅杀之罪收斩沈田子。
