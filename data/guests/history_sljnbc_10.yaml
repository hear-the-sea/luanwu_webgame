  - key: hist_sljnbc_0470
    name: 尔朱兆
    avatar: pig_wu_male9.png
    default_gender: male
    archetype: military
    flavor: （？—533年）字万仁，鲜卑名吐没儿，秀容人，尔朱荣之侄，北魏末年将领。永安三年（530年）尔朱荣被孝庄帝诛杀后，他率军攻入洛阳，囚禁并杀害孝庄帝，另立元晔。后与高欢争夺河北，普泰二年（532年）韩陵之战大败，退保秀容，次年自缢而死。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0471
    name: 尔朱世隆
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: （500—532年）字荣宗，秀容人，尔朱荣堂弟，北魏末年权臣。尔朱荣死后，他与尔朱兆等先拥立元晔，再立元恭为帝，自任尚书令、太傅，与尔朱度律等共掌朝政。高欢起兵后，尔朱氏在韩陵之战溃败，他退归洛阳，被部将斛斯椿等袭杀。
    growth_range:
    - 3
