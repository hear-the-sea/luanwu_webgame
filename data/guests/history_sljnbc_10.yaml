heroes:
  blue:
  - key: hist_sljnbc_0465
    name: 谢脁
    default_gender: male
    archetype: civil
    flavor: （464年—499年）南朝齐诗人，陈郡阳夏人，字玄晖，东晋名将谢安之后。他自幼聪慧，文才卓绝，以山水诗著称于世，与谢灵运并称"大谢小谢"，又称"二谢"。他的诗风清新自然，声律和谐，对唐代诗歌影响极大。李白对他推崇备至，赞曰"蓬莱文章建安骨，中间小谢又清发"，又言"一生低首谢宣城"。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0483
    name: 宇文宪
    default_gender: male
    archetype: military
    flavor: （544年—578年）北周齐王，代郡武川人，宇文泰第五子，北周武帝宇文邕之弟。他自幼聪慧过人，精通文史典籍，同时武艺超群，擅长骑射，是宇文氏宗室中最杰出的军事人才。北周与北齐的战争中，他多次担任主将率军出征，战功赫赫。建德五年（576年）他随武帝伐齐，在平阳之战中亲率骑兵突击，大破齐军主力，为灭齐立下首功。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 44
      intellect: 8
      defense: 18
      agility: 30
  - key: hist_sljnbc_0487
    name: 庾亮
    default_gender: male
    archetype: civil
    flavor: （289年—340年）庾亮，东晋外戚重臣，历任中书令、丞相等职，在成帝朝一度总揽朝政。庾亮出身颍川庾氏，与皇室联姻后进入权力核心，面对北方强敌与内部门阀博弈，推行军政整饬但也因处置失当激化矛盾，苏峻之乱前后的决策长期引发争论。其政治生涯揭示东晋体制的结构困境：中央需要强势执政者，却又受制于士族共治与地方军镇。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 52
      defense: 20
      agility: 14
  green:
  - key: hist_sljnbc_0451
    name: 薛道衡
    default_gender: male
    archetype: civil
    flavor: （540年—609年）北朝至隋的诗人，历仕北齐、北周、隋三朝，入隋后官至内史侍郎。其《昔昔盐》写闺中春愁，“暗牖悬蛛网，空梁落燕泥”一联，把空屋写得有声有影；《人日思归》又有清劲的乡思。薛道衡以笔名动当世，却在隋炀帝朝因才名与旧怨招来杀身之祸，文人的锋芒有时也会割到自己。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0452
    name: 邱建
    default_gender: male
    archetype: civil
    flavor: （？—264年后）曹魏将领，胡烈帐下司马。钟会灭蜀后图谋据蜀自立，将魏军诸将拘在成都；邱建因受信任得以往来，便暗中把钟会的异动告知胡烈。胡烈再设法传信给儿子胡渊，最终促成魏军反击。史书没有给邱建留下叱咤风云的篇章，却留下了一条在严密监视下递出的消息；乱局里，能把一线生机送到同伴手中，也算无声的一剑。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0453
    name: 温恢
    default_gender: male
    archetype: civil
    flavor: （178年—223年）曹魏大臣，字曼基，历任郡守并治理扬州。孙吴与曹魏隔江对峙时，温恢既整饬边防，也留心安抚百姓，不把一州只当作军营来经营；他还早早看出钟会日后非池中物。这样的人不靠惊天一战立名，而是把边地的兵、民与粮道稳稳拢住。守住一方，往往比说出一句漂亮判断更见功夫。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0454
    name: 刘靖
    default_gender: male
    archetype: military
    flavor: （？—254年）曹魏大臣，扬州刺史刘馥之子，字文恭。刘靖镇守河北时，不只盯着烽火台，也看见田地与水道的荒废，主持修整戾陵堰、车箱渠一带水利，使漕运与灌溉重新有了依凭。边将若只会挥刀，守住的城也难以久存；他把水引到田里，才让“守边”二字有了百姓能感到的重量。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0455
    name: 赵俨
    default_gender: male
    archetype: civil
    flavor: （171年—245年）曹魏重臣，字伯然，以精干知兵著称。曹操平荆州后，赵俨奉命协调于禁、张辽、张郃等七军，让诸将各守其任而不相争功；后来历任地方长官，也能在战乱中安民平叛。他的本领不是替一支军队抢头功，而是让几支性情各异的军队听同一面令旗。军阵如此，朝政其实也如此，能把人放在合适的位置便是大谋。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_sljnbc_0456
    name: 诸葛瞻
    default_gender: male
    archetype: civil
    flavor: （227年—263年）蜀汉将领，诸葛亮之子，娶后主之女，官至卫将军、平尚书事。父亲的名字像一座太高的山，诸葛瞻终身都在山影下行走；他有文才，也承担着守国的责任，却未能扭转黄皓专权与国势日衰。邓艾偷渡阴平后，他率军出绵竹迎战，兵败仍与长子诸葛尚战死。名门之后未必能继承旧日光芒，但最后一阵风雪，他确实站在了城前。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0457
    name: 黄崇
    default_gender: male
    archetype: civil
    flavor: （？—263年）蜀汉将领黄权之子，曾任尚书郎。邓艾从阴平突进时，黄崇随诸葛瞻出兵，主张赶在魏军立足之前抢占险要，以逸待劳；据载他见诸葛瞻迟疑，急得涕泣进谏。绵竹战败后，他不肯独逃，终于死于阵中。黄权当年降魏，黄崇却把最后的选择留在蜀汉军旗下，父子隔着半生乱世，各自守住了自己的路。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_sljnbc_0458
    name: 陆绩
    default_gender: male
    archetype: civil
    flavor: （187年—219年）东吴官员、学者，字公纪，陆康之子。“怀橘遗亲”的故事说他六岁作客袁术府，临行仍藏橘欲带回奉母；故事后来流传很广，未必能概括他的一生。陆绩长于经学与天文，著有《浑天图》等书，也曾任郁林太守。能在孝行之外留下学问，才算没有让童年那几枚橘子把自己的名字全占了。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0459
    name: 张承
    default_gender: male
    archetype: civil
    flavor: （178年—244年）东吴重臣，张昭长子，字承明。张承不以父荫自满，历任地方与军政职务，能理事，也有识人之名；他早年看出诸葛恪并非凡才，后来果然应验。张氏父子都在孙权朝中任事，却不是同一把刀：张昭锋直，张承更宽和沉着。江东政权要靠这样的不同性情彼此补位，才不至只剩一种声音。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0460
    name: 卫玠
    default_gender: male
    archetype: civil
    flavor: （286年—312年）西晋名士，字叔宝，卫瓘之孙，善玄学清谈。史书写他姿容清美，时人称为“璧人”，后世又把他与潘安并列；“看杀卫玠”的说法更添了传奇色彩，但他南渡避乱、积劳成疾而卒，才是乱世中的真实底色。玉一样的容貌只能博得一声惊叹，挡不住永嘉风雨，也挡不住身世的颠簸。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0461
    name: 苻登
    default_gender: male
    archetype: military
    flavor: （343年—394年）前秦宗室，苻坚族孙。苻坚死后，苻登在陇西收拢残部，与姚苌、姚兴父子长期交战，后来称帝，最终为后秦所败而被擒杀。前秦兵粮渐绝，史书甚至记下军中相食的惨状；这不是勇武的装饰，而是乱世把人逼到尽头的证据。苻登以复仇为志，却未能挽回前秦的覆亡。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0462
    name: 姚泓
    default_gender: male
    archetype: civil
    flavor: （388年—417年）后秦末帝，姚兴之子。姚泓即位时，后秦已被内乱与连年征战掏空；刘裕北伐水陆并进，洛阳、潼关相继失守，长安也失去屏障。他并非没有派兵抵抗，只是朝廷内部再难拧成一股绳，诸将相继降散。长安城破后，姚泓率群臣出降，后秦的旗号至此落地；末帝最难的不是登台，而是接住一个已经裂开的天下。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0463
    name: 沈田子
    default_gender: male
    archetype: military
    flavor: （383年—418年）东晋末年将领，沈林子之兄，随刘裕北伐后秦。沈田子先取洛阳，又随军西进至潼关、长安，锋线一路压到后秦都城；姚泓出降时，他正在这场改朝换代的风暴中心。史载他勇悍果决，后来却因北伐军内部的猜忌死于关中。刀能破城，未必能替持刀的人挡住同袍之间的暗潮。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0464
    name: 沈林子
    default_gender: male
    archetype: military
    flavor: （387年—422年）东晋末至刘宋初年将领，沈田子之弟。沈林子参加伐南燕、灭后秦等战事，作风谨慎恭顺，不像兄长那样锋芒外露，却能在长途征战中把军务办稳。刘宋建立后，他任中领军，掌禁军宿卫，成为刘裕倚重的将领。兄弟一人像出鞘快刃，一人像守在刀后的鞘；开国之军既需要冲锋，也需要有人收束。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0466
    name: 何敬容
    default_gender: male
    archetype: civil
    flavor: （？—549年）南梁宰辅，出身士族，官至尚书令、中书监。何敬容长于案牍与日常政务，处理细务勤勉，却因缺少应对大变的谋略而被讥为“俗吏”。侯景围台城时，他身在这座困城之中，名位与勤劳都没能替梁廷补上兵备和决断的缺口。宰相并非只需把公文批得漂亮，江山真正起火时，还得知道哪一扇门必须先关。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0467
    name: 陈顼
    default_gender: male
    archetype: civil
    flavor: （530年—582年）陈宣帝，陈文帝之弟，早年随兄征战。即位后他整顿内外，发动太建北伐，陈军一度收复淮南，南朝难得显出几分北进的锋芒；可北周灭北齐、势力合一后，陈朝再难守住战果。陈顼不是无所作为的守成君，他确实把刀递过了长江，只是北方换了更大的握刀之手。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 24
      intellect: 44
      defense: 22
      agility: 10
  - key: hist_sljnbc_0468
    name: 孔范
    default_gender: male
    archetype: civil
    flavor: （？—？）陈后主近臣，字法言，能诗善文，常与江总等人在宫中应制宴饮，因亲狎而被称为“狎客”。孔范好作强硬之谈，隋军南下时仍把国势说得固若金汤；言辞再锋利，也挡不住城墙倾颓。陈亡后他被送往长安并遭流放，后世常以他作佞幸误国的反面例子，而真正失守的终究是整个朝廷的判断。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0469
    name: 江总
    default_gender: male
    archetype: civil
    flavor: （519年—594年）南朝文臣、诗人，历仕梁、陈，陈后主时官至尚书令。江总文章华美，能在宫廷宴集间挥笔成篇，却也因长期近侍后主、沉于文酒而被讥为失职宰辅。陈后主朝的衰败有军政、财政与用人等多重原因；但当宰相只剩下陪宴与应制，笔墨再富丽也难遮住台城外的风声。江总的才与失，恰好都写在同一支笔上。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 64
      defense: 18
      agility: 10
  - key: hist_sljnbc_0470
    name: 尔朱兆
    default_gender: male
    archetype: military
    flavor: （？—533年）北魏末年将领，尔朱荣之侄，勇悍而性烈。孝庄帝诱杀尔朱荣后，尔朱兆率军攻入洛阳，俘杀孝庄帝于晋阳，为叔父报仇；但复仇的刀一旦变成执政的刀，便很难再收回。他拥立宗室、把持朝局，暴烈行事使部众与盟友渐离，后来败于高欢，终于自尽。尔朱兆能冲开宫门，却没能为自己的权势筑起一座可守的城。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0471
    name: 尔朱世隆
    default_gender: male
    archetype: civil
    flavor: （？—532年）北魏末年尔朱氏权臣，尔朱荣死后参与拥立与废立，曾一度居于朝廷权力核心。史料对他的评价多偏负面，所长更在权势周旋而非统兵治国；尔朱氏掌朝时，他也卷入搜括与党争。高欢起兵后，尔朱氏的盟局迅速崩解，尔朱世隆随之败亡。乱世里，借家族的刀站上殿陛并不难，难的是当家族的刀先断时，自己还剩什么。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0472
    name: 高延宗
    default_gender: male
    archetype: military
    flavor: （？—577年）北齐宗室，文宣帝高洋之子，封安德王。北周兵临晋阳、高纬弃城南走时，军民仓促推高延宗为帝；他披甲登城，亲自督战，与周军鏖战一昼夜，曾把来势汹汹的敌军逼退。这个帝位没有仪仗，只有城头的尘土，且只维持了极短时间。高延宗的勇力足以守一座危城，却无法替北齐补上朝廷早已裂开的缝。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 12
      defense: 40
      agility: 14
  - key: hist_sljnbc_0473
    name: 高阿那肱
    default_gender: male
    archetype: civil
    flavor: （？—580年）北齐末年权臣，官至右丞相，长期依附高纬与宫中势力。高阿那肱善于迎合，得宠后排斥异己、受赂干政；北周伐齐时，他未能承担起辅国之臣的责任，反使朝局更加涣散。北齐并非只因一名佞臣而亡，但当掌兵与掌政的人都只顾保位，城外的敌军便会发现，城门其实早已从里面松了闩。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0474
    name: 穆提婆
    default_gender: male
    archetype: civil
    flavor: （？—577年）北齐后主近臣，本姓骆，因母亲陆令萱得宠而改称穆提婆，官至尚书左仆射。母子凭借宫廷宠信干预政事、卖官排异，与高阿那肱等共同把持朝局；北周来攻时，他随高纬奔逃，北齐灭亡后降周，旋即被杀。穆提婆的路走得很快，从乳母之子到台阁重臣只隔了几道宫门，跌下去时却连一阶台阶也没有。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0475
    name: 宇文觉
    default_gender: male
    archetype: civil
