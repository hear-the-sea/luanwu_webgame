    avatar: duck_wen_male2.png
    archetype: civil
    flavor: 安世耿人称“财神爷”，富可敌国、交游遍布朝野，表面温文儒雅，实则野心勃勃、心狠手辣。他在汴京暗中豢养死士与奇人异士，以重金与阴谋编织庞大黑网，屡次与诸葛正我及四大名捕隔空斗智，是极难缠的幕后枭雄。出自温瑞安小说《四大名捕》。
