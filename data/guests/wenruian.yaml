    archetype: military
    flavor: 花代珍出身关东豪门，人称“震关东”一脉传人，性情爽烈直率，武艺刚健凌厉。她倾心于冷血，不避险阻相随左右，既有女子细腻柔情，又有江湖豪杰拔剑相助的果敢。面对京城暗流与强敌围堵，她始终以赤诚与热血相守。出自温瑞安小说《四大名捕》。
