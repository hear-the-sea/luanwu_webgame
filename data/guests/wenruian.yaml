    avatar: pig/武005.png
    archetype: military
    flavor: 唐仇是蜀中唐门叛逆奇才，虽失一臂却练就更胜常人的暗器与毒功，出手诡谲狠辣、防不胜防。他心中积郁深重怨恨，行事偏执疯狂，曾以一己之力搅动京师风云、逼得四大名捕疲于应对，是江湖中令人胆寒的绝命刺客。出自温瑞安小说《四大名捕》。
