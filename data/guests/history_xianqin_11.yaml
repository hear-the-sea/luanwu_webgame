    avatar: duck_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）商朝贤相，名臣伊尹之子，辅佐商王太戊执政。相传朝堂生祥桑谷、一暮大拱，太戊心生畏惧，伊陟进言“妖不胜德”，劝王反思政事、修德安民。太戊从其言，祥桑遂枯，商道复兴，诸侯重归朝贡，史称中宗之治。
