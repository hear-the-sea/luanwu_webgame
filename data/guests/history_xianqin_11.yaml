    avatar: monkey_wu_male4.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）战国末期赵国名将兼纵横家，早年曾师从鹖冠子。前242年率赵军大破燕师、擒杀燕将剧辛，威震北方；次年合纵赵、楚、魏、韩、燕五国联军伐秦，一度攻至蕞地，成为山东六国最后一次大规模合纵攻秦的统帅，其军事与策论皆为一时之杰。
