    name: 计然
    avatar: monkey/其他随机角色/文041_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋末期思想家与理财家，姓辛字文子，博学多才而隐居不仕，范蠡曾拜其为师。他提出“平粜”“积著之理”等经济思想，主张丰年收储、灾年平价售粮，顺应时节旱则资舟、水则资车。越王勾践采纳其策七中之五，遂使越国富强而灭吴。
