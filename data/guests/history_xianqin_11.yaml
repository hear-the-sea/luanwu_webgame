    avatar: monkey/其他随机角色/武047_男.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）战国初期墨家大弟子，字慎子，曾学于子夏，后倾心归附墨翟，追随三年而尽得其学。他尤为精通守城器械与防御工事，当公输般为楚国造云梯谋攻宋国时，禽滑厘率三百墨家弟子持守圉之器登宋城待敌，终令楚王罢兵，是墨家实践“非攻”的中坚。
