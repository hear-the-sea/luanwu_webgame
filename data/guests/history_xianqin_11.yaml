      agility: 14
  - key: hist_xianqin_0611
    name: 匡章
    avatar: pig/武048.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）战国时期齐国名将，字子章。齐威王、齐宣王与齐湣王三朝皆倚为柱石，曾率齐军抵御秦军、五十日攻破燕国都城，又于垂沙之战统齐韩魏联军大破楚军斩杀唐昧，再率三国联军攻破秦函谷关。其用兵果决善战，且因恪守孝道为孟子所称道。
