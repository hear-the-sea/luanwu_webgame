    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋时期虞国名臣。晋献公以垂棘之璧、屈产之乘向虞国借道伐虢时，他极力劝谏虞公，提出“辅车相依，唇亡齿寒”的著名论断，力陈虢亡则虞必随亡。虞公贪利不听，宫之奇遂率族人离虞，同年冬晋灭虢后果然顺道灭虞，其远见卓识留名青史。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 50
      defense: 22
      agility: 16
