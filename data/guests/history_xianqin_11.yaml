    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: （约前635年—前586年后）春秋时期周王室大夫，周襄王之孙。秦军东袭郑国途经洛邑时，他年幼即洞察秦师无礼必败；后楚庄王陈兵周疆问九鼎轻重，他从容对以“在德不在鼎”，以辞令捍卫周室尊严，留下“问鼎中原”的千古典故。
