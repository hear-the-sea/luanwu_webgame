    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）战国中期纵横家，苏秦之弟，活跃于燕、齐、赵、秦诸国之间。他善察列国虚实与君王心理，曾助燕昭王行反间削弱齐国，又以“鹬蚌相争，渔翁得利”的寓言劝止赵惠文王伐燕，化解两国干戈，其游说之术与机变智谋不逊其兄。
