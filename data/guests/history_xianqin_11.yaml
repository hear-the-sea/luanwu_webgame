    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）商朝末期贤臣，原隐居于鱼盐市井之间，后得周文王举荐仕商，为商纣王所任用。周武王兴师伐商时，胶鬲奉命往探周军进兵日期，武王不顾大雨疾行如期而至以保全其信。孟子曾将胶鬲与傅说、百里奚并列，赞其出身微贱而堪大任。
