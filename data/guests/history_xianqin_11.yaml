    avatar: pig/文031.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西周宣王时期贤相，樊国国君，封樊侯。他辅佐周宣王治理朝政、奉命城齐，处事刚柔并济、不畏强御也不欺鳏寡；曾切谏宣王不可废长立幼干涉鲁国君位，亦劝谏不宜料民于太原。《诗经·大雅·烝民》专为颂其德业而作。
