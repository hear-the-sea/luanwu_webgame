    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋时期郑国大夫，以辩才与外交智谋著称。前630年晋秦联军围郑，危急之际年迈的烛之武夜缒出城面见秦穆公，洞悉晋秦利害矛盾，陈说亡郑只益于晋而无利于秦，成功说服秦军退兵并留将戍守郑国，化亡国之危于无形。
