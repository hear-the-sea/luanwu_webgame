    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋时期楚国申公，本名屈巫，字子灵。因与令尹子重、司马子反结怨并携夏姬奔晋，其宗族在楚遭屠戮。巫臣遂向晋景公献联吴制楚之策，亲赴吴国教吴人乘战车、习射御阵法，使吴国迅速崛起并连年疲楚，深刻改变了春秋后期的列国格局。
