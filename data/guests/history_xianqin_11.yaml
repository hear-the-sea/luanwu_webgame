    avatar: pig/文035.png
    default_gender: male
    archetype: civil
    flavor: （？—前645年）春秋前期齐国名臣，齐庄公曾孙。他为人敦厚谦逊，居高位而不忘民瘼，辅佐齐桓公与管仲理政外交，曾出使秦晋调停国事。管仲病重时，桓公问以后事，管仲力荐隰朋可掌国政；然隰朋在管仲卒后不久亦病逝，齐国霸业遂渐衰微。
