    name: 君王后
    avatar: monkey_wen_female1.png
    default_gender: female
    archetype: civil
    flavor: （？—前249年）战国后期齐襄王之后，太史敫之女。齐襄王流亡莒地时她慧眼识人私相扶持，襄王复位后立为王后。襄王卒后，其子齐王建年幼，君王后临朝佐政四十余年，谨事秦而睦邻邦，曾一锤击碎秦始皇所赐玉连环以解难，使齐国在战国末世得以偏安。
