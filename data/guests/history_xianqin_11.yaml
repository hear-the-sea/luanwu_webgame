    default_gender: male
    archetype: military
    flavor: （生卒年不详）战国时期楚国名将，楚庄王后裔。楚威王或楚顷襄王时，他奉命率军溯沅水西征，平定巴、黔中以西之地，直抵滇池一带，开辟疆土数千里。后因秦军夺取楚国黔中郡而归路断绝，遂率众变服从俗、留居当地建立滇国，开启西南边疆与中原文化交融的新篇。
