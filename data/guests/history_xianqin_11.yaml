    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: （前852年—前775年）西周宣王时期重臣、名将兼诗人，兮氏，名甲，字伯吉父。他奉命率军北伐猃狁，追击至太原而大获全胜，稳定西周北疆，辅佐宣王成就中兴。同时文采斐然，传为《诗经》中《六月》《崧高》《烝民》等名篇作者，文武兼资。
