    default_gender: female
    archetype: civil
    flavor: （约前690年—？年）春秋前期卫国公主，姬姓，嫁于许穆公为夫人，是中国文学史上第一位留名青史的女诗人。前660年狄人攻破卫国、卫懿公战死，她不顾许国大夫阻拦，毅然驰马归国吊唁并四处求援，途作《诗经·鄘风·载驰》，满怀忧国救亡之志。
