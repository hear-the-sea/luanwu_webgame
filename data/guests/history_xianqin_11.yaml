    avatar: pig_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （？—前632年）春秋时期楚国令尹、名将，字子玉，受子文举荐执掌军政。他性情刚烈、治军严明，在城濮之战中率楚军主力追击晋师，因轻敌中晋文公退避三舍之计而大败。战后退至连谷，羞于见楚成王与国人，遂引咎自刎以谢败军之责。
