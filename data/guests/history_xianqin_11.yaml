    avatar: pig/武052.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）西周宣王时期资深名将。荆蛮蠢动犯边时，年事已高的方叔受命挂帅，统率战车三千乘南征，军容严整、旗鼓相望，以威势震慑荆蛮而使其归服。《诗经·小雅·采芑》盛赞其“方叔元老，克壮其犹”，是宣王中兴的重要柱石。
