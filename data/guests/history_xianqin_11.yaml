    avatar: pig/文021.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋时期秦国名医。前581年晋景公病重，遣使求医于秦，秦桓公派医缓前往诊治。医缓尚未抵晋，便已洞悉病势；抵后切脉诊断，直言疾已居肓之上、膏之下，攻之不可、达之不及、药不至焉，遂辞归，留下“病入膏肓”的千古医案与典故。
