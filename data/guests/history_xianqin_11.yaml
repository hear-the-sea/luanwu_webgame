  - key: hist_xianqin_0616
    name: 告不害
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）战国中期思想家，世称告子，曾游学于儒墨之间。他与孟轲展开著名的“人性之辩”，提出“生之谓性”“食色，性也”以及“性无善无不善”的见解，以湍水决东决西喻人性可塑，虽遭孟子反驳，其朴素自然人性论仍在中国哲学史上占有重要地位。
