    avatar: pig_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （？—前473年）春秋末期吴国太宰，原为楚国名臣伯州犁之孙，因家族蒙难奔吴，得伍子胥举荐而受吴王阖闾重用。吴王夫差在位时，伯嚭贪图越国贿赂，屡次进谗排挤伍子胥并促成放归勾践，致吴国由盛转衰。越灭吴后，勾践以不忠之罪将其处死。
