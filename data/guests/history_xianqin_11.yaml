    avatar: monkey_wu_male6.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）战国末期秦国名将。前236年与王翦、杨端和分道伐赵，连克邺、安阳等城；前234年统军攻赵平阳，斩杀赵将扈辄，歼敌十万，战功显赫。次年进军宜安时遭赵将李牧伏击大败，此后去向史载不详，但其早年攻城略地之功在秦灭六国进程中颇为显赫。
