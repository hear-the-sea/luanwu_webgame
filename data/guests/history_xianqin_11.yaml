    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋前期卫国人，家贫为商，赶车至齐国东门外，在车下喂牛时叩击牛角而歌《南山粲》，抒发怀才不遇之志。齐桓公夜出迎客闻其歌声，识为奇才，遂破格拜为大司田，掌管齐国农政与垦殖，与管仲、鲍叔牙、隰朋等共成齐国霸业。
