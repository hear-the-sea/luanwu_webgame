    avatar: pig_wu_male4.png
    default_gender: male
    archetype: military
    flavor: （？—前244年）战国末期秦国名将，历仕秦昭襄王、孝文王、庄襄王与秦王政四朝。长平之战中先任主将攻拔上党，后改任副将配合白起合围歼灭赵军主力；此后又统军围攻邯郸、击破魏韩联军、攻取上党诸城，一生征战沙场，是秦国东扩的核心将领之一。
