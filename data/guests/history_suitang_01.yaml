heroes:
  orange:
  - key: hist_suitang_0001_lishimin
    name: 李世民
    default_gender: male
    archetype: military
    flavor: （598年-649年）唐代第二位皇帝，亲历隋末群雄并以武功定鼎。玄武门之变后登基，能收揽旧怨、广开言路，重用房玄龄、杜如晦、魏征等，以制度整饬与轻徭薄赋推动"贞观之治"。对外击破东突厥、经营西域，奠定大唐盛世根基；但夺嫡流血亦成为其政治才能背后的阴影，功业与手段并存。其治世之名由此确立，也因权力起点而更显复杂。
    growth_range:
    - 9
    - 14
    attribute_weights:
      force: 42
      intellect: 24
      defense: 22
      agility: 12
  - key: hist_suitang_0002_yangjian
    name: 杨坚
    default_gender: male
    archetype: military
    flavor: （541年-604年）隋文帝，凭北周外戚与重臣身份受禅建隋，继而灭陈一统。其在位整顿吏治、修律令、务节俭，推动均田与赋役制度运行，形成"开皇之治"。科举取士在其朝逐步制度化，弱化门阀世族垄断。晚年围绕太子更易与宫廷权力生变，隋室由盛转衰的伏线亦在此埋下；其身后死因与宫闱传闻多有争议。其治下的统一与集权既是盛世起步，也是隐患积累。
    growth_range:
    - 8
    - 13
    attribute_weights:
      force: 38
      intellect: 28
      defense: 22
      agility: 12
  purple:
  - key: hist_suitang_0003_wuzhao
    name: 武曌
    default_gender: female
    archetype: civil
    flavor: （624年-705年）唐高宗后、武周皇帝，亦是中国历史上唯一自立称帝的女性。她由才人入宫，凭政治手腕掌控中枢，690年改国号周。其治下扩大科举取士、重用能臣以整饬吏治，同时倚重酷吏与严刑以压制反对，朝局锋利而高效。她既能用狄仁杰等人稳住国本，也以强势改写宗室与外戚格局；无字碑不言褒贬，正合其功过并陈的身后名。
    growth_range:
    - 8
    - 11
    attribute_weights:
      force: 12
      intellect: 54
      defense: 22
      agility: 12
  - key: hist_suitang_0004_libai
    name: 李白
    default_gender: male
    archetype: civil
    flavor: （701年-762年）唐代诗人，才情纵逸，善以夸张想象写山河与人生。早岁漫游四方，入长安受荐又不得久留，诗名却因此传播天下。安史之乱后卷入永王事件而遭流放，途中遇赦，漂泊更深。他既能写"长风破浪"的豪气，也能写"举杯邀明月"的孤清；仕途屡挫，却以语言的光芒把盛唐的自信与不羁留在诗史。他把个人性情写成时代气象，后世以此辨认盛唐。
    growth_range:
    - 7
    - 12
    attribute_weights:
      force: 15
      intellect: 52
      defense: 18
      agility: 15
  - key: hist_suitang_0005_dufu
    name: 杜甫
    default_gender: male
    archetype: civil
    flavor: （712年-770年）唐代诗人，身逢由盛转衰的大时代。安史之乱前后辗转流离，入仕短暂却目睹民生凋敝，于诗中记录饥馑、征役与家国裂痕，故被称为"诗史"。他不以奇崛取胜，而以沉郁顿挫的节制与同情心穿透现实；既写宫阙与典礼，也写茅屋、饥寒与战火。个人困顿与国家忧思交织，使其诗成为理解唐代社会的长期坐标。他用一生把悲悯写成史料，也写成诗的良知。
    growth_range:
    - 7
    - 12
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_suitang_0006_lijing
    name: 李靖
    default_gender: male
    archetype: military
    flavor: （571年-649年）唐初名将与兵法家，历经开国征战而成一代统帅。其军事生涯以平定割据、经营边防见长，破东突厥、征吐谷浑等战事使唐朝北疆大定。史传称其用兵谨严，善于审势与统筹后勤，不以勇武逞一时。晚年居功自守，得以善终；《李卫公问对》被后世奉为谈兵要籍，既留下战功，也留下方法。后世评其能将能相，正是初唐军事与政治融合的写照。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 40
      intellect: 26
      defense: 24
      agility: 10
  - key: hist_suitang_0007_guoziyi
    name: 郭子仪
    default_gender: male
    archetype: military
    flavor: （697年-781年）中唐名将，安史之乱中屡任主帅，参与收复长安、洛阳并稳定关中局势。其功高而能自抑，善于与朝廷、藩镇、宦官等多方周旋，故得以历事多朝而名望不坠。史书称其治军宽简而能得众心，乱后仍以威望镇抚边镇。后世敬其"功成而不逼主"的分寸，也因此把他视作乱世功臣少见的全身之例；在功名与猜忌之间仍能存身，亦见其政治分寸。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 38
      intellect: 28
      defense: 26
      agility: 8
  - key: hist_suitang_0008_xuanzang
    name: 玄奘
    default_gender: male
    archetype: civil
    flavor: （602年-664年）唐代僧人，俗名陈祎，以求法之志远行天竺。其西行历时多年，往返万里，携回大量佛典梵本与见闻资料，归国后主持译经，推动法相学说体系化。其行记《大唐西域记》兼具地理、民族与宗教信息，为研究中亚与印度古史的重要文献。玄奘并非神话人物，而是以严谨学问与惊人毅力完成一场学术远征，其"求真"精神亦因此被后世反复引用。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 10
      intellect: 58
      defense: 18
      agility: 14
  - key: hist_suitang_0009_fangxuanling
    name: 房玄龄
    default_gender: male
    archetype: civil
    flavor: （579年-648年）贞观名相，长于谋划与统筹，后世以"房谋杜断"概括其与杜如晦分工。其辅佐唐太宗处理政务、整饬制度，重视选任与奏议，使贞观政治更趋成型。史书称其为相谨慎，不喜矜伐，善于在激烈的开国功臣集团中维持秩序与效率。除政务外，他亦参与修史等文治工程。其功不在一役一战，而在把新王朝的运转方式落实到日常细节。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 14
      intellect: 50
      defense: 24
      agility: 12
  - key: hist_suitang_0010_weizheng
    name: 魏征
    default_gender: male
    archetype: civil
    flavor: （580年-643年）唐代谏臣，以直言敢谏著称。早年曾依附太子李建成，玄武门后仍被太宗重用，体现贞观初年用人不拘旧怨的政治风格。其奏疏多切中制度与人事之病，如《谏太宗十思疏》强调居安思危、节制欲望。太宗所谓"以人为镜，可以明得失"与其相互成就：明君愿听逆耳，贤臣敢言是非。魏征的意义不在于每一条建议都被采纳，而在于把"可受批评"变成朝廷自我校正的习惯。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 52
      defense: 22
      agility: 14
  - key: hist_suitang_0011_direnjie
    name: 狄仁杰
    default_gender: male
    archetype: civil
    flavor: （630年-700年）武周时期重臣，历任地方与中枢要职，以持重与识人著称。其在武则天朝多次入相，既能处理疑狱，又能以大局为先缓和朝廷震荡。史载其屡以言谏与举荐稳住政局，亦力保李唐宗室血脉，为后来的复唐创造条件。后世小说与公案常借其形象铺陈断案传奇，但真实的狄仁杰更像一位善于在权力高压下保持法度与尺度的政治人物，功在"稳住局面"。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 14
      intellect: 50
      defense: 24
      agility: 12
  - key: hist_suitang_0012_yanzhenqing
    name: 颜真卿
    default_gender: male
    archetype: civil
    flavor: （709年-784年）唐代书法家与官员，楷书雄健端正，后世称"颜体"，与柳公权并列为取法典范。安史之乱中其守城起兵，秉持忠义，写下《祭侄文稿》以记家国之痛，文字与书法同具震撼。晚年奉命出使叛镇，终遭害而殉国。颜真卿的历史形象并不依赖传说：一方面是艺术上的规范与气骨，另一方面是乱世中坚持原则的官员人格，两者相互印证，遂成千古重名。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 16
      intellect: 48
      defense: 24
      agility: 12
  - key: hist_suitang_0013_chairong
    name: 柴荣
    default_gender: male
    archetype: military
    flavor: （921年-959年）后周世宗，五代少见的强势改革者。其在位时间不长，却能整顿军纪、裁抑冗费、改善财政与兵制，使后周一度呈现"由乱入治"的气象。对外多次用兵，试图打开北方战略空间并削弱割据势力，为统一奠基。史书称其勤于政务，敢用人才而不惮触动既得利益。其早逝使大业未竟，后世常以"若假以岁月"感叹其潜力；而其改革遗产亦为宋初整合天下提供了现实基础。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 40
      intellect: 24
      defense: 26
      agility: 10
  - key: hist_suitang_0015_liyuan
    name: 李渊
    default_gender: male
    archetype: military
    flavor: （566年-635年）唐朝开国皇帝，隋末动乱中据太原起兵，入关定都长安，完成从地方势力到新王朝的转换。其治国更多依赖宗室与旧部，重在稳住局面、承接隋制并安抚关中。玄武门之变后退居太上皇，开国功业被太宗贞观光芒遮蔽，但没有李渊的起兵与定鼎，盛唐亦无从谈起；他擅长在乱局里抓住窗口，却未能驾驭家族内部的权力竞争。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 36
      intellect: 24
      defense: 26
      agility: 14
  - key: hist_suitang_0016_duruhui
    name: 杜如晦
    default_gender: male
    archetype: civil
    flavor: （585年-630年）贞观宰辅，与房玄龄并称，后世以"房谋杜断"形容其善决断、能在关键时刻拍板。其早从秦王府幕僚起步，玄武门后入相，处理政务利落，重效率而不喜冗文。惜英年早逝，太宗为之恸惜并优礼追赠。杜如晦的贡献不在宏大理论，而在把复杂局面迅速落到可执行的决策上，是贞观政治得以运转的"决断之刃"；其早逝也使贞观少了一只断事的手。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 14
      intellect: 50
      defense: 24
      agility: 12
  - key: hist_suitang_0017_lilongji
    name: 李隆基
    default_gender: male
    archetype: civil
    flavor: （685年-762年）唐玄宗，前期任用姚崇、宋璟等整饬吏治与财政，开创"开元"盛世气象。其晚年政治判断失衡，重用李林甫、杨国忠，边镇节度使势力坐大，安史之乱爆发后仓皇西奔，盛世转入大乱。玄宗并非简单昏君：他既能建立高效官僚运转，也在享乐与权力结构变化中失去制衡能力。一生宛如分水岭，前半是高峰，后半是裂痕。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 20
      intellect: 44
      defense: 24
      agility: 12
  - key: hist_suitang_0018_hanyu
    name: 韩愈
    default_gender: male
    archetype: civil
    flavor: （768年-824年）唐代文人与官员，古文运动的旗手之一，主张以质朴有力的散文重振儒家论述。其文锋锐，敢批佛骨迎奉，遂被贬潮州，却在地方仍能兴学济民。韩愈的影响不仅在作品，更在"文以载道"的姿态：他把文章当作公共议论的工具，推动中唐思想与文学的转向。其后学者从欧阳修到苏轼皆受其启发，韩愈由此成为连接唐宋文脉的重要节点。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 54
      defense: 22
      agility: 12
  - key: hist_suitang_0019_huineng
    name: 慧能
    default_gender: male
    archetype: civil
    flavor: （638年-713年）禅宗重要人物，后世尊为六祖，与"顿悟"思想联系最紧密。其生平在史传与宗门传说中层层叠加，细节未必尽可考，但其思想影响确实深远：强调心性觉悟与日用修行，推动禅宗从经院式阐释转向更贴近生活的实践。与神秀等人之争被后世构造成"南北宗"叙事，既有宗门竞争，也有思想分化。慧能的意义不在神异故事，而在于他为中国佛教提供更简化、可传播的修行语言，使禅宗成为影响中国文化气质的重要力量。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_suitang_0020_yaochong
    name: 姚崇
    default_gender: male
    archetype: civil
    flavor: （651年-721年）开元初年宰相，务实而敢于兴革。其关注吏治与选任，强调整顿积弊、提高行政效率，与宋璟并称"姚宋"，共同塑造玄宗前期的清明风气。姚崇不以空谈取名，而以具体措施应对财政、军政与地方管理的难题；史书亦记其处事强硬，容易得罪人。正因敢动旧习，他才能在盛世起步阶段压住官场松散，把"盛世"从口号变成可运行的治理状态。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 14
      intellect: 50
      defense: 24
      agility: 12
  - key: hist_suitang_0021_songjing
    name: 宋璟
    default_gender: male
    archetype: civil
    flavor: （663年-737年）唐代名相，以清正峻切著称。其为相时直面权贵与弊政，强调法度与节俭，屡以坚决态度纠正朝廷风气，因此常与姚崇并称。宋璟的特点是不愿讨好：敢说难听话，也敢在制度与人事上做"刹车"，使开元政治更有底线。其刚直亦意味着不善周旋，仕途起落不免；但正因为难以折腰，他才更像盛世里的一块硬石，提醒权力保持自律。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 14
      intellect: 50
      defense: 26
      agility: 10
  - key: hist_suitang_0022_zhangjiuling
    name: 张九龄
    default_gender: male
    archetype: civil
    flavor: （678年-740年）开元名相兼诗人，出身岭南而入主中枢，是唐代用人广度的象征之一。其在朝重视选贤与风纪，性情端方，敢于指出边镇用人隐患，反对以逢迎取宠。被罢相后，言路日窄，后世常将其视为盛世转折处的标志人物。诗名如"海上生明月"清朗悠远，与其政治品格相映。张九龄的价值在于把原则感带进权力核心，虽难改写大势，却留下可循尺度。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 52
      defense: 24
      agility: 12
  - key: hist_suitang_0023_zhangxu
    name: 张旭
    default_gender: male
    archetype: civil
    flavor: （675年-约750年）唐代书法家，狂草代表，号称"草圣"。其书风奔放，线条如骤雨旋风，往往以一气呵成见精神，不拘成法却自成法度。史载其性情放达，好酒善舞剑，艺术灵感常来自生活的极端状态；这类传闻或有夸张，但其作品确把草书推向更强调速度与气势的境界。张旭最令人震撼的，正是这种突破：让书法不只是一种规范书写，而成为情绪与力量的直接呈现。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 16
      intellect: 48
      defense: 20
      agility: 16
  - key: hist_suitang_0022_zhuwen
    name: 朱温
    default_gender: male
    archetype: military
    flavor: （852年-912年）唐末军阀，起自黄巢军后转而归唐，凭藩镇兵权步步上位。其挟持唐廷、清除异己并最终取代唐朝建立后梁，标志五代乱世的开端。史书多记其用权残酷、猜忌深重，手段不择，却也能在瓦解的制度上搭起新的军政架构。晚年内斗激烈，终被子所弑。朱温并非乱世偶然，而是藩镇体系走到尽头时最尖锐的产物；他留下的不是统一，而是一套以武力更迭的规则。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 38
      intellect: 20
      defense: 28
      agility: 14
  - key: hist_suitang_0023_liji
    name: 李勣
    default_gender: male
    archetype: military
    flavor: （594年-669年）原名徐世勣，后赐姓李。其从瓦岗起家，转入唐军后屡立战功，参与平定东突厥、经营西北并征讨辽东等重大行动，是唐代持续数十年的战略骨干。除用兵外，他亦善于在太宗、高宗两朝之间保持政治安全，既能领兵远征，也能处理边镇与朝廷关系。李勣的厉害不在传奇一役，而在长期稳定的军事执行力，像一根贯穿初唐的脊梁。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 38
      intellect: 24
      defense: 26
      agility: 12
  - key: hist_suitang_0024_lideyu
    name: 李德裕
    default_gender: male
    archetype: civil
