    flavor: （生卒年不详）字子仲，东海朐人，徐州富商世家。刘备领徐州时，糜竺倾家资相助，又以妹嫁刘备，助其重整军力。建安元年（196年）吕布袭取下邳，糜竺随刘备转徙，始终不离。刘备入益州后拜其为安汉将军，班位在军师将军诸葛亮之右，赏赐优厚，后因其弟糜芳降吴而惭恨成疾，不久去世。
