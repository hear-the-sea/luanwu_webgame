    avatar: pig/文029.png
    default_gender: male
    archetype: civil
    flavor: （？—222年）字子初，零陵烝阳人，蜀汉重臣。少有才名，刘表屡次征辟皆不就，后归曹操，奉命招降荆南，因形势变化辗转入蜀。刘备入蜀时，刘巴屡谏刘璋勿迎刘备，未被采纳。益州平定后任尚书令，建议铸造直百钱、平抑物价以充实府库，又与诸葛亮等共定《蜀科》。
