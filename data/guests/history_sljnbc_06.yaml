    - 9
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0252
    name: 刘禅
    default_gender: male
    archetype: civil
    flavor: （207年—271年）乐不思蜀，亡国之君。涿郡涿县人，刘备之子，蜀汉第二任也是末代皇帝，在位四十一年。长坂坡之战时他尚在襁褓，由赵云怀抱杀出重围得以保全。他在诸葛亮辅佐下度过前半生，诸葛亮事无巨细皆亲力亲为，他只需无为而治。诸葛亮去世后他逐渐重用宦官黄皓，朝政日非。魏将邓艾偷渡阴平直逼成都，他在谯周劝说下不战而降，蜀汉灭亡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 20
      intellect: 40
      defense: 20
      agility: 20
  - key: hist_sljnbc_0258
    name: 邓芝
    default_gender: male
    archetype: civil
    flavor: （178年—251年）刚正不阿，重修吴盟。义阳新野人，汉光武帝刘秀的后裔。他早年入蜀避乱，刘备入蜀后他历任县令，政绩卓著。刘备驾崩后蜀吴关系紧张，他奉诸葛亮之命出使东吴。面对孙权的犹豫和威胁，他从容不迫，晓以利害，言辞恳切却不卑不亢。孙权问他若吴蜀联军灭魏后天下当如何处置，他坦然答曰"各安其分"，以坦诚赢得了孙权的敬重。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 56
      defense: 22
      agility: 10
  - key: hist_sljnbc_0260
    name: 孙尚香
    default_gender: female
    archetype: military
    flavor: （？—？）东汉末年至三国时期女性人物，吴郡富春人，孙权之妹，刘备之妻。史书记载她名不详，后世多以“孙尚香”称之。她性格刚烈尚武，有其父兄之风，左右侍婢百余人皆执刀侍立。赤壁之战后为巩固孙刘联盟，孙权将她嫁给刘备。刘备每次入内寝都心怀畏惧，诸葛亮也认为"主公在公安，北畏曹操之强，东惮孙权之逼，近则惧孙夫人生变于肘腋之下"。
