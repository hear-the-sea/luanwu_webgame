    name: 季冶
    default_gender: male
    archetype: civil
    flavor: 季冶，不以军功显名，然每逢邦国危疑，辄受命安辑地方。其理事不务速效，先察民情利弊，次第施为。遇积年旧弊，则徐徐厘正，不使更张骤急而扰民。任内赋役均平，狱讼渐稀，所治之邑久而益安。其详备事迹，史籍记载有限。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 52
      defense: 23
      agility: 14
  - key: hist_xianqin_0478
    name: 高偃
    default_gender: male
    archetype: civil
    flavor: 高偃，先秦人物，史籍记载有限。其名或与齐国高氏人物相关，但具体行迹难详。传世文献只留下春秋世族人物的片段轮廓。
    growth_range:
