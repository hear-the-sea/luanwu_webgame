    name: 高无丕
    default_gender: male
    archetype: civil
    flavor: 高无丕，先秦人物，史籍记载有限。除姓名外，其官职、事功与结局皆难详考。传世材料只保存了一个古籍残名，不足以补出具体政务能力或学术主张。
    growth_range:
