  - key: hist_xianqin_0459
    name: 长沮
    default_gender: male
    archetype: civil
    flavor: 《论语·微子》中的隐者，与桀溺并耦而耕。孔子周游至河津，子路替老师问路，长沮却反问“执舆者为谁”，以此讥刺孔子不知世道的渡口。几句答话便不再见于史书，却留下了一道尖锐的岔路：是入世涉险，还是守在田畔看天下水涨。长沮不拔剑，话锋却很利。
