  - key: hist_xianqin_0476
    name: 季公鸟
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）季公鸟，春秋鲁国季氏族人，见于《左传·昭公二十五年》所记季氏家内纠纷。他娶齐国鲍文子之女为妻，生子申，死后其妻季姒与族人私通，事泄后反诬公思展等人，牵连公之等季氏子弟，最终酿成季平子与鲁昭公的对立，昭公出奔。季公鸟本人的官职与政绩，传世材料并无详载。
    growth_range:
