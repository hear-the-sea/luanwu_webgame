    default_gender: male
    archetype: civil
    flavor: （生卒年不详）柳下惠，不独以操守闻名，亦见于其处理公务的分寸感。善统筹财政与人力，使紧绷资源仍可支撑基本秩序，不令理想沦为空谈。其贡献并非轰烈，却常在长期治理中稳稳显现。
