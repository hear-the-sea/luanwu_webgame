  - key: hist_xianqin_0480
    name: 高厚
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）高厚，春秋中期齐国大夫，高固之子，出自世卿高氏。齐灵公晚年废太子光，改立公子牙，命高厚为公子牙之傅。前554年灵公卒，崔杼迎立故太子光，即齐庄公，执公子牙，高厚亦被杀，其家室被崔氏吞并。此后高氏仍有高偃、高止等见于齐国之政。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 56
      defense: 17
      agility: 16
  - key: hist_xianqin_0481
    name: 高固
    avatar: monkey/其他随机角色/文049_男.png
