    flavor: 齐国公族高氏之后。高氏世为齐上卿，春秋时与国氏并为天子所命之守臣。高齮事迹散见于《左传》零散记述，多涉齐卿族间攻伐与盟会。其进退之际，可见齐国世族与公室权力之消长。详细生平史籍记载有限。
