    default_gender: male
    archetype: civil
    flavor: 高止，春秋齐国公族，与高弱同出高氏。《左传》载鲁襄公二十九年，齐诸卿大夫联手逐高止，迫其出奔北燕。其子高竖后据邑以叛。高止在燕事迹，史传无载。
