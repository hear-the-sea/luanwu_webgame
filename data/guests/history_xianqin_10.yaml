heroes:

  blue:
  - key: hist_xianqin_0456
    name: 卞庄子
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）卞庄子，名声未必最显，却常在艰难时局中承担收束纷争的职责。善把空泛议论落回具体条目，令文书、钱粮与吏责彼此咬合，不致各行其是。其治务不倚猛药，宁以连续修补积累成效，故往往后劲更长。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 51
      defense: 18
      agility: 19
  - key: hist_xianqin_0492
    name: 韩厥
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）韩厥，素以稳而能断著称，少空论，多实作。处理边地与腹地事务时，他坚持因地制宜，反对粗暴套用同一尺度。其难得处不在高论，而在能把原则化成可执行的日常秩序。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 17
      intellect: 55
      defense: 22
      agility: 6
  - key: hist_xianqin_0506
    name: 柳下惠
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）柳下惠，不独以操守闻名，亦见于其处理公务的分寸感。善统筹财政与人力，使紧绷资源仍可支撑基本秩序，不令理想沦为空谈。其贡献并非轰烈，却常在长期治理中稳稳显现。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 56
      defense: 16
      agility: 14
  - key: hist_xianqin_0513
    name: 吴王僚
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）吴王僚，相关记述虽散，却仍可见其在关键政务上的稳定手腕。其思路重缓急有序，不以短期胜负透支长期承受，故能在波动中维持基本框架。其风格克制而务实，使其影响多属静水深流。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 13
      intellect: 54
      defense: 21
      agility: 12
  green:
  - key: hist_xianqin_0452
    name: 伯舆
    default_gender: male
    archetype: civil
    flavor: 伯舆，史籍载录有限。主政地方时以沉稳见称，赋役与争讼交织之际，先定章程而后安民心，不以苛急图速效。不慕虚名，着力将芜杂政令梳理为有据可依之常例，使属吏知所守、百姓知所从。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 50
      defense: 16
      agility: 22
  - key: hist_xianqin_0453
    name: 北宫喜
    default_gender: male
    archetype: civil
    flavor: 春秋时卫国公族，北宫氏之后。《左传》昭公二十年载其涉卫灵公朝内乱之事，时齐豹等作难，北宫氏之势于其间举足轻重。其后政治抉择与结局，因记载零落而难窥全豹。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 57
      defense: 23
      agility: 6
  - key: hist_xianqin_0454
    name: 北宫结
    default_gender: male
    archetype: civil
    flavor: 北宫结，卫大夫，襄公朝臣。于公事能辨曲直，断狱不徇私情。每议旧制积弊，辄指其关节不通处，并举替代条目，不务空言。同僚惮其直，然事过多服其公允。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 51
      defense: 17
      agility: 20
  - key: hist_xianqin_0455
    name: 北宫遗
    default_gender: male
    archetype: civil
    flavor: 北宫遗，春秋时卫国大夫，其名略见于《左传》。卫献公出奔之际，北宫遗奉命出使，于列国间斡旋周旋，言辞有节而不失卫之体面。史载零碎，其后行迹无多可考。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 52
      defense: 20
      agility: 12
  - key: hist_xianqin_0458
    name: 鲍牵
    default_gender: male
    archetype: civil
    flavor: 鲍牵，齐大夫，鲍叔牙后裔。庆氏之乱后齐国公室凋敝，牵主理仓廪，先核民口实数再定征调之额。遇灾年辄请缓赋，以保耕织不辍。时人多谓其政不峻刻而有成。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 53
      defense: 20
      agility: 16
  - key: hist_xianqin_0459
    name: 长沮
    default_gender: male
    archetype: civil
    flavor: 长沮，春秋时隐者，与桀溺耦耕于津畔。《论语·微子》载孔子师徒过其地，使子路问津。长沮答语暗讽夫子当自知津，桀溺直言天下滔滔无人可易。二人遂不复见载。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 56
      defense: 18
      agility: 13
  - key: hist_xianqin_0460
    name: 陈逆
    default_gender: male
    archetype: civil
    flavor: 陈逆，齐陈氏（田氏）支族。其人精于律令而能酌情理，处断纠纷不激不随。凡经手之案皆存卷备查，出入有据。齐国多故之际，逆独以持重闻名，不为时势所摇。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 58
      defense: 18
      agility: 13
  - key: hist_xianqin_0461
    name: 鉏麑
    default_gender: male
    archetype: civil
    flavor: 鉏麑，春秋时晋国力士。晋灵公不君，使鉏麑往刺正卿赵盾。晨至其门，见盾盛服将朝，坐而假寐，心敬其勤。麑退而叹曰："贼民之主，不忠；弃君之命，不信。"触庭槐而死。事载《左传》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 51
      defense: 18
      agility: 15
  - key: hist_xianqin_0462
    name: 杜原款
    default_gender: male
    archetype: civil
    flavor: 杜原款，先秦人物，史籍记载有限。现存材料不足以确认其官职、封邑与事功，只能见其名散存于古籍。他不是以完整传记传世的人物，而是列国时代残篇中仍可辨认的姓名。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 17
      intellect: 58
      defense: 17
      agility: 8
  - key: hist_xianqin_0463
    name: 公之
    default_gender: male
    archetype: civil
    flavor: 公之，身世仕履多湮没，仅散见载籍。其为政不逐虚声，务在条理分明。每治一事，先明职守、次定程限，使同僚各知本分。故虽处多事之秋，所辖鲜有推诿紊乱之弊。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 53
      defense: 20
      agility: 16
  - key: hist_xianqin_0464
    name: 公何藐
    default_gender: male
    archetype: civil
    flavor: 公何藐，行事以简明务实见称。遇繁杂政议，辄删繁撮要，编为条目以便乡里遵行。面对积弊，不务骤革，常从小处逐层厘正，以持久修补换取秩序渐复，使执行有据可循。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 57
      defense: 22
      agility: 10
  - key: hist_xianqin_0465
    name: 公父文伯
    default_gender: male
    archetype: civil
    flavor: 公父文伯，春秋鲁国人物，其母敬姜以知礼善训见称，相关故事多见于礼学叙述。文伯本人事迹不算丰厚，却因母教而留名，折射出鲁国贵族家法、礼教与士大夫修身观念。其完整仕履史籍记载有限。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 17
      intellect: 50
      defense: 23
      agility: 10
  - key: hist_xianqin_0466
    name: 公父穆伯
    default_gender: male
    archetype: civil
    flavor: 公父穆伯，史籍记载有限。逢灾荒与徙民交困之际，先固粮秣治安，次及赋役教化，施为有次第。其治事守底限而知变通，故危局下犹能维系数县安稳。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 50
      defense: 22
      agility: 17
  - key: hist_xianqin_0467
    name: 公鉏极
    default_gender: male
    archetype: civil
    flavor: 公鉏极，史载甚略，仅知尝与闻国政。其议事不尚虚辞，每献策必附施行条目与缓急之序。朝命既下，能逐层分解，使小吏亦知所从。时政权屡易，独守成法，赖以过渡之际纲纪不坠。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 57
      defense: 20
      agility: 7
  - key: hist_xianqin_0468
    name: 国佐
    default_gender: male
    archetype: civil
    flavor: 国佐，生卒年不详。其理事不执一法，先察各地物产、民情与惯例，再定缓急次序。或遇腹地与边郡政令相抵，能据实奏请变通，使条规落地而不生硬。史籍记载有限。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 54
      defense: 18
      agility: 13
  - key: hist_xianqin_0469
    name: 国子高
    default_gender: male
    archetype: civil
    flavor: 国子高，生平多见于零散记述。每逢诸方争执不下、局面胶着之际，常被推举主持事务。不急于立威，先理顺旧有条规纰漏，再逐次推行新法。名不显赫，然每遇疑难，同僚多思其周密。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 52
      defense: 16
      agility: 18
  - key: hist_xianqin_0470
    name: 国昭子
    default_gender: male
    archetype: civil
    flavor: 国昭子，生卒年不详。每受托调解争端或督办急务，先明职分与责守，使各曹知所当行。议事不逐高论，唯求条理分明、便于执行，故在政令反复之际仍能稳住局面。史籍记载有限。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 51
      defense: 21
      agility: 15
  - key: hist_xianqin_0471
    name: 国胜
    default_gender: male
    archetype: civil
    flavor: 国胜，事迹零散，然可窥其施政以缓急有序、本末分明为要。不贪短期之功而透支民力，重在立规建制使政令可继。政风克制务实，故于动荡时局中常起稳定之用。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 55
      defense: 21
      agility: 8
  - key: hist_xianqin_0473
    name: 国弱
    default_gender: male
    archetype: civil
    flavor: 国弱，生卒年不详。善理赋役调配与仓廪调度，视岁入丰歉定支出缓急，不因上令急促而倾摇地方。连年多事之秋，力主持重节用，使民力不竭、官库有继。史籍记载有限。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 51
      defense: 23
      agility: 11
  - key: hist_xianqin_0474
    name: 子尾
    default_gender: male
    archetype: civil
    flavor: 子尾，春秋人物，史籍记载有限。其名多附见于列国卿族与政争材料，完整生平已难复原。可以确认的是，他身处贵族政治网络之中，而非后世地方行政语境。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 50
      defense: 17
      agility: 21
  - key: hist_xianqin_0475
    name: 姬亥
    default_gender: male
    archetype: civil
    flavor: 姬亥，处列国纷争之际，治事谨严有度。凡赋税出纳，必立册登记，使账目可循。属吏行事，皆有程限，逾期则按律问责。其治下政令通畅，吏不敢欺，虽逢变局而府库不虚，民力不困。然其生平细节，史籍记载有限。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 51
      defense: 19
      agility: 16
  - key: hist_xianqin_0476
    name: 季公鸟
    default_gender: male
    archetype: civil
    flavor: 季公鸟，先秦人物，史籍记载有限。现存材料不足以确认其官职和事功，只能从零散姓名中判断其属于春秋人物谱系。其史影残缺，名存而事隐。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 50
      defense: 18
      agility: 16
