  - key: hist_xianqin_0479
    name: 高倾子
    default_gender: male
    archetype: civil
    flavor: 高倾子，为人沉静寡言，不事交游，然每逢朝中有难决之务，多见召问策。其施政不逐一时之功，重在修明旧制，使新令与成法相协。凡所更革，必先小试而后推行，故鲜有反复。身后无显赫之名，而所定章程多为后人所循。其早年行迹，史籍记载有限。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 58
      defense: 19
      agility: 10
  - key: hist_xianqin_0480
    name: 高厚
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）高厚，史籍记载有限。其施政以固本为先，不逐短期之功。理民事时衡度地方承受之力，不肯透支将来以充眼前，故虽时局多变，其治下仍得粗安。
    growth_range:
