  - key: hist_xianqin_0516
    name: 孟公绰
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）孟公绰，春秋鲁国大夫，出自三桓孟氏，以清廉寡欲、持身谨慎见称。《论语·宪问》记孔子评他：“为赵、魏老则优，不可以为滕、薛大夫。”意为他担任晋国赵氏、魏氏的家老尚有余裕，却不宜出任滕、薛这类小国的大夫，因其长于守静而短于应务。孔子对人才长短的权衡，也使孟公绰成为后世论用人所长的例子。
