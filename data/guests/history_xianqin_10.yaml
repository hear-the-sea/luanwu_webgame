heroes:

  blue:
  - key: hist_xianqin_0456
    name: 卞庄子
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋鲁国勇士，一说为卞邑大夫。相传他欲刺两虎，馆竖子劝其坐待两虎争食相斗：待一虎死、一虎伤，再上前刺杀伤虎，遂一举而得双虎。后世因以“卞庄刺虎”比喻乘敌自相残杀之机取利。其事迹见于《战国策》《史记》等书。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 51
      defense: 18
      agility: 19
  - key: hist_xianqin_0492
    name: 韩厥
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）春秋晋国大夫，韩氏宗主，谥献，称韩献子。鞍之战中，韩厥任晋军司马，掌军纪刑罚，战后位列卿位。赵氏遭下宫之难后，他以赵衰、赵盾累世有功为言，劝晋景公复立赵武、归还赵氏田邑，赵氏由此复兴。韩氏亦自此渐为晋国望族。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 17
      intellect: 55
      defense: 22
      agility: 6
  - key: hist_xianqin_0513
    name: 吴王僚
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （？—前515年）春秋吴国国君，名僚，吴王夷眛之子。夷眛卒后，僚继位，公子光以其父诸樊为长、王位当传己身，心怀不服。前515年，公子光设宴请僚，使专诸藏鱼肠剑于炙鱼腹中，于席上刺杀僚。僚死，公子光自立为吴王，即阖闾；僚子庆忌出奔在外。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 13
      intellect: 54
      defense: 21
      agility: 12
  green:
  - key: hist_xianqin_0452
    name: 伯舆
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）伯舆，春秋周王室卿士。前563年，他与王叔陈生争夺执政之位，双方家臣在周王庭对讼。伯舆之大夫瑕禽陈述其族自平王东迁时即从行护驾，受赐骍旄之盟，世守其职；又指王叔当政后“政以贿成”，宠臣恣肆。王叔一方不能举出盟契，最终理屈出奔晋国。伯舆保住卿士之位，此事也留下周室衰微、卿权相争的记录。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 50
      defense: 16
      agility: 22
  - key: hist_xianqin_0453
    name: 北宫喜
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）北宫喜，谥贞子，春秋后期卫国卿，出自卫国北宫氏。前515年，鲁昭公因季氏之逼流亡在外，晋、宋、卫等国在扈地会盟，谋议送昭公归鲁；北宫喜与宋国乐祁犁均主张纳公，因晋卿范献子受季孙氏之货，事遂不成。此后北宫氏仍为卫国卿族，参与灵公朝政。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 57
      defense: 23
      agility: 6
  - key: hist_xianqin_0454
    name: 北宫结
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）北宫结，春秋后期卫国卿，出自卫国北宫氏。卫灵公时，公叔戌因富而骄、又欲除去灵公夫人南子之党，招致南子进谗，被灵公驱逐。北宫结与公叔戌交往密切，受此事牵连，于前496年出奔鲁国。此后事迹不见于传世记载。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 51
      defense: 17
      agility: 20
  - key: hist_xianqin_0455
    name: 北宫遗
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）北宫遗，春秋后期卫国大夫，北宫氏成员。卫献公复位后，宁喜以纳君之功专擅国政。北宫遗与宁喜同被晋国拘执，由晋大夫女齐押送先归晋；此后宁喜为卫献公所杀，北宫遗的结局则不见于记载，事见《左传·襄公二十六年》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 52
      defense: 20
      agility: 12
  - key: hist_xianqin_0458
    name: 鲍牵
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）鲍牵，春秋齐国大夫，鲍叔牙曾孙。前574年，他撞见齐灵公之母声孟子与大夫庆克私通，告知执政国佐，国佐因此责问庆克。声孟子怀恨，向灵公诬称高无咎、鲍牵欲废君另立；国佐仅知情。灵公遂刖鲍牵之足，并将高无咎驱逐出齐。此事激化了齐国公室与卿族间的猜忌，次年国佐亦因庆克之死被灵公诛杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 53
      defense: 20
      agility: 16
  - key: hist_xianqin_0459
    name: 长沮
    avatar: pig/文037.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）长沮，春秋隐者，与桀溺并耕于田间，姓名与生平皆不可考，长沮或为形容其身形之号。孔子周游列国时经过其地，命子路问渡口。长沮反问执舆者是谁，得知是鲁国孔丘后说“是知津矣”，语含讥讽；桀溺则劝子路弃避人之士而从避世之士。孔子闻之怃然，仍以“天下有道，丘不与易”自明用世之志。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 56
      defense: 18
      agility: 13
  - key: hist_xianqin_0460
    name: 陈逆
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）陈逆，字子行，春秋末齐国陈氏（田氏）族人，陈恒的同族。齐简公宠信阚止，使与陈恒争政，陈氏与阚止的矛盾日益尖锐。据《左传·哀公十四年》，陈逆曾劝陈恒早作防备，前481年陈氏发难，阚止失败被杀，齐简公亦被弑，田氏由此进一步掌握齐国政权。陈逆在政变中的具体角色，传世记载较为简略。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 58
      defense: 18
      agility: 13
  - key: hist_xianqin_0461
    name: 鉏麑
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）鉏麑，春秋晋国力士，受晋灵公之命刺杀正卿赵盾。他清晨潜入赵宅，见寝门已开，赵盾朝服端坐、因时尚早而假寐，仍不失恭敬之态。鉏麑退而感叹：杀良臣是不忠，背弃君命是不信，二者必居其一，不如一死，遂触庭中槐树而亡。此事见于《左传·宣公二年》，赵盾的谨慎与鉏麑的两难，成为后世称道的君臣伦理故事。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 51
      defense: 18
      agility: 15
  - key: hist_xianqin_0462
    name: 杜原款
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）杜原款，春秋前期晋国大夫，晋献公太子申生的师傅。骊姬欲立其子奚齐，诬申生祭曲沃时所献胙肉有毒，献公怒而杀杜原款。杜原款临死遣人告申生，以“仁不怨君、勇不逃死”相勉；申生不自辩，遂自缢于新城。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 17
      intellect: 58
      defense: 17
      agility: 8
  - key: hist_xianqin_0463
    name: 公之
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）公之，姬姓，春秋中期鲁国季氏族人，季悼子之子、季平子之弟。季氏为鲁桓公之后，季悼子早卒，季平子继其父季武子执政，历昭公一朝而专鲁政。公之之名见于季氏世系与家族内争材料，其本人官职、封邑及生卒年皆不可详考。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 53
      defense: 20
      agility: 16
  - key: hist_xianqin_0464
    name: 公何藐
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）公何藐，春秋后期鲁国季孙氏族人，姓名仅见季氏内争记载，具体事迹无考。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 57
      defense: 22
      agility: 10
  - key: hist_xianqin_0465
    name: 公父文伯
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）公父文伯，名歜，春秋鲁国大夫，公父穆伯之子，敬姜所生。公父氏为季氏别支，文伯承父业列于鲁国卿大夫之列。其事迹多见于《国语·鲁语》，最著名的是他退朝后见母亲敬姜仍在纺绩，敬姜借劳逸之道训诫他不可骄惰；他死后，敬姜又依礼安排丧事，不肯逾制。孔子对敬姜多有称许，文伯本人的政绩则记载有限。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 17
      intellect: 50
      defense: 23
      agility: 10
  - key: hist_xianqin_0466
    name: 公父穆伯
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）公父穆伯，春秋中期鲁国季氏族人，季悼子之子、季平子之弟，公父文伯之父，其妻即后来以礼法教子著称的敬姜。公父氏为季氏别支，穆伯早卒，敬姜守寡教子，事见《国语·鲁语》。穆伯本人的官职与政事，传世材料记载有限。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 11
      intellect: 50
      defense: 22
      agility: 17
  - key: hist_xianqin_0467
    name: 公鉏极
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）公鉏极，春秋后期鲁国季氏分支公鉏氏成员，季武子长子公弥的曾孙。公弥字公鉏，其后以字为氏，别为公鉏氏。前502年，公鉏极与季寤、公山不狃等因不得志于季氏，依附阳虎，参与阳虎谋去三桓之乱；事败后阳虎出奔，公鉏极此后事迹不载于《左传》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 57
      defense: 20
      agility: 7
  - key: hist_xianqin_0468
    name: 国佐
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）国佐，谥武，称国武子，春秋中期齐国上卿，国氏宗主，与高氏并称“天子之二守”。前589年鞍之战齐败，他奉命以纪甗、玉磬及地赂晋求和，应对晋人而不辱使命。前574年，他因庆克与声孟子私通事杀庆克，次年为齐灵公所杀，国氏一族亦受牵连。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 54
      defense: 18
      agility: 13
  - key: hist_xianqin_0469
    name: 国子高
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）国子高，谥成，又称成伯高父，春秋时期齐国国氏族人，国懿伯之孙、国贞孟之子。他在礼书中论葬制，称“葬也者，藏也”，主张衣、棺、椁、土层层相周，使死者不见于外，此说见于《礼记·檀弓》。国氏为齐国世卿，国子高的其他政事则记载不多。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 52
      defense: 16
      agility: 18
  - key: hist_xianqin_0470
    name: 国昭子
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）国昭子，春秋后期齐国国氏族人，名不详，谥昭。其母去世时，他曾向孔子弟子子张询问送葬时男女宾的站位，子张举司徒敬子之丧的旧礼作答，此事见于《礼记·檀弓》。国氏为齐国世卿，与高氏并称“天子之二守”；国昭子的其他政事，传世记载不多。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 13
      intellect: 51
      defense: 21
      agility: 15
  - key: hist_xianqin_0471
    name: 国胜
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）国胜，春秋中期齐国大夫，国氏，国佐之子、国弱之兄。前574年，国佐因庆克与声孟子私通事杀庆克；次年齐灵公以庆氏之难为由诛杀国佐，国胜同时遇害，弟国弱出奔鲁国。国氏一族经此变故，势力一度受挫。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 16
      intellect: 55
      defense: 21
      agility: 8
  - key: hist_xianqin_0473
    name: 国弱
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）国弱，又称国景子，春秋中期齐国大夫，国佐之子。前573年齐灵公诛国佐，国弱出奔鲁国；后来返回齐国，仍为卿大夫。前547年，齐景公赴晋为卫献公说情，国弱任相礼随行。其子国夏即国惠子，后亦为齐卿，与高张共执国政。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 15
      intellect: 51
      defense: 23
      agility: 11
  - key: hist_xianqin_0474
    name: 子尾
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （？—前534年）子尾，名虿，字子尾，春秋齐国大夫，齐惠公之后，高氏与子尾氏皆推他为先。前545年，他与子雅（栾灶）等趁庆氏专权之隙发难，杀庆舍、逐庆封，此后二人同执齐政。子尾卒于前534年，其子高强（子良）继掌高氏，后与栾施一起被陈、鲍氏击败而出奔。子尾一系是春秋晚期齐国“二惠”卿族政治的一支。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 50
      defense: 17
      agility: 21
