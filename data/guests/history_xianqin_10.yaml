    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）孟之侧，又称孟之反，春秋鲁国大夫，孟氏支子。鲁哀公十一年，齐鲁交兵，鲁国右师败退，孟之侧留在最后为全军殿后，掩护士卒撤回。将至城门时，他鞭策自己的马说“非敢后也，马不进也”，把殿后之功推给马不肯前行，不肯自夸。孔子据此称许他“不伐”，《论语·雍也》即以此事称其有功不居。
