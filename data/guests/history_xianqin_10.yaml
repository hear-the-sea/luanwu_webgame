    name: 高弱
    default_gender: male
    archetype: civil
    flavor: 《左传》载，高弱为春秋齐国公族。鲁成公十七年据卢邑叛齐侯，齐遣国佐帅师围之。会齐侯杀国佐于内，高弱遂降。其叛因及降后事迹，经传所记甚略，生平难以详考。
    growth_range:
