    name: 高固
    default_gender: male
    archetype: civil
    flavor: 高固，先秦人物，史籍记载有限。现存材料不足以确认其仕途层级和具体政绩，只能见其名附于高氏人物谱系之中。他的轮廓残缺，却仍可放在齐国世族政治背景下理解。
    growth_range:
