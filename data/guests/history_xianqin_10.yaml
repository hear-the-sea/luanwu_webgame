  - key: hist_xianqin_0478
    name: 高偃
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）高偃，春秋后期齐国大夫，出自世卿高氏。北燕伯款出奔齐国，前530年，齐景公派高偃率师护送其归国，纳于阳地。此事见于《春秋》与《左传》；高偃的世系在传世材料中颇有异文，其与高厚、高止等人的亲属关系尚难确定。
