    default_gender: male
    archetype: military
    flavor: （？—1165年）南宋著名水军将领，字公明，河北乘氏人。早年率义军在山东抗金，归宋后隶属岳飞，后受命组建浙西水师。绍兴三十一年完颜亮大举南侵，李宝率一百二十艘战船、三千水兵北上山东，在唐岛海域借南风施火箭火炮，焚毁金军战船六百余艘，全歼金国水师主力，解临安海防之危。
