    attribute_weights:
      force: 48
      intellect: 12
      defense: 20
      agility: 20
  - key: hist_songliaojinyuan_0714
    name: 张珏
    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: （？—1280年）南宋末年抗蒙名将，字君玉，陇西凤州人。早年随王坚守卫合州钓鱼城，以敢战闻名，军中号为“四川虓将”。王坚调离后接任合州守将，率军民坚守钓鱼城十余年，屡挫元军围攻并主动出击收复泸州、涪州。重庆城破后突围被俘，押赴大都途中绝食自缢，忠烈贯日。
