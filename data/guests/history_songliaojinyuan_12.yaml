    flavor: （1164年—1223年）南宋中期抗金名将，字德夫，绛州人，名将孟珙之父。开禧北伐起显露将才，嘉定年间镇守枣阳，面对金兵多次重兵围城，他亲自登城督战、以火攻破云梯，并组建精锐“忠顺军”驰援唐、邓，名震江汉，金人畏之如虎，称为“孟爷爷”。
