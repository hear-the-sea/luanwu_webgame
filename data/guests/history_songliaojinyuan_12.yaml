    name: 马端临
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （1254年—1323年）宋末元初杰出史学家，字贵与，饶州乐平人。宋亡后隐居乡里，潜心著述二十余年，广泛搜集典籍与宋代史料，撰成三百四十八卷巨著《文献通考》。全书分田赋、钱币、职官、经籍等二十四门，上溯远古、下至南宋，考据翔实、条理明晰，与《通典》《通志》并称“三通”。
