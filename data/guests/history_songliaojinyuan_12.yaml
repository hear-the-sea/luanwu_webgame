    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: （？—1217年）蒙古帝国开国名将，许慎氏，与木华黎、博尔术、赤老温并称成吉思汗麾下“四杰”。自幼为诃额仑太后收养，忠勇果敢，合兰真沙陀之战中曾单骑救出重伤的窝阔台。1206年封千户长并领右翼万户副职，后奉命征讨北方秃马惕部，于密林夜袭中力战阵亡。
