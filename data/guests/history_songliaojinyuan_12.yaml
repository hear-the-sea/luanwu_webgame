    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （约1305年—1371年）元末明初著名戏曲家，字则诚，号菜根道人，温州瑞安人。早年中进士出仕，因不满元末乱政辞官隐居鄞县栎社，专心创作南戏《琵琶记》，以蔡伯喈与赵五娘悲欢离合折射世态人情。全剧曲词典雅深情，被誉为“南戏之祖”，开明代传奇戏曲先河。
