    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （1165年—1220年）金末契丹领袖，东辽政权建立者。原为金朝北边千户，因不满金廷猜忌契丹人，于1212年率众起兵反金，聚众十余万，大败金军于迪吉脑儿，旋即称辽王并归附成吉思汗。此后协助蒙古经略辽东、平定高丽境内契丹余部，保境安民，死后其妻姚里氏奉诏摄政。
