    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （？—1140年）金朝开国元勋、政治家与军事家，本名谷神，完颜阿骨打股肱之臣。他兼通契丹与汉地文字，奉命仿汉字楷书与契丹字创制女真大字，推动女真文化发展。随军征辽伐宋，谋略深沉，熙宗朝官至尚书左丞相兼侍中，后因宫廷权争遭完颜宗弼构陷赐死。
