    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （？—1141年）金朝开国宗室重臣，本名斡本，完颜阿骨打庶长子。金太宗时期协助完颜斜也统筹军国大政，力主废除女真旧日勃极烈合议制，参照唐宋设立三省六部与汉官制度，推动金朝向中原王朝体制转型。熙宗朝位居太师领三省事，辅政有方，深得朝野敬重。
