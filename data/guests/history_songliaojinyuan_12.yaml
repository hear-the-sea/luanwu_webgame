    name: 唆鲁禾帖尼
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （1190年—1252年）蒙古克烈部贵族女子，拖雷正妻，蒙哥、忽必烈、旭烈兀与阿里不哥之母。拖雷早逝后，她婉拒窝阔台改嫁之议，独自抚育诸子并审慎经营封地，礼遇中原儒士、宽容各派宗教、劝课农桑。在贵由汗去世后的汗位角逐中，她以深远政治手腕促成拖雷系登基，深刻改写蒙古帝国历史。
