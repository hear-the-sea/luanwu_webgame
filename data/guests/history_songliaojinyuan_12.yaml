    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: （1115年—1184年）南宋著名史学家，字仁甫，号巽岩，眉州丹棱人。绍兴进士，历官礼部侍郎、敷文阁学士。他仿《资治通鉴》体例，历时近四十年广搜官私史料，撰成九百八十卷巨著《续资治通鉴长编》，详实记载北宋九朝一百六十八年史事，为后世治北宋史者所必读的核心典籍。
