      intellect: 16
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0711
    name: 杨再兴
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: （1104年—1140年）南宋抗金猛将，原为曹成部将，归降岳飞后忠勇异常，屡立战功。绍兴十年岳家军北伐，他在郾城之战单骑闯阵欲擒完颜宗弼，手杀数百人，身被数十创仍浴血力战。旋即率三百轻骑巡逻小商桥，遭遇金军主力，陷马淤泥而不退，矢尽战死，遗体焚得箭镞两升，壮烈震动军中。
    growth_range:
