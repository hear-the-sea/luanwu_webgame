heroes:
  purple:
  - key: hist_songliaojinyuan_0701
    name: 赵顼
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （1048年—1085年）宋神宗，北宋第六位皇帝。即位后锐意革除积弊，起用王安石推行熙宁变法，围绕青苗、募役、保甲与均输等新法重塑财政与军政格局。元丰年间亲自主持改制官僚体系，并经略河湟、开拓熙河诸州。虽因新旧党争剧烈与西夏战事受挫而留下争议，其改革魄力深刻影响了北宋中后期的政治走向。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 16
      intellect: 52
      defense: 18
      agility: 14
  - key: hist_songliaojinyuan_0702
    name: 赵眘
    avatar: pig/文032.png
    default_gender: male
    archetype: civil
    flavor: （1127年—1194年）宋孝宗，南宋第二位皇帝，宋太祖七世孙。即位之初即下诏为岳飞平反昭雪，起用张浚等主战派发动隆兴北伐，力图恢复中原。符离失利后与金订立隆兴和议，转而专注内政，裁汰冗官、整顿吏治、兴修水利，开创“乾淳之治”，被后世公认为南宋最具作为的君主。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 18
      intellect: 50
      defense: 20
      agility: 12
  - key: hist_songliaojinyuan_0703
    name: 钱乙
    avatar: pig_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （约1032年—1113年）北宋著名医家，字仲阳，郓州人，被尊为中医儿科奠基人。他长期精研小儿生理与病理特点，提出五脏辨证体系，善用柔润平和之剂调理稚弱之躯，创制六味地黄丸、泻白散、导赤散等千古名方。门人阎孝忠辑其医论与医案成《小儿药证直诀》，成为现存最早的系统儿科专著。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 10
      intellect: 58
      defense: 20
      agility: 12
  blue:
  - key: hist_songliaojinyuan_0705
    name: 王希孟
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （1096年—约1119年）北宋天才少年画家，早年入徽宗画学，得宋徽宗亲授笔法。十八岁时历时半年绘成青绿山水长卷《千里江山图》，全卷烟波浩渺、层峦叠嶂，以石青石绿渲染出壮丽河山，点缀亭台舟楫与渔村市集，气象恢宏而纤毫毕现。画成不久英年早逝，却凭此孤卷名垂画史。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 10
      intellect: 52
      defense: 14
      agility: 24
  - key: hist_songliaojinyuan_0706
    name: 李唐
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: （约1066年—1150年）两宋之际山水画宗师，字晞古，河阳三城人。早年任职北宋宣和画院，靖康之变后流离南渡，于高宗朝重入临安画院，领衔画坛。他变北宋全景构图为剪裁精练的边角近景，创大斧劈皴表现峭壁山石，代表作《万壑松风图》《采薇图》开南宋院体山水新风，位列南宋四大家之首。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 52
      defense: 18
      agility: 18
  - key: hist_songliaojinyuan_0707
    name: 马远
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （约1140年—1225年）南宋著名画家，字遥父，号钦山，出身绘画世家，历任光宗、宁宗朝画院待诏。他承袭李唐笔法而更趋简练，常以一角山崖、数枝寒梅构图，留白空灵悠远，世称“马一角”。代表作《踏歌图》《寒江独钓图》《水图》意境清绝，与李唐、刘松年、夏圭并称南宋四大家。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 50
      defense: 16
      agility: 24
  - key: hist_songliaojinyuan_0708
    name: 夏圭
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）南宋著名山水画家，字禹玉，钱塘人，宁宗朝任画院待诏，赐金带。他擅以秃笔焦墨施大斧劈皴，水墨淋漓苍润，构图常取半边之景而余韵无穷，时人称“夏半边”，与马远并称“马夏”。代表作《溪山清远图》长卷层次分明、气韵生动，对后世浙派与东亚水墨画影响深远。
    growth_range:
