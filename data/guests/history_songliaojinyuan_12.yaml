      agility: 22
  - key: hist_songliaojinyuan_0709
    name: 刘松年
    avatar: monkey/其他随机角色/文039_男.png
    default_gender: male
    archetype: civil
    flavor: （约1155年—1218年）南宋宫廷画家，钱塘人，因居清波门外，人称“暗门刘”。淳熙年间入画院为学生，绍熙年间升任待诏。他工于山水、人物与界画，画风清丽精工，设色典雅，所绘《四景山水图》《罗汉图》兼具院体严谨法度与江南诗意，为南宋四大家之一。
    growth_range:
