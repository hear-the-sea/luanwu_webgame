  - key: hist_songliaojinyuan_0710
    name: 张宪
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （？—1142年）南宋抗金名将，蜀地阆州人，岳飞麾下第一大将。早年追随岳飞转战荆襄、江南与中原，每逢大敌必身先士卒，屡次代岳飞统领全军。绍兴十年随军北伐，攻克颍昌、陈州、临颍，令金兵闻风丧胆。后遭秦桧罗织“谋反”罪名严刑逼供，宁死不屈，与岳飞、岳云同日遇害。
    growth_range:
    - 6
