      agility: 12
  - key: hist_songliaojinyuan_0715
    name: 耶律屋质
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: （916年—972年）辽朝开国后柱石重臣，字敌辇，契丹孟父房后裔。辽太宗死后，他以忠正威望化解皇位之争，拥立世宗；察割弑君作乱时，他率诸部火速平叛并迎立穆宗；穆宗遇弑后又辅立景宗，三定国难而不居功。官至北院大王，沉毅有大略，为辽朝前期政局稳定立下汗马功劳。
