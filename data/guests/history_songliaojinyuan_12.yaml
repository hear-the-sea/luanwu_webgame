    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （1131年—1205年）南宋史学家、官员，字机仲，建安人。因感《资治通鉴》卷帙浩繁、头绪分散，乃以历史事件为纲，精选二百三十九个专题重新编排始末，著成《通鉴纪事本末》。此书首创纪事本末体，与纪传体、编年体鼎足而立，极大便利了后世研读史事脉络。
