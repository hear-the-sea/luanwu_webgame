    default_gender: male
    archetype: military
    flavor: （1120年—1164年）南宋山东抗金名将，字彦威，宿迁人。绍兴三十一年率三百义士夜袭攻克海州，号召山东豪杰归宋，聚兵数万抗击金军。他善制器械，创“如意战车”与炮车配合步骑作战，屡次以少胜多。隆兴二年于楚州清口阻击金兵，因援军不至，力战中箭殉国。
