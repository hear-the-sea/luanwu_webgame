    default_gender: male
    archetype: civil
    flavor: 贾山（生卒年不详），颍川人，其祖父贾祛曾任魏王博士弟子，家学涉猎经史。他曾给事颍阴侯灌婴，文帝时上书《至言》，以秦朝灭亡为鉴，批评赋役繁重、法令严苛，劝文帝减省徭役、广开言路、重视太学。其文辞恳切，是西汉初年政论散文的代表之一。
