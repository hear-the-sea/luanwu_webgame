    default_gender: male
    archetype: military
    flavor: 赵婴齐（？—约前113年），南越文王赵眜之子。他早年入长安宿卫，实为质子，在汉地娶邯郸樛氏之女为妻，生子赵兴。归国继位后，赵婴齐上书汉廷，请立樛氏为王后、赵兴为太子，进一步靠拢汉朝。他死后谥明王，赵兴继位，南越不久便因内乱而亡。
