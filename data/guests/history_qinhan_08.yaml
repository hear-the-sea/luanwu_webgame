    flavor: （生年不详—前140年）西汉文学家，曾为吴王刘濞门客，后归附朝廷。枚乘以辞赋、策论见长，《七发》铺陈游乐与享受，又在篇末加入劝诫，是汉赋早期的名篇。他的文章辞采华美，善于借故事和议论表达对时事的看法。
