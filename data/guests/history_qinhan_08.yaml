    default_gender: male
    archetype: military
    flavor: 严尤（生卒年不详），新莽纳言将军。他曾与陈茂击败王常所部下江军，后在南阳为刘縯所败。王莽议伐匈奴时，严尤上书反对，主张先安山东；此前他曾奉命东击高句丽，诱杀其侯驺。昆阳之战中他随王邑、王寻出征，曾建议围城留缺，未被采纳，莽军终至大溃。
