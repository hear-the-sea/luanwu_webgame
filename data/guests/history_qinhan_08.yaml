      intellect: 58
      defense: 18
      agility: 14
  blue:
  - key: hist_qinhan_0379
    name: 刘安
    default_gender: male
    archetype: civil
    flavor: （前179年—前122年）西汉宗室诸侯王，以广招宾客、好学好文闻名，相传与《淮南子》的编纂有关。淮南王府在当时几乎是一座“地方学术中心”：诸子之学、方技谈论、政治议论都能在此汇聚，而宾客制度也使诸侯王拥有不小的社会吸附力。正因如此，刘安的文化形象始终与政治风险捆在一起——中央集权加强后，诸侯王的“人多言多”很容易被视为不安定因素。史载其后涉入谋反案而自杀，淮南国被削，这一结局既是个人悲剧，也是制度逻辑的结果：在帝国视角里，学术声望与门客网络一旦超出可控范围，便会被重新裁剪。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0380
    name: 刘据
    default_gender: male
    archetype: civil
    flavor: （前128年—前91年）西汉太子，汉武帝与卫子夫之子。巫蛊之祸爆发后，案件扩散、搜捕升级，刘据被推到“只能自证清白”的绝境；史载其最终起兵自救而败亡，自杀（或被杀），牵连极广，成为武帝晚年最大的政治悲剧之一。卫太子之死不仅改写继承格局，更暴露帝国高压运作的脆弱：当告密成为激励机制、恐惧成为治理手段时，事实与程序会被迅速挤压，连皇室亲情也难以抵挡。后续对其平反与政策转向（史载）说明朝廷最终意识到代价过大，但这种意识往往来得太晚。刘据的故事把一个问题写得极清楚：制度一旦允许恐惧自我增殖，最先被吞噬的往往是原本应最安全的核心。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0450
    name: 蔡邕
    default_gender: male
    archetype: civil
    flavor: （132年—192年）蔡邕为东汉文学家、书法家、学者，曾任议郎、左中郎将。在经学、史学、音律与辞章方面均有建树，主持刊刻“熹平石经”，以石刻正定经文，对后世经学传承影响深远。蔡邕工篆隶，书名震时，与政治中枢关系密切，晚年卷入董卓集团后境遇急转，最终以忧惧而终。
    growth_range:
