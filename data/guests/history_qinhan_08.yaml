    default_gender: male
    archetype: civil
    flavor: （132年—192年）东汉文学家、书法家与学者，曾任议郎、左中郎将。蔡邕精通经学、史学、音律和辞章，主持刊刻“熹平石经”，又以篆隶书闻名。晚年受董卓征召入朝，董卓死后因与其有旧而被拘，最终在忧惧中去世。
