  - key: hist_qinhan_0356
    name: 栾布
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前145年）西汉将领，梁地人。早年与彭越交好，彭越封梁王后任梁大夫。高祖诛彭越并悬首洛阳、禁止收殓，栾布出使归来仍对着首级奏事痛哭，被捕后从容陈述彭越功绩，指出株连功臣会使人自危，高祖因而释放并任为都尉。文帝时为燕相，景帝时参与平定七国之乱，因功封俞侯。燕齐之间后人立社祭祀他。
    growth_range:
