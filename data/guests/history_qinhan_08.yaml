    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: 苏文（生卒年不详），西汉黄门宦官，汉武帝晚年近侍。巫蛊之祸中，他与江充等人构陷太子刘据，掘太子宫求蛊，又向武帝报告太子起兵。太子兵败自尽后，武帝渐知其事有冤，遂族灭江充，并将苏文焚于横桥。武帝后来筑思子宫与归来望思之台，以悼太子。
