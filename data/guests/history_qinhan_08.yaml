    default_gender: female
    archetype: civil
    flavor: 樛太后（又称樛王后，生卒年不详—前112年），邯郸人，南越王赵婴齐之妻、赵兴之母。赵婴齐曾入汉为宿卫，娶樛氏，生子赵兴；回国即位后，立樛氏为王后。赵兴继位后，她主张南越内属汉朝，与丞相吕嘉冲突，最终在吕嘉发动的政变中与赵兴一同被杀。
