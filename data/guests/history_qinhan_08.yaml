    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0358
    name: 魏尚
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）西汉边将，曾任云中太守。魏尚镇守云中时厚待士卒，将军市租税尽数犒赏部下，又自出私钱定期宰牛宴飨军吏，因此士气振作，匈奴不敢轻易进犯。后因上报斩获数目与实情相差六级，被削爵治罪。冯唐向汉文帝陈说边将辛劳与赏罚失当，文帝遂命冯唐持节赦免魏尚，使其复任云中太守。
