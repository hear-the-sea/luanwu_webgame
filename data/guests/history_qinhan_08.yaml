  - key: hist_qinhan_0409
    name: 伊稚斜单于
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前114年）匈奴单于，军臣单于之弟。军臣死后，他击败继位的於单而自立，於单降汉。伊稚斜在位时汉匈战争进入高潮：卫青、霍去病多次出塞，汉军夺取河南地、河西走廊，元狩四年漠北之战后匈奴远遁。连年征战使匈奴人口牲畜损耗甚大。前114年伊稚斜死，其子乌维继位。
