  - key: hist_qinhan_0387
    name: 朱云
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—约前6年）西汉官员，字游，以敢于直谏著称。成帝时为槐里令，曾上书请求赐尚方斩马剑，斩佞臣安昌侯张禹。成帝大怒，命御史将他拖下，朱云攀住殿槛，槛为之折断，仍高呼不止；后经辛庆忌力救得免。成帝命保留折槛以表彰直臣。朱云此后不再出仕，居家授徒而终。
    growth_range:
