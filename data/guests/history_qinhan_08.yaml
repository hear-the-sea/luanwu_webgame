    flavor: 赵信（生卒年不详），原为匈奴小王，降汉后任将领，封翕侯。元朔六年，他随卫青出定襄击匈奴，所部失利，赵信遂率残兵再降匈奴。单于封其为自次王，以姊妻之；赵信熟悉汉军虚实，建议单于远徙漠北，以疲敝汉军，此后屡参与对汉作战。
