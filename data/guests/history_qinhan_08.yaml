    name: 谷永
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉末官员与儒者。史载其以奏疏进言见称，常借灾异、风俗与政事得失来规谏朝廷，希望节抑奢侈、整饬吏治、减轻民间负担。谷永的奏对并不一定总被采纳，但它把西汉末年的焦虑写得很具体：财政吃紧、宫廷风气浮华、地方豪强坐大，国家机器看似仍在转，却越来越难让人相信“公义”。写谷永，不是把他塑成万能的救世主，而是把他当作一面镜子——在大厦将倾之前，总有人试图用文字把裂缝指出来，哪怕声音微弱，也留下了对时政的清醒记录。
