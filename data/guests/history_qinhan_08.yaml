  - key: hist_qinhan_0398
    name: 程不识
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （生年不详—约前114年）西汉将领，长期镇守边郡，与李广齐名。程不识治军严整，部曲行伍、营垒陈设皆有法度，夜间击刁斗巡逻，军吏办理文书直到天明，士卒因此不得松懈。他不以奇袭取功，却极少使军队陷入混乱。时人比较二人，多愿从李广而苦程不识，但程不识的稳重同样为边防所倚重。
    growth_range:
