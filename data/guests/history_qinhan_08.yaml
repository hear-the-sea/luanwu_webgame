    name: 栾布
    default_gender: male
    archetype: military
    flavor: （生年不详—前145年）西汉将领。七国之乱时，他承担推进、围攻与清剿，将叛军的回旋空间一寸寸压窄；战后又参与收束地方秩序。栾布像一把不华丽的钝刀，直到叛乱再也无法起身。
    growth_range:
