      agility: 16
  - key: hist_qinhan_0361
    name: 江充
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前91年）西汉官员，字次倩，赵国邯郸人。本名齐，因与赵太子丹结怨而逃入长安，得武帝召见，任直指绣衣使者，督察贵戚近臣严厉。他曾查办太子家使驰道行车一事，拒绝太子求情，由此结怨。武帝晚年巫蛊之祸起，江充奉命查治，搜查宫室、扩大株连，迫使太子刘据起兵；江充被太子部下所杀，事后家族亦遭诛灭。
