    default_gender: male
    archetype: civil
    flavor: 少翁（生卒年不详），齐地方士。汉武帝宠妃王夫人去世后，少翁自称能致其魂魄，夜里设帷帐、燃灯烛，使武帝远远望见类似王夫人的身影，因此被封为文成将军。后来他的方术屡不见效，又写帛书藏入牛腹，伪称天降奇书，被武帝识破笔迹，遂遭诛杀。
