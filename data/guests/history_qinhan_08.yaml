    default_gender: male
    archetype: civil
    flavor: 薛宣（生卒年不详），字赣君，东海郯人。他熟悉法律条文，由地方属吏逐步升迁，历任县令、郡守、左冯翊，以办事周密、吏治严整著称。成帝时薛宣官至御史大夫、丞相，封高阳侯；后因其子薛况买凶伤人一案牵连，被免去相位。
