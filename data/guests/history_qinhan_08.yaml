    flavor: （生年不详—56年）东汉学者与官员，长于文章和议论。桓谭不信谶纬，曾上书批评以符命、灾异附会政事，因直言触怒光武帝而仕途受挫。他晚年仍坚持以事实和学理议论时事，最终失意而终。
