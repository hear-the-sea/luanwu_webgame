    default_gender: male
    archetype: military
    flavor: 王匡（生卒年不详），江夏新市人，新莽末与王凤、马武等在绿林山起兵，号新市兵。更始政权建立后，他受封比阳王，掌握部分兵权。后来更始朝内乱，王匡与张卬等谋劫更始未成，转投赤眉军，最终在东汉平定关东的战事中败亡。
