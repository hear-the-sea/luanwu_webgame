      agility: 16
  - key: hist_qinhan_0371
    name: 隗嚣
    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （生年不详—33年）东汉初割据者，字季孟，天水成纪人。更始年间起兵陇右，被拥为西州上将军，一度接受更始帝名号。刘秀称帝后，他遣使归附，受封西州大将军，但仍据险自守；因不愿出兵攻蜀，与汉廷关系破裂。隗嚣依附公孙述，据陇右多年，建武八年光武帝亲征，其势力大挫，次年病亡，部众与子隗纯先后降汉。
