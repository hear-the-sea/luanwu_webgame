    name: 刘安
    default_gender: male
    archetype: civil
    flavor: （前179年—前122年）西汉淮南王，汉高祖刘邦之孙。刘安好学，广招宾客，主持编纂《淮南子》，门下汇集诸子、方技与文学之士。汉武帝时期，他因谋反案被追查，最终自杀，淮南国也随之被削除。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
