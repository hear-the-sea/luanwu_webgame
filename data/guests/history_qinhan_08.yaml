    archetype: civil
    flavor: （94年—125年）东汉安帝，汉章帝之孙。即位初年由邓太后临朝，亲政后又受到外戚、宦官牵制；在位期间曾处理羌乱、灾荒和地方叛乱等事务。刘祜晚年巡行途中病逝，死后清河王刘保即位。
