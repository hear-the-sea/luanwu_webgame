    flavor: 公孙敬声（生卒年不详—前91年），西汉丞相公孙贺之子，母为卫皇后之姊，官至太仆。他恃宠骄奢，擅用北军钱一千九百万，事发下狱。公孙贺为子赎罪，请捕游侠朱安世，朱安世却在狱中告发公孙敬声与阳石公主私通、行巫蛊，父子俱死狱中，家族亦受牵连。
