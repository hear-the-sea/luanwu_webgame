  - key: hist_qinhan_0408
    name: 军臣单于
    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前126年）匈奴单于，老上单于之子、冒顿单于之孙，约前161年继位。军臣在位时汉匈关系由和亲转向对抗：武帝元光二年汉军设伏马邑谋袭单于，事泄未成，双方由此大规模交战。元朔二年卫青出击，夺取河南地，汉廷置朔方郡。军臣单于仍统率匈奴与汉军周旋，死后其弟伊稚斜自立，匈奴内部一度争位。
