  - key: hist_qinhan_0451
    name: 郑玄
    default_gender: male
    archetype: civil
    flavor: （127年—200年）郑玄为东汉经学大师，师从马融而自成体系，遍注《周礼》《仪礼》《礼记》《诗》《书》《易》等经典，形成影响深远的“郑学”。郑玄治学重考据与训诂，力图在今古文经学分歧中建立可通行的解释框架，使经学由门派对立转向更具整合性的学术秩序。其注疏成为魏晋南北朝乃至唐代经学教育的重要底本，在中国学术史上地位极高。
    growth_range:
