  - key: hist_qinhan_0381
    name: 刘武
    default_gender: male
    archetype: civil
    flavor: （生年不详—前144年）西汉宗室，文帝之子、景帝之弟。封于梁，势力强盛，七国之乱时为拱卫关中要藩。梁王的处境格外微妙：他既是皇帝至亲，又掌握富庶封国，功劳与实力都可能让“继承”议题变得敏感。史载梁国在平乱中有重要支撑，同时梁孝王又以奢丽宫室、广延宾客闻名，其“梁园”更成为文人聚集的文化意象。政治与文化在他身上交错：一方面他是中央安全的屏障，另一方面他的强盛也让朝廷不得不持续警惕。梁国既是屏障也是压力源，分封制度的双刃在他身上尤为明显：藩王强大能护国，强大到一定程度又会逼出皇权的防范本能，担心“家国不分”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
