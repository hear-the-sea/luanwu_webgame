    archetype: military
    flavor: 刘永（？—27年），梁孝王刘武之后。更始时受封梁王，都睢阳；更始政权覆灭后，他自称天子，据梁地割据，势力一度扩及济阴、山阳、沛、楚等郡，并联络张步、董宪等共抗刘秀。建武年间汉军围攻睢阳，刘永兵败出逃，为部将所杀。
