  - key: hist_qinhan_0372
    name: 公孙述
    default_gender: male
    archetype: military
    flavor: （生年不详—36年）东汉初割据者，在蜀地建立成家政权，号称白帝。凭借蜀地险固与资源富庶，维持多年独立，终为东汉所灭。公孙述之所以能撑住，不只是“蜀道难”，也在于四川盆地的农业与物资能自给自足，使政权在外部战乱中保持相对完整的财政与兵源。可当中央力量恢复、对蜀用兵形成体系，天险就不再等同于安全：道路可以被逐步开辟，地方也会出现离心与投降。公孙述的覆亡使东汉统一真正收束，其故事提醒人们，地理优势能买到时间，却买不到永恒——最终决定政权命运的，仍是组织能力、资源动员与人心归附。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0378
    name: 桓谭
    default_gender: male
    archetype: civil
    flavor: （生年不详—56年）东汉学者与官员，擅长议论与文章，思想取向常被描述为不轻信谶纬。东汉初年虽然以儒学为主流，但政治与学术界对灾异、符命的迷恋仍很强，很多判断借“天意”作包装；桓谭在这种氛围中保持较强的怀疑精神，敢指出谶纬的荒诞与政治风险。桓谭的价值在于他提供一种“内部批评”的样本：他并非站在体制外叫嚣，而是在做官、写作与议论中反复提醒人们要回到事实与理性。对帝国而言，这类声音未必受欢迎，却能延缓思想滑向集体幻觉。桓谭的坚持把另一场重建摆到桌面：在谶纬盛行的年代，判断真假本身就是政治风险，却也是国家理性不可缺的底座。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0387
    name: 朱云
    default_gender: male
    archetype: civil
    flavor: （生年不详—前6年）西汉官员，以直谏著称，“折槛”典故最能体现其风骨：在朝堂上面斥权臣，情绪激烈到折断殿槛，既是抗议，也是以身体与名节作抵押的政治表态。朱云的故事说明两汉士大夫的直言传统并非温和讨论，而是一种高风险的制度内对抗——直谏者把自己推到最前面，赌的是皇帝是否愿意容纳批评、是否愿意把权臣置于法度之下。朱云是否能善终，并不完全取决于“道理对不对”，而取决于当时的权力结构是否允许他说出这些话。通过朱云，可以更具体地理解所谓“言路”：它不是天然存在的权利，而是一条需要有人用勇气与代价不断撑出来的通道。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0398
    name: 程不识
    default_gender: male
    archetype: military
    flavor: （生年不详—前114年）西汉将领，长期守边，与李广同处一代，却走出完全不同的路。史书记他“谨严”，军中号令分明，行止有节，宁可慢一点也不冒险；这种风格不容易出传奇，却能让边塞日子过得下去——巡逻、守塞、整队、点名、夜禁，听上去枯燥，却决定突袭来临时有没有队形、有没有粮草、有没有人敢不跑。程不识的价值在于提供一面对照：边战不是永远靠豪勇冲锋，更多时候靠的是把士卒磨成稳定的机器。写他，就像写一种边塞的“耐心”，它不耀眼，却能撑住很久。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0436
    name: 王凤
    default_gender: male
    archetype: civil
    flavor: （生年不详—前22年）西汉外戚与权臣，王政君家族的重要成员之一。成帝时期王氏势力上升，王凤代表的正是“外戚集团化”的早期阶段：亲属不再只是受赏的个人，而是通过关键官位、人事任免与信息门槛形成协同的政治机器。王凤的影响力并非靠公开夺权，而是靠长期占位——谁能升、谁该退、资源向哪里流动，都在看不见的网络中被决定。王氏集团的这种组织化扩张，为王莽后来更进一步提供了现实基础。王凤并不只是一个外戚权臣的名字，更是一段缓慢的权力转移：皇帝在依赖与妥协中让渡执行层抓手，家族网络便在空隙里长成机器。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0350
    name: 刘祜
    default_gender: male
    archetype: civil
    flavor: （94年—125年）东汉皇帝，其在位阶段常被用来观察“宫廷结构如何影响国家运转”。史书所见，一方面朝廷仍沿用前期制度，中央官僚体系并未立刻松散；另一方面，外戚与宦官围绕近侍、诏命与人事的影响力起伏，使决策更易被宫中关系牵引。地方层面又时有灾荒、骚动与边患压力，迫使中央在赈恤、用兵与财政之间反复权衡。安帝本人并非始终无所作为，但他的时代提示：当权力被多方分割时，皇帝的个人意志很难稳定地转化为政策执行。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0382
    name: 刘胜
    default_gender: male
    archetype: civil
    flavor: （前165年—前113年）西汉宗室，景帝之子，封中山王。史书常写其生活奢靡、子嗣繁多，这些看似八卦的细节，实则与分封制度的长期运作有关：藩王拥有封国资源与仪仗，既承担地方治理职责，也容易在远离权力中心后形成“自治生活圈”，把政治重心转向享乐与家族繁衍。刘胜并非总以政治行动见长，但他恰好呈现分封体系的一种日常面貌——中央集权强化的同时，封国仍在持续生产各自的利益与惯性。刘胜的奢靡与多子嗣并不只是个人趣味，它与封国资源、监督稀薄和自治惯性相连，久而久之便把藩王推向可预期的沉溺。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0361
    name: 江充
    default_gender: male
    archetype: civil
    flavor: （生年不详—前91年）西汉官员，武帝晚年巫蛊之祸的关键人物之一。史载江充以告发、搜捕等方式推动案件扩散，最终把风波引向太子与皇室核心，并在事后遭诛。江充之所以值得警惕，不在于他“会办案”，而在于他示范了恐惧政治的发动方式：把指控变成工具，把程序变成追杀，靠告密与连坐制造不可逆的自我放大。巫蛊之祸并非偶然误会，它暴露的是高压动员末期的制度失真——皇帝的疑惧、官员的邀功与派系的算计叠加在一起，案件就会像火一样烧穿继承秩序。江充最终被清算，说明这种玩法连操盘者也难以善终；当政治被恐惧统治，谁都可能成为下一个替罪羊。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0371
    name: 隗嚣
    default_gender: male
    archetype: military
    flavor: （生年不详—33年）东汉初割据者，盘踞陇右。凭借地险与兵力自立，与刘秀时合时离，终在长期对峙中败亡。隗嚣能立足陇右，并非单靠勇武：西北关隘与交通要道决定了谁掌握补给与出入，谁就能把对手拖进消耗战；同时边地豪强与部曲也更重“能保一方”。光武要完成统一，就必须把这种地方结构拆解重组——既要打赢军事实力，也要在胜利后安置人心与土地资源。隗嚣的败亡因此不仅是一个割据者的终局，更是东汉重新接管西北秩序的一次艰难转接。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0408
    name: 军臣单于
    default_gender: male
    archetype: military
    flavor: （生年不详—前126年）匈奴单于，处在汉武帝对匈奴政策由守势转向主动进攻的关键阶段。军臣单于面对的不只是汉军的压力，还有草原政权内部的整合与分配：部众需要战利品，贵族需要地位，冬夏牧场与迁徙路线决定了出兵与退兵的节奏。汉廷逐渐摆脱和亲守势后，双方对抗不再只是边境冲突，而牵动河套、河西与交通通道的安全，使“贸易与战争”常常并行不悖。理解军臣单于，不能只用胜负来评价，更要看到草原统治者的政策空间：他既要维持对外强硬的形象，也要在资源与部众之间不断平衡，否则内部离心会比汉军更先摧毁他的权威。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0409
    name: 伊稚斜单于
    default_gender: male
    archetype: military
    flavor: （生年不详—前114年）匈奴单于。继军臣单于后继续与汉廷对抗，处于汉武帝大规模反击的时期。伊稚斜单于在史书中与汉军多次交锋相关，反映匈奴在西汉强攻下逐渐承受更大压力。对草原统治者而言，战略选择从来不是“想打就打”：部众迁徙、牧场供给与贵族分配都决定能否长期动员；汉军的远征与郡县推进又不断压缩回旋空间。伊稚斜单于所承受的，不只是战场上的压力，更是维持内部统合的压力——一旦无法提供胜利与资源，单于权威就会被质疑。写伊稚斜单于，实际上是在写匈奴如何在强大农业帝国的持续推进下被迫调整节奏、付出代价。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0420
    name: 邓骘
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）东汉外戚与重臣，邓绥之兄。太后临朝时期，邓氏家族处在权力中枢，邓骘既要承担“家族代表”的政治期待，也要面对朝廷对外戚坐大的天然戒惧。史载他参与军政要务、领兵镇边并处理人事，显示外戚并非只能靠血缘吃饭，很多时候也要用实际能力维持局面。但外戚政治的难处在于：做得越多，越容易被认为“越权”；做得越少，又会被指“误国”。邓骘的评价因此呈现摇摆，这种摇摆本身就是东汉宫廷结构的产物。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
