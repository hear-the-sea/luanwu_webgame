    flavor: （生年不详—前126年）匈奴单于，冒顿单于之孙。即位后多次与汉军交战，汉武帝遣卫青、霍去病等出击匈奴，河套等地的争夺日益激烈。军臣单于在位期间仍维持匈奴统治，后病死，弟伊稚斜继位。
