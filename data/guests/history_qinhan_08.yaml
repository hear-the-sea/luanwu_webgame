    archetype: civil
    flavor: 公孙卿（生卒年不详），齐地方士。元鼎年间，他借汾阴出土宝鼎之机上书，称黄帝曾封禅泰山、最终乘龙升天，又说神仙可致，汉武帝由此好封禅求仙。公孙卿被拜为郎，后迁大中大夫，长期奉命在名山候神，参与武帝朝的封禅与祭祀活动。
