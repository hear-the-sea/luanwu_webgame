    default_gender: male
    archetype: military
    flavor: 卢芳（？—42年），安定三水人，新莽末自称汉武帝曾孙、号刘文伯。更始之后，他被匈奴单于立为汉帝，据有五原、朔方、云中、定襄、雁门等郡，与东汉对峙多年。建武十六年卢芳归降，受封代王，不久复叛，逃入匈奴，后死于塞外。
