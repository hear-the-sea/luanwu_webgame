    default_gender: male
    archetype: civil
    flavor: 栾大（生卒年不详—前112年），西汉胶东王宫人，以方术游说汉武帝。他自称能通神仙、求不死药，武帝信之，封五利将军等号，赐乐通侯，并妻以卫长公主，一时贵震天下。后入海求仙无功，又妄言见其师，武帝察其欺诈，将其处死。
