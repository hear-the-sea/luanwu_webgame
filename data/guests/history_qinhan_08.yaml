    archetype: civil
    flavor: 王郎（？—24年），本名王昌，赵国邯郸人，以卜相为业。新莽末，他与赵地豪强刘林等合流，诈称汉成帝之子刘子舆，于更始元年冬在邯郸称帝，河北郡县多响应。刘秀经营河北，连破其军，次年攻下邯郸，王郎逃亡途中被杀。
