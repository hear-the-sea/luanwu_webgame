  - key: hist_qinhan_0385
    name: 李延年
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前87年）西汉乐师，中山人，出身倡家。因犯法受刑后入宫，以善歌得汉武帝赏识；所作《佳人曲》以“一顾倾人城，再顾倾人国”传世，其妹李夫人也因此入宫得宠。李延年曾任协律都尉，主持宫廷音乐，并为郊祀乐章配曲。李夫人去世后，李氏恩宠渐衰，其弟李季获罪，李延年与兄弟受到牵连而被处死。
