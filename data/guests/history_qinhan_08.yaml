    default_gender: male
    archetype: civil
    flavor: 窦广国（字少君，？—前151年），观津人，汉文帝窦皇后之弟。他幼年家贫，被人掠卖为奴，辗转十余家，曾在宜阳山中烧炭；一次崖崩压死多人，他独得幸免。后来他上书自陈身世，与窦皇后相认，文帝厚赐田宅，窦氏一门由此显贵。景帝时他受封章武侯。
