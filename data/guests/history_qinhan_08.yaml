heroes:
  purple:
  - key: hist_qinhan_0451
    name: 郑玄
    avatar: monkey/秦汉/郑玄.png
    default_gender: male
    archetype: civil
    flavor: （127年—200年）郑玄为东汉经学大师，师从马融而自成体系，遍注《周礼》《仪礼》《礼记》《诗》《书》《易》等经典，形成影响深远的“郑学”。郑玄治学重考据与训诂，力图在今古文经学分歧中建立可通行的解释框架，使经学由门派对立转向更具整合性的学术秩序。其注疏成为魏晋南北朝乃至唐代经学教育的重要底本，在中国学术史上地位极高。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 10
      intellect: 58
      defense: 18
      agility: 14
  blue:
  - key: hist_qinhan_0379
    name: 刘安
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （前179年—前122年）西汉淮南王，汉高祖刘邦之孙、淮南厉王刘长之子。刘安好读书鼓琴，广招宾客方术之士，主持编纂《淮南子》（又称《淮南鸿烈》），融汇道家、阴阳与各家学说。武帝时他曾入朝献书，颇受礼遇；后因谋反事泄，自杀身亡，淮南国被除为郡。其著述与养士之风，是西汉诸侯王文化活动的代表。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0380
    name: 刘据
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （前128年—前91年）西汉太子，汉武帝与卫子夫之子，元狩元年立为太子。刘据性格仁厚，曾多次劝谏武帝用刑过重。晚年武帝宠信江充，巫蛊之祸起，江充搜查东宫，刘据难以自明，遂起兵自卫；兵败后逃亡，于湖县自尽。后世多认为其冤，其孙刘询即位为宣帝后为其改葬追谥。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0450
    name: 蔡邕
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （132年—192年）东汉文学家、书法家与学者，曾任议郎、左中郎将。蔡邕精通经学、史学、音律和辞章，主持刊刻“熹平石经”，又以篆隶书闻名。晚年受董卓征召入朝，董卓死后因与其有旧而被拘，最终在忧惧中去世。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_qinhan_0357
    name: 冯唐
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉官员，以直言敢谏著称。文帝时，冯唐为郎中署长，曾当众指出文帝虽得廉颇、李牧亦不能用，借魏尚因报功小过获罪之事，说明边将守边辛劳与赏罚失当。文帝感悟，命他持节赦免魏尚，使其复任云中太守。景帝时冯唐曾任楚相，武帝初举贤良时他已年逾九十，不能再仕。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0381
    name: 刘武
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前144年）西汉梁王，汉文帝之子、汉景帝之弟。七国之乱时，刘武据梁国坚守，牵制叛军，护卫关中。刘武喜好营造宫室、延揽宾客，梁园因此成为文士往来的场所；他死后，梁国的继承问题也引起朝廷关注。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0394
    name: 枚乘
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前140年）西汉文学家，曾为吴王刘濞门客，后归附朝廷。枚乘以辞赋、策论见长，《七发》铺陈游乐与享受，又在篇末加入劝诫，是汉赋早期的名篇。他的文章辞采华美，善于借故事和议论表达对时事的看法。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0395
    name: 邹阳
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—约前120年）西汉辞赋家与政论家。邹阳早年与枚乘等同为吴王刘濞门客，曾上书谏阻吴王谋反而不被采纳，遂转投梁孝王。因遭羊胜等人谗毁下狱，他写下《狱中上梁王书》，以典故和利害自辩，获释后仍为上客。其文辞锋利而持重，善以历史事例陈说士人的处境与去就，是汉初散文的代表之一。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0372
    name: 公孙述
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （生年不详—36年）东汉初割据者，字子阳，扶风茂陵人。王莽末年为蜀郡地方长官，更始年间自立为蜀王，后于成都称帝，国号“成家”，并依据符命之说巩固名号。他凭蜀地险要长期据守，曾与陇右的隗嚣联络。刘秀平定关中、陇右后遣吴汉等入蜀，建武十二年成都城破，公孙述伤重而死，成家政权随之覆亡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0378
    name: 桓谭
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—56年）东汉学者，字君山，沛国相人，长于文章与议论。桓谭不喜谶纬，曾上书光武帝，批评以符命、灾异附会政事的风气，因此触怒皇帝，几遭严惩，后被贬为六安郡丞，赴任途中病卒。所著《新论》论及政治、学术与形神问题，主张形死神灭，其议论在汉代思想史上颇具特色。
