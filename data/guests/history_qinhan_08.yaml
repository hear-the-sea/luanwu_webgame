    default_gender: male
    archetype: military
    flavor: 朱鲔（生卒年不详），新莽末绿林军将领，更始政权任大司马，封胶东王，曾参与杀害刘秀之兄刘縯。更始迁都洛阳后，他奉命镇守洛阳，与刘秀军相持；后经岑彭劝说出降。光武帝指河为誓，不究旧怨，封其为扶沟侯，后来朱鲔官至少府。
    growth_range:
    - 3
    - 7
    attribute_weights:
