    default_gender: male
    archetype: military
    flavor: 董宪（？—30年），新莽末东海起兵的地方首领，据朐县一带。刘永割据梁地时，封其为海西王，董宪遂与张步等连兵抗拒刘秀。建武五年，庞萌反汉后与董宪合流，光武帝亲征将其击破；董宪退保朐城，次年为吴汉所破，兵败被杀。
