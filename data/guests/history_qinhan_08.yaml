  - key: hist_qinhan_0388
    name: 严延年
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前58年）西汉官员，字次卿，东海下邳人。宣帝时历任涿郡、河南太守，执法严酷，曾大力打击地方豪强集团，使郡中秩序一时肃然。他断狱果决，冬季集中处决囚犯，声势凌厉，时人称之为“屠伯”。其严刑虽收到短期效果，也招致怨望；后因属吏上书告发，被朝廷处死。
