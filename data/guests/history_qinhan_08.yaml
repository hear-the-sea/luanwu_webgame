    default_gender: male
    archetype: civil
    flavor: 李少君（生卒年不详），齐地方士，以祠灶、却老之方得到汉武帝召见。他自称曾游海上见仙人安期生，以丹砂可化为黄金、黄金成器可延年之说打动武帝，一时被尊信。李少君后来病死，武帝却以为他化去成仙，方士之风由此更盛。
