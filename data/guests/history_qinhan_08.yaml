      defense: 22
      agility: 16
  - key: hist_qinhan_0394
    name: 枚乘
    default_gender: male
    archetype: civil
    flavor: （生年不详—前140年）西汉文学家。以辞赋与策论著称，史载其曾事吴王，后归朝廷，人生经历本身就带着文景时期诸侯与中央关系的影子。枚乘的作品常被认为是汉赋早期的重要成果，如《七发》以铺陈与劝诫并行，把奢逸的生活描写得极尽华丽，又在华丽中暗藏规谏。这样的写法很汉代：士人想参与政治，却未必能直接上书，于是把意见写进辞赋，让“好看”成为“好劝”的包装。枚乘的作品一方面推动汉赋风格成型，一方面也显出士人劝谏的技巧——用文采绕开锋芒，把劝戒送到权力者耳边。
    growth_range:
