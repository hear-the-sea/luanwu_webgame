    default_gender: male
    archetype: military
    flavor: 柴武（又作陈武，？—前163年），西汉开国功臣，封棘蒲侯。秦末他随刘邦起兵，参加楚汉战争；汉初又以将军身份北击叛降匈奴的韩王信，在参合将其斩杀。文帝时济北王刘兴居叛乱，柴武率军平定，因功继续受重用，至文帝后元年间去世。
