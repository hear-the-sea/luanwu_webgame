    default_gender: male
    archetype: military
    flavor: 赵兴（？—前112年），南越第四代王，赵婴齐与樛太后之子。赵婴齐死后，赵兴继位，因年幼，国政多由樛太后与丞相吕嘉执掌。汉武帝遣使劝其内属，赵兴与太后同意，吕嘉坚决反对，遂起兵杀死赵兴、樛太后及汉使，汉武帝因此发兵南越。
