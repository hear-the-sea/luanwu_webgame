    archetype: civil
    flavor: 霍云（？—前66年），西汉霍氏成员，霍去病后裔，封冠阳侯，官至中郎将。霍光死后，宣帝亲政并逐步削夺霍氏权柄，霍云与霍禹、霍山等心怀怨望，参与谋反。阴谋败露后，霍云与霍山自杀，霍禹被腰斩，霍氏家族遭到清洗。
