  - key: hist_qinhan_0350
    name: 刘祜
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （94年—125年）东汉安帝，汉章帝之孙，清河王刘庆之子。即位初年由邓太后临朝，亲政后邓氏失势，外戚与宦官又相继干政。在位期间西羌屡叛，内地灾荒、盗贼频发，朝廷疲于应付。延光四年，刘祜南巡途中病逝于叶县，年三十二；其后其子刘保被拥立为帝，是为顺帝。
