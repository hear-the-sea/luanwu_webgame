    default_gender: male
    archetype: civil
    flavor: 王褒（生卒年不详），字子渊，蜀郡资中人，西汉辞赋家。宣帝时经益州刺史王襄举荐入朝，作《圣主得贤臣颂》称旨，擢为谏大夫。他的《洞箫赋》铺写乐器与乐声，是咏物赋名篇；另有《九怀》《僮约》传世。后来王褒奉命赴益州祭祀金马碧鸡，病卒于途中。
