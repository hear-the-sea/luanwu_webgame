  - key: hist_qinhan_0420
    name: 邓骘
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）东汉外戚、重臣，字昭伯，南阳新野人，和熹邓太后之兄。安帝时邓太后临朝，邓骘以车骑将军出征西羌，因调度失当一度大败而归，后拜大将军，参预朝政。他虽居高位，史称其谦谨节俭、荐举名士。邓太后去世后，安帝听信诬告，将邓氏兄弟免官遣归封国，邓骘与其子绝食而死。
