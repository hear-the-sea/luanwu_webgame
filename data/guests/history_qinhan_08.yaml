    archetype: civil
    flavor: 王恢（生卒年不详—前133年），燕人，西汉大行令，力主对匈奴用兵。元光二年，他与聂壹策划马邑之谋，以利诱匈奴单于入塞，汉军三十万伏于马邑附近；单于察觉退走，王恢所部未敢追击。武帝怒其谋事不成，王恢下狱，自杀而死。
