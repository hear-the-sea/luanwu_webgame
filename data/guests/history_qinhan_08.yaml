    archetype: civil
    flavor: 王根（？—前6年），西汉外戚，王政君之弟，封曲阳侯。成帝时他继王商之后出任大司马、骠骑将军，领尚书事，辅政数年。王氏兄弟竞相营造宅第，王根园中土山渐台仿照宫室，曾引起成帝不满。他病重时推荐侄子王莽接任大司马，为王莽日后专权铺路。
