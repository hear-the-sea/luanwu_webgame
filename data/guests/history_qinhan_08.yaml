    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉官员，以直言敢谏著称。文帝时，魏尚因报功不实获罪，冯唐当面为他申辩，指出边将守边的辛苦与赏罚失当之处，魏尚因此得到复任。冯唐晚年仍以敢于进言闻名。
