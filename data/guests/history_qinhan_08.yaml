    flavor: 吕媭（生年不详—前180年），吕后之妹，嫁舞阳侯樊哙，受封临光侯，是汉代少见的女性封侯者。她依仗吕后权势，在吕后当政时颇预政事，曾向吕后进谗，指陈平不理政务。吕后死后，周勃、陈平等诛除诸吕，吕媭被笞杀，其子樊伉亦遇害。
