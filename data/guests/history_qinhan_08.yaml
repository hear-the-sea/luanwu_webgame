    default_gender: male
    archetype: military
    flavor: 赵憙（字伯阳，生卒年不详—80年），南阳宛人，东汉初大臣。更始帝时曾为将，后归附刘秀，历任郡守、太尉、太傅，封节乡侯。他为人刚正，通晓经术，明帝时颇受礼遇；章帝即位后以旧臣辅政，建初五年去世，谥正侯。
    growth_range:
