    default_gender: male
    archetype: military
    flavor: 苏建（生卒年不详），京兆杜陵人，苏武之父。元朔二年以校尉随卫青出击匈奴，因功封平陵侯，后升任卫尉、右将军。元朔六年他随卫青出定襄，所部遭遇单于主力而全军覆没，仅以身免，按律当斩，赎为庶人；后再起为代郡太守，卒于任上。
