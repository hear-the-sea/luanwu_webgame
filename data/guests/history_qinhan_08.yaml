    archetype: civil
    flavor: 薄昭（？—前170年），吴人，薄太后之弟、汉文帝舅父。吕后死后，他参与迎立代王刘恒入继大统，文帝即位后受封轵侯，任车骑将军。后来薄昭擅杀朝廷使者，文帝不忍公开处刑，命公卿身着丧服前往其府第哭吊，薄昭遂自杀。
