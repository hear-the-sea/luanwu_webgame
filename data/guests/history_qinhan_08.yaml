    flavor: （生年不详—前6年）西汉官员，以敢于直谏著称。成帝时，朱云在朝堂上请求诛杀权臣，争执中攀住殿槛，殿槛因此被折断；成帝一度震怒，后来仍保全了他的性命。“折槛”一事使朱云以刚直敢言闻名。
