    flavor: （生年不详—前144年）西汉梁王，汉文帝之子、汉景帝之弟。七国之乱时，刘武据梁国坚守，牵制叛军，护卫关中。刘武喜好营造宫室、延揽宾客，梁园因此成为文士往来的场所；他死后，梁国的继承问题也引起朝廷关注。
