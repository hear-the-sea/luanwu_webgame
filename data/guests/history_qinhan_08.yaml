    flavor: （生年不详—前22年）西汉外戚、权臣，王政君之兄。汉成帝即位后，王凤历任大司马大将军、领尚书事，掌握朝廷人事与政务，多次压制异己、提拔王氏亲族。王凤死后，王氏外戚势力继续扩张，王莽后来也因此得到入朝掌权的机会。
