    flavor: 霍禹（？—前66年），西汉大司马霍光之子，霍成君之兄，袭封博陆侯。霍光死后，宣帝亲政，尊霍禹为大司马却削去其实权，霍氏子弟亦多被外调。霍禹与母亲霍显及霍云、霍山等密谋反叛，事泄后被腰斩，博陆侯国随之废除。
