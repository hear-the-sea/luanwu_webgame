    name: 刘据
    default_gender: male
    archetype: civil
    flavor: （前128年—前91年）西汉太子，汉武帝与卫子夫之子。巫蛊之祸中，江充等人搜查东宫，刘据起兵自卫，兵败后自杀（或被杀）。其后案件得到平反，汉武帝为太子之死追悔。
    growth_range:
    - 5
