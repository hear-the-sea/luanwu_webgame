    default_gender: male
    archetype: military
    flavor: 翟义（？—7年），字文仲，汝南上蔡人，丞相翟方进之子，官至东郡太守。王莽居摄后，他于居摄二年起兵，拥立严乡侯刘信为天子，自称大司马柱天大将军，传檄郡国讨伐王莽，一时响应者众。同年兵败被俘，遇害，王莽并诛其族。
