    default_gender: male
    archetype: military
    flavor: 郦寄（生卒年不详），字况，西汉将领郦商之子，袭封曲周侯。他与吕禄交好，诸吕之乱时，周勃、陈平劫持其父郦商，迫他出面诱吕禄出游，使周勃得以入北军，时人由此讥其“卖交”。七国之乱时，郦寄曾以将军率军围攻赵王刘遂于邯郸，久攻不下。
