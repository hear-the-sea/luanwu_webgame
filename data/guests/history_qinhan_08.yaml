    default_gender: male
    archetype: civil
    flavor: 卫伉（生年不详—前91年），西汉大将军卫青长子。他尚在襁褓时便因父亲军功受封宜春侯，后因矫制获罪免侯；卫青去世后，卫伉嗣封长平侯。巫蛊之祸兴起时，他被人告发与诸邑公主、阳石公主往来，牵连其中，最终与两位公主一同被杀。
