  - key: hist_qinhan_0376
    name: 郑众
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—107年）东汉宦官，字季产，南阳犨人。和帝时窦太后临朝，窦宪兄弟专擅朝政，郑众处事谨慎，不与窦氏往来，得和帝信任。永元四年，和帝用其谋收缴窦宪兵权，窦氏兄弟被迫就国后自杀。郑众因功迁大长秋，封鄛乡侯，开东汉宦官封侯之例；此后他以近侍身份参与政务，影响渐重。
