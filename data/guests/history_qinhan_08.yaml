    archetype: civil
    flavor: 王商（字子夏，生卒年不详），西汉外戚，王政君异母弟、汉成帝舅父，封成都侯。成帝时他以特进领城门兵，后官至大司马、卫将军。他曾向朝廷借明光宫避暑，又引沣水入宅中陂池行船，因逾制惹怒成帝，乃负斧质请罪。其子王邑后为新莽大司空。
