  - key: hist_qinhan_0382
    name: 刘胜
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （前165年—前113年）西汉中山王，汉景帝之子、武帝异母兄，谥靖，世称中山靖王。建元年间入朝，武帝设宴，刘胜闻乐声而泣，借机陈述宗室受臣下侵抑之苦，武帝因此加厚诸侯礼遇。其封国富庶，生活豪奢，史载有子一百二十余人。满城汉墓中，刘胜墓出土金缕玉衣，其妻窦绾墓出土长信宫灯。
    growth_range:
