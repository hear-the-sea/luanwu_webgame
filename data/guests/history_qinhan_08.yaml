    flavor: 王音（？—前15年），西汉外戚，王政君的堂弟。阳朔三年王凤病重，临终荐王音自代，他遂任大司马、车骑将军，领尚书事，封安阳侯。王音辅政约八年，行事较王凤谨慎；他死后由王商继任大司马。其子王舜后来在王莽新朝官至太师。
