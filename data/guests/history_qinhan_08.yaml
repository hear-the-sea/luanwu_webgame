    archetype: military
    flavor: 张步（生卒年不详），字文公，琅邪人，新莽末据齐地起兵，以剧县为中心。刘永封其为齐王，他遂与汉廷对抗。建武五年，耿弇率军东征，在临淄一带连破其军，张步投降，受封安丘侯；不久逃归琅邪，欲收旧部，被郡守追斩。
