  - key: hist_qinhan_0396
    name: 桓宽
    avatar: pig/文029.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉学者，字次公，汝南人。宣帝时以治《公羊春秋》举为郎，官至庐江太守丞。昭帝始元六年朝廷召开盐铁会议，贤良、文学与御史大夫桑弘羊等就盐铁专卖、均输平准、边防开支与赋税展开辩论；桓宽依据会议记录整理成《盐铁论》六十篇，保存了双方论难的详细内容。其本人事迹记载不多，主要因这部书而留名。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0414
    name: 唐蒙
    avatar: pig/文048.png
