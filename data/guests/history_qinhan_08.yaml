    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉官员。以直言敢谏著称，曾为魏尚申理，使这位边将得以复任。冯唐把边防、军纪与选将用人连成一条直线；忠直之言未必立刻见用，却能为朝廷留下自我纠错的门。
