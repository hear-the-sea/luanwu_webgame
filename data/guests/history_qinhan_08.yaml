    default_gender: male
    archetype: civil
    flavor: 郭躬（字仲孙，生卒年不详），颍川阳翟人，东汉法律学者。其父郭弘习《小杜律》，郭躬承习家学，聚徒讲授数百人。明帝、章帝时历任廷尉正、廷尉，多次为疑狱主张从轻处理，所议多被采纳，是东汉前期以宽平著称的律学名家。
