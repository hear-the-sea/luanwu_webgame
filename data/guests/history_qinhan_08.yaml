    default_gender: male
    archetype: civil
    flavor: （生年不详—前120年）西汉政论与辞赋人物，以《狱中上梁王书》等文字传世。邹阳把言说当作政治行动，身陷囹圄仍以典故、利害与道义争取转圜；他的文章锋利而谨慎，像把士人的生存之术磨成了一柄笔。
