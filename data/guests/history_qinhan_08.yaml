    flavor: 彭宠（？—29年），字伯通，南阳宛人。新莽末曾为大司空士，更始时出任渔阳太守；刘秀经略河北，他发兵转粮相助。后因功高赏薄，与幽州牧朱浮交恶，举兵反汉，建武二年自称燕王，并联络匈奴与张步等。建武五年为家奴子密等所杀。
