    default_gender: male
    archetype: military
    flavor: 王常（字颜卿，生卒年不详），颍川舞阳人，新莽末绿林军下江兵首领之一。更始政权建立时，他参与拥立刘玄，受封邓王，任廷尉大将军。后王常归附刘秀，被拜为横野大将军，封山桑侯，随军平定河北及关东割据势力，成为东汉开国功臣。
