  - key: hist_suitang_0108_liuzhenghui
    name: 刘政会
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: （？—635年）唐初大臣，滑州胙城人。隋末任太原鹰扬府司马，李渊起兵后改任大将军府户曹参军，与刘文静等响应，负责后方事务。唐朝建立后历任黄门侍郎、刑部尚书，封邢国公，曾掌刑狱、参预机要，为贞观朝所倚重。贞观九年卒，赠民部尚书，图形凌烟阁，为二十四功臣之一。
    growth_range:
