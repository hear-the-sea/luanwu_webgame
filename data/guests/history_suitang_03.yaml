heroes:
  blue:
  - key: hist_suitang_0091_jiadao
    name: 贾岛
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （779年—843年）唐代诗人，字浪仙，早年出家为僧，法号无本，后还俗应举，却屡试不第。曾任长江县主簿，世称贾长江，晚年迁普州司仓参军，卒于任所。“推敲”典故相传出自他斟酌“僧敲月下门”一句，与韩愈相遇论诗；其诗多写荒寒枯寂之境，与孟郊并称“郊寒岛瘦”，自成一格。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 52
      defense: 20
      agility: 18
  - key: hist_suitang_0092_weizhuang
    name: 韦庄
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （约836年—910年）晚唐五代诗人、词人，字端己，京兆杜陵人。乾宁元年进士及第，早年所作长篇叙事诗《秦妇吟》写战乱流离，流传甚广，人称“秦妇吟秀才”。后入蜀依附王建，任掌书记，前蜀建立后官至宰相，词风清丽疏淡，《菩萨蛮·人人尽说江南好》为世所传。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 24
      agility: 14
  - key: hist_suitang_0093_luoyin
    name: 罗隐
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: （833年—909年）唐代诗人，字昭谏，本名横，因十举进士不第而改名。黄巢之乱后归乡里，晚年入钱镠幕府，历任钱塘令、著作郎等职。其诗文多讥刺时政，自编《谗书》以明志，又有《甲乙集》传世；“今朝有酒今朝醉”即出自他的《自遣》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 50
      defense: 22
      agility: 14
  - key: hist_suitang_0094_lishi
    name: 李适
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （742年—805年）唐德宗，代宗长子，779年即位。即位初任用杨炎推行两税法，以资产定税、简化税制，并试图削抑藩镇；建中四年泾原兵变，他仓促出奔奉天，此后对武将渐生猜忌，转而倚重宦官掌禁军。晚年政令反复，姑息藩镇，为后来宦官专权留下隐患。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 18
      intellect: 46
      defense: 24
      agility: 12
  - key: hist_suitang_0098_liang
    name: 李昂
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （809年—840年）唐文宗，穆宗次子，827年即位。在位初年勤于政事，试图抑制宦官与藩镇，与宰相李训、郑注密谋诛除宦官，大和九年甘露之变事败，宦官仇士良等借机专权，文宗自此受制于家奴，郁郁成疾而终。开成五年病卒，宦官立其弟李炎为帝，是为武宗。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_suitang_0099_liyan
    name: 李炎
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （814年—846年）唐武宗，穆宗第五子，840年即位。在位期间任用李德裕为相，整顿吏治、抑制藩镇，会昌年间平定泽潞刘稹；又击败回鹘，边境稍安。会昌五年下令拆毁寺院、没收寺产、勒令僧尼还俗，史称“会昌灭佛”。其治世被称“会昌中兴”，但他崇道服丹，846年病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 18
      intellect: 46
      defense: 26
      agility: 10
  - key: hist_suitang_0101_lixi
    name: 李儇
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （862年—888年）唐僖宗，懿宗第五子，873年以十二岁即位，政事多委于宦官田令孜。乾符年间王仙芝、黄巢起兵，广明元年黄巢攻入长安，僖宗出奔成都，数年后方得还京。回长安后仍受制于宦官与藩镇，文德元年病逝，年仅二十七岁，其弟李晔继位，是为昭宗。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 44
      defense: 22
      agility: 22
  - key: hist_suitang_0102_liye
    name: 李晔
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （867年—904年）唐昭宗，懿宗第七子，888年即位。即位后力图重振皇权，先后借助朱温等藩镇兵力诛除宦官，并试图削平李茂贞等强藩，但屡遭失败，反被挟制。天祐元年被迫迁都洛阳，同年为朱温所遣人杀害。朱温另立其子李柷为帝，是为哀帝，唐室至此名存实亡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 46
      defense: 24
      agility: 14
  - key: hist_suitang_0109_zhangliang
    name: 张亮
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: （？—646年）唐初将领，郑州荥阳人，早年参加瓦岗军，随李密，后归唐。贞观年间历任刑部尚书、洛州都督，曾参与征讨高句丽，以军功封郧国公。晚年收养假子数百，被告发有异志，贞观二十年以谋反罪被杀，爵位亦被削除。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 18
      defense: 28
      agility: 16
  - key: hist_suitang_0095_lishu
    name: 李诵
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: （761年—806年）唐顺宗，德宗长子，805年即位。即位后任用王叔文、王伾及柳宗元、刘禹锡等推行改革，罢宫市、抑宦官、削藩镇，史称“永贞革新”。因中风失音不能亲政，宦官俱文珍等联合藩镇逼迫其禅位于太子李纯，革新仅百余日即告失败，次年顺宗病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 46
      defense: 24
      agility: 16
  - key: hist_suitang_0097_lizhan
    name: 李湛
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （809年—827年）唐敬宗，穆宗长子，824年即位，时年十六。在位期间不理朝政，喜好击球、夜猎与宴游，常至深夜方归，对宦官也多有戏侮。宝历二年夜猎还宫后，被宦官刘克明、苏佐明等杀害，年仅十八岁，是唐代又一位死于宦官之手的皇帝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 44
      defense: 22
      agility: 20
  - key: hist_suitang_0100_lipi
    name: 李漼
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （833年—873年）唐懿宗，宣宗长子，859年即位。在位期间沉溺宴游、崇尚奢华，咸通十四年大规模迎奉法门寺佛骨，耗费甚巨；又宠信宦官、滥授官职，政事日坏。咸通年间浙东裘甫、徐州庞勋相继起兵，虽被平定，却已动摇国本，他于咸通十四年病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 44
      defense: 24
      agility: 20
  - key: hist_suitang_0103_lizhu
    name: 李柷
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （892年—908年）唐哀帝，昭宗第九子，904年在朱温挟持下即位，时年十三。在位期间朝政尽出朱温之意，天祐二年朱温大杀朝臣，白马驿之祸后唐室名存实亡。天祐四年被迫禅位于朱温，唐朝灭亡，他被降封济阴王，次年在曹州遇害，年仅十七岁。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 44
      defense: 24
      agility: 22
  - key: hist_suitang_0104_tangjian
    name: 唐俭
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （571年—640年）唐初大臣，字茂约，并州晋阳人。李渊起兵时，唐俭与长孙顺德等劝说响应，参与太原举义。唐朝建立后历任内史舍人、中书侍郎，后任民部尚书、天策府长史，封莒国公，为凌烟阁二十四功臣之一。贞观初年曾出使突厥，与颉利可汗斡旋，晚年退居，贞观十四年卒。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_suitang_0105_duanzhixuan
    name: 段志玄
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: （598年—642年）唐初将领，齐州邹平人。隋末随父客居太原，李渊起兵时率众归附，参与攻取长安，此后随李世民平定王世充、窦建德、刘黑闼等，屡为先锋。贞观年间任右卫大将军，封褒国公，图形凌烟阁。他治军持重，贞观十六年卒，谥忠壮，陪葬昭陵。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 18
      defense: 30
      agility: 16
  - key: hist_suitang_0107_yinkaishan
    name: 殷开山
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: （？—622年）唐初将领，名峤，字开山，雍州鄠县人。李渊太原起兵后，他应召入幕，参与攻取长安，历任渭北道元帅长史等职。武德元年随李世民、刘文静征讨薛举，因浅水原战败被除名；后复起用，随军平定刘黑闼，武德五年卒于军中，贞观年间图形凌烟阁。
    growth_range:
