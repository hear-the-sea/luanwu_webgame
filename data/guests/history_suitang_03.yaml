  - key: hist_suitang_0110_gaoshilian
    name: 高士廉
    avatar: pig/文032.png
    default_gender: male
    archetype: civil
    flavor: （？—647年）唐初大臣，名俭，渤海蓨人，长孙皇后的舅父。隋末被贬岭南，后归唐，参与玄武门之变，为李世民所信任。贞观年间历任侍中、吏部尚书、尚书右仆射，封申国公，主持修撰《氏族志》，重新厘定士族门第，抑制旧门阀势力。贞观二十一年卒，陪葬昭陵，图形凌烟阁。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 24
      agility: 14
  - key: hist_suitang_0111_wenyanbo
    name: 温彦博
    avatar: pig/文032.png
    default_gender: male
    archetype: civil
    flavor: （573年—640年）唐初大臣，字大临，并州祁县人。隋末随罗艺归唐，历任中书侍郎；武德年间出使突厥被扣留，后得归。贞观年间官至中书令、尚书右仆射，参与机要，并参与处置归附的突厥部众。贞观十四年病逝，谥曰恭，为太宗朝前期重臣之一。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 24
      agility: 14
  - key: hist_suitang_0112_cenwenben
    name: 岑文本
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （595年—645年）唐初大臣、文学家，字景仁，南阳棘阳人。隋末为萧铣中书侍郎，归唐后任中书舍人，掌起草诏诰，文辞赡速，深得太宗赏识。后官至中书令，参与修撰《周书》。贞观十九年随太宗征高句丽，负责粮运与文书，因操劳过度卒于幽州军中，谥曰宪。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 48
      defense: 24
      agility: 16
  - key: hist_suitang_0096_liliheng
    name: 李恒
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （795年—824年）唐穆宗，宪宗第三子，820年在宦官拥立下即位。在位期间耽于游宴、击球，朝政渐弛，曾用裴度、元稹等，然党争渐起。长庆元年下令裁减军镇，引发河朔三镇复叛，此后藩镇再不受朝廷节制。长庆四年服金丹病逝，年三十，太子李湛继位。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 46
      defense: 24
      agility: 16
  - key: hist_suitang_0113_xujingzong
    name: 许敬宗
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: （592年—672年）唐初大臣、史官，字延族，杭州新城人。隋末参加瓦岗军，后归唐，历任著作郎、中书舍人等，参与修撰《武德实录》《贞观实录》及《晋书》。高宗时迎合武后，与李义府等支持废王皇后、立武氏，官至中书令，权势颇盛。他掌修国史多年，然为人贪冒，为时论所讥。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 50
      defense: 24
      agility: 12
  - key: hist_suitang_0114_shangguanyi
    name: 上官仪
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: （608年—665年）唐代诗人、宰相，字游韶，陕州陕县人。贞观进士，历任秘书郎、弘文馆学士，高宗时官至西台侍郎、同东西台三品。其诗绮错婉媚，时人效之，称“上官体”。麟德元年奉高宗命起草废武后诏书，事泄后为武后所忌，与儿子上官庭芝一同下狱而死，孙女即上官婉儿。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 50
      defense: 22
      agility: 16
  - key: hist_suitang_0115_liyifu
    name: 李义府
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （614年—666年）唐高宗时期宰相，瀛州饶阳人。因拥立武昭仪为后而得高宗信任，官至中书令，与许敬宗同掌朝政；曾主持重修氏族谱系，改《氏族志》为《姓氏录》，抬高武氏与新进门第，旧士族颇为不满。他外表恭顺而内心阴刻，时人称其“笑里藏刀”。后因贪赃、结党获罪，流放巂州，死于贬所。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 24
      agility: 14
  - key: hist_suitang_0116_peiyan
    name: 裴炎
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: （？—684年）唐代宰相，绛州闻喜人。高宗临终受遗诏辅政，中宗即位后欲以韦后之父韦玄贞为侍中，裴炎力争不可，遂与武后合谋废中宗。武后临朝后，他反对立武氏七庙、追王其祖，渐与武后离心；光宅元年徐敬业起兵，裴炎被诬与叛军通谋，下狱处死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 26
      agility: 12
  - key: hist_suitang_0117_xujingye
    name: 徐敬业
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （？—684年）唐代将领，曹州离狐人，英国公李勣之孙。武则天废中宗、临朝称制后，徐敬业以匡复唐室为名在扬州起兵，旬日间聚众十余万，骆宾王为其作《讨武曌檄》，传诵一时。武后遣李孝逸等率军镇压，徐敬业兵败，逃至海陵，为部将王那相所杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 20
      defense: 28
      agility: 14
  - key: hist_suitang_0120_yuwentong
    name: 宇文融
    avatar: pig/文029.png
    default_gender: male
    archetype: civil
    flavor: （？—733年）唐代财政官员，京兆万年人。开元年间任监察御史、御史中丞，主持全国括户、检田，清查出大量隐漏户口与田亩，使赋税收入大增，并建议将客户就地附籍。后官至同中书门下平章事，因与张说等争执，屡遭贬谪，开元二十一年卒于赴贬所途中。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 50
      defense: 24
      agility: 12
  - key: hist_suitang_0121_liyuanhong
    name: 李元纮
    avatar: pig/文049.png
    default_gender: male
