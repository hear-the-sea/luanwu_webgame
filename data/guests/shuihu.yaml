      defense: 24
      agility: 10
  - key: hero_ilrock_04862
    name: 欧鹏
    avatar: monkey_wu_male12.png
    default_gender: male
    archetype: military
    flavor: 绰号“摩云金翅”，原在黄门山与蒋敬、马麟、陶宗旺聚义，身手轻捷，惯使刀枪。宋江等人救出江州众好汉后经过黄门山，他迎接结交，从此带着旧寨伙伴归入梁山。大聚义时列马军小彪将，承担征战与远探出哨的职分。比起在厅上筹谋，他更习惯跨马提兵，与同伴一道奔赴前阵。出自《水浒传》。
    recruitable: true
    growth_range:
