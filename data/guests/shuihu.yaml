      agility: 12
  - key: hero_ilrock_04867
    name: 吕方
    avatar: pig/武016.png
    default_gender: male
    archetype: military
    flavor: 因喜爱吕布而仿其装束，使一杆方天画戟，绰号“小温侯”，原在对影山聚众。与郭盛较量时，双戟缨络纠缠不解，花荣一箭射断，才使两人停斗结交。此后随宋江投奔梁山，聚义后与郭盛同守中军。对影山相争的两杆画戟，从此成为相互照应的兵器，在帅旗近旁护住将令与阵脚。出自《水浒传》。
    recruitable: true
