  - key: hero_ilrock_04874
    name: 樊瑞
    avatar: monkey_wu_male4.png
    default_gender: male
    archetype: civil
    flavor: 芒砀山寨主，绰号“混世魔王”，善用法术，与项充、李衮聚众，曾扬言要吞并梁山。宋江领军来战，公孙胜以道术破去他的手段，他才归附山寨，并拜公孙胜为师。大聚义后列为步军将校，仍与旧日伙伴出阵。由争雄一方到重新问道学艺，他不只有好胜的心气，也肯在真正的高手面前低头求教。出自《水浒传》。
