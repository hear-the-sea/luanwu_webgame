      defense: 25
      agility: 15
  - key: hero_ilrock_04863
    name: 邓飞
    avatar: pig/武011.png
    default_gender: male
    archetype: military
    flavor: 双眼红赤，故称“火眼狻猊”，惯使一条铁链，原与孟康在饮马川聚众。遇上受冤的裴宣后，他尊其为首领，后来又经戴宗、杨林引荐，带着伙伴投奔梁山。上山后列马军小彪将，随众出哨、征战。铁链挥起，打法与常见枪刀颇有不同；旧寨相处的情分，也随着几人的马蹄一同进入山寨。出自《水浒传》。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 12
      defense: 25
      agility: 15
  - key: hero_ilrock_04864
    name: 燕顺
    avatar: monkey_wu_male4.png
    default_gender: male
    archetype: military
    flavor: 原在清风山做寨主，赤发黄须，形貌威猛，绰号“锦毛虎”。宋江落入寨中时，他得知来人身份，立刻改以礼相待；此后又卷入清风寨的恩怨，与王英、郑天寿等伙伴一道投奔梁山。大聚义后列马军小彪将，执行出哨与骑兵征战。江湖上认得情义，也敢执兵迎敌，清风山的旧交始终随他同行。出自《水浒传》。
    recruitable: true
    growth_range:
