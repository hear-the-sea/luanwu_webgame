  - key: hero_ilrock_04869
    name: 安道全
    avatar: pig_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: 建康府的名医，内外科皆有心得，因医术精湛得了“神医”的称号。宋江背上生疮、病势危急时，张顺远行请他救治，他随之入山，施药使宋江脱险。大聚义后，他专治梁山众人的诸般疾病。军中刀伤、行路积劳与寻常病痛，都需要细心诊察；比起争夺战功，他更关心眼前病人能否撑过这一夜。出自《水浒传》。
    recruitable: true
    growth_range:
