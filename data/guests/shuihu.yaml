      intellect: 58
      defense: 24
      agility: 12
  - key: hero_ilrock_04870
    name: 皇甫端
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: 东昌府兽医，碧眼紫髯，形貌与常人不同，人称“紫髯伯”。随张清归附梁山后，他专管医治军马，熟悉马匹患病时的症候与照护办法。山寨骑兵众多，远途行军、连番征战都离不开健壮坐骑，他的手艺也因此格外要紧。将领忙着磨刀备阵时，他常要先看一看马厩，确保那些无言的战伴仍能负重奔驰。出自《水浒传》。
    recruitable: true
    growth_range:
