      intellect: 58
      defense: 22
      agility: 12
  - key: hero_ilrock_04872
    name: 鲍旭
    avatar: pig/武091.png
    default_gender: male
    archetype: military
    flavor: 枯树山的寨主，惯使一口阔剑，性情凶猛，绰号“丧门神”。李逵与焦挺来到山寨后，他与二人结交，又随众参与凌州一带的战事，随后归入梁山。大聚义时列为步军将校，常与李逵、项充、李衮一同冲阵。剑势沉重，遇敌直进，他习惯在混战里与伙伴相互策应，把勇力用在最先接敌之处。出自《水浒传》。
