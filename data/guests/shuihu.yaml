    - 7
    attribute_weights:
      force: 8
      intellect: 60
      defense: 20
      agility: 12
  - key: hero_ilrock_04866
    name: 蒋敬
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: 原是读书人，精通书算，也习枪棒，因仕途无成而在黄门山聚众，绰号“神算子”。与欧鹏等人结交宋江后，他一同归入梁山，掌管钱粮支出与收纳。兵马越多，粮草账目越繁，他便把细致的计算用于军中供给。并非每次立功都在两军交锋之处，库中一笔一笔清楚的账，也能让将士安心出征。出自《水浒传》。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
