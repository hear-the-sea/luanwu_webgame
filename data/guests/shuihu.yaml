  - key: hero_ilrock_04876
    name: 孔亮
    avatar: pig/武053.png
    default_gender: male
    archetype: military
    flavor: 孔明之弟，绰号“独火星”，与兄长一起在孔家庄习练枪棒，曾拜宋江为师。武松醉后误打他，随后经宋江说明，两人才化解争执。青州官府拘押亲人后，他与兄长举兵相救，又在三山聚义时奔走求援。归入梁山后，兄弟二人同任中军护卫，既守帅阵，也带着早年对师长和亲人的那份牵挂。出自《水浒传》。
