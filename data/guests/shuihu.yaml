  - key: hero_ilrock_04875
    name: 孔明
    avatar: monkey_wu_male13.png
    default_gender: male
    archetype: military
    flavor: 孔家庄的青年好汉，绰号“毛头星”，孔亮的兄长，曾留宋江在家中作客，向他学些枪棒。叔父被青州官府拘禁时，兄弟聚众前往救人，孔明反被呼延灼擒住；后来经三山好汉攻打青州才得脱身，随众上梁山。大聚义后与弟弟同守中军，从乡间练武到跟随军马，兄弟的进退始终紧紧相连。出自《水浒传》。
