      defense: 20
      agility: 20
  - key: hero_ilrock_04865
    name: 凌振
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: 东京火药局出身的军官，绰号“轰天雷”，精于造炮与施放，能借火药将炮石送往远处。随呼延灼进攻梁山时，他在岸上架炮轰击，后来被水军诱入湖荡擒住，转而加入山寨。聚义后专造大小号炮，遇到攻城、破阵等硬仗便有用武之地。刀枪尚未接敌，炮声已经先一步震动城头。出自《水浒传》。
    recruitable: true
    growth_range:
