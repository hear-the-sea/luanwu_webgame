heroes:
  green:
  - key: hero_ilrock_04868
    name: 郭盛
    avatar: pig/武016.png
    default_gender: male
    archetype: military
    flavor: 嘉陵人，原做贩运水银的生意，船只失事后流落江湖，因善使画戟、喜作薛仁贵装束，绰号“赛仁贵”。到对影山与吕方比试时，双戟缠住，被花荣一箭分开，二人反而结成伙伴。后来一同上梁山，聚义后共同守护中军。原本争锋的画戟转为相互策应，护在帅阵左右，也护住一路患难结下的交情。出自《水浒传》。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 12
      defense: 25
      agility: 15
  - key: hero_ilrock_04846
    name: 杨雄
    avatar: pig/武053.png
    default_gender: male
    archetype: military
    flavor: 面色微黄，因此得名“病关索”，原在蓟州兼做刽子手，刀下营生之外也有一身武艺。受石秀相助后与其结为兄弟，却因妻子潘巧云与裴如海私通而闹出杀人风波。二人离开蓟州，又卷入祝家庄争斗，终于投奔梁山。此后列入步军头领，与石秀并肩出阵，江湖交情也经受了刀兵考验。出自《水浒传》。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 46
      intellect: 14
      defense: 25
      agility: 15
  - key: hero_ilrock_04848
    name: 解珍
    avatar: pig_wu_male2.png
    default_gender: male
    archetype: military
    flavor: 登州猎户，解宝的兄长，身形瘦长，绰号“两头蛇”。兄弟奉命打虎，猎物落入毛太公庄院，反被夺去功劳、诬陷入狱。顾大嫂等亲友联手劫牢，才把二人救出，随后一同归入梁山。常年追踪野兽、翻越山岭，练出矫健身手和吃苦的筋骨；列入步军头领后，仍敢沿险径深入敌境。出自《水浒传》。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 46
      intellect: 6
      defense: 18
      agility: 30
  - key: hero_ilrock_04849
    name: 解宝
    avatar: monkey/其他随机角色/武064_男_.png
    default_gender: male
    archetype: military
    flavor: 与兄长解珍在登州以打猎为生，性情急烈，绰号“双尾蝎”。为民除虎却被毛太公侵吞猎物，又遭陷害下狱，原本守法谋生的猎户就此走投无路。经孙新、顾大嫂等人营救，他随兄长离开故乡，投奔梁山。上山后列入步军头领，把惯于奔走山野的本领带进军中，兄弟始终相随出战。出自《水浒传》。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 46
      intellect: 6
      defense: 18
      agility: 30
  - key: hero_ilrock_04852
    name: 黄信
    avatar: pig/武016.png
    default_gender: male
    archetype: military
    flavor: 青州兵马都监，因夸口要镇服清风山、二龙山、桃花山，得了“镇三山”的名号。他是秦明的弟子，曾参与拘捕宋江、花荣，押解途中却遇上清风山众人劫夺。后来随秦明归附梁山，成为马军小彪将，负责出哨与征战。昔日在官府阵前追缉山寨，后来也与那些好汉一同披甲上马。出自《水浒传》。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 8
      defense: 28
      agility: 16
  - key: hero_ilrock_04854
    name: 宣赞
    avatar: monkey/其他随机角色/武052_男.png
    default_gender: male
    archetype: military
    flavor: 原是朝廷武官，善于射箭，因容貌丑异，人称“丑郡马”。梁山兵临大名府时，他举荐关胜统兵，自己与郝思文随军同行；征讨失利被擒，受宋江礼遇后转而入伙。上山后列入马军小彪将，仍与关胜等旧日伙伴协同作战。面貌常招人轻视，骑射与军中历练却让他在战阵中自有立足之处。出自《水浒传》。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 50
      intellect: 10
      defense: 25
      agility: 15
  - key: hero_ilrock_04855
    name: 郝思文
    avatar: pig/武015.png
    default_gender: male
    archetype: military
    flavor: 关胜的结义兄弟，通晓武艺，绰号“井木犴”。传说母亲梦见井木犴投胎而生下他，这个星宿名便伴着他闯荡江湖。关胜奉命征讨梁山时，他与宣赞同为辅将，战败后一道归入山寨。聚义后列马军小彪将，仍随旧日兄弟出阵，在枪马交锋和骑兵征战中效力，并不因换了旗号而割舍原有情义。出自《水浒传》。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 8
      defense: 24
      agility: 20
  - key: hero_ilrock_04856
    name: 韩滔
    avatar: pig/武023.png
    default_gender: male
    archetype: military
    flavor: 原任陈州团练使，善使枣木槊，绰号“百胜将”。呼延灼领兵征讨梁山时，他担任正先锋，与彭玘分领前军，曾倚仗连环马压迫山寨。官军失利后，他离开旧营归入梁山，列马军小彪将。惯经军阵的他仍常与彭玘并肩出战，既能在前锋迎敌，也能随大队骑兵推进，旧日同僚成了聚义伙伴。出自《水浒传》。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 46
      intellect: 14
      defense: 25
      agility: 15
  - key: hero_ilrock_04858
    name: 单廷珪
    avatar: monkey/其他随机角色/武男22.png
    default_gender: male
    archetype: military
    flavor: 凌州团练使，绰号“圣水将”，善于以水攻配合兵马作战，部下军士常着黑衣黑甲。与魏定国奉命抵御关胜时，他出阵交锋，被擒后得以释放，终于折服归附。加入梁山后列马军小彪将，又帮助劝说魏定国入伙。枪马本领之外，他尤其熟悉水势与战场布置，和神火将的用兵手段各有长处。出自《水浒传》。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 48
      intellect: 12
      defense: 25
      agility: 15
  - key: hero_ilrock_04859
    name: 魏定国
    avatar: pig/武016.png
    default_gender: male
    archetype: military
    flavor: 与单廷珪同任凌州团练使，军中善用火攻，人称“神火将”。奉命抵抗梁山兵马时，他布置火器，曾使关胜陷入困境；城池失守后仍不肯轻易服输，最终在单廷珪等人的劝说下归附。聚义后成为马军小彪将，把原有火攻本领带入山寨。遇阵势胶着，除了刀枪迎敌，他也能借烈焰扰乱敌军进退。出自《水浒传》。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 45
      intellect: 15
      defense: 20
      agility: 20
  - key: hero_ilrock_04860
    name: 萧让
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: 济州一带的书法能手，绰号“圣手书生”，熟悉多种字体，善于摹写笔迹。宋江在江州陷入死罪时，他曾与金大坚合作仿造蔡京家书，试图从官府手中救人，却因印信细节露出破绽。后来留在梁山，掌管行文走檄、调兵遣将所需的文书。案头笔墨不如阵前刀枪醒目，却承载着各营往来的军令。出自《水浒传》。
    recruitable: true
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 60
      defense: 18
      agility: 14
  - key: hero_ilrock_04861
    name: 裴宣
    avatar: pig/文050.png
    default_gender: male
    archetype: civil
    flavor: 原任京兆府孔目，熟悉刑名文案，因秉公办事而受奸官排挤，流落饮马川落草。人称“铁面孔目”的他，与邓飞、孟康结伴，经戴宗等人联络后归入梁山。聚义分工时，他掌管定功赏罚，核查各营功过、主持军纪。离开官府并未丢下旧日的认真，面对山寨兄弟，仍愿把赏罚分明地写在册上。出自《水浒传》。
    recruitable: true
    growth_range:
