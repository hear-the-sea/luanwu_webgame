    default_gender: male
    archetype: civil
    flavor: （1761年—1802年）字皋文，号茗柯，清代经学家、词人，常州词派先声。张惠言研治《周易》等经学，也以《茗柯词》重振词的寄托传统，主张词中可以有比兴、有身世之感，不必只供宴席唱和。他的词论影响了常州派后来对家国、政治和身世的书写。短短一生，既要校经，又要填词，笔锋一转，案头便从竹简换成了长调。
