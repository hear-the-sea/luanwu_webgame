    default_gender: male
    archetype: civil
    flavor: （1692年—1758年）字叶承，号麟洲，清代大臣、书法家，官至文华殿大学士、吏部尚书。汪由敦长于制诰和馆阁文书，行书端雅，书法与政务都讲究法度；乾隆朝许多诏令、文稿经其手而成。他并非只在砚台旁作清客，吏部任上还要面对官员升黜与朝廷人事。馆阁体看似平稳，写字的人却得在每一笔之间守住分寸。
