    flavor: （1720年—1796年）字智安，号补山，清代官员、经略。孙士毅曾参与平定台湾林爽文起义，并出任两广总督，处理西南边务和对外事务；乾隆末年出兵安南时清军失利，他的经历既有军政与外交才干，也有战场判断失误的代价。胜仗与败局并存，才是孙士毅军政生涯的完整面貌；统帅的本领，也体现在能从两者之间留下可供后人检视的教训。
