    flavor: （1734年—1792年）字耳山，号凝庄，乾隆朝学者、官员，《四库全书》总纂官之一。陆锡熊参与提要、校勘和典籍分类等繁重工作，与纪昀等共同推进这项庞大工程；总纂并不等于一人独写全书，他的功劳在于组织、判断和反复核校。书海无边，最磨人的不是翻开第一卷，而是面对成千上万条异文仍保持清醒。
