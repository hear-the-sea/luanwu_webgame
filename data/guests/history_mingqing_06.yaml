  - key: hist_mingqing_0209
    name: 赵秉忠
    default_gender: male
    archetype: civil
    flavor: （1573年—1626年）字季卿，号圣海，明代官员，万历二十六年状元。赵秉忠的殿试卷至今保存，策文谈广开言路、体恤民生和实心任事，是现存明代状元卷真迹中的珍贵一件；那是应试文章，却也留下了一个士子对政务的完整思考。他后来官至礼部尚书，仕途并未如策文般一帆风顺。纸上论国，殿上做人，才是状元真正要过的两关。
    growth_range:
