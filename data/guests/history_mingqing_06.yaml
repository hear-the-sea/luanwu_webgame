    default_gender: male
    archetype: civil
    flavor: （1720年—1772年）字宗磐，号稼轩，乾隆十年状元，清代官员、画家。钱维城善画山水，笔墨端整而有生气，受到乾隆帝赏识；仕途上则历任侍郎等职，参与刑名和部务。状元、官员、画家三种身份并行，并不意味着每一幅画都带着圣眷、每一道政令都没有难处。钱维城能把文人笔墨带进仕途，也得在宫廷审美和个人风格之间找自己的路。
