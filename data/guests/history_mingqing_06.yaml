      defense: 18
      agility: 12
  - key: hist_mingqing_0210
    name: 骆腾凤
    default_gender: male
    archetype: civil
    flavor: （1771年—1842年）字鸣周，号等峰，清代数学与测量学者。现存材料对其仕履和具体测绘项目记载有限，可知其学问与测量、算术等实用知识相连。他将抽象算式落实到尺度、距离与地面测量，留下乾嘉学术重视实证的一面。
