  - key: hist_mingqing_0213
    name: 董邦达
    default_gender: male
    archetype: civil
    flavor: （1699年—1769年）字孚存，号东山，清代官员、山水画家，官至礼部尚书。董邦达山水取法文人画传统，笔墨清润而有丘壑，亦参与宫廷绘画和图册制作；他的作品既有个人审美，也受乾隆朝官方品味约束。能在翰林、礼部的案牍与画院的山水之间往返，是他的特殊经历。宫廷要的是可供观览的山河，他仍设法在山石间留下自己的气息。
    growth_range:
