    flavor: （1574年—1648年）明末女将，字贞素，四川石砫人，土司马千乘之妻，统领白杆兵。秦良玉率军参与平定播州杨应龙、奢安之乱，并北上抗击后金，官至总兵、都督佥事；明亡后仍据守石砫，顺治五年病逝，南明追赠太子太保。
