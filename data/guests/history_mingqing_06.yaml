    archetype: civil
    flavor: （1663年—1706年）字顺古，清初学者。李钟伦身处清初重视实学与经世议题的儒林，读书、交游与行迹都留在那一代学人的灯影里；一盏案头孤灯，也足以照见时代的转折。
