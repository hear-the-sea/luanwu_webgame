    name: 姚际恒
    default_gender: male
    archetype: civil
    flavor: （1647年—1715年）字立方，号九我，清初学者、古籍辨伪家。姚际恒著《古今伪书考》，从文辞、流传和义理等处考察古籍真伪，敢对被奉为经典的文本追问一句“凭什么”。他的怀疑不是逞强唱反调，而是要求证据和传承链条经得起核验。书斋里的对手看不见、摸不着，却比江湖高手更难缠；姚际恒偏要一卷一卷拆招。
    growth_range:
