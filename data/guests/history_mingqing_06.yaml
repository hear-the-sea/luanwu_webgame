  - key: hist_mingqing_0212
    name: 裘曰修
    default_gender: male
    archetype: civil
    flavor: （1712年—1773年）字漫士，号叔度，清代官员、水利家。裘曰修长期参与河工和水政，重视疏浚、堤防、分流与蓄泄之间的配合，后来官至工部尚书等职。治水不是在奏章上喊一句“顺应水势”便算完事，河道的泥沙、堤身的高低和百姓的迁徙都要一并盘算。裘曰修的功夫，就在把水患当成一项长期而具体的政务。
