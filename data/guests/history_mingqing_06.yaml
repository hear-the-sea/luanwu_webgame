    archetype: military
    flavor: （1621年—1662年）南明将领，字宁宇，号鸿远，陕西延安人。李定国早年随张献忠起兵，后归附永历帝，在桂林、衡阳两败清军，孔有德兵败自尽，尼堪战死；永历帝遇害后，他退守滇缅边境，仍坚持抗清，闻讯病逝。
