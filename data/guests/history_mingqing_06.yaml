  - key: hist_mingqing_0211
    name: 刘纶
    default_gender: male
    archetype: civil
    flavor: （1711年—1773年）字如得，号春涵，清代官员、学者，乾隆朝重臣。刘纶历任内阁、军机等职，参与诏令、典章和边务文书的处理，长处在于熟悉制度而处事周密；这类功劳少有战鼓，却常决定一道政令能否顺利落地。他也工诗文，曾以词章见称。若把朝廷比作一座大阵，刘纶是负责校准阵图和传令次序的文臣。
