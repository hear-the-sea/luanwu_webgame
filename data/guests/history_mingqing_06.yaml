    default_gender: male
    archetype: civil
    flavor: （1685年—1764年）字迟暄，号迟圃，清代官员、学者，纪昀之父。纪容舒熟悉经史、律例和地方政务，曾任云南姚安知府；关于其著述，后世常与纪氏家学相提。他对儿子的教育和家风影响深，却首先是一个要处理边地讼狱、钱粮与民情的地方官。名门家学从来不是凭空长成，先要有人替它把地基夯实。
