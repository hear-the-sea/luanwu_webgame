  - key: hist_mingqing_0218
    name: 曹文埴
    default_gender: male
    archetype: civil
    flavor: （1735年—1798年）字近薇，号竹虚，清代官员，官至大学士等职。曹文埴熟悉户部、吏部等中枢事务，长于文书、财政和行政调度；他的声名主要来自长期办事，而非一场惊天动地的奇策。乾隆朝官场重文书、重程序，能把千头万绪理成可执行的条目，本身就是硬功。其子曹振镛后来亦入阁，父子相继的家族经历又为这段仕途添了一层回声。
