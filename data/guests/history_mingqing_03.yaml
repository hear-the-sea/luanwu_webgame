  - key: hist_mingqing_0104
    name: 左光斗
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: （1575年—1625年）明代官员，字遗直，号浮丘，安徽桐城人，东林党人。左光斗万历三十五年中进士，天启年间任左佥都御史，与杨涟等弹劾魏忠贤及其党羽，因此被捕入狱；他在狱中受刑，仍勉励前来探望的弟子史可法继续任事，天启五年死于狱中。弘光时追谥忠毅，以气节闻名。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
