  - key: hist_mingqing_0106
    name: 潘季驯
    avatar: pig/文048.png
    default_gender: male
    archetype: civil
    flavor: （1521年—1595年）明代治河官员，字时良，号印台，浙江乌程人。潘季驯嘉靖二十九年中进士，曾四任总理河道，主持黄河与运河治理，提出“束水攻沙”“蓄清刷黄”的方略，通过筑堤约束水流以冲刷泥沙；他晚年将治河经验整理为《河防一览》，万历二十三年病逝。其治河理论对后世影响较大。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0101
    name: 归有光
    avatar: monkey_wen_male9.png
