    name: 耿炳文
    avatar: pig/武010.png
    default_gender: male
    archetype: military
    flavor: （1334年—1403年）明朝开国将领，封长兴侯，以善守城著称。耿炳文早年随父归附朱元璋，在长兴镇守十年，多次击退张士诚军的进攻；靖难之役中，他奉建文帝之命率军北上，在真定败于燕军，随后被召回。永乐元年遭弹劾，畏罪自尽。
