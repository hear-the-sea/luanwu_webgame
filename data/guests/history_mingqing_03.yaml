  - key: hist_mingqing_0087
    name: 宋濂
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （1310年—1381年）明初文臣，字景濂，号潜溪，浦江人。宋濂曾任翰林学士，洪武初年主持修撰《元史》，并参与制定明初礼制，与刘基、高启并称明初诗文三大家；他晚年因长孙宋慎卷入胡惟庸案，经马皇后等人求情免死，被流放茂州，途中病逝。其散文平实典雅，《送东阳马生序》流传甚广。
    growth_range:
