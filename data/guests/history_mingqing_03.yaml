  - key: hist_mingqing_0065
    name: 沐英
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: （1344年—1392年）明朝开国将领，字文英，朱元璋养子，封西平侯。洪武十四年，沐英随傅友德、蓝玉征讨云南，平定后奉命留镇，修筑城池、兴办屯田，稳定西南边地；他听闻马皇后与太子朱标相继去世，悲痛成疾，洪武二十五年病逝于云南任所，后归葬南京，追封黔宁王。沐氏自此世镇云南。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0071
    name: 胡宗宪
    avatar: pig/文031.png
    default_gender: male
    archetype: civil
    flavor: （1512年—1565年）明代抗倭官员，字汝贞，号梅林，徽州绩溪人。胡宗宪嘉靖年间任浙江巡抚、总督，主持东南抗倭，重用戚继光、俞大猷等将领，先后招抚、诱捕徐海与王直等海上首领；他主持编纂《筹海图编》，整理沿海防务。严嵩失势后，他因严党案被捕，嘉靖四十四年死于狱中；万历年间获平反，追谥襄懋。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0072
    name: 谭纶
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （1520年—1577年）明代将领、官员，字子理，江西宜黄人。谭纶嘉靖年间任福建巡抚，参与东南抗倭，与戚继光并称“谭戚”；隆庆年间调任蓟辽总督，与戚继光共同整顿边军、修筑敌台与城堡，加强北方防务，后官至兵部尚书。万历五年病逝，追赠太子太保，谥襄敏。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0076
    name: 卢象升
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （1600年—1639年）明末将领，字建斗，宜兴人，文官出身，曾组建天雄军。卢象升在北方多次击退清军，崇祯九年出任宣大总督，主持抗清；崇祯十二年，他奉命与清军交战于巨鹿贾庄，因援军未至，率部力战而死，年仅三十九岁。
    growth_range:
