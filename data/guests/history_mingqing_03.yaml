      agility: 12
  - key: hist_mingqing_0093
    name: 夏元吉
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: （1366年—1430年）明代户部尚书，字维喆，江西德兴人，夏原吉（一作夏元吉）。夏原吉理财精慎，永乐年间主持户部，为迁都北京、成祖北征和郑和下西洋筹措粮饷；他曾因劝谏明成祖停止北征而被下狱，明仁宗即位后重新主持户部，宣德五年在任内病逝，谥忠靖。其理财能力为永乐一朝所倚重。
    growth_range:
