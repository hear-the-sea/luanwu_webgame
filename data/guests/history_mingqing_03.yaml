    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0064
    name: 李文忠
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （1339年—1384年）明朝开国将领，字思本，朱元璋外甥，封曹国公。李文忠少年从军，洪武初年参加北伐，攻克应昌，俘获北元宗室；其后长期镇守北平，主持北方防务。他曾因直谏朱元璋而触怒皇帝，洪武十七年病逝，追封岐阳王。
    growth_range:
    - 6
    - 9
