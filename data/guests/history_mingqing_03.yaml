    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0059
    name: 汤和
    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （1326年—1395年）明朝开国将领，朱元璋同乡旧友，封信国公。汤和早年随朱元璋起兵，参与平定方国珍、陈友谅和明夏，明朝建立后奉命修筑浙江沿海卫所城防，整顿海防以御倭寇；他晚年洞察时局，主动交还兵权，回乡养老，洪武二十八年病逝，追封东瓯王，谥襄武。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0060
    name: 傅友德
    avatar: monkey/其他随机角色/武047_男.png
    default_gender: male
    archetype: military
    flavor: （生年不详—1394年）明朝开国将领，洪武三年封颍川侯，后进封颍国公。傅友德早年归附朱元璋，先后参加平定四川、甘肃和云南的战事，洪武十四年与蓝玉、沐英率军入滇，屡立战功，以骁勇善战著称；洪武二十七年，他在宫中宴会上触怒朱元璋，被迫自尽，两个儿子也一同遇害。
    growth_range:
    - 6
