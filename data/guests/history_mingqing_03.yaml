    avatar: pig/文050.png
    default_gender: male
    archetype: civil
    flavor: （1512年—1578年）明代官员，字肃卿，号中玄，河南新郑人。高拱隆庆年间入阁，兼掌吏部，整顿官员考核、处理边防事务，隆庆末年为内阁首辅；明穆宗去世后，他与张居正、冯保发生权力冲突，被罢官回乡。万历六年病逝，后追赠太师，谥文襄。
