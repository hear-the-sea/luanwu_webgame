      defense: 24
      agility: 16
  - key: hist_mingqing_0061
    name: 冯胜
    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （生年不详—1395年）明朝开国将领，初名国胜，定远人，封宋国公。冯胜早年与兄冯国用归附朱元璋，参加平定陈友谅、张士诚的战事；洪武五年率西路军北伐，收复河西走廊；洪武二十年，他以征虏大将军率军北征，降服北元太尉纳哈出，收复辽东；洪武二十八年，他被朱元璋赐死。
