  - key: hist_mingqing_0088
    name: 方孝孺
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （1357年—1402年）明初学者、官员，字希直，号逊志，宁海人，师从宋濂。方孝孺建文帝时任翰林侍讲，参与朝政；靖难之役后，朱棣攻入南京，命他起草即位诏书，他拒绝执笔并当面斥责朱棣，随后被处死，宗族与门生受到株连。他以气节著称，其著作在后世广为传抄。
