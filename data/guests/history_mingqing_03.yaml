      agility: 12
  - key: hist_mingqing_0091
    name: 杨荣
    avatar: pig/文028.png
    default_gender: male
    archetype: civil
    flavor: （1371年—1440年）明代内阁大臣，初名子荣，字勉仁，建安人，与杨士奇、杨溥并称“三杨”。杨荣建文二年中进士，永乐年间入值文渊阁，多次随明成祖北征；永乐二十二年成祖崩于榆木川，他与金幼孜秘不发丧，驰报太子。正统五年病逝，追赠少师，谥文敏。
    growth_range:
