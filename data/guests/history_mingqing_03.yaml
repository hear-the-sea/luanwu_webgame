  - key: hist_mingqing_0090
    name: 杨士奇
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （1365年—1444年）明代内阁大臣，名寓，字士奇，江西泰和人，与杨荣、杨溥并称“三杨”。杨士奇历事永乐、洪熙、宣德、正统四朝，永乐初年入值文渊阁，洪熙、宣德间主持阁务，前后辅政四十余年，是“仁宣之治”的重要推动者；正统年间因儿子杨稷犯法受到牵连，忧愤成疾，正统九年病逝，谥文贞。
    growth_range:
