    name: 解缙
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: （1369年—1415年）明初文臣，字大绅，吉水人。解缙洪武二十一年中进士，永乐初年任翰林侍读学士，奉明成祖之命主持编纂《永乐大典》，汇集典籍数千种；后因参与太子立储之争被贬谪，又遭下狱。永乐十三年，锦衣卫指挥纪纲将他灌醉后埋于积雪中而死，年四十七。
