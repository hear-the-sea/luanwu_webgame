  - key: hist_mingqing_0058
    name: 蓝玉
    default_gender: male
    archetype: military
    flavor: （生年不详—1393年）明朝开国名将，常遇春之妻弟。他骁勇善战，于捕鱼儿海之战中亲率精骑深入漠北，俘虏北元皇帝次子及妃嫔公主百余人，几乎彻底摧毁了北元的指挥体系，立下不世之功。然而蓝玉晚年居功自傲，蓄养庄奴，侵占民田，甚至因关吏开门稍迟便毁关而入。最终引发了牵连一万五千余人的“蓝玉案”。他的一生是功臣权欲膨胀导致政治悲剧的典型范本。其勇力虽然冠绝一时，但由于缺乏政治远见与自律，在大明王朝权力的重构中成为了牺牲品。其命运的惨烈收场，为明初政治斗争划上了一个血腥且沉重的注脚。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0059
    name: 汤和
    default_gender: male
    archetype: military
    flavor: （1326年—1395年）明朝开国名将，也是朱元璋儿时的伙伴。他在平定方国珍及征讨西蜀中立下赫赫战功，但他最受后世称道的是其极高的政治智慧。在朱元璋开始清算功臣、收回兵权的关键时期，汤和敏锐察觉到了帝王的猜忌，主动请求解甲归田。回乡后，他不仅为人低调，还主动负责东南沿海的倭寇防务，修筑了大量卫所。汤和是中国古代名将中难得能够“功成身退、善始善终”的典范，他的家族也因此得以世代荣显。他那种知进退、明损益的处世哲学，在充满杀机的明初政坛中展现了极其深厚的人格魅力与生存智慧。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0060
    name: 傅友德
    default_gender: male
    archetype: military
    flavor: （生年不详—1394年）颖国公，以骁勇著称，曾立下“七战七捷”的辉煌战绩。他先后参与平定四川、征讨甘肃、远征云南，为大明开拓西南疆土数千里，可谓战功卓著。然而，这位为大明江山立下汗马功劳的宿将在晚年因受朱元璋猜忌，在御宴上被逼愤而自刎，其子亦未能幸免。傅友德在战场上冲锋陷阵、勇冠三军，是中国古代职业军人的杰出代表。他那种宁折不弯的性格，既成就了他的不世军功，也最终导向了他的悲剧命运，反映了明初“伴君如伴虎”的残酷政治现实。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0061
    name: 冯胜
    default_gender: male
    archetype: military
    flavor: （生年不详—1395年）宋国公，明朝开国名将。他在平定张士诚、陈友谅的过程中立下累累战功，多次担任征虏大将军北伐漠北，并在金山之战中成功降服北元名将纳哈出，基本肃清了辽东地区的残余势力。冯胜不仅长于统兵，亦在北方边防建设上贡献巨大。然而，随着明初皇权的极度扩张，他由于功高权重且与皇室联姻，最终亦未能逃脱朱元璋的猜忌而被赐死。冯胜的一生是在马背上建立功勋，却在深宫的疑虑中落幕，他的军事才干为大明疆域的稳固起到了至关重要的作用，但他的人生终局则是明初功臣悲剧的缩影。
    growth_range:
