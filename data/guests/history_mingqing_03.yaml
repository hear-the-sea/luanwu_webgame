    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （1372年—1446年）明代内阁大臣，字弘济，湖广石首人，与杨士奇、杨荣并称“三杨”。杨溥建文二年中进士，永乐年间因太子案被下狱十年，在狱中仍坚持读书；明仁宗即位后获释入内阁，历任礼部尚书、武英殿大学士，宣德、正统间与二杨同辅朝政，正统十一年病逝，谥文定。
    growth_range:
