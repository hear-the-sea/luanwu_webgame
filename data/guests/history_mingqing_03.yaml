      defense: 24
      agility: 16
  - key: hist_mingqing_0062
    name: 胡大海
    avatar: pig/武010.png
    default_gender: male
    archetype: military
    flavor: （生年不详—1362年）明朝开国将领，虹县人，追封越国公。胡大海早年归附朱元璋，参加平定浙东、江西等地的战事，治军严明，不许士卒扰民；他还向朱元璋推荐宋濂、刘基等文士。至正二十二年，他镇守金华时被部将蒋英刺杀，朱元璋闻讯十分痛惜，后追封越国公，谥武庄。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0063
    name: 廖永忠
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
    flavor: （1323年—1375年）明朝开国将领，巢县人，廖永安之弟，封德庆侯。廖永忠善于水战，元末随兄投奔朱元璋，鄱阳湖之战中率战船突击陈友谅军；洪武四年，他随汤和伐明夏，率水师直抵重庆，迫降明昇。洪武八年，他因僭用龙凤纹饰等罪被赐死。
    growth_range:
