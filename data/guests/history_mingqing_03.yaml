      agility: 12
  - key: hist_mingqing_0102
    name: 李贽
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （1527年—1602年）明代思想家，原名载贽，字宏甫，号卓吾，福建晋江人。李贽曾任云南姚安知府，晚年辞官后在麻城等地讲学，著有《焚书》《藏书》，提出“童心说”，主张尊重人的真实性情，因言论激烈受到弹劾；万历三十年，他被捕下狱，自尽于狱中。其思想在晚明士人中影响深远。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
