    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0097
    name: 杨继盛
    avatar: pig/文031.png
    default_gender: male
    archetype: civil
    flavor: （1516年—1555年）明代官员，字仲芳，号椒山，直隶容城人。杨继盛嘉靖二十六年中进士，任兵部员外郎时上疏弹劾严嵩，列举“五奸十大罪”，因此被捕下狱；他受刑后仍拒绝认罪，嘉靖三十四年遇害，临刑前留下“浩气还太虚，丹心照千古”的诗句。后世追赠太常少卿，谥忠愍，以刚直著称。
