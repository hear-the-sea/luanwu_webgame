  - key: hist_mingqing_0096
    name: 杨廷和
    avatar: pig/文030.png
    default_gender: male
    archetype: civil
    flavor: （1459年—1529年）明代内阁首辅，字介夫，号石斋，四川新都人。杨廷和历仕正德、嘉靖两朝，明武宗去世后主持迎立兴献王朱厚熜为帝，并在嘉靖初年裁汰冗员、清理正德朝弊政；“大礼议”中他坚持继统继嗣之说，与嘉靖帝意见相左，嘉靖三年辞官回乡。其执政干练，晚年因礼议之争失势。
    growth_range:
