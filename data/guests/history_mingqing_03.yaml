  - key: hist_mingqing_0098
    name: 徐阶
    avatar: pig/文014.png
    default_gender: male
    archetype: civil
    flavor: （1503年—1583年）明代内阁首辅，字子升，松江华亭人。徐阶在严嵩任首辅时长期任次辅，隐忍周旋，嘉靖四十一年授意御史弹劾严世蕃，促成严嵩罢官，随后继任首辅；世宗去世后，他起草遗诏，释放因言获罪诸臣，并起用张居正等人，隆庆二年辞官回乡，万历十一年病逝，谥文贞。
