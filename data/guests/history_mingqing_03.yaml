      agility: 16
  - key: hist_mingqing_0062
    name: 胡大海
    default_gender: male
    archetype: military
    flavor: （生年不详—1362年）明初名将，越国公。在朱元璋起兵之初便前来投效，作战极其勇猛且具有进攻性。胡大海虽然出身草莽且不识字，却非常敬重文人，曾先后向朱元璋推荐了宋濂、刘基等杰出人才，为大明政权的文化建设立下大功。他治军极严，严禁士卒扰民，深受所经之地百姓的爱戴。他在镇守金华时，因部下叛变意外遇害，令朱元璋深为痛惜。胡大海的一生充满了草莽英雄的热血与对知识分子的尊重，他在乱世中展现出的那种朴素的爱民情怀与求贤若渴的态度，使其成为了明朝开国将领中德才兼备、备受推崇的一位。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0063
    name: 廖永忠
    default_gender: male
    archetype: military
    flavor: （1323年—1375年）德庆侯，明初水师的重要统帅。他早年归附朱元璋，是经营海疆与内河水系的功勋人物。在著名的鄱阳湖大战中，他亲率战船突击陈友谅舰队，立下头功。明朝建立后，他参与了征讨两广、四川等地的战役，特别是在平定蜀地的战斗中，他率领水师顺江而下，势如破竹，被朱元璋称赞为“功勋第一”。他的一生见证了明初海军的快速崛起，是明朝早期海权的开拓者之一。尽管他晚年因“僭用龙凤纹饰”等罪名被赐死，但他对大明海权奠基的贡献在军事史上具有重要地位。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0064
    name: 李文忠
    default_gender: male
    archetype: military
    flavor: （1339年—1384年）岐阳王，朱元璋的外甥，明初著名的文武全才将领。他自幼随军征战，在北伐漠北、收复辽东的过程中表现卓越。李文忠不仅作战时亲率精骑冲锋，陷阵无畏，在镇守边疆时又能礼贤下士，治军严明，其儒雅的风范在明初武将集团中独树一帜。他生性耿直，曾多次就朱元璋的严苛统治提出谏言，虽一度引发皇帝不满，但终因其身份及赫赫战功得以善终。李文忠死后被追封为岐阳王，配享太庙。他那种将卓越的军事指挥艺术与深厚的文化底蕴完美结合的能力，使其成为了大明初期最受尊崇的守卫者之一。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0065
    name: 沐英
    default_gender: male
    archetype: military
    flavor: （1344年—1392年）黔宁王，朱元璋的养子。他在平定云南的过程中展现出非凡的战略眼光。云南平定后，他被委以重任，世代镇守边陲。沐英在云南推行屯田制度，兴修水利，促进了当地的民族融合与经济稳定。当他听闻马皇后及太子朱标去世的消息后，悲伤过度乃至呕血，足见其忠孝之心。沐氏家族此后镇守云南直到明亡，与大明江山共存亡近三百年，其功勋被誉为“明代第一家”。沐英的一生是对忠诚最完美的诠释，他不仅为大明稳固了西南疆域，更在蛮荒之地播撒了中原文明的火种，其德政至今仍被云南百姓感念。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0071
    name: 胡宗宪
    default_gender: male
    archetype: civil
    flavor: （1512年—1565年）嘉靖朝兵部尚书，东南抗倭的名臣。他在倭寇猖獗之际，以非凡的战略眼光提拔了戚继光、俞大猷等一代名将，并编练新军。他更巧妙利用分化离间之计，成功诱捕倭寇首领王直、徐海，基本肃清了困扰东南沿海多年的倭患。胡宗宪虽因政治斗争依附严嵩而备受争议，但在民族大局上建立了不世之功。最终他因受党争牵连被捕入狱，在狱中愤而自杀，其悲剧结局反映了晚明政坛的险恶与残酷。他是一位极具战略眼光与外交手腕的统帅，其抗倭策略及对人才的任用，对明朝中后期的边防格局产生了极其深远的影响。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0072
    name: 谭纶
    default_gender: male
    archetype: civil
    flavor: （1520年—1577年）明代著名的军事家，与戚继光齐名，并称“谭戚”。他在东南抗倭战役中指挥若定，展现了卓越的战术才干。后北调蓟州，与戚继光密切协作，整饬北方防线，修筑长城堡垒，使北疆安宁多年。谭纶不仅文武兼备，且文章练达，是典型的士大夫统兵代表。他治军严明，深受将士爱戴，在军事理论上亦有显著建树。他的一生是明代中叶文人通过专业军事技能报效帝国的缩影。谭纶在军事训练与制度建设上的成就，使其成为了明朝防务体系的重要奠基人，他那种不仅能上马杀敌且能下马筹划全局的干才，代表了士大夫的高能量。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0076
    name: 卢象升
    default_gender: male
    archetype: military
    flavor: （1600年—1639年）明末名将，天雄军创始人。他虽是文官出身，却勇猛过人，在战场上每每亲冒矢石，被将士誉为“卢阎王”。他在巨鹿贾庄的最后决战中，在粮草断绝、援军被杨嗣昌等权臣阻断的情况下，率领亲军与清朝主力血战到底，最终因众寡悬殊力战而亡。卢象升的牺牲标志着晚明失去了一位最具组织力和感召力的统帅。他的一生清廉刚正，以生命践行了读书人的报国理想，是晚明最具悲剧色彩的孤臣。他在面对排挤与强敌入侵时的那份从容与壮烈，成为了中国历史上忠义的典范，天雄军那种“哀兵必胜、身先士卒”的领兵风格也随之载入史册。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_mingqing_0087
    name: 宋濂
    default_gender: male
    archetype: civil
    flavor: （1310年—1381年）明朝开国文臣之首。他满腹经纶，学贯古今，协助朱元璋确立了明初的礼乐典章、科举制度与教育体系，被誉为“太史公”及“开国文臣之首”。宋濂不仅是修纂《元史》的主持者，其文学造诣亦冠绝一时，其散文风格质朴简洁，被尊为“明代文官之首”。他在晚年因受长孙受累而被流放，在途中病逝，展现了文人在皇权高度集中时代的脆弱命运。然而他的学术思想与名篇《送东阳马生序》，至今仍是激励无数寒门学子的精神力量。宋濂那种温厚平和的儒者形象，是大明初期文化复兴的中流砥柱，也是士林公认的一代宗师，其追求真理的热忱与在名利场中的淡然，使其成为了古代文人的理想楷模。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0088
    name: 方孝孺
    default_gender: male
    archetype: civil
    flavor: （1357年—1402年）字希直，别号逊志，明初著名思想家。作为建文帝最为倚重的重臣，他是传统忠臣风骨的极致象征。在“靖难之役”朱棣攻陷南京后，方孝孺因拒绝为其起草即位诏书，并掷笔痛骂“死即死耳，诏不可草”，被朱棣残暴地处以“株连十族”。他至死不屈，以生命捍卫了儒家的正统原则与政治理想。方孝孺在学术上推崇周礼改革，试图在明代恢复古代理想的仁政社会。虽然其政治理想未能实现，但他那不畏强权的铁骨与对信仰的坚守，成为了中国士大夫阶层永恒的道德标杆。他的牺牲被后世视为中国读书人灵魂的绝响，其气节跨越时代，深刻震撼了每一个追求尊严的灵魂。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0089
    name: 解缙
    default_gender: male
    archetype: civil
    flavor: （1369年—1415年）《永乐大典》的主纂者，明初第一奇才。他才华横溢、机敏过人，十八岁即登进士第，深得朱棣宠信。解缙主持编纂了中国古代最大的类书《永乐大典》，这一宏伟工程对保存华夏文明火种功在千秋。然而他性格耿直敢言，卷入皇位争夺的权力博弈，最终被锦衣卫投入狱中，并在除夕之夜被埋于雪中冻死。解缙的命运反映了天才在残酷权力场中的生存悲剧。尽管一生跌宕起伏，他留下的丰富著作与博学见识依然闪耀着智慧光芒。他那种对知识极致追求的热忱与对文化的卓越贡献，使其在中华文明史上占有显赫地位，他的一生体现了卓越才情与官场体制的剧烈摩擦。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0090
    name: 杨士奇
    default_gender: male
    archetype: civil
    flavor: （1365年—1444年）“三杨”之首，历事五朝的杰出政治家。他主持明朝内阁事务长达二十余年，辅佐仁宗、宣宗开创了辉煌的“仁宣之治”。杨士奇以稳健平衡、老成持重的行政艺术著称，在维持帝国机器高效运转、推行减负民生政策方面贡献巨大。他不仅是杰出的行政专家，更是文官政治体制的坚强守护者。虽然晚年因家庭问题遭受政敌抨击，但他对明代内阁制度的完善与政治生态的稳定，使其成为了中国古代“名相”的典范。杨士奇的一生体现了在专制皇权环境下，高级官僚如何通过专业化的行政管理来实现长久治世。他在处理繁琐政务中展现的极高智商与心理韧性，是帝国稳定的压舱石。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0091
    name: 杨荣
    default_gender: male
    archetype: civil
    flavor: （1371年—1440年）“三杨”之一，以卓越的军事眼光与战略筹划见长。他曾多次随明成祖朱棣北征，并在内阁中专门负责军事与边防咨询，是明初文官中少有的精通兵法的战略家。杨荣为人机敏果断，善于处理复杂的民族事务与边疆防御政策。他的存在确保了明初扩张型国防政策与国内政治稳定的精密平衡。他的一生是文人参政并在多领域展现干才的缩影，对维持大明早期在亚洲的霸权地位起到了关键作用。杨荣在战略大势判断上的敏锐，使其成为了历任皇帝不可或缺的顶级智囊。他那种将儒家博大胸襟与兵家诡谲技巧完美结合的能力，是盛世背后坚实的中流砥柱，确保了国家疆域的安全。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0092
    name: 杨溥
    default_gender: male
    archetype: civil
    flavor: （1372年—1446年）“三杨”之一，主要主管文教与礼制。他早年曾因受太子案牵连在狱中磨炼十年之久，形成了质朴正直、坚韧不拔的深沉性格。在进入内阁期间，他致力于人才选拔、吏治考核与教育振兴，为朝廷输送了大批德才兼备的基层官员。杨溥以其清廉作风和对儒家精神的死守，赢得了朝野上下的一致尊敬。他的一生是在逆境中不改本色、在顺境中坚持节操的典范。杨溥的存在为明初官场风气起到了重要的示范与净化作用。他那种“宁可孤独而正”的高尚品德，成为了文官集团的精神脊梁。他在晚年辅佐幼主时表现出的那份责任感，确保了政权在交替过程中的平稳过渡，功德深厚。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0093
    name: 夏元吉
    default_gender: male
    archetype: civil
    flavor: （1366年—1430年）户部尚书，被后世誉为“帝国的管家”。他在明成祖时期财政极其困难的背景下，通过精密、高效的统筹调度，不仅支持了郑和七下西洋、修纂大典等耗资巨大的工程，还确保了迁都北京与五次北征的物资供应。夏元吉为人宽厚，专业精神极强，曾因谏言皇帝节俭而下狱，出狱后依然忠心耿直。他在仁宣年间主导了经济恢复政策，使大明国库重新充盈，是古代中国最杰出的理财专家之一。夏元吉对国家财政的这种高度责任感，是大明帝国繁荣的核心保障。他那种敢于为民请命的担当，使其在行政技术专家的外壳下，拥有一种崇高的人道主义光辉，治绩彪炳史册。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
