  - key: hist_mingqing_0058
    name: 蓝玉
    avatar: monkey_wu_male7.png
    default_gender: male
    archetype: military
    flavor: （生年不详—1393年）明朝开国将领，常遇春妻弟，封凉国公。洪武二十一年，蓝玉率军在捕鱼儿海大败北元，俘获北元后妃、宗室及部众，北元汗廷遭受重创，势力一蹶不振；他晚年居功骄纵，因侵占民田、蓄养庄奴等事获罪，洪武二十六年被朱元璋处死。蓝玉案株连列侯、文武官员甚众，是明初著名大狱。
    growth_range:
