    flavor: （1337年—1377年）明朝开国将领，原名友德，字伯颜，虹县人，封卫国公。邓愈十六岁起兵抗元，后率部归附朱元璋，参加平定江西、讨伐明夏等战事；洪武十年出征吐蕃，招降诸部，回师途中病逝，追封宁河王，谥武顺。
