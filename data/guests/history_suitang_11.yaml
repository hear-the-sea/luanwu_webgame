heroes:
  purple:
  - key: hist_suitang_0601
    name: 程知节
    avatar: monkey/隋唐与五代/程知节.png
    default_gender: male
    archetype: military
    flavor: （589年—665年）唐初开国名将，原名咬金，后更名知节，字义贞，济州东阿人。隋末聚众保乡里，先后归附瓦岗李密与王世充，后携秦琼率众投唐，隶属秦王李世民帐下。他善使马槊，作战勇猛无匹，参与破宋金刚、窦建德、王世充诸役及玄武门之变，位列凌烟阁二十四功臣，封卢国公，历仕高祖、太宗、高宗三朝。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 46
      intellect: 14
      defense: 24
      agility: 16
  blue:
  - key: hist_suitang_0605
    name: 娄师德
    avatar: pig/文043.png
    default_gender: male
    archetype: civil
    flavor: （630年—699年）唐代及武周时期名相、将领，字宗仁，郑州原武人。进士出身，出任河源军大使兼营田使期间，督军屯田积谷数百万石，大破吐蕃。他宽厚隐忍，曾以“唾面自干”诫弟，暗中举荐狄仁杰入相却终生不言，狄仁杰知情后叹服“娄公盛德，我为其所包容久矣”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 22
      intellect: 46
      defense: 22
      agility: 10
  - key: hist_suitang_0606
    name: 苏颋
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （670年—727年）唐代开元名相、文学家，字廷硕，京兆武功人，宰相苏瓌之子，袭封许国公。少有才名，草拟诏书敏捷典雅、辞气宏富，与燕国公张说并称“燕许大手笔”。开元初年与宋璟同相，一守法度、一润文辞，相得益彰，助唐玄宗共创开元盛世。
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 12
      intellect: 56
      defense: 18
      agility: 14
  - key: hist_suitang_0607
    name: 陆象先
    avatar: pig/文045.png
    default_gender: male
    archetype: civil
    flavor: （665年—736年）唐代名相，苏州吴县人，陆元方之子。清静寡欲，不徇私党，先天政变时太平公主失势，他不避嫌疑力谏唐玄宗宽宥胁从，保全甚众。出任地方官坚持宽简休养，常言“天下本无事，庸人扰之而烦耳”，执政清平，为开元初年贤相典范。
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 10
      intellect: 54
      defense: 24
      agility: 12
  - key: hist_suitang_0608
    name: 契苾何力
    avatar: pig/武048.png
    default_gender: male
    archetype: military
    flavor: （611年—677年）唐初铁勒族名将，贞观六年率部归唐，深得太宗信任。他先后随军破吐谷浑、灭高昌、平龟兹、征高句丽，每战冲锋陷阵，骁勇绝伦。曾遭部众劫持献与薛延陀，他拔刀割左耳以明忠唐之志，宁死不屈，终获太宗遣使赎归，封凉国公，陪葬昭陵。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 48
      intellect: 16
      defense: 20
      agility: 16
  - key: hist_suitang_0609
    name: 阿史那社尔
    avatar: monkey_wu_male5.png
    default_gender: male
    archetype: military
    flavor: （604年—655年）唐初东突厥族名将，处罗可汗次子。归唐后获授左骁卫大将军，尚衡阳长公主。他治军严明，清廉不受私贿，先后参与平定高昌、亲征高句丽，并以昆丘道行军大总管率军西征，一举平定龟兹、于阗诸国，威震西域，唐太宗崩时甚至愿以身殉葬。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 20
      defense: 18
      agility: 16
  - key: hist_suitang_0610
    name: 颜杲卿
    avatar: pig/文037.png
    default_gender: male
    archetype: civil
    flavor: （692年—756年）唐代忠烈名臣，字昕，琅琊临沂人，颜真卿从兄。安史之乱爆发时任常山太守，他先假意归顺安禄山，旋即起兵斩杀叛将、打开土门，克复河北十七郡，断贼归路。后因孤城无援陷落，被押至洛阳，面对安禄山怒骂不绝，惨遭割舌凌迟而气节不屈，谥号忠节。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 26
      intellect: 42
      defense: 22
      agility: 10
  - key: hist_suitang_0611
    name: 南霁云
    avatar: pig_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （？—757年）唐代名将，魏州顿丘人。少时家贫操舟，后投张巡麾下守卫睢阳，善骑射，每战摧锋陷阵，令叛军胆寒。睢阳粮尽之际，他率三十骑突围往临淮向贺兰进明乞师，见其拥兵不救，拔刀断指、射矢留塔以明誓，复单骑冲阵回城共赴国难，城破慷慨就义。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 50
      intellect: 14
      defense: 20
      agility: 16
  - key: hist_suitang_0612
    name: 吴兢
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: （670年—749年）唐代史学家，汴州浚仪人。历仕武周、中宗、睿宗、玄宗四朝，久任史馆修撰，以秉笔直书不畏权贵著称，张说屡欲其曲笔改史而终不可得。他系统辑录唐太宗与群臣论政纳谏之嘉言善行，撰成《贞观政要》十卷，成为后世历代帝王治国理政之经典镜鉴。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 22
      agility: 12
  - key: hist_suitang_0613
    name: 高崇文
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （746年—809年）中唐名将，幽州人。以神策军将领起家，唐宪宗元和元年西川节度使刘辟叛乱，他奉命率军急袭入蜀，八战皆捷、迅速平定成都，入城后秋毫无犯，因功封南平郡王，开启元和中兴削藩之先声。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_suitang_0614
    name: 展子虔
    avatar: monkey/其他随机角色/文061_男.png
    default_gender: male
    archetype: civil
    flavor: （约545年—618年）隋代大画家，渤海人，历仕北齐、北周入隋，官至朝散大夫。善画山水、人物、车马、佛道，笔法细密生动，打破魏晋以来“人大干山、水不容泛”之旧局。其传世《游春图》以青绿勾填描绘春日江山胜景，为中国现存最早卷轴山水画，被誉为“唐画之祖”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 54
      defense: 18
      agility: 18
  - key: hist_suitang_0615
    name: 孙过庭
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: （646年—691年）唐代书法家、书法理论家，字虔礼，陈留人。工楷、行、草书，尤精草法，上承王羲之血脉而俊拔刚断。他撰并亲书《书谱》三千七百余言，精辟论述书法执笔、用墨、章法及书艺境界，兼具极高艺术价值与理论深度，被历代书家奉为圭臬。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 16
      agility: 18
  - key: hist_suitang_0616
    name: 荆浩
    avatar: duck_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: （约855年—915年）五代后梁大画家、画论家，字浩然，沁水人。避唐末战乱隐居太行山洪谷，自号洪谷子，躬耕自给而朝夕体察山川云岚。他融汇水墨渲染与勾勒皴擦，创北方全景大山大水之雄浑画风，代表作《匡庐图》气势磅礴，并著《笔法记》提出绘画“六要”，开五代北宋山水画先河。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  - key: hist_suitang_0617
    name: 顾闳中
    avatar: pig/文046.png
    default_gender: male
    archetype: civil
    flavor: （约910年—约980年）五代南唐宫廷画家，江南人，南唐后主李煜时期任画院待诏。工人物画，观察入微、刻画传神。奉李煜之命夜窥大臣韩熙载府邸宴饮，凭记忆默画成《韩熙载夜宴图》长卷，分五段细腻描绘听乐、观舞、暂歇、清吹、散宴诸景，人物神情毕现，为古代人物画巅峰之作。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 54
      defense: 18
      agility: 18
  - key: hist_suitang_0618
    name: 智顗
    avatar: pig/文044.png
    default_gender: male
    archetype: civil
    flavor: （538年—597年）隋代高僧，俗姓陈，字德安，荆州华容人，佛教天台宗实际创始人。早年师从慧思禅师，后居浙江天台山讲经说法，深得陈宣帝与隋晋王杨广尊崇，获赐号“智者大师”。他融通南北佛学，创立五时八教判教体系，口述《法华玄义》《法华文句》《摩诃止观》三大部，泽被东亚佛门。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 10
      intellect: 58
      defense: 22
      agility: 10
  - key: hist_suitang_0619
    name: 敬翔
    avatar: monkey/其他随机角色/文男213.png
    default_gender: male
    archetype: civil
    flavor: （？—923年）五代后梁名相，字子振，同州冯翊人。博通经史，善为文章，唐末投效朱温幕府三十余年，军政机务、战略筹划多出其手，朱温视如左右手。后梁建立后官至崇政院使、宰相，竭力辅政。末帝朱友贞时期屡谏不听，及后唐军破汴京，他自缢殉国，终始一节。
    growth_range:
    - 5
    - 8
    attribute_weights:
      force: 12
      intellect: 56
      defense: 20
      agility: 12
  - key: hist_suitang_0620
    name: 张承业
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （846年—922年）晚唐及五代晋国忠臣，字继元，同州人，唐末任河东监军。唐亡后拒不臣梁，留辅李克用与李存勖，主掌晋国后方财政、劝农积谷、严守法度，使前线征战粮饷不绝。李存勖欲称帝时，他泣血力谏以恢复唐室为念，终因劝阻无果绝食忧愤而死，欧阳修赞其“贤哉”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 52
      defense: 22
      agility: 12
  - key: hist_suitang_0602
    name: 权德舆
    avatar: monkey/其他随机角色/文061_男.png
    default_gender: male
    archetype: civil
    flavor: （759年—818年）中唐名相、文学家，字载之，天水略阳人。历任中书舍人、礼部侍郎、同平章事，多次主持科举，选拔寒门俊才；其诗文雅正清丽，贞元、元和年间朝廷重要诏诰与碑志多出其手，时称一代文宗。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 52
      defense: 20
      agility: 16
  - key: hist_suitang_0603
    name: 长孙晟
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （552年—609年）隋代杰出军事家、外交家，字季晟，河南洛阳人，长孙无忌之父。善骑射，出使突厥时以一箭双雕震慑塞北，尽悉突厥山川虚实与诸部矛盾。归朝后献“远交近攻、离强合弱”之策，成功分化东西突厥，不战而解北方大患，大破达头可汗，官至右骁卫将军，功烈显赫。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 38
      intellect: 34
      defense: 14
      agility: 14
  - key: hist_suitang_0604
    name: 董源
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （约934年—约962年）五代南唐大画家，字叔达，钟陵人，曾任南唐北苑副使，世称董北苑。他专写江南平淡天真之烟岚丘壑，独创披麻皴与点子皴技法，墨色苍润浑厚，一变唐代青绿山水之格局。其代表作《潇湘图》《夏景山口待渡图》影响深远，与荆浩、关仝、巨然并称“荆关董巨”，被尊为南宗山水画祖师。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 18
      agility: 16
  - key: hist_suitang_0643
    name: 窥基
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: （632年—682年）唐代高僧，俗姓尉迟，字洪道，京兆长安人，名将尉迟恭之侄。年十七奉诏出家，拜玄奘为师，成为玄奘首席大弟子。他协助玄奘翻译《成唯识论》等大批瑜伽行派典籍，著述宏富，号称“百部疏主”，系统确立中国佛教法相唯识宗，世称慈恩大师。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 56
      defense: 18
      agility: 12
  - key: hist_suitang_0644
    name: 怀海
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: （749年—814年）中唐禅宗大师，俗姓王，福州长乐人，师承马祖道一，因住持洪州百丈山世称百丈怀海。他改革丛林制度，别立禅院，制定《百丈清规》，倡导农禅并重、“一日不作，一日不食”，奠定此后千余年中国汉传佛教禅宗寺院生活与管理之根本仪轨。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 22
      agility: 12
  - key: hist_suitang_0645
    name: 义玄
    avatar: monkey/其他随机角色/文男.png
    default_gender: male
    archetype: civil
    flavor: （？—867年）晚唐禅宗大师，俗姓邢，曹州南华人，嗣法黄檗希运，住持镇州临济院，创立禅宗临济宗。他机锋峻烈，善以“棒喝”截断学人妄念，直指自性本心，语录编为《临济录》。其法脉门庭鼎盛，后世“临济天下”影响遍及中日韩佛教界。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 54
      defense: 16
      agility: 14
  - key: hist_suitang_0646
    name: 关仝
    avatar: pig/文010.png
    default_gender: male
    archetype: civil
    flavor: （约907年—960年）五代后梁山水画大家，长安人，师承荆浩而青出于蓝。专写关陕一带石质坚凝、秋山萧疏之景，笔法简练劲健，气息雄浑苍莽，画史称“笔愈简而气愈壮，景愈少而意愈长”，独创“关家山水”，代表作《关山行旅图》，名列“荆关董巨”。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 54
      defense: 20
      agility: 14
  green:
  - key: hist_suitang_0621
    name: 麦铁杖
    avatar: monkey_wu_male4.png
    default_gender: male
    archetype: military
    flavor: （？—612年）隋代猛将，始兴人。出身寒微，骁勇多力，日行五百里，走及奔马。早年落草为盗，后归南陈，隋灭陈后仕隋，以功拜仪同三司。大业八年随隋炀帝东征高句丽，他主动请为前锋，冒箭雨架浮桥抢渡辽水，桥未及岸即跃入敌阵血战，终因寡不敌众力战殉国，赠光禄大夫。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 48
      intellect: 10
      defense: 18
      agility: 24
  - key: hist_suitang_0622
    name: 鱼俱罗
    avatar: pig/武057.png
    default_gender: male
    archetype: military
    flavor: （？—613年）隋代名将，冯翊下邽人。身长八尺，膂力绝伦，目生重瞳，声闻数百步。随杨素大破突厥，又镇守丰州威慑塞外，大业年间随征高句丽、讨平东海盗贼，屡立战功。然隋炀帝忌其重瞳之相与军中威望，终借口其在东都贱卖粮食，将其构陷斩杀。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 50
      intellect: 14
      defense: 22
      agility: 14
  - key: hist_suitang_0623
    name: 杨义臣
    avatar: monkey/其他随机角色/武052_男.png
    default_gender: male
    archetype: military
    flavor: （？—617年）隋代名将，本姓尉迟，代人，因父尉迟崇战死赐姓杨氏。性情沉厚，颇具韬略，曾任朔州总管大破突厥。大业末年天下大乱，他奉命镇压河北，连破张金称、高士达等起义军，收降十余万人，威望骤增。隋炀帝与虞世基忌其兵权，召还夺职，不久郁郁而终。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 44
      intellect: 22
      defense: 20
      agility: 14
  - key: hist_suitang_0624
    name: 丘行恭
    avatar: pig_wu_male7.png
