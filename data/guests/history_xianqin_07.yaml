heroes:
  blue:
  - key: hist_xianqin_0300
    name: 姬诡诸
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
    flavor: （？—前651年）春秋晋献公，名诡诸。他在位时任用士蒍等人整顿内政，又先后灭掉虢国、虞国，使晋国势力向中原扩展。晚年宠爱骊姬，废黜太子申生，迫使公子重耳、夷吾出奔，酿成“骊姬之乱”。他去世后，晋国陷入长期的继位争斗。晋献公的扩张为晋国后来的强盛打下基础，但继承问题上的失当也给国家带来动荡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 20
      defense: 24
      agility: 18
  - key: hist_xianqin_0308
    name: 崔杼
    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: （？—前546年）春秋齐国大夫。齐庄公与崔杼之妻棠姜私通，并多次到崔家，崔杼因此设伏杀死庄公，改立齐景公，自任右相。齐国太史直书“崔杼弑其君”，相传太史兄弟相继坚持记载，成为史官秉笔的著名事例。后来崔氏与庆封争权，家族内乱，崔杼自杀。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 18
      defense: 24
      agility: 18
  - key: hist_xianqin_0310
    name: 田乞
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （？—前485年）春秋齐国大夫，田氏宗主。齐景公死后，他联合鲍牧等人废掉景公所立幼子，改拥公子阳生为齐悼公，由此掌握国政。他借粮时用大斗付出、收粮时用小斗收回，使齐国民众归心田氏；同时排挤国氏、高氏等旧卿族。田乞去世后，其子田常继承势力，田氏代齐的基础由此逐步奠定。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0311
    name: 田常
    avatar: monkey_wu_male16.png
    default_gender: male
    archetype: military
    flavor: （？—前405年）春秋齐国大夫，名常，又称田成子。他继承父亲田乞的势力，在齐简公时发动政变，杀死简公，改立齐平公，从此由田氏执掌齐国大权。他继续以大斗借出、小斗收回的方式笼络民众，并让田氏子弟出任要职，逐步架空公室。田常死后，田氏代齐的趋势已不可逆转，其经营为战国田齐的建立铺平了道路。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 20
      defense: 24
      agility: 18
  - key: hist_xianqin_0317
    name: 士会
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （约前660年—前583年）春秋晋国大夫，字季，谥武，范氏始祖。他因卷入政争出奔秦国，秦穆公一度用其谋划对付晋国；晋国后来设计将他迎回，任以要职。士会历任中军将、执政，主持晋国军政，在晋楚争霸与诸侯会盟中多有建树，晚年退居封地随。他历仕多国而终归晋用，被视为春秋士人周游列国、以才见用的代表人物。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 52
      defense: 20
      agility: 14
  - key: hist_xianqin_0325
    name: 韩虎
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）春秋末韩氏宗主，名虎，又称韩康子。智瑶向韩、魏索地，他一度忍让，随后与魏驹一同出兵，随智瑶围攻赵氏晋阳。城破在即之际，赵襄子派张孟谈夜入韩、魏军营，以唇亡齿寒之理相劝。韩虎与魏驹转而与赵氏结盟，掘堤反灌智伯军，合力除掉智瑶。韩氏由此保住封地，并为后来三家分晋积蓄了实力。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 20
      defense: 24
      agility: 18
  - key: hist_xianqin_0326
    name: 魏驹
    avatar: monkey/其他随机角色/武047_男.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）春秋末魏氏宗主，名驹，又称魏桓子。智瑶恃强向韩、魏索取土地，他表面顺从，随后随智瑶联军围攻赵氏晋阳。晋阳城危之际，赵襄子遣张孟谈游说，魏驹与韩虎权衡利害，决定倒戈。三家掘开堤坝，引水反灌智伯军营，智瑶兵败被杀。魏氏因此摆脱智氏压迫，保住了封地，也为日后魏国跻身战国七雄奠定基础。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 20
      defense: 24
      agility: 18
  - key: hist_xianqin_0330
    name: 熊弃疾
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （？—前516年）春秋楚平王，名弃疾，楚共王之子。他通过宫廷政变夺得王位，后为太子建迎娶秦国女子，听信费无极之言将其据为己有，又因谗言加害太子建的师傅伍奢及其子伍尚，迫使太子建出逃。伍子胥辗转投奔吴国，后来率吴军攻入楚都郢。楚平王在位时楚国尚称平稳，但其夺婚与猜忌动摇了储位，也给楚国招来多年边患。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 34
      intellect: 18
      defense: 26
      agility: 22
  - key: hist_xianqin_0336
    name: 沈诸梁
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: （约前550年—约前470年）春秋楚国大夫，名诸梁，封于叶，人称叶公。白公胜在郢都发动政变，杀死令尹子西、司马子期并劫持楚惠王时，沈诸梁率叶地军队入都平乱，击败白公胜，迎惠王复位。此后他兼任令尹、司马，整顿楚国政务，晚年退居叶地。后世“叶公好龙”的寓言借其名流传，与这位平乱重臣的真实事迹并不相同。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 52
      defense: 20
      agility: 14
  - key: hist_xianqin_0344
    name: 费无极
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （？—前515年）春秋楚平王宠臣。他迎合平王，劝其将原本为太子建迎娶的秦国女子纳入后宫，又进谗言诬陷太子建的师傅伍奢谋反，致使伍奢、伍尚父子遇害，伍子胥出奔吴国。后来他在楚国卿族争斗中构陷大夫郤宛，引发朝野不满，最终被令尹子常处死。费无极以谗言乱政著称，其所作所为加剧了楚平王晚年的政治危机。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 54
      defense: 20
      agility: 18
  green:
  - key: hist_xianqin_0301
    name: 姬圉
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （？—前636年）姬圉，晋惠公之子，春秋时期晋怀公。他曾被派往秦国为质，秦穆公以宗女怀嬴嫁之。晋惠公病重时，圉不告而别，逃回晋国即位。秦穆公因此改迎公子重耳入秦，并于前636年送重耳返晋，是为晋文公。怀公出奔高梁，不久被杀，晋国政局由此转向文公时代。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 16
      defense: 26
      agility: 22
  - key: hist_xianqin_0302
    name: 吕甥
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: （？—前636年）吕甥，春秋时期晋国大夫，又称阴饴甥、瑕吕饴甥。前645年韩原之战晋惠公被秦军俘获，他奉命赴秦交涉，与秦穆公相会于王城，以辞令周旋，促成秦晋议和，使惠公得以归国。晋文公即位后，吕甥与郤芮密谋焚宫弑君，事败出逃秦国，被秦穆公诱杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0303
    name: 郤芮
    avatar: monkey_wu_male7.png
    default_gender: male
    archetype: military
    flavor: （？—前636年）郤芮，春秋时期晋国大夫，食邑于冀，又称冀芮，为晋惠公旧臣。晋惠公死后，公子重耳在秦穆公支持下返晋即位，是为晋文公。郤芮与吕甥自危，密谋焚烧公宫弑杀文公；寺人披向文公告发，二人事败出逃秦国，被秦穆公诱杀，晋国政局由此稳定。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 14
      defense: 26
      agility: 20
  - key: hist_xianqin_0304
    name: 勃鞮
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: （即寺人披，生卒年不详）勃鞮，春秋时期晋国宦官，亦称寺人披。晋献公曾派他率兵攻打蒲地的公子重耳，斩断重耳衣袖；后又奉命赴狄行刺，重耳越墙而逃。晋文公即位后，勃鞮求见，告发吕甥、郤芮焚宫弑君之谋，使文公得以防备，他本人也因此获赦。事见《左传·僖公》二十四年。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 38
      intellect: 14
      defense: 26
      agility: 22
  - key: hist_xianqin_0305
    name: 羊舌赤
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生卒年及事迹多不详）羊舌赤，字伯华，春秋时期晋国大夫，羊舌职之子，叔向（羊舌肸）、羊舌虎之兄。羊舌氏为晋国公族别支。晋悼公时，祁奚告老，举荐其子祁午接任中军尉，羊舌赤出任中军尉佐，辅掌军务。其个人事迹史料少于其弟叔向，传世记载多与羊舌氏家族相关。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 54
      defense: 22
      agility: 14
  - key: hist_xianqin_0306
    name: 羊舌虎
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: （？—前552年）羊舌虎，字叔虎，春秋时期晋国大夫，羊舌职之子，叔向（羊舌肸）之弟。羊舌氏为晋国公族别支。前552年晋国卿族争斗，羊舌虎因与栾盈关系密切，被视为栾氏之党而遭杀害；其兄叔向也受牵连被囚，后经祁奚等人营救获释。其事见于《左传·襄公二十一年》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 38
      intellect: 14
      defense: 26
      agility: 22
  - key: hist_xianqin_0307
    name: 州绰
    avatar: pig_wu_male9.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）州绰，春秋时期齐国勇士，原为晋国大夫，为栾盈之党。栾盈在晋国失势后，州绰与邢蒯等人出奔齐国，受到齐庄公任用，以勇力侍奉左右。前548年崔杼弑杀齐庄公，州绰与贾举、邴师等庄公近臣一同遇害。其事迹见于《左传·襄公》二十一年、二十五年，具体细节记载有限。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 10
      defense: 26
      agility: 20
  - key: hist_xianqin_0309
    name: 庆封
    avatar: pig/武051.png
    default_gender: male
    archetype: military
    flavor: （？—前538年）庆封，字子家，春秋时期齐国大夫，庆氏宗主。崔杼弑杀齐庄公后，庆封与崔杼共同执掌齐政；后借崔氏内乱攻灭崔氏，逼崔杼自杀，独揽大权。前545年田、鲍、栾、高四族联合攻庆氏，庆封出奔鲁国，再逃吴国，受封于朱方。前538年楚灵王伐吴，攻破朱方，庆封被楚军所杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 16
      defense: 24
      agility: 20
  - key: hist_xianqin_0312
    name: 鲍牧
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: （？—前487年）鲍牧，春秋末齐国大夫，鲍氏族人，相传为鲍叔牙之后。齐景公死后，国氏、高氏立幼子晏孺子，鲍牧与田乞联合发动政变，逐国夏、高张，改立公子阳生为齐悼公。此后鲍牧与悼公关系恶化，前487年因言语触怒悼公被杀。其活动见于《左传·哀公》诸年，反映了姜齐末年卿族争斗的激烈。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 52
      defense: 22
      agility: 16
  - key: hist_xianqin_0313
    name: 国夏
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）国夏，春秋末齐国大夫，国氏卿族成员，史称国惠子。齐景公时，国氏与高氏同掌国政，国夏曾率军伐鲁，与鲁国在边境多次交锋。景公临终托孤，命国夏、高张辅佐幼子晏孺子。前489年田乞联合鲍牧发动政变，国、高氏被逐，国夏出奔莒国，姜齐旧贵族势力从此一蹶不振。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 52
      defense: 22
      agility: 16
  - key: hist_xianqin_0314
    name: 高张
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）高张，春秋末齐国大夫，高氏卿族成员，史称高昭子。齐景公晚年，他与国夏同受遗命辅佐幼子晏孺子。前489年田乞联合鲍牧发动政变，国、高两族被逐，国夏奔莒，高张出奔鲁国。高氏与国氏同为姜齐旧贵族，其衰落标志着田氏专权的开始；高张个人事迹传世不多。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 52
      defense: 22
      agility: 16
  - key: hist_xianqin_0315
    name: 灵辄
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）灵辄，春秋时期晋国甲士。赵盾在首山打猎时遇见饥饿的灵辄，赠以食物；灵辄将食物留下一半，说要带给母亲，赵盾便另备饭食与肉让他带回。后来灵辄做了晋灵公的甲士，前607年灵公设伏杀赵盾时，他倒戈掩护赵盾脱险，事后不告姓名而去。事见《左传·宣公二年》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 14
      defense: 26
      agility: 20
  - key: hist_xianqin_0316
    name: 提弥明
    avatar: monkey/其他随机角色/武044_男_.png
    default_gender: male
    archetype: military
    flavor: （？—前607年）提弥明，春秋时期晋国大夫赵盾的车右。前607年晋灵公设宴伏甲，欲杀赵盾；提弥明察觉危机，以“侍君宴不过三爵”为由扶赵盾下堂，又徒手搏杀灵公所嗾的猛犬，掩护赵盾突围。他在与甲士的搏斗中战死，赵盾得以脱身，事见《左传·宣公二年》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 10
      defense: 28
      agility: 18
  - key: hist_xianqin_0318
    name: 士燮
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （？—前574年）士燮，春秋时期晋国卿大夫，士会之子，史称范文子，曾任中军佐。前575年晋楚鄢陵之战前，他判断晋国内部卿族骄纵，主张持重不战；战后晋虽获胜，他反而忧虑君臣骄奢将生内乱。晋厉公诛杀三郤后，士燮忧惧国事，于同年去世，谥文。其言行多见于《左传·成公》诸年。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 54
      defense: 22
      agility: 14
  - key: hist_xianqin_0319
    name: 士匄
    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: （？—前548年）士匄，春秋时期晋国卿大夫，士燮之子，史称范宣子，曾任晋国执政。他辅佐晋悼公、平公，主持晋国军政与诸侯会盟，并制定刑书，后来赵鞅、荀寅铸刑鼎所颁即其刑书。范氏在他时期势力显赫，但此后在晋国卿族斗争中逐渐衰落。事见《左传·襄公》诸年。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 38
      intellect: 18
      defense: 26
      agility: 18
  - key: hist_xianqin_0320
    name: 荀吴
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）荀吴，春秋时期晋国卿大夫，中行氏宗主，史称中行穆子，荀偃之子。晋平公、昭公时，他多次率军经营北方，前541年在大原击败无终及群狄；后又围鼓，鼓人请求投降，他允许对方修城备守、待粮尽再降，城破后不戮一人，以信义著称。其子荀寅后与范氏联合攻赵鞅，兵败出奔，中行氏由此退出晋国政坛。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 38
      intellect: 16
      defense: 26
      agility: 20
  - key: hist_xianqin_0321
    name: 士吉射
    avatar: pig/武046.png
