heroes:
  blue:
  - key: hist_xianqin_0300
    name: 姬诡诸
    default_gender: male
    archetype: military
    flavor: （?—前651年）晋国雄主，奠定晋国霸业根基。他在位期间大刀阔斧改革：消灭晋国旧公族，打破世卿世禄，大胆任用外姓人才。他灭虞灭虢，"假途灭虢""唇亡齿寒"的典故皆由此而来。他使晋国从一个内乱不断的诸侯国，一跃成为强国。然而晚年他宠幸骊姬，酿成骊姬之乱：太子申生自杀，公子重耳、夷吾流亡，晋国陷入多年动荡。他是功过参半的君主：有开疆拓土之功，也有废嫡立庶之过。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 20
      defense: 24
      agility: 18
  - key: hist_xianqin_0308
    name: 崔杼
    default_gender: male
    archetype: military
    flavor: （?—前546年）齐国权臣，弑君夺权。他是齐国大族崔氏的当家人，权倾朝野。他娶了美妇棠姜，不料齐庄公贪恋其美色，多次与棠姜私通。崔杼忍无可忍，趁庄公入其家私会时设伏弑杀。他立齐景公为君，自任右相，控制齐国政权。太史记"崔杼弑其君"，他连杀三位太史，第四位仍直书不改——"崔杼弑其君"遂成千古定论。然而他晚年家族内讧，被庆封所迫，全家自杀。弑君者不得善终，天道循环，报应不爽。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 18
      defense: 24
      agility: 18
  - key: hist_xianqin_0310
    name: 田乞
    default_gender: male
    archetype: civil
    flavor: （?—前485年）齐国大夫，田氏代齐的奠基者。他是田氏家族的关键人物，创造了"大斗出贷、小斗收租"的笼络民心之术：借粮给百姓时用大斗，收回时用小斗，差额由田氏补贴。百姓感恩戴德，纷纷归附田氏。与此同时，姜氏公室日益衰落，民心尽失。他还在政治上排挤打压姜氏公室支持者，扶植亲田势力。他奠定的基础，使田氏在齐国的势力日益膨胀，最终由子孙完成代齐大业。他是"买人心"策略的祖师爷。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0311
    name: 田常
    default_gender: male
    archetype: military
    flavor: （?—前405年）齐国权臣，田氏代齐的推进者。他又名田成子，继承父亲田乞的事业，将田氏势力推向新高峰。他弑杀齐简公，拥立齐平公，自此田氏完全把持齐国政权。他继续施行"大斗出小斗入"的笼络之术，民心尽归田氏。他还大开美女之门，广纳姬妾，据说生有七十余子，将田氏血脉遍布齐国朝野。他的弑君之举虽遭诸侯谴责，却无人敢干涉。田氏代齐已是大势所趋，姜氏齐国名存实亡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 20
      defense: 24
      agility: 18
  - key: hist_xianqin_0317
    name: 士会
    default_gender: male
    archetype: civil
    flavor: （约前620年—约前556年）晋国名臣，范氏家族的奠基者。他字季，又称范武子，是春秋时期最杰出的政治家、军事家之一。他的人生跌宕起伏：曾因政争流亡秦国，为秦穆公效力，展现出卓越才能；后被晋国召回，官至执政大夫。他文武兼备，既能运筹帷幄决胜千里，又能治国理政安民抚众。他开创的范氏家族，后来成为晋国六卿之一，延续数百年。他的处世智慧、政治手腕、军事才能，使他成为春秋时期士大夫的典范。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 52
      defense: 20
      agility: 14
  - key: hist_xianqin_0325
    name: 韩虎
    default_gender: male
    archetype: military
    flavor: （生卒年不详）韩氏宗主，三家分晋的参与者。他又名韩康子，是韩氏家族在三家分晋前夕的掌门人。晋阳之战时，智瑶联合他与魏驹围攻赵氏，水灌晋阳。就在城破在即之时，赵襄子派人策反韩、魏。他与魏驹审时度势，在最后关头反戈一击，与赵氏联手消灭了智氏。三家分晋由此奠定格局。他的抉择改变了历史走向：若继续追随智瑶，韩氏可能会被智氏吞并；反戈成功，韩氏得以建国立邦。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 20
      defense: 24
      agility: 18
  - key: hist_xianqin_0326
    name: 魏驹
    default_gender: male
    archetype: military
    flavor: （生卒年不详）魏氏宗主，三家分晋的参与者。他又名魏桓子，是魏氏家族在三家分晋前夕的掌门人。他与韩虎一起，在晋阳之战的关键时刻做出了改变历史的抉择。当智瑶骄傲地预言将在灭赵之后吞并韩、魏时，他意识到唇亡齿寒的道理。在赵襄子使者的策反下，他与韩虎联合，在决战之夜反戈杀死智瑶，消灭智氏全族。这一决定使魏氏得以在三家分晋后建立魏国，成为战国七雄之一。历史的转折，往往就在一念之间。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 38
      intellect: 20
      defense: 24
      agility: 18
  - key: hist_xianqin_0330
    name: 熊弃疾
    default_gender: male
    archetype: military
    flavor: （?—前516年）楚国昏君，伍子胥一生的仇敌。他本是楚共王之子，靠政变夺取王位。他在位期间做了一件为人所不齿的事：太子建聘娶秦女，他见秦女美貌，竟夺儿媳为妻，将太子废黜。奸臣费无极趁机诬陷太子太傅伍奢谋反，他听信谗言，杀害伍奢及其长子伍尚。伍子胥逃亡吴国，发誓复仇。十六年后，伍子胥引吴兵攻破楚都郢城，掘墓鞭尸，终于报了杀父杀兄之仇。他的昏聩与残暴，最终招致楚国险些亡国的大祸。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 34
      intellect: 18
      defense: 26
      agility: 22
  - key: hist_xianqin_0336
    name: 沈诸梁
    default_gender: male
    archetype: civil
    flavor: （约前550年—约前470年）平定白公胜之乱的功臣。他姓沈名诸梁，封于叶地，故称叶公。他以"叶公好龙"的典故闻名于世——据说他酷爱画龙，满屋皆是龙的图画；真龙听说后来见他，他却吓得魂飞魄散。这个故事讽刺那些叶公式的人物：口头喜欢，真正面对却退缩。但历史上的叶公其实是楚国功臣：白公胜作乱时，他率领叶地兵马入都平叛，诛杀白公胜，恢复楚惠王的王位，稳定了楚国局势。他是楚国的救时宰相。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 52
      defense: 20
      agility: 14
  - key: hist_xianqin_0344
    name: 费无极
    default_gender: male
    archetype: civil
    flavor: （?—前519年）楚国佞臣，伍氏灭门的元凶。他是春秋时期最著名的奸臣之一。他本是楚平王的宠臣，心术不正，以谗言害人为能事。太子建聘娶秦女，他献计让平王夺儿媳为妻，由此废黜太子。他又诬陷太子太傅伍奢谋反，使伍氏满门被害。他的所作所为导致伍子胥逃亡吴国，十六年后引兵攻破楚都。楚国几近亡国，费无极是罪魁祸首。楚昭王复国后，终于将他处死以谢国人。奸臣误国，报应终会来到。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 54
      defense: 20
      agility: 18
  green:
  - key: hist_xianqin_0301
    name: 姬圉
    default_gender: male
    archetype: military
    flavor: （?—前636年）晋怀公，晋惠公之子。少年时曾被送往秦国为质，父死后回国即位，却没有等来安稳的王座：重耳在秦穆公支持下返晋，他只得出逃，最终在高梁被杀。怀公并非晋国动荡的始作俑者，却成了父辈失政与公族争位的牺牲品。短短一段君期，恰好照见春秋王室的刀锋并不只在战场上。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 16
      defense: 26
      agility: 22
  - key: hist_xianqin_0302
    name: 吕甥
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）晋国大夫，史称阴饴甥。韩原之战后，晋惠公被秦军所俘，晋国朝野惶惶，吕甥奉命入秦交涉。他没有替君主粉饰过失，而是以国势、民心与诸侯观望之势陈说利害，促成秦晋议和，使惠公得以归国。史书留下的辞令或有修饰，临危受命、以言辞争得转圜，却是这位使臣最清晰的身影。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0303
    name: 郤芮
    default_gender: male
    archetype: military
    flavor: （?—前636年）晋惠公旧臣，重耳返国后的反对者。惠公、怀公相继失势后，郤芮仍想以旧党翻盘，便与吕甥谋划焚宫弑君，事情败露，只得逃往秦国。秦穆公以计诱杀二人，晋文公由此清除了最后的政变威胁。郤芮不是战场上的败将，而是输在看不清晋国已换了棋局；旧主的恩信，终究抵不过新君的兵锋与名分。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 14
      defense: 26
      agility: 20
  - key: hist_xianqin_0304
    name: 勃鞮
    default_gender: male
    archetype: military
    flavor: （即寺人披，生卒年不详）晋国宦官，曾奉命追杀流亡的重耳，在蒲地一战砍断了公子的衣袖。重耳即位后，他没有躲在旧事背后，而是亲自求见，说明当年受命的缘由，并告发郤芮、吕甥的谋反。晋文公赦其旧过，寺人披也以情报报知遇之恩。前半生是追兵，后半生成了耳目，这种转身，比一句“忠臣”更有分量。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 38
      intellect: 14
      defense: 26
      agility: 22
  - key: hist_xianqin_0305
    name: 羊舌赤
    default_gender: male
    archetype: civil
    flavor: （生卒年及事迹多不详）羊舌氏成员，叔向与叔虎的兄长，字伯华。羊舌家族世代在晋国任卿，声望虽高，却身处公室衰微、强卿相攻的险局。关于羊舌赤个人的记载远少于叔向，后世常把羊舌氏的覆亡一并写在他身上；较稳妥的说法，是他代表了一个被卿族兼并吞没的旧贵族家门。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 54
      defense: 22
      agility: 14
  - key: hist_xianqin_0306
    name: 羊舌虎
    default_gender: male
    archetype: military
    flavor: （?—前552年）晋国大夫，叔向之弟。栾盈之乱牵动晋国诸卿，羊舌虎因与栾氏有牵连而被杀，羊舌一门也从此卷入更深的政治风暴。传世材料对他的个人作为记载不多，却清楚留下了一个时代的冷酷：卿族之间结盟如刃，今日的姻亲与盟友，明日便可能成为问罪的凭据。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 38
      intellect: 14
      defense: 26
      agility: 22
  - key: hist_xianqin_0307
    name: 州绰
    default_gender: male
    archetype: military
    flavor: （生卒年不详）齐国勇士，崔杼的家臣。齐庄公与棠姜私通，崔杼设伏弑君时，州绰参与了这场宫门血案；关于他究竟斩杀何人，史料并不尽同，能确定的是他站在了权臣的刀口一边。崔氏败亡后，个人勇力再不能替他撑起靠山。江湖只看武艺，朝堂还要看所持之旗；州绰偏偏替别人执了最凶的一把刀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 10
      defense: 26
      agility: 20
  - key: hist_xianqin_0309
    name: 庆封
    default_gender: male
    archetype: military
    flavor: （?—前538年）齐国权臣，崔杼的盟友也是取代者。两人共同弑杀齐庄公后，庆封借崔氏内乱发兵，逼崔杼自尽，转而独掌朝政。他把国事交给儿子庆舍，自己沉溺于富贵宴饮，终于被齐国诸卿驱逐，逃往吴国，后为楚军所获而死。庆封走过的路很短：联手弑君、反手灭盟、骄奢失国，步步都像在给自己封棺。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 16
      defense: 24
      agility: 20
  - key: hist_xianqin_0312
    name: 鲍牧
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）齐国大夫，鲍氏旧族成员。鲍氏自鲍叔牙以来便是齐国卿族，然而到了田氏势力上升的年代，旧贵族的声望已难换回旧日权柄。鲍牧的具体事迹散见于春秋末年政局，个人锋芒并不突出，反倒更适合被看作姜齐旧臣的一个剪影：管鲍相知的佳话尚在，能左右国命的却已换了姓氏。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 52
      defense: 22
      agility: 16
  - key: hist_xianqin_0313
    name: 国夏
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）齐国大夫，国氏卿族的代表。国氏是姜齐旧贵族，长期依附公室，与高氏共同维系旧有秩序；可田氏以施惠聚众、以联姻结党，势力一寸寸逼近国政。国夏的个人言行留存不多，他所处的位置却很清楚：守着祖宗的门楣，却眼看齐国的钥匙落入旁姓之手。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 52
      defense: 22
      agility: 16
  - key: hist_xianqin_0314
    name: 高张
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）齐国大夫，高氏卿族成员。高氏与国氏同为姜齐旧族，曾凭世卿地位与公室相互倚重；田氏崛起后，民心、粮食与官位渐渐聚到另一边，高张只能随旧贵族一道退入暗处。关于他的独立事迹不多，正因如此，这个名字更像一枚被时代推走的棋子，见证田氏代齐如何从传闻变成定局。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 52
      defense: 22
      agility: 16
  - key: hist_xianqin_0315
    name: 灵辄
    default_gender: male
    archetype: military
    flavor: （生卒年不详）晋国甲士，因一饭之恩倒转刀锋。赵盾出游时曾救济饥饿的灵辄，后来晋灵公设伏刺杀赵盾，灵辄恰在伏兵之中。认出旧恩后，他反戈护送赵盾脱身，并以身阻挡追兵。左传只写下短短一幕，却让“受人一饭，替人挡箭”有了具体模样；他没有显赫门第，偏有不肯亏心的侠骨。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 14
      defense: 26
      agility: 20
  - key: hist_xianqin_0316
    name: 提弥明
    default_gender: male
    archetype: military
    flavor: （?—前607年）赵盾的车右与侍卫。晋灵公在宫中设伏，赵盾陷入甲士围攻，提弥明拔剑迎敌，替主人挡住追杀，终于力竭而死。与灵辄的临阵知恩相对，他没有留下转圜的余地，只把退路让给了赵盾。后世说起春秋义士常爱歌咏名将，他却用一柄短兵提醒人们：护住同伴，也是战场上最硬的一招。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 10
      defense: 28
      agility: 18
  - key: hist_xianqin_0318
    name: 士燮
    default_gender: male
    archetype: civil
    flavor: （?—前574年）晋国大夫，范氏第二代宗主，士会之子，史称范文子。士会功成名重，士燮却更懂得收束锋芒，曾劝父亲远离晋国权力的险流。身处六卿相争的年代，他少有惊天动地的战功，却以谨慎持家、审慎处政，使范氏平稳承继。春秋的刀光不只考验敢战者，也考验谁知道什么时候把剑收入鞘中。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 10
      intellect: 54
      defense: 22
      agility: 14
  - key: hist_xianqin_0319
    name: 士匄
    default_gender: male
    archetype: military
    flavor: （?—前548年）晋国执政，士燮之子，史称范宣子。范氏在他手中登上高峰，他参与弭兵会等诸侯外交，既要与楚国周旋，也要在晋国六卿之间守住家门的筹码。权势越盛，树敌也越多；范氏后来衰落并非一朝一夕，正可见卿族政治没有真正的终局，今日的执政者只是暂时站在风口。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 38
      intellect: 18
      defense: 26
      agility: 18
  - key: hist_xianqin_0320
    name: 荀吴
    default_gender: male
    archetype: military
