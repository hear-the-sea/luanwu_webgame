  - key: hist_mingqing_0342
    name: 高启
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （1336年—1374年）字季迪，号槎轩，长洲人，元末明初诗人。元末隐居青丘，明初应召入朝，参与修撰《元史》，授翰林院国史编修，后辞官归乡。洪武七年，苏州知府魏观改建府治获罪，高启因曾撰上梁文受到牵连，被押至南京处死，年仅三十九。其诗兼取汉魏唐宋，与杨基、张羽、徐贲并称“吴中四杰”。
