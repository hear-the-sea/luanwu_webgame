  - key: hist_mingqing_0319
    name: 蒋溥
    default_gender: male
    archetype: civil
    flavor: （1708年—1761年）字质甫，号恒轩，清代大臣、花鸟画家，蒋廷锡之子。蒋溥官至大学士、吏部尚书，政务上承袭的是中枢官僚的谨慎，画上则承接家学，花鸟设色清雅而有秩序。他的声名容易被父亲的光环遮住，实际却是一个独立入仕、独立作画的人。家传笔墨只是起手式，最后一笔仍得自己落下。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0320
    name: 徐枋
