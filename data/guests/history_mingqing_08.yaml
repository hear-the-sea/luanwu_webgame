  - key: hist_mingqing_0332
    name: 李梦阳
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （1473年—1530年）字献吉，号空同子，庆阳人，后徙开封，明代文学家。弘治六年进士，官户部郎中，曾因弹劾外戚张鹤龄下狱；正德初年反对宦官刘瑾，被罢官，刘瑾败后复起，官至江西提学副使。他与何景明等倡导“文必秦汉、诗必盛唐”，为“前七子”领袖，著有《空同集》。
