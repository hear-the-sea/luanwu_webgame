    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （1570年—约1626年）字小修，湖广公安人，袁宗道、袁宏道之弟，明代文学家。万历四十四年进士，官至南京吏部郎中。与两兄并称“公安三袁”，主张独抒性灵、不拘格套。工诗文，亦长游记日记，著有《珂雪斋集》。
