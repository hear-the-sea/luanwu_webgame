    default_gender: male
    archetype: civil
    flavor: （1574年—1624年）字伯敬，号退谷，湖广竟陵人，明代文学家、官员。万历三十八年进士，官至福建提学佥事。与谭元春合编《诗归》，提倡幽深孤峭、别出手眼的诗风，为竟陵派代表。论诗重性情与苦吟，著有《隐秀轩集》。
