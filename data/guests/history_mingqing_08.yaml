    flavor: （约1615年—1673年）字孝升，号芝麓，安徽合肥人，明末清初文学家、官员。崇祯七年进士，官兵科给事中；入清后官至刑部尚书。其诗与钱谦益、吴伟业并称“江左三大家”，诗名颇盛，亦工词，著有《定山堂集》。
