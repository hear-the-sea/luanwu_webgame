  - key: hist_mingqing_0344
    name: 黄道周
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: （1585年—1646年）字幼玄，号石斋，福建漳浦人，明末学者、书法家。天启二年进士，崇祯朝因直言进谏屡遭贬谪；弘光朝任礼部尚书，隆武朝官兵部尚书，自请率军出仙霞关抗清。兵败被俘，押至南京后拒绝降清，隆武二年遇害。他治学宗朱子，工书画，著有《榕坛问业》《石斋集》，门人辑其遗文传世。
