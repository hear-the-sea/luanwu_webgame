  - key: hist_mingqing_0327
    name: 海瑞
    avatar: monkey/明清/海瑞.png
    default_gender: male
    archetype: civil
    flavor: （1514年—1587年）字汝贤，号刚峰，广东琼山人，明代著名清官。历任淳安知县、应天巡抚等职。嘉靖年间，他上《治安疏》直陈世宗过失，下狱几死。任应天巡抚时清丈田亩、均平赋役、抑制豪强，生活清廉，死后家无余财。海瑞以刚直不阿闻名，屡遭贬抑而不改其志。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 14
      intellect: 56
      defense: 18
      agility: 12
  - key: hist_mingqing_0328
    name: 徐光启
    avatar: monkey/明清/徐光启.png
    default_gender: male
    archetype: civil
    flavor: （1562年—1633年）字子先，号玄扈，上海人，明末科学家、政治家，官至礼部尚书、内阁大学士。他主持修订历法，推动《崇祯历书》编纂，并与利玛窦等传教士合作译介《几何原本》等西学著作。所著《农政全书》总结农业与水利经验；他重视火器与军事技术，主张以实学应对国家危机。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 10
      intellect: 62
      defense: 16
      agility: 12
  - key: hist_mingqing_0329
    name: 吴承恩
    avatar: monkey/明清/吴承恩.png
    default_gender: male
    archetype: civil
    flavor: （约1500年—约1583年）吴承恩，字汝忠，号射阳山人，明代文学家，通常被认为是《西游记》的作者。其作品将神魔叙事、世俗讽谕与民间语言融合，构建出兼具想象力与社会批判性的长篇结构。吴承恩早年科举屡挫，晚年仕途亦不显，其创作却在后世形成了广泛文化影响。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0330
    name: 罗本
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （约1330年—约1400年）名本，字贯中，相传号湖海散人，元末明初小说家，籍贯有太原、东平、钱塘等说。相传他曾入张士诚幕府，明初归隐著述。其名下《三国志通俗演义》以史书和民间话本为基础，整理敷演为章回体长篇，对后世历史演义影响深远，另有《隋唐志传》等传世。
    growth_range:
