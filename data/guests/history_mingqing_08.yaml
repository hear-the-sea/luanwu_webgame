  - key: hist_mingqing_0328
    name: 徐光启
    default_gender: male
    archetype: civil
    flavor: （1562年—1633年）徐光启，字子先，号玄扈，明末科学家与政治家，官至礼部尚书、内阁大学士。主持修订历法，推动《崇祯历书》编纂，并与传教士合作译介《几何原本》等西学著作。徐光启重视农业、水利与军事技术，主张以实学应对国家危机。
    growth_range:
