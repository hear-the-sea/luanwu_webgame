    name: 杨慎
    avatar: monkey/其他随机角色/文049_男.png
    default_gender: male
    archetype: civil
    flavor: （1488年—1559年）字用修，号升庵，四川新都人，明代学者、文学家，正德六年状元，授翰林修撰。嘉靖三年“大礼议”中，他反对世宗追尊生父为皇考，率群臣伏阙哭谏，受廷杖后谪戍云南永昌卫。此后三十余年寄居滇中，讲学著述不辍，有《升庵集》《丹铅总录》等，涉及经史、音韵、诗文，著述宏富。
    growth_range:
