  - key: hist_mingqing_0334
    name: 沈周
    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （1427年—1509年）字启南，号石田，晚号白石翁，长洲人，明代画家。他终身不仕，隐居苏州，以诗文书画自娱；山水取法董源、巨然及元四家，兼工花鸟、人物，笔墨苍润，为吴门画派的开创者。文徵明、唐寅等曾受其指点或影响，与文徵明、唐寅、仇英并称“吴门四家”，代表作有《庐山高图》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 60
      defense: 18
      agility: 12
  - key: hist_mingqing_0340
    name: 仇英
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: （约1494年—约1552年）字实父，号十洲，原籍太仓，移居苏州，明代画家。他出身漆工，后师从周臣，以临摹唐宋名迹为业，专精人物、仕女、界画与青绿山水，用笔精细、设色明丽。其画深受文徵明、项元汴等人推重，与沈周、文徵明、唐寅并称“吴门四家”，传世作品有《汉宫春晓图》《桃源仙境图》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 60
      defense: 18
      agility: 12
  - key: hist_mingqing_0346
    name: 夏完淳
    avatar: pig/文034.png
    default_gender: male
    archetype: civil
    flavor: （1631年—1647年）字存古，松江华亭人，南明诗人、抗清志士。父亲夏允彝、老师陈子龙皆投身抗清，他随父往来义军之间；父亲兵败自尽后，仍与陈子龙等联络太湖义师。顺治四年在松江被捕，押至南京后拒绝降清，从容就义，年仅十七。其诗文悲慨，《南冠草》等集记录了他短暂的抗清经历。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 54
      defense: 18
      agility: 12
  - key: hist_mingqing_0309
    name: 祝允明
    avatar: pig/文041.png
    default_gender: male
    archetype: civil
    flavor: （1460年—1526年）字希哲，号枝山，长洲人，明代书法家、诗人。弘治五年中举，后任广东兴宁知县、应天府通判，因不耐俗务，不久辞官归乡。他工诗文，尤以书法名世，楷、行、草兼擅，狂草纵逸奔放，与唐寅、文徵明、徐祯卿并称“吴中四才子”，著有《怀星堂集》。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
