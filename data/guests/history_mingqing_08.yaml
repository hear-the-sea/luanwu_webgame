  - key: hist_mingqing_0333
    name: 杨慎
    default_gender: male
    archetype: civil
    flavor: （1488年—1559年）杨慎，字用修，号升庵，明代学者、文学家，正德六年状元。因“大礼议”事件触怒朝廷而被长期谪戍云南，流放生涯反而使其学术视野更加广阔。杨慎著述宏富，涉经史、音韵、金石、地理等多个领域，并留下大量诗词文赋。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 60
      defense: 16
      agility: 12
  - key: hist_mingqing_0334
    name: 沈周
    default_gender: male
    archetype: civil
    flavor: （1427年—1509年）沈周，字启南，号石田，明代书画家，“吴门画派”奠基人物之一。以山水、花鸟见长，强调文人笔墨中的人格修养与自然意趣，在明代中前期确立了“以诗书入画”的审美路径。沈周不以仕进为人生中心，长期活跃于江南士人网络，兼具艺术创造与文化组织能力。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 60
      defense: 18
      agility: 12
  - key: hist_mingqing_0340
    name: 仇英
    default_gender: male
    archetype: civil
    flavor: （约1494年—约1552年）仇英为明代画家，“吴门四家”之一。仇英出身工匠，却以极高的笔墨控制力与构图能力进入文人画核心谱系，尤精人物与青绿山水。其作品在设色、细节与叙事层次上兼具装饰性与历史感，对后世院体与民间绘画都产生过持续影响。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 60
      defense: 18
      agility: 12
