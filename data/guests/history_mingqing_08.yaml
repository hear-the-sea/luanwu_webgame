      defense: 16
      agility: 12
  - key: hist_mingqing_0329
    name: 吴承恩
    default_gender: male
    archetype: civil
    flavor: （约1500年—约1583年）吴承恩，字汝忠，号射阳山人，明代文学家，通常被认为是《西游记》的作者。其作品将神魔叙事、世俗讽谕与民间语言融合，构建出兼具想象力与社会批判性的长篇结构。吴承恩早年科举屡挫，晚年仕途亦不显，其创作却在后世形成了广泛文化影响。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  blue:
  - key: hist_mingqing_0330
    name: 罗本
    default_gender: male
    archetype: civil
    flavor: （约1330年—约1400年）罗本，字贯中，元末明初文学家，常被视作《三国演义》编写与传播的重要人物。罗本在历史叙事与民间讲史之间建立了具有戏剧张力的叙述结构，使人物形象与政治伦理并行展开。其作品对后世戏曲、评书与通俗小说影响深远，许多典型历史记忆由此定型。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0347
    name: 史可法
    default_gender: male
    archetype: military
    flavor: （1601年—1645年）史可法，明末重臣，南明弘光朝兵部尚书，扬州守城主将。清军南下时，史可法坚守扬州并组织防务，城破后拒降殉国，成为南明抗清叙事中的核心象征。其政治角色兼具文臣与统帅双重属性，但在危局中所呈现的军事组织与守城决断尤为关键。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 48
      intellect: 26
      defense: 16
      agility: 10
  - key: hist_mingqing_0333
    name: 杨慎
    default_gender: male
    archetype: civil
    flavor: （1488年—1559年）杨慎，字用修，号升庵，明代学者、文学家，正德六年状元。因“大礼议”事件触怒朝廷而被长期谪戍云南，流放生涯反而使其学术视野更加广阔。杨慎著述宏富，涉经史、音韵、金石、地理等多个领域，并留下大量诗词文赋。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 60
      defense: 16
      agility: 12
  - key: hist_mingqing_0334
    name: 沈周
    default_gender: male
    archetype: civil
    flavor: （1427年—1509年）沈周，字启南，号石田，明代书画家，“吴门画派”奠基人物之一。以山水、花鸟见长，强调文人笔墨中的人格修养与自然意趣，在明代中前期确立了“以诗书入画”的审美路径。沈周不以仕进为人生中心，长期活跃于江南士人网络，兼具艺术创造与文化组织能力。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 60
      defense: 18
      agility: 12
  - key: hist_mingqing_0340
    name: 仇英
    default_gender: male
    archetype: civil
    flavor: （约1494年—约1552年）仇英为明代画家，“吴门四家”之一。仇英出身工匠，却以极高的笔墨控制力与构图能力进入文人画核心谱系，尤精人物与青绿山水。其作品在设色、细节与叙事层次上兼具装饰性与历史感，对后世院体与民间绘画都产生过持续影响。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 60
      defense: 18
      agility: 12
  - key: hist_mingqing_0346
    name: 夏完淳
    default_gender: male
    archetype: civil
    flavor: （1631年—1647年）夏完淳为南明少年诗人、抗清志士。夏完淳年少即参与军事行动，后被俘遇害，年仅十六。其诗文虽篇幅不多，却在明清易代记忆中地位极高，兼具青春意气与亡国悲怆，被后世反复征引。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 16
      intellect: 54
      defense: 18
      agility: 12
  - key: hist_mingqing_0309
    name: 祝允明
    default_gender: male
    archetype: civil
    flavor: （1460年—1526年）字希哲，号枝山，明代著名的书法家、诗人，“吴中四才子”之一。他才华横溢、狂放不羁，在书法造诣上尤其是草书方面达到了明代的巅峰水准。祝允明的笔墨苍劲飞动、气势夺人，融合了晋唐名家之长而自成一家，被誉为“明代草书第一”。他在文学上也展现了极高天赋，诗文风格雄浑、充满了浪漫情怀。尽管他在仕途上郁郁不得志，长期担任地方小官，但他那追求绝对艺术自由、不肯受成法束缚的性格，使其成为了中国艺术史上的一位顶级天才。他的一生是关于“才情”与“独立人格”的动人叙事。他留下的作品不仅具有极高的审美价值，更是研究明代中叶文人文化的重要材料。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0322
    name: 唐顺之
    default_gender: male
    archetype: civil
    flavor: （1507年—1560年）字应德，号荆川，明代杰出的文学家、武术家与军事家。他博学多才，在文学上提出“本色”说，主张散文应质朴自然、揭示事物的本质，是“唐宋派”散文的重要领袖。唐顺之不仅文采斐然，更是一位具有极高实战能力的军事统帅，在东南沿海抗击倭寇的战斗中身先士卒，立下赫赫战功。他在武学造诣上亦极其深厚，撰写了《荆川短篇》等涵盖历算、地理、兵法的综合性著作。他的一生是传统文人追求“知行合一、经世致用”的杰出典范。他在极其危险的边疆战场与繁琐的行政事务间展现出的那种从容与果敢，使其成为了明代士大夫阶层中一位极其罕见的、能够将文化修养与武装实践完美融合的英雄人物。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0332
    name: 李梦阳
    default_gender: male
    archetype: civil
    flavor: （1473年—1530年）李梦阳，字献吉，号空同子，明代文学家，“前七子”领袖之一。倡导“文必秦汉、诗必盛唐”，试图重建古典文体的气格与法度，对正德、嘉靖间文坛风向影响极大。李梦阳在政坛上亦多有直言，屡因言获罪，仕途并不顺遂。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0338
    name: 杨涟
    default_gender: male
    archetype: civil
    flavor: （1572年—1625年）杨涟，字文孺，号大洪，明末东林党代表人物，历任给事中、左副都御史。其人以弹劾魏忠贤著名，曾上疏“二十四大罪”，后遭诬陷下狱并被酷刑致死。杨涟在晚明政治中的象征意义超出个人官职，成为士大夫“以言责为本分”的典型。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 56
      defense: 18
      agility: 12
  - key: hist_mingqing_0342
    name: 高启
    default_gender: male
    archetype: civil
    flavor: （1336年—1374年）高启为元末明初诗人，“吴中四杰”之首。高启诗风雄健清峭，兼有唐宋之长，题材涵盖山林隐逸与世局动荡，语言简劲而气象开阔。入明后曾短暂任职，后因政治风波被诛，结局悲剧。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0343
    name: 刘宗周
    default_gender: male
    archetype: civil
    flavor: （1578年—1645年）刘宗周，明末思想家与政治人物，字起东，号念台。其学承阳明而重“慎独”工夫，强调士人应在极端政治压力下守住道德自律与行动责任。刘宗周在朝局混乱时多次直言，晚年以身殉明，形成强烈道义象征。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 56
      defense: 18
      agility: 12
  - key: hist_mingqing_0344
    name: 黄道周
    default_gender: male
    archetype: civil
    flavor: （1585年—1646年）黄道周，明末学者、书法家与政治家，字幼玄。其人以气节与学识并重著称，在南明政权中坚持抗清立场，后兵败被俘遇害。黄道周在经学、书法与政论方面均有深厚造诣，书风峭劲奇崛，影响清初书坛。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 56
      defense: 18
      agility: 12
  - key: hist_mingqing_0345
    name: 陈子龙
    default_gender: male
    archetype: civil
    flavor: （1608年—1647年）陈子龙，明末文学家、政治人物，松江派代表之一。其诗词文兼长，风格沉郁而富时代紧张感，尤其在国难背景下形成鲜明的家国书写。陈子龙晚年参与抗清活动，兵败后殉节。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 56
      defense: 18
      agility: 12
  green:
  - key: hist_mingqing_0308
    name: 吴嘉纪
    default_gender: male
    archetype: civil
    flavor: （1618年—1684年）字宾贤，号野人，清初诗人，长期生活于泰州盐场一带。吴嘉纪熟悉盐民的劳作、贫困和官府压榨，诗中少有华饰，常以短峭的笔触写普通人的饥寒与离散；这些作品因此兼有文学和社会记录的价值。说他“忧国忧民”不如读他写一担盐、一场风和一个穷人的口气。诗人不在高楼上指点江山，他把鞋底的盐碱带进了诗里。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0310
    name: 徐祯卿
    default_gender: male
    archetype: civil
    flavor: （1479年—1511年）字昌谷，号迪功，明代诗人，“吴中四才子”之一，亦列前七子。徐祯卿才思早发，诗文既有吴中文士的清丽，也受复古文风影响；《谈艺录》等文字显示出他对诗歌格调和作法的认真思考。仕途未能久展，三十余岁便去世。才子如流星，亮不亮是一回事，能在天上停多久却不是自己说了算。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0311
    name: 陈继儒
    default_gender: male
    archetype: civil
    flavor: （1558年—1639年）字仲醇，号眉公，明代文人、书画家、鉴赏家。陈继儒早年放弃科举仕途，长期居松江一带，以著述、书画、鉴藏和交游闻名；《小窗幽记》通常归于他的名下，但其成书与辑录情况带有文人笔记的复杂层次。墨梅、墨竹之外，他更擅长把日常处世写成短章，雅是雅，偶尔也有几分给自己摆茶席的讲究。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0312
    name: 袁中道
    default_gender: male
    archetype: civil
    flavor: （1570年—1623年）字小修，号石浦，明代文学家，公安派“三袁”之一。袁中道主张文章出于性灵，不拘旧套，游记、尺牍和日记中常有对山水、友朋及日常心绪的细察。《游居柿录》留下了晚明士人的行旅与生活纹理。与兄长袁宗道、袁宏道相比，他的声调更私人、更幽微，像行走江湖后在客店灯下记下的一页小札。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0313
    name: 袁宗道
    default_gender: male
    archetype: civil
    flavor: （1560年—1600年）字伯修，号无言居士，明代文学家，公安派先声，与袁宏道、袁中道并称“三袁”。袁宗道反对后七子一味拟古，强调文章应有真情、本色和当下气息；他入翰林任职，著《白苏斋类集》，也研习佛理。四十岁前便去世，留下的文字不多却为公安派开了门。开门的人未必走得最远，却决定后来者能不能进来。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0314
    name: 谭元春
    default_gender: male
    archetype: civil
    flavor: （1586年—1637年）字友夏，明末诗人、文学评论家，与钟惺共同开创竟陵派。谭元春重“幽深孤峭”和含蓄厚味，作品不追求公安派的直白流利，而爱在冷峭、幽微处经营情绪；他与钟惺合编《诗归》，影响了晚明诗学趣味。竟陵之“幽”不是故作高深，而是乱世里说话不愿太响的一种姿态。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0315
    name: 钟惺
    default_gender: male
    archetype: civil
    flavor: （1574年—1624年）字伯敬，号退谷，明末文学家、诗人，竟陵派代表。钟惺与谭元春合编《诗归》，重视诗歌的灵性、古意和幽微感受，对晚明诗坛的复古风气另开一条路径。他也曾入仕，但文学声名主要来自诗论与选诗。选诗如用剑挑水，既要辨锋芒，也要看余韵；钟惺偏爱的是那一滴迟迟不落的水。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0316
    name: 龚鼎孳
    default_gender: male
    archetype: civil
    flavor: （1615年—1673年）字孝升，号芝麓，明末清初诗人、官员，与钱谦益、吴伟业并称“江左三大家”。龚鼎孳明末任给事中，易代后仕清，官至刑部尚书；这条仕途使他长期背负“失节”的批评，不能由诗名或资助文士一笔带过。他与顾横波的婚姻、与遗民和文人的交游，又让形象显得复杂。才情可以是真的，政治选择也必须算在账上；江左风流并不等于江湖无债。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0317
    name: 汪师韩
    default_gender: male
    archetype: civil
    flavor: （1707年—1780年）字通甫，号退谷，清代学者、诗人。汪师韩的声名与诗学、经史和文献研究相连，乾嘉学术重证据、重师承，他便在这样的书香风气中行走。学问若没有出处，哪怕说得气势如虹，也只是纸上风声。
    growth_range:
    - 4
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
