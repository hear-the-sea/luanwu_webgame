    flavor: （1514年—1587年）海瑞，字汝贤，号刚峰，明代著名清官，历任淳安知县、应天巡抚等职。海瑞以廉洁刚直闻名，敢于上疏直陈时政得失，虽屡遭贬谪，仍不改其志。在地方治理中重视赋役公平与司法整饬，尤其强调官员应当节用爱民。
