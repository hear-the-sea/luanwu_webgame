    avatar: pig_wu_male5.png
    default_gender: male
    archetype: civil
    flavor: （1569年—1625年）字飞百，号芝冈，湖广江夏人，明末军事官员。万历二十六年进士，曾巡按辽东；萨尔浒之战后出任辽东经略，主张整军筑城、固守要地。因与巡抚王化贞意见相左，广宁失守后受到追责，天启五年被处死。崇祯年间获平反。
