      agility: 12
  - key: hist_mingqing_0347
    name: 史可法
    avatar: pig/武049.png
    default_gender: male
    archetype: civil
    flavor: （1601年—1645年）字宪之，号道邻，河南祥符人，明末大臣。崇祯进士，曾任南京兵部尚书；南明弘光朝任东阁大学士、礼部尚书，督师扬州。弘光元年清军南下围攻扬州，他组织军民守城；城破后被执，拒降遇害，遗体未能寻获，后人于梅花岭建衣冠冢祭祀。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 20
      intellect: 30
      defense: 40
