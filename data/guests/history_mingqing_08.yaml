    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （1572年—1625年）字文孺，号大洪，湖广应山人，明代官员。万历三十五年进士，官至左副都御史，为东林党重要人物。天启四年，他上疏弹劾宦官魏忠贤二十四条罪状，次年被逮入诏狱，在狱中遇害。崇祯初年获平反，谥忠烈，后世将其列为“东林六君子”之一。
