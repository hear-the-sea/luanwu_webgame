  - key: hist_mingqing_0345
    name: 陈子龙
    avatar: pig_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （1608年—1647年）字卧子，号大樽，松江华亭人，明末文学家。崇祯十年进士，曾任绍兴推官，弘光朝擢兵科给事中。他是几社领袖，与徐孚远、宋徵璧等编成《皇明经世文编》，诗文宗法汉魏盛唐，为云间词派代表。清军南下后，他在松江联络义军抗清，顺治四年被捕，押解途中投水殉难，著有《陈忠裕公全集》。
