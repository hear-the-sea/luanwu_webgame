    default_gender: male
    archetype: civil
    flavor: （1586年—1637年）字友夏，号鹄湾，湖广竟陵人，明末诗人。天启七年乡试第一，此后会试屡次不第。他与钟惺同选《唐诗归》《古诗归》，合称《诗归》，倡导幽深孤峭的诗风，世称“竟陵派”。崇祯十年赴京应试途中病卒。其诗重含蓄与个人感受，著有《谭友夏合集》。
