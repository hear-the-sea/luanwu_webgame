    avatar: monkey/其他随机角色/文_男.png
    default_gender: male
    archetype: civil
    flavor: （1558年—1639年）字仲醇，号眉公，松江华亭人，明代文人、书画家。二十九岁时焚弃儒生衣冠，隐居小昆山，后筑室东佘山，以著述、书画与鉴藏自遣。他与董其昌齐名，交游遍及朝野，朝廷屡次征召皆以疾辞。著有《陈眉公全集》，笔记《小窗幽记》通常也署其名。
