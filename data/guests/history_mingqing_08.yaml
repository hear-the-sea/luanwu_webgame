    archetype: civil
    flavor: （1479年—1511年）字昌榖，一字昌国，吴县人，明代诗人。弘治十八年进士，官国子监博士。早年与唐寅、文徵明、祝允明并称“吴中四才子”，后与李梦阳等唱和，列名“前七子”。诗风由吴中绮丽转向复古，著有《谈艺录》《迪功集》。
