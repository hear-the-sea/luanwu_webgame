    name: 曹景植
    default_gender: male
    archetype: civil
    flavor: （约1700年—1760年）清代学者、藏书家。曹景植身处清代藏书、校勘与经学风气之中，书籍能否传下去，常靠许多不见名的搜集与抄校者；他的身影也留在这些默默传书的人群里。
    growth_range:
    - 4
