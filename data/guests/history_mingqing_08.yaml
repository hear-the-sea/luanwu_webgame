    archetype: civil
    flavor: （1560年—1600年）字伯修，号石浦，湖广公安人，明代文学家、官员。万历十四年会元，官至右庶子。与弟宏道、中道并称“公安三袁”，反对拟古，主张文章抒写性灵。因推崇白居易、苏轼，题书斋为白苏斋，著有《白苏斋类集》。
