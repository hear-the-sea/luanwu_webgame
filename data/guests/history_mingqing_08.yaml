  - key: hist_mingqing_0343
    name: 刘宗周
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: （1578年—1645年）字起东，号念台，绍兴山阴人，明末思想家。万历二十九年进士，官至左都御史，因反对宦官魏忠贤而削籍；崇祯朝屡起屡罢，弘光朝再任左都御史，又因弹劾马士英、阮大铖去职。清军入浙后，他在绍兴故里绝食而卒。其学宗阳明而重慎独，开蕺山学派，黄宗羲即出其门下，著有《人谱》《刘子全书》。
