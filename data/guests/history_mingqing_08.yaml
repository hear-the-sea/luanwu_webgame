      agility: 12
  - key: hist_mingqing_0322
    name: 唐顺之
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （1507年—1560年）字应德，号荆川，武进人，明代文学家、官员。嘉靖八年会元，官至右佥都御史、凤阳巡抚。论文推崇唐宋，编选《文编》，与王慎中、茅坤等同开“唐宋派”风气。嘉靖年间倭患炽烈，他以兵部职方郎中视师浙江，曾亲泛海督战，后巡抚凤阳，在赴任途中病卒，著有《荆川先生文集》。
    growth_range:
