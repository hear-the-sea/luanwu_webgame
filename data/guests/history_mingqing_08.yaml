    name: 罗本
    default_gender: male
    archetype: civil
    flavor: （约1330年—约1400年）罗本，字贯中，元末明初文学家，常被视作《三国演义》编写与传播的重要人物。罗本在历史叙事与民间讲史之间建立了具有戏剧张力的叙述结构，使人物形象与政治伦理并行展开。其作品对后世戏曲、评书与通俗小说影响深远，许多典型历史记忆由此定型。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_mingqing_0347
    name: 史可法
    default_gender: male
    archetype: military
    flavor: （1601年—1645年）史可法，明末重臣，南明弘光朝兵部尚书，扬州守城主将。清军南下时，史可法坚守扬州并组织防务，城破后拒降殉国，成为南明抗清叙事中的核心象征。其政治角色兼具文臣与统帅双重属性，但在危局中所呈现的军事组织与守城决断尤为关键。
    growth_range:
