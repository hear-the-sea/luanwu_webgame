  - key: hist_mingqing_0331
    name: 施彦端
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: “施彦端”常被说成施耐庵的原名或《水浒传》作者名之一，相传为元末明初人，籍贯有兴化、钱塘等说。但现存文献不足以确证其独立生平与作者身份。《水浒传》由长期流传的话本、戏曲与文人编纂增衍而成，署名问题至今仍有争议。
