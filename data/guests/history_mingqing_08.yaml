    archetype: civil
    flavor: （约1330年—约1400年）元末明初文学家，名本，字贯中，籍贯相传为太原或钱塘。罗本曾参与元末起义军幕府，明初隐居著述；后世常将《三国演义》的编撰和传播归于罗贯中，关于其生平的确切记载很少。
