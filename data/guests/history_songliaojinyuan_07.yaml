heroes:
  blue:
  - key: hist_songliaojinyuan_0318
    name: 李继迁
    default_gender: male
    archetype: military
    flavor: （963年-1004年）西夏奠基者，李元昊的祖父。他割据西北，与宋辽两大帝国周旋。他的努力为李元昊建国奠定了基础，是党项族崛起的关键人物。就材料价值而言，李继迁的记载因保留多重立场而尤为可贵，可用于对照正史与后世评论的张力结构。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0337
    name: 完颜宗望
    default_gender: male
    archetype: military
    flavor: （？-1127年）金朝开国名将，靖康之变的主导者之一。他攻陷燕京，俘虏宋徽宗宋钦宗，将他们押往五国城。他是金朝灭北宋的功臣，也是宋人的噩梦。研究完颜宗望时，常需把战术判断与组织条件并列考察，才能准确理解其成败背后的结构性因素。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0338
    name: 完颜宗翰
    default_gender: male
    archetype: military
    flavor: （1080年-1137年）金朝开国名将，与完颜宗望并称。他策划并实施了靖康之变，攻破北宋首都。他是金朝建立初期最重要的军事统帅之一。完颜宗翰战场表现在不同文献中呈现差异化叙述，值得结合成书背景一并辨析。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0340
    name: 完颜雍
    default_gender: male
    archetype: civil
    flavor: （1123年-1189年）金世宗，金朝中兴之主。他推行汉法，减轻赋税，创造了"大定之治"。他与南宋讲和，使金朝获得了难得的和平发展时期。关于完颜雍的史料被长期重读，原因正在于其能够同时折射宋辽金元之际政治运行与社会心态的微妙变动。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0341
    name: 元好问
    default_gender: male
    archetype: civil
    flavor: （1190年-1257年）金末元初文学家，词曲皆精的大家。"问世间情为何物，直教生死相许"——他的《雁丘词》千古传诵。他亲历国亡家破，诗词中充满了家国之痛。元好问的人生轨迹显示，作品风格与时代压力会相互塑形，因此其文本总带着鲜明的历史温度。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
