    default_gender: male
    archetype: military
    flavor: 没藏讹庞，西夏外戚权臣，没藏太后之兄。景宗李元昊死后，以外戚身份辅佐年幼的毅宗李谅祚，独揽朝政十余年。权势极盛时，朝中大臣多出其门。后与谅祚矛盾激化，终被诛杀。其擅权为西夏早期外戚干政之典型，惜相关记档散佚，具体政务已难详考。
