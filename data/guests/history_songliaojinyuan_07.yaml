    archetype: civil
    flavor: 野利仁荣（？-1042），西夏开国重臣，党项羌野利部人。李元昊称帝前后，命其主持创制西夏文字，仁荣摹汉字形体而造蕃书十二卷，字形方整、笔画繁密，使党项始有本族文字。元昊设蕃学，以仁荣主其事，用西夏文译《孝经》《尔雅》等书，推行蕃礼。然其生平仕宦细节，传世记载甚略。
