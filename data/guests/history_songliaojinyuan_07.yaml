  - key: hist_songliaojinyuan_0331
    name: 梁太后
    default_gender: female
    archetype: civil
    flavor: 西夏惠宗生母，毅宗谅祚皇后。惠宗七岁即位，梁氏以太后摄政，大权独揽。主政期间屡次对宋用兵，永乐城一役宋军死伤惨重。她对内诛除异己，一度幽禁亲宋的惠宗，长期掌控朝局。其统治强化了西夏军事自主，但连年征战亦使国力耗损。现存记载中关于其卒年与早年家世存在分歧。
    growth_range:
