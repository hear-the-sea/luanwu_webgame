heroes:
  blue:
  - key: hist_songliaojinyuan_0318
    name: 李继迁
    default_gender: male
    archetype: military
    flavor: （963年-1004年）西夏奠基者，李元昊的祖父。他割据西北，与宋辽两大帝国周旋。他的努力为李元昊建国奠定了基础，是党项族崛起的关键人物。就材料价值而言，李继迁的记载因保留多重立场而尤为可贵，可用于对照正史与后世评论的张力结构。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0337
    name: 完颜宗望
    default_gender: male
    archetype: military
    flavor: （？-1127年）金朝开国名将，靖康之变的主导者之一。他攻陷燕京，俘虏宋徽宗宋钦宗，将他们押往五国城。他是金朝灭北宋的功臣，也是宋人的噩梦。研究完颜宗望时，常需把战术判断与组织条件并列考察，才能准确理解其成败背后的结构性因素。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0338
    name: 完颜宗翰
    default_gender: male
    archetype: military
    flavor: （1080年-1137年）金朝开国名将，与完颜宗望并称。他策划并实施了靖康之变，攻破北宋首都。他是金朝建立初期最重要的军事统帅之一。完颜宗翰战场表现在不同文献中呈现差异化叙述，值得结合成书背景一并辨析。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0340
    name: 完颜雍
    default_gender: male
    archetype: civil
    flavor: （1123年-1189年）金世宗，金朝中兴之主。他推行汉法，减轻赋税，创造了"大定之治"。他与南宋讲和，使金朝获得了难得的和平发展时期。关于完颜雍的史料被长期重读，原因正在于其能够同时折射宋辽金元之际政治运行与社会心态的微妙变动。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0341
    name: 元好问
    default_gender: male
    archetype: civil
    flavor: （1190年-1257年）金末元初文学家，词曲皆精的大家。"问世间情为何物，直教生死相许"——他的《雁丘词》千古传诵。他亲历国亡家破，诗词中充满了家国之痛。元好问的人生轨迹显示，作品风格与时代压力会相互塑形，因此其文本总带着鲜明的历史温度。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  green:
  - key: hist_songliaojinyuan_0309
    name: 萧干
    default_gender: male
    archetype: military
    flavor: （？—1122年）辽末奚族将领，出身奚回离保一族。天祚帝西逃后，萧干在燕京辅佐耶律淳建立北辽，任北院枢密使；宋金夹攻时曾多次击退宋军。北辽内溃后他被迫西走，最终死于部下之手。能在乱军中赢几场仗，不等于能替一座摇晃的政权补上根基。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0310
    name: 耶律燕山
    default_gender: male
    archetype: military
    flavor: （生卒年不详）辽末人物。《辽史》记载，康国元年（1124年）他任都部署，随耶律大石东征。传世记载主要保留其职名与出征线索，族属和后续行迹已难详考。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0311
    name: 萧昱
    default_gender: male
    archetype: civil
    flavor: （？—约1100年）辽朝汉臣，精通汉学，参与官制与文教调整。萧昱处在契丹旧俗与汉地行政相互磨合的年代，所做的并非只改几个官名，更要让制度落到不同人群身上。辽廷的秩序由许多这样的实务者共同撑起，他的名字也留在这段制度转身之中。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0312
    name: 刘六符
    default_gender: male
    archetype: civil
    flavor: 辽朝汉臣，善辞令，屡次出使北宋，参与重熙年间辽宋关约与岁币交涉。刘六符的本领不在战场拔刀，而在两国都不愿先低头时，把一句容易翻脸的话换成还能继续谈的说法。具体使节细节已多散佚，但他确是辽朝处理宋事时重要的传话人与斡旋者。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0313
    name: 耶律化哥
    default_gender: male
    archetype: military
    flavor: 辽朝将领，活动于圣宗、兴宗两朝，曾任南京留守，主持南面防务。耶律化哥长期守边，也参与对阻卜诸部的军事行动；辽宋边境能有一段相对安定，离不开这类不常被民间演义写到的守将。具体战事已不完整，他的功劳更像城墙：醒目时不多，缺了却马上知道。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0314
    name: 萧得里底
    default_gender: male
    archetype: military
    flavor: （？—约1115年）辽末将领，天祚帝时任先锋都统。金太祖起兵后，萧得里底奉命在宁江州、出河店等地迎战，却屡遭失利；败因既有个人用兵问题，也有辽军动员、指挥与军心积弊。前锋最先接刀，也最先暴露旧军制的裂缝，他后来事迹不显，正被这片阴影吞去。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0315
    name: 耶律涅里
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）辽朝宗室，约活动于辽道宗时期。耶律涅里曾参与朝政，名字留在辽中后期宗室与宫廷的断简之间；门牌尚在，屋内的风云已随岁月沉入幽暗。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0316
    name: 张孝杰
    default_gender: male
    archetype: civil
    flavor: 辽朝汉臣，辽道宗年间权臣，进士出身，累官至北府宰相。张孝杰深受道宗宠信，曾卷入朝中党争与萧观音一案，后来失势遭贬。相关记载多出于政敌叙述，后世对其责任褒贬不一；权臣的身影在史书里被灯火拉得很长，功过与阴影总相互纠缠。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0317
    name: 耶律俨
    default_gender: male
    archetype: civil
    flavor: 耶律俨（？—约1110年），本姓李，辽道宗赐姓耶律，道宗朝进士，官至参知政事。大安年间奉诏修《皇朝实录》七十卷，成为后来修《辽史》所倚重的史源之一。原书已经散佚，只能从后世引文窥见片段；耶律俨替辽朝写下的长卷不见了，留下的反而更提醒人珍惜残存的每一笔。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0319
    name: 李德明
    default_gender: male
    archetype: military
    flavor: （981年-1032年）李继迁之子，李元昊之父，党项政权走向王朝化的关键统治者。李德明一面整合部众、经营农牧与城寨，一面与宋朝周旋，接受名义上的封号以换取发展空间，为儿子李元昊称帝积攒了根基。真正的开国不只在登坛称帝，也在此前多年把部落、粮道和文书慢慢拢到一起。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0320
    name: 李谅祚
    default_gender: male
    archetype: military
    flavor: 西夏毅宗，幼年即位，亲政后逐步增用汉人官员，吸收宋朝制度与文化。李谅祚所处的时代，西夏正在从党项旧制向更成熟的国家官僚体系转变；他的调整推动了这一进程，却因早逝而未能完全展开。年纪尚轻便要在外敌、外戚与制度之间走钢丝，脚下每一步都比宫门里的礼仪更难。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0321
    name: 野利仁荣
    default_gender: male
    archetype: civil
    flavor: 野利仁荣（？—1042），西夏开国重臣，出身党项野利部。李元昊称帝前后命他主持创制西夏文字，仁荣取汉字形体之长，造出方整繁密的蕃书；又主持蕃学，参与翻译《孝经》《尔雅》等典籍。一个王朝要把声音刻进石头，先得有自己的文字，野利仁荣便是替西夏铸造这把“文化之剑”的人。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0322
    name: 李乾顺
    default_gender: male
    archetype: military
    flavor: 李乾顺（1083—1139），西夏崇宗，三岁即位，在位五十余年。早年由梁氏等摄政，亲政后整饬内政、提倡文教，并在辽、宋、金之间谨慎周旋，尽量避免同时陷入多线战争。西夏在他手里得到一段恢复元气的时期；真正高明的君主有时不在于每仗都赢，而在于知道哪一仗不该先打。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0323
    name: 李仁孝
    default_gender: male
    archetype: civil
    flavor: （1124年-1193年）西夏仁宗，在位五十四年。颁行《天盛改旧新定律令》，兴学养士，兼崇儒学与佛教，使西夏文教达到高峰；但对外受制于金朝，对内又遭任得敬擅权、逼迫分国，晚年并不安稳。李仁孝的功业像一座修得精细的城，外墙有法典与学校，城门外却仍有强邻与权臣叩门。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0324
    name: 任得敬
    default_gender: male
    archetype: military
    flavor: 任得敬（？—1170），原为宋朝边将，降附西夏后凭女儿成为仁宗皇后的关系得势，累官至楚王、太师。乾祐元年，他逼迫仁宗分国自立，并向金朝求册封；金方拒绝后，任氏谋划败露，被仁宗诛杀。外戚把手伸进王座，原以为能借婚姻取国，最后却连自己经营的权势一并折断。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0325
    name: 李安全
    default_gender: male
    archetype: military
    flavor: （？—1211年）西夏襄宗，以政变弑君夺位。即位后面对蒙古崛起，内政与军备都显疲弱，西夏在外患与宫廷争斗中进一步失去回旋空间。把衰落全归咎于一位君主固然简单，但李安全的夺位本身已让统治合法性先裂了一道口，后来每次迎敌都像从裂口漏风。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0326
    name: 李遵顼
    default_gender: male
    archetype: civil
    flavor: （1163年-1226年）西夏神宗，科举状元出身、少见的“状元天子”。即位后多次与蒙古交战，屡作主动出击的高风险决断，终使国力大损并被迫退位。文章能夺状元，未必能在蒙古铁骑前找到答案；李遵顼的经历正说明文才、帝位与统兵并不是同一门功夫。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0327
    name: 李睍
    default_gender: male
    archetype: military
    flavor: 西夏末帝。1226年兄献宗去世后，李睍在国势将亡之际即位；次年成吉思汗军围中兴府，他据城坚守半年，直到粮尽援绝，七月城破出降，旋被蒙古杀死，西夏随之灭亡。即位不足两年，能做的已不是开疆立制，而是在沉船上尽力拖住最后一块木板；典籍散佚后，他的许多细节也随国运一同失传。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0328
    name: 嵬名安惠
    default_gender: male
    archetype: military
    flavor: 西夏宗室重臣，嵬名氏为西夏皇族姓氏。西夏末年蒙古大举南侵，嵬名安惠率部抗战不屈；关于他的官职、战历与最终结局，传世文献却几乎没有交代。史书没有给他完整战报，只留下国难时挺身而出的名字；有些人传世靠长篇列传，有些人只靠一行不肯退的记录。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0329
    name: 斡道冲
    default_gender: male
    archetype: civil
    flavor: （？—1183年）西夏名臣、学者，熟悉汉学，参与西夏文教与制度建设。斡道冲并非把中原制度整套搬进党项王国，而是在本地旧制与汉文典章之间寻找能真正运转的办法。传世生平细节不多，至少可以看见他在西夏文化转型中留下的学者与官员双重身影。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0330
    name: 李秉常
    default_gender: male
    archetype: military
    flavor: （1061年-1086年）西夏惠宗，幼年即位，母梁太后长期摄政。梁氏对宋用兵、掌控朝政，李秉常成年后试图亲政，却被软禁，最终在压抑中死去。皇帝名义上坐在殿中，真正的钥匙却在太后手里；李秉常的一生，正是王冠与权力并不总在同一人头上的证明。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0331
    name: 梁太后
    default_gender: female
    archetype: civil
    flavor: 西夏惠宗生母，毅宗谅祚皇后。惠宗七岁即位后，梁太后摄政并长期独揽朝政，屡次对宋用兵，永乐城之战更使宋军遭受重创；她对内诛除异己，甚至幽禁试图亲政的儿子。梁氏确实强化了西夏的军事主动，却也以连年战争消耗国力。她不是只会幕后垂帘的柔弱太后，而是一位把军令握得很紧、也把国家押得很重的统治者。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0332
    name: 没藏讹庞
    default_gender: male
    archetype: military
    flavor: 没藏讹庞，西夏外戚权臣，没藏太后之兄。李元昊死后，他以舅父身份辅佐幼主李谅祚，独揽朝政十余年，朝中许多官员都出自其门；后来与谅祚矛盾激化，终被诛杀。外戚掌权像借来的刀，幼主年少时锋利无比，等幼主长大，刀柄便会先落到自己身上。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0333
    name: 野利遇乞
    default_gender: male
    archetype: military
    flavor: 野利遇乞，西夏名将，文字学家野利仁荣之兄。李元昊时期统军对宋，凭骁勇屡立战功；后来宋廷离间之计传入，李元昊疑其不忠，野利遇乞被赐死。能在战场上击退强敌，却挡不住君王心中的疑云，名将的死有时不在刀阵，而在一封被信了的密信。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0334
    name: 李察哥
    default_gender: male
    archetype: military
    flavor: 西夏宗室将领，曾随李元昊征宋，在好水川、定川寨等战事中建功。李察哥长于骑战与设伏，熟悉把山谷、荒原变成自己的阵势；晚年又主张以守代攻、保存国力，说明他并非只知向前冲的武夫。能在胜势时进，也能在国力将疲时劝退，这才是边将真正的眼力。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0336
    name: 李彦宗
