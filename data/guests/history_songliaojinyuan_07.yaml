    flavor: 任得敬（？—1170），西夏外戚权臣，原为宋朝边将降附西夏。以女为仁宗皇后得势，累官至楚王、太师。乾祐元年逼迫仁宗李仁孝分国自立，求金朝册封遭拒，事败被仁孝诛杀，西夏内乱暂息。
