heroes:
  blue:
  - key: hist_songliaojinyuan_0318
    name: 李继迁
    avatar: monkey/其他随机角色/武044_男_.png
    default_gender: male
    archetype: military
    flavor: （963年—1004年）党项首领，北魏拓跋氏后裔，西夏奠基者李元昊之祖。李继迁收拢党项部众，起兵反宋，屡败宋军，后攻占灵州并改称西平府，接受辽朝册封为西平王；景德元年攻西凉府时中吐蕃埋伏，伤重而卒，其子孙终建西夏。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0337
    name: 完颜宗望
    avatar: pig/武010.png
    default_gender: male
    archetype: military
    flavor: （？—1127年）金朝宗室将领，金太祖完颜阿骨打次子，本名斡鲁补，又作斡离不，宋人称之为“二太子”。完颜宗望参与灭辽，后率东路军南下攻宋，攻陷燕京、开封，与完颜宗翰共同俘获宋徽宗、宋钦宗；靖康二年病逝于军中。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0338
    name: 完颜宗翰
    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （1080年-1137年）金朝开国名将，与完颜宗望并称。他策划并实施了靖康之变，攻破北宋首都。他是金朝建立初期最重要的军事统帅之一。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0340
    name: 完颜雍
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （1123年—1189年）金世宗，名完颜雍，金太祖之孙，本名乌禄。正隆六年，他在东京即位，随后定都中都；在位期间整顿吏治、轻徭薄赋、与南宋议和，史称“大定之治”，被后人誉为“小尧舜”，大定二十九年病逝。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0341
    name: 元好问
    avatar: monkey/其他随机角色/文037_男.png
    default_gender: male
    archetype: civil
    flavor: （1190年—1257年）金末元初文学家、史学家，字裕之，号遗山，太原秀容人。金亡后元好问不仕新朝，寓居忻州、苏门山，搜集编纂金朝史料，著有《遗山集》《中州集》；其《摸鱼儿·雁丘词》中“问世间、情是何物”传诵至今。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0344
    name: 完颜吴乞买
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: （1075年—1135年）金太宗，本名完颜吴乞买，汉名完颜晟，金太祖阿骨打之弟。他在位十二年，期间两次南下攻宋，攻陷汴京，北宋灭亡；同时渐采汉制，设尚书省等汉官，推进金朝制度建设（三省六部至金熙宗时方臻完备），天会十三年病逝。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  green:
  - key: hist_songliaojinyuan_0309
    name: 萧干
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: 萧干（？—1123），辽末奚族将领，又名回离保。保大二年（1122）天祚帝西逃后，他拥立耶律淳于燕京建立北辽，任北院枢密使；同年率军夜袭宋将刘延庆部于卢沟河，宋军自溃，北伐受挫。耶律淳死后退走奚地，一度自立为奚帝，旋即被部下所杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0310
    name: 耶律燕山
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
    flavor: 耶律燕山，辽末人物，见于耶律大石西迁后的记载。西辽初立，大石欲东向恢复旧疆；《辽史》载康国元年（约1134）以萧斡里剌为都元帅、燕山为都部署，率七万骑东征金朝，途中行远无功、牛马多死，只得勒兵而返。其生卒、家世及此后事迹均不详。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0311
    name: 萧昱
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: 萧昱，辽末驸马都尉。天祚帝时，元妃之兄萧奉先欲拥立外甥秦王，诬称萧昱与耶律余睹谋立晋王耶律敖卢斡；事发后萧昱被杀，余睹惧祸降金，文妃与晋王也相继被赐死。余睹降金后为金军引路，辽廷由此愈乱。《辽史》对其家世、官职记载较少。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0312
    name: 刘六符
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: 刘六符，辽朝汉臣、使者，出身汉臣世家，父刘慎行官至北府宰相，以善辞令著称。重熙十一年（1042）辽兴宗谋取关南十县，他奉命使宋交涉，与宋臣富弼往复争辩，最终宋增岁币银、绢各十万而和；后任枢密使、中书政事令，官至同中书门下平章事。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0313
    name: 耶律化哥
    avatar: pig_wu_male9.png
    default_gender: male
    archetype: military
    flavor: 耶律化哥，辽圣宗朝契丹将领，善骑射。统和四年（986）宋军三路北伐，即宋雍熙北伐，他在平州一线阻击并击败宋军；后历任上京留守、北院大王、北院枢密使，又领兵征讨阻卜、达旦等部，以安北边，晚年因误掠属部被夺爵。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0314
    name: 萧得里底
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: 萧得里底（生卒不详），辽末大臣、将领，官至北院枢密使。金兵兴起后，辽军屡败，他任先锋都统参与抵御；天祚帝时又与牛温舒出使北宋，交涉西夏与宋朝的边事。此后金兵深入，天祚帝西走夹山，辽廷分崩，其后期事迹史载零散。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0315
    name: 耶律涅里
    avatar: monkey_wen_male9.png
    default_gender: male
    archetype: civil
    flavor: 耶律涅里，又名泥礼、泥里，唐中期契丹迭剌部首领。735年他起兵杀李过折，拥立迪辇俎里为阻午可汗，自任夷离堇，整顿部落、建立制度，并曾与唐军交战；此后迭剌部世掌契丹兵马，涅里为辽太祖耶律阿保机的八世祖。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0316
    name: 张孝杰
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 张孝杰，辽朝汉臣，重熙二十四年（1055）进士第一，累官北府宰相。大康初年，他与权臣耶律乙辛结党，借《十香词》诬称伶人赵惟一与懿德皇后萧观音私通，又构陷太子耶律濬，致其被废遇害；乙辛失势后，张孝杰以党羽被贬，史料对其评价多有争议。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0317
    name: 耶律俨
    avatar: monkey_wen_male1.png
    default_gender: male
    archetype: civil
    flavor: 耶律俨（？—1113），字若思，本姓李，辽朝析津府人，咸雍进士。他历仕道宗、天祚帝两朝，官至知枢密院事，主持修《皇朝实录》七十卷，此书后为元人修《辽史》的重要依据；道宗临终受顾命辅佐天祚帝，晚年与萧奉先结党。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0319
    name: 李德明
    avatar: pig_wu_male9.png
    default_gender: male
    archetype: military
    flavor: 李德明（981—1032），党项首领，李继迁之子、李元昊之父。他同时向宋、辽称臣，受宋封西平王、辽封夏国王，并娶辽宗室女；景德年间与宋议和，得岁赐与互市之利，又遣军西向取甘州，营建兴州城，扩张部众与疆域，为西夏建国奠定基础。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0320
    name: 李谅祚
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: 李谅祚（1047—1068），西夏毅宗，在位约二十年。生仅周岁即即位，母没藏太后、舅没藏讹庞摄政；亲政后诛没藏讹庞，改蕃礼为汉礼，增置汉人官职，并立梁氏为后。拱化四年（1066）攻宋大顺城时中流矢，越二年（1068，拱化五年十二月）伤重而卒。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0321
    name: 野利仁荣
    avatar: monkey_wen_male6.png
    default_gender: male
    archetype: civil
    flavor: 野利仁荣（？—1042），西夏开国重臣，党项野利部人，与野利遇乞同族。李元昊谋议称帝时，他参与制定典章，主持创制西夏文字；新字仿汉字形体而另创笔画，颁行后用于公文与佛经翻译。他设蕃学、译汉籍，官至谟宁令，先追赠富平侯，后追赠广惠王。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0322
    name: 李乾顺
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: 李乾顺（1083—1139），西夏崇宗，惠宗李秉常之子，三岁即位，在位五十四年。幼年由小梁太后摄政，亲政后清除梁氏势力，并娶辽宗室女为后；他设立国学、崇尚儒学，辽亡后又转而附金，在宋、辽、金之间周旋，使西夏维持稳定。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0323
    name: 李仁孝
    avatar: pig/文011.png
    default_gender: male
    archetype: civil
    flavor: 李仁孝（1124—1193），西夏仁宗，崇宗李乾顺之子，在位五十四年。他尊孔子为文宣帝，设学校、开科取士，又颁行《天盛改旧新定律令》，推动法制与文教；对外与金修好，边境相对安定，在位期间又经历任得敬分国之谋。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0324
    name: 任得敬
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: 任得敬（？—1170），原宋朝西安州官吏，降西夏后献女入宫，以外戚与军功得势，官至国相，封楚王、加太师。乾祐元年（1170）他逼仁宗李仁孝分国，并求金朝册立，金世宗拒绝；阴谋败露后，任得敬及其党羽被诛。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0325
    name: 李安全
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: 李安全（？—1211），西夏襄宗。1206年他废黜桓宗李纯祐自立，改元应天；在位时蒙古崛起，成吉思汗围中兴府，引黄河水灌城，因堤决而退兵。他曾向金求援未得，转而向蒙古纳女请和；后被齐王李遵顼废黜，不久去世。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0326
    name: 李遵顼
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: 李遵顼（1163—1226），西夏神宗，西夏少有的状元皇帝。天庆十年（1203）他廷试第一，后废襄宗自立，改元光定；在位时附蒙古攻金，与金朝连年交兵，又遭蒙古进攻，屡战失利，国力大损；光定十三年（1223）退位为太上皇，三年后去世。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0327
    name: 李睍
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: 李睍（？—1227），西夏末帝，西夏宗室。1226年献宗李德旺去世后即位，改元宝义，在位仅约一年；时蒙古大军已深入河西，诸城相继失守，中兴府被围数月，粮尽援绝。他仍据城坚守，最终出降，旋被蒙古处死，西夏灭亡。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0328
    name: 嵬名安惠
    avatar: pig/武076.png
    default_gender: male
    archetype: military
    flavor: 嵬名安惠，西夏皇族。西夏皇族本出党项拓跋氏，唐赐姓李，元昊又改姓嵬名；安惠以宗室身份历仕毅宗、惠宗、崇宗三朝，是西夏中前期地位显赫的宗室重臣，官至尚父、太师、尚书令、知枢密院事，封梁国正献王，死后陪葬西夏皇陵。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0329
    name: 斡道冲
    avatar: pig_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: 斡道冲（？—1183），西夏仁宗时期重臣、学者，精通儒学。他早年以儒术入仕，官至中书令，参与法典与文教建设，曾译介汉文经籍，著有《论语小义》《周易卜筮断》等；又敢于直谏，反对任得敬分国，乾祐十四年去世。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0330
    name: 李秉常
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: 李秉常（1061—1086），西夏惠宗，毅宗李谅祚之子，七岁即位，在位十九年。生母梁太后与舅梁乙埋摄政，梁氏长期掌政并对宋用兵；元丰四年宋军五路伐夏，次年永乐城一战宋军大败。秉常成年后谋亲政被囚，后虽复位，忧愤而终。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0331
    name: 梁太后
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: 梁太后（？—1085），西夏毅宗李谅祚皇后、惠宗李秉常生母，即大梁太后。惠宗年幼即位，她与弟梁乙埋摄政，梁氏一门掌权近二十年，屡次对宋用兵；元丰四年灵州、五年永乐城两战均重创宋军，后又幽禁谋求亲政的李秉常。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0332
    name: 没藏讹庞
    avatar: pig/武076.png
    default_gender: male
    archetype: military
    flavor: 没藏讹庞（生卒不详），西夏国相、权臣，没藏太后之兄。李元昊死后，他辅佐幼主李谅祚，以国相身份专政十余年，权倾朝野，并将女儿立为皇后；后其子妇梁氏与李谅祚私通，告发他谋反，讹庞及其党羽被诛，梁氏后来成为皇后。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0333
    name: 野利遇乞
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
