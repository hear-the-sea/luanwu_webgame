    default_gender: male
    archetype: military
    flavor: （？-1211年）西夏襄宗，弑君篡位者。他发动政变夺取皇位，但在蒙古入侵时表现软弱。他的统治加速了西夏的衰落。李安全所面对的并非单纯兵力对抗，还包括补给、地理与盟友稳定性的复合压力。因此，后人得以超越战果表层，观察组织效率、情报条件与统治目标之间如何相互制约。
