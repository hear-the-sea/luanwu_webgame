    default_gender: male
    archetype: military
    flavor: （1061年-1086年）西夏惠宗，幼年即位的皇帝。他母亲梁太后摄政，与宋朝关系紧张。他试图亲政却被软禁，抑郁而终。李秉常所处权力结构并不线性清晰，其关键选择通常受多方博弈共同塑造。这类个案对理解王朝治理节奏与政策传导损耗，提供了可操作的比较坐标。
