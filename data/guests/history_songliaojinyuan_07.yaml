    flavor: （1163年-1226年）西夏神宗，西夏末期皇帝。他是中国历史上唯一的状元皇帝，却在位期间与蒙古反复交战，国力大损。这位“状元天子”在强敌压境下屡作高风险决断，其成败常被视作西夏晚期制度韧性的集中检验。
