    archetype: military
    flavor: 西夏宗室重臣。嵬名氏为西夏皇族之姓。西夏末年蒙古大举南侵，嵬名安惠率部力战不屈。其忠勇为时人所称。然传世文献对其官职、战历及最终结局均付阙如，仅知其于国难之际挺身抗敌，姓名因抗蒙事迹得以留存。
