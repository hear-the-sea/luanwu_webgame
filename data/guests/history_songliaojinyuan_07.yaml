    default_gender: male
    archetype: military
    flavor: 西夏末帝。公元1226年兄献宗惊惧而卒，李睍继位于危亡之际。次年成吉思汗大军围中兴府，李睍据城死守半载，粮尽援绝。1227年七月城破出降，旋为蒙古所杀，西夏遂亡。其即位不足两年，于国运倾颓之际勉力支撑，终难挽狂澜。西夏亡后典籍散佚，其生平细节多不可考。
