heroes:
  purple:
  - key: hist_songliaojinyuan_0036
    name: 包拯
    default_gender: male
    archetype: civil
    flavor: （999年-1062年）铁面无私辨忠奸，龙图阁里青天在。他是开封府的传奇，是清官的代名词。他不畏权贵，弹劾外戚张尧佐；他明察秋毫，断案如神。他的故事被编成戏曲，成为家喻户晓的"包青天"。他用一生证明：公正与正义，是为官者永恒的追求。
    growth_range:
    - 7
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0037
    name: 范仲淹
    default_gender: male
    archetype: civil
    flavor: （989年-1052年）先天下之忧而忧，后天下之乐而乐。他是北宋最杰出的政治家、文学家、军事家。庆历新政虽然短命，却开启了改革的先声。他镇守西北，令西夏不敢南望。一篇《岳阳楼记》，道尽了士大夫的家国情怀与人生境界。他是文武全才，更是士人楷模。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0038
    name: 司马光
    default_gender: male
    archetype: civil
    flavor: （1019年-1086年）二十年磨一剑，终成《资治通鉴》。他是北宋最伟大的史学家，用一部三百余万字的史书警醒后世君王。他与王安石政见不同，新旧党争贯穿其政治生涯。他砸缸救友的故事千古流传，展现了他从小就具有的果敢与智慧。他以史为鉴，为后世留下了宝贵的政治遗产。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0039
    name: 欧阳修
    default_gender: male
    archetype: civil
    flavor: （1007年-1072年）六一居士，北宋文坛的盟主。他倡导古文运动，提携苏轼、曾巩等后辈，影响了一代文风。《醉翁亭记》醉翁之意不在酒，《秋声赋》写尽人生萧瑟。他是唐宋八大家之一，更是北宋文化繁荣的推动者。他主持编纂《新唐书》《新五代史》，为后世留下珍贵史料。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0040
    name: 辛弃疾
    default_gender: male
    archetype: civil
    flavor: （1140年-1207年）醉里挑灯看剑，梦回吹角连营。他是词中之龙，豪放派的又一座高峰。他年少时带领五十骑闯入金营，生擒叛将，何等英雄！可惜南渡之后，壮志难酬，只能把满腔热血化作六百余首词章。众里寻他千百度，蓦然回首，那人却在灯火阑珊处。他是词人，更是失意的英雄。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0041
    name: 狄青
    default_gender: male
    archetype: military
    flavor: （1008年-1057年）面涅将军，北宋最传奇的武将。他出身行伍，脸上刺有囚犯印记，却凭借战功一路升至枢密使。他平定侬智高之乱，夜袭昆仑关，威震南疆。他打破了北宋重文轻武的传统，证明武将同样可以出将入相。可惜功高震主，最终郁郁而终。
    growth_range:
    - 6
    - 12
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0042
    name: 寇准
    default_gender: male
    archetype: civil
    flavor: （961年-1023年）北宋第一硬骨头，澶渊之盟的缔造者。辽军南侵，朝廷惶恐，唯有他力主亲征，最终促成宋真宗御驾北上。澶渊城下，他运筹帷幄，与辽国达成百年和约。他刚正不阿，直言敢谏，三起三落而本色不改。他用行动证明：大臣的风骨，可以撑起一个王朝的脊梁。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0043
    name: 赵光义
    default_gender: male
    archetype: military
    flavor: （939年-997年）宋太宗，北宋第二位皇帝。他在"烛影斧声"之谜中登基，却用二十二年的统治完成了兄长未竟的统一大业。他灭北汉，攻幽州，虽有高梁河之败，却奠定了北宋的基本版图。他重文轻武，扩大科举，确立了宋朝的文治传统。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0044
    name: 赵祯
    default_gender: male
    archetype: civil
    flavor: （1010年-1063年）宋仁宗，北宋在位最长的皇帝。他在位四十二年，创造了"仁宗盛治"。他宽厚仁慈，与士大夫共治天下，培养了包拯、范仲淹、欧阳修等一代名臣。他死后，就连辽国皇帝也为之落泪。他是中国历史上最符合"仁"字的皇帝。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0046
    name: 柳永
    default_gender: male
    archetype: civil
    flavor: （约984年-约1053年）凡有井水处，皆能歌柳词。他是北宋最受欢迎的词人，却仕途坎坷，自称"奉旨填词柳三变"。他的词婉约缠绵，深入市井，开创了慢词创作的新天地。杨柳岸晓风残月，道尽了他一生的漂泊与柔情。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0047
    name: 黄庭坚
    default_gender: male
    archetype: civil
    flavor: （1045年-1105年）苏门四学士之一，江西诗派开创者。他与苏轼并称"苏黄"，书法与苏轼、米芾、蔡襄并称"宋四家"。他的诗追求瘦硬奇崛，自成一派。他的书法更是独树一帜，影响深远。其诗书并重，开宋代文人风骨之新境。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0049
    name: 韩琦
    default_gender: male
    archetype: civil
    flavor: （1008年-1075年）北宋名将名相，与范仲淹齐名。他镇守西北多年，使西夏不敢东犯，军民称"韩范"。他后来入朝为相，历仕三朝，是北宋政坛的定海神针。其军政兼擅，堪称北宋治边之柱石。其名望深重，能安定朝野人心。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0050
    name: 赵普
    default_gender: male
    archetype: civil
    flavor: （922年-992年）宋初名相，辅佐赵匡胤统一天下。他策划陈桥兵变，参与杯酒释兵权，是北宋开国的首席功臣。他自称"半部论语治天下"，虽有自夸之嫌，却也展现了治国理政的才能。其权衡功过仍受史家反复评议，影响深远。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0052
    name: 赵佶
    default_gender: male
    archetype: civil
    flavor: （1082年-1135年）宋徽宗，艺术家皇帝。他创制瘦金体，工笔花鸟独步天下，书画成就冠绝历代帝王。可惜他沉溺艺术，荒废政事，任用蔡京等奸臣，终致靖康之耻。他是杰出的艺术家，却是失败的皇帝。其文化成就与政治失误形成强烈反差，史论不绝。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0059
    name: 杨业
    default_gender: male
    archetype: military
    flavor: （约932年-986年）杨家将始祖，人称"杨无敌"。他原是北汉将领，归宋后成为抗辽前锋。他屡败辽军，令敌人闻风丧胆。陈家谷之战，他孤军奋战，最终被俘绝食而死，忠烈传家，成为杨家将故事的源头。其忠勇形象被后世演绎为民族英雄的典范。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0060
    name: 杨延昭
    default_gender: male
    archetype: military
    flavor: （958年-1014年）杨六郎，杨业之子。他镇守三关二十余年，令辽人胆寒。他继承父志，守卫边疆，是杨家将第二代的杰出代表。他的事迹被后世演绎，成为忠义报国的象征。其守边之功，使宋辽边境长期相对安定。其忠勇事迹在民间故事中代代流传。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0065
    name: 秦观
    default_gender: male
    archetype: civil
    flavor: （1049年-1100年）苏门四学士，婉约派词人。两情若是久长时，又岂在朝朝暮暮——他的词凄婉动人，情深意切。他与苏轼亦师亦友，却命运多舛，一生坎坷。他的词作虽不多，却篇篇精品。其情感深度与词法精巧，后世推为婉约典范。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0076
    name: 韩世忠
    default_gender: male
    archetype: military
    flavor: （1089年-1151年）中兴四将之首，黄天荡的英雄。他与金兀术对峙四十八天，以八千水军围困十万金兵。他的妻子梁红玉擂鼓助战，成为千古佳话。他忠心耿耿，岳飞被害时他怒斥秦桧："莫须有何以服天下？"他是南宋的擎天柱，是忠义的化身。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0077
    name: 陆游
    default_gender: male
    archetype: civil
    flavor: （1125年-1210年）位卑未敢忘忧国，事定犹须待阖棺。他一生写诗九千余首，是中国最高产的诗人之一。他渴望北伐收复中原，却壮志难酬，只能把满腔悲愤化作诗篇。死去元知万事空，但悲不见九州同——临终遗言，道尽了他一生的遗憾与执念。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0078
    name: 李清照
    default_gender: female
    archetype: civil
    flavor: （1084年-1155年）千古第一才女，婉约词宗。她早年与赵明诚琴瑟和鸣，"争渡争渡，惊起一滩鸥鹭"何等欢快。国破家亡后，"寻寻觅觅，冷冷清清，凄凄惨惨戚戚"道尽人间愁苦。她的词，是宋词婉约一派的最高峰，是女性文学的永恒丰碑。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0079
    name: 赵构
    default_gender: male
    archetype: military
    flavor: （1107年-1187年）宋高宗，南宋开国皇帝。他在靖康之变后南渡，建立南宋政权，延续宋祚一百五十年。他偏安江南，杀害岳飞，为后人所诟病。但他在乱世中保存了汉族政权，为中华文化的延续作出了贡献。功过是非，至今仍有争议。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0080
    name: 秦桧
    default_gender: male
    archetype: civil
    flavor: （1091年-1155年）南宋权相，千古罪人。他主持绍兴和议，以"莫须有"之罪杀害岳飞。他专权十九年，打压主战派，推行投降路线。他跪在岳飞墓前的铁像，承受着后人的唾骂。他虽是反面人物，却是了解南宋历史绑不开的关键人物。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0083
    name: 吴玠
    default_gender: male
    archetype: military
    flavor: （1093年-1139年）川陕抗金名将，和尚原、仙人关大捷的创造者。他镇守西南，多次击败金军，保住了四川这一战略后方。他与弟弟吴璘并称"二吴"。其守蜀功劳卓著，为南宋稳固后方立下大功。其功绩使西南长期免受大规模战祸。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0067
    name: 邵雍
    default_gender: male
    archetype: civil
    flavor: （1011年-1077年）北宋理学家，易学大师。他创立先天易学，以数理解释宇宙变化。他隐居苏门山，不求仕进，专心学问。他的《皇极经世》对后世易学影响深远。其数理体系被后世视为易学重要分水岭。其学说影响宋明易学发展方向。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0064
    name: 晏殊
    default_gender: male
    archetype: civil
    flavor: （991年-1055年）北宋宰相，婉约词的重要代表。无可奈何花落去，似曾相识燕归来——他的词雍容华贵，充满富贵气象。他主政时期，提携了范仲淹、欧阳修等后辈，对北宋文化繁荣功不可没。其词风与政声相映，成为宋代士大夫典范。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0081
    name: 孟珙
    default_gender: male
    archetype: military
    flavor: （1195年-1246年）南宋晚期最杰出的名将，灭金的功臣。他联蒙灭金，亲率宋军攻入蔡州，俘获金哀宗尸骨。他又转而抗蒙，在京湖战区建立防线，多次击退蒙军。他是儒将典范，能文能武，被誉为"机动防御大师"。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0086
    name: 梁红玉
    default_gender: female
    archetype: military
    flavor: （1102年-1135年）女中豪杰，韩世忠之妻。黄天荡之战，她亲自擂鼓助战，激励士气。她是中国历史上著名的巾帼英雄，与穆桂英齐名。其勇毅与胆识使其成为南宋抗金的精神象征。其事迹被后世赞为妇女参战的典范。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0048
    name: 富弼
    default_gender: male
    archetype: civil
    flavor: （1004年-1083年）北宋名相，三朝元老。他与范仲淹共同主持庆历新政，是北宋政坛的中流砥柱。他出使辽国，据理力争，维护了国家尊严。他为官清廉，政声卓著，是北宋名相的典范。其稳健持重，为朝廷提供了长期稳定的支撑。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0051
    name: 王旦
    default_gender: male
    archetype: civil
    flavor: （957年-1017年）北宋名相，与寇准并称。他宽厚谦和，善于用人，是宋真宗时期的贤相。他与寇准政见不同，却能相互尊重，共同维护朝廷稳定。其调和之功，使政局少有震荡，被视为良臣典范。其稳健作风为宋初政治留下良好范式。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 12
      intellect: 58
      defense: 18
      agility: 12
  - key: hist_songliaojinyuan_0061
    name: 种师道
    default_gender: male
    archetype: military
    flavor: （1051年-1126年）种家军领袖，抗金名将。他主张抗金，反对议和。开封保卫战中，他率军力战，最终忧愤而死。他是北宋末年少有的清醒之士。其主战立场与忠烈精神，为后世所传颂。其家国情怀成为将门精神的代表。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  - key: hist_songliaojinyuan_0082
    name: 刘锜
    default_gender: male
    archetype: military
    flavor: （1098年-1162年）南宋抗金名将，顺昌大捷的英雄。他以两万兵力大败金兀术十万大军，创造了以少胜多的奇迹。他用兵如神，令金人闻风丧胆。其胜利极大振奋南宋军心，被视为中兴战绩之一。其用兵胆略为后世将帅所称道。
    growth_range:
    - 6
    - 11
    attribute_weights:
      force: 42
      intellect: 18
      defense: 24
      agility: 16
  blue:
  - key: hist_songliaojinyuan_0084
    name: 吴璘
    default_gender: male
    archetype: military
