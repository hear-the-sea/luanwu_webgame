heroes:
  blue:
  - key: hist_xianqin_0366
    name: 曹刿
    avatar: monkey/其他随机角色/文男.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）春秋鲁国谋士。齐军攻鲁时，曹刿认为当政者目光短浅，主动求见鲁庄公，提出取信于民方可一战。长勺之战中，他建议待齐军三次击鼓、士气衰竭后再反击，鲁军因此大胜；追击前他又观察车辙和军旗，确认齐军不是诈败才下令前进。曹刿论战以“一鼓作气”之说闻名后世，是古代以弱胜强的经典战例。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 28
      defense: 20
      agility: 16
  - key: hist_xianqin_0390
    name: 姬诵
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （？—约前1021年）西周成王，周武王之子。他年幼即位，由叔父周公旦摄政；周公东征平定三监之乱，营建洛邑，稳定了周初局势，随后还政于成王。成王亲政后主持祭祀与诸侯会盟，延续分封制度，与子康王时期合称“成康之治”。他晚年将政务交给太子钊。成王处于周朝由草创走向稳固的阶段，其治世被视为西周盛世的开端。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 36
      intellect: 22
      defense: 24
      agility: 18
  - key: hist_xianqin_0397
    name: 姬静
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （？—前782年）西周宣王，名静。国人暴动后，他在召穆公等人保护下长大，共和行政结束后即位。宣王任用仲山甫、尹吉甫等大臣，出兵征伐猃狁、淮夷，一度重振周室声威，史称“宣王中兴”。晚年因千亩之战败于姜氏之戎，周军损失惨重，对外征伐也渐露疲态。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 18
      defense: 24
      agility: 18
  - key: hist_xianqin_0398
    name: 姬宫涅
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: military
    flavor: （？—前771年）西周幽王，名宫涅。他在位时宠爱褒姒，废黜申后和太子宜臼，改立褒姒之子伯服，动摇了王室与申国的关系。申侯随后联合犬戎攻入镐京，诸侯未能及时救援，幽王死于骊山，西周灭亡。后世流传的“烽火戏诸侯”故事对其亡国原因作了戏剧化解释，但细节多属后出传说，难以完全视为史实。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 34
      intellect: 18
      defense: 26
      agility: 22
  - key: hist_xianqin_0399
    name: 姬宜臼
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （？—前720年）东周平王，名宜臼，周幽王之子。幽王死后，他在申侯、郑武公、晋文侯等诸侯支持下即位，并将都城从镐京东迁洛邑，东周由此开始。东迁后，王室控制的土地和兵力大为缩减，对诸侯约束力下降。他在位后期又因政务与郑国产生嫌隙，双方一度交换人质，王室威信进一步受损。平王时期是周王室由盛转衰的转折点。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 32
      intellect: 22
      defense: 26
      agility: 20
  - key: hist_xianqin_0370
    name: 叔孙豹
    avatar: pig/文016.png
    default_gender: male
    archetype: civil
    flavor: （？—前538年）春秋鲁国大夫，叔孙氏宗主，名豹。他出使晋国时，范宣子问何为“死而不朽”，叔孙豹以“立德、立功、立言”作答，认为唯有这三种成就能使声名长久流传，此说成为后世“三不朽”的出处。他在鲁国任职期间，多次参与鲁国与晋、齐等国的外交事务，是春秋后期鲁国重要的卿大夫之一。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0381
    name: 孟姜
    avatar: monkey/其他随机角色/文078_女.png
    default_gender: female
    archetype: civil
    flavor: （生卒年不详）春秋齐国大夫杞梁之妻，姓名失传，后世称孟姜。杞梁随齐庄公伐莒战死后，她迎丧于郊；齐庄公欲在郊外吊唁，她以郊吊非礼为由拒绝，庄公最终依礼改吊于其家。后世将她的故事不断敷演，逐渐与哭倒城墙、秦代修长城等传说合流，形成“孟姜女哭长城”的民间叙事。史籍所载的孟姜与后世传说已有很大距离。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 8
      intellect: 54
      defense: 22
      agility: 16
  - key: hist_xianqin_0383
    name: 柳下惠
    avatar: pig/文039.png
    default_gender: male
    archetype: civil
    flavor: （约前720年—前621年，一说生卒年不详）春秋鲁国大夫，展氏，名获，字禽，食邑柳下，谥惠，故称柳下惠。据《论语》记载，他担任士师时多次被罢免，却不肯离开鲁国，认为以正道事人，到哪里都难免被罢黜。后世还流传他寒夜收留受冻女子、以衣裹坐而不失礼的故事，“坐怀不乱”即由此而来，但此事多属传说。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
  - key: hist_xianqin_0386
    name: 武庚
    avatar: monkey/其他随机角色/武047_男.png
    default_gender: male
    archetype: military
    flavor: （？—约前1039年）商纣王之子，名武庚，又称禄父。周武王灭商后，为安抚殷遗民，封他于殷地主持商王祭祀，并派管叔、蔡叔、霍叔就近监视。武王去世、周公摄政后，武庚联合三监与东夷诸部起兵反周。周公东征三年平定叛乱，武庚兵败被杀，殷遗民则被迁往他处安置。这场叛乱促使周朝调整分封格局，加强了对东方的控制。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 40
      intellect: 16
      defense: 26
      agility: 18
  - key: hist_xianqin_0395
    name: 共伯和
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西周晚期共国国君，一说是诸侯。周厉王因国人暴动出奔后，太子静年幼，共伯和受诸侯推举主持朝政，与召穆公等人共同维持王室运转，史称“共和行政”。十四年后厉王去世，太子静即位为周宣王，共伯和还政退居。关于共和行政究竟由共伯和一人摄政，还是由周、召二公共同执政，古籍记载不一，后世仍有争论。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 10
      intellect: 56
      defense: 20
      agility: 14
