    flavor: （生卒年不详）季氏家臣，名虎，曾一度“陪臣执国命”。他借季平子死后的空隙掌权，甚至反过来挟制季氏，成为鲁国政局的幕后主事者。阳货想拉孔子入局，孔子以礼周旋却不肯真正投靠；《论语》中那场送豚、避见、途中相逢的记载，颇有几分官场短兵相接的意味。后来政变失败，他出奔，专权终究没能熬过自己的孤立。
