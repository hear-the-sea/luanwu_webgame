    default_gender: male
    archetype: civil
    flavor: （生卒年不详）召公虎，召公奭后裔，周室重臣。国人暴动时，传统叙事说他以自己的儿子替换太子静，护太子逃过搜捕；厉王出奔后，他又与周定公等主持共和，维持王室运转。召公藏太子的故事带有后世忠烈叙事的光泽，具体细节未必尽可考，但召氏护周、辅政的家族传统确实延续甚久。乱世护住一个孩子，有时就是护住一顶王冠。
