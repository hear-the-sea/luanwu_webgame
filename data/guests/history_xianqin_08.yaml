    flavor: （?—前481年）孟懿子，名何忌，鲁国三桓之一孟氏宗主。关于“孝”，他先后向孔子与樊迟追问，得到的不是一句只供堂上悬挂的漂亮话，而是“生事之以礼，死葬之以礼，祭之以礼”的具体功课。孟懿子未必是孔门弟子，却愿向一位不掌兵权的士人请教政教，这场问答也说明孔子的影响已越过学舍，进入卿大夫的家门。
