    default_gender: male
    archetype: military
    flavor: （?—约前977年）周昭王，名瑕。成康盛世之后，他多次南征荆楚，周王室的军事触角因此伸长，也消耗了相当国力。末次南巡渡汉水而不返，关于“胶船解体”等细节多带传说色彩，较稳妥的史实只是昭王及军队在南方覆没。天子死于远征，周室威望随之受损；从这一回南征开始，盛世的剑锋明显钝了。
