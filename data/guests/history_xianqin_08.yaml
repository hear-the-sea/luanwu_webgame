    flavor: （生卒年不详）鲁庄公时的将领，屡败于齐，却在柯地会盟时把败局扳回一寸。曹沫以兵刃迫齐桓公答应归还鲁国失地，管仲随后劝桓公守约，齐国才履行盟誓。以武劫盟并非正道，却确实让鲁国收回了土地；《史记》将他写入刺客传统，后世又有人疑其与曹刿为一人。名号相近，故事相连，身份仍当保留疑问。
