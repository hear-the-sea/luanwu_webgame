    default_gender: male
    archetype: civil
    flavor: （?—前492年）季桓子，名斯，季平子之子，鲁国实际执政者。齐国送来女乐，季桓子沉溺其中，数日不朝；孔子见政事与祭礼皆被怠慢，遂离鲁周游。女乐故事经过《论语》传播，未必能解释全部政治原因，但季桓子确实让季氏的私门权力压过了公室与礼制。歌舞散后，孔子的车已在城外，鲁国也少了一位愿意整顿它的人。
