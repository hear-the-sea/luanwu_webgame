  - key: hist_xianqin_0351
    name: 子特
    default_gender: male
    archetype: military
    flavor: （?—前469年）宋昭公，名特，春秋末年的宋国君主。宋国承殷商之后，礼制声名尚在，国势却被卿族内争一点点掏空；昭公即位时面对的，已不是先祖那座稳固的宗庙。关于他被弑的具体经过，史籍叙述有简有繁，结局却很清楚：公室再一次败给了臣下的刀。子特的一生没有留下横扫诸侯的战绩，却留下了小国君位如何失去凭借的冷峻注脚。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 18
      defense: 26
      agility: 20
  - key: hist_xianqin_0352
    name: 子田
    default_gender: male
    archetype: military
    flavor: （?—前396年）宋悼公，名田，处在春秋旧秩序退潮、战国强国竞逐的门槛上。宋国没有足以左右天下的兵锋，只能在齐、楚、魏等大国之间保存宗社；他的治国更像稳住船舷，而非挥剑开疆。史料对其政绩着墨不多，正好说明守成之君的难处：不犯大错已属本领，可小国的风浪从来不肯因此停手。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 18
      defense: 26
      agility: 20
  - key: hist_xianqin_0353
    name: 子偃
    default_gender: male
    archetype: military
    flavor: （?—前286年）宋康王，名偃，宋国末代君主。早年扩张颇有声势，后来自称“天子”，对内严酷、对外频战，把一个本就夹在强邻之间的宋国推成众矢之的。齐、楚、魏等国合兵伐宋，国都被破，康王出奔而死，宋国遂亡。“桀宋”的恶名带有后世评判，却不能抹掉一个事实：小国若把每一次胜仗都当成天命，最后连退路也会一并烧掉。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 38
      intellect: 14
      defense: 26
      agility: 22
  - key: hist_xianqin_0354
    name: 唐成公
    default_gender: male
    archetype: military
    flavor: （生卒年不详）唐国君主，周武王弟唐叔虞之后。唐国据汉水、淮水之间，既有宗周血统，又必须面对楚国日益逼近的兵锋；成公能做的，多半是凭盟约、婚姻与地势为国家争一口气。关于他个人的施政记载很少，唐国后来为楚所灭却是大势所归。诸侯谱牒写着尊贵的姓氏，战国式的强弱秤一落下来，小国仍难逃被收走棋子的命运。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 16
      defense: 28
      agility: 20
  - key: hist_xianqin_0355
    name: 姬捷
    default_gender: male
    archetype: military
    flavor: （?—前628年）郑文公，名捷，郑厉公之子，在位四十余年。郑庄公留下的“小霸”声势到他手中已难复旧观，郑国只能在晋、楚之间反复衡量，借摇摆换取喘息。重耳流亡经过郑国时未获礼遇，后来晋文公伐郑，旧日的失礼被重新算账。文公没有把郑国推成霸主，却在大国夹击中守住了相当长的国祚；小国之君，有时最难的功课就是不被巨浪卷走。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 20
      defense: 26
      agility: 20
  - key: hist_xianqin_0356
    name: 姬兰
    default_gender: male
    archetype: military
    flavor: （?—前606年）郑穆公，名兰，郑文公之子。穆公在位时政局尚称平稳，却留下了影响郑国数代的另一份遗产：诸公子分封成家，后裔发展为“七穆”，驷、罕、国、良、印、游、丰诸族由此轮流执掌朝政。公室一时多子多福，后来却也多了几把分权的刀。子产出自七穆，郑国卿族政治的根芽，正从穆公家门悄悄长出。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 18
      defense: 26
      agility: 20
  - key: hist_xianqin_0357
    name: 姬赤
    default_gender: male
    archetype: military
    flavor: （?—前660年）卫懿公，名赤，后世最常以“好鹤”称之。传说他给鹤以车服俸禄，贵族得宠而百姓失望；狄人攻卫时，士卒不愿为这套荒唐秩序卖命，懿公战死，卫国几近覆亡。好鹤故事经过寓言化，却抓住了君主把玩物置于军民之上的要害。鹤不会披甲上阵，宠鹤的君王却要为它付出国运。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 16
      defense: 26
      agility: 24
  - key: hist_xianqin_0358
    name: 姬衎
    default_gender: male
    archetype: military
    flavor: （?—前544年）卫献公，名衎，曾两度登上卫君之位。即位后与孙林父、宁殖等卿族交恶，终于被逐出国，在外流亡十二年；后来借卫国内部变化复归。复辟并没有让旧秩序原样复生，卿族已尝过左右君主的滋味，公室也再难恢复从前的威势。献公的经历像一场漫长的宫门折返：王冠可以失而复得，权力的缰绳却未必还在手中。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 18
      defense: 26
      agility: 20
  - key: hist_xianqin_0359
    name: 姬元
    default_gender: male
    archetype: military
    flavor: （?—前493年）卫灵公，名元，在位四十余年。卫国政局并非全无可取之处，蘧伯玉、史鱼等贤者得以立身，孔子也曾多次至卫问政；但灵公的家事与用人同样留下阴影。南子与宋国公子朝的关系，史书有流言与记载，太子蒯聩因此谋刺生母，卫国随后陷入父子争位。把一国风波全归咎于一名女子并不公允，灵公本人对宫廷秩序的失控也难辞其咎。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 20
      defense: 26
      agility: 20
  - key: hist_xianqin_0360
    name: 姬辄
    default_gender: male
    archetype: military
    flavor: （?—前456年）卫出公，名辄，蒯聩之子。父亲出奔后，他被立为君；蒯聩归国，又要从儿子手中夺回君位，卫国遂陷入反复的废立与流亡。孔门弟子子路在护卫孔悝时死于这场内乱，临终仍要扶正冠缨。出公未必是最有力量的那个人，却被夹在父子名分与卿族兵权之间，一生都像站在两把相向的剑中间。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 18
      defense: 26
      agility: 22
  - key: hist_xianqin_0361
    name: 蒯聩
    default_gender: male
    archetype: military
    flavor: （?—前478年）卫灵公太子，名蒯聩。南子与公子朝的传闻使他羞愤交集，他试图刺杀生母，事败后逃往晋国。灵公死后，蒯聩的儿子辄继位；他不甘失去君位，终于返卫与儿子相争。这场冲突既有宫廷伦理的裂痕，也有晋国与卫卿介入的权力盘算。蒯聩夺回王座，却把父子之名一并撕裂。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 38
      intellect: 16
      defense: 26
      agility: 20
  - key: hist_xianqin_0362
    name: 南子
    default_gender: female
    archetype: civil
    flavor: （?—前478年）卫灵公夫人，宋国公主。关于她与宋国公子朝的关系，史书留下了暧昧传闻与后世议论，却不能只用“祸水”二字盖棺。太子蒯聩因母亲的名声与宫廷权力冲突而谋刺，孔子访卫时又曾应她之召，遂留下“见南子”的著名公案。南子既是后宫人物，也是卫国外交与继承秩序的交汇点；真正失控的，是一整套权力关系，而非一个女人的容貌。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 52
      defense: 22
      agility: 18
  - key: hist_xianqin_0363
    name: 子朝
    default_gender: male
    archetype: military
    flavor: （生卒年不详）宋国公子，名朝。卫灵公时期，他与南子的交往被史家写成宫闱丑闻，究竟是私情、政治往来还是后人重笔，今已难全然厘清。可以确定的是，这段传闻牵动了太子蒯聩的继承焦虑，最终引出刺母、出奔与父子争位。公子朝没有挥军攻城，却以一段未必说得清的关系，落在卫国数十年风波的引线旁。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 16
      defense: 26
      agility: 22
  - key: hist_xianqin_0364
    name: 姬息姑
    default_gender: male
    archetype: military
    flavor: （?—前712年）鲁隐公，名息姑，鲁惠公庶子。惠公死后，嫡子允年幼，息姑代行国政，本有待弟弟长成后归还君位之意；可公子翚担心权势旁落，借祭祀之机杀死了他。史书写这段旧事，既见“让国”的礼让，也见宗法继承在权臣手里变成了夺命机关。隐公没有败在战场，却败在把人心看得过于温厚。
