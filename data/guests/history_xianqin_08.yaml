  - key: hist_xianqin_0351
    name: 子特
    avatar: monkey/其他随机角色/武044_男_.png
    default_gender: male
    archetype: military
    flavor: （？—前469年）子特，宋昭公，春秋末宋国君主。《史记·宋微子世家》记其为公孙周之子，养于公宫，后继位为君。宋国都商丘，为殷商后裔封国；其在位时公室衰微，卿族势力强盛，君位继承多生变故，前469年宋国发生政变，昭公遇害。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 18
      defense: 26
      agility: 20
  - key: hist_xianqin_0352
    name: 子田
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （前395年—前373年）子田，宋休公，战国前期宋国君主。宋为殷商后裔封国，都于商丘。《史记·宋微子世家》对其在位仅存世系与卒年，未载具体政事。其时三家分晋已成，宋国夹在魏、韩之间，须在强邻环伺下维持社稷；宋国公室自春秋以来屡受卿族侵逼，权力继续旁落。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 18
      defense: 26
      agility: 20
  - key: hist_xianqin_0353
    name: 子偃
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: （？—前286年）子偃，宋康王，宋国末代君主，在位约四十年。他逐兄剔成君自立，后称王，曾东败齐、南败楚、西败魏，与列强结怨，诸侯称之为“桀宋”。连年用兵耗损国力，前286年齐湣王联合魏、楚伐宋，都城商丘陷落，偃出奔，死于温地，宋国灭亡。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 38
      intellect: 14
      defense: 26
      agility: 22
  - key: hist_xianqin_0354
    name: 唐成公
    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）唐成公，春秋唐国君主。唐国地处随枣走廊，是楚的附庸，国君常随楚军出征。前506年，他与蔡昭侯转而配合吴王阖闾伐楚，吴军五战入郢；次年楚在秦国援助下复国，唐国随即被楚吞并，成公事迹自此失载。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 16
      defense: 28
      agility: 20
  - key: hist_xianqin_0355
    name: 姬捷
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （？—前628年）姬捷，郑文公，郑厉公之子，在位约四十五年。郑国地处中原要冲，为晋、楚争霸所必争。前637年重耳流亡过郑，文公未以礼相待；城濮之战后郑国一度附晋，后又贰于楚，前630年晋、秦联军围郑，赖烛之武夜见秦伯说退秦师。后立公子兰为太子，即郑穆公。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 20
      defense: 26
      agility: 20
  - key: hist_xianqin_0356
    name: 姬兰
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （？—前606年）姬兰，郑穆公，郑文公之子。相传其母燕姞梦得兰草而生他，故以“兰”为名，事见《左传·宣公三年》。他在位时郑国夹于晋、楚之间，屡须周旋；其子孙此后形成“七穆”，罕、驷、良、游、国、印、丰七族长期分掌郑国政事。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 18
      defense: 26
      agility: 20
  - key: hist_xianqin_0357
    name: 姬赤
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: （？—前660年）姬赤，卫懿公，卫惠公之子。相传他好鹤成癖，给鹤加官进禄、以轩车载之，国人因此怨望。前660年狄人攻卫，国人受甲者称“使鹤，鹤实有禄位，余焉能战”，懿公率军迎战于荧泽，兵败身死，卫都朝歌陷落。遗民在宋、齐援助下东迁，另立戴公、文公。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 16
      defense: 26
      agility: 24
  - key: hist_xianqin_0358
    name: 姬衎
    avatar: monkey_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （？—前544年）姬衎，卫献公，卫定公之子。前559年，他因怠慢卿族孙林父、宁殖，被二人驱逐，出奔齐国；前547年在晋国与宁喜支持下复位，随即杀掉宁喜。孙氏、宁氏为卫国世卿，握有封邑与私兵，此后公室与卿族互相倾轧，君权日渐削弱。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 18
      defense: 26
      agility: 20
  - key: hist_xianqin_0359
    name: 姬元
    avatar: monkey/其他随机角色/武037_男.png
    default_gender: male
    archetype: military
    flavor: （？—前493年）姬元，卫灵公，卫襄公之子，在位约四十二年，其时长年周旋于晋、齐之间。孔子周游列国时多次至卫，灵公曾与夫人南子同车出游，使孔子为次乘，孔子以为耻而离去。晚年太子蒯聩因南子之故谋刺未遂，出奔他国，卫国从此陷入继承纷争。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 20
      defense: 26
      agility: 20
  - key: hist_xianqin_0360
    name: 姬辄
    avatar: monkey_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （？—前456年）姬辄，卫出公，卫灵公之孙、太子蒯聩之子。灵公卒后，他被南子与孔悝立为国君，前后两次在位。前480年，蒯聩在晋国支持下联合浑良夫、孔悝作乱入卫，辄出奔鲁国，子路结缨死于这场变乱；此后卫国父子争位、废立反复。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 18
      defense: 26
      agility: 22
  - key: hist_xianqin_0361
    name: 蒯聩
    avatar: pig/武010.png
    default_gender: male
    archetype: military
    flavor: （？—前478年）蒯聩，卫灵公太子。因夫人南子与宋国公子朝往来，他曾指使家臣刺杀南子，事败出奔宋、晋。前493年灵公卒，其子辄继位；前480年蒯聩在晋国支持下联合浑良夫、孔悝入卫，逐子自立，是为卫庄公。前478年卫国内乱，他出奔后被杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 38
      intellect: 16
      defense: 26
      agility: 20
  - key: hist_xianqin_0362
    name: 南子
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （？—前478年）南子，宋国公主，卫灵公夫人。她与宋国公子朝素有往来，卫灵公曾应其请召朝至卫，太子蒯聩以此为耻而谋刺她，事败出奔。灵公卒后，她欲立公子郢，郢辞让，遂立蒯聩之子辄。孔子至卫时曾依礼相见，子路不悦，孔子发誓自明，事见《论语·雍也》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 8
      intellect: 52
      defense: 22
      agility: 18
  - key: hist_xianqin_0363
    name: 子朝
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）子朝，宋国公子，以貌美著称，故又称宋朝。卫灵公夫人南子出身宋国，与他素有往来；相传灵公曾应南子之请召其至卫，太子蒯聩以此为耻，遂谋刺南子，事败出奔。孔子曾以“宋朝之美”与祝鮀之佞并举，感叹处世之难；相关细节带有传闻色彩。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 16
      defense: 26
      agility: 22
  - key: hist_xianqin_0364
    name: 姬息姑
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （？—前712年）姬息姑，鲁隐公，鲁惠公之子。因太子允年幼，他摄行国政十一年，始终以太子允为嗣，《春秋》记事即始于隐公元年（前722）。前712年，公子翚（羽父）先请杀太子允，被他拒绝，转而向允进谗，隐公在寪氏家中遇害，允即位为桓公。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 22
      defense: 26
      agility: 18
  - key: hist_xianqin_0365
    name: 姬同
    avatar: pig_wu_male3.png
    default_gender: male
    archetype: military
    flavor: （前706年—前662年）姬同，鲁庄公，鲁桓公之子，在位三十二年。前684年长勺之战，他采纳曹刿之计击败齐军。晚年未定嫡嗣，弟叔牙主张立庆父，季友毒杀叔牙、拥立公子般；庄公死后庆父连弑公子般与闵公，酿成“庆父不死，鲁难未已”之乱。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 36
      intellect: 22
      defense: 24
      agility: 18
  - key: hist_xianqin_0367
    name: 曹沫
    avatar: pig/武060.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）曹沫，春秋鲁国将领。据《史记·刺客列传》，他率军与齐三战皆败，鲁庄公只得献地求和；后在柯地会盟时持匕首劫持齐桓公，迫其允诺归还鲁国失地，桓公在管仲劝说下履约。此事又见于《公羊传》，作“曹刿劫盟”，与长勺之战的曹刿或为一人，尚无定论。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 44
      intellect: 14
      defense: 24
      agility: 18
  - key: hist_xianqin_0368
    name: 臧文仲
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: （？—前617年）臧文仲，名辰，谥文，鲁国臧氏宗主，鲁庄公至文公时期执政。前639年鲁国大旱，他劝鲁僖公不要焚巫尪，而应修城郭、省用劝分。海鸟爰居止于鲁东门，他使人祭之，被展禽批评为越职；孔子又责其知柳下惠之贤而不举，故有“窃位”之讥。
