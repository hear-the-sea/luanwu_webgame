    flavor: （生卒年不详）季氏家臣，费邑的掌事者，后据邑反叛。公山弗扰曾召孔子前往辅佐，孔子一度动心，子路却直言反对，最终此行未成。一个叛臣的邀约，照出孔子想在乱世施展抱负的急切，也照出“有召便往”与“所辅何人”之间的两难。公山弗扰后来败走，费邑没有成为他的独立王国，只留下陪臣反噬主家的案例。
