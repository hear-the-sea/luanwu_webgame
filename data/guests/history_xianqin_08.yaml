    archetype: civil
    flavor: （?—前617年）鲁国大夫，臧氏宗主，名声常与孔子的批评并列。臧文仲曾主持国政，也懂得审时度势；但《论语》说他知柳下惠之贤而不荐，《左传》又记他对海鸟爰居的处置，分别被评为“不仁”“不智”。这些评价未必能概括全部政治作为，却提醒后人：才智若只用于保全家族，离公义便隔了一重门。
