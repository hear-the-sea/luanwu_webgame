    name: 姬处
    default_gender: male
    archetype: military
    flavor: （生卒年不详）霍叔处，周文王第八子，受封于霍地。三监之乱中，他随管叔、蔡叔反对周公，具体作用较两位兄长轻，史料也留下了“被裹挟”与“同谋”两种理解。叛乱平定后，他被废为庶人而非处死。霍叔的故事少有传奇，却很实在：宗室政治里，站在错误的一边，即使只是随行，也要为那一步付账。
