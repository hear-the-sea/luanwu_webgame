  - key: hist_xianqin_0350
    name: 薳启强
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）楚国大夫，薳氏成员。春秋盟会频仍，诸侯间一句辞令有时比一支军队更能争得回旋，薳启强便活动在这样的外交场上。关于他具体出使何国，传世记载未能尽述；可以看见的是，他代表了楚国贵族中熟习盟誓、往来的那一类使臣，佩剑之外，还要有一副能过诸侯门的口才。
    growth_range:
