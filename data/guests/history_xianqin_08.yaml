    default_gender: male
    archetype: military
    flavor: （?—约前1039年）管叔鲜，周文王第三子。武王灭商后，他与蔡叔度、霍叔处驻守殷地，监督武庚与殷遗民；武王早逝、周公摄政，他又因兄弟名分与权力失衡而起兵。三监之乱延续数年，周公东征后管叔被诛，周初的宗室裂痕由此见血。管叔未必只是贪权者，他也代表了一种对“周公何以代王执政”的疑问，只是问剑于乱世，答案往往先落在自己身上。
