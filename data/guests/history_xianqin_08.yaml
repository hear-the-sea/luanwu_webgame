    flavor: （?—前468年）季康子，名肥，季桓子之子，鲁国晚期的季氏执政。他曾向在卫国的孔子问政，后来召孔子归鲁；彼时孔子已老，不再重入权力中心，更多以国老身份整理典籍、教授弟子。季康子身上有一重耐人寻味的反差：季氏先辈曾迫使孔子出走，到了他手里，却又需要这位老人替鲁国指路。权势能请回先生，却未必能请回那个时代。
