    default_gender: male
    archetype: military
    flavor: （?—前828年）周厉王，名胡。为王时推行“专利”，把山林川泽的收益收归王室，又以卫巫监视议论，百姓遂“道路以目”。前841年国人暴动，他逃出镐京，终老于彘；“防民之口，甚于防川”既是召公的劝谏，也是这场统治失败的判词。厉王未必承担后世所有暴政传说，却确实让周人看见：堵住嘴，不能堵住愤怒。
