    default_gender: male
    archetype: military
    flavor: （?—约前1039年）蔡叔度，周文王第五子，受封于蔡，与管叔、霍叔同为“三监”。周公摄政后，他参与反周公的叛乱；失败后被放逐，传统说法认为他死于流徙。周公没有因此废绝蔡国，反而让其子蔡仲承继封地，宗室惩戒与宗族延续被同时保留下来。蔡叔的结局很像一枚被打落的棋子：本人失势，家门却还有机会重新落子。
