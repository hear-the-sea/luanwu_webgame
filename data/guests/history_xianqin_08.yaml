    default_gender: male
    archetype: civil
    flavor: （?—前568年）季文子，名行父，鲁国季氏宗主，长期执政。传说他每事“三思”，孔子却说“再思可矣”，既肯定谨慎，也提醒谋而不断会误事。季文子生活俭朴，妻妾不衣帛、马不食粟，死后少有私积；在三桓渐强的鲁国，这份节制尤其难得。他不是没有权势，而是懂得让权势少沾一点自己的衣袖。
