    default_gender: male
    archetype: military
    flavor: （约前1054年—约前949年）周穆王，名满，在位约五十五年。周穆王传说极盛：八骏西行、瑶池会西王母主要见于《穆天子传》等后出文献，不能与《尚书》中的政事混为一谈。较可信的记载还包括征伐犬戎、整饬刑制；长年巡游究竟耗损多少国力，史家有不同判断。这个君主一半站在青铜时代的史书里，一半骑着传说驶向昆仑。
