  - key: hist_qinhan_0211
    name: 徐福
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）秦代方士，见于求仙入海的传说体系。史载他以海外有仙山、可得不死药为说，受秦始皇遣发入海，终不复返；其后故事在民间不断增饰，衍生出“平原广泽”等去向说法，甚至与海外开拓、移民传播联系在一起。对徐福这类人物，较稳妥的读法是把他放回秦帝国的政治心理：统一后的统治者对寿命、神异与控制边界的执念，催生了方士的舞台，也暴露了权力对未知的焦虑。徐福在史与传之间游走，恰好提醒我们区分“史实可证”与“文化想象”，而两者都能折射时代气氛。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0223
    name: 刘弗陵
    default_gender: male
    archetype: civil
    flavor: （前94年—前74年）汉昭帝，汉武帝幼子。八岁即位，由霍光、金日磾等辅政。在位期间，朝廷转向罢兵息民、减轻赋役，并通过盐铁会议讨论财政与边务，逐步收束武帝晚年的紧张局面；燕王刘旦、上官桀等人的叛乱，也在辅政大臣主持下被平定。昭帝身处幼主与强臣并立的局面，能让政局安稳延续，本身就是一种分量。盐铁会议留下的争论，则映出西汉在强国与养民之间寻找新平衡的努力。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0226
    name: 卢绾
    default_gender: male
    archetype: military
    flavor: （前256年—前194年）汉初异姓王，燕王，与刘邦关系亲密，史书多记其“布衣旧交”的特殊位置。卢绾的悲剧在于，亲密关系在开国之后会被重新定义：当天下归一，皇帝更关心的是边地是否可靠、异姓王是否可控，旧友情分很难抵消制度性疑惧。卢绾后因案件牵连与对吕后局势的恐惧而出走匈奴，最终客死异域，这段结局把汉初政治的冷硬写得极清楚——功臣可以被封王，也可以在风向转变时迅速失去立足点。卢绾让人看到“政治信任”与“私人信任”并不是一回事：前者讲的是可预期与可控制，后者讲的是情感与回忆，而帝国最终只会优先选择前者。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0230
    name: 李信
    default_gender: male
    archetype: military
    flavor: （生卒年不详）战国末期秦国将领，常被视为秦军“少壮派”的代表。灭楚之议中，他以“二十万足矣”的判断获信任，却在实战中遭项燕反击而大败，这一挫折凸显楚地战场的复杂：纵深、民心与兵力调度都会放大误判。值得注意的是，李信并未因此被彻底弃用，后续仍参与攻燕、齐等战事，说明秦国用人并非只凭一役成败，而更看重能否在体系内继续发挥作用。李信的故事常被用来提醒后来者：将领的自信固然重要，但对对手韧性、地形纵深与后勤承受的低估，往往才是决定胜负的致命点。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0234
    name: 王贲
    default_gender: male
    archetype: military
    flavor: （生卒年不详）战国末期秦国名将，王翦之子。史书记其参与灭魏、灭燕、灭齐等关键战事，王氏父子在秦统一六国的过程中居功甚大。王贲的可贵之处，不只是战功本身，更在于秦军的胜利是一套体系的胜利：工程攻城、后勤转运、官僚调度与军事行动互相配合，才能把战争从边境推进到对手腹地。王贲身处这一体系之内，既能执行大规模战略，也能在政治上保持谨慎，与父亲王翦的稳重风格相呼应。写王贲，可以更清楚地理解秦统一并非单靠天才将领，而是靠制度化战争机器；而王贲正是这台机器的锋刃之一。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0244
    name: 子婴
    default_gender: male
    archetype: civil
    flavor: （生年不详—前206年）秦王，史称“秦王子婴”。秦末大乱时即位，承受二世遗留下的崩坏局面。他诛杀赵高以求止损，并向刘邦军队投降，希望以屈服换取宗庙与百姓的生路，旋又遭项羽所杀。子婴在史书中常被视作秦末最后的“收拾者”：他没有时间重建制度，也没有力量重塑军心，只能在废墟上做出快速而有限的决断。子婴很难被贴成“仁君”或“懦王”这样的简单标签；他的短暂处境更像一种末日政治学——当帝国的合法性与暴力机器同时失效，个人再敏捷也很难扭转结构性的覆亡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0206
    name: 刘德
    default_gender: male
    archetype: civil
    flavor: （生年不详—前130年）西汉河间献王，汉景帝之子，以好学与藏书著称。史载他广求古籍，收集秦火之后散佚的经典文献，并延揽学者讲习，留下“修学好古，实事求是”的名句。对刘德而言，藩王的价值不只在兵赋与封国，更在文化资源的聚拢与保存：当中央政治关注征伐与财政时，地方王国反而可能成为典籍流转的“缓冲带”。后世儒生推重河间献王，正因为他的选择让许多文本得以续命。把刘德放回西汉学术史看，他不是抽象的“爱书之王”，而是把个人兴趣转化为制度性文化成果的少数宗室之一。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0213
    name: 薄姬
    default_gender: female
    archetype: civil
    flavor: （生年不详—前155年）汉高祖嫔妃，汉文帝之母。史载她早年辗转于诸侯之间，后入汉宫，因不甚受宠反而在吕后掌权的风暴里得以保全。随子刘恒居代国的经历，使薄姬的形象更接近“隐忍而长久”：她不以权谋争宠，却能在边远封国中守住家族与子嗣的安全。刘恒即位后尊为皇太后，史书多写其性情宽厚，少干预政务，这种“退而不争”并非软弱，而是汉初后宫在血腥斗争之后形成的一种自保智慧。薄姬的故事提醒我们，宫廷里最强的生存策略有时不是显赫，而是把锋芒收起，把时间熬过去。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0216
    name: 钩弋夫人
    default_gender: female
    archetype: civil
    flavor: （生年不详—前88年）汉武帝晚年宠妃，赵婕妤。关于“握拳得玉钩”的来历多带传奇色彩，但她在史书中的关键意义并不在神异，而在继承政治：她生子刘弗陵，牵动武帝晚年的储位安排。武帝以吕后旧事为戒，担忧“子少母壮”导致外戚专权，遂出现赐死母亲以保幼主的残酷做法。钩弋夫人的命运因此成为后宫与国政硬碰硬的一个极端节点：个人得宠并不等于安全，甚至可能因“生在正确的时机”而更危险。她的故事把皇权继承的冷逻辑赤裸地摆在眼前——情感让位于结构，生命让位于防范。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0203
    name: 项伯
    default_gender: male
    archetype: civil
    flavor: （生年不详—前192年）项羽宗族成员，鸿门宴时与张良旧交关系使他成为关键斡旋者。史书多写他“救刘邦”的一段，却更值得注意他所体现的楚汉人际结构：宗族是安全网，门客与旧交又是另一张网，两张网有时会互相抵牾。楚汉胜负未定时，项伯既要面对宗族立场，也要面对个人关系与自保判断；而战后归汉受封，则说明个人选择可以被新王朝吸收、转化为政治资源。项伯并不伟岸，也不纯粹，他的灰度正是乱世真实：人并非只在旗帜下行动，也在关系与恐惧里行动。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0204
    name: 项庄
    default_gender: male
    archetype: military
    flavor: （生卒年不详）项羽宗族成员，“项庄舞剑”让他几乎只剩一个政治场景。鸿门宴上舞剑并非单纯表演，而是一种把杀机嵌进礼仪的试探：若刺成，局势立刻翻盘；若刺不成，至少能逼对手露出护卫与同盟。项庄并非决策者，却要承担出手的风险；成则是主帅的功，败则容易成为执行者的罪。刀锋在他手中，动机却未必属于他。
    growth_range:
