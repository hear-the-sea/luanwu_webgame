    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0208
    name: 吴芮
    default_gender: male
    archetype: civil
    flavor: （生年不详—前202年）秦汉之际地方势力人物，秦时为番阳令，秦末响应反秦并转而支持刘邦，后受封长沙王。吴芮的特殊性在于他所在的南方区域与中原政治并不同步：中央更替频繁，而地方更看重能否安抚人心、维持秩序与整合族群。史载吴芮在汉初异姓王中得以相对善终，长沙国亦能延续数世，说明他在“向中央表忠”与“在地方立足”之间找到了可持续的平衡。后世对其评价常带地域记忆色彩，但从历史机制看，吴芮更像汉初国家扩张的一个接口：通过承认地方领袖并纳入封国体系，帝国才能把南方渐渐接入统一的政治版图。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0246
    name: 任嚣
    default_gender: male
    archetype: military
    flavor: （生年不详—前208年）秦将，南海郡尉。秦统一后经略岭南、设置郡县，任嚣与赵佗常被认为是岭南早期郡县治理的重要人物。秦末中原大乱时，南方远离权力中心，信息与命令难以直达，地方官的选择便会直接改写区域走向；任嚣在南方维持秩序的叙述，正体现这种“边远郡县的自治性”。任嚣的意义不在一场战斗，而在他所处的位置连接了两个时代：秦的郡县制度如何在岭南落地、如何在帝国崩解时变形，最终又如何为南越政权的形成提供行政骨架与人事资源。通过任嚣，可以更具体地理解帝国边疆治理的惯性：制度一旦进入地方，就会在动荡中继续生长出新的政治形态。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0215
    name: 郅支
    default_gender: male
    archetype: civil
    flavor: （生年不详—前36年）匈奴单于，呼韩邪之兄，西域史叙事中的强势对手。郅支与汉廷、乌孙等势力的冲突，体现草原政权内部竞争如何外溢到西域：为了争夺盟友与通道，他试图在西方建立据点，控制交通与属国，手段强硬，因而引发多方反感与联合。史载其最终被陈汤、甘延寿远征击败并诛杀，成为汉朝在西域影响力上升的重要节点。郅支的故事并非简单“蛮夷与中华”的对立，而是一场多方博弈：匈奴内部的分裂、汉廷的机会主义、属国的自保选择共同塑造了结局。通过郅支，可以更清楚地看到西域从来不是边缘，而是各方权力交汇的核心地带。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0227
    name: 吕嘉
    default_gender: male
    archetype: military
    flavor: （生年不详—前111年）南越国丞相。历事三代南越王，权倾朝野，史载其宗族多人在南越任官，形成强大的本土政治网络。他反对南越内附汉朝，发动政变杀害主张归汉的南越王赵兴与太后，另立赵建德，并与汉廷彻底决裂。吕嘉率众抵抗汉军，凭借地方动员与地形条件一度支撑局面，终在帝国级军政动员面前败亡。吕嘉的关键不在“能不能打一仗”，而在他代表南越内部的利益结构：本土权臣与亲汉路线的冲突，决定了南越最终只能走向战争解决，而不是谈判妥协。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0228
    name: 常惠
    default_gender: male
    archetype: military
    flavor: （生年不详—前46年）西汉外交家，史载曾随苏武出使匈奴，被扣留多年仍不屈。归汉后，他多次奉命出使乌孙等地，参与汉廷对匈奴的合纵与西域布局，其经历说明西域经营需要长期的“专业外交官”：熟悉山川道路、部族关系与利益分配，能在战与和之间不断调整措辞与策略。常惠的贡献不只是某一次行动，而是把汉廷的承诺变成可被盟友理解、可被执行的安排，让夹击、通使与安置有持续性。写常惠，最能看见两汉边政的另一个侧面——战争之外，真正费力的是谈判与维系信誉；而信誉一旦建立，往往比一次胜仗更能改变力量平衡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0214
    name: 贾逵
    default_gender: male
    archetype: civil
    flavor: （30年—101年）东汉经学家、天文学家，字景伯。他是贾谊的九世孙，身长八尺二寸，博通五经。汉章帝时，他作《左氏长义》献上，极力辩驳今文经学，推动了古文经学在东汉的发展，其学术成就与郑兴父子并称。他还精通天文历法，主张用黄道坐标测量日月运行，并提出了月行快慢与近地点有关的理论，这在当时是极具开创性的发现。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0218
    name: 龚遂
    default_gender: male
    archetype: civil
    flavor: （生年不详—前62年）西汉循吏，字少卿。任渤海太守时，当地饥荒多盗贼。他单车上任，宣布罢除捕盗吏，令盗贼卖剑买牛、卖刀买犊。他劝课农桑，教民耕种，不仅使盗贼平息，且家家富足，“吏民安富”。宣帝召见他，他请求允许自己“治乱绳，不可急”，坚持宽政。龚遂的做法很像“把刀从手上拿走”：先削弱以捕盗为生的吏治惯性，再把人重新拉回生产，让盗贼看到改业也能活下去。对饥荒后的社会而言，恢复信任比加重刑罚更难；而他能以缓政见效，说明循吏的力量往往来自耐心与对民生逻辑的把握。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0220
    name: 儿宽
    default_gender: male
    archetype: civil
    flavor: （生年不详—前103年）西汉御史大夫。出身贫寒，曾在田间替人耕作，休息时仍诵读经书，可谓“带经而锄”。他精通《尚书》，文辞渊博，被张汤赏识后参与法令事务；太初历议定时，他也以经学与政务经验参与其中。儿宽的可贵不只在于苦读入仕，更在于把经学素养带进历法、法律与奏议这些细密政务。温和而能干的他，让武帝朝的强国机器多了一双把制度磨细的手。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0247
    name: 卢生
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）秦代方士，活动多与秦始皇求仙风潮相连。史载方士以神山、不死药等说法取信于上，既迎合帝王的长生欲望，也利用统治者对不确定性的焦虑来争取资源与特权；卢生等人后来或因言事得罪、或见势不妙而遁去，反而引发更强的政治反弹。卢生的故事之所以重要，并不在求仙细节是否可信，而在它揭示一种机制：当最高权力把希望寄托于“不可证伪”的神秘承诺时，朝廷就会出现巨大的信息不对称，欺骗与恐惧会互相滋长。刑罚之外又叠加神秘术与流言，猜疑会自我繁殖，秦末宫廷的紧张也就更容易被推向失控。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0248
    name: 侯生
    default_gender: male
    archetype: civil
