    flavor: 周文（又作周章，生卒年不详—前208年），秦末陈县人，曾事奉春申君，又曾在项燕军中任职，自称熟习兵法。陈胜称王后授予他将军印，命其西击秦廷；他沿途收编兵众，抵达函谷关时已有战车千乘、士卒数十万，直抵戏水，震动关中。秦廷赦免骊山刑徒交章邯统率反击，周文连战失利，退至渑池后自杀。
