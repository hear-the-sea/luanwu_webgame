    flavor: 滇王（姓名不详，生卒年不详），战国末至西汉时滇国君主，其国以滇池为中心。相传楚将庄蹻入滇后，遂王其地。汉武帝遣使通西南夷，滇王倚仗部众与夜郎等盟国，不肯听命；元封二年汉军平定劳浸、靡莫，兵临滇境，滇王举国归降，受赐“滇王之印”，仍统领其民，滇地由此纳入汉朝版图。
