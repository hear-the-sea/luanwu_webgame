    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: 共敖（生卒年不详），秦末楚将，曾任楚怀王熊心的柱国。他奉命率军攻略南郡，因功被项羽封为临江王，都江陵，辖有南郡一带。共敖死后，其子共尉嗣位；楚汉战争末期，共尉因依附项羽而遭汉将卢绾、刘贾围攻，坚守数月后出降，仍被处死，临江国随之废除，其地并入汉朝。
