    default_gender: male
    archetype: military
    flavor: 丁复（生卒年不详），秦末汉初将领，原为赵将，自邺起兵，随刘邦入关灭秦，又参与还定三秦。楚汉战争中他隶属吕泽（后谥悼武王）部下，曾参与击破龙且、对抗项羽的战事；以军功封阳都侯，食邑七千八百户，在汉初功臣列侯中封户颇为可观，其名见于《史记·高祖功臣侯者年表》。
