    default_gender: male
    archetype: military
    flavor: 刘戊（生卒年不详），西汉楚国诸侯王，楚元王刘交之孙。景帝即位后推行削藩，他与吴王刘濞通谋，于前154年举兵反汉，率楚军与吴军合攻梁国。梁王刘武坚守睢阳，汉将周亚夫屯兵昌邑、遣轻兵截断吴楚粮道，联军粮尽溃散；刘戊兵败自杀，景帝另立楚元王之子刘礼为楚王，以续楚国宗祀。
