heroes:
  blue:
  - key: hist_qinhan_0211
    name: 徐福
    avatar: pig/文038.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）秦代方士，齐地人。秦始皇时两度奉命出海求仙，第二次率童男女、百工与五谷种子入海，此后未再返回，去向史无明文。后世多有附会，日本民间流传徐福东渡的传说。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0223
    name: 刘弗陵
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （前94年—前74年）汉昭帝，汉武帝幼子，八岁即位，由霍光、金日磾、上官桀等辅政。始元六年，朝廷召集贤良文学与桑弘羊等议论盐铁、均输，史称盐铁会议；次年又平定燕王刘旦、上官桀等人的谋反。他二十一岁病逝，无子，在位期间延续轻徭薄赋的政策。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0226
    name: 卢绾
    avatar: monkey_wen_male5.png
    default_gender: male
    archetype: military
    flavor: （前256年—前194年）西汉燕王，刘邦的同乡旧友，二人同日出生，关系亲厚。汉初受封燕王。高祖末年，他因与陈豨、匈奴的往来受到猜疑，被召入朝时称病不至；汉廷派兵征讨，他率家属逃入匈奴，受封东胡卢王，不久病死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0230
    name: 李信
    avatar: pig/武059.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）战国末年秦国将领，以年轻勇壮受到秦始皇任用。秦攻燕时，他率数千兵追击燕太子丹至衍水，迫使燕王喜斩丹求和；前225年又与蒙恬率二十万攻楚，在城父一带被楚将项燕击败。此后其事迹史载渐少，秦廷改以王翦统军灭楚。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0234
    name: 王贲
    avatar: monkey_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）战国末年秦国将领，王翦之子。前225年率军攻魏，引黄河、鸿沟之水灌大梁，魏王假出降；随后参与攻取燕辽东，俘虏燕王喜；前221年率军攻齐，齐王建不战而降。秦统一后封通武侯，其后事迹史载渐少。
    growth_range:
    - 6
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0244
    name: 子婴
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前206年）秦朝末代君主，史书称其为秦二世之侄。二世被赵高杀死后继位，去帝号称秦王，在位仅四十六天。他与儿子及宦官韩谈合谋诛杀赵高，随后向进驻霸上的刘邦投降；项羽入关后，子婴被杀，秦朝灭亡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0206
    name: 刘德
    avatar: monkey_wen_male3.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前130年）西汉河间献王，汉景帝之子。他喜好儒学，广泛搜集秦火之后散佚的先秦旧籍，招请学者校勘讲习，并立《毛诗》《左氏春秋》博士。史书以“修学好古，实事求是”称之，河间国所藏典籍为后世学术所重。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0213
    name: 薄姬
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （生年不详—前155年）汉高祖嫔妃，汉文帝生母。她早年入魏王豹宫中，魏豹败亡后入汉宫，后生下刘恒。刘恒封代王时，她随子前往代地；刘恒即位后被尊为皇太后。薄姬平日少预政事，以宽厚谨慎著称；薄氏外戚未如吕、王诸家长期显赫，其弟薄昭封轵侯。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0216
    name: 钩弋夫人
    avatar: monkey_wen_female7.png
    default_gender: female
    archetype: civil
    flavor: （生年不详—前88年）汉武帝晚年宠妃，赵氏，封婕妤，生汉昭帝刘弗陵。武帝欲立幼子为嗣，又顾虑主少母壮、外戚干政，遂将其赐死。刘弗陵即位后，她被追尊为皇太后。钩弋夫人之死，是汉代抑制母族势力的一则旧例。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0203
    name: 项伯
    avatar: pig/文042.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前192年）项羽的叔父，楚汉相争时与张良交好。鸿门宴前，他连夜把项羽欲攻刘邦的消息告知张良，并在宴席上以身遮挡，保护刘邦。楚汉战争结束后，项伯归附刘邦，受封射阳侯，赐姓刘氏，后卒于封国。项氏枝属多未被追究，其中数人受封侯爵。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0204
    name: 项庄
    avatar: pig/武010.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）项羽的族弟，秦末随项羽征战。鸿门宴上，范增示意他借舞剑之机刺杀刘邦；项伯起身与之对舞，以身体遮护刘邦，项庄终未得手。此后樊哙带剑闯入帐中，宴席局势逆转。项羽败亡后，项庄下落不见于史书记载。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0208
    name: 吴芮
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前202年）秦汉之际人物，秦时任番阳令，颇得民心，被称为番君。秦末起兵，与英布联姻并响应反秦；项羽封他为衡山王，后归附刘邦，改封长沙王。吴芮死后，其子吴臣嗣位，长沙国延续数代，是汉初少数得以保全的异姓王国。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0246
    name: 任嚣
    avatar: pig_wu_male9.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前208年）秦朝将领，任南海郡尉，与赵佗共同经营岭南。秦末中原大乱，任嚣病重，临终嘱托赵佗依山傍海、断绝通道、静观时变。任嚣死后，赵佗接管南海郡，随后兼并桂林、象郡，建立南越国，自称南越武王。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0215
    name: 郅支
    avatar: duck_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前36年）匈奴单于，呼韩邪单于之兄。匈奴内乱中，他与呼韩邪争位失利，率部西走康居，并在当地修筑郅支城。他杀害汉使谷吉，与汉廷交恶。前36年，汉将甘延寿、陈汤发兵远征，攻破郅支城，郅支单于在战乱中身死。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0227
    name: 吕嘉
    avatar: pig/武049.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前111年）南越国丞相，历相赵婴齐、赵兴、赵建德三王。他反对樛太后与赵兴归附汉朝，前112年发动政变，杀死赵兴、樛太后及汉使，拥立赵建德。次年的汉军攻破番禺后，吕嘉逃亡海上，被南越郎官擒获，南越国随之灭亡。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0228
    name: 常惠
    avatar: pig/武048.png
    default_gender: male
    archetype: military
    flavor: （生年不详—前46年）西汉使者，太原人。早年随苏武出使匈奴，被扣留十余年，昭帝时方得归汉。后多次出使乌孙，宣帝时持节监护乌孙兵，与汉军合击匈奴；又曾率兵责问龟兹杀汉使者之事。因功封长罗侯，官至右将军。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0214
    name: 贾逵
    avatar: monkey/其他随机角色/文_男123.png
    default_gender: male
    archetype: civil
    flavor: （30年—101年）东汉经学家、天文学家，字景伯，贾谊后裔。他精通五经，尤长于《左传》《国语》，章帝时参与讲论经义，撰有《春秋左氏传解诂》等。历法方面，他提出月亮运行有迟疾之别，并参与东汉的历法讨论。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0218
    name: 龚遂
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）西汉官员，字少卿。宣帝时渤海郡饥荒，盗贼并起，他出任太守，开仓赈济，选用良吏，劝民卖剑买牛、卖刀买犊，专务农桑。数年后郡内安定，百姓富实，龚遂被召入朝，任水衡都尉，后世以其治郡有方传为循吏故事。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0220
    name: 儿宽
    avatar: pig/文049.png
    default_gender: male
    archetype: civil
    flavor: （生年不详—前103年）西汉官员，千乘人。少时家贫，曾带经书耕作、借书诵读，后以治《尚书》入仕。他得到张汤赏识，参与决狱与法令事务；武帝时官至御史大夫，并参与制定太初历。儿宽由贫寒儒生跻身朝堂，是汉代以经术进身的代表人物之一。
    growth_range:
    - 5
    - 9
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  green:
  - key: hist_qinhan_0247
    name: 卢生
    avatar: monkey_wen_male4.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）秦代方士，燕地人，与侯生同为秦始皇所信用。他曾奉命入海求仙，回奏“亡秦者胡也”的图录，秦始皇因此发兵北击匈奴；又劝始皇隐匿行踪、居处不令人知。后求仙无验，与侯生私下非议始皇刚愎贪权，惧罪逃亡，始皇大怒，遂有咸阳坑术士之事。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0200
    name: 司马欣
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: 司马欣（生卒年不详），秦朝栎阳狱掾出身。项梁曾因事下狱，得他从中相助而脱免，项氏因此感念其恩。秦末他任章邯长史，随军镇压起义，巨鹿兵败后随章邯降项羽，受封塞王，都栎阳。楚汉相争中先降刘邦，不久复归楚；成皋之战楚军失利，他与董翳自刎于汜水之上。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0248
    name: 侯生
    avatar: monkey_wen_male2.png
    default_gender: male
    archetype: civil
    flavor: （生卒年不详）秦代方士，与卢生同受秦始皇任用，奉命寻求仙药。因长期无验，二人私下议论始皇帝刚戾自用、专任狱吏、博士备员不用，随后一同逃离咸阳。始皇闻讯震怒，命御史审问在咸阳的诸生，四百六十余人被坑杀，侯生之名遂与这场坑儒事件相连，其最终下落史书未载。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0201
    name: 周苛
    avatar: pig/武050.png
    default_gender: male
    archetype: military
    flavor: 周苛（生卒年不详），汉王刘邦麾下御史大夫，周昌的堂兄。荥阳被围时，刘邦突围而去，留他与枞公守城；二人以魏豹反复难信，先将其处死。城破后项羽劝他归降，许以上将军、三万户，周苛痛骂不从，遂遭烹杀，枞公同时遇害，事见《史记·项羽本纪》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0202
    name: 董翳
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: 董翳（生卒年不详），秦末都尉，章邯部下。巨鹿之战后随章邯降项羽，与章邯、司马欣同被分封于关中，是为三秦；他受封翟王，都高奴。楚汉相争时先降刘邦，后又归附项羽；成皋一战楚军大败，他与司马欣自刎于汜水，翟国随之废除。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 46
      intellect: 14
      defense: 28
      agility: 12
  - key: hist_qinhan_0205
    name: 冯立
    avatar: monkey/其他随机角色/文101_男.png
    default_gender: male
    archetype: civil
    flavor: 冯立（字圣卿，生卒年不详），西汉经学家、官员，名将冯奉世之子。少承家学，通晓《春秋》，因父荫入仕为郎。此后历任西河、五原、上郡等郡太守，所至以清廉自守、政绩可观著称；史书称其“好为条教”，吏民多加称颂。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0207
    name: 刘辟光
    avatar: monkey/其他随机角色/文052_男.png
    default_gender: male
    archetype: civil
    flavor: 刘辟光（生卒年不详），西汉宗室，齐悼惠王刘肥之子。文帝十六年分齐地为诸国，他受封济南王。景帝前元三年，他与吴王刘濞、楚王刘戊等举兵反汉，史称七国之乱；汉廷派周亚夫等平叛，诸侯联军溃败，刘辟光兵败自杀，济南国被废除，改设为郡。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0209
    name: 咸宣
    avatar: pig/文050.png
    default_gender: male
    archetype: civil
    flavor: 咸宣（又作减宣，生卒年不详），西汉酷吏，杨县人。由佐史起家，得卫青举荐入朝，历任御史、中丞，曾审理主父偃及淮南王谋反案，以深文周纳、敢断疑狱闻名。任左内史时事无大小皆亲揽，用法严苛；后为右扶风，因派人追杀仇家成信、误射上林苑门而获罪，下狱后自杀。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0210
    name: 张欧
    avatar: monkey_wen_male7.png
    default_gender: male
    archetype: civil
    flavor: 张欧（字叔，生卒年不详），西汉官员，安丘侯张说之庶子。他研习刑名之学，文帝时以刑名侍奉太子刘启；景帝、武帝两朝累官至九卿，武帝时继韩安国任御史大夫。其为吏宽厚，从不主动弹劾他人，属吏敬重而不忍欺瞒；遇可宽宥的狱案便从轻处置，不得不判者常流涕封奏，以长者之风见称。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0212
    name: 李息
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: 李息（生卒年不详），西汉北地郁郅人，历事景帝、武帝两朝，是武帝前期对匈奴作战的将领之一。元朔二年，他以材官将军随卫青出云中，西击匈奴楼烦、白羊王，参与收复河南地并设置朔方郡。此后长期在北方边郡统兵驻防，元鼎年间又曾与徐自为率军平定西羌，事见《史记》《汉书》。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 14
      intellect: 48
      defense: 22
      agility: 16
  - key: hist_qinhan_0217
    name: 魏应
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: 魏应（字君伯，生卒年不详），东汉任城人，经学家。少习《鲁诗》，闭门诵读、不交朋党，后以明经入仕；因病去官后在山泽间讲学，弟子常有数百。永平年间任博士，迁侍中，章帝时官至五官中郎将，并参与白虎观会议，专掌疑难问难，一时为儒者所重。
