    flavor: 李由（生卒年不详—前208年），秦朝丞相李斯的长子，任三川郡守，镇守荥阳一带。陈胜起兵后，吴广率军围攻荥阳，他据城坚守，久攻不下，直到章邯军赶到才解围。前208年，刘邦、项羽所部在雍丘大破秦军，李由战死；赵高后来还以他守郡不力为由，牵连其父李斯下狱。
