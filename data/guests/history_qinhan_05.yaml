    default_gender: male
    archetype: military
    flavor: 马贤（生卒年不详—141年），东汉将领，长期担任护羌校尉等职，主持西北对羌事务数十年。顺帝永和六年，且冻、傅难等部羌人起兵，他率数千骑前往镇压，在射姑山一战中大败，与其二子同时战死。此役之后东汉在凉州的控制力明显削弱，羌乱愈演愈烈，边郡糜烂，成为此后长期困扰朝廷的边患。
