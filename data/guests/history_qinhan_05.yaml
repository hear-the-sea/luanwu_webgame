    default_gender: male
    archetype: military
    flavor: 高业（生卒年不详），西汉方士，生平不见于正史，其事主要见于后世杂记。相传他以谶纬图录之说游说淮南王刘安，与当时淮南国招揽宾客、讲求方术的风气相符；刘安后因谋反案自杀，门下宾客多受牵连，高业的具体言行与结局已难以确考。
