    default_gender: male
    archetype: military
    flavor: 刘贤（生卒年不详），西汉宗室，齐悼惠王刘肥之子。文帝十六年分齐地为数国，他受封菑川王。景帝前元三年，他与胶西王刘卬、胶东王刘雄渠、济南王刘辟光联兵反汉，合围齐都临淄，数月不下；汉将栾布平定齐地叛军后，刘贤兵败身死，菑川国一度被废除。
