    avatar: monkey/其他随机角色/文059_女.png
    default_gender: female
    archetype: civil
    flavor: 花清渊与凌霜君的女儿，凤歌小说《昆仑》中在天机宫长大的温柔少女。花晓霜自幼体弱，却潜心学习医术，与梁萧相识后，始终记挂这个多次身陷险境的人。宋元战火渐烈，伤者无论来自哪一方，她都愿意施救；家门争执与外界非议逼近时，她也不轻易改变心意。行囊中装着药物，身边牵着患难之人，她就这样继续走下去。
