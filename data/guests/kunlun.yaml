    name: 释天风
    avatar: pig/武070.png
    default_gender: male
    archetype: military
    flavor: 灵鳌岛上自成一方武学天地的岛主，凤歌小说《昆仑》中的释天风，有东海一尊、灵鳌武库之誉。他熟悉诸般武功，轻功尤为高明，乘风蹈海的身法令人叹服。远离中原仍不妨碍他与江湖人物来往，梁萧等人走入海疆，也随之见识到另一番高手风貌。岛上武学与海上往来的经历，都藏在这位老宗师举重若轻的身手之中。
