    flavor: 质朴的青年梁文靖，是凤歌《昆仑》前传《铁血天骄》中的主人公，也是梁萧的父亲。早年阴差阳错成为宋军将领的替身，被推入合州守城的战局，他从惶恐中渐渐生出勇气。与蒙古女子萧玉翎相遇后，两人在敌对立场间相爱，试图离开战火共度生活。萧千绝的阻挠却使这段姻缘走向惨剧，也让年幼的梁萧背上了父辈旧怨。
