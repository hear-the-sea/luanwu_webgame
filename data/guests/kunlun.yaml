  - key: hero_ilrock_04243
    name: 花无媸
    avatar: monkey/其他随机角色/文084_女.png
    default_gender: female
    archetype: civil
    flavor: 天机宫前任宫主，凤歌小说《昆仑》中公羊羽的妻子、花清渊的母亲。花无媸精于术数，治宫严厉，丈夫留下的旧日情事却令她多年难解心结。梁萧来到天机宫后，她设下天机十算考验这个聪颖少年，一道道难题既有算学奥妙，也夹着自己的怨气。宫门中的年轻人不断成长，她与公羊羽积压已久的情感，也在变故中逐渐显露。
