    flavor: 天机宫的家学与宫务，由花清渊承接，是凤歌小说《昆仑》中公羊羽与花无媸的儿子。他熟悉武学、术数，处世较父母温和，对梁萧多有照拂，也格外关爱体弱的女儿花晓霜。家中长辈旧怨未平，少年后辈又卷入新的争执，他常要在其中斡旋。待危难真正逼近天机宫，这份温厚便与保护家门、亲人的决心一起显现。
