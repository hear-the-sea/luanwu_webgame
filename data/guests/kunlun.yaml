    - 9
    attribute_weights:
      force: 42
      intellect: 6
      defense: 16
      agility: 36
  - key: hero_ilrock_04241
    name: 花生
    avatar: pig/武078.png
    default_gender: male
    archetype: military
    flavor: 九如座下的年轻和尚，僧名花生，见于凤歌小说《昆仑》。他身形壮实，天生力大，随着师父修习大金刚神力，举手投足便有惊人威势。性情却淳朴憨厚，少有曲折心机，与梁萧相识后结为兄弟，遇事总愿认真相帮。师父的喝斥、朋友的请求，他往往都信得真切；风波来时，那个不善言辞的少年便握紧拳头，站到同伴身边。
