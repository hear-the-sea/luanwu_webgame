    - 7
    attribute_weights:
      force: 10
      intellect: 40
      defense: 25
      agility: 25
  - key: hero_gu_zixian
    name: 谷姿仙
    archetype: civil
    flavor: 谷姿仙明艳温婉，情深而不失主见。她身处《覆雨翻云》的江湖暗潮，守得住自己的选择，也经得起风雨的推搡；温柔是她的底色，绝非她的软肋。她不是只会临窗叹气的闺中人，风雨真到门前，自有一番担当。出自黄易小说《覆雨翻云》。
    default_gender: female
    default_morality: 80
    recruitable: true
