# 黄易作品门客

heroes:
  green:
  - key: hero_susu
    name: 素素
    archetype: civil
    flavor: 素素性情温柔，身处战国烽烟，却不失一颗安静而坚韧的心。她是项少龙早期相遇的红颜，以真心相待，不争锋头，却在乱世里替他守住一方温暖。刀兵能斩人，未必斩得断这份柔情。出自黄易小说《寻秦记》。
    default_gender: female
    default_morality: 85
    recruitable: true
    growth_range:
