  - key: hist_sljnbc_0162
    name: 蒋济
    avatar: pig/文032.png
    default_gender: male
    archetype: civil
    flavor: （？—249年）字子通，楚国平阿人，曹魏重臣。孙权围攻合肥时，他任扬州别驾，密令伪造张喜援军将至的书信，诱使孙权烧营退兵。此后历仕曹操、曹丕、曹叡、曹芳四朝，官至太尉。高平陵之变中，他写信为司马懿劝降曹爽并许以保全；曹爽被诛后他深自愧责，坚辞封赏，同年病逝。
