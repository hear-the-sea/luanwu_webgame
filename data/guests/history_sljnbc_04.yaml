  - key: hist_sljnbc_0173
    name: 侯景
    default_gender: male
    archetype: military
    flavor: （503年—552年）东魏旧将，后来投奔南梁，最终反噬梁室。侯景以兵变攻入建康，幽困梁武帝，江南士族与百姓在多年战乱中遭受屠戮，繁华城郭随之凋敝。此人能借乱世上位，却只会用刀把天下越搅越乱；“宇宙大将军”的狂名，遮不住一场把江南打成废墟的祸患。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 34
      intellect: 12
      defense: 40
      agility: 14
  - key: hist_sljnbc_0174
    name: 独孤信
    default_gender: male
    archetype: military
    flavor: （502年—557年）西魏八柱国之一，本名独孤如愿，以战功和风仪并著。北镇、关陇之间，他既能领骑兵破阵，也能在诸部关系里稳住局面；“侧帽风流”的传说让这位边将又添了京城时尚人物的色彩。更令人称奇的是，三个女儿分别成为北周、隋、唐皇室之后，他本人未称帝，姻亲却像一张无形的网，牵出了三个朝代。
    growth_range:
