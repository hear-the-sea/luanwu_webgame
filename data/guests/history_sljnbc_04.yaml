  - key: hist_sljnbc_0162
    name: 蒋济
    default_gender: male
    archetype: civil
    flavor: （？—249年）曹魏大臣，既能治政也懂军略。合肥危急时，他曾用疑兵书信动摇孙权；高平陵之变中又替司马懿劝降曹爽，以为可以保全旧臣，结果司马氏仍将曹爽夷族。蒋济后来上疏自责，才知权谋如借来的刀，出鞘容易，收回却未必由自己作主。
