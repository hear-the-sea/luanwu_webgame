  - key: hist_sljnbc_0165
    name: 田豫
    default_gender: male
    archetype: military
    flavor: （171年—252年）曹魏北疆名将，早年曾随刘备，后归曹操。田豫长期出镇幽州，熟悉乌桓、鲜卑诸部的利害，常以恩信招抚、以兵势惩戒，使边患不至于反复烧起。北地风沙里最值钱的不是一场猛冲，而是知道何时亮刀、何时收弓；田豫把这门分寸练到了老。
