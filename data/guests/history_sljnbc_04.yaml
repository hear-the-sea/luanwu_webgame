  - key: hist_sljnbc_0172
    name: 曹景宗
    default_gender: male
    archetype: military
    flavor: （457年—508年）南梁名将，出身将门，以骑射和勇悍见长。钟离之战中，他与韦睿协力击退北魏大军；战后两人争功，反成一段将门逸闻。梁武帝命他限韵赋诗时，他仓促成章，诗句未必精雕细琢，军人的豪气却先冲出了纸面。
