  - key: hist_sljnbc_0170
    name: 阚泽
    avatar: pig/文033.png
    default_gender: male
    archetype: civil
    flavor: （？—243年）字德润，会稽山阴人，东吴学者。他家世务农，少年时家贫无书，常受雇为人抄书，借此遍览群籍，兼通历法。孙权称帝后，他历任尚书、中书令，赤乌年间官至太子太傅，教授太子孙和，封都乡侯。阚泽曾为《乾象历》作注，另有著述，多已亡佚。
