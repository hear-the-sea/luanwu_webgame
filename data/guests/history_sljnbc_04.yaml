  - key: hist_sljnbc_0171
    name: 朱桓
    default_gender: male
    archetype: military
    flavor: （177年—238年）东吴将领，性情骄烈，却爱护士卒。濡须之战中，他据地设伏，击败曹仁来军；平日又亲问病卒，故士卒愿为之死。朱桓像一柄脾气不小的快刀，握在手里难免硌人，临阵却往往劈得敌阵开缝。
