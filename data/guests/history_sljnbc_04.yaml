    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0175
    name: 李通
    default_gender: male
    archetype: military
    flavor: （168年—209年）曹操麾下将领，早年以游侠气闻名，后来成了守土有方的军人。征张绣时，他击破刘表援军；官渡前拒绝刘表招降，始终守在曹操一边，镇守汝南并多次接应军队。赤壁败退时，他护送曹操撤离；真正的勇将不只会取胜，也知道败军之际如何把主帅和残部带回去。
    growth_range:
