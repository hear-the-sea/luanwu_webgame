  - key: hist_sljnbc_0164
    name: 孙礼
    avatar: pig_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （？—250年或251年）字德达，涿郡容城人，曹魏大臣。他为官刚直，任并州刺史时安抚边民，入朝后屡次谏阻魏明帝大兴土木；曹叡临终以其为大将军长史，辅佐曹爽。后因政见与曹爽不合被免官，高平陵之变后复起，官至司空，封大利亭侯，谥景侯。
