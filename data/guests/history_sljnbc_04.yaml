  - key: hist_sljnbc_0166
    name: 王凌
    avatar: monkey_wen_male11.png
    default_gender: male
    archetype: civil
    flavor: （172年—251年）字彦云，太原祁人，王允之侄。李傕、郭汜之乱中，王允遇害，他侥幸逃归乡里。入魏后历任中山太守、扬州刺史；石亭之战曹休败退，他奋力接应，使曹休得脱。嘉平三年，王凌与令狐愚谋立楚王曹彪以对抗司马懿，事泄后出降，于押送途中饮药自尽，三族被诛。
