    name: 文聘
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （生卒年不详）字仲业，南阳宛县人，东汉末至曹魏将领。他原为刘表麾下大将，镇守荆州北部；刘琮降曹后，文聘以未能保全州土为由迟迟不谒见曹操，曹操却赞其忠义，仍授江夏太守。此后他长期驻守江夏，与乐进在寻口、汉津一带夹击关羽，又多次击退孙权来犯，官至后将军，封新野侯，谥壮侯。
