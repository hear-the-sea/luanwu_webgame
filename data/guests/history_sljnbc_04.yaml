    name: 朱桓
    avatar: pig/武010.png
    default_gender: male
    archetype: military
    flavor: （177年—238年）字休穆，吴郡吴人，东吴将领。他早年任余姚长，遇大疫时亲自巡行抚恤，深得民心。黄武元年曹仁率大军进攻濡须，朱桓以少量守军诱敌，遣别将击斩常雕、生擒王双，大破魏军。此后他长期督守濡须，官至奋武将军，封嘉兴侯。
