  - key: hist_sljnbc_0169
    name: 吴懿
    default_gender: male
    archetype: military
    flavor: （？—237年）蜀汉将领，吴皇后的兄长，原为刘璋部将，后归刘备。吴懿随军入汉中、参加北伐，官至车骑将军；诸葛亮死后，他镇守汉中，承担北境最要紧的一道屏障。外戚身份能替他打开宫门，却不能替他守住关隘，吴懿的名声终究还是靠边地的军令立住。
