  - key: hist_sljnbc_0172
    name: 曹景宗
    avatar: pig_wu_male5.png
    default_gender: male
    archetype: military
    flavor: （457年—508年）字子震，新野人，南朝梁将领。他出身将门，善骑射，齐末随萧衍起兵，屡为先锋。天监五年，北魏元英、杨大眼围攻钟离，曹景宗与韦睿合兵救援，大破魏军，俘斩甚众。后官至侍中、中卫将军、江州刺史，封竟陵县公，谥壮。
