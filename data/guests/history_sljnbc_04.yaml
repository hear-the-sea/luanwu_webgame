  - key: hist_sljnbc_0163
    name: 曹纯
    avatar: pig/武046.png
    default_gender: male
    archetype: military
    flavor: （170年—210年）字子和，沛国谯人，曹仁之弟，曹操族亲。他年少知名，统领曹军精锐虎豹骑，随曹操攻南皮时率部斩袁谭，长坂坡追击刘备，缴获其辎重与家眷；北征乌桓时其部骑俘获单于蹋顿。曹纯治军严整，死后谥威侯，曹操深惜之。
