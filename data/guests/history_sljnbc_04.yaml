  - key: hist_sljnbc_0169
    name: 吴懿
    avatar: monkey_wu_male10.png
    default_gender: male
    archetype: military
    flavor: （？—237年）字子远，陈留人，蜀汉将领。他早年随刘焉入蜀，刘璋时官至中郎将，刘备攻益州时归降；其妹吴氏后来成为刘备的穆皇后。建兴八年，吴懿与魏延西入羌中，在阳溪大败魏将郭淮、费瑶。诸葛亮卒后，他受命督守汉中，官至车骑将军，封济阳侯。
