  - key: hist_sljnbc_0170
    name: 阚泽
    default_gender: male
    archetype: civil
    flavor: （？—243年）东吴学者、大臣，出身贫寒，曾靠佣工抄书求学。正史记载他后来任太子太傅，并参与礼制与历法等学术事务；“替黄盖向曹操献诈降书、在敌营中机辩脱身”的情节，主要见于《三国演义》等文学叙事。阚泽真实可考的形象，更多属于治学、修历与任事的东吴学者。
