  - key: hist_sljnbc_0164
    name: 孙礼
    default_gender: male
    archetype: military
    flavor: （？—250年）曹魏将领、地方官，以刚直敢任著称。曹操出行遇虎时，他曾持戟护卫；后来镇边、治郡，既能压服豪强与外族，也不肯在芍陂争议中向权势低头。孙礼的刀用于御敌，话用于犯颜：能在军阵里立威，也能在朝堂上把不合意的话说完。
