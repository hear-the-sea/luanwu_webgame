  - key: hist_sljnbc_0160
    name: 郭淮
    default_gender: male
    archetype: military
    flavor: （？—255年）曹魏西线宿将，长期镇守雍凉。诸葛亮北伐时，他善于据险守势、审时后动；姜维再出祁山，他也能及时调兵，不让战线被一处突破。郭淮不以一场奇胜夺名，却在三十年边防里把蜀军的锋刃一寸寸磨钝；西陲的安稳，正是这种老将功夫。
