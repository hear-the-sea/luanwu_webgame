    name: 文聘
    default_gender: male
    archetype: military
    flavor: （？—？）东汉末至曹魏将领，刘表旧部，后来归曹并镇守江夏。刘琮降曹后，他没有随众赴降，直到曹操召见才说明“不能全荆州”的惭意；被任用后，文聘以江夏水陆形胜多次挡住孙权进攻，也曾与关羽相抗。守一座江夏，靠的不是一时血勇，而是把城、船与军心都拴在一起。
