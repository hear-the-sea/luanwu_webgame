  - key: hist_sljnbc_0176
    name: 朱灵
    default_gender: male
    archetype: military
    flavor: （？—223年）魏将，原属袁绍，后来归曹操。曹操称他“古之良将”，并非只夸其勇，而是看中他治军严整、临事守令；即使兵权被于禁夺去、官职一度受抑，他仍按军令出征，不以私怨误公。朱灵的锋芒藏在纪律里，能握紧自己的刀，也能忍住不为失意拔刀。
    growth_range:
    - 4
