  - key: hist_sljnbc_0160
    name: 郭淮
    avatar: pig_wu_male8.png
    default_gender: male
    archetype: military
    flavor: （？—255年）字伯济，太原阳曲人，曹魏名将。定军山之战夏侯渊战死后，军中慌乱，他与诸将共推张郃代领其众，稳住败局。此后他长期镇守雍凉，任雍州刺史，屡次抵御诸葛亮、姜维北伐，又招抚平定羌胡部众，官至车骑将军、仪同三司，封阳曲侯，谥贞侯。
