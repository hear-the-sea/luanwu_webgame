  - key: hist_sljnbc_0166
    name: 王凌
    default_gender: male
    archetype: civil
    flavor: （172年—251年）曹魏太尉，王允之侄，晚年起兵反对司马氏专权。与外甥令狐愚谋立楚王曹彪，寿春之变尚未成势便被司马懿大军逼降；他服毒自尽，三族遭诛。王凌并非没有兵权，而是没有等到能与权臣抗衡的同盟；寿春的风声一紧，忠魏之志便只剩一条绝路。
