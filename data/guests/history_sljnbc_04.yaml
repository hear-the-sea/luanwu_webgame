  - key: hist_sljnbc_0174
    name: 独孤信
    avatar: monkey/其他随机角色/武038_男.png
    default_gender: male
    archetype: military
    flavor: （502年—557年）本名独孤如愿，云中鲜卑人，西魏八柱国之一。他早年镇守荆州，后归宇文泰，任秦州刺史。相传他在秦州狩猎归城时帽檐微侧，次日吏民争相效仿，“侧帽风流”由此传为佳话。北周初年，他因与赵贵谋诛宇文护事泄，被逼自尽。三个女儿分别嫁入北周、隋、唐皇室。
    growth_range:
    - 3
    - 7
    attribute_weights:
      force: 40
      intellect: 15
      defense: 23
      agility: 22
  - key: hist_sljnbc_0175
    name: 李通
    avatar: monkey_wu_male2.png
    default_gender: male
