  - key: hist_sljnbc_0165
    name: 田豫
    avatar: monkey_wu_male1.png
    default_gender: male
    archetype: military
    flavor: （171年—252年）字国让，渔阳雍奴人，曹魏边将。他少年时依附刘备，因母老辞归乡里，后辗转归附曹操。曹彰北征乌桓时，田豫以相职随军，建议据险设伏大破乌桓；此后长期任护乌丸校尉，镇抚北疆，屡破鲜卑、乌桓。晚年官至太中大夫，封长乐亭侯。
