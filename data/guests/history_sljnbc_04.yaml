  - key: hist_sljnbc_0163
    name: 曹纯
    default_gender: male
    archetype: military
    flavor: （170年—210年）曹操宗亲将领，虎豹骑的统领者之一。曹纯随军征战，在南皮擒杀袁谭、长坂追击刘备、北征乌桓等战事中屡任精骑主将；虎豹骑的锋利，既靠战马，也靠严格选卒与号令。这样的骑兵不是一窝蜂冲锋，而是把速度、队形和杀机收在一声军令里。
