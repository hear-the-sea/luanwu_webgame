  - key: hist_sljnbc_0173
    name: 侯景
    avatar: duck_wu_male2.png
    default_gender: male
    archetype: military
    flavor: （503年—552年）侯景，羯族，北魏末从尔朱荣起家，后依附高欢，镇守河南。高欢死后，他先降西魏，再投南梁，受封河南王。548年，侯景以清君侧为名在寿阳起兵，攻陷建康，梁武帝在台城忧愤而崩，他继而称帝。552年，王僧辩、陈霸先联军收复建康，侯景败逃，为部下所杀。
    growth_range:
