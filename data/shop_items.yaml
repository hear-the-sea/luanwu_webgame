# 商铺商品配置
# item_key: 对应 ItemTemplate.key
# price: 玩家出售给商店的回收价（可选，不填则使用 ItemTemplate.price）
# buy_price: 玩家在商店的购买价（可选，不填则按回收价乘默认倍率）
# stock: 库存数量，-1 表示无限
# daily_refresh: 是否每日刷新库存（可选，默认 false）
#
# 当前商店只售卖：粮食、小喇叭、药品、护院招募装备、门客合成卷轴。

items:
  - item_key: grain
    stock: -1
    daily_refresh: true

  - item_key: small_trumpet
