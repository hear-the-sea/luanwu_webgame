# 配置说明：
# - tech_key: 科技标识符
# - levels: 各等级的产出配置
#   - item_key: 物品标识符
#   - quantity: 产出数量
#   - contribution_cost: 兑换所需贡献度
#   - weekly_personal_limit: 每名成员每周兑换上限，省略表示不限购

