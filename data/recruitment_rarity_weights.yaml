total_weight: 1000000

# 招募稀有度全局权重（默认用于无 entries 的核心卡池）。
# 说明：
# - 概率 = weight / total_weight
# - black 不需要配置，系统会自动用剩余权重补齐
# - 正式概率：橙 0.02%、紫 0.08%、蓝 0.3%、绿 1%、隐士 0.05%
# - 灰色保持 9%，红色保持关闭，普通黑色补齐为 89.55%
weights:
  orange: 200
  hermit: 500
  purple: 800
  red: 0
  blue: 3000
  green: 10000
  gray: 90000
