total_weight: 1000000

# 招募稀有度全局权重（默认用于无 entries 的核心卡池）。
# 说明：
# - 概率 = weight / total_weight
# - black 不需要配置，系统会自动用剩余权重补齐
# - 正式概率：橙 0.015%、紫 0.06%、蓝 0.25%、绿 0.7%、隐士 0.03%
# - 灰色 5%，红色保持关闭，普通黑色补齐为 93.945%
weights:
  orange: 150
  hermit: 300
  purple: 600
  red: 0
  blue: 2500
  green: 7000
  gray: 50000
