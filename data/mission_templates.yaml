# ============================================================
# 任务模板配置文件
# ============================================================
# 本文件用于配置游戏中的任务（副本），包括敌方阵容、难度、掉落奖励等
#
# 配置字段说明：
# ============================================================

# missions: 任务列表
#   每个任务包含以下字段：
#
# 【基础信息】
#   - key: 任务唯一标识符（必填，字符串）
#   - name: 任务显示名称（必填，字符串）
#   - description: 任务描述文本（可选，字符串）
#   - battle_type: 战斗类型（可选，默认"task"）
#   - is_defense: 防守任务（可选，默认false，敌方来袭）
#   - daily_limit: 每日挑战次数限制（可选，默认3次，整数）
#   - mission_card_daily_limit: 每日可为本任务使用的任务卡上限（可选，默认5张；0表示禁用）
#   - base_travel_time: 往返基础耗时，单位：秒（可选，默认1800秒=30分钟，整数）
#   - available_weekdays: 开放星期（可选，1=周一 ... 7=周日；不填或空列表表示每日开放）
#
# 【敌方阵容配置】
#   - enemy_guests: 敌方门客列表（可选，支持两种格式）
#       * 格式1（字符串）：直接填入门客模板key（向后兼容）
#         示例：
#           enemy_guests:
#             - special_hero_dugu_qiubai
#             - special_hero_dongfang_bubai
#
#       * 格式2（对象）：可为每个门客单独配置技能
#         示例：
#           enemy_guests:
#             - key: special_hero_sao_di_seng
#               skills:               # 单独配置此门客的技能
#                 - dragon_roar
#             - key: special_hero_dugu_qiubai
#               skills:
#                 - stratagem_burst
#             - special_hero_dongfang_bubai  # 不配置skills则使用模板默认技能
#
#       * 最多3个门客（由 MAX_SQUAD 常量决定）
#       * 不填则无敌方门客
#       * 技能优先级：单独配置 > enemy_technology.guest_skills > 模板初始技能
#
#   - enemy_troops: 敌方护院（小兵）配置（可选，字典）
#       * 格式：{兵种key: 数量}
#       * 可用兵种：dao_ke, dao_jie, dao_sheng (刀系)
#                   qiang_bing, qiang_jiang, qiang_shuai (枪系)
#                   jian_shi, jian_hao, jian_sheng (剑系)
#                   quan_tu, quan_shi, quan_zong (拳系)
#                   gong_shou, archer, gong_sheng (弓系)
#       * 示例：dao_ke: 500 表示 500 个刀客
#
# 【敌方强度配置】
#   - enemy_technology: 敌方科技和加成配置（可选，字典）
#       * 该配置仅影响敌方，不影响玩家
#
#       【护院（小兵）科技配置】
#       - level: 统一科技等级（0-10，整数）
#           * 0级：无科技加成
#           * 每级：+10% 攻防血敏 + 特殊效果
#           * 10级：+100% 攻防血敏 + 满级特殊效果
#           * 特殊效果包括：
#             - 刀系：双倍打击几率（狂狼必杀）
#             - 枪系：反击几率（反戈一击）
#             - 剑系：伤害反弹（护身剑罡）、先攻伤害（驭剑之术）
#             - 拳系：远程防御（万宗归流）、战斗回血（五气朝元）
#             - 弓系：额外先攻伤害（凤舞九天）、近战加成（短刃杀法）
#
#       - levels: 精细化科技配置（可选，字典）
#           * 格式：{科技key: 等级}
#           * 用于单独调整某些科技的等级
#           * 会覆盖 level 的统一配置
#           * 示例：dao_attack: 8  # 刀系攻击科技8级
#
#       【门客强度配置】
#       - guest_level: 敌方门客等级（1-100，整数，可选，默认50）
#           * 仅影响敌方门客，不影响玩家门客
#           * 等级影响门客的基础属性和生命值
#           * 门客带兵上限 = 基础值 + 等级门槛加成 + 装备/套装加成
#           * 推荐配置：
#             - 新手任务：20-40级
#             - 日常任务：40-60级
#             - 主线任务：60-75级
#             - 精英任务：75-90级
#             - 噩梦副本：90-100级
#
#       - guest_bonus: 敌方门客属性加成（0.0-1.0，浮点数，可选）
#           * 仅影响敌方门客，不影响玩家门客
#           * 表示百分比加成，如 0.3 = +30%
#           * 应用于：攻击、防御、生命（100%）、敏捷（50%）
#           * 推荐配置：
#             - 简单任务：0.0 - 0.1 (无加成或+10%)
#             - 普通任务：0.1 - 0.2 (+10% - +20%)
#             - 困难任务：0.2 - 0.4 (+20% - +40%)
#             - 噩梦副本：0.5 - 1.0 (+50% - +100%)
#
#       - guest_skills: 敌方门客临时技能（字符串数组，可选）
#           * ⚠️ 重要：会覆盖门客模板中定义的初始技能
#           * 为所有敌方门客统一赋予指定技能
#           * 可用于：
#             - 为没有技能的门客临时赋予技能
#             - 统一所有BOSS的技能配置
#             - 创造特殊的战斗玩法
#           * 示例：
#             guest_skills:
#               - dragon_roar      # 龙吟破阵（对3个敌人造成伤害）
#               - stratagem_burst  # 奇策突袭（对1个敌人造成伤害并眩晕）
#           * 可用技能列表（定义在 guest_skills.yaml）：
#             - dragon_roar: 龙吟破阵 - 威力260, 对3个敌人
#             - stratagem_burst: 奇策突袭 - 威力220, 对1个敌人, 可眩晕
#           * 注意：如果不配置此字段，门客将使用模板中的初始技能
#
# 【掉落奖励配置】
#   - drop_table: 固定掉落或概率掉落（可选，字典）
#       * 格式：{物品key: 数量/概率/配置}
#       * 数量为整数：表示固定掉落
#         示例：silver: 10000  # 固定掉落 10000 银两
#       * 数量为小数（0.0-1.0）：表示概率掉落
#         示例：book_dragon_roar: 0.5  # 50%概率掉落技能书
#         示例：equip_tiejian: 0.1  # 10%概率掉落铁剑
#       * 字典格式：{chance: 概率, count: 数量} 支持概率+数量组合
#         示例：experience_pineapple: {chance: 0.3, count: 5}
#       * 可用物品类型：
#         - 资源：silver (银两)
#         - 道具：experience_peach (经验桃), buxuedan (补血丹), fangdajing (放大镜)
#         - 技能书：book_dragon_roar (龙吟), book_phoenix_dance (凤舞) 等
#         - 装备：equip_caomao (草帽), equip_buyi (布衣), equip_tiejian (铁剑) 等
#
# ============================================================
# 配置示例
# ============================================================

missions:
  - key: surname_legend_li
    name: 姓氏传说之“李”
    display_order: 1000
    difficulty: advanced
    description: |
      话说商纣王当政时，理氏一族因直言进谏获罪，利贞随母亲四处逃难。母子断粮多日，幸得荒野中一株李树结满甘果，这才保住性命。为报救命之恩，利贞决定改“理”为“李”，谁知新姓氏刚取好，老仇家却追上了门。

      助纣为虐的恶来奉命赶尽杀绝，率领精兵封住去路，连那株救命的李树也不肯放过。附近百姓有心相助，却敌不过他的凶猛重戟，只得向各庄园求援。还请庄园主率领门客击退恶来，护住母子二人，让这段“木子成李”的传说得以流传。
    battle_type: task1
    is_defense: false
    guest_only: false
    enemy_guests:
      - key: task_surname_li_elai
        label: 恶来
    enemy_troops:
      dao_sheng: 800
      qiang_wang: 400
    enemy_technology:
      level: 10
      guest_level: 100
      guest_bonus: 0.25
    entry_cost: {}
    drop_table:
      mission_chest_v3_surname_legend_li: 1
    probability_drop_table: {}
    available_weekdays: []
    base_travel_time: 1800
    daily_limit: 3
    mission_card_daily_limit: 5

  # ========================================
  # 中秋活动：广寒宫试炼
  # ========================================
  - key: mid_autumn_moon_palace_trial
    name: 广寒宫试炼
    difficulty: intermediate
    available_weekdays: [2, 4, 6, 7]
    description: |
      中秋将近，广寒宫外的月桂忽然枝叶疯长，遮蔽月华，连玉兔捣药的石臼也被散落的桂枝掩埋。吴刚日夜挥斧仍无法遏止异变，嫦娥只得向人间庄园主发出月宫请帖。

      受邀者需穿过桂影迷阵，协助玉兔收集药材，并通过吴刚与嫦娥设下的月宫试炼。完成试炼者可带回月饼，也有机会获得三位月宫门客留下的召唤卷轴。
    battle_type: task1
    base_travel_time: 1800

    enemy_guests:
      - key: myth_moon_jade_rabbit
        label: 玉兔
      - key: myth_moon_wu_gang
        label: 吴刚
      - key: hist_xianqin_0413
        label: 嫦娥

    enemy_troops:
      quan_wang: 300
      jian_hao: 300
      divine_archer: 200

    enemy_technology:
      level: 7
      guest_level: 60
      guest_bonus: 0.12

    drop_table:
      silver: 40000
      mission_chest_v3_mid_autumn_moon_palace_trial: 1
    daily_limit: 3

  # ========================================
  # 联名任务：春日部大作战
  # ========================================
  - key: kasukabe_daisakusen
    name: 春日部大作战
    difficulty: intermediate
    available_weekdays: [2, 4, 6, 7]
    description: |
      庄园附近突然出现一支自称“春日部防卫队”的神秘队伍。他们本是追查被妖怪夺走的神奇蜡笔，却不慎把庄园周边画成了临时游乐战场：粮仓墙上长出大象鼻子，演武场地面变成蹦床，护院巡逻路线也被涂鸦迷宫搅得七零八落。

      为了平息这场哭笑不得的混乱，庄主需要进入春日部游乐战场，突破玩具机关、恶作剧陷阱和防卫队试炼，击败被蜡笔力量影响的涂鸦大魔王，回收“小新的蜡笔”。集齐150个蜡笔后，可在仓库中招募紫色武门客「蜡笔小新」。
    battle_type: task1

    enemy_guests:
      - key: task_kasukabe_patrol_captain
        label: 春日部巡逻队长
      - key: task_kasukabe_toy_crocodile
        label: 玩具机关鳄鱼
      - key: task_kasukabe_defense_member
        label: 迷路的防卫队员
      - key: task_kasukabe_crayon_clone
        label: 蜡笔恶作剧分身
      - key: task_kasukabe_doodle_boss
        label: 涂鸦大魔王

    enemy_troops:
      quan_wang: 300
      archer: 300
      dao_ba: 200

    enemy_technology:
      level: 7
      guest_level: 60
      guest_bonus: 0.12

    drop_table:
      silver: 40000
      mission_chest_v3_kasukabe_daisakusen: 1
    daily_limit: 3

