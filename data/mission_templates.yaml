  - key: shier_xianyin
    name: 封神之战：十二仙印
    difficulty: advanced
    description: |
      阵旗重燃后，万仙阵中层忽然降下十二道玉虚仙印。它们不是仙人本尊，却承载着阐教诸仙的法宝、道统与杀伐意志。哪吒杀星开路，杨戬玄功镇身，太乙神火焚阵，广成番天印压断截教气运。凡奉庄园主之命入阵相助截教者，皆被天命识作乱榜异数。

      若十二印合拢，截教残部将被重新压回死局；若仙印破碎，万仙阵中层便会重开，截教败兵也将第一次从逃亡转为反攻。此战不问天命宽恕，只问仙印能否挡住人间兵锋。
