  - key: zhanlong_changban_duanqiao
    name: 战龙在野第三关：长坂桥张飞断水流
    display_order: 1006
    difficulty: advanced
    description: |
      长坂桥前，张飞横矛立马，怒目巡视来路。桥后树林烟尘滚滚，旌旗时隐时现，战马奔踏之声连绵不绝。逃来的散卒惊呼林中伏有百万大军，连追至岸边的曹军也勒马驻足，不敢贸然向前。

      庄园主率门客赶到桥头，尚未来得及通报身份，便被张飞一声断喝拦住。如今败军之中真假难辨，曹军又有乔装混入之嫌，他奉命守桥，绝不肯放来历未明的武装队伍靠近。桥后尚有百姓等待撤离，要取得信任，还须当面试过本领与胆色。

      桥后尘土愈起愈高，林中究竟藏着多少兵马，无人看得分明。眼前那杆丈八蛇矛却已缓缓抬起。此行需消耗一枚「长坂护主令」，请庄园主整顿队伍，迎接张翼德的桥头考验。张飞力猛甲坚、出手迅疾，虎啸龙吟更有震桥之威，生命低于两成后将同时攻击两人。宜由善守的门客接住重矛，辅以眩晕之术打断猛攻；护院则须挡住守桥铁骑，为同伴争取破阵的机会。
