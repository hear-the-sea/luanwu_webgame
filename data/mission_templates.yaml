    description: |
      九峰山因九座山峰得名，山水秀丽，风景如画。山下的九峰村土地肥沃，村民淳朴勤劳，世代耕作，原本过着安稳日子。

      然而，一群土匪打破了村中的宁静。匪首大胖、二胖和小胖原是村中三兄弟，因偷盗庄稼被赶出村后，竟上山聚众为匪。他们怀恨在心，时常下山抢夺粮食牲畜，掳掠村民，闹得四邻不安。

      村民决定合力反抗，请木匠赵牛将平日耕田、拉磨的机关牛改造成守村武器。赵牛日夜赶工，为机关牛装上厚甲与利刃，村长也向各地庄园发出求援信。请庄园主率众迎击三名匪首和麾下喽啰，守住九峰村。
