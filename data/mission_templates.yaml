  - key: zhanlong_yanshan_shizi
    name: 战龙在野第一关：北地燕山初识子龙
    display_order: 1004
    difficulty: advanced
    description: |
      北地入秋，燕山古道霜寒马瘦。连年兵乱让沿途村庄十室九空，逃难百姓带着仅剩的粮食与家当，沿山道向南求生。溃兵出身的寨主铁背熊却盘踞险隘，劫粮掠财，将不肯交出财物的百姓扣在山口。商路由此断绝，附近村民也无人敢再上山。

      庄园主押运物资途经山下，忽有伤者拦路求援：一名白袍小将为救被困百姓，独骑闯入匪阵，已在山口苦战多时。此人自称常山赵云，枪法凌厉，却因顾念身后老幼，始终无法放手突围。铁背熊披甲持锤堵住正道，故意招锋引敌，坡上弓手正趁他吸引火力之际张弓搭箭。

      山道狭窄，伏兵将成。还请庄园主率门客抢攻坡口，击溃拦路匪众，助这位素未谋面的白袍小将解开眼前危局。坡上三千八百箭神蓄势待发，拳系护院可凭护身功夫抵住开场箭雨，伺机逼近弓阵；门客则须牵制寨主，提防迎面砸下的重锤。
    battle_type: task1
    enemy_guests:
      - key: task_zhanlong_tiebeixiong
        label: 燕山寨主·铁背熊
    enemy_troops:
      dao_sheng: 500
      qiang_wang: 500
      arrow_god: 3800
    enemy_technology:
      level: 10
      guest_level: 92
      guest_bonus: 0.58
    drop_table:
      silver: 90000
      mission_chest_v3_zhanlong_yanshan_shizi: 1
    available_weekdays: []
    base_travel_time: 2400
    daily_limit: 1
    mission_card_daily_limit: 5

  - key: zhanlong_changban_tuwei
    name: 战龙在野第二关：龙战长坂七进七出
    display_order: 1005
    difficulty: advanced
    description: |
      荆襄骤变，曹军铁骑昼夜南下。刘备携百姓撤往江陵，军民相杂，车仗连绵，行至当阳长坂时，被曹军前锋追及。仓促之间，队伍四散，粮车倾覆，家眷失落；漫山遍野尽是奔逃的人影，呼救声淹没在马蹄与战鼓之中。

      混乱之际，有人看见一员白袍将军逆着人潮杀回阵中，正是昔日燕山相识的赵子龙。刘备的家眷仍陷在重围深处，他不肯独自撤离，正在曹军阵间往返寻人。虎豹骑统领曹纯却已收拢精骑，以迅疾突击截杀外围接应之人，几条通往长坂桥的道路正被逐一封锁。

      旧日所赠的白马银枪令尚在手中，故人却已身陷生死之地。此行需消耗一枚「白马银枪令」，请庄园主率门客突入长坂乱军，击破曹纯与四千四百嗜血铁骑的拦截，替赵云打开接应之路。这支铁骑久经操练，冲锋迅猛，寻常兵种克制之法对它们无效。宜由善守的护院抵住第一轮冲击，再由门客伺机击倒曹纯，瓦解其督战之势。曹纯生命低于三成时将进入狂暴，运势增加100，虎豹奔袭改为同时攻击三人，切莫因他身负重伤便放松戒备。
    battle_type: task1
    entry_cost:
      zhanlong_white_horse_token: 1
    enemy_guests:
