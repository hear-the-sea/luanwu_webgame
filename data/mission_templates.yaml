  - key: tianpeng_dijiao_2
    name: 天蓬元帅的地窖（第二层）
    difficulty: advanced
    description: |
      天蓬元帅猪八戒在完成了跟随唐僧西天取经的重任后，混得了一个肥得流油的美差——净坛使者。每日不但有吃不完的山珍海味，还有深谙拍马溜须功夫的小妖小仙送上各种宝物，让天蓬元帅高兴之余也苦恼不已，净坛使者那小小的地界，根本放不下这么多东西。这时，天蓬元帅想起了多年前在高老庄存放食物的地窖。

      想到主意的天蓬元帅喜滋滋地驾着装宝大车回到高老庄，却发现地窖内一片狼藉，他最喜欢的菠萝被偷走了一大半。天蓬元帅怒从心头起，恶向胆边生。“呔，哪方小贼，竟敢洗劫本使者的粮仓！”

      这时，一位美貌狐仙扭着腰肢走来，笑道：“八戒哥，您消消气，气坏了身子可不好。对付这等小贼，奴家愿献上妙计。”八戒一见美人便晕头转向，当下将满车宝物及修整地窖的事一并交给了小狐仙。

      小狐仙的目的其实是那满车宝物，可怜八戒一时失了防备，从此那车宝贝和地窖都归了小狐仙所有。小狐仙一时间没有地方存放宝贝，于是将地窖扩建成好几层，并在各处委派了法力高强的妖仙好友把守。

      消息不胫而走，各庄园主在尝过了菠萝的甜头后，将目光投向了小狐仙的藏宝库。小狐仙，等着接招吧……
    battle_type: task1

