      苏州首富杜万年之女杜莞尔芳龄二八，登门求亲者络绎不绝。杜老爷既不想得罪朝廷中人，也不愿把女儿嫁给草莽之士，于是想出一招比武招亲。奇就奇在代杜千金出战的并非真人，而是一只机关熊。此熊周身关节灵活，体内机关重重，力大无穷。比武当天，众人接连败阵，最终竟由穷小子管无介拔得头筹。原来小姐早已对他芳心暗许，只因父亲拘泥于门第，才迟迟不能成婚。管无介在众人帮助下得到铸熊大师珍藏的图纸，找准机关熊的要害，一击制胜。杜老爷当着众人的面无法食言，只得将女儿许配给他，一对有情人终成眷属。
