  - key: zhanlong_wuhu_shizhen
    name: 战龙在野第四关：谁人德行服赵云
    display_order: 1007
    difficulty: advanced
    description: |
      自长坂一别，岁月流转，蜀中五虎如今已齐聚军前。庄园主昔日在燕山护民、长坂接应的经历，经赵云举荐传入刘备耳中。一封演武邀书送到庄园，邀众门客入营会武，也请庄园主当面谈一谈乱世之中如何待人、如何用人。

      演武场上，关羽按刀镇住阵脚，张飞持矛蓄势，赵云银枪穿阵，马超策马游走，黄忠在后方搭箭观阵。五人各有所长，彼此照应：重刀可破甲，蛇矛能聚力，银枪横扫三人、专击负伤之敌，快马压迫全阵，强弓专寻伤处。赵云虽是旧识，今日仍将亲自入阵，检验庄园门客的武艺与庄园主的临阵取舍。

      仁义之名须见诸行事，举荐之情也须以本领相承。此行需消耗一封「当阳义勇书」，请庄园主率众赴约，在五虎合阵之前展现庄园的担当。
