  - key: zhuiji_manzu
    name: 追击蛮族
    difficulty: advanced
    description: |
      蛮族南下之际，蒲巴乙为救中原百姓，偷偷逃出军营，一路向南报信。他日夜兼程，连坐骑都累死在了途中，终于在七天七夜后赶到庄园。各地庄主得知敌军将至，立即停下彼此间的争斗，联手布置伏兵，要给大胡子单于来个“瓮中捉鳖”。

      很快，蛮族军队开始攻城略地，沿途只遇到零星抵抗。轻易得来的胜利让他们渐渐放松了戒备，大胡子单于甚至开始幻想在关内放牧的情景，浑然不知自己正一步步走进庄主们布下的罗网。

      一天夜里，庄主们趁敌军松懈，率兵突袭军营。守军猝不及防，转眼溃不成军，大胡子单于也带着残兵仓皇北逃。如今敌军阵脚未稳，正是乘胜追击的时机。请庄园主率军截住他们的退路，扫清边境的后患。
