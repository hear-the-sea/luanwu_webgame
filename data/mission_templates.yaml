  - key: simian_chuge
    name: 四面楚歌
    difficulty: advanced
    description: |
      楚汉相争时期，项羽、刘邦于荥阳、成皋相持两年多。项羽因腹背受敌，粮尽援绝，被迫与刘邦订立和约，以鸿沟为界，东归楚、西属汉。次年，刘邦、韩信、刘贾、彭越、英布等各路汉军约计40万人与10万楚军于垓下展开决战。汉军以韩信率军居中，将军孔熙为左翼、陈贺为右翼，刘邦率部跟进，将军周勃断后。韩信挥军进攻失利，引兵后退，命左、右翼军继续攻击。楚军迎战不利，韩信再挥军反击。楚军大败，退入壁垒坚守，被汉军重重包围。楚军屡战不胜，兵疲食尽。

      张良又命围困项羽的各营兵士吹奏楚乐，楚兵闻之，顿时涌起思乡之情，军心涣散。项羽疑心汉军已尽占楚地，与虞姬对饮帐中，慷慨悲歌，虞姬随声相和，帐中将士无不落泪。诀别之后，项羽跨上乌骓，率八百骑突围而去，至乌江时身边仅余二十六人。楚军危在旦夕，庄园主可愿发兵相助，为他们争得一线生机？
