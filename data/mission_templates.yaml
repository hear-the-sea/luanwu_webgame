    difficulty: advanced
    description: |
      北方的蛮族首领大胡子单于觊觎中原的土地已久，如今终于集结大军，挥师南下。一场战乱即将席卷而来，中原的庄主们却还浑然不知。军中有个名叫蒲巴乙的小伙子，父亲是胡人，母亲是汉人，平日只想安稳度日，却被强征入伍，在军营中干起了杂活。

      话说那日，他为参加“村有好男儿”的比赛，正在山坡上练歌，刚唱了一句就被人一棍打晕。醒来时，他和村里的许多壮丁已经身在军营。想到中原百姓即将遭受兵灾，他再也坐不住了，决心赶去报信，让庄主们早作准备。于是，他偷了一匹马，趁着夜色逃出军营，向中原疾驰而去。
