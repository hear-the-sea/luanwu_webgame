  # ========================================
  # 虎牢关群英战吕布：第三关
  # ========================================
  - key: baimenlou_mingyun_jueze
    name: 飞将浮沉录·第三关：白门楼命运抉择
    display_order: 1003
    difficulty: advanced
    description: |
      虎牢关战旗染血之后，曹军围住下邳，白门楼成了吕布最后的落脚处。高顺在整军，张辽在寻找退路，陈宫在推演一条不必投降的路，臧霸守着最后的旧部；而吕布仍相信，只要再给他一次冲阵的机会，天下就还没有真正决定谁会输。

      然而江湖传闻，白门楼风声最紧时，总有一张没有落款的招贤帖在暗中流转。若它最终落到有缘人手中，史书上那句“吕布死于白门楼”未必还能照抄，城楼之下或许会多出一位改旗易帜的绝世猛将；只是新东家能不能压住他的脾气，就要看庄园主自己的本事了。

      进入此关需要消耗一面「虎牢关战旗」。庄园主须击破吕布、高顺、张辽、陈宫与臧霸的合围，替这段乱世故事写下最后一笔。无论结局如何，碎裂的白门楼命印都会记住：有人留在城楼，有人换了一面旗，带着方天画戟走向另一段江湖。
    battle_type: task1
    entry_cost:
      hulao_war_banner: 1

    enemy_guests:
