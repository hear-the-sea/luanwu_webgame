  # ========================================
  # 华山论剑
  # ========================================
  - key: huashan_lunjian_advanced
    name: 华山论剑
    display_order: 1000
    difficulty: advanced
    description: |
      天下风云出我辈，一入江湖岁月催。皇图霸业谈笑中，不胜人生一场醉。

      一张没有落款的论剑帖，自华山传入江湖。有人说，发帖之人要在绝顶重排天下高手座次；有人说，山巅藏着一坛开封即能忘忧的陈年好酒；还有人信誓旦旦地表示，自己只是路过，绝不是专程来抢宝箱的。消息传开后，闭关的出关了，隐姓埋名的改回本名了，连多年不肯下山的老前辈也开始认真挑选登山鞋。

      华山绝顶，九位高手已联袂摆下论剑之阵。扫地僧守心，张三丰守意，独孤求败守剑，东方不败守影；石破天、黄裳、阿青、逍遥子与王重阳也已在峰顶等候。这里没有客套寒暄，也没有凭年龄论资排辈，想在江湖留下名字，便把手中兵刃亮出来说话。

      此战只许门客登场。庄园主若能胜过九位高手，便可赢得封存已久的武林宝箱。至于箱中是震动江湖的神兵奇珍，还是某位醉仙留下的压箱底玩意儿，只有最后站着的人，才有资格亲手打开。
    battle_type: task1
    guest_only: true

    enemy_guests:
      - key: hero_sao_di_seng
        label: 扫地僧
        skills:
          - iron_wall_heart
