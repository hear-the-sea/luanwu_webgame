      传说“洞天福地”位于西部大雪山之巅，当年丘真人携唯一的弟子在此闭关修炼，洞内集日月精华，奇珍异宝不计其数。百年后一场雪崩覆盖了洞口，道家秘籍与记载炼丹点金之术的典籍也遭雪掩埋，从此不传于世。多年后各大门派竞相寻找此地，盼能寻得求仙的捷径。然而洞内机关重重、关卡玄妙，至今闯入禁区者无人生还。要想寻找财富，除了勇气，还需过人的智慧和强健的体魄才行。
