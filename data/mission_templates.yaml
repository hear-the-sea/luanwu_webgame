        wolf_force: 10
        wolf_defense: 10
        wolf_hp: 10
        wolf_agility: 10
        wolf_berserk: 5
      guest_level: 96
      guest_bonus: 0.66
    drop_table:
      silver: 110000
      mission_chest_v3_zhanlong_changban_tuwei: 1
