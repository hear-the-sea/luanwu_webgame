  - key: guild_personal_yanziwu_secret_letter
    name: 沉香劈山救母
    display_order: 1303
    difficulty: advanced
    description: |
      三圣母因与凡人相爱，被二郎神压在华山之下。沉香长大后得知身世，历经艰险，终于持斧来到山前。山腹深处，母亲的声音依稀可闻；山门之外，守山之阵尚未松动。

      梅山守将披甲当关，哮天犬踏石扑来，二郎神持三尖两刃刀立于高处。帮会愿为这场救母之行出一份力，请你带门客迎战守军，为沉香争得劈山的一刻，让母子终能相见。
    battle_type: task1
    guest_only: true
    enemy_guests:
      - key: task_legend_meishan_guard
        label: 梅山守将
        skills: [iron_wall_heart, draw_enemy_blades]
      - key: task_legend_celestial_hound
