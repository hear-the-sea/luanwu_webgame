# 赛季创建时保存本配置快照；修改不会影响已经开始的赛季。
max_guests: 3
summon_pick_count: 3
daily_actions: 6
weekly_pve_cap: 30
weekly_pvp_cap: 70
pvp_daily_same_opponent: 1

# 阵营依据明确的角色数据来源分类；不根据姓名或人物简介猜测。
# 历史来源同 key 优先。神话、修仙、原创和基础乡民不进入候选名单。
roster:
  history_pattern: history_*.yaml
  fiction_files:
    - jinyong.yaml
    - gulong.yaml
    - gulong_ilrock_01.yaml
    - liangyshen.yaml
    - wenruian.yaml
    - huangyi.yaml
    - huangyi_ilrock_01.yaml
    - suitang.yaml
    - shuihu.yaml
    - sanguoyanyi.yaml
    - kunlun.yaml
    - fengyun.yaml

rewards:
  - key: first_merit
    name: 初露锋芒
    threshold: 100
    kind: items
    description: 阵营兵器一件，奖励绑定。
    items:
      fiction: {equip_qingmangjian: 1}
      history: {equip_duanmajian: 1}
  - key: practiced_merit
    name: 百战精进
    threshold: 500
    kind: items
    description: 阵营技法秘术一本，奖励绑定。
    items:
      fiction: {book_fatal_chain_sword: 1}
      history: {book_draw_enemy_blades: 1}
  - key: veteran_merit
    name: 名动一方
    threshold: 1200
    kind: items
    description: 蓝色阵营兵器一件，奖励绑定。
    items:
      fiction: {equip_junzijian: 1}
      history: {equip_xiaoweichangjian: 1}
  - key: summon_scroll
    name: 阵营结缘卷轴
    threshold: 3000
    kind: scroll
    description: 从本阵营未拥有的可招募人物中自选三名，等概率结缘其中一名；不足三名时按剩余人数选择。
    items: {}

shop:
  fiction:
    - key: fiction_heart
      name: 铁壁心法
      cost: 150
      limit: 3
      description: 《铁壁心法》秘术一本，奖励绑定。
      items: {book_iron_wall_heart: 1}
    - key: fiction_helmet
      name: 江湖行装
      cost: 300
      limit: 2
      description: 蓝色飞羽盔一件，奖励绑定。
      items: {equip_feiyukui: 1}
    - key: fiction_sword
      name: 紫薇软剑
      cost: 500
      limit: 2
      description: 紫色紫薇软剑一件，奖励绑定。
      items: {equip_ziweiruanjian: 1}
  history:
    - key: history_planning
      name: 静水筹谋
      cost: 150
      limit: 3
      description: 《静水筹谋》秘术一本，奖励绑定。
      items: {book_steadfast_planning: 1}
    - key: history_helmet
      name: 校尉行装
      cost: 300
      limit: 2
      description: 蓝色校尉头盔一件，奖励绑定。
      items: {equip_xiaoweitoukui: 1}
    - key: history_overlord
      name: 霸王盔
      cost: 500
      limit: 2
      description: 紫色霸王盔一件，奖励绑定。
      items: {equip_bawangkui: 1}

# 本阵营所有正常可招募人物均已拥有时，卷轴可兑换以下绑定材料。
summon_fallback_items:
  xuan_tie_essence: 20
  experience_fruit: 20
