# 赛季创建时保存本配置快照；修改不会影响已经开始的赛季。
max_guests: 3
summon_pick_count: 3
daily_actions: 6
weekly_pve_cap: 30
weekly_pvp_cap: 70
pvp_daily_same_opponent: 1

# 阵营依据明确的角色数据来源分类；不根据姓名或人物简介猜测。
# 历史来源同 key 优先。神话、修仙、原创和基础乡民不进入候选名单。
roster:
  history_pattern: history_*.yaml
  fiction_files:
    - jinyong.yaml
    - gulong.yaml
    - gulong_ilrock_01.yaml
    - liangyshen.yaml
    - wenruian.yaml
    - huangyi.yaml
    - huangyi_ilrock_01.yaml
    - suitang.yaml
    - shuihu.yaml
    - sanguoyanyi.yaml
    - kunlun.yaml
    - fengyun.yaml

rewards:
  - key: first_merit
    name: 初露锋芒
    threshold: 100
    kind: items
    description: 阵营兵器一件，奖励绑定。
    items:
      fiction: {equip_qingmangjian: 1}
      history: {equip_duanmajian: 1}
  - key: practiced_merit
    name: 百战精进
    threshold: 500
    kind: items
    description: 阵营技法秘术一本，奖励绑定。
    items:
      fiction: {book_fatal_chain_sword: 1}
      history: {book_draw_enemy_blades: 1}
  - key: veteran_merit
    name: 名动一方
    threshold: 1200
    kind: items
    description: 蓝色阵营兵器一件，奖励绑定。
    items:
      fiction: {equip_junzijian: 1}
      history: {equip_xiaoweichangjian: 1}
  - key: summon_scroll
    name: 阵营结缘卷轴
    threshold: 3000
    kind: scroll
    description: 从本阵营未拥有的可招募人物中自选三名，等概率结缘其中一名；不足三名时按剩余人数选择。
    items: {}
  - key: veteran_4500
    name: 久战不怠
    threshold: 4500
    kind: items
    description: 经验果与玄铁精华，奖励绑定。
    items:
      fiction: {experience_fruit: 10, xuan_tie_essence: 8}
      history: {experience_fruit: 10, xuan_tie_essence: 8}
  - key: veteran_6000
    name: 百炼成钢
    threshold: 6000
    kind: items
    description: 经验果与玄铁精华，奖励绑定。
    items:
      fiction: {experience_fruit: 15, xuan_tie_essence: 10}
      history: {experience_fruit: 15, xuan_tie_essence: 10}
  - key: veteran_8000
    name: 赛季骁将
    threshold: 8000
    kind: items
    description: 经验果与玄铁精华，奖励绑定。
    items:
      fiction: {experience_fruit: 20, xuan_tie_essence: 15}
      history: {experience_fruit: 20, xuan_tie_essence: 15}
  - key: veteran_10000
    name: 阵营柱石
    threshold: 10000
    kind: items
    description: 经验果与玄铁精华，奖励绑定。
    items:
      fiction: {experience_fruit: 30, xuan_tie_essence: 20}
      history: {experience_fruit: 30, xuan_tie_essence: 20}

shop:
