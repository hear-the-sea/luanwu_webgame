missions:
  - key: guild_patrol_alpha
    name: 夜袭乌鳞寨
    description: |
      近来北郊商道一入子夜便灯火尽灭，往返车队不是失了骡马，便是天明后只剩翻倒车辙。帮中弟子顺着断箭、碎缰和半截焦木一路摸到山坳，才看见乌鳞寨早把谷口修成了连环哨卡，拒马、暗哨与巡夜火把一层压着一层。

      寨中人白日敛迹，夜里却轮番下山掠货，惯会先放小股人手引人追击，再借山路弯口突然合围。若想把这条商线重新打通，不能只顾着往前压，还得有人盯住两翼伏兵，免得主力刚进谷口，退路便先被人摸黑截断。
    difficulty: junior
    task_type: troop
    base_duration_seconds: 1500
    ruby_reward: 96
    recommended_guest_count: 10
    allow_troops: true
    enemy_guests:
      - template_key: guild_wulinzhai_zhai_zhu
