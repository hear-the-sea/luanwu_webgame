      fast_archer: 600
      dao_jie: 450
    enemy_technology:
      level: 6
      guest_level: 82
      guest_bonus: 0.24
    is_active: true
    sort_weight: 10

  - key: guild_supply_escort
    name: 血旗镖局风云
    description: |
      血旗镖局表面替各路商号押送金银药材，暗地里却替人收账、截货、买命，沿河几个渡口最近都挂上了他们的旗。凡是不肯交路银的商队，不是半夜改道，就是第二天只剩散落河滩的箱板和染血车帘，连船家都开始装聋作哑，不敢多问一句。

      探子送回的消息说，这支人马不像寻常匪帮，各车之间号令极严，前阵短弓压路，中段刀枪护箱，尾队还留着专门断后的老手。真打起来，他们未必急着和你硬换，只会边退边拖，把人一步步拽进最窄最乱的那段河道。
    difficulty: intermediate
    task_type: troop
    base_duration_seconds: 2100
    ruby_reward: 168
    recommended_guest_count: 14
