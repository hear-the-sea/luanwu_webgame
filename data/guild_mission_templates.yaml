  - key: guild_blackwind_assault
    name: 黑风关总攻
    description: |
      黑风关原是旧时军镇咽喉，多年废弃后反被各路亡命和旧军头子修成了铁桶。关前壕沟是新翻的，拒马、滚木和石垒顺着山口一层层铺开，城头昼夜轮火不熄；前几次探路的人才看见墙影里箭光一闪，山道上就已经响起调兵铜哨。

      更麻烦的是，关内粮械齐备，轮守之人熟悉军阵，能把外墙、甬道和内寨连成一口气。若真要把黑风关从地图上抹去，便不是冲开一道门那么简单，而是要顶着连番反扑一路杀到关楼，把还在运转的整座堡寨硬生生拆开。
    difficulty: advanced
    task_type: troop
